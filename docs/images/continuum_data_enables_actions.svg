<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Advanced Gradients -->
    <linearGradient id="premiumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764BA2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F093FB;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="dataCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD93D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="qualityGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FACFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F2FE;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="frictionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#43E97B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38F9D7;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="lightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E9ECEF;stop-opacity:1" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrowEnd" markerWidth="15" markerHeight="12" refX="14" refY="6" orient="auto">
      <polygon points="0,0 15,6 0,12" fill="#FFD93D"/>
    </marker>

    <marker id="arrowGreen" markerWidth="15" markerHeight="12" refX="14" refY="6" orient="auto">
      <polygon points="0,0 15,6 0,12" fill="#43E97B"/>
    </marker>

    <marker id="arrowBlue" markerWidth="15" markerHeight="12" refX="14" refY="6" orient="auto">
      <polygon points="0,0 15,6 0,12" fill="#4FACFE"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1000" fill="url(#lightBg)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#DEE2E6" stroke-width="1" opacity="0.5"/>
  </pattern>
  <rect width="1400" height="1000" fill="url(#grid)"/>

  <!-- Title Section -->
  <g id="title">
    <rect x="200" y="30" width="1000" height="100" fill="url(#premiumGrad)" rx="20" filter="url(#shadow)"/>
    <text x="700" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1">The Purpose of Data is to Enable Better Actions</text>
    <text x="700" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" stroke="#495057" stroke-width="0.5">Transforming Information into Competitive Advantage</text>
  </g>

  <!-- Central Data Engine -->
  <g id="data-engine" transform="translate(700, 350)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#premiumGrad)" stroke-width="4" opacity="0.5" stroke-dasharray="10,5">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
    </circle>

    <!-- Middle ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#FFD93D" stroke-width="2" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="20s" repeatCount="indefinite"/>
    </circle>

    <!-- Core -->
    <circle cx="0" cy="0" r="60" fill="url(#dataCore)" filter="url(#glow)"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1">DATA</text>
  </g>

  <!-- Left Branch: Higher Quality Actions -->
  <g id="quality-branch">
    <!-- Main container -->
    <rect x="80" y="500" width="500" height="200" fill="url(#qualityGrad)" rx="15" opacity="0.9" filter="url(#shadow)"/>

    <text x="330" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2C3E50">1. Higher Quality Actions</text>

    <!-- Sub-components -->
    <g id="quality-details" transform="translate(100, 560)">
      <!-- Predictive -->
      <rect x="0" y="0" width="140" height="50" fill="#FFFFFF" rx="8" opacity="0.2"/>
      <text x="70" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C3E50">Predictive</text>
      <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#495057">Forecast outcomes</text>

      <!-- Prescriptive -->
      <rect x="150" y="0" width="140" height="50" fill="#FFFFFF" rx="8" opacity="0.2"/>
      <text x="220" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C3E50">Prescriptive</text>
      <text x="220" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#495057">Recommend actions</text>

      <!-- Adaptive -->
      <rect x="300" y="0" width="140" height="50" fill="#FFFFFF" rx="8" opacity="0.2"/>
      <text x="370" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C3E50">Adaptive</text>
      <text x="370" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#495057">Learn &amp; improve</text>
    </g>

    <!-- Examples -->
    <text x="100" y="650" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50" font-weight="bold">✓ Risk reduction by 40%</text>
    <text x="100" y="670" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50" font-weight="bold">✓ Decision speed increased 3x</text>
    <text x="300" y="650" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50" font-weight="bold">✓ Accuracy improved 60%</text>
    <text x="300" y="670" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50" font-weight="bold">✓ Customer satisfaction +25%</text>
  </g>

  <!-- Right Branch: Less Friction -->
  <g id="friction-branch">
    <!-- Main container -->
    <rect x="820" y="500" width="500" height="200" fill="url(#frictionGrad)" rx="15" opacity="0.9" filter="url(#shadow)"/>

    <text x="1070" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2C3E50">2. Same Action, Less Friction</text>

    <!-- Sub-components -->
    <g id="friction-details" transform="translate(840, 560)">
      <!-- Automation -->
      <rect x="0" y="0" width="140" height="50" fill="#FFFFFF" rx="8" opacity="0.2"/>
      <text x="70" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C3E50">Automation</text>
      <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#495057">Zero-touch processes</text>

      <!-- Integration -->
      <rect x="150" y="0" width="140" height="50" fill="#FFFFFF" rx="8" opacity="0.2"/>
      <text x="220" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C3E50">Integration</text>
      <text x="220" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#495057">Seamless workflows</text>

      <!-- Optimization -->
      <rect x="300" y="0" width="140" height="50" fill="#FFFFFF" rx="8" opacity="0.2"/>
      <text x="370" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C3E50">Optimization</text>
      <text x="370" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#495057">Resource efficiency</text>
    </g>

    <!-- Examples -->
    <text x="840" y="650" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50" font-weight="bold">✓ Processing time -70%</text>
    <text x="840" y="670" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50" font-weight="bold">✓ Manual tasks eliminated</text>
    <text x="1040" y="650" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50" font-weight="bold">✓ Cost reduction 50%</text>
    <text x="1040" y="670" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50" font-weight="bold">✓ Error rate near zero</text>
  </g>

  <!-- Connection Flows -->
  <path d="M 640 380 Q 400 440 330 500" stroke="#4FACFE" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)" opacity="0.8"/>
  <path d="M 760 380 Q 950 440 1070 500" stroke="#43E97B" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)" opacity="0.8"/>

  <!-- Top Input Sources -->
  <g id="inputs" transform="translate(700, 200)">
    <!-- Internal Data -->
    <rect x="-350" y="0" width="160" height="60" fill="#E3F2FD" stroke="#4FACFE" stroke-width="2" rx="10"/>
    <text x="-270" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0D47A1">Internal Data</text>
    <text x="-270" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">Operations, Sales, HR</text>

    <!-- External Data -->
    <g transform="translate(0, -30)">
      <rect x="-80" y="0" width="160" height="60" fill="#FFFBF0" stroke="#FFD93D" stroke-width="2" rx="10"/>
      <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B6914">External Data</text>
      <text x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">Market, Social, IoT</text>
    </g>

    <!-- AI/ML Models -->
    <rect x="190" y="0" width="160" height="60" fill="#E8F5E8" stroke="#43E97B" stroke-width="2" rx="10"/>
    <text x="270" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1B5E20">AI/ML Models</text>
    <text x="270" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">Predictions, Patterns</text>

    <!-- Arrows to center -->
    <path d="M -270 60 L -40 100" stroke="#4FACFE" stroke-width="2" marker-end="url(#arrowBlue)" opacity="0.8"/>
    <path d="M 0 30 L 0 90" stroke="#FFD93D" stroke-width="2" marker-end="url(#arrowEnd)" opacity="0.8"/>
    <path d="M 270 60 L 40 100" stroke="#43E97B" stroke-width="2" marker-end="url(#arrowGreen)" opacity="0.8"/>
  </g>

  <!-- Bottom: Outcomes -->
  <g id="outcomes">
    <rect x="200" y="750" width="1000" height="120" fill="#FFFFFF" stroke="url(#premiumGrad)" stroke-width="3" rx="15" opacity="0.95"/>

    <text x="700" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">Universal Impact Across Sectors</text>

    <g transform="translate(250, 800)">
      <!-- Discovery & Innovation -->
      <rect x="0" y="0" width="200" height="50" fill="#FFF3CD" stroke="#FFD93D" stroke-width="2" rx="8"/>
      <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#856404">Discovery &amp; Innovation</text>
      <text x="100" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">3x Faster</text>

      <!-- Resource Efficiency -->
      <rect x="220" y="0" width="200" height="50" fill="#D1ECF1" stroke="#43E97B" stroke-width="2" rx="8"/>
      <text x="320" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0C5460">Resource Efficiency</text>
      <text x="320" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">- 50% Waste</text>

      <!-- Decision Accuracy -->
      <rect x="440" y="0" width="200" height="50" fill="#CCE5FF" stroke="#4FACFE" stroke-width="2" rx="8"/>
      <text x="540" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#003D82">Decision Accuracy</text>
      <text x="540" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">+ 70%</text>

      <!-- Quality of Outcomes -->
      <rect x="660" y="0" width="200" height="50" fill="#F8D7DA" stroke="#F093FB" stroke-width="2" rx="8"/>
      <text x="760" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#721C24">Quality of Outcomes</text>
      <text x="760" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">+ 60%</text>
    </g>
  </g>

</svg>