<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="670" viewBox="0 0 1200 670" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 메인 흐름 그라데이션 -->
    <linearGradient id="mainFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4299E1;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9F7AEA;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#ED64A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F56565;stop-opacity:1" />
    </linearGradient>
    
    <!-- 시대별 카드 그라데이션 -->
    <linearGradient id="era1990Card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4299E1;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#63B3ED;stop-opacity:0.7" />
    </linearGradient>
    
    <linearGradient id="era2000Card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.7" />
    </linearGradient>
    
    <linearGradient id="era2010Card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9F7AEA;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#B794F6;stop-opacity:0.7" />
    </linearGradient>
    
    <linearGradient id="era2020Card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ED64A6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#F56565;stop-opacity:0.7" />
    </linearGradient>

    <!-- 쿼토 혁신 그라데이션 -->
    <linearGradient id="quartoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD23F;stop-opacity:1" />
    </linearGradient>
    
    <!-- 3대 축 배경 -->
    <linearGradient id="foundationGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EDF2F7;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#E2E8F0;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#EDF2F7;stop-opacity:0.8" />
    </linearGradient>

    <!-- 발광 효과 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 화살표 마커 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF6B35" />
    </marker>
    
    <marker id="whiteArrow" viewBox="0 0 10 10" refX="9" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#444141" />
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="750" fill="#FAFAFA"/>
  
  <!-- 제목 배경 장식 -->
  <rect x="0" y="0" width="1200" height="80" fill="url(#foundationGrad)" opacity="0.3"/>
  
  <!-- 3대 축 기반 (하단) -->
  <g id="foundation" transform="translate(0, -50)">
    <rect x="50" y="500" width="1100" height="200" rx="15" fill="url(#foundationGrad)" stroke="#CBD5E0" stroke-width="2"/>
    <text x="600" y="530" font-family="Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="bold" 
          text-anchor="middle" fill="#2D3748">2024년 과학기술 커뮤니케이션 3대 축</text>
    
    <!-- 접근성 (1990년대 계승) -->
    <g id="accessibility" transform="translate(0,0)">
      <!-- 육각형 배경 -->
      <polygon points="190,570 220,555 280,555 310,570 280,615 220,615" fill="#4299E1" opacity="0.95" stroke="white" stroke-width="4"/>
      <!-- 아이콘 -->
      <circle cx="250" cy="570" r="8" fill="none" stroke="white" stroke-width="3"/>
      <path d="M242,570 L258,570 M250,562 L250,578" stroke="white" stroke-width="3"/>
      
      <!-- 제목과 설명을 육각형 밖으로 -->
      <text x="250" y="645" font-family="Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="bold" 
            text-anchor="middle" fill="#4299E1">접근성</text>
      <text x="250" y="665" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" 
            text-anchor="middle" fill="#2D3748">페이월 없는 지식의 흐름</text>
      <text x="250" y="680" font-family="Noto Sans KR, Arial, sans-serif" font-size="10" 
            text-anchor="middle" fill="#4A5568">Diamond Open Access</text>
    </g>
    
    <!-- 상호작용성 (2000년대 계승) -->
    <g id="interactivity">
      <!-- 육각형 배경 -->
      <polygon points="540,570 570,555 630,555 660,570 630,615 570,615" fill="#667EEA" opacity="0.95" stroke="white" stroke-width="4"/>
      <!-- 아이콘 -->
      <circle cx="590" cy="575" r="6" fill="none" stroke="white" stroke-width="2"/>
      <circle cx="610" cy="575" r="6" fill="none" stroke="white" stroke-width="2"/>
      <line x1="596" y1="581" x2="604" y2="581" stroke="white" stroke-width="2"/>
      
      <!-- 제목과 설명을 육각형 밖으로 -->
      <text x="600" y="645" font-family="Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="bold" 
            text-anchor="middle" fill="#667EEA">상호작용성</text>
      <text x="600" y="665" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" 
            text-anchor="middle" fill="#2D3748">독자가 참여하는 살아있는 연구</text>
      <text x="600" y="680" font-family="Noto Sans KR, Arial, sans-serif" font-size="10" 
            text-anchor="middle" fill="#4A5568">실시간 피어 리뷰</text>
    </g>
    
    <!-- 재현가능성 (2020년대 계승) -->
    <g id="reproducibility">
      <!-- 육각형 배경 -->
      <polygon points="890,570 920,555 980,555 1010,570 980,615 920,615" fill="#ED64A6" opacity="0.95" stroke="white" stroke-width="4"/>
      <!-- 아이콘 -->
      <rect x="940" y="565" width="20" height="20" rx="3" fill="none" stroke="white" stroke-width="2"/>
      <line x1="945" y1="570" x2="955" y2="570" stroke="white" stroke-width="1"/>
      <line x1="945" y1="575" x2="965" y2="575" stroke="white" stroke-width="1"/>
      <line x1="945" y1="580" x2="960" y2="580" stroke="white" stroke-width="1"/>
      
      <!-- 제목과 설명을 육각형 밖으로 -->
      <text x="950" y="645" font-family="Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="bold" 
            text-anchor="middle" fill="#ED64A6">재현가능성</text>
      <text x="950" y="665" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" 
            text-anchor="middle" fill="#2D3748">코드·데이터·텍스트 완벽 통합</text>
      <text x="950" y="680" font-family="Noto Sans KR, Arial, sans-serif" font-size="10" 
            text-anchor="middle" fill="#4A5568">Document as Code</text>
    </g>
  </g>

  <!-- 메인 플로우 라인 -->
  <path d="M 120 200 Q 300 180 480 200 Q 660 220 840 200 Q 960 180 1080 200" 
        stroke="url(#mainFlow)" stroke-width="8" fill="none"/>

  <g transform="translate(0, 0)">
      <!-- 1990년대: HTML 혁명 -->
      <g id="era1990s" transform="translate(0, -100)">
            <rect x="50" y="120" width="200" height="160" rx="15" fill="url(#era1990Card)" 
                  stroke="#4299E1" stroke-width="3"/>
            
            <!-- HTML 아이콘 -->
            <rect x="170" y="140" width="50" height="35" rx="5" fill="none" stroke="white" stroke-width="3"/>
            <text x="195" y="162" font-family="monospace, Courier" font-size="14" font-weight="bold" 
                  text-anchor="middle" fill="white">HTML</text>
            
            <text x="150" y="195" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="bold" 
                  text-anchor="middle" fill="white">HTML 혁명</text>
            <text x="150" y="215" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" 
                  text-anchor="middle" fill="#E2E8F0">하이퍼링크로 지식 연결</text>
            
            <!-- 기술 스택 -->
            <text x="150" y="240" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="bold"
                  text-anchor="middle" fill="#000000">정적 HTML</text>
            <text x="150" y="255" font-family="Noto Sans KR, Arial, sans-serif" font-size="12"
                  text-anchor="middle" fill="#E2E8F0">팀 버너스-리 • CERN</text>
            
      </g>
      <!-- 연도 표시 -->
      <circle cx="120" cy="200" r="15" fill="#4299E1"/>
      <text x="120" y="206" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="bold" 
            text-anchor="middle" fill="white">90s</text>
      <!-- 기반 연결선 강화 -->
      <path d="M 120 210 Q 180 400 220 520" stroke="#4299E1" stroke-width="4" fill="none" opacity="0.8"/>
      <circle cx="220" cy="520" r="4" fill="#4299E1" opacity="0.8"/>

      <!-- 2000년대: 블로그 혁명 -->
      <g id="era2000s"  transform="translate(0, -100)">
            <rect x="300" y="120" width="200" height="160" rx="15" fill="url(#era2000Card)" 
                  stroke="#667EEA" stroke-width="3"/>
            
            
            <!-- 블로그 아이콘 -->
            <rect x="420" y="140" width="50" height="40" rx="8" fill="none" stroke="white" stroke-width="3"/>
            <line x1="430" y1="150" x2="460" y2="150" stroke="white" stroke-width="2"/>
            <line x1="430" y1="158" x2="455" y2="158" stroke="white" stroke-width="2"/>
            <line x1="430" y1="166" x2="460" y2="166" stroke="white" stroke-width="2"/>
            <line x1="430" y1="174" x2="450" y2="174" stroke="white" stroke-width="2"/>
            
            <text x="400" y="195" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="bold" 
                  text-anchor="middle" fill="white">블로그 혁명</text>
            <text x="400" y="215" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" 
                  text-anchor="middle" fill="#E2E8F0">개인이 출판사가 되다</text>
            
            <!-- 기술 스택 -->
            <text x="400" y="240" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="bold"
                  text-anchor="middle" fill="#000000">동적 CMS</text>
            <text x="400" y="255" font-family="Noto Sans KR, Arial, sans-serif" font-size="12"
                  text-anchor="middle" fill="#E2E8F0">WordPress • 네이버블로그</text>
            
      </g>
      <!-- 연도 표시 -->
      <circle cx="370" cy="200" r="15" fill="#667EEA"/>
      <text x="370" y="206" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="bold" 
            text-anchor="middle" fill="white">00s</text>
      <!-- 기반 연결선 강화 -->
      <path d="M 370 210 Q 450 400 570 520" stroke="#667EEA" stroke-width="4" fill="none" opacity="0.8"/>
      <circle cx="570" cy="520" r="4" fill="#667EEA" opacity="0.8"/>

      <!-- 2010년대: 소셜 미디어 -->
      <g id="era2010s" transform="translate(0, -100)">
            <rect x="550" y="120" width="200" height="160" rx="15" fill="url(#era2010Card)" 
                  stroke="#9F7AEA" stroke-width="3"/>
   
            <!-- 소셜 미디어 아이콘 -->
            <circle cx="660" cy="155" r="12" fill="none" stroke="white" stroke-width="3"/>
            <circle cx="680" cy="155" r="12" fill="none" stroke="white" stroke-width="3"/>
            <circle cx="700" cy="155" r="12" fill="none" stroke="white" stroke-width="3"/>
            <line x1="672" y1="163" x2="688" y2="163" stroke="white" stroke-width="2"/>
            
            <text x="650" y="195" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="bold" 
                  text-anchor="middle" fill="white">소셜 미디어</text>
            <text x="650" y="215" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" 
                  text-anchor="middle" fill="#E2E8F0">실시간 과학 커뮤니케이션</text>
            
            <!-- 기술 스택 -->
            <text x="650" y="240" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="bold"
                  text-anchor="middle" fill="#000000">정적 사이트 생성기</text>
            <text x="650" y="255" font-family="Noto Sans KR, Arial, sans-serif" font-size="12"
                  text-anchor="middle" fill="#E2E8F0">Jekyll • Hugo • GitHub Pages</text>
            
      </g>
      <!-- 연도 표시 -->
      <circle cx="620" cy="200" r="15" fill="#9F7AEA"/>
      <text x="620" y="206" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="bold" 
            text-anchor="middle" fill="white">10s</text>
      <!-- 기반 연결선 강화 -->
      <path d="M 620 210 Q 700 400 620 520" stroke="#9F7AEA" stroke-width="4" fill="none" opacity="0.8"/>
      <circle cx="570" cy="520" r="4" fill="#9F7AEA" opacity="0.8"/>

      <!-- 2020년대: 오픈사이언스 + 쿼토 혁신 통합 -->
      <g id="era2020s-quarto" transform="translate(0, -100)">
            <rect x="800" y="120" width="200" height="160" rx="15" fill="url(#era2020Card)" 
                  stroke="#ED64A6" stroke-width="3"/>
            
            <!-- 오픈사이언스 아이콘 -->
            <circle cx="920" cy="155" r="15" fill="none" stroke="white" stroke-width="3"/>
            <line x1="920" y1="140" x2="920" y2="170" stroke="white" stroke-width="3"/>
            <line x1="905" y1="155" x2="935" y2="155" stroke="white" stroke-width="3"/>
            <line x1="909" y1="145" x2="931" y2="165" stroke="white" stroke-width="2"/>
            <line x1="931" y1="145" x2="909" y2="165" stroke="white" stroke-width="2"/>
            
            <text x="900" y="195" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="bold" 
                  text-anchor="middle" fill="white">오픈사이언스</text>
            <text x="900" y="215" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" 
                  text-anchor="middle" fill="#E2E8F0">문서 코드화</text>
            
            <!-- 기술 스택 -->
            <text x="900" y="240" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="bold"
                  text-anchor="middle" fill="#080808">문서 코드화</text>
            <text x="900" y="255" font-family="Noto Sans KR, Arial, sans-serif" font-size="12"
                  text-anchor="middle" fill="#E2E8F0">Quarto • R Markdown • Jupyter</text>            
            </g>
      </g>
      <!-- 연도 표시 -->
      <circle cx="870" cy="200" r="15" fill="#ED64A6"/>
      <text x="870" y="206" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="bold" 
            text-anchor="middle" fill="white">20s</text>
      <!-- 기반 연결선 강화 -->
      <path d="M 870 210 Q 950 400 920 520" stroke="#ED64A6" stroke-width="4" fill="none" opacity="0.8"/>
      <circle cx="920" cy="520" r="4" fill="#ED64A6" opacity="0.8"/>


  <!-- 쿼토 혁신 확장 (2020년대에서 자연스럽게 분기) -->
  <g id="quarto-innovation-flow" transform="translate(-30,-30)">
    <!-- 쿼토 핵심 박스 -->
    <rect x="850" y="320" width="180" height="80" rx="12" fill="url(#quartoGlow)" 
          stroke="#FF6B35" stroke-width="3" filter="url(#glow)"/>
    
    <text x="940" y="345" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="bold" 
          text-anchor="middle" fill="white">쿼토 혁신</text>
    <text x="940" y="365" font-family="Noto Sans KR, Arial, sans-serif" font-size="13" 
          text-anchor="middle" fill="white">단일 소스 → 다중 출력</text>
    <text x="940" y="385" font-family="Noto Sans KR, Arial, sans-serif" font-size="11" 
          text-anchor="middle" fill="#FFF5F5">One Source, Multiple Outputs</text>
    
    <!-- 연결선 (2020년대에서 쿼토로) -->
    <line x1="950" y1="210" x2="940" y2="320" stroke="#FF6B35" stroke-width="4" marker-end="url(#arrow)"/>
    
    <!-- 출력 분기 -->
    <g id="outputs">
      <!-- 논문 -->
      <rect x="1080" y="290" width="100" height="50" rx="8" fill="#E53E3E" opacity="0.9"/>
      <text x="1130" y="310" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="bold" 
            text-anchor="middle" fill="white">학술 논문</text>
      <text x="1130" y="325" font-family="Noto Sans KR, Arial, sans-serif" font-size="9" 
            text-anchor="middle" fill="white">PDF • LaTeX</text>
      <line x1="1030" y1="340" x2="1080" y2="315" stroke="#FF6B35" stroke-width="3" marker-end="url(#arrow)"/>
      
      <!-- 웹사이트 -->
      <rect x="1080" y="355" width="100" height="50" rx="8" fill="#38A169" opacity="0.9"/>
      <text x="1130" y="375" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="bold" 
            text-anchor="middle" fill="white">웹사이트</text>
      <text x="1130" y="390" font-family="Noto Sans KR, Arial, sans-serif" font-size="9" 
            text-anchor="middle" fill="white">HTML • CSS</text>
      <line x1="1030" y1="360" x2="1080" y2="380" stroke="#FF6B35" stroke-width="3" marker-end="url(#arrow)"/>
      
      <!-- 블로그 -->
      <rect x="1080" y="420" width="100" height="50" rx="8" fill="#3182CE" opacity="0.9"/>
      <text x="1130" y="440" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="bold" 
            text-anchor="middle" fill="white">블로그</text>
      <text x="1130" y="455" font-family="Noto Sans KR, Arial, sans-serif" font-size="9" 
            text-anchor="middle" fill="white">RSS • Social</text>
      <line x1="1030" y1="380" x2="1080" y2="445" stroke="#FF6B35" stroke-width="3" marker-end="url(#arrow)"/>
    </g>
  </g>

  <!-- 시간 흐름 표시 -->
  <g transform="translate(-20,130)">
      <text x="120" y="110" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="bold" 
            text-anchor="middle" fill="#4A5568">1990s</text>
      <text x="370" y="110" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="bold" 
            text-anchor="middle" fill="#4A5568">2000s</text>
      <text x="620" y="110" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="bold" 
            text-anchor="middle" fill="#4A5568">2010s</text>
      <text x="870" y="110" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="bold" 
            text-anchor="middle" fill="#4A5568">2020s</text>
      <text x="1130" y="110" font-family="Noto Sans KR, Arial, sans-serif" font-size="24" font-weight="bold" 
            text-anchor="middle" fill="#4A5568">2025</text>
  </g>

  <!-- 진화 화살표 -->
  <path d="M 250 200 Q 300 180 350 200" fill="none" stroke="#718096" stroke-width="3" 
        marker-end="url(#whiteArrow)" opacity="0.7"/>
  <path d="M 500 200 Q 550 180 600 200" fill="none" stroke="#718096" stroke-width="3" 
        marker-end="url(#whiteArrow)" opacity="0.7"/>
  <path d="M 750 200 Q 800 180 850 200" fill="none" stroke="#718096" stroke-width="3" 
        marker-end="url(#whiteArrow)" opacity="0.7"/>

</svg>