<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" fill="#f8f9fa"/>
  
  <!-- Main Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">70년 타이포그래피 혁신: 기술 진화와 생태계 전략의 교차점</text>
  
  <!-- Section Divider -->
  <line x1="50" y1="450" x2="1350" y2="450" stroke="#34495e" stroke-width="2" stroke-dasharray="10,5"/>
  
  <!-- Upper Section: Developer Font Evolution -->
  <text x="700" y="80" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#34495e">개발자 글꼴의 진화 (1955-2020)</text>
  
  <!-- Timeline axis for developer fonts -->
  <line x1="100" y1="380" x2="1300" y2="380" stroke="#34495e" stroke-width="2"/>
  
  <!-- IBM Courier 1955 -->
  <circle cx="150" cy="380" r="8" fill="#2c5282"/>
  <rect x="100" y="280" width="100" height="80" rx="8" fill="#e6f3ff" stroke="#2c5282" stroke-width="2"/>
  <text x="150" y="300" font-family="Courier New, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c5282">IBM Courier</text>
  <text x="150" y="315" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">1955</text>
  <text x="150" y="330" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">퍼블릭 도메인</text>
  <text x="150" y="345" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">타자기용</text>
  <line x1="150" y1="360" x2="150" y2="372" stroke="#2c5282" stroke-width="2"/>
  
  <!-- Xerox Alto 1973 (revolutionary) -->
  <circle cx="300" cy="380" r="10" fill="#d69e2e"/>
  <rect x="240" y="160" width="120" height="100" rx="8" fill="#fef5e7" stroke="#d69e2e" stroke-width="3"/>
  <text x="300" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#d69e2e">Xerox Alto</text>
  <text x="300" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">1973</text>
  <text x="300" y="210" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">최초 GUI</text>
  <text x="300" y="225" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">WYSIWYG</text>
  <text x="300" y="240" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">★ 혁명적</text>
  <line x1="300" y1="260" x2="300" y2="370" stroke="#d69e2e" stroke-width="3"/>
  
  <!-- DEC VT100 1978 -->
  <circle cx="450" cy="380" r="8" fill="#1a365d"/>
  <rect x="400" y="290" width="100" height="70" rx="8" fill="#e2e8f0" stroke="#1a365d" stroke-width="2"/>
  <text x="450" y="310" font-family="Courier New, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a365d">DEC VT100</text>
  <text x="450" y="325" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">1978</text>
  <text x="450" y="340" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">터미널 표준</text>
  <text x="450" y="350" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">600만 대</text>
  <line x1="450" y1="360" x2="450" y2="372" stroke="#1a365d" stroke-width="2"/>
  
  <!-- Apple Chicago 1984 -->
  <circle cx="600" cy="380" r="8" fill="#e53e3e"/>
  <rect x="550" y="290" width="100" height="70" rx="8" fill="#fed7d7" stroke="#e53e3e" stroke-width="2"/>
  <text x="600" y="310" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#e53e3e">Chicago</text>
  <text x="600" y="325" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">1984 Susan Kare</text>
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">9×7 픽셀</text>
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">개성 표현</text>
  <line x1="600" y1="360" x2="600" y2="372" stroke="#e53e3e" stroke-width="2"/>
  
  <!-- MS Consolas 2004 -->
  <circle cx="900" cy="380" r="8" fill="#0078d4"/>
  <rect x="850" y="290" width="100" height="70" rx="8" fill="#e3f2fd" stroke="#0078d4" stroke-width="2"/>
  <text x="900" y="310" font-family="Consolas, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#0078d4">Consolas</text>
  <text x="900" y="325" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">2004 MS</text>
  <text x="900" y="340" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">ClearType</text>
  <text x="900" y="350" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">가독성 혁신</text>
  <line x1="900" y1="360" x2="900" y2="372" stroke="#0078d4" stroke-width="2"/>
  
  <!-- JetBrains Mono 2020 -->
  <circle cx="1200" cy="380" r="8" fill="#ff6b35"/>
  <rect x="1150" y="280" width="100" height="80" rx="8" fill="#fff2e6" stroke="#ff6b35" stroke-width="2"/>
  <text x="1200" y="300" font-family="JetBrains Mono, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#ff6b35">JetBrains</text>
  <text x="1200" y="315" font-family="JetBrains Mono, monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#ff6b35">Mono</text>
  <text x="1200" y="335" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">2020</text>
  <text x="1200" y="345" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">리가처</text>
  <text x="1200" y="355" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#333">IDE 최적화</text>
  <line x1="1200" y1="360" x2="1200" y2="372" stroke="#ff6b35" stroke-width="2"/>
  
  <!-- Year markers for developer section -->
  <text x="150" y="405" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">1955</text>
  <text x="300" y="405" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">1973</text>
  <text x="450" y="405" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">1978</text>
  <text x="600" y="405" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">1984</text>
  <text x="900" y="405" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">2004</text>
  <text x="1200" y="405" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">2020</text>
  
  <!-- Lower Section: Business Strategy -->
  <text x="700" y="490" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#34495e">거대 IT 기업의 생태계 전략 (1996-2020)</text>
  
  <!-- Timeline axis for business strategy -->
  <line x1="100" y1="800" x2="1300" y2="800" stroke="#34495e" stroke-width="2"/>
  
  <!-- Microsoft 1996 -->
  <circle cx="200" cy="800" r="8" fill="#0078d4"/>
  <rect x="150" y="720" width="100" height="60" rx="10" fill="#e3f2fd" stroke="#0078d4" stroke-width="2"/>
  <text x="200" y="740" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0078d4">Microsoft</text>
  <text x="200" y="755" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">Core Fonts</text>
  <text x="200" y="770" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">웹 표준화</text>
  <line x1="200" y1="780" x2="200" y2="792" stroke="#0078d4" stroke-width="2"/>
  
  <!-- Naver 2008 -->
  <circle cx="450" cy="800" r="8" fill="#03c75a"/>
  <rect x="400" y="720" width="100" height="60" rx="10" fill="#e8f5e8" stroke="#03c75a" stroke-width="2"/>
  <text x="450" y="740" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#03c75a">네이버</text>
  <text x="450" y="755" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">나눔글꼴</text>
  <text x="450" y="770" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">한글 생태계</text>
  <line x1="450" y1="780" x2="450" y2="792" stroke="#03c75a" stroke-width="2"/>
  
  <!-- Google 2014 -->
  <circle cx="700" cy="800" r="8" fill="#4285f4"/>
  <rect x="650" y="720" width="100" height="60" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="700" y="740" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4285f4">Google</text>
  <text x="700" y="755" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">Noto "No Tofu"</text>
  <text x="700" y="770" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">800개 언어</text>
  <line x1="700" y1="780" x2="700" y2="792" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Apple 2015 -->
  <circle cx="900" cy="800" r="8" fill="#007aff"/>
  <rect x="850" y="640" width="100" height="60" rx="10" fill="#e6f3ff" stroke="#007aff" stroke-width="2"/>
  <text x="900" y="660" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#007aff">Apple</text>
  <text x="900" y="675" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">San Francisco</text>
  <text x="900" y="690" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">제한적 무료</text>
  <line x1="900" y1="700" x2="900" y2="792" stroke="#007aff" stroke-width="2"/>
  
  <!-- IBM 2017 -->
  <circle cx="1100" cy="800" r="8" fill="#1261a0"/>
  <rect x="1050" y="720" width="100" height="60" rx="10" fill="#e6f1ff" stroke="#1261a0" stroke-width="2"/>
  <text x="1100" y="740" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1261a0">IBM</text>
  <text x="1100" y="755" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">IBM Plex</text>
  <text x="1100" y="770" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">완전 오픈소스</text>
  <line x1="1100" y1="780" x2="1100" y2="792" stroke="#1261a0" stroke-width="2"/>
  
  <!-- Year markers for business section -->
  <text x="200" y="825" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">1996</text>
  <text x="450" y="825" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">2008</text>
  <text x="700" y="825" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">2014</text>
  <text x="900" y="825" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">2015</text>
  <text x="1100" y="825" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">2017</text>
  
  <!-- Central Connection Lines -->
  <!-- Connecting developer evolution to business strategy -->
  <path d="M 300 260 Q 500 350 450 600" stroke="#8e44ad" stroke-width="3" fill="none" opacity="0.7" marker-end="url(#connection-arrow)"/>
  <text x="375" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#8e44ad">GUI → 웹 표준</text>
  
  <path d="M 900 360 Q 800 550 700 640" stroke="#e67e22" stroke-width="3" fill="none" opacity="0.7" marker-end="url(#connection-arrow2)"/>
  <text x="800" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e67e22">개발자 타겟팅</text>
  
  <!-- Key Innovation Markers -->
  <rect x="50" y="100" width="300" height="50" rx="5" fill="white" stroke="#9b59b6" stroke-width="2" opacity="0.9"/>
  <text x="200" y="120" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9b59b6">기술 혁신 → 표준화</text>
  <text x="200" y="135" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">개발자 도구의 진보가 대중화를 견인</text>
  
  <rect x="1050" y="550" width="300" height="50" rx="5" fill="white" stroke="#e74c3c" stroke-width="2" opacity="0.9"/>
  <text x="1200" y="570" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e74c3c">전략적 무료화</text>
  <text x="1200" y="585" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">생태계 장악을 위한 글꼴 정책</text>
  
  <!-- Evolution phases -->
  <rect x="50" y="840" width="1300" height="45" rx="5" fill="white" stroke="#2c3e50" stroke-width="1"/>
  <text x="700" y="860" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">진화 단계</text>
  <text x="200" y="875" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c5282">실험적 무료화</text>
  <text x="400" y="875" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#d69e2e">기술 혁명</text>
  <text x="600" y="875" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e53e3e">개성 표현</text>
  <text x="800" y="875" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4285f4">글로벌 표준화</text>
  <text x="1000" y="875" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0078d4">전문화 최적화</text>
  <text x="1200" y="875" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1261a0">오픈소스 전환</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="connection-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad"/>
    </marker>
    <marker id="connection-arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22"/>
    </marker>
  </defs>
</svg>