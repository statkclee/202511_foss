<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="400" viewBox="0 0 1100 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F766E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="mainArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L2,10 L10,6 z" fill="#374151" />
    </marker>
    <marker id="subArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L1,7 L7,4 z" fill="#9CA3AF" />
    </marker>
    <marker id="thinArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,2 L2,8 L8,5 z" fill="#6B7280"/>
    </marker>

    <style>
      .main-text { font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .sub-text { font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 11px; font-weight: 400; text-anchor: middle; }
      .context-text { font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 13px; font-weight: 500; text-anchor: middle; }
      .small-text { font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 10px; font-weight: 400; text-anchor: middle; }
      .icon-text { font-family: monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- 배경 -->
  <rect width="1100" height="500" fill="#FEFEFE" stroke="#E5E7EB" stroke-width="1" rx="8"/>

  <!-- 상단 컨텍스트 바 -->
  <rect x="50" y="15" width="600" height="40" rx="18" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="200" y="32" class="context-text" fill="#374151">Single Source</text>
  <text x="200" y="47" class="context-text" fill="#6B7280">One Source</text>
  
  <text x="300" y="40" class="context-text" fill="#9CA3AF">→</text>
  
  <text x="400" y="32" class="context-text" fill="#374151">Multiple Outputs</text>
  <text x="400" y="47" class="context-text" fill="#6B7280">Various Outputs</text>
  
  <text x="560" y="32" class="small-text" fill="#10B981">⚡ 80% Efficiency Boost</text>
  <text x="560" y="47" class="small-text" fill="#6B7280">Automated Processing</text>

  <!-- ① Content Creation -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="50" fill="url(#gradPurple)" filter="url(#dropShadow)" stroke="#6D28D9" stroke-width="3"/>
    <circle cx="-16" cy="-18" r="9" fill="#FFFFFF" opacity="0.95" stroke="#E5E7EB"/>
    <text x="-16" y="-15" class="small-text" fill="#7C3AED">①</text>
    <text x="0" y="-2" class="icon-text" fill="white">📝</text>
    <text x="0" y="14" class="main-text" fill="white">Content Creation</text>
    <text x="0" y="30" class="sub-text" fill="#E0E7FF">Markdown/Quarto</text>
    <!-- 수정/업데이트 루프 -->
    <path d="M -60 0 A 60 60 0 0 1 0 -60" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#thinArrow)" filter="url(#glow)"/>
    <path d="M 60 0 A 60 60 0 0 1 0 60" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#thinArrow)" filter="url(#glow)"/>
    <text x="70" y="-50" class="small-text" fill="#6B7280">Edit/Update → Rebuild</text>
  </g>정

  <!-- 메인 흐름 -->
  <path d="M 180 120 H 240" stroke="#374151" stroke-width="2.5" marker-end="url(#mainArrow)"/>
  <g transform="translate(300, 120)">
    <rect x="-60" y="-35" width="120" height="70" rx="15" fill="url(#gradBlue)" filter="url(#dropShadow)" stroke="#1E40AF" stroke-width="2"/>
    <circle cx="-40" cy="-20" r="9" fill="#FFFFFF" opacity="0.95" stroke="#E5E7EB"/>
    <text x="-40" y="-17" class="small-text" fill="#1D4ED8">②</text>
    <text x="0" y="-6" class="icon-text" fill="white">🎨</text>
    <text x="0" y="10" class="main-text" fill="white">Design</text>
    <text x="0" y="25" class="sub-text" fill="#DBEAFE">CSS/Themes</text>
  </g>
  <path d="M 370 120 H 460" stroke="#374151" stroke-width="2.5" marker-end="url(#mainArrow)"/>

  <!-- ③ Publishing 허브 -->
  <g transform="translate(500, 120)">
    <polygon points="0,-40 40,0 0,40 -40,0" fill="url(#gradTeal)" filter="url(#dropShadow)" stroke="#0F766E" stroke-width="2"/>
    <circle cx="-24" cy="-24" r="9" fill="#FFFFFF" opacity="0.95" stroke="#E5E7EB"/>
    <text x="-24" y="-21" class="small-text" fill="#0F766E">③</text>
    <text x="0" y="-2" class="icon-text" fill="white">⚙️</text>
    <text x="0" y="14" class="main-text" fill="white">Publishing</text>
    <text x="25" y="55" class="sub-text" fill="#0F766E">Pandoc</text>
  </g>

  <!-- Publishing → 출력형식 (상자 윗변 중앙에 접속) -->
  <!-- 각 형식 상자 정보: top-center (x, 235) -->
  <path d="M 500 160 V 200 H 200 V 235" stroke="#6B7280" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>
  <path d="M 500 160 V 200 H 400 V 235" stroke="#6B7280" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>
  <path d="M 500 160 V 200 H 600 V 235" stroke="#6B7280" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>

  <!-- 출력 형식 상자들 (top y = 235 because y = 260 - 25) -->
  <g transform="translate(200, 260)">
    <rect x="-55" y="-25" width="110" height="50" rx="12" fill="url(#gradGreen)" filter="url(#dropShadow)" stroke="#059669" stroke-width="2"/>
    <text x="0" y="-4" class="icon-text" fill="white">📄</text>
    <text x="0" y="12" class="sub-text" fill="#D1FAE5">PDF (.pdf)</text>
  </g>
  <g transform="translate(400, 260)">
    <rect x="-55" y="-25" width="110" height="50" rx="12" fill="url(#gradGreen)" filter="url(#dropShadow)" stroke="#059669" stroke-width="2"/>
    <text x="0" y="-4" class="icon-text" fill="white">🌐</text>
    <text x="0" y="12" class="sub-text" fill="#D1FAE5">HTML (.html)</text>
  </g>
  <g transform="translate(600, 260)">
    <rect x="-70" y="-25" width="140" height="50" rx="12" fill="url(#gradGreen)" filter="url(#dropShadow)" stroke="#059669" stroke-width="2"/>
    <text x="0" y="-4" class="icon-text" fill="white">📊</text>
    <text x="0" y="12" class="sub-text" fill="#D1FAE5">Office (.docx/.pptx)</text>
  </g>

  <!-- 최종 산출물 - 깔끔한 붙임 배치 -->
  
  <!-- PDF 그룹: 각 박스별 연결 -->
  <path d="M 200 285 V 315 H 115 V 340" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>
  <path d="M 200 285 V 315 H 218 V 340" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>
  
  <!-- PDF 2개 박스 붙여서 배치 -->
  <g transform="translate(170, 365)">
    <rect x="-105" y="-20" width="100" height="40" rx="15" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <rect x="-2" y="-20" width="100" height="40" rx="15" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="-55" y="2" class="sub-text" fill="#92400E">Papers/Reports</text>
    <text x="48" y="2" class="sub-text" fill="#92400E">(E-)Books</text>
  </g>

  <!-- HTML 그룹: 각 박스별 연결 -->
  <path d="M 400 285 V 315 H 335 V 340" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>
  <path d="M 400 285 V 315 H 438 V 340" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>
  
  <!-- HTML 2개 박스 붙여서 배치 -->
  <g transform="translate(390, 365)">
    <rect x="-105" y="-20" width="100" height="40" rx="15" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <rect x="-2" y="-20" width="100" height="40" rx="15" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="-55" y="-5" class="sub-text" fill="#92400E">Websites</text>
    <text x="-55" y="10" class="sub-text" fill="#92400E">Blogs</text>
    <text x="48" y="2" class="sub-text" fill="#92400E">Dashboards</text>
  </g>

  <!-- Office 그룹: 각 박스별 연결 -->
  <path d="M 600 285 V 315 H 555 V 340" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>
  <path d="M 600 285 V 315 H 658 V 340" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>
  
  <!-- Office 2개 박스 붙여서 배치 -->
  <g transform="translate(610, 365)">
    <rect x="-105" y="-20" width="100" height="40" rx="15" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <rect x="-2" y="-20" width="100" height="40" rx="15" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="-55" y="2" class="sub-text" fill="#92400E">Business</text>
    <text x="48" y="2" class="sub-text" fill="#92400E">Science &amp; Tech</text>
  </g>

  <!-- 우측 사이드바 -->
  <rect x="750" y="80" width="300" height="300" rx="12" fill="rgba(59, 130, 246, 0.03)" stroke="#3B82F6" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="900" y="110" class="context-text" fill="#1E40AF">Single Sourcing Benefits</text>
  <g transform="translate(780, 140)">
    <text x="0" y="0"  class="sub-text" fill="#059669" style="text-anchor:start;">✅ Consistency Guarantee</text>
    <text x="0" y="20" class="sub-text" fill="#059669" style="text-anchor:start;">🚀 5x Faster Publishing</text>
    <text x="0" y="40" class="sub-text" fill="#059669" style="text-anchor:start;">🔄 Auto Updates</text>
    <text x="0" y="60" class="sub-text" fill="#059669" style="text-anchor:start;">📝 Version Control</text>
    <text x="0" y="80" class="sub-text" fill="#059669" style="text-anchor:start;">👥 Team Collaboration</text>
    <text x="0" y="100" class="sub-text" fill="#059669" style="text-anchor:start;">💰 Cost Savings</text>
  </g>
  <rect x="770" y="260" width="260" height="44" rx="8" fill="rgba(16, 185, 129, 0.1)"/>
  <text x="900" y="276" class="small-text" fill="#059669">Source Edit → All Formats Auto Update</text>
  <text x="900" y="292" class="small-text" fill="#6B7280">Data Changes Auto-Update Graphs Too</text>
</svg>
