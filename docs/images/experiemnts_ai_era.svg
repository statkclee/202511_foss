<svg viewBox="0 0 1400 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Current MLOps Gradient -->
    <linearGradient id="mlopsGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8F5E8"/>
      <stop offset="100%" style="stop-color:#4CAF50"/>
    </linearGradient>

    <!-- Near-term AI Gradient -->
    <linearGradient id="nearAiGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F3E5F5"/>
      <stop offset="100%" style="stop-color:#9C27B0"/>
    </linearGradient>

    <!-- Advanced AI Gradient -->
    <linearGradient id="advancedAiGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E1BEE7"/>
      <stop offset="100%" style="stop-color:#6A1B9A"/>
    </linearGradient>

    <!-- Quantum Gradient -->
    <linearGradient id="quantumGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE0B2"/>
      <stop offset="50%" style="stop-color:#FF9800"/>
      <stop offset="100%" style="stop-color:#E65100"/>
    </linearGradient>

    <marker id="mlopsArrow" markerWidth="12" markerHeight="8"
     refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#4CAF50"/>
    </marker>

    <marker id="arrowhead" markerWidth="12" markerHeight="8"
     refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#333"/>
    </marker>

    <marker id="transformArrow" markerWidth="15" markerHeight="10"
     refX="14" refY="5" orient="auto">
      <polygon points="0 0, 15 5, 0 10" fill="#FF5722"/>
    </marker>

    <!-- Neural Network Node Pattern -->
    <pattern id="neuralPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="3" fill="#9C27B0" opacity="0.1"/>
      <circle cx="10" cy="10" r="2" fill="#6A1B9A" opacity="0.15"/>
      <circle cx="30" cy="30" r="2" fill="#6A1B9A" opacity="0.15"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1400" height="900" fill="white"/>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#333">
    🧠 AI Era: Experimental Methodology Evolution
  </text>
  <text x="700" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">
    From Human-Supervised Automation to AI-Assisted Discovery
  </text>

  <!-- Timeline -->
  <line x1="100" y1="90" x2="1300" y2="90" stroke="#333" stroke-width="2"/>
  <circle cx="200" cy="90" r="6" fill="#4CAF50"/>
  <circle cx="600" cy="90" r="6" fill="#9C27B0"/>
  <circle cx="1100" cy="90" r="6" fill="#6A1B9A"/>

  <text x="200" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">MLOps Era (CURRENT)</text>
  <text x="600" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">AI-Assisted Era (PILOT)</text>
  <text x="1100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Future Vision (SCENARIO)</text>

  <text x="200" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999">2020-2025</text>
  <text x="600" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999">2025-2035</text>
  <text x="1100" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999">Speculative</text>

  <!-- Current State: MLOps Era (Left Panel) -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="300" height="500" fill="#F1F8E9" stroke="#4CAF50" stroke-width="2" rx="15"/>
    <text x="150" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E7D32">
      🛠️ MLOps Era (Current)
    </text>
    <text x="150" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4CAF50">
      Human-Supervised Automation
    </text>

    <!-- Traditional Cycle -->
    <g transform="translate(150, 200)">
      <circle cx="0" cy="0" r="80" fill="none" stroke="#4CAF50" stroke-width="2" stroke-dasharray="8,4"/>

      <!-- Arrows -->
      <g transform="translate(0,0) rotate(60) scale(0.5)">
        <path d="M 0 -120 A 120 120 0 0 1 104 60" stroke="#4CAF50"  stroke-width="2.5" fill="none" marker-end="url(#mlopsArrow)"/>
        <path d="M 104 60 A 120 120 0 0 1 -104 60" stroke="#4CAF50" stroke-width="2.5" fill="none" marker-end="url(#mlopsArrow)"/>
        <path d="M -104 60 A 120 120 0 0 1 0 -120" stroke="#4CAF50" stroke-width="2.5" fill="none" marker-end="url(#mlopsArrow)"/>
      </g>

      <!-- Design -->
      <circle cx="0" cy="-60" r="30" fill="url(#mlopsGradient)" stroke="#4CAF50" stroke-width="2"/>
      <text x="0" y="-60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">🤖 DESIGN</text>
      <text x="0" y="-47" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">ML Engineers</text>

      <!-- Experiment -->
      <circle cx="52" cy="30" r="30" fill="url(#mlopsGradient)" stroke="#4CAF50" stroke-width="2"/>
      <text x="52" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">🚀 EXPERIMENT</text>
      <text x="52" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">A/B Testing</text>

      <!-- Analyze -->
      <circle cx="-52" cy="30" r="30" fill="url(#mlopsGradient)" stroke="#4CAF50" stroke-width="2"/>
      <text x="-52" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">⚡ ANALYZE</text>
      <text x="-52" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">Dashboards</text>
    </g>

    <!-- Characteristics -->
    <rect x="20" y="350" width="260" height="140" fill="#E8F5E8" stroke="#4CAF50" stroke-width="1" rx="8"/>
    <text x="150" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">
      Current Deployed State
    </text>

    <circle cx="40" cy="390" r="4" fill="#4CAF50"/>
    <text x="55" y="395" font-family="Arial, sans-serif" font-size="11" fill="#333">Tools: MLflow, Kubeflow, W&amp;B, DataRobot</text>

    <circle cx="40" cy="410" r="4" fill="#4CAF50"/>
    <text x="55" y="415" font-family="Arial, sans-serif" font-size="11" fill="#333">Human oversight required</text>

    <circle cx="40" cy="430" r="4" fill="#4CAF50"/>
    <text x="55" y="435" font-family="Arial, sans-serif" font-size="11" fill="#333">Hours-days (online) / weeks (regulated)</text>

    <circle cx="40" cy="450" r="4" fill="#4CAF50"/>
    <text x="55" y="455" font-family="Arial, sans-serif" font-size="11" fill="#333">GDPR, model explainability</text>

    <circle cx="40" cy="470" r="4" fill="#4CAF50"/>
    <text x="55" y="475" font-family="Arial, sans-serif" font-size="11" fill="#333">Team: ML/Data Engineers</text>
  </g>

  <!-- Transformation Arrows -->
  <g transform="translate(370, 350)">
    <path d="M 0 0 Q 50 -30 100 0" stroke="#FF5722" stroke-width="2" fill="none" marker-end="url(#transformArrow)"/>
    <text x="50" y="-30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF5722">
      AI ASSISTANCE
    </text>
  </g>

  <g transform="translate(810, 350)">
    <path d="M 0 0 Q 50 -30 120 0" stroke="#FF5722" stroke-width="2" fill="none" marker-end="url(#transformArrow)"/>
    <text x="65" y="-45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF5722">
      AUTONOMOUS
    </text>
    <text x="65" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF5722">
      VISION
    </text>
  </g>

  <!-- Near-term AI Era (Center Panel) -->
  <g transform="translate(490, 150)">
    <rect x="0" y="0" width="300" height="500" fill="#F8F4FF" stroke="#9C27B0" stroke-width="2" rx="15"/>
    <text x="150" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#6A1B9A">
      🧠 Near-term AI Era
    </text>
    <text x="150" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9C27B0">
      Human-AI Collaboration
    </text>

    <!-- AI-Assisted Network -->
    <g transform="translate(150, 180)">
      <!-- Central AI Hub -->
      <circle cx="0" cy="0" r="35" fill="url(#nearAiGradient)" stroke="#9C27B0" stroke-width="3"/>
      <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">🤖 AI</text>
      <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Copilot</text>

      <!-- Design Nodes -->
      <circle cx="-70" cy="-40" r="25" fill="url(#nearAiGradient)" stroke="#9C27B0" stroke-width="2"/>
      <text x="-70" y="-45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">🎯 DESIGN</text>
      <text x="-70" y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Hybrid</text>

      <circle cx="70" cy="-40" r="25" fill="url(#nearAiGradient)" stroke="#9C27B0" stroke-width="2"/>
      <text x="70" y="-45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">📊 HYPO</text>
      <text x="70" y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Gen AI</text>

      <!-- Experiment Parallel Nodes -->
      <circle cx="-80" cy="30" r="20" fill="url(#nearAiGradient)" stroke="#9C27B0" stroke-width="2"/>
      <text x="-80" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">🧪 A</text>

      <circle cx="-40" cy="50" r="20" fill="url(#nearAiGradient)" stroke="#9C27B0" stroke-width="2"/>
      <text x="-40" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">🧪 B</text>

      <circle cx="40" cy="50" r="20" fill="url(#nearAiGradient)" stroke="#9C27B0" stroke-width="2"/>
      <text x="40" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">🧪 C</text>

      <circle cx="80" cy="30" r="20" fill="url(#nearAiGradient)" stroke="#9C27B0" stroke-width="2"/>
      <text x="80" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">🧪 D</text>

      <!-- Digital Twin -->
      <rect x="-25" y="80" width="50" height="30" fill="url(#nearAiGradient)" stroke="#9C27B0" stroke-width="2" rx="5"/>
      <text x="0" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="black">🌐 TWIN</text>
      <text x="0" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="black">Simulation</text>

      <!-- Neural Network Connections -->
      <line x1="-28" y1="-15" x2="-45" y2="-25" stroke="#9C27B0" stroke-width="1" opacity="0.6"/>
      <line x1="28" y1="-15" x2="45" y2="-25" stroke="#9C27B0" stroke-width="1" opacity="0.6"/>
      <line x1="-25" y1="25" x2="-60" y2="25" stroke="#9C27B0" stroke-width="1" opacity="0.6"/>
      <line x1="-15" y1="30" x2="-25" y2="40" stroke="#9C27B0" stroke-width="1" opacity="0.6"/>
      <line x1="15" y1="30" x2="25" y2="40" stroke="#9C27B0" stroke-width="1" opacity="0.6"/>
      <line x1="25" y1="25" x2="60" y2="25" stroke="#9C27B0" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="35" x2="0" y2="75" stroke="#9C27B0" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- Key Features -->
    <rect x="20" y="320" width="260" height="150" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1" rx="8"/>
    <text x="150" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6A1B9A">
      AI-Enhanced Capabilities
    </text>

    <circle cx="40" cy="360" r="4" fill="#9C27B0"/>
    <text x="55" y="365" font-family="Arial, sans-serif" font-size="11" fill="#333">Automated hypothesis generation</text>

    <circle cx="40" cy="380" r="4" fill="#9C27B0"/>
    <text x="55" y="385" font-family="Arial, sans-serif" font-size="11" fill="#333">Digital twin experimentation</text>

    <circle cx="40" cy="400" r="4" fill="#9C27B0"/>
    <text x="55" y="405" font-family="Arial, sans-serif" font-size="11" fill="#333">Causal discovery algorithms</text>

    <circle cx="40" cy="420" r="4" fill="#9C27B0"/>
    <text x="55" y="425" font-family="Arial, sans-serif" font-size="11" fill="#333">Parallel experiment orchestration</text>

    <circle cx="40" cy="440" r="4" fill="#9C27B0"/>
    <text x="55" y="445" font-family="Arial, sans-serif" font-size="11" fill="#333">Minutes to hours cycle time</text>

    <!-- Real Examples -->
    <text x="150" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#6A1B9A" font-style="italic">
      Examples: DeepMind materials, AlphaFold
    </text>
  </g>

  <!-- Advanced AI Era (Right Panel) -->
  <g transform="translate(950, 150)">
    <rect x="0" y="0" width="300" height="500" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2" rx="15"/>
    <text x="150" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4A148C">
      🚀 Advanced AI Era
    </text>
    <text x="150" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6A1B9A">
      Autonomous Discovery
    </text>

    <!-- Autonomous Network -->
    <g transform="translate(150, 160)">
      <!-- No traditional cycle - continuous flow -->
      <rect x="-100" y="-60" width="200" height="200" fill="url(#neuralPattern)" opacity="0.2" rx="20"/>

      <!-- Multi-Agent System -->
      <circle cx="0" cy="-30" r="25" fill="url(#advancedAiGradient)" stroke="#6A1B9A" stroke-width="2"/>
      <text x="0" y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">🧠 AGI</text>
      <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Scientist</text>

      <circle cx="-60" cy="0" r="20" fill="url(#advancedAiGradient)" stroke="#6A1B9A" stroke-width="2"/>
      <text x="-60" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">🤖 A1</text>

      <circle cx="60" cy="0" r="20" fill="url(#advancedAiGradient)" stroke="#6A1B9A" stroke-width="2"/>
      <text x="60" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">🤖 A2</text>

      <circle cx="-40" cy="40" r="20" fill="url(#advancedAiGradient)" stroke="#6A1B9A" stroke-width="2"/>
      <text x="-40" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">🤖 A3</text>

      <circle cx="40" cy="40" r="20" fill="url(#advancedAiGradient)" stroke="#6A1B9A" stroke-width="2"/>
      <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">🤖 A4</text>

      <!-- Quantum Computing Integration -->
      <rect x="-45" y="70" width="90" height="30" fill="url(#quantumGradient)" stroke="#FF9800" stroke-width="2" rx="8"/>
      <text x="0" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="black">⚛️ QUANTUM</text>
      <text x="0" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="black">Computing</text>

      <!-- Continuous Flow Lines -->
      <path d="M -25 -20 Q -40 10 -50 15" stroke="#6A1B9A" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M 25 -20 Q 40 10 50 15" stroke="#6A1B9A" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M -40 0 Q -20 20 -30 30" stroke="#6A1B9A" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M 40 0 Q 20 20 30 30" stroke="#6A1B9A" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M -20 50 Q 0 60 20 50" stroke="#6A1B9A" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M 0 55 Q 0 65 0 70" stroke="#FF9800" stroke-width="2" fill="none"/>

      <!-- Continuous Discovery Indicators -->
      <circle cx="-80" cy="-40" r="5" fill="#FF5722" opacity="0.8"/>
      <circle cx="80" cy="-40" r="5" fill="#FF5722" opacity="0.8"/>
      <circle cx="-70" cy="60" r="5" fill="#FF5722" opacity="0.8"/>
      <circle cx="70" cy="60" r="5" fill="#FF5722" opacity="0.8"/>
    </g>

    <!-- Revolutionary Features -->
    <rect x="20" y="320" width="260" height="150" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="1" rx="8"/>
    <text x="150" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A148C">
      Autonomous Capabilities
    </text>

    <circle cx="40" cy="360" r="4" fill="#6A1B9A"/>
    <text x="55" y="365" font-family="Arial, sans-serif" font-size="11" fill="#333">Self-improving discovery systems</text>

    <circle cx="40" cy="380" r="4" fill="#6A1B9A"/>
    <text x="55" y="385" font-family="Arial, sans-serif" font-size="11" fill="#333">Quantum-classical hybrid computing</text>

    <circle cx="40" cy="400" r="4" fill="#6A1B9A"/>
    <text x="55" y="405" font-family="Arial, sans-serif" font-size="11" fill="#333">Cross-domain knowledge synthesis</text>

    <circle cx="40" cy="420" r="4" fill="#6A1B9A"/>
    <text x="55" y="425" font-family="Arial, sans-serif" font-size="11" fill="#333">Autonomous scientific breakthroughs</text>

    <circle cx="40" cy="440" r="4" fill="#6A1B9A"/>
    <text x="55" y="445" font-family="Arial, sans-serif" font-size="11" fill="#333">Continuous real-time discovery</text>

    <!-- Governance Note -->
    <text x="150" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#FF5722" font-style="italic">
      ⚖️ Governance: AI safety protocols essential
    </text>
  </g>

  <!-- Governance Strip -->
  <rect x="50" y="670" width="1250" height="60" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" rx="10"/>
  <text x="675" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E65100">
    ⚖️ Governance &amp; Compliance Across All Eras
  </text>
  <text x="675" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#BF360C">
    EU AI Act 2024 • US AI Executive Order • GDPR • Model Explainability • Human Accountability • Audit Logs • Bias Testing
  </text>

</svg>