<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <style><![CDATA[
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 36px; font-weight: 900; fill: #f8fafc; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #cbd5e1; }
      .h1 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #ffffff; }
      .h2 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #f1f5f9; }
      .p { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #e5e7eb; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #cbd5e1; }
      .percentage { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 900; fill: #34d399; }
    ]]></style>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Task gradients -->
    <linearGradient id="gradModeling1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="gradModeling2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="gradModeling3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="gradOther" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Effects -->
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- Header -->
  <text x="600" y="50" text-anchor="middle" class="title">O*NET 과학적 작업별 AI 사용률</text>
  <text x="600" y="80" text-anchor="middle" class="subtitle">Scientific Tasks AI Usage (O*NET Classification)</text>

  <!-- Main pie chart area -->
  <g transform="translate(300,350)">
    <!-- Pie slices -->
    <!-- Slice 1: Mathematical modeling (46.1%) -->
    <path d="M 0,0 L 0,-150 A 150,150 0 0,1 137.2,-56.7 Z" fill="url(#gradModeling1)" filter="url(#shadow)"/>
    
    <!-- Slice 2: Software systems (16.9%) -->
    <path d="M 0,0 L 137.2,-56.7 A 150,150 0 0,1 87.9,121.4 Z" fill="url(#gradModeling2)" filter="url(#shadow)"/>
    
    <!-- Slice 3: Model completion (15.7%) -->
    <path d="M 0,0 L 87.9,121.4 A 150,150 0 0,1 -22.9,147.3 Z" fill="url(#gradModeling3)" filter="url(#shadow)"/>
    
    <!-- Slice 4: Statistical models (4.5%) -->
    <path d="M 0,0 L -22.9,147.3 A 150,150 0 0,1 -58.1,137.8 Z" fill="#f59e0b" filter="url(#shadow)"/>
    
    <!-- Slice 5: Computer simulation (2.2%) -->
    <path d="M 0,0 L -58.1,137.8 A 150,150 0 0,1 -74.2,130.7 Z" fill="#ef4444" filter="url(#shadow)"/>
    
    <!-- Slice 6: Programming (1.1%) -->
    <path d="M 0,0 L -74.2,130.7 A 150,150 0 0,1 -82.1,126.3 Z" fill="#ec4899" filter="url(#shadow)"/>
    
    <!-- Slice 7: Other tasks (13.5%) -->
    <path d="M 0,0 L -82.1,126.3 A 150,150 0 0,1 0,-150 Z" fill="url(#gradOther)" filter="url(#shadow)"/>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="50" fill="#1f2937" stroke="#34d399" stroke-width="3"/>
    <text x="0" y="-5" text-anchor="middle" class="h2" fill="#34d399">과학적</text>
    <text x="0" y="15" text-anchor="middle" class="h2" fill="#34d399">작업</text>
  </g>

  <!-- Legend and details -->
  <g transform="translate(650,150)">
    <!-- Modeling & Prediction section -->
    <rect x="0" y="0" width="500" height="280" rx="15" fill="#1f2937" opacity="0.8"/>
    <text x="250" y="30" text-anchor="middle" class="h1">모델링 및 예측 (86.5%)</text>
    <text x="250" y="55" text-anchor="middle" class="small">Modeling &amp; Prediction Tasks</text>
    
    <g transform="translate(20,80)">
      <!-- Task 1 -->
      <rect x="0" y="0" width="20" height="15" fill="url(#gradModeling1)"/>
      <text x="30" y="12" class="percentage">46.1%</text>
      <text x="80" y="12" class="p">기술적 문제의 논리적 분석 및 수학적 모델 공식화</text>
      
      <!-- Task 2 -->
      <rect x="0" y="30" width="20" height="15" fill="url(#gradModeling2)"/>
      <text x="30" y="42" class="percentage">16.9%</text>
      <text x="80" y="42" class="p">소프트웨어 시스템 설계 및 개발</text>
      
      <!-- Task 3 -->
      <rect x="0" y="60" width="20" height="15" fill="url(#gradModeling3)"/>
      <text x="30" y="72" class="percentage">15.7%</text>
      <text x="80" y="72" class="p">모델과 시뮬레이션 완성 및 성능 분석</text>
      
      <!-- Task 4 -->
      <rect x="0" y="90" width="20" height="15" fill="#f59e0b"/>
      <text x="30" y="102" class="percentage">4.5%</text>
      <text x="80" y="102" class="p">수학적 또는 통계적 모델 개발</text>
      
      <!-- Task 5 -->
      <rect x="0" y="120" width="20" height="15" fill="#ef4444"/>
      <text x="30" y="132" class="percentage">2.2%</text>
      <text x="80" y="132" class="p">물리적 데이터 모델링용 컴퓨터 시뮬레이션</text>
      
      <!-- Task 6 -->
      <rect x="0" y="150" width="20" height="15" fill="#ec4899"/>
      <text x="30" y="162" class="percentage">1.1%</text>
      <text x="80" y="162" class="p">통계적 모델링용 소프트웨어 개발</text>
      
      <!-- Subtotal -->
      <line x1="0" y1="185" x2="460" y2="185" stroke="#34d399" stroke-width="2"/>
      <text x="30" y="202" class="h2" fill="#34d399">86.5%</text>
      <text x="80" y="202" class="h2" fill="#34d399">모델링 및 예측 작업 소계</text>
    </g>
  </g>

  <!-- Other tasks section -->
  <g transform="translate(650,450)">
    <rect x="0" y="0" width="500" height="120" rx="15" fill="#1f2937" opacity="0.8"/>
    <text x="250" y="30" text-anchor="middle" class="h1">기타 과학적 작업 (13.5%)</text>
    
    <g transform="translate(20,50)">
      <rect x="0" y="0" width="20" height="15" fill="url(#gradOther)"/>
      <text x="30" y="12" class="percentage">9.0%</text>
      <text x="80" y="12" class="p">수학 과학 발전을 위한 새로운 원리와 관계 개발</text>
      
      <rect x="0" y="30" width="20" height="15" fill="url(#gradOther)"/>
      <text x="30" y="42" class="percentage">4.5%</text>
      <text x="80" y="42" class="p">과학적 기법을 적용하는 연구 프로젝트 설계</text>
    </g>
  </g>

  <!-- Key insight -->
  <g transform="translate(100,600)">
    <rect x="0" y="0" width="1000" height="80" rx="15" fill="#065f46" opacity="0.8"/>
    <text x="500" y="25" text-anchor="middle" class="h1" fill="#6ee7b7">핵심 통찰</text>
    <text x="500" y="50" text-anchor="middle" class="p" fill="#6ee7b7">AI는 단순한 정보 검색을 넘어 복잡한 분석적 사고와 수학적 모델링에 적극 활용</text>
    <text x="500" y="70" text-anchor="middle" class="small" fill="#6ee7b7">전체 프롬프트 중 0.9%만이 과학적 작업이지만, 그 중 86.5%가 모델링 및 예측에 집중</text>
  </g>

  <!-- Source -->
  <text x="600" y="690" text-anchor="middle" class="small">출처: Anthropic이 O*NET 분류에 따라 작업 수준 프롬프트를 라벨링하여 분석</text>
</svg>