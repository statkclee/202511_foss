<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
    <style>
      .kfont{font-family:'Noto Sans KR', sans-serif}
      .lane{fill:none; stroke:#333; stroke-width:1; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowhead)}
      .soft{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="800" fill="#f6f8fb"/>

  <!-- Top: ChatGPT -->
  <g id="chatgpt" transform="translate(640,50)">
    <rect x="0" y="0" width="120" height="60" rx="12" fill="#3b4758" class="soft"/>
    <text x="60" y="38" class="kfont" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">ChatGPT</text>
  </g>

  <!-- Left: Digital Writing (Moved Left) -->
  <g id="writing" transform="translate(80,180)">
    <rect id="box-writing" x="0" y="0" width="360" height="560" rx="18" fill="#e9f5ff" stroke="#2b7de9" stroke-width="2" class="soft"/>
    <text x="180" y="36" class="kfont" font-size="18" font-weight="700" text-anchor="middle" fill="#0d64c7">Digital Writing</text>

    <!-- Writing Ideas -->
    <rect x="28" y="245" width="82" height="46" rx="10" fill="#d8ebff" stroke="#2b7de9"/>
    <text x="69" y="273" class="kfont" font-size="14" text-anchor="middle" fill="#0d64c7">Ideas</text>

    <!-- Outputs -->
    <rect x="165" y="72" width="86" height="40" rx="10" fill="#f3e5f5" stroke="#7b1fa2"/>
    <text x="208" y="96" class="kfont" font-size="14" text-anchor="middle" fill="#4a148c">Table</text>

    <rect x="266" y="132" width="86" height="40" rx="10" fill="#f3e5f5" stroke="#7b1fa2"/>
    <text x="309" y="156" class="kfont" font-size="14" text-anchor="middle" fill="#4a148c">Graph</text>

    <rect x="165" y="192" width="170" height="40" rx="10" fill="#f3e5f5" stroke="#7b1fa2"/>
    <text x="250" y="216" class="kfont" font-size="13" text-anchor="middle" fill="#4a148c">Python/R/SQL Code</text>

    <rect x="266" y="252" width="86" height="40" rx="10" fill="#f3e5f5" stroke="#7b1fa2"/>
    <text x="309" y="276" class="kfont" font-size="14" text-anchor="middle" fill="#4a148c">Image</text>

    <rect x="165" y="312" width="86" height="40" rx="10" fill="#f3e5f5" stroke="#7b1fa2"/>
    <text x="208" y="336" class="kfont" font-size="14" text-anchor="middle" fill="#4a148c">Shape</text>

    <rect x="266" y="372" width="86" height="40" rx="10" fill="#f3e5f5" stroke="#7b1fa2"/>
    <text x="309" y="396" class="kfont" font-size="14" text-anchor="middle" fill="#4a148c">Map</text>

    <rect x="165" y="432" width="86" height="40" rx="10" fill="#f3e5f5" stroke="#7b1fa2"/>
    <text x="208" y="456" class="kfont" font-size="14" text-anchor="middle" fill="#4a148c">Formula</text>

    <!-- References: Ensure safe margin inside box -->
    <rect x="246" y="492" width="106" height="40" rx="10" fill="#f3e5f5" stroke="#7b1fa2"/>
    <text x="299" y="516" class="kfont" font-size="14" text-anchor="middle" fill="#4a148c">References</text>

    <!-- Ideas → Outputs Connection -->
    <line x1="110" y1="268" x2="165" y2="92"  stroke="#6b7280" marker-end="url(#arrowhead)"/>
    <line x1="110" y1="268" x2="266" y2="152" stroke="#6b7280" marker-end="url(#arrowhead)"/>
    <line x1="110" y1="268" x2="165" y2="212" stroke="#6b7280" marker-end="url(#arrowhead)"/>
    <line x1="110" y1="268" x2="266" y2="272" stroke="#6b7280" marker-end="url(#arrowhead)"/>
    <line x1="110" y1="268" x2="165" y2="332" stroke="#6b7280" marker-end="url(#arrowhead)"/>
    <line x1="110" y1="268" x2="266" y2="392" stroke="#6b7280" marker-end="url(#arrowhead)"/>
    <line x1="110" y1="268" x2="165" y2="452" stroke="#6b7280" marker-end="url(#arrowhead)"/>
    <line x1="110" y1="268" x2="246" y2="512" stroke="#6b7280" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Center: Structure and Appearance -->
  <g id="style" transform="translate(540,220)">
    <rect id="box-style" x="0" y="0" width="360" height="320" rx="18" fill="#eef9f0" stroke="#46b15a" stroke-width="2" class="soft"/>
    <text x="180" y="36" class="kfont" font-size="18" font-weight="700" text-anchor="middle" fill="#2e7d32">Structure and Appearance</text>

    <!-- Hub -->
    <rect x="24" y="140" width="120" height="44" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="84" y="167" class="kfont" font-size="14" text-anchor="middle" fill="#1b5e20">Structure &amp; Appearance</text>

    <!-- Items -->
    <rect x="200" y="70"  width="130" height="40" rx="10" fill="#d9f0db" stroke="#2e7d32"/>
    <text x="265" y="95"  class="kfont" font-size="14" text-anchor="middle" fill="#1b5e20">Document Structure</text>

    <rect x="200" y="120" width="130" height="40" rx="10" fill="#d9f0db" stroke="#2e7d32"/>
    <text x="265" y="145" class="kfont" font-size="14" text-anchor="middle" fill="#1b5e20">Document Format</text>

    <rect x="200" y="170" width="150" height="40" rx="10" fill="#d9f0db" stroke="#2e7d32"/>
    <text x="275" y="195" class="kfont" font-size="14" text-anchor="middle" fill="#1b5e20">Document Layout</text>

    <rect x="200" y="220" width="130" height="40" rx="10" fill="#d9f0db" stroke="#2e7d32"/>
    <text x="265" y="245" class="kfont" font-size="14" text-anchor="middle" fill="#1b5e20">Document Reference</text>

    <!-- Connection Lines -->
    <line x1="144" y1="162" x2="200" y2="90"  stroke="#6b7280" marker-end="url(#arrowhead)"/>
    <line x1="144" y1="162" x2="200" y2="140" stroke="#6b7280" marker-end="url(#arrowhead)"/>
    <line x1="144" y1="162" x2="200" y2="190" stroke="#6b7280" marker-end="url(#arrowhead)"/>
    <line x1="144" y1="162" x2="200" y2="240" stroke="#6b7280" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Right: Distribution and Sharing -->
  <g id="deploy" transform="translate(1030,220)">
    <rect id="box-deploy" x="0" y="0" width="260" height="320" rx="18" fill="#fff2e3" stroke="#ff9800" stroke-width="2" class="soft"/>
    <text x="130" y="36" class="kfont" font-size="18" font-weight="700" text-anchor="middle" fill="#e26d00">Distribution and Sharing</text>

    <!-- Deploy Hub -->
    <rect x="24" y="138" width="90" height="42" rx="10" fill="#ffe0b2" stroke="#f57c00"/>
    <text x="69" y="164" class="kfont" font-size="14" text-anchor="middle" fill="#e26d00">Deploy</text>

    <!-- Targets -->
    <rect x="140" y="80"  width="110" height="40" rx="10" fill="#ffd7c7" stroke="#f57c00"/>
    <text x="195" y="105" class="kfont" font-size="13" text-anchor="middle" fill="#bf360c">Reader (Human)</text>

    <rect x="140" y="140" width="110" height="40" rx="10" fill="#ffd7c7" stroke="#f57c00"/>
    <text x="195" y="165" class="kfont" font-size="13" text-anchor="middle" fill="#bf360c">Reader (Author)</text>

    <rect x="140" y="200" width="110" height="40" rx="10" fill="#ffd7c7" stroke="#f57c00"/>
    <text x="195" y="225" class="kfont" font-size="13" text-anchor="middle" fill="#bf360c">Reader (Machine)</text>

    <!-- Connection Lines -->
    <line x1="114" y1="159" x2="140" y2="100" stroke="#6b7280" marker-end="url(#arrowhead)"/>
    <line x1="114" y1="159" x2="140" y2="160" stroke="#6b7280" marker-end="url(#arrowhead)"/>
    <line x1="114" y1="159" x2="140" y2="220" stroke="#6b7280" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Top Broken Line (ChatGPT → Each Section Top Center Exact Connection) -->
  <!-- Writing top-center: x=80+180=260, y=180 -->
  <polyline class="lane" points="700,110 700,160 260,160 260,180"/>
  <!-- Structure and Appearance top-center: x=540+180=720, y=220 -->
  <polyline class="lane" points="700,110 700,160 720,160 720,220"/>
  <!-- Distribution and Sharing top-center: x=1030+130=1160, y=220 -->
  <polyline class="lane" points="700,110 700,160 1160,160 1160,220"/>
</svg>
