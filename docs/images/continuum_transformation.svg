<svg viewBox="0 0 1150 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="traditionalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8F4FD"/>
      <stop offset="100%" style="stop-color:#2196F3"/>
    </linearGradient>

    <linearGradient id="dataScienceGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFF3E0"/>
      <stop offset="100%" style="stop-color:#FF9800"/>
    </linearGradient>

    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F3E5F5"/>
      <stop offset="100%" style="stop-color:#9C27B0"/>
    </linearGradient>

    <linearGradient id="mlopsGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8F5E8"/>
      <stop offset="100%" style="stop-color:#4CAF50"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="1200" fill="white"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#333">
    The Evolution of Data Continuum: Traditional → Data Science → AI Era
  </text>

  <!-- Era Labels -->
  <text x="120" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2196F3">Traditional Era</text>
  <text x="320" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FF9800">Data Science Era</text>
  <text x="520" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4CAF50">MLOps Era</text>
  <text x="720" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#9C27B0">AI Era (2020+)</text>
  <text x="970" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E91E63">Future Vision</text>

  <!-- AI Milestones Above AI Era -->
  <text x="680" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#9C27B0">GPT-3</text>
  <text x="750" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#9C27B0">ChatGPT</text>
  <text x="820" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#9C27B0">Claude</text>

  <!-- Timeline -->
  <line x1="50" y1="110" x2="1070" y2="110" stroke="#666" stroke-width="3"/>
  <circle cx="50" cy="110" r="6" fill="#2196F3"/>
  <circle cx="250" cy="110" r="6" fill="#FF9800"/>
  <circle cx="450" cy="110" r="6" fill="#4CAF50"/>
  <circle cx="650" cy="110" r="6" fill="#9C27B0"/>
  <circle cx="1070" cy="110" r="6" fill="#E91E63"/>

  <!-- Timeline Labels -->
  <text x="50" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">1970s-1990s</text>
  <text x="250" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">2010s</text>
  <text x="450" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">2015-2020</text>
  <text x="650" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">2020</text>
  <text x="1070" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">2025+</text>

  <!-- Traditional Era Box -->
  <rect x="50" y="160" width="180" height="200" fill="url(#traditionalGradient)" stroke="#2196F3" stroke-width="2" rx="8"/>
  <text x="140" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976D2">Sequential Process</text>
  <text x="65" y="210" font-family="Arial, sans-serif" font-size="11" fill="#333">7 Stages:</text>
  <text x="65" y="225" font-family="Arial, sans-serif" font-size="10" fill="#555">• Acquire → Integrate</text>
  <text x="65" y="240" font-family="Arial, sans-serif" font-size="10" fill="#555">• Surface → Report</text>
  <text x="65" y="255" font-family="Arial, sans-serif" font-size="10" fill="#555">• Storytell → Decide</text>
  <text x="65" y="270" font-family="Arial, sans-serif" font-size="10" fill="#555">• Take Action</text>

  <text x="65" y="290" font-family="Arial, sans-serif" font-size="10" fill="#666">Timeline: 2-6 months</text>
  <text x="65" y="305" font-family="Arial, sans-serif" font-size="10" fill="#666">Tools: Excel, SPSS*</text>
  <text x="65" y="320" font-family="Arial, sans-serif" font-size="10" fill="#666">Authority: Human-driven</text>
  <text x="65" y="335" font-family="Arial, sans-serif" font-size="10" fill="#666">Process: Linear, Manual</text>
  <text x="65" y="350" font-family="Arial, sans-serif" font-size="9" fill="#999">*SPSS 1960s, Excel 1985</text>

  <!-- Data Science Era Box -->
  <rect x="250" y="160" width="180" height="200" fill="url(#dataScienceGradient)" stroke="#FF9800" stroke-width="2" rx="8"/>
  <text x="340" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F57C00">Consolidated Process</text>
  <text x="265" y="210" font-family="Arial, sans-serif" font-size="11" fill="#333">4 Merged Stages:</text>
  <text x="265" y="225" font-family="Arial, sans-serif" font-size="10" fill="#555">• Acquire+Integrate</text>
  <text x="265" y="240" font-family="Arial, sans-serif" font-size="10" fill="#555">• Surface+Report</text>
  <text x="265" y="255" font-family="Arial, sans-serif" font-size="10" fill="#555">• Storytell → Decide</text>
  <text x="265" y="270" font-family="Arial, sans-serif" font-size="10" fill="#555">• Take Action</text>

  <text x="265" y="290" font-family="Arial, sans-serif" font-size="10" fill="#666">Timeline: Days-Weeks</text>
  <text x="265" y="305" font-family="Arial, sans-serif" font-size="10" fill="#666">Tools: Python, R, Jupyter</text>
  <text x="265" y="320" font-family="Arial, sans-serif" font-size="10" fill="#666">Authority: Human-driven</text>
  <text x="265" y="335" font-family="Arial, sans-serif" font-size="10" fill="#666">Process: Automated ETL</text>

  <!-- MLOps Era Box -->
  <rect x="450" y="160" width="180" height="200" fill="url(#mlopsGradient)" stroke="#4CAF50" stroke-width="2" rx="8"/>
  <text x="540" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">Hybrid Process</text>
  <text x="465" y="210" font-family="Arial, sans-serif" font-size="11" fill="#333">CI/CD Integration:</text>
  <text x="465" y="225" font-family="Arial, sans-serif" font-size="10" fill="#555">• Automated Pipelines</text>
  <text x="465" y="240" font-family="Arial, sans-serif" font-size="10" fill="#555">• Model Versioning</text>
  <text x="465" y="255" font-family="Arial, sans-serif" font-size="10" fill="#555">• A/B Testing</text>
  <text x="465" y="270" font-family="Arial, sans-serif" font-size="10" fill="#555">• Human Oversight</text>

  <text x="465" y="290" font-family="Arial, sans-serif" font-size="10" fill="#666">Timeline: Hours-Days</text>
  <text x="465" y="305" font-family="Arial, sans-serif" font-size="10" fill="#666">Tools: Docker, K8s, Git</text>
  <text x="465" y="320" font-family="Arial, sans-serif" font-size="10" fill="#666">Authority: Human+ML</text>
  <text x="465" y="335" font-family="Arial, sans-serif" font-size="10" fill="#666">Process: CI/CD Pipeline</text>

  <!-- AI Era Box -->
  <rect x="650" y="160" width="200" height="200" fill="url(#aiGradient)" stroke="#9C27B0" stroke-width="2" rx="8"/>
  <text x="750" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7B1FA2">Compressed Stages</text>
  <text x="665" y="210" font-family="Arial, sans-serif" font-size="11" fill="#333">Accelerated Processing:</text>
  <text x="665" y="225" font-family="Arial, sans-serif" font-size="10" fill="#555">• Real-time Ingestion</text>
  <text x="665" y="240" font-family="Arial, sans-serif" font-size="10" fill="#555">• Automated Analysis</text>
  <text x="665" y="255" font-family="Arial, sans-serif" font-size="10" fill="#555">• AI-Recommended Actions</text>
  <text x="665" y="270" font-family="Arial, sans-serif" font-size="10" fill="#555">• Human Oversight Loop</text>

  <text x="665" y="290" font-family="Arial, sans-serif" font-size="10" fill="#666">Timeline: Near Real-time</text>
  <text x="665" y="305" font-family="Arial, sans-serif" font-size="10" fill="#666">Tools: LLMs, Agents</text>
  <text x="665" y="320" font-family="Arial, sans-serif" font-size="10" fill="#666">Authority: AI+Human</text>
  <text x="665" y="335" font-family="Arial, sans-serif" font-size="10" fill="#666">Process: Supervised AI</text>

  <!-- Future State Box -->
  <g transform="translate(30, 0)">
    <rect x="870" y="160" width="200" height="200" fill="#F8BBD9" stroke="#E91E63" stroke-width="2" rx="8" stroke-dasharray="10,5"/>
    <text x="970" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C2185B">Future Vision</text>
    <text x="885" y="210" font-family="Arial, sans-serif" font-size="11" fill="#333">Autonomous Loop:</text>
    <text x="885" y="225" font-family="Arial, sans-serif" font-size="10" fill="#555">• AI ↔ AI Communication</text>
    <text x="885" y="240" font-family="Arial, sans-serif" font-size="10" fill="#555">• Self-Optimizing Systems</text>
    <text x="885" y="255" font-family="Arial, sans-serif" font-size="10" fill="#555">• Emergent Intelligence</text>
    <text x="885" y="270" font-family="Arial, sans-serif" font-size="10" fill="#555">• Governed Autonomy</text>

    <text x="885" y="290" font-family="Arial, sans-serif" font-size="10" fill="#666">Timeline: Continuous</text>
    <text x="885" y="305" font-family="Arial, sans-serif" font-size="10" fill="#666">Tools: AGI, Quantum</text>
    <text x="885" y="320" font-family="Arial, sans-serif" font-size="10" fill="#666">Authority: AI+Governance</text>
    <text x="885" y="335" font-family="Arial, sans-serif" font-size="10" fill="#666">Process: Regulated Auto</text>    
  </g>

  <!-- Arrows -->
  <path d="M 220 260 L 250 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 420 260 L 450 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 620 260 L 650 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 840 260 L 900 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
     refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Key Insight -->
  <g transform="translate(0, -370)">
    <rect x="200" y="750" width="800" height="60" fill="#E8F5E8" stroke="#4CAF50" stroke-width="3" rx="8"/>
    <text x="600" y="775" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
      💡 Traditional and AI models coexist - compression not replacement
    </text>
    <text x="600" y="795" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#388E3C">
      AI accelerates stages through automation while maintaining governance structures
    </text>
  </g>

  <!-- Transformation Cards -->
  <g transform="translate(-30, 0)">
    <rect x="100" y="450" width="250" height="120" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="8"/>
    <text x="225" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976D2">From Sequential to Parallel</text>
    <text x="120" y="495" font-family="Arial, sans-serif" font-size="12" fill="#333">• All stages happen simultaneously</text>
    <text x="120" y="510" font-family="Arial, sans-serif" font-size="12" fill="#333">• No waiting for previous stage</text>
    <text x="120" y="525" font-family="Arial, sans-serif" font-size="12" fill="#333">• Continuous feedback loops</text>
    <text x="120" y="540" font-family="Arial, sans-serif" font-size="12" fill="#333">• Real-time optimization</text>
    <text x="120" y="560" font-family="Arial, sans-serif" font-size="13" fill="#FF5722">⚡ Speed: Months → Milliseconds</text>
  </g>

  <g transform="translate(-30, 0)">
    <rect x="365" y="450" width="270" height="120" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" rx="8"/>
    <text x="500" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F57C00">From Human to AI-Assisted Authority</text>
    <text x="395" y="495" font-family="Arial, sans-serif" font-size="12" fill="#333">• AI recommends decisions</text>
    <text x="395" y="510" font-family="Arial, sans-serif" font-size="12" fill="#333">• Humans retain final authority</text>
    <text x="395" y="525" font-family="Arial, sans-serif" font-size="12" fill="#333">• Compliance/safety oversight</text>
    <text x="395" y="540" font-family="Arial, sans-serif" font-size="12" fill="#333">• Regulated autonomous actions</text>
    <text x="395" y="560" font-family="Arial, sans-serif" font-size="13" fill="#FF5722">🤖 Authority: Human+AI</text>
  </g>

  <g transform="translate(-30, 0)">
    <rect x="650" y="450" width="250" height="120" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2" rx="8"/>
    <text x="775" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7B1FA2">From Storytelling to Explainable AI</text>
    <text x="670" y="495" font-family="Arial, sans-serif" font-size="12" fill="#333">• AI-generated explanations</text>
    <text x="670" y="510" font-family="Arial, sans-serif" font-size="12" fill="#333">• Alongside actions (not after)</text>
    <text x="670" y="525" font-family="Arial, sans-serif" font-size="12" fill="#333">• Required in regulated sectors</text>
    <text x="670" y="540" font-family="Arial, sans-serif" font-size="12" fill="#333">• Emerging XAI standards</text>
    <text x="670" y="560" font-family="Arial, sans-serif" font-size="13" fill="#FF5722">📊 Communication: Explainable</text>
  </g>

  <g transform="translate(50, 0)">
    <rect x="835" y="450" width="230" height="120" fill="#FFEBEE" stroke="#F44336" stroke-width="2" rx="8"/>
    <text x="950" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#D32F2F">From Tools to Agents</text>
    <text x="845" y="495" font-family="Arial, sans-serif" font-size="12" fill="#333">• AI agents replace tools</text>
    <text x="845" y="510" font-family="Arial, sans-serif" font-size="12" fill="#333">• Autonomous task completion</text>
    <text x="845" y="525" font-family="Arial, sans-serif" font-size="12" fill="#333">• Multi-modal processing</text>
    <text x="845" y="540" font-family="Arial, sans-serif" font-size="12" fill="#333">• Self-improving capabilities</text>
    <text x="845" y="560" font-family="Arial, sans-serif" font-size="13" fill="#FF5722">🔧 Tools → 🤖 Agents</text>
  </g>

</svg>