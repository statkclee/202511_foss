<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 800">
  <defs>
    <!-- Data Engineer colors (Blue shades) -->
    <linearGradient id="dataEngineerColor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:1" />
    </linearGradient>

    <!-- ML Engineer colors (Pink shades) -->
    <linearGradient id="mlEngineerColor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E91E63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C2185B;stop-opacity:1" />
    </linearGradient>

    <!-- Data Analyst colors (Green shades) -->
    <linearGradient id="dataAnalystColor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="800" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2C3E50">
    Data Science Era: Team Capabilities
  </text>
  <text x="600" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7F8C8D">
    Complementary skills create comprehensive data science capability
  </text>

  <!-- Individual Profiles Section -->
  <g transform="translate(0, 100)">
    <!-- Data Engineer Profile -->
    <g transform="translate(50, 20)">
      <rect x="-10" y="-10" width="320" height="180" fill="white" stroke="#BDC3C7" stroke-width="1" rx="5"/>
      <text x="150" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
        Data Engineer Profile
      </text>

      <!-- Grid lines -->
      <g stroke="#E8E8E8" stroke-width="0.5">
        <line x1="10" y1="30" x2="290" y2="30"/>
        <line x1="10" y1="60" x2="290" y2="60"/>
        <line x1="10" y1="90" x2="290" y2="90"/>
        <line x1="10" y1="120" x2="290" y2="120"/>
        <line x1="10" y1="150" x2="290" y2="150"/>
      </g>

      <!-- Bars -->
      <rect x="10" y="140" width="25" height="10" fill="url(#dataEngineerColor)"/>  <!-- Data Viz: Low -->
      <rect x="50" y="120" width="25" height="30" fill="url(#dataEngineerColor)"/>  <!-- ML: Medium -->
      <rect x="90" y="110" width="25" height="40" fill="url(#dataEngineerColor)"/>  <!-- Math: Medium-High -->
      <rect x="130" y="100" width="25" height="50" fill="url(#dataEngineerColor)"/> <!-- Stats: High -->
      <rect x="170" y="50" width="25" height="100" fill="url(#dataEngineerColor)"/> <!-- CS: Very High -->
      <rect x="210" y="130" width="25" height="20" fill="url(#dataEngineerColor)"/> <!-- Comm: Low-Medium -->
      <rect x="250" y="125" width="25" height="25" fill="url(#dataEngineerColor)"/> <!-- Domain: Medium -->

      <!-- Labels -->
      <text x="22" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Data Viz</text>
      <text x="62" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">ML</text>
      <text x="102" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Math</text>
      <text x="142" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Stats</text>
      <text x="182" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">CS</text>
      <text x="222" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Comm</text>
      <text x="262" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Domain</text>
    </g>

    <!-- ML Engineer Profile -->
    <g transform="translate(420, 20)">
      <rect x="-10" y="-10" width="320" height="180" fill="white" stroke="#BDC3C7" stroke-width="1" rx="5"/>
      <text x="150" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
        ML Engineer Profile
      </text>

      <!-- Grid lines -->
      <g stroke="#E8E8E8" stroke-width="0.5">
        <line x1="10" y1="30" x2="290" y2="30"/>
        <line x1="10" y1="60" x2="290" y2="60"/>
        <line x1="10" y1="90" x2="290" y2="90"/>
        <line x1="10" y1="120" x2="290" y2="120"/>
        <line x1="10" y1="150" x2="290" y2="150"/>
      </g>

      <!-- Bars -->
      <rect x="10" y="130" width="25" height="20" fill="url(#mlEngineerColor)"/>  <!-- Data Viz: Medium -->
      <rect x="50" y="40" width="25" height="110" fill="url(#mlEngineerColor)"/> <!-- ML: Very High -->
      <rect x="90" y="60" width="25" height="90" fill="url(#mlEngineerColor)"/>  <!-- Math: High -->
      <rect x="130" y="70" width="25" height="80" fill="url(#mlEngineerColor)"/> <!-- Stats: High -->
      <rect x="170" y="90" width="25" height="60" fill="url(#mlEngineerColor)"/> <!-- CS: High -->
      <rect x="210" y="135" width="25" height="15" fill="url(#mlEngineerColor)"/> <!-- Comm: Low -->
      <rect x="250" y="140" width="25" height="10" fill="url(#mlEngineerColor)"/> <!-- Domain: Low -->

      <!-- Labels -->
      <text x="22" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Data Viz</text>
      <text x="62" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">ML</text>
      <text x="102" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Math</text>
      <text x="142" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Stats</text>
      <text x="182" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">CS</text>
      <text x="222" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Comm</text>
      <text x="262" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Domain</text>
    </g>

    <!-- Data Analyst Profile -->
    <g transform="translate(790, 20)">
      <rect x="-10" y="-10" width="320" height="180" fill="white" stroke="#BDC3C7" stroke-width="1" rx="5"/>
      <text x="150" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
        Data Analyst Profile
      </text>

      <!-- Grid lines -->
      <g stroke="#E8E8E8" stroke-width="0.5">
        <line x1="10" y1="30" x2="290" y2="30"/>
        <line x1="10" y1="60" x2="290" y2="60"/>
        <line x1="10" y1="90" x2="290" y2="90"/>
        <line x1="10" y1="120" x2="290" y2="120"/>
        <line x1="10" y1="150" x2="290" y2="150"/>
      </g>

      <!-- Bars -->
      <rect x="10" y="50" width="25" height="100" fill="url(#dataAnalystColor)"/>  <!-- Data Viz: Very High -->
      <rect x="50" y="125" width="25" height="25" fill="url(#dataAnalystColor)"/>  <!-- ML: Medium -->
      <rect x="90" y="110" width="25" height="40" fill="url(#dataAnalystColor)"/>  <!-- Math: Medium-High -->
      <rect x="130" y="80" width="25" height="70" fill="url(#dataAnalystColor)"/>  <!-- Stats: High -->
      <rect x="170" y="120" width="25" height="30" fill="url(#dataAnalystColor)"/>  <!-- CS: Medium -->
      <rect x="210" y="70" width="25" height="80" fill="url(#dataAnalystColor)"/>  <!-- Comm: High -->
      <rect x="250" y="60" width="25" height="90" fill="url(#dataAnalystColor)"/>  <!-- Domain: Very High -->

      <!-- Labels -->
      <text x="22" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Data Viz</text>
      <text x="62" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">ML</text>
      <text x="102" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Math</text>
      <text x="142" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Stats</text>
      <text x="182" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">CS</text>
      <text x="222" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Comm</text>
      <text x="262" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Domain</text>
    </g>
  </g>

  <!-- Team Message -->
  <g transform="translate(-50, 320)">
    <!-- Curved arrow -->
    <path d="M 200 50 Q 400 20 500 50 Q 600 20 800 50 Q 900 20 1000 50"
          stroke="#7F8C8D" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Arrow marker -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7"
              refX="10" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#7F8C8D"/>
      </marker>
    </defs>

    <text x="600" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#E74C3C">
      No one person can be the perfect data scientist, so we need teams.
    </text>
  </g>

  <!-- Combined Team Profile -->
  <g transform="translate(100, 450)">
    <rect x="-30" y="-20" width="1000" height="300" fill="white" stroke="#BDC3C7" stroke-width="2" rx="8"/>
    <text x="485" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">
      Combined Data Science Team Profile
    </text>

    <!-- Grid lines -->
    <g stroke="#E8E8E8" stroke-width="1">
      <line x1="80" y1="40" x2="900" y2="40"/>
      <line x1="80" y1="80" x2="900" y2="80"/>
      <line x1="80" y1="120" x2="900" y2="120"/>
      <line x1="80" y1="160" x2="900" y2="160"/>
      <line x1="80" y1="200" x2="900" y2="200"/>
      <line x1="80" y1="240" x2="900" y2="240"/>
    </g>

    <!-- Baseline -->
    <line x1="80" y1="130" x2="900" y2="130" stroke="#2C3E50" stroke-width="2"/>

    <!-- Y-axis labels -->
    <text x="70" y="45" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">High</text>
    <text x="70" y="125" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">Medium</text>
    <text x="70" y="205" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">Low</text>

    <!-- Stacked bars -->
    <!-- Data Visualization -->
    <g transform="translate(130, 0)">
      <rect x="0" y="120" width="45" height="80" fill="url(#dataAnalystColor)"/>   <!-- Analyst contribution -->
      <rect x="0" y="200" width="45" height="20" fill="url(#mlEngineerColor)"/>   <!-- ML Engineer contribution -->
      <rect x="0" y="220" width="45" height="20" fill="url(#dataEngineerColor)"/> <!-- Data Engineer contribution -->
      <text x="22" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">Data Viz</text>
    </g>

    <!-- Machine Learning -->
    <g transform="translate(250, 0)">
      <rect x="0" y="60" width="45" height="110" fill="url(#mlEngineerColor)"/>   <!-- ML Engineer contribution -->
      <rect x="0" y="170" width="45" height="30" fill="url(#dataEngineerColor)"/> <!-- Data Engineer contribution -->
      <rect x="0" y="200" width="45" height="40" fill="url(#dataAnalystColor)"/>  <!-- Analyst contribution -->
      <text x="22" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">Machine Learning</text>
    </g>

    <!-- Mathematics -->
    <g transform="translate(370, 0)">
      <rect x="0" y="80" width="45" height="90" fill="url(#mlEngineerColor)"/>    <!-- ML Engineer contribution -->
      <rect x="0" y="170" width="45" height="40" fill="url(#dataEngineerColor)"/> <!-- Data Engineer contribution -->
      <rect x="0" y="210" width="45" height="30" fill="url(#dataAnalystColor)"/>  <!-- Analyst contribution -->
      <text x="22" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">Mathematics</text>
    </g>

    <!-- Statistics -->
    <g transform="translate(490, 0)">
      <rect x="0" y="70" width="45" height="80" fill="url(#mlEngineerColor)"/>    <!-- ML Engineer contribution -->
      <rect x="0" y="150" width="45" height="50" fill="url(#dataEngineerColor)"/> <!-- Data Engineer contribution -->
      <rect x="0" y="200" width="45" height="40" fill="url(#dataAnalystColor)"/>  <!-- Analyst contribution -->
      <text x="22" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">Statistics</text>
    </g>

    <!-- Computer Science -->
    <g transform="translate(610, 0)">
      <rect x="0" y="60" width="45" height="100" fill="url(#dataEngineerColor)"/> <!-- Data Engineer contribution -->
      <rect x="0" y="160" width="45" height="60" fill="url(#mlEngineerColor)"/>   <!-- ML Engineer contribution -->
      <rect x="0" y="220" width="45" height="20" fill="url(#dataAnalystColor)"/>  <!-- Analyst contribution -->
      <text x="22" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">Computer Science</text>
    </g>

    <!-- Communication -->
    <g transform="translate(730, 0)">
      <rect x="0" y="120" width="45" height="80" fill="url(#dataAnalystColor)"/>  <!-- Analyst contribution -->
      <rect x="0" y="200" width="45" height="20" fill="url(#dataEngineerColor)"/> <!-- Data Engineer contribution -->
      <rect x="0" y="220" width="45" height="20" fill="url(#mlEngineerColor)"/>   <!-- ML Engineer contribution -->
      <text x="22" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">Communication</text>
    </g>

    <!-- Domain Expertise -->
    <g transform="translate(850, 0)">
      <rect x="0" y="110" width="45" height="90" fill="url(#dataAnalystColor)"/>  <!-- Analyst contribution -->
      <rect x="0" y="200" width="45" height="25" fill="url(#dataEngineerColor)"/> <!-- Data Engineer contribution -->
      <rect x="0" y="225" width="45" height="15" fill="url(#mlEngineerColor)"/>   <!-- ML Engineer contribution -->
      <text x="22" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">Domain Expertise</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(450, 750)">
    <rect x="0" y="0" width="20" height="15" fill="url(#dataEngineerColor)"/>
    <text x="25" y="12" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Data Engineer</text>

    <rect x="120" y="0" width="20" height="15" fill="url(#mlEngineerColor)"/>
    <text x="145" y="12" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">ML Engineer</text>

    <rect x="240" y="0" width="20" height="15" fill="url(#dataAnalystColor)"/>
    <text x="265" y="12" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Data Analyst</text>
  </g>

</svg>