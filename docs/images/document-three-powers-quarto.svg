<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Quarto: Author ↔ Execute ↔ Interpret</title>
  <desc id="desc">Cleaned layout with consistent fonts, emoji sizing, and arrow markers. Central Quarto logo with three surrounding phases: Author, Execute, Interpret.</desc>

  <!-- ====== GLOBAL STYLES & DEFS ====== -->
  <defs>
    <style><![CDATA[
      .bg { fill:#f8f9fa; }
      .stroke-1 { stroke-width:1.5; }
      .stroke-2 { stroke-width:2; }
      .stroke-3 { stroke-width:3; }
      .cap-round { stroke-linecap:round; stroke-linejoin:round; }

      /* Font stacks: prefer IBM Plex Sans KR, fallbacks; emoji fonts explicit */
      .label {
        font-family: 'IBM Plex Sans KR','Noto Sans KR','Apple SD Gothic Neo','Segoe UI',system-ui,sans-serif;
        font-size: 15px; font-weight: 700; fill:#0f1f3a;
      }
      .emoji {
        font-family: 'Apple Color Emoji','Noto Color Emoji','Segoe UI Emoji','Twemoji Mozilla';
        font-size: 17px; dominant-baseline: middle; paint-order: stroke; stroke: transparent; stroke-width: 0;
      }
      .small { font-size: 12px; }
      .muted { opacity: .55; }

      .q-stroke { stroke:#174F99; }
      .q-fill   { fill:#174F99; }
      .q-accent { fill:#9795E6; }
      .accent-yellow { stroke:#f39c12; fill:none; }

      .panel { fill:#ffffff; stroke:#174F99; stroke-width:2; rx:6; }
    ]]></style>

    <!-- Arrow markers -->
    <marker id="mk-yellow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/>
    </marker>
    <marker id="mk-purple" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9795E6"/>
    </marker>
  </defs>

  <!-- ====== BACKGROUND ====== -->
  <rect class="bg" x="0" y="0" width="600" height="400"/>

  <!-- ====== CENTRAL: QUARTO LOGO ====== -->
  <g id="quarto-center" transform="translate(250,150)">
    <!-- Quarto official logo -->
    <g transform="scale(3.5)">
      <path fill="#174F99" stroke="#174F99" stroke-miterlimit="10" stroke-width="1.5" d="M11.25,11.25V0.85A12,12,0,0,0,0.85,11.25Z"/>
      <path fill="#174F99" stroke="#174F99" stroke-miterlimit="10" stroke-width="1.5" d="M14.25,11.25H24.64A12,12,0,0,0,14.25,0.85Z"/>
      <path fill="#174F99" stroke="#174F99" stroke-miterlimit="10" stroke-width="1.5" d="M14.25,14.25V24.65A12,12,0,0,0,24.64,14.25Z"/>
      <path fill="#174F99" stroke="#174F99" stroke-miterlimit="10" stroke-width="1.5" d="M11.25,14.25H0.85A12,12,0,0,0,11.25,24.65Z"/>
    </g>
  </g>

  <!-- ====== NODES (author / interpret / execute) ====== -->
  <!-- AUTHOR (top center) -->
  <g id="node-author" transform="translate(300,72)">
    <!-- paper -->
    <rect x="-30" y="-18" width="76" height="46" class="panel"/>
    <line x1="-24" y1="-8" x2="36" y2="-8" class="q-stroke stroke-1 cap-round"/>
    <line x1="-24" y1="0"  x2="28" y2="0"  class="q-stroke stroke-1 cap-round"/>
    <line x1="-24" y1="8"  x2="32" y2="8"  class="q-stroke stroke-1 cap-round"/>
    <line x1="-24" y1="16" x2="24" y2="16" class="q-stroke stroke-1 cap-round"/>
    <!-- pen -->
    <g transform="translate(18,0)">
      <rect x="-2" y="-22" width="4" height="28" fill="#8B4513"/>
      <polygon points="0,6 -4,16 4,16" fill="#2c3e50"/>
      <circle cx="0" cy="20" r="2.2" fill="#1a252f"/>
    </g>
  </g>
  <text x="300" y="40" text-anchor="middle" class="label">
    <tspan class="emoji" dy="0">📝</tspan>
    <tspan dx="6">문서 저작</tspan>
  </text>

  <!-- INTERPRET (left center) -->
  <g id="node-interpret" transform="translate(120,270)">
    <!-- brain -->
    <path d="M-20,-18 C-6,-32 26,-32 40,-18 C46,-11 46,5 40,18 C34,30 26,38 10,38 C-6,38 -14,30 -20,18 C-26,5 -26,-11 -20,-18 Z" fill="#6c757d" stroke="#555" class="stroke-2 cap-round"/>
    <path d="M-14,-10 C0,-15 18,-12 32,-6" fill="none" stroke="#777" class="stroke-2 cap-round"/>
    <path d="M-18,0 C-4,-5 16,-2 34,5" fill="none" stroke="#777" class="stroke-2 cap-round"/>
    <path d="M-14,10 C0,6 18,9 32,16" fill="none" stroke="#777" class="stroke-2 cap-round"/>
    <!-- bulb -->
    <g transform="translate(52,-10)">
      <circle cx="0" cy="0" r="9" fill="#f39c12" opacity="0.35"/>
      <path d="M0,-9 L-2,-13 L2,-13 Z" fill="#f39c12"/>
      <line x1="-1" y1="9" x2="1" y2="9" stroke="#f39c12" class="stroke-2 cap-round"/>
    </g>
  </g>
  <text x="120" y="235" text-anchor="middle" class="label">
    <tspan class="emoji" dy="0">🧠</tspan>
    <tspan dx="6">문서 해석</tspan>
  </text>

  <!-- EXECUTE (right center) -->
  <g id="node-execute" transform="translate(480,270)">
    <!-- gear 1 -->
    <g transform="translate(26,14)">
      <circle cx="0" cy="0" r="15" fill="#dc2626" stroke="#a41e22" class="stroke-2"/>
      <polygon points="0,-18 4,-12 -4,-12" fill="#a41e22"/>
      <polygon points="18,0 12,4 12,-4" fill="#a41e22"/>
      <polygon points="0,18 -4,12 4,12" fill="#a41e22"/>
      <polygon points="-18,0 -12,-4 -12,4" fill="#a41e22"/>
      <circle cx="0" cy="0" r="6" fill="#a41e22"/>
    </g>
    <!-- gear 2 -->
    <g transform="translate(2,-6)">
      <circle cx="0" cy="0" r="10" fill="#28a745" stroke="#1e7e34" class="stroke-2"/>
      <polygon points="0,-12 3,-8 -3,-8" fill="#1e7e34"/>
      <polygon points="12,0 8,3 8,-3" fill="#1e7e34"/>
      <polygon points="0,12 -3,8 3,8" fill="#1e7e34"/>
      <polygon points="-12,0 -8,-3 -8,3" fill="#1e7e34"/>
      <circle cx="0" cy="0" r="4" fill="#1e7e34"/>
    </g>
    <!-- forward hint arrow -->
    <path d="M56,4 L86,4" class="stroke-3 cap-round" stroke="#9795E6" marker-end="url(#mk-purple)"/>
  </g>
  <text x="480" y="235" text-anchor="middle" class="label">
    <tspan class="emoji" dy="0">⚙️</tspan>
    <tspan dx="6">문서 실행</tspan>
  </text>

  <!-- ====== CYCLIC ARROWS ====== -->
  <!-- Circular flow: clockwise rotation -->
  <!-- Author to Execute (upper right arc) -->
  <path d="M340,90 A100,100 0 0,1 460,240" class="accent-yellow stroke-3 cap-round" marker-end="url(#mk-yellow)"/>
  <!-- Execute to Interpret (lower arc) -->
  <path d="M440,290 A100,100 0 0,1 160,290" class="accent-yellow stroke-3 cap-round" marker-end="url(#mk-yellow)"/>
  <!-- Interpret to Author (upper left arc) -->
  <path d="M140,240 A100,100 0 0,1 260,90" class="accent-yellow stroke-3 cap-round" marker-end="url(#mk-yellow)"/>

  <!-- ====== CONNECTORS TO CENTER ====== -->
  <line x1="300" y1="100" x2="300" y2="156" class="q-stroke stroke-2 cap-round" opacity="0.5"/>
  <line x1="160" y1="270" x2="270" y2="210" class="stroke-2 cap-round" stroke="#6c757d" opacity="0.5"/>
  <line x1="440" y1="270" x2="330" y2="210" class="stroke-2 cap-round" stroke="#dc2626" opacity="0.5"/>
</svg>
