<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700">
  <defs>
    <style><![CDATA[
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 36px; font-weight: 900; fill: #f8fafc; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #cbd5e1; }
      .category { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; }
      .innovation { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #e5e7eb; }
      .year { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: bolder; fill: #fbbf24; }
      .timeline-year { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #9ca3af; }
      .ai-text { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 900; fill: #ffffff; }
      .source { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #9ca3af; }
    ]]></style>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Category gradients -->
    <linearGradient id="observational" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="1"/>
    </linearGradient>
    
    <linearGradient id="analytical" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="1"/>
    </linearGradient>
    
    <linearGradient id="communication" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="1"/>
    </linearGradient>
    
    <linearGradient id="organizational" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="1"/>
    </linearGradient>

    <!-- AI gradient -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="700" fill="url(#bg)"/>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" class="title">과학 발전을 위한 도구의 진화</text>
  <text x="700" y="65" text-anchor="middle" class="subtitle">Evolution of Scientific Tools → Generative AI Integration</text>

  <!-- Timeline axis -->
  <line x1="120" y1="90" x2="1200" y2="90" stroke="#4b5563" stroke-width="2"/>
  
  <!-- Year markers -->
  <line x1="120" y1="85" x2="120" y2="95" stroke="#4b5563" stroke-width="2"/>
  <text x="120" y="110" text-anchor="middle" class="timeline-year">1400</text>
  
  <line x1="300" y1="85" x2="300" y2="95" stroke="#4b5563" stroke-width="2"/>
  <text x="300" y="110" text-anchor="middle" class="timeline-year">1600</text>
  
  <line x1="600" y1="85" x2="600" y2="95" stroke="#4b5563" stroke-width="2"/>
  <text x="600" y="110" text-anchor="middle" class="timeline-year">1800</text>
  
  <line x1="900" y1="85" x2="900" y2="95" stroke="#4b5563" stroke-width="2"/>
  <text x="900" y="110" text-anchor="middle" class="timeline-year">1900</text>
  
  <line x1="1050" y1="85" x2="1050" y2="95" stroke="#4b5563" stroke-width="2"/>
  <text x="1050" y="110" text-anchor="middle" class="timeline-year">2000</text>
  
  <line x1="1200" y1="85" x2="1200" y2="95" stroke="#4b5563" stroke-width="2"/>
  <text x="1200" y="110" text-anchor="middle" class="timeline-year">2020+</text>

  <!-- Category tracks -->
  <!-- Observational Tools Track -->
  <g transform="translate(0,140)">
    <rect x="50" y="0" width="1100" height="120" rx="10" fill="url(#observational)" opacity="0.1"/>
    <text x="70" y="25" class="category" fill="#3b82f6">🔭 관찰 도구</text>
    <text x="70" y="45" class="innovation" fill="#93c5fd">Observational Tools</text>
    
    <!-- Evolution line -->
    <line x1="280" y1="60" x2="1000" y2="60" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
    
    <!-- Innovations -->
    <g transform="translate(280,60)">
      <circle cx="0" cy="0" r="6" fill="#3b82f6" filter="url(#glow)"/>
      <text x="0" y="-25" text-anchor="middle" class="innovation">망원경</text>
      <text x="0" y="-10" text-anchor="middle" class="year">1608</text>
    </g>
    
    <g transform="translate(290,80)">
      <circle cx="0" cy="0" r="5" fill="#3b82f6" filter="url(#glow)"/>
      <text x="0" y="25" text-anchor="middle" class="innovation">현미경</text>
      <text x="0" y="40" text-anchor="middle" class="year">1620</text>
    </g>
    
    <g transform="translate(320,40)">
      <circle cx="0" cy="0" r="5" fill="#3b82f6" filter="url(#glow)"/>
      <text x="0" y="-25" text-anchor="middle" class="innovation">진자시계</text>
      <text x="0" y="-10" text-anchor="middle" class="year">1656</text>
    </g>
    
    <g transform="translate(1000,60)">
      <circle cx="0" cy="0" r="6" fill="#3b82f6" filter="url(#glow)"/>
      <text x="0" y="-30" text-anchor="middle" class="innovation">DNA시퀀서</text>
      <text x="0" y="-10" text-anchor="middle" class="year">1973</text>
    </g>
    
    <!-- Arrow to AI -->
    <line x1="1100" y1="60" x2="1180" y2="60" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)" opacity="0.7"/>
  </g>

  <!-- Analytical Tools Track -->
  <g transform="translate(0,280)">
    <rect x="50" y="0" width="1100" height="120" rx="10" fill="url(#analytical)" opacity="0.1"/>
    <text x="70" y="25" class="category" fill="#10b981">💻 분석 도구</text>
    <text x="70" y="45" class="innovation" fill="#6ee7b7">Analytical Tools</text>
    
    <!-- Evolution line -->
    <line x1="950" y1="60" x2="1080" y2="60" stroke="#10b981" stroke-width="2" opacity="0.5"/>
    
    <!-- Innovations -->
    <g transform="translate(950,60)">
      <circle cx="0" cy="0" r="6" fill="#10b981" filter="url(#glow)"/>
      <text x="0" y="-30" text-anchor="middle" class="innovation">메인프레임</text>
      <text x="0" y="-10" text-anchor="middle" class="year">1964</text>
    </g>
    
    <g transform="translate(1020,40)">
      <circle cx="0" cy="0" r="5" fill="#10b981" filter="url(#glow)"/>
      <text x="0" y="-30" text-anchor="middle" class="innovation">PC</text>
      <text x="0" y="-10" text-anchor="middle" class="year">1981</text>
    </g>
    
    <g transform="translate(1080,80)">
      <circle cx="0" cy="-10" r="6" fill="#10b981" filter="url(#glow)"/>
      <text x="0" y="15" text-anchor="middle" class="innovation">머신러닝</text>
      <text x="0" y="35" text-anchor="middle" class="year">1998</text>
    </g>
    
    <!-- Arrow to AI -->
    <line x1="1100" y1="60" x2="1180" y2="60" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)" opacity="0.7"/>
  </g>

  <!-- Communication Tools Track -->
  <g transform="translate(0,420)">
    <rect x="50" y="0" width="1100" height="120" rx="10" fill="url(#communication)" opacity="0.1"/>
    <text x="70" y="25" class="category" fill="#f59e0b">📡 소통 도구</text>
    <text x="70" y="45" class="innovation" fill="#fcd34d">Communication Tools</text>
    
    <!-- Evolution line -->
    <line x1="180" y1="60" x2="1010" y2="60" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
    
    <!-- Innovations -->
    <g transform="translate(180,60)">
      <circle cx="0" cy="0" r="6" fill="#f59e0b" filter="url(#glow)"/>
      <text x="0" y="25" text-anchor="middle" class="innovation">인쇄기</text>
      <text x="0" y="45" text-anchor="middle" class="year">1439</text>
    </g>
    
    <g transform="translate(1010,60)">
      <circle cx="0" cy="0" r="6" fill="#f59e0b" filter="url(#glow)"/>
      <text x="0" y="-25" text-anchor="middle" class="innovation">인터넷</text>
      <text x="0" y="-10" text-anchor="middle" class="year">1975</text>
    </g>
    
    <!-- Arrow to AI -->
    <line x1="1100" y1="60" x2="1180" y2="60" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)" opacity="0.7"/>
  </g>

  <!-- Organizational Innovations Track -->
  <g transform="translate(0,560)">
    <rect x="50" y="0" width="1100" height="120" rx="10" fill="url(#organizational)" opacity="0.1"/>
    <text x="70" y="25" class="category" fill="#8b5cf6">🏛️ 조직 혁신</text>
    <text x="70" y="45" class="innovation" fill="#c4b5fd">Organizational Innovation</text>
    
    <!-- Evolution line -->
    <line x1="270" y1="60" x2="990" y2="60" stroke="#8b5cf6" stroke-width="2" opacity="0.5"/>
    
    <!-- Innovations -->
    <g transform="translate(270,60)">
      <circle cx="0" cy="0" r="5" fill="#8b5cf6" filter="url(#glow)"/>
      <text x="0" y="25" text-anchor="middle" class="innovation">과학학회</text>
      <text x="0" y="45" text-anchor="middle" class="year">1603</text>
    </g>
    
    <g transform="translate(920,40)">
      <circle cx="0" cy="0" r="5" fill="#8b5cf6" filter="url(#glow)"/>
      <text x="0" y="-25" text-anchor="middle" class="innovation">기업연구소</text>
      <text x="0" y="-10" text-anchor="middle" class="year">1900</text>
    </g>
    
    <g transform="translate(940,80)">
      <circle cx="0" cy="-10" r="5" fill="#8b5cf6" filter="url(#glow)"/>
      <text x="0" y="15" text-anchor="middle" class="innovation">정부연구소</text>
      <text x="0" y="35" text-anchor="middle" class="year">1923</text>
    </g>
    
    <g transform="translate(990,60)">
      <circle cx="0" cy="0" r="6" fill="#8b5cf6" filter="url(#glow)"/>
      <text x="0" y="-25" text-anchor="middle" class="innovation">빅사이언스</text>
      <text x="0" y="-10" text-anchor="middle" class="year">1961</text>
    </g>
    
    <!-- Arrow to AI -->
    <line x1="1100" y1="60" x2="1180" y2="60" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow)" opacity="0.7"/>
  </g>

  <!-- Central AI Integration -->
  <g transform="translate(1220,250)">
    <rect x="0" y="0" width="150" height="350" rx="20" fill="url(#aiGrad)" filter="url(#glow)"/>
    <text x="80" y="30" text-anchor="middle" class="ai-text" fill="#1f2937">🤖</text>
    <text x="80" y="60" text-anchor="middle" class="ai-text" fill="#1f2937">생성형</text>
    <text x="80" y="85" text-anchor="middle" class="ai-text" fill="#1f2937">AI</text>
    <text x="80" y="110" text-anchor="middle" class="innovation" fill="#7c2d12">2020+</text>
    
    <g transform="translate(60,140)" class="innovation" fill="#7c2d12">
      <text x="20" y="0" text-anchor="middle">모든 도구</text>
      <text x="20" y="20" text-anchor="middle">통합 &amp; 확장</text>
      <text x="10" y="70" text-anchor="middle">관찰 + 생성</text>
      <text x="10" y="100" text-anchor="middle">분석 + 창조</text>
      <text x="10" y="130" text-anchor="middle">소통 + 협업</text>
      <text x="10" y="160" text-anchor="middle">조직 + 혁신</text>
    </g>
    
    <!-- Pulsing effect -->
    <rect x="-5" y="-5" width="150" height="350" rx="20" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Source -->
  <text x="600" y="690" text-anchor="middle" class="source">Source: "Generative AI at the Crossroads: Light Bulb, Dynamo, or Microscope?" Martin Baily et al. (arXiv:2505.14588) - Table 4</text>
</svg>