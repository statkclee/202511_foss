<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 20 1400 850" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="dikwGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6C3483;stop-opacity:1" />
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowUp" markerWidth="15" markerHeight="15" refX="7.5" refY="7.5" orient="auto">
      <polygon points="7.5,0 15,15 0,15" fill="#2E5C8A"/>
    </marker>

    <marker id="arrowRight" markerWidth="15" markerHeight="12" refX="14" refY="6" orient="auto">
      <polygon points="0,0 15,6 0,12" fill="#6C3483"/>
    </marker>

    <marker id="arrowInsight" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <polygon points="0,0 12,5 0,10" fill="#E74C3C"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="#F8F9FA"/>

  <!-- Title -->
  <text x="700" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2C3E50">Evolution of Knowledge Models</text>
  <text x="700" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7F8C8D">From Human Abstraction to Machine Generation</text>

  <!-- Left Side: DIKW Hierarchy -->
  <g id="dikw-section">
    <rect x="80" y="120" width="500" height="600" fill="#EBF3FC" stroke="#4A90E2" stroke-width="3" rx="15"/>
    <text x="330" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#2E5C8A">Traditional DIKW (1989)</text>
    <text x="330" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5A7BA6">Hierarchical Knowledge Pyramid</text>

    <!-- DIKW Pyramid -->
    <g transform="translate(130, 220)">
      <!-- Wisdom -->
      <polygon points="200,0 100,60 300,60" fill="#2E5C8A" stroke="#1A3E5C" stroke-width="2"/>
      <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">WISDOM</text>

      <!-- Knowledge -->
      <polygon points="200,60 80,140 320,140" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>
      <text x="200" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">KNOWLEDGE</text>

      <!-- Information -->
      <polygon points="200,140 60,220 340,220" fill="#6BB6FF" stroke="#4A90E2" stroke-width="2"/>
      <text x="200" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">INFORMATION</text>

      <!-- Data -->
      <polygon points="200,220 40,300 360,300" fill="#A3D5FF" stroke="#6BB6FF" stroke-width="2"/>
      <text x="200" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2E5C8A">DATA</text>

      <!-- Transformation Arrows -->
      <path d="M 300 290 L 300 230" stroke="#2E5C8A" stroke-width="1" marker-end="url(#arrowUp)"/>
      <text x="320" y="265" font-family="Arial, sans-serif" font-size="14" fill="#2E5C8A">Processing</text>

      <path d="M 300 210 L 300 150" stroke="#2E5C8A" stroke-width="1" marker-end="url(#arrowUp)"/>
      <text x="320" y="185" font-family="Arial, sans-serif" font-size="14" fill="#2E5C8A">Learning</text>

      <path d="M 300 130 L 300 70" stroke="#2E5C8A" stroke-width="1" marker-end="url(#arrowUp)"/>
      <text x="320" y="105" font-family="Arial, sans-serif" font-size="14" fill="#2E5C8A">Experience</text>
    </g>

    <!-- DIKW Characteristics -->
    <rect x="100" y="550" width="460" height="150" fill="white" stroke="#4A90E2" stroke-width="2" rx="10"/>
    <text x="330" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E5C8A">Key Characteristics</text>

    <text x="120" y="610" font-family="Arial, sans-serif" font-size="14" fill="#34495E">• Linear progression (bottom → top)</text>
    <text x="120" y="635" font-family="Arial, sans-serif" font-size="14" fill="#34495E">• Each level builds on previous</text>
    <text x="120" y="660" font-family="Arial, sans-serif" font-size="14" fill="#34495E">• Human interpretation required</text>
    <text x="120" y="685" font-family="Arial, sans-serif" font-size="14" fill="#34495E">• Volume decreases, value increases</text>
  </g>

  <!-- Right Side: AI Intelligence Framework -->
  <g id="ai-section">
    <rect x="820" y="120" width="500" height="600" fill="#F4ECF7" stroke="#9B59B6" stroke-width="3" rx="15"/>
    <text x="1070" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#6C3483">AI-Era Knowledge Model (2025)</text>
    <text x="1070" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#8E44AD">Pattern Recognition to Intelligence Creation</text>

    <!-- AI Pipeline (Vertical) -->
    <g transform="translate(950, 200)">
      <!-- Raw Signals -->
      <rect x="0" y="0" width="240" height="60" fill="#D7BDE2" stroke="#6C3483" stroke-width="2" rx="10"/>
      <text x="120" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4A235A">Raw Signals</text>
      <text x="120" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6C3483">Multi-modal • Unstructured</text>

      <!-- Arrow 1 (down) -->
      <path d="M 120 60 L 120 85" stroke="#6C3483" stroke-width="1" marker-end="url(#arrowRight)"/>
      <text x="150" y="77" font-family="Arial, sans-serif" font-size="12" fill="#6C3483">Encoding</text>

      <!-- Embeddings -->
      <rect x="0" y="95" width="240" height="60" fill="#BB8FCE" stroke="#6C3483" stroke-width="2" rx="10"/>
      <text x="120" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4A235A">Embeddings</text>
      <text x="120" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">Vectors • Semantic</text>

      <!-- Arrow 2 (down) -->
      <path d="M 120 155 L 120 180" stroke="#6C3483" stroke-width="1" marker-end="url(#arrowRight)"/>
      <text x="150" y="172" font-family="Arial, sans-serif" font-size="12" fill="#6C3483">Augmentation</text>

      <!-- Context -->
      <rect x="0" y="190" width="240" height="60" fill="#9B59B6" stroke="#6C3483" stroke-width="2" rx="10"/>
      <text x="120" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Context</text>
      <text x="120" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">Prompts • RAG</text>

      <!-- Arrow 3 (down) -->
      <path d="M 120 250 L 120 275" stroke="#6C3483" stroke-width="1" marker-end="url(#arrowRight)"/>
      <text x="150" y="267" font-family="Arial, sans-serif" font-size="12" fill="#6C3483">Generation</text>

      <!-- Intelligence -->
      <rect x="0" y="285" width="240" height="60" fill="#6C3483" stroke="#4A235A" stroke-width="2" rx="10"/>
      <text x="120" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">INTELLIGENCE</text>
      <text x="120" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#D7BDE2">Reasoning • Synthesis • Creation</text>

      <!-- Feedback Loop -->
      <path d="M 240 315 Q 350 150 240 30" stroke="#8E44AD" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowRight)"/>
      <text x="170" y="120" font-family="Arial, sans-serif" font-size="16" fill="#8E44AD" transform="rotate(90 260 180)">Continuous Learning</text>
    </g>

    <!-- AI Characteristics -->
    <rect x="840" y="550" width="460" height="150" fill="white" stroke="#9B59B6" stroke-width="2" rx="10"/>
    <text x="1070" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#6C3483">Key Characteristics</text>

    <text x="860" y="610" font-family="Arial, sans-serif" font-size="14" fill="#34495E">• Parallel processing (all at once)</text>
    <text x="860" y="635" font-family="Arial, sans-serif" font-size="14" fill="#34495E">• Generation from patterns</text>
    <text x="860" y="660" font-family="Arial, sans-serif" font-size="14" fill="#34495E">• No explicit rules required</text>
    <text x="860" y="685" font-family="Arial, sans-serif" font-size="14" fill="#34495E">• Creates new knowledge dynamically</text>
  </g>

  <!-- Center: Key Insights -->
  <g id="insights" transform="translate(0,-40)">
    <rect x="620" y="200" width="160" height="520" fill="#FFF5E1" stroke="#F39C12" stroke-width="2" rx="10"/>
    <text x="700" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#D68910">Key Insights</text>

    <!-- Insight 1 -->
    <rect x="635" y="250" width="130" height="80" fill="#FDEBD0" stroke="#E67E22" stroke-width="1" rx="5"/>
    <text x="700" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#D35400">From Reduction</text>
    <text x="700" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#D35400">to Generation</text>
    <text x="700" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">DIKW: Filters down</text>
    <text x="700" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">AI: Creates new</text>

    <!-- Insight 2 -->
    <rect x="635" y="345" width="130" height="80" fill="#FDEBD0" stroke="#E67E22" stroke-width="1" rx="5"/>
    <text x="700" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#D35400">From Sequential</text>
    <text x="700" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#D35400">to Parallel</text>
    <text x="700" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">DIKW: Step by step</text>
    <text x="700" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">AI: All dimensions</text>

    <!-- Insight 3 -->
    <rect x="635" y="440" width="130" height="80" fill="#FDEBD0" stroke="#E67E22" stroke-width="1" rx="5"/>
    <text x="700" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#D35400">From Explicit</text>
    <text x="700" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#D35400">to Implicit</text>
    <text x="700" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">DIKW: Human rules</text>
    <text x="700" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">AI: Learned patterns</text>

    <!-- Insight 4 -->
    <rect x="635" y="535" width="130" height="80" fill="#FDEBD0" stroke="#E67E22" stroke-width="1" rx="5"/>
    <text x="700" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#D35400">From Storage</text>
    <text x="700" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#D35400">to Synthesis</text>
    <text x="700" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">DIKW: Accumulate</text>
    <text x="700" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">AI: Generate fresh</text>

    <!-- Insight 5 -->
    <rect x="635" y="630" width="130" height="70" fill="#FDEBD0" stroke="#E67E22" stroke-width="1" rx="5"/>
    <text x="700" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#D35400">From Fixed</text>
    <text x="700" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#D35400">to Emergent</text>
    <text x="700" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">DIKW: Predefined</text>
    <text x="700" y="695" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">AI: Unpredictable</text>
  </g>

  <!-- Bottom Comparison -->
  <rect x="150" y="750" width="1100" height="90" fill="#2C3E50" rx="10"/>

  <text x="250" y="790" font-family="Arial, sans-serif" font-size="16" fill="#ECF0F1">DIKW: "How do we understand?"</text>
  <text x="250" y="810" font-family="Arial, sans-serif" font-size="14" fill="#BDC3C7">(Making sense through human interpretation)</text>

  <text x="750" y="790" font-family="Arial, sans-serif" font-size="16" fill="#ECF0F1">AI Model: "How do we generate?"</text>
  <text x="750" y="810" font-family="Arial, sans-serif" font-size="14" fill="#BDC3C7">(Creating intelligence through synthesis)</text>

  <path d="M 570 800 L 700 800" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrowInsight)"/>
  <text x="630" y="790" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#E74C3C">Evolution</text>
</svg>