<svg viewBox="0 55 1200 680" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="680" fill="#fafbfc"/>
  
  <!-- Academic Paper Column -->
  <g transform="translate(100,100)">
    <rect x="0" y="0" width="300" height="500" rx="15" fill="#fef7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="150" y="35" font-family="Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ea580c">학술 논문</text>
    <text x="150" y="55" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#9a3412">Academic Paper</text>
    
    <!-- Font samples -->
    <rect x="20" y="80" width="260" height="60" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
    <text x="30" y="100" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" fill="#9a3412">제목:</text>
    <text x="30" y="120" font-family="Noto Sans KR, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Noto Sans KR</text>
    
    <rect x="20" y="150" width="260" height="60" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
    <text x="30" y="170" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" fill="#9a3412">본문:</text>
    <text x="30" y="190" font-family="Noto Serif KR, Times, serif" font-size="16" fill="#1e293b">Noto Serif KR</text>
    
    <rect x="20" y="220" width="260" height="60" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
    <text x="30" y="240" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" fill="#9a3412">코드:</text>
    <text x="30" y="260" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#1e293b">JetBrains Mono</text>
    
    <!-- Characteristics -->
    <text x="30" y="310" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="bold" fill="#9a3412">특징:</text>
    <text x="30" y="330" font-family="Noto Sans KR, Arial, sans-serif" font-size="13" fill="#374151">• 장시간 읽기 최적화</text>
    <text x="30" y="350" font-family="Noto Sans KR, Arial, sans-serif" font-size="13" fill="#374151">• 국제 표준 호환성</text>
    <text x="30" y="370" font-family="Noto Sans KR, Arial, sans-serif" font-size="13" fill="#374151">• 세리프로 눈 피로도 감소</text>
    <text x="30" y="390" font-family="Noto Sans KR, Arial, sans-serif" font-size="13" fill="#374151">• 리가처 지원</text>
    
    <!-- Output format -->
    <rect x="20" y="420" width="260" height="60" rx="8" fill="#fef2f2" stroke="#ea580c" stroke-width="2"/>
    <text x="30" y="440" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">최적 출력:</text>
    <text x="30" y="460" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">PDF</text>
  </g>
  
  <!-- Corporate Report Column -->
  <g transform="translate(450,100)">
    <rect x="0" y="0" width="300" height="500" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="150" y="35" font-family="Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2563eb">기업 보고서</text>
    <text x="150" y="55" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1d4ed8">Corporate Report</text>
    
    <!-- Font samples -->
    <rect x="20" y="80" width="260" height="60" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="30" y="100" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" fill="#1d4ed8">제목:</text>
    <text x="30" y="120" font-family="IBM Plex Sans KR, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">IBM Plex Sans KR</text>
    
    <rect x="20" y="150" width="260" height="60" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="30" y="170" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" fill="#1d4ed8">본문:</text>
    <text x="30" y="190" font-family="IBM Plex Sans KR, Arial, sans-serif" font-size="16" fill="#1e293b">IBM Plex Sans KR</text>
    
    <rect x="20" y="220" width="260" height="60" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="30" y="240" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" fill="#1d4ed8">코드:</text>
    <text x="30" y="260" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" fill="#1e293b">IBM Plex Mono</text>
    
    <!-- Characteristics -->
    <text x="30" y="310" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">특징:</text>
    <text x="30" y="330" font-family="Noto Sans KR, Arial, sans-serif" font-size="13" fill="#374151">• 브랜드 일관성 확보</text>
    <text x="30" y="350" font-family="Noto Sans KR, Arial, sans-serif" font-size="13" fill="#374151">• 모던하고 깔끔한 느낌</text>
    <text x="30" y="370" font-family="Noto Sans KR, Arial, sans-serif" font-size="13" fill="#374151">• 다양한 Weight 제공</text>
    <text x="30" y="390" font-family="Noto Sans KR, Arial, sans-serif" font-size="13" fill="#374151">• Apache 2.0 라이선스</text>
    
    <!-- Output format -->
    <rect x="20" y="420" width="260" height="60" rx="8" fill="#f0f9ff" stroke="#2563eb" stroke-width="2"/>
    <text x="30" y="440" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">최적 출력:</text>
    <text x="30" y="460" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">HTML/Dashboard</text>
  </g>
  
  <!-- Government Document Column -->
  <g transform="translate(800,100)">
    <rect x="0" y="0" width="300" height="500" rx="15" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="150" y="35" font-family="Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#16a34a">정부 문서</text>
    <text x="150" y="55" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#15803d">Government Document</text>
    
    <!-- Font samples -->
    <rect x="20" y="80" width="260" height="60" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
    <text x="30" y="100" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" fill="#15803d">제목:</text>
    <text x="30" y="120" font-family="Nanum Gothic, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">나눔고딕</text>
    
    <rect x="20" y="150" width="260" height="60" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
    <text x="30" y="170" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" fill="#15803d">본문:</text>
    <text x="30" y="190" font-family="Times, serif" font-size="16" fill="#1e293b">본명조</text>
    
    <rect x="20" y="220" width="260" height="60" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
    <text x="30" y="240" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" fill="#15803d">코드:</text>
    <text x="30" y="260" font-family="D2Coding, Consolas, monospace" font-size="14" fill="#1e293b">D2Coding</text>
    
    <!-- Characteristics -->
    <text x="30" y="310" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="bold" fill="#15803d">특징:</text>
    <text x="30" y="330" font-family="Noto Sans KR, Arial, sans-serif" font-size="13" fill="#374151">• 한국적 정서와 신뢰성</text>
    <text x="30" y="350" font-family="Noto Sans KR, Arial, sans-serif" font-size="13" fill="#374151">• 공식 문서 적합성</text>
    <text x="30" y="370" font-family="Noto Sans KR, Arial, sans-serif" font-size="13" fill="#374151">• 격식있는 느낌</text>
    <text x="30" y="390" font-family="Noto Sans KR, Arial, sans-serif" font-size="13" fill="#374151">• 장기 보관 최적화</text>
    
    <!-- Output format -->
    <rect x="20" y="420" width="260" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="30" y="440" font-family="Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">최적 출력:</text>
    <text x="30" y="460" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">PDF/Print</text>
  </g>
  
  <!-- Bottom comparison arrow -->
  <g transform="translate(600,650)">
    <path d="M -400 0 L 400 0" stroke="#64748b" stroke-width="3" marker-end="url(#arrowRight)" marker-start="url(#arrowLeft)"/>
    <text x="0" y="-10" font-family="Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#64748b">문서 특성에 따른 전략적 선택</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#64748b"/>
    </marker>
  </defs>
</svg>