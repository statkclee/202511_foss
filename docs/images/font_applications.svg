
<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 그라데이션 정의 -->
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1"/>
    </linearGradient>
    
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.1"/>
    </linearGradient>
    
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:0.05"/>
    </linearGradient>

    <linearGradient id="leftPanelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.1"/>
    </linearGradient>

    <linearGradient id="rightPanelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#1e8449;stop-opacity:0.1"/>
    </linearGradient>

    <!-- 그림자 필터 -->
    <filter id="dropshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <style>
    .main-title { font-family: 'Noto Sans KR', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; text-anchor: middle; }
    .subtitle { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; fill: #7f8c8d; text-anchor: middle; }
    
    .doc-title { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; text-anchor: start; }
    .doc-header { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 16px; font-weight: 600; fill: #34495e; text-anchor: start; }
    .doc-text { font-family: 'Noto Serif KR', serif; font-size: 11px; fill: #2c3e50; text-anchor: start; }
    .doc-code { font-family: 'D2 Coding', monospace; font-size: 10px; fill: #8e44ad; text-anchor: start; }
    .doc-graph-title { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 600; fill: #2c3e50; text-anchor: start; }
    .doc-graph-label { font-family: 'Noto Sans KR', sans-serif; font-size: 9px; fill: #5d6d7e; text-anchor: start; }
    .doc-table-header { font-family: 'Noto Sans KR', sans-serif; font-size: 10px; font-weight: bold; fill: #2c3e50; text-anchor: start; }
    .doc-table-data { font-family: 'Noto Sans KR', sans-serif; font-size: 10px; fill: #34495e; text-anchor: start; }
    
    .panel-title { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: bold; fill: #2c3e50; text-anchor: middle; }
    .panel-text { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; fill: #34495e; text-anchor: start; }
    .guide-text { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; fill: #2c3e50; text-anchor: start; }
  </style>

  <!-- 배경 -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- 상단 타이틀 -->
  <text x="450" y="35" class="main-title">과학기술 문서의 글꼴 오케스트라</text>
  <text x="450" y="55" class="subtitle">각 요소가 자신의 역할을 수행하며 조화를 이루는 방법</text>

  <!-- 좌측 패널: 구조적 역할 -->
  <rect x="30" y="90" width="200" height="520" rx="10" fill="url(#leftPanelGrad)" stroke="#e74c3c" stroke-width="2" filter="url(#dropshadow)"/>
  <text x="130" y="115" class="panel-title">구조적 역할</text>
  
  <text x="40" y="140" class="panel-text">📏 계층 구분</text>
  <text x="45" y="155" class="panel-text">• 제목 (18-24pt, Bold)</text>
  <text x="45" y="170" class="panel-text">• 소제목 (14-16pt, Semi-bold)</text>
  <text x="45" y="185" class="panel-text">• 본문 (11-12pt, Regular)</text>
  
  <text x="40" y="210" class="panel-text">🎯 강조 표현</text>
  <text x="45" y="225" class="panel-text">• Bold: 중요 키워드</text>
  <text x="45" y="240" class="panel-text">• Italic: 인용, 용어</text>
  <text x="45" y="255" class="panel-text">• Underline: 링크</text>
  
  <text x="40" y="280" class="panel-text">📐 공간 구성</text>
  <text x="45" y="295" class="panel-text">• 행간: 1.4-1.6배</text>
  <text x="45" y="310" class="panel-text">• 자간: -0.02em</text>
  <text x="45" y="325" class="panel-text">• 여백: 일관된 간격</text>
  
  <text x="40" y="350" class="panel-text">🎨 시각적 통일</text>
  <text x="45" y="365" class="panel-text">• 2-3개 글꼴 패밀리</text>
  <text x="45" y="380" class="panel-text">• 일관된 크기 체계</text>
  <text x="45" y="395" class="panel-text">• 조화로운 대비</text>

  <!-- 중앙 문서 페이지 -->
  <rect x="260" y="90" width="380" height="520" rx="10" fill="url(#pageGradient)" stroke="#bdc3c7" stroke-width="2" filter="url(#dropshadow)"/>
  
  <!-- 문서 제목 영역 -->
  <rect x="280" y="110" width="340" height="40" rx="5" fill="url(#headerGradient)" stroke="#3498db" stroke-width="1"/>
  <text x="290" y="130" class="doc-title">과학기술 연구보고서 제목</text>
  <text x="290" y="145" class="doc-header">부제목: AI 기반 데이터 분석 방법론</text>
  
  <!-- 본문 영역 -->
  <text x="290" y="175" class="doc-text">본 연구에서는 기계학습 알고리즘을 활용한 데이터 분석</text>
  <text x="290" y="190" class="doc-text">방법론을 제시한다. 특히 자연어 처리 기술의 발전으로</text>
  <text x="290" y="205" class="doc-text">인해 대용량 텍스트 데이터 분석이 가능해졌다.</text>
  
  <text x="290" y="230" class="doc-text" style="font-style: italic;">"혁신은 기존 방법론의 한계를 인식하는 데서 시작된다"</text>
  
  <!-- 코드 블록 -->
  <rect x="290" y="250" width="330" height="80" rx="5" fill="url(#codeGradient)" stroke="#2c3e50" stroke-width="1"/>
  <text x="295" y="265" class="doc-code" style="fill: #8e44ad;"># 데이터 전처리</text>
  <text x="295" y="280" class="doc-code" style="fill: #2980b9;">import</text>
  <text x="325" y="280" class="doc-code"> pandas </text>
  <text x="365" y="280" class="doc-code" style="fill: #2980b9;">as</text>
  <text x="380" y="280" class="doc-code"> pd</text>
  <text x="295" y="295" class="doc-code">data = pd.read_csv(</text>
  <text x="410" y="295" class="doc-code" style="fill: #e67e22;">'dataset.csv'</text>
  <text x="485" y="295" class="doc-code">)</text>
  <text x="295" y="310" class="doc-code">result = data.groupby(</text>
  <text x="420" y="310" class="doc-code" style="fill: #e67e22;">'category'</text>
  <text x="485" y="310" class="doc-code">).mean()</text>
  <text x="295" y="325" class="doc-code" style="fill: #95a5a6;"># 평균값 계산 및 분석</text>
  
  <!-- 그래프 영역 -->
  <rect x="290" y="350" width="160" height="120" rx="5" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1"/>
  <text x="300" y="370" class="doc-graph-title">월별 성장률 추이</text>
  <!-- 간단한 막대 그래프 -->
  <rect x="310" y="400" width="15" height="30" fill="#3498db"/>
  <rect x="330" y="390" width="15" height="40" fill="#3498db"/>
  <rect x="350" y="380" width="15" height="50" fill="#3498db"/>
  <rect x="370" y="375" width="15" height="55" fill="#3498db"/>
  <text x="315" y="445" class="doc-graph-label">1월</text>
  <text x="335" y="445" class="doc-graph-label">2월</text>
  <text x="355" y="445" class="doc-graph-label">3월</text>
  <text x="375" y="445" class="doc-graph-label">4월</text>
  <text x="300" y="460" class="doc-graph-label">증가율(%)</text>
  
  <!-- 표 영역 -->
  <rect x="470" y="350" width="140" height="120" rx="5" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1"/>
  <text x="480" y="370" class="doc-table-header">실험 결과 요약</text>
  <!-- 표 헤더 -->
  <rect x="480" y="380" width="120" height="20" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="0.5"/>
  <text x="485" y="392" class="doc-table-header">방법</text>
  <text x="530" y="392" class="doc-table-header">정확도</text>
  <text x="570" y="392" class="doc-table-header">시간</text>
  <!-- 표 데이터 -->
  <text x="485" y="415" class="doc-table-data">SVM</text>
  <text x="530" y="415" class="doc-table-data">89.2%</text>
  <text x="570" y="415" class="doc-table-data">3.2s</text>
  <text x="485" y="430" class="doc-table-data">RF</text>
  <text x="530" y="430" class="doc-table-data">91.8%</text>
  <text x="570" y="430" class="doc-table-data">2.1s</text>
  <text x="485" y="445" class="doc-table-data">DNN</text>
  <text x="530" y="445" class="doc-table-data">94.5%</text>
  <text x="570" y="445" class="doc-table-data">8.7s</text>
  
  <!-- 결론 영역 -->
  <text x="290" y="500" class="doc-text">연구 결과, 딥뉴럴네트워크(DNN) 방법론이 가장 높은</text>
  <text x="290" y="515" class="doc-text">정확도를 보였으나, 실시간 처리가 필요한 경우 랜덤</text>
  <text x="290" y="530" class="doc-text">포레스트(RF) 알고리즘이 더 적합한 것으로 판단된다.</text>
  
  <text x="290" y="560" class="doc-text" style="font-size: 9px; fill: #7f8c8d;">* 참고문헌: Smith et al. (2023), Journal of AI Research</text>

  <!-- 우측 패널: 기능적 역할 -->
  <rect x="670" y="90" width="200" height="520" rx="10" fill="url(#rightPanelGrad)" stroke="#27ae60" stroke-width="2" filter="url(#dropshadow)"/>
  <text x="770" y="115" class="panel-title">기능적 역할</text>
  
  <text x="680" y="140" class="panel-text">👁️ 가독성</text>
  <text x="685" y="155" class="panel-text">• 본문: Serif 계열</text>
  <text x="685" y="170" class="panel-text">• 장문 읽기 최적화</text>
  <text x="685" y="185" class="panel-text">• 눈의 피로도 최소화</text>
  
  <text x="680" y="210" class="panel-text">🎯 명확성</text>
  <text x="685" y="225" class="panel-text">• 코드: Monospace</text>
  <text x="685" y="240" class="panel-text">• 문자 간 구분 명확</text>
  <text x="685" y="255" class="panel-text">• 정렬 일관성 유지</text>
  
  <text x="680" y="280" class="panel-text">⚡ 간결성</text>
  <text x="685" y="295" class="panel-text">• 그래프/표: Sans-serif</text>
  <text x="685" y="310" class="panel-text">• 정보 전달 효율성</text>
  <text x="685" y="325" class="panel-text">• 시각적 깔끔함</text>
  
  <text x="680" y="350" class="panel-text">🔄 일관성</text>
  <text x="685" y="365" class="panel-text">• 통일된 글꼴 체계</text>
  <text x="685" y="380" class="panel-text">• 브랜드 아이덴티티</text>
  <text x="685" y="395" class="panel-text">• 전문적 신뢰도</text>

  <!-- 하단 가이드라인 -->
  <rect x="100" y="640" width="700" height="50" rx="10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" filter="url(#dropshadow)"/>
  <text x="120" y="660" class="guide-text">📋 글꼴 선택 가이드라인</text>
  <text x="120" y="675" class="guide-text">텍스트(가독성) → 코드(정확성) → 데이터 시각화(명료성) → 전체 조화(2-3개 패밀리 통일)</text>
</svg>