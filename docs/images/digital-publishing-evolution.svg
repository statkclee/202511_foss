<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="430" viewBox="0 30 800 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 그라디언트 -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6610f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>

    <!-- 그림자 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 화살표 마커 (상단에 통합) -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
    
    <!-- 기본 폰트 설정 -->
    <style>
      text { font-family: "Noto Sans KR", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    </style>
  </defs>
  
  <!-- 세로 타임라인 -->
  <line x1="100" y1="80" x2="100" y2="430" stroke="#ddd" stroke-width="2"/>

  <!-- 1세대 -->
  <g transform="translate(100, 100)">
    <circle r="8" fill="#6610f2"/>
    <rect x="20" y="-30" width="250" height="60" rx="5" fill="white" filter="url(#shadow)"/>
    <text x="30" y="-10" font-size="14" font-weight="bold" fill="#6610f2">1st Generation (1990s)</text>
    <text x="30" y="8"  font-size="12" fill="#666">WYSIWYG Word Processors</text>
    <text x="30" y="24" font-size="11" fill="#999">Document = Final Output</text>

    <rect x="300" y="-25" width="180" height="50" rx="5" fill="#f8f9fa"/>
    <text x="310" y="-5" font-size="11" fill="#666">MS Word, HWP</text>
    <text x="310" y="10" font-size="11" fill="#666">Format and Content Combined</text>
  </g>

  <!-- 화살표 -->
  <path d="M 100 140 L 100 170" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 2세대 -->
  <g transform="translate(100, 190)">
    <circle r="8" fill="#f39c12"/>
    <rect x="20" y="-30" width="250" height="60" rx="5" fill="white" filter="url(#shadow)"/>
    <text x="30" y="-10" font-size="14" font-weight="bold" fill="#f39c12">2nd Generation (2000s)</text>
    <text x="30" y="8"  font-size="12" fill="#666">Web Publishing Era</text>
    <text x="30" y="24" font-size="11" fill="#999">HTML/CSS Separation</text>

    <rect x="300" y="-25" width="180" height="50" rx="5" fill="#fff9e6"/>
    <text x="310" y="-5" font-size="11" fill="#666">Content vs Style</text>
    <text x="310" y="10" font-size="11" fill="#666">Manual Multi-format Conversion</text>
  </g>

  <!-- 화살표 -->
  <path d="M 100 230 L 100 260" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 3세대 -->
  <g transform="translate(100, 280)">
    <circle r="8" fill="#3498db"/>
    <rect x="20" y="-30" width="250" height="60" rx="5" fill="white" filter="url(#shadow)"/>
    <text x="30" y="-10" font-size="14" font-weight="bold" fill="#3498db">3rd Generation (2010s)</text>
    <text x="30" y="8"  font-size="12" fill="#666">Markdown/Pandoc</text>
    <text x="30" y="24" font-size="11" fill="#999">Single Sourcing Introduction</text>

    <rect x="300" y="-25" width="180" height="50" rx="5" fill="#e6f3ff"/>
    <text x="310" y="-5" font-size="11" fill="#666">Plain Text Based</text>
    <text x="310" y="10" font-size="11" fill="#666">Git Version Control Enabled</text>
  </g>

  <!-- 화살표 -->
  <path d="M 100 320 L 100 350" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 4세대 -->
  <g transform="translate(100, 370)">
    <circle r="8" fill="#27ae60"/>
    <rect x="20" y="-30" width="250" height="80" rx="5" fill="white" filter="url(#shadow)"/>
    <text x="30" y="-10" font-size="14" font-weight="bold" fill="#27ae60">4th Generation (2020s)</text>
    <text x="30" y="8"  font-size="12" fill="#666">Quarto - Reproducible Publishing</text>
    <text x="30" y="24" font-size="11" fill="#999">Code + Data + Text Integration</text>
    <text x="30" y="40" font-size="11" fill="#999">Peak before AI Era</text>

    <rect x="300" y="-25" width="180" height="60" rx="5" fill="#e8f8f0"/>
    <text x="310" y="-5" font-size="11" fill="#666">Computational Documents</text>
    <text x="310" y="10" font-size="11" fill="#666">Multi-language Support</text>
    <text x="310" y="25" font-size="11" fill="#666">Complete Reproducibility</text>
  </g>

  <!-- 우측: 핵심 변화 (겹침 방지 위해 x=600으로 이동, 폭=180) -->
  <g transform="translate(600, 150)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">Key Changes</text>
    <g transform="translate(0, 30)">
      <circle cx="5" cy="0" r="3" fill="#6610f2"/>
      <text x="15" y="4" font-size="12" fill="#666">Document-centric → Content-centric</text>
    </g>
    <g transform="translate(0, 55)">
      <circle cx="5" cy="0" r="3" fill="#f39c12"/>
      <text x="15" y="4" font-size="12" fill="#666">Single Output → Multi Output</text>
    </g>
    <g transform="translate(0, 80)">
      <circle cx="5" cy="0" r="3" fill="#3498db"/>
      <text x="15" y="4" font-size="12" fill="#666">Manual Work → Automation</text>
    </g>
    <g transform="translate(0, 105)">
      <circle cx="5" cy="0" r="3" fill="#27ae60"/>
      <text x="15" y="4" font-size="12" fill="#666">Static Documents → Dynamic Documents</text>
    </g>
  </g>

  <!-- 우측: 해결된 문제들 (x=600으로 이동, 폭=180) -->
  <g transform="translate(600, 300)">
    <rect x="0" y="0" width="180" height="120" rx="5" fill="url(#grad1)" opacity="0.1"/>
    <text x="10" y="20" font-size="14" font-weight="bold" fill="#333">Solved Problems</text>
    <text x="10" y="45" font-size="11" fill="#666">✓ Reproducibility Crisis</text>
    <text x="10" y="65" font-size="11" fill="#666">✓ Collaboration Difficulties</text>
    <text x="10" y="85" font-size="11" fill="#666">✓ Multi-format Management Burden</text>
    <text x="10" y="105" font-size="11" fill="#666">✓ Data-Document Inconsistency</text>
  </g>
</svg>
