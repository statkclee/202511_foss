<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="550" viewBox="0 50 800 550"  xmlns="http://www.w3.org/2000/svg">
  <!-- 스타일 정의 -->
  <defs>
    <style>
      .ai-box { fill: #ffe6e6; stroke: #ff9999; stroke-width: 2; }
      .human-box { fill: #e6f3ff; stroke: #99ccff; stroke-width: 2; }
      .auto-box { fill: #e6ffe6; stroke: #99ff99; stroke-width: 2; }
      .text { font-family: 'Noto Sans KR', Arial, sans-serif; font-size: 12px; text-anchor: middle; dominant-baseline: central; }
      .title { font-weight: bold; font-size: 14px; }
      .arrow { stroke: #333; stroke-width: 1; marker-end: url(#arrowhead); }
      .decision { fill: #fff2cc; stroke: #d6b656; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- 입력 노드들 -->
  <rect x="50" y="80" width="120" height="50" class="human-box" rx="5"/>
  <text x="110" y="105" class="text">오타/오류 발견</text>

  <rect x="200" y="80" width="120" height="50" class="human-box" rx="5"/>
  <text x="260" y="105" class="text">기술 변화 감지</text>

  <rect x="350" y="80" width="120" height="50" class="human-box" rx="5"/>
  <text x="410" y="105" class="text">새로운 연구 동향</text>

  <rect x="500" y="80" width="120" height="50" class="human-box" rx="5"/>
  <text x="560" y="105" class="text">독자 피드백</text>

  <!-- GitHub Issues -->
  <rect x="300" y="180" width="120" height="50" class="auto-box" rx="5"/>
  <text x="360" y="205" class="text">GitHub Issues</text>

  <!-- AI 업데이트 제안 -->
  <rect x="300" y="280" width="120" height="50" class="ai-box" rx="5"/>
  <text x="360" y="305" class="text">AI 업데이트 제안</text>

  <!-- 저자 검토 -->
  <rect x="300" y="380" width="120" height="50" class="human-box" rx="5"/>
  <text x="360" y="405" class="text">저자 검토</text>

  <!-- 승인 결정 -->
  <polygon points="360,450 410,480 360,510 310,480" class="decision"/>
  <text x="360" y="480" class="text">승인?</text>

  <!-- 승인시 경로 -->
  <rect x="480" y="460" width="100" height="40" class="human-box" rx="5"/>
  <text x="530" y="480" class="text">원고 수정</text>

  <rect x="480" y="520" width="100" height="40" class="ai-box" rx="5"/>
  <text x="530" y="540" class="text">AI 다국어 번역</text>

  <rect x="620" y="520" width="100" height="40" class="auto-box" rx="5"/>
  <text x="670" y="540" class="text">자동 CI/CD 빌드</text>

  <rect x="620" y="460" width="100" height="40" class="auto-box" rx="5"/>
  <text x="670" y="480" class="text">새 버전 배포</text>

  <!-- 거부시 경로 -->
  <rect x="150" y="460" width="100" height="40" class="auto-box" rx="5"/>
  <text x="200" y="480" class="text">이슈 클로즈</text>

  <!-- 알림 및 업데이트 -->
  <rect x="570" y="380" width="100" height="40" class="human-box" rx="5"/>
  <text x="620" y="400" class="text">독자 알림</text>

  <rect x="620" y="320" width="100" height="40" class="auto-box" rx="5"/>
  <text x="670" y="340" class="text">DOI 업데이트</text>

  <!-- 화살표들 -->
  <!-- 입력들 -> GitHub Issues -->
  <line x1="110" y1="130" x2="340" y2="180" class="arrow"/>
  <line x1="260" y1="130" x2="350" y2="180" class="arrow"/>
  <line x1="410" y1="130" x2="370" y2="180" class="arrow"/>
  <line x1="560" y1="130" x2="380" y2="180" class="arrow"/>

  <!-- GitHub Issues -> AI 업데이트 제안 -->
  <line x1="360" y1="230" x2="360" y2="280" class="arrow"/>

  <!-- AI 업데이트 제안 -> 저자 검토 -->
  <line x1="360" y1="330" x2="360" y2="380" class="arrow"/>

  <!-- 저자 검토 -> 승인 결정 -->
  <line x1="360" y1="430" x2="360" y2="450" class="arrow"/>

  <!-- 승인 -> 원고 수정 -->
  <line x1="410" y1="480" x2="480" y2="480" class="arrow"/>
  
  <!-- 거부 -> 이슈 클로즈 -->
  <line x1="310" y1="480" x2="250" y2="480" class="arrow"/>

  <!-- 원고 수정 -> AI 다국어 번역 -->
  <line x1="530" y1="500" x2="530" y2="520" class="arrow"/>

  <!-- AI 다국어 번역 -> 자동 CI/CD 빌드 -->
  <line x1="580" y1="540" x2="620" y2="540" class="arrow"/>

  <!-- 자동 CI/CD 빌드 -> 새 버전 배포 -->
  <line x1="670" y1="520" x2="670" y2="500" class="arrow"/>

  <!-- 새 버전 배포 -> 독자 알림 -->
  <path d="M 670 460 Q 650 440 620 420" fill="none" class="arrow"/>

  <!-- 새 버전 배포 -> DOI 업데이트 -->
  <path d="M 670 460 Q 690 410 690 380 L 690 360" fill="none" class="arrow"/>

  <!-- 독자 알림 -> 독자 피드백 (순환) -->
  <path d="M 570 400 Q 450 250 560 130" fill="none" class="arrow"/>

  <!-- 범례 -->
  <g transform="translate(50, 555)">
    <!-- 범례 배경 박스 -->
    <rect x="-10" y="-25" width="320" height="40" fill="#f9f9f9" stroke="#ccc" stroke-width="1" rx="8"/>
    
    <!-- 범례 제목 -->
    <text x="15" y="-5" class="text title">범례:</text>
    
    <!-- AI 처리 -->
    <rect x="50" y="-12" width="60" height="20" class="ai-box" rx="3"/>
    <text x="80" y="-4" class="text">AI 처리</text>
    
    <!-- 인간 개입 -->
    <rect x="130" y="-12" width="60" height="20" class="human-box" rx="3"/>
    <text x="160" y="-4" class="text">인간 개입</text>
    
    <!-- 자동화 -->
    <rect x="220" y="-12" width="60" height="20" class="auto-box" rx="3"/>
    <text x="250" y="-4" class="text">자동화</text>
  </g>
</svg>