<svg viewBox="0 65 1200 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 그라디언트들 -->
    <linearGradient id="dashboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#17a2b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#117a8b;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="presentationGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fd7e14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e66100;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="documentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#28a745;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e7e34;stop-opacity:1" />
    </linearGradient>
    
    <!-- Before 상태 색상 -->
    <linearGradient id="beforeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6c757d;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#5a6268;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- AI 글로우 효과 -->
    <filter id="aiGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 그림자 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#333" flood-opacity="0.3"/>
    </filter>
    
    <!-- 화살표 마커 -->
    <marker id="evolutionArrow" markerWidth="12" markerHeight="8" 
            refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 12 4, 0 8" fill="#6610f2" />
    </marker>
  </defs>
  
  <!-- 배경 -->
  <rect width="1200" height="600" fill="#f8f9fa"/>
  
  <!-- 1. 대시보드 섹션 -->
  <g transform="translate(100,100)">
    <!-- 섹션 제목 -->
    <text x="0" y="0" font-size="18" font-weight="bold" fill="#17a2b8">1. 증강된 대시보드</text>
    
    <!-- Before -->
    <g transform="translate(-80,30)">
      <rect x="0" y="0" width="120" height="140" rx="8" fill="url(#beforeGrad)" filter="url(#shadow)"/>
      <text x="60" y="15" text-anchor="middle" font-size="12" font-weight="bold" fill="white">BEFORE</text>
      <text x="60" y="30" text-anchor="middle" font-size="10" fill="white">전통적 대시보드</text>
      
      <!-- 정적 차트들 -->
      <rect x="10" y="40" width="100" height="15" rx="2" fill="#e9ecef"/>
      <rect x="10" y="60" width="80" height="15" rx="2" fill="#e9ecef"/>
      <rect x="10" y="80" width="90" height="15" rx="2" fill="#e9ecef"/>
      
      <!-- 특징 -->
      <text x="60" y="110" text-anchor="middle" font-size="10" fill="white">👁️ 수동 모니터링</text>
      <text x="60" y="125" text-anchor="middle" font-size="10" fill="white">📊 정적 차트만</text>
    </g>
    
    <!-- 진화 화살표 -->
    <path d="M 50,100 L 120,100" stroke="#6610f2" stroke-width="3" 
          marker-end="url(#evolutionArrow)" fill="none"/>
    <text x="85" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#6610f2">AI</text>
    
    <!-- After -->
    <g transform="translate(140,30)">
      <rect x="0" y="0" width="120" height="140" rx="8" fill="url(#dashboardGrad)" filter="url(#shadow)"/>
      <text x="60" y="15" text-anchor="middle" font-size="12" font-weight="bold" fill="white">AFTER</text>
      <text x="60" y="30" text-anchor="middle" font-size="10" fill="white">AI 증강 대시보드</text>
      
      <!-- 인텔리전트 요소들 -->
      <circle cx="20" cy="50" r="8" fill="#ffc107" filter="url(#aiGlow)"/>
      <text x="20" y="54" text-anchor="middle" font-size="8" fill="#000">🚨</text>
      <text x="70" y="54" text-anchor="middle" font-size="12" fill="white">이상치 감지</text>
      
      <circle cx="20" cy="70" r="8" fill="#28a745" filter="url(#aiGlow)"/>
      <text x="20" y="74" text-anchor="middle" font-size="8" fill="white">📈</text>
      <text x="70" y="74" text-anchor="middle" font-size="12" fill="white">트렌드 예측</text>
      
      <circle cx="20" cy="90" r="8" fill="#dc3545" filter="url(#aiGlow)"/>
      <text x="20" y="94" text-anchor="middle" font-size="8" fill="white">⚠️</text>
      <text x="70" y="94" text-anchor="middle" font-size="12" fill="white">실시간 알림</text>
      
      <!-- 특징 -->
      <text x="60" y="110" text-anchor="middle" font-size="10" fill="white">🤖 능동적 분석</text>
      <text x="60" y="125" text-anchor="middle" font-size="10" fill="white">🔔 자동 경고</text>
    </g>
  </g>
  
  <!-- 2. 프레젠테이션 섹션 -->
  <g transform="translate(500,100)">
    <!-- 섹션 제목 -->
    <text x="0" y="0" font-size="18" font-weight="bold" fill="#fd7e14">2. 지능형 프레젠테이션</text>
    
    <!-- Before -->
    <g transform="translate(-80,30)">
      <rect x="0" y="0" width="120" height="140" rx="8" fill="url(#beforeGrad)" filter="url(#shadow)"/>
      <text x="60" y="15" text-anchor="middle" font-size="12" font-weight="bold" fill="white">BEFORE</text>
      <text x="60" y="30" text-anchor="middle" font-size="10" fill="white">정적 프레젠테이션</text>
      
      <!-- 고정된 슬라이드들 -->
      <rect x="15" y="45" width="90" height="20" rx="2" fill="#e9ecef"/>
      <text x="60" y="58" text-anchor="middle" font-size="9" fill="#666">슬라이드 1</text>
      <rect x="15" y="70" width="90" height="20" rx="2" fill="#e9ecef"/>
      <text x="60" y="83" text-anchor="middle" font-size="9" fill="#666">슬라이드 2</text>
      
      <!-- 특징 -->
      <text x="60" y="110" text-anchor="middle" font-size="10" fill="white">📋 고정된 내용</text>
      <text x="60" y="125" text-anchor="middle" font-size="10" fill="white">➡️ 순차적 진행</text>
    </g>
    
    <!-- 진화 화살표 -->
    <path d="M 50,100 L 120,100" stroke="#6610f2" stroke-width="3" 
          marker-end="url(#evolutionArrow)" fill="none"/>
    <text x="85" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#6610f2">AI</text>
    
    <!-- After -->
    <g transform="translate(140,30)">
      <rect x="0" y="0" width="120" height="140" rx="8" fill="url(#presentationGrad)" filter="url(#shadow)"/>
      <text x="60" y="15" text-anchor="middle" font-size="12" font-weight="bold" fill="white">AFTER</text>
      <text x="60" y="30" text-anchor="middle" font-size="10" fill="white">적응형 프레젠테이션</text>
      
      <!-- 적응형 요소들 -->
      <circle cx="25" cy="50" r="15" fill="#007bff" opacity="0.5" filter="url(#aiGlow)"/>
      <text x="25" y="54" text-anchor="middle" font-size="12" fill="white">👥</text>
      <text x="75" y="50" text-anchor="middle" font-size="12" fill="white">청중 분석</text>
      
      <circle cx="25" cy="75" r="15" fill="#28a745" opacity="0.5" filter="url(#aiGlow)"/>
      <text x="25" y="79" text-anchor="middle" font-size="12" fill="white">🎯</text>
      <text x="75" y="75" text-anchor="middle" font-size="12" fill="white">맞춤 조정</text>
      
      <circle cx="25" cy="100" r="15" fill="#6f42c1" opacity="0.5" filter="url(#aiGlow)"/>
      <text x="25" y="104" text-anchor="middle" font-size="12" fill="white">💬</text>
      <text x="75" y="100" text-anchor="middle" font-size="12" fill="white">실시간 대화</text>
      
      <!-- 특징 -->
      <text x="60" y="125" text-anchor="middle" font-size="10" fill="white">🔄 동적 변경</text>
    </g>
  </g>
  
  <!-- 3. 반응형 문서 섹션 -->
  <g transform="translate(900,100)">
    <!-- 섹션 제목 -->
    <text x="0" y="0" font-size="18" font-weight="bold" fill="#28a745">3. 자율 반응형 문서</text>
    
    <!-- Before -->
    <g transform="translate(-80,30)">
      <rect x="0" y="0" width="120" height="140" rx="8" fill="url(#beforeGrad)" filter="url(#shadow)"/>
      <text x="60" y="15" text-anchor="middle" font-size="12" font-weight="bold" fill="white">BEFORE</text>
      <text x="60" y="30" text-anchor="middle" font-size="10" fill="white">정적 UI</text>
      
      <!-- 고정된 인터페이스 -->
      <rect x="20" y="45" width="80" height="12" rx="2" fill="#e9ecef"/>
      <rect x="20" y="62" width="60" height="12" rx="2" fill="#e9ecef"/>
      <rect x="20" y="79" width="70" height="12" rx="2" fill="#e9ecef"/>
      
      <!-- 특징 -->
      <text x="60" y="110" text-anchor="middle" font-size="10" fill="white">📄 고정 레이아웃</text>
      <text x="60" y="125" text-anchor="middle" font-size="10" fill="white">🔒 변화 없음</text>
    </g>
    
    <!-- 진화 화살표 -->
    <path d="M 50,100 L 120,100" stroke="#6610f2" stroke-width="3" 
          marker-end="url(#evolutionArrow)" fill="none"/>
    <text x="85" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#6610f2">AI</text>
    
    <!-- After -->
    <g transform="translate(140,30)">
      <rect x="0" y="0" width="120" height="140" rx="8" fill="url(#documentGrad)" filter="url(#shadow)"/>
      <text x="60" y="15" text-anchor="middle" font-size="12" font-weight="bold" fill="white">AFTER</text>
      <text x="60" y="30" text-anchor="middle" font-size="10" fill="white">학습하는 UI</text>
      
      <!-- 학습 요소들 -->
      <circle cx="20" cy="50" r="8" fill="#ffc107" filter="url(#aiGlow)"/>
      <text x="20" y="54" text-anchor="middle" font-size="7" fill="#000">👁️</text>
      <text x="70" y="54" text-anchor="middle" font-size="12" fill="white">행동 추적</text>
      
      <circle cx="20" cy="70" r="8" fill="#17a2b8" filter="url(#aiGlow)"/>
      <text x="20" y="74" text-anchor="middle" font-size="7" fill="white">🧠</text>
      <text x="70" y="74" text-anchor="middle" font-size="12" fill="white">패턴 학습</text>
      
      <circle cx="20" cy="90" r="8" fill="#e83e8c" filter="url(#aiGlow)"/>
      <text x="20" y="94" text-anchor="middle" font-size="7" fill="white">⚙️</text>
      <text x="70" y="94" text-anchor="middle" font-size="12" fill="white">자동 최적화</text>
      
      <!-- 특징 -->
      <text x="60" y="110" text-anchor="middle" font-size="10" fill="white">🎯 개인 맞춤</text>
      <text x="60" y="125" text-anchor="middle" font-size="10" fill="white">🔄 지속 개선</text>
    </g>
  </g>
  
  <!-- 하단 통합 메시지 -->
  <g transform="translate(600,300)">
    <rect x="-550" y="0" width="1100" height="180" rx="15" fill="rgba(102,16,242,0.1)" stroke="#6610f2" stroke-width="2"/>
    
    <text x="0" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#6610f2">
      문서가 도구에서 파트너로 진화
    </text>
    
    <!-- 3개 기둥 -->
    <g transform="translate(-400,45)">
      <rect x="-70" y="-10" width="140" height="110" rx="8" fill="#17a2b8" opacity="0.2"/>
      <text x="0" y="15" text-anchor="middle" font-size="16" font-weight="bold" fill="#17a2b8">수동 → 능동</text>
      <text x="0" y="35" text-anchor="middle" font-size="10" fill="#495057">사용자가 찾기</text>
      <text x="0" y="50" text-anchor="middle" font-size="8" fill="#6c757d">↓</text>
      <text x="0" y="65" text-anchor="middle" font-size="10" fill="#495057">시스템이 알림</text>
      <text x="0" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#17a2b8">능동적 지능</text>
    </g>
    
    <g transform="translate(0,45)">
      <rect x="-70" y="-10" width="140" height="110" rx="8" fill="#fd7e14" opacity="0.2"/>
      <text x="0" y="15" text-anchor="middle" font-size="16" font-weight="bold" fill="#fd7e14">고정 → 적응</text>
      <text x="0" y="35" text-anchor="middle" font-size="10" fill="#495057">미리 정해진 내용</text>
      <text x="0" y="50" text-anchor="middle" font-size="8" fill="#6c757d">↓</text>
      <text x="0" y="65" text-anchor="middle" font-size="10" fill="#495057">상황별 변화</text>
      <text x="0" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#fd7e14">맥락 인식</text>
    </g>
    
    <g transform="translate(400,45)">
      <rect x="-70" y="-10" width="140" height="110" rx="8" fill="#28a745" opacity="0.2"/>
      <text x="0" y="15" text-anchor="middle" font-size="16" font-weight="bold" fill="#28a745">정적 → 학습</text>
      <text x="0" y="35" text-anchor="middle" font-size="10" fill="#495057">변화하지 않음</text>
      <text x="0" y="50" text-anchor="middle" font-size="8" fill="#6c757d">↓</text>
      <text x="0" y="65" text-anchor="middle" font-size="10" fill="#495057">지속적 개선</text>
      <text x="0" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">자가 진화</text>
    </g>
    
  </g>
  
  <!-- 실제 구현 가능성 표시 -->
  <g transform="translate(100,480)">

    <!-- 대시보드: 쉬움 -->
    <circle cx="5" cy="-17" r="10" fill="#28a745"/>
    <text x="20" y="-10" font-size="20" fill="#28a745">대시보드 - 현재 구현 가능</text>
    
    <!-- 프레젠테이션: 보통 -->
    <circle cx="390" cy="-17" r="10" fill="#ffc107"/>
    <text x="410" y="-10" font-size="20" fill="#e0a800">프레젠테이션 - 개발 중</text>
    
    <!-- 문서: 어려움 -->
    <circle cx="800" cy="-17" r="10" fill="#fd7e14"/>
    <text x="820" y="-10" font-size="20" fill="#fd7e14">반응형 문서 - 연구 단계</text>
  </g>
</svg>