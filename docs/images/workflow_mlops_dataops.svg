<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 20 800 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Orange gradient for boxes -->
    <linearGradient id="stageGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>

    <!-- Center circle gradient -->
    <linearGradient id="centerGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFCC80"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#E65100"/>
    </marker>

    <!-- Big circular arrow -->
    <marker id="bigArrow" markerWidth="16" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0 0, 16 6, 0 12" fill="#BF360C"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>

  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="bold" fill="#BF360C">MLOps / DataOps Pipeline</text>
  <text x="400" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#E65100">Continuous Integration &amp;</text>
  <text x="400" y="220" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#E65100">Deployment for ML/Data</text>

  <!-- Outer circular flow indicator -->
  <circle cx="400" cy="320" r="220" fill="none" stroke="#FFB74D" stroke-width="4" stroke-dasharray="10,5"/>
  <path d="M 400 90 A 230 230 0 1 1 395 90" stroke="#BF360C" stroke-width="2" fill="none" marker-end="url(#bigArrow)"/>

  <!-- Data Ingestion (top) -->
  <g transform="translate(320, 110)">
    <rect width="160" height="60" rx="12" fill="url(#stageGradient)" stroke="#BF360C" stroke-width="2"/>
    <text x="80" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Data Ingestion</text>
    <text x="80" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFCC80">Pipeline &amp; ETL</text>
  </g>

  <!-- Arrow: Data Ingestion → Feature Engineering -->
  <path d="M 480 130 A 230 230 0 0 1 600 280" stroke="#E65100" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Feature Engineering (top right) -->
  <g transform="translate(520, 280)">
    <rect width="160" height="60" rx="12" fill="url(#stageGradient)" stroke="#BF360C" stroke-width="2"/>
    <text x="80" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Feature Store</text>
    <text x="80" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFCC80">Feature Engineering</text>
  </g>

  <!-- Arrow: Feature Engineering → Training -->
  <path d="M 600 340 A 230 230 0 0 1 560 440" stroke="#E65100" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Model Training (bottom right) -->
  <g transform="translate(440, 440)">
    <rect width="160" height="60" rx="12" fill="url(#stageGradient)" stroke="#BF360C" stroke-width="2"/>
    <text x="80" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Model Training</text>
    <text x="80" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFCC80">AutoML &amp; Experiments</text>
  </g>

  <!-- Arrow: Training → Deployment -->
  <path d="M 480 500 A 230 290 0 0 1 310 502" stroke="#E65100" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Model Deployment (bottom center) -->
  <g transform="translate(200, 440)">
    <rect width="160" height="60" rx="12" fill="url(#stageGradient)" stroke="#BF360C" stroke-width="2"/>
    <text x="80" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Deployment</text>
    <text x="80" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFCC80">K8s &amp; Containers</text>
  </g>

  <!-- Arrow: Deployment → Monitoring -->
  <path d="M 240 440 A 230 230 0 0 1 200 340" stroke="#E65100" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Monitoring (left) -->
  <g transform="translate(120, 280)">
    <rect width="160" height="60" rx="12" fill="url(#stageGradient)" stroke="#BF360C" stroke-width="2"/>
    <text x="80" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Monitoring</text>
    <text x="80" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#FFCC80">Observability</text>
  </g>

  <!-- Arrow: Monitoring → Data Ingestion -->
  <path d="M 200 280 A 230 230 0 0 1 320 140" stroke="#E65100" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Central DevOps circle -->
  <circle cx="400" cy="320" r="80" fill="url(#centerGradient)" stroke="#E65100" stroke-width="3"/>
  <text x="400" y="310" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="#BF360C">MLOps</text>
  <text x="400" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#E65100">Automation</text>
  <text x="400" y="348" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#E65100">&amp; CI/CD</text>

  <!-- Infrastructure components (smaller boxes) -->
  <!-- Git -->
  <g transform="translate(50, 150)">
    <rect width="80" height="40" rx="8" fill="#FFAB91" stroke="#FF5722" stroke-width="1"/>
    <text x="40" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#BF360C">Git/GitOps</text>
  </g>

  <!-- Docker -->
  <g transform="translate(670, 200)">
    <rect width="80" height="40" rx="8" fill="#FFAB91" stroke="#FF5722" stroke-width="1"/>
    <text x="40" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#BF360C">Docker</text>
  </g>

  <!-- Cloud -->
  <g transform="translate(670, 400)">
    <rect width="80" height="40" rx="8" fill="#FFAB91" stroke="#FF5722" stroke-width="1"/>
    <text x="40" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#BF360C">Cloud</text>
  </g>

  <!-- Testing -->
  <g transform="translate(50, 480)">
    <rect width="80" height="40" rx="8" fill="#FFAB91" stroke="#FF5722" stroke-width="1"/>
    <text x="40" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#BF360C">Testing</text>
  </g>

  <!-- Metrics -->
  <g transform="translate(50, 350)">
    <rect width="80" height="40" rx="8" fill="#FFAB91" stroke="#FF5722" stroke-width="1"/>
    <text x="40" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#BF360C">Metrics</text>
  </g>

  <!-- Key characteristics -->
  <g transform="translate(50, 550)">
    <text x="0" y="20" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#BF360C">Key Features:</text>
    <text x="120" y="20" font-family="Inter, Arial, sans-serif" font-size="12" fill="#E65100">• Automated Pipelines</text>
    <text x="270" y="20" font-family="Inter, Arial, sans-serif" font-size="12" fill="#E65100">• Infrastructure as Code</text>
    <text x="450" y="20" font-family="Inter, Arial, sans-serif" font-size="12" fill="#E65100">• Continuous Monitoring</text>
    <text x="600" y="20" font-family="Inter, Arial, sans-serif" font-size="12" fill="#E65100">• Scalability</text>
  </g>
</svg>