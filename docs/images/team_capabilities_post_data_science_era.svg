<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 800">
  <defs>
    <!-- AI/ML Engineer colors (Deep Teal/Cyan) -->
    <linearGradient id="aiEngineerColor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#17A2B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#138496;stop-opacity:1" />
    </linearGradient>

    <!-- Platform Engineer colors (Bright Green) -->
    <linearGradient id="platformEngineerColor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#28A745;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E7E34;stop-opacity:1" />
    </linearGradient>

    <!-- Product Data Scientist colors (Deep Purple) -->
    <linearGradient id="productDataScientistColor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6F42C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#59359A;stop-opacity:1" />
    </linearGradient>

    <!-- AI/Automation capability (Cyan) -->
    <linearGradient id="aiCapabilityColor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#20C997;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1BA085;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1150" height="800" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="575" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2C3E50">
    AI-Enhanced Data Science Era: Augmented Team Capabilities (2024+)
  </text>
  <text x="575" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7F8C8D">
    Human-AI collaboration with enhanced workflows and accelerated insights
  </text>

  <!-- Individual Profiles Section -->
  <g transform="translate(0, 100)">
    <!-- AI-Enhanced Data Engineer Profile -->
    <g transform="translate(50, 20)">
      <rect x="-10" y="-10" width="320" height="180" fill="white" stroke="#BDC3C7" stroke-width="1" rx="5"/>
      <text x="150" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
        AI-Enhanced Data Engineer
      </text>

      <!-- Grid lines -->
      <g stroke="#E8E8E8" stroke-width="0.5">
        <line x1="10" y1="30" x2="290" y2="30"/>
        <line x1="10" y1="60" x2="290" y2="60"/>
        <line x1="10" y1="90" x2="290" y2="90"/>
        <line x1="10" y1="120" x2="290" y2="120"/>
        <line x1="10" y1="150" x2="290" y2="150"/>
      </g>

      <!-- Bars -->
      <rect x="10" y="60" width="25" height="90" fill="url(#aiEngineerColor)"/>   <!-- Data Pipelines: Very High -->
      <rect x="50" y="80" width="25" height="70" fill="url(#aiEngineerColor)"/>   <!-- AI-ETL: High -->
      <rect x="90" y="70" width="25" height="80" fill="url(#aiEngineerColor)"/>   <!-- Cloud Infra: High -->
      <rect x="130" y="90" width="25" height="60" fill="url(#aiEngineerColor)"/>  <!-- Streaming: High -->
      <rect x="170" y="100" width="25" height="50" fill="url(#aiEngineerColor)"/> <!-- Data Quality: Medium-High -->
      <rect x="210" y="110" width="25" height="40" fill="url(#aiEngineerColor)"/> <!-- MLOps: Medium-High -->
      <rect x="250" y="120" width="25" height="30" fill="url(#aiEngineerColor)"/> <!-- Monitoring: Medium -->

      <!-- Labels -->
      <text x="22" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Pipelines</text>
      <text x="62" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">AI-ETL</text>
      <text x="102" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Cloud</text>
      <text x="142" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Stream</text>
      <text x="182" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Quality</text>
      <text x="222" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">MLOps</text>
      <text x="262" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Monitor</text>
    </g>

    <!-- AI-Enhanced Data Analyst Profile -->
    <g transform="translate(420, 20)">
      <rect x="-10" y="-10" width="320" height="180" fill="white" stroke="#BDC3C7" stroke-width="1" rx="5"/>
      <text x="150" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
        AI-Enhanced Data Analyst
      </text>

      <!-- Grid lines -->
      <g stroke="#E8E8E8" stroke-width="0.5">
        <line x1="10" y1="30" x2="290" y2="30"/>
        <line x1="10" y1="60" x2="290" y2="60"/>
        <line x1="10" y1="90" x2="290" y2="90"/>
        <line x1="10" y1="120" x2="290" y2="120"/>
        <line x1="10" y1="150" x2="290" y2="150"/>
      </g>

      <!-- Bars -->
      <rect x="10" y="70" width="25" height="80" fill="url(#platformEngineerColor)"/>  <!-- LLM Analysis: High -->
      <rect x="50" y="60" width="25" height="90" fill="url(#platformEngineerColor)"/>  <!-- Data Viz: Very High -->
      <rect x="90" y="80" width="25" height="70" fill="url(#platformEngineerColor)"/>  <!-- SQL: High -->
      <rect x="130" y="90" width="25" height="60" fill="url(#platformEngineerColor)"/> <!-- BI Tools: High -->
      <rect x="170" y="100" width="25" height="50" fill="url(#platformEngineerColor)"/><!-- Stats: Medium-High -->
      <rect x="210" y="80" width="25" height="70" fill="url(#platformEngineerColor)"/> <!-- Communication: High -->
      <rect x="250" y="70" width="25" height="80" fill="url(#platformEngineerColor)"/> <!-- Domain: High -->

      <!-- Labels -->
      <text x="22" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">LLM</text>
      <text x="62" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">DataViz</text>
      <text x="102" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">SQL</text>
      <text x="142" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">BI Tools</text>
      <text x="182" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Stats</text>
      <text x="222" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Comm</text>
      <text x="262" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Domain</text>
    </g>

    <!-- AI/Prompt Engineer Profile -->
    <g transform="translate(790, 20)">
      <rect x="-10" y="-10" width="320" height="180" fill="white" stroke="#BDC3C7" stroke-width="1" rx="5"/>
      <text x="150" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
        AI/Prompt Engineer
      </text>

      <!-- Grid lines -->
      <g stroke="#E8E8E8" stroke-width="0.5">
        <line x1="10" y1="30" x2="290" y2="30"/>
        <line x1="10" y1="60" x2="290" y2="60"/>
        <line x1="10" y1="90" x2="290" y2="90"/>
        <line x1="10" y1="120" x2="290" y2="120"/>
        <line x1="10" y1="150" x2="290" y2="150"/>
      </g>

      <!-- Bars -->
      <rect x="10" y="50" width="25" height="100" fill="url(#productDataScientistColor)"/>  <!-- Prompt Engineering: Very High -->
      <rect x="50" y="70" width="25" height="80" fill="url(#productDataScientistColor)"/>   <!-- LLM Integration: High -->
      <rect x="90" y="90" width="25" height="60" fill="url(#productDataScientistColor)"/>   <!-- AI Ethics: High -->
      <rect x="130" y="100" width="25" height="50" fill="url(#productDataScientistColor)"/> <!-- Model Eval: Medium-High -->
      <rect x="170" y="80" width="25" height="70" fill="url(#productDataScientistColor)"/>  <!-- Human-AI: High -->
      <rect x="210" y="110" width="25" height="40" fill="url(#productDataScientistColor)"/> <!-- Integration: Medium-High -->
      <rect x="250" y="120" width="25" height="30" fill="url(#productDataScientistColor)"/> <!-- Domain: Medium -->

      <!-- Labels -->
      <text x="22" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Prompt</text>
      <text x="62" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">LLM</text>
      <text x="102" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Ethics</text>
      <text x="142" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Eval</text>
      <text x="182" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Human-AI</text>
      <text x="222" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Integr</text>
      <text x="262" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">Domain</text>
    </g>
  </g>

  <!-- Team Message -->
  <g transform="translate(-50, 320)">
    <!-- Flowing AI-powered arrows -->
    <path d="M 200 50 Q 350 20 500 50 Q 650 20 800 50 Q 950 20 1100 50"
          stroke="#20C997" stroke-width="3" fill="none" marker-end="url(#aiArrowhead)"/>

    <!-- AI Arrow marker -->
    <defs>
      <marker id="aiArrowhead" markerWidth="12" markerHeight="8"
              refX="12" refY="4" orient="auto">
        <polygon points="0 0, 12 4, 0 8" fill="#20C997"/>
      </marker>
    </defs>

    <!-- AI-assisted indicators -->
    <text x="350" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#20C997" font-weight="bold">AI ASSIST</text>
    <text x="575" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#20C997" font-weight="bold">ENHANCED</text>
    <text x="800" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#20C997" font-weight="bold">COLLABORATIVE</text>

    <text x="600" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E50">
      AI-augmented teams achieve faster insights through enhanced workflows
    </text>
  </g>

  <!-- AI-Enhanced Team Capabilities -->
  <g transform="translate(100, 450)">
    <rect x="-30" y="-20" width="1000" height="300" fill="white" stroke="#BDC3C7" stroke-width="2" rx="8"/>
    <text x="485" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">
      AI-Enhanced Integrated Capabilities
    </text>

    <!-- Grid lines -->
    <g stroke="#E8E8E8" stroke-width="1">
      <line x1="80" y1="40" x2="900" y2="40"/>
      <line x1="80" y1="80" x2="900" y2="80"/>
      <line x1="80" y1="120" x2="900" y2="120"/>
      <line x1="80" y1="160" x2="900" y2="160"/>
      <line x1="80" y1="200" x2="900" y2="200"/>
      <line x1="80" y1="240" x2="900" y2="240"/>
    </g>

    <!-- Baseline -->
    <line x1="80" y1="240" x2="900" y2="240" stroke="#2C3E50" stroke-width="2"/>

    <!-- Y-axis labels -->
    <text x="70" y="45" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">Very High</text>
    <text x="70" y="85" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">High</text>
    <text x="70" y="125" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">Medium</text>
    <text x="70" y="165" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">Low</text>
    <text x="70" y="205" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">Minimal</text>

    <!-- AI-Enhanced integrated stacked bars -->
    <!-- LLM Integration -->
    <g transform="translate(130, 0)">
      <rect x="0" y="70" width="45" height="70" fill="url(#aiEngineerColor)"/>
      <rect x="0" y="140" width="45" height="50" fill="url(#platformEngineerColor)"/>
      <rect x="0" y="190" width="45" height="50" fill="url(#productDataScientistColor)"/>
      <text x="22" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">LLM Integration</text>
      <text x="22" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#20C997">AI-ASSISTED</text>
    </g>

    <!-- Enhanced Analytics -->
    <g transform="translate(250, 0)">
      <rect x="0" y="80" width="45" height="60" fill="url(#platformEngineerColor)"/>
      <rect x="0" y="140" width="45" height="50" fill="url(#productDataScientistColor)"/>
      <rect x="0" y="190" width="45" height="50" fill="url(#aiEngineerColor)"/>
      <text x="22" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">Enhanced Analytics</text>
      <text x="22" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#20C997">ACCELERATED</text>
    </g>

    <!-- Faster Processing -->
    <g transform="translate(370, 0)">
      <rect x="0" y="90" width="45" height="60" fill="url(#platformEngineerColor)"/>
      <rect x="0" y="150" width="45" height="50" fill="url(#aiEngineerColor)"/>
      <rect x="0" y="200" width="45" height="40" fill="url(#productDataScientistColor)"/>
      <text x="22" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">Faster Processing</text>
      <text x="22" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#20C997">OPTIMIZED</text>
    </g>

    <!-- AutoML/MLOps -->
    <g transform="translate(490, 0)">
      <rect x="0" y="80" width="45" height="70" fill="url(#aiEngineerColor)"/>
      <rect x="0" y="150" width="45" height="50" fill="url(#platformEngineerColor)"/>
      <rect x="0" y="200" width="45" height="40" fill="url(#productDataScientistColor)"/>
      <text x="22" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">AutoML/MLOps</text>
      <text x="22" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#20C997">ASSISTED</text>
    </g>

    <!-- Natural Language -->
    <g transform="translate(610, 0)">
      <rect x="0" y="100" width="45" height="60" fill="url(#aiEngineerColor)"/>
      <rect x="0" y="160" width="45" height="40" fill="url(#productDataScientistColor)"/>
      <rect x="0" y="200" width="45" height="40" fill="url(#platformEngineerColor)"/>
      <text x="22" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">Natural Language</text>
      <text x="22" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#20C997">ENABLED</text>
    </g>

    <!-- AI Ethics -->
    <g transform="translate(730, 0)">
      <rect x="0" y="130" width="45" height="50" fill="url(#productDataScientistColor)"/>
      <rect x="0" y="180" width="45" height="30" fill="url(#aiEngineerColor)"/>
      <rect x="0" y="210" width="45" height="30" fill="url(#platformEngineerColor)"/>
      <text x="22" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">AI Ethics</text>
      <text x="22" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#20C997">CRITICAL</text>
    </g>

    <!-- Data Strategy -->
    <g transform="translate(850, 0)">
      <rect x="0" y="90" width="45" height="70" fill="url(#productDataScientistColor)"/>
      <rect x="0" y="160" width="45" height="40" fill="url(#aiEngineerColor)"/>
      <rect x="0" y="200" width="45" height="40" fill="url(#platformEngineerColor)"/>
      <text x="22" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C3E50">Data Strategy</text>
      <text x="22" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#20C997">ENHANCED</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(200, 750)">
    <rect x="0" y="0" width="20" height="15" fill="url(#aiEngineerColor)"/>
    <text x="25" y="12" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">AI-Enhanced Data Engineer</text>

    <rect x="200" y="0" width="20" height="15" fill="url(#platformEngineerColor)"/>
    <text x="225" y="12" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">AI-Enhanced Data Analyst</text>

    <rect x="400" y="0" width="20" height="15" fill="url(#productDataScientistColor)"/>
    <text x="425" y="12" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">AI/Prompt Engineer</text>
  </g>

</svg>