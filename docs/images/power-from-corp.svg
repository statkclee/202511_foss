<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <defs>
    <style><![CDATA[
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 46px; font-weight: 900; fill: #f8fafc; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 22px; font-weight: 600; fill: #cbd5e1; }
      .h1 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #ffffff; }
      .p { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #e5e7eb; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #cbd5e1; }
    ]]></style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gradCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter>

    <!-- Arrow marker -->
    <marker id="arrowRight" markerWidth="20" markerHeight="14" refX="18" refY="7" orient="auto">
      <polygon points="0 0, 20 7, 0 14" fill="#facc15"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>

  <text x="800" y="68" text-anchor="middle" class="title">기업 주도 → 대중 확산 사례</text>
  <text x="800" y="104" text-anchor="middle" class="subtitle">Corporate Innovation → Mass Market</text>

  <!-- Cases with logos/emojis -->
  <g transform="translate(70,200)">
    <!-- 1. 아이폰 -->
    <g>
      <rect x="0" y="0" width="290" height="440" rx="16" fill="url(#gradCase)" filter="url(#shadow)"/>
      <text x="145" y="38" text-anchor="middle" class="h1">📱 스마트폰</text>
      <text x="145" y="66" text-anchor="middle" class="small">Apple iPhone (2007)</text>
      <g transform="translate(18,110)" class="p">
        <text x="0" y="0">• 혁신 UI와 앱스토어</text>
        <text x="0" y="30">• 스마트폰 대중화 촉발</text>
      </g>
      <image href="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" x="120" y="340" width="50" height="50"/>
    </g>

    <!-- 2. 페이스북 -->
    <g transform="translate(320,0)">
      <rect x="0" y="0" width="290" height="440" rx="16" fill="url(#gradCase)" filter="url(#shadow)"/>
      <text x="145" y="38" text-anchor="middle" class="h1">👥 소셜 네트워크</text>
      <text x="145" y="66" text-anchor="middle" class="small">Facebook (2004)</text>
      <g transform="translate(18,110)" class="p">
        <text x="0" y="0">• 대학 캠퍼스 시작</text>
        <text x="0" y="30">• 전 세계 대중화</text>
      </g>
      <image href="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" x="120" y="340" width="50" height="50"/>
    </g>

    <!-- 3. 테슬라 EV -->
    <g transform="translate(640,0)">
      <rect x="0" y="0" width="290" height="440" rx="16" fill="url(#gradCase)" filter="url(#shadow)"/>
      <text x="145" y="38" text-anchor="middle" class="h1">🚗 전기차</text>
      <text x="145" y="66" text-anchor="middle" class="small">Tesla (2008~)</text>
      <g transform="translate(18,110)" class="p">
        <text x="0" y="0">• 고급 EV → 대중 모델</text>
        <text x="0" y="30">• 충전 네트워크 구축</text>
      </g>
      <image href="https://upload.wikimedia.org/wikipedia/commons/b/bd/Tesla_Motors.svg" x="120" y="340" width="50" height="50"/>
    </g>

    <!-- 4. 아마존 AWS -->
    <g transform="translate(960,0)">
      <rect x="0" y="0" width="290" height="440" rx="16" fill="url(#gradCase)" filter="url(#shadow)"/>
      <text x="145" y="38" text-anchor="middle" class="h1">☁️ 클라우드</text>
      <text x="145" y="66" text-anchor="middle" class="small">Amazon AWS (2006)</text>
      <g transform="translate(18,110)" class="p">
        <text x="0" y="0">• IaaS 개척</text>
        <text x="0" y="30">• 클라우드 표준 확립</text>
      </g>
      <image href="https://upload.wikimedia.org/wikipedia/commons/9/93/Amazon_Web_Services_Logo.svg" x="120" y="340" width="50" height="50"/>
    </g>

    <!-- 5. 구글 검색 -->
    <g transform="translate(1280,0)">
      <rect x="0" y="0" width="290" height="440" rx="16" fill="url(#gradCase)" filter="url(#shadow)"/>
      <text x="145" y="38" text-anchor="middle" class="h1">🔍 검색엔진</text>
      <text x="145" y="66" text-anchor="middle" class="small">Google (1998)</text>
      <g transform="translate(18,110)" class="p">
        <text x="0" y="0">• 페이지랭크 혁신</text>
        <text x="0" y="30">• 정보 접근의 기본</text>
      </g>
      <image href="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" x="120" y="340" width="50" height="50"/>
    </g>
  </g>

  <!-- Arrows between cases -->
  <g stroke="#facc15" stroke-width="6" marker-end="url(#arrowRight)">
    <line x1="290" y1="420" x2="320" y2="420"/>
    <line x1="610" y1="420" x2="640" y2="420"/>
    <line x1="930" y1="420" x2="960" y2="420"/>
    <line x1="1250" y1="420" x2="1280" y2="420"/>
  </g>

  <!-- Bottom ribbon: Pattern summary -->
  <g>
    <rect x="120" y="760" width="1360" height="140" rx="18" fill="#0b1220" opacity="0.7"/>
    <g transform="translate(140,780)">
      <text x="0" y="0" class="h2">공통 인사이트</text>
      <text x="0" y="36" class="p">① 혁신적 사용자 경험 ② 네트워크 효과 ③ 플랫폼/생태계 확장</text>
      <text x="0" y="68" class="p">→ 기업 로고와 심볼이 강력한 브랜드 신뢰와 확산의 매개체 역할</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(120,950)">
    <rect x="0" y="0" width="1360" height="80" rx="12" fill="#111827"/>
    <text x="20" y="32" class="small">대표 기업: Apple · Meta · Tesla · Amazon · Google</text>
    <text x="20" y="58" class="small">※ 로고 저작권은 각 기업에 귀속</text>
  </g>
</svg>
