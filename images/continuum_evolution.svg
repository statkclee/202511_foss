<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Traditional gradients -->
    <linearGradient id="traditionalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#90CAF9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>

    <!-- Data Science era gradients -->
    <linearGradient id="dsGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="dsGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="dsGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9575CD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#512DA8;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="dsGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F06292;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C2185B;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="headerEvolution" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#388E3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.3"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="evolutionArrow" markerWidth="15" markerHeight="12" refX="14" refY="6" orient="auto">
      <polygon points="0,0 15,6 0,12" fill="#388E3C"/>
    </marker>

    <marker id="processArrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <polygon points="0,0 12,5 0,10" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1200" fill="#FAFAFA"/>

  <!-- Title -->
  <rect x="100" y="20" width="1200" height="80" fill="url(#headerEvolution)" rx="12" filter="url(#shadow)"/>
  <text x="700" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Evolution of Data-Driven Decision Making</text>
  <text x="700" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#E8F5E9">From Traditional Business Intelligence to Data Science Era (2010s-2020)</text>

  <!-- Traditional Era (Top) -->
  <g id="traditional-era">
    <rect x="50" y="120" width="1300" height="130" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="10" opacity="0.9"/>
    <text x="700" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0D47A1">Traditional Era (1990s-2000s)</text>

    <!-- Traditional stages -->
    <g transform="translate(100, 165)">
      <rect x="0" y="0" width="150" height="50" fill="url(#traditionalGrad)" rx="8"/>
      <text x="75" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Acquire</text>

      <path d="M 150 25 L 180 25" stroke="#1976D2" stroke-width="2" marker-end="url(#processArrow)"/>

      <rect x="180" y="0" width="150" height="50" fill="url(#traditionalGrad)" rx="8"/>
      <text x="255" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Integrate</text>

      <path d="M 330 25 L 360 25" stroke="#1976D2" stroke-width="2" marker-end="url(#processArrow)"/>

      <rect x="360" y="0" width="150" height="50" fill="url(#traditionalGrad)" rx="8"/>
      <text x="435" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Surface</text>

      <path d="M 510 25 L 540 25" stroke="#1976D2" stroke-width="2" marker-end="url(#processArrow)"/>

      <rect x="540" y="0" width="150" height="50" fill="url(#traditionalGrad)" rx="8"/>
      <text x="615" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Report</text>

      <path d="M 690 25 L 720 25" stroke="#1976D2" stroke-width="2" marker-end="url(#processArrow)"/>

      <rect x="720" y="0" width="150" height="50" fill="url(#traditionalGrad)" rx="8"/>
      <text x="795" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Storytell</text>

      <path d="M 870 25 L 900 25" stroke="#1976D2" stroke-width="2" marker-end="url(#processArrow)"/>

      <rect x="900" y="0" width="150" height="50" fill="url(#traditionalGrad)" rx="8"/>
      <text x="975" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Decide</text>

      <path d="M 1050 25 L 1080 25" stroke="#1976D2" stroke-width="2" marker-end="url(#processArrow)"/>

      <rect x="1080" y="0" width="150" height="50" fill="url(#traditionalGrad)" rx="8"/>
      <text x="1155" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Take Action</text>

      <!-- Timeline -->
      <text x="615" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1976D2" font-weight="bold">Timeline: 2-6 months • Manual processes • Intuition-based decisions</text>
    </g>
  </g>

  <!-- Evolution Arrow -->
  <g transform="translate(700, 270)">
    <path d="M 0 0 L 0 30" stroke="url(#headerEvolution)" stroke-width="3" marker-end="url(#evolutionArrow)"/>
    <text x="30" y="20" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#388E3C">EVOLUTION</text>
  </g>

  <!-- Data Science Era (Middle) -->
  <g id="data-science-era">
    <rect x="50" y="320" width="1300" height="250" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" rx="10" opacity="0.9"/>
    <text x="700" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1B5E20">Data Science Era (2010s-2020)</text>

    <!-- Data Science stages - showing consolidation -->
    <g transform="translate(200, 370)">
      <!-- Merged Acquire + Integrate -->
      <rect x="0" y="0" width="220" height="60" fill="url(#dsGrad1)" rx="8" filter="url(#shadow)"/>
      <text x="110" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Automated ETL</text>
      <text x="110" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#C8E6C9">Acquire + Integrate</text>

      <path d="M 220 30 L 260 30" stroke="#388E3C" stroke-width="2" marker-end="url(#evolutionArrow)"/>

      <!-- Enhanced Surface + Report -->
      <rect x="260" y="0" width="220" height="60" fill="url(#dsGrad2)" rx="8" filter="url(#shadow)"/>
      <text x="370" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Interactive Analytics</text>
      <text x="370" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFECB3">Surface + Report</text>

      <path d="M 480 30 L 520 30" stroke="#388E3C" stroke-width="2" marker-end="url(#evolutionArrow)"/>

      <!-- Data-Driven Storytell -->
      <rect x="520" y="0" width="220" height="60" fill="url(#dsGrad3)" rx="8" filter="url(#shadow)"/>
      <text x="630" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Statistical Storytelling</text>
      <text x="630" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E1BEE7">Evidence-based narratives</text>

      <path d="M 740 30 L 780 30" stroke="#388E3C" stroke-width="2" marker-end="url(#evolutionArrow)"/>

      <!-- Predictive Decide + Action -->
      <rect x="780" y="0" width="220" height="60" fill="url(#dsGrad4)" rx="8" filter="url(#shadow)"/>
      <text x="890" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Predictive Decisions</text>
      <text x="890" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#F8BBD9">Model-informed actions</text>

      <!-- Timeline -->
      <text x="500" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#388E3C" font-weight="bold">Timeline: Days to weeks • Semi-automated • Hypothesis-driven decisions</text>
    </g>

    <!-- New Data Science Capabilities -->
    <g transform="translate(150, 490)">
      <rect x="0" y="0" width="1100" height="60" fill="#FFFFFF" stroke="#388E3C" stroke-width="2" rx="8"/>
      <text x="550" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#388E3C">New Data Science Capabilities</text>

      <text x="50"  y="45" font-family="Arial, sans-serif"  font-size="16" fill="#333">• Machine Learning Models</text>
      <text x="250" y="45" font-family="Arial, sans-serif" font-size="16" fill="#333">• A/B Testing</text>
      <text x="400" y="45" font-family="Arial, sans-serif" font-size="16" fill="#333">• Real-time Dashboards</text>
      <text x="580" y="45" font-family="Arial, sans-serif" font-size="16" fill="#333">• Predictive Analytics</text>
      <text x="750" y="45" font-family="Arial, sans-serif" font-size="16" fill="#333">• Statistical Testing</text>
      <text x="920" y="45" font-family="Arial, sans-serif" font-size="16" fill="#333">• Python/R/SQL</text>
    </g>
  </g>

  <!-- Key Insight -->
  <g id="key-insight" transform="translate(200, 590)">
    <rect x="0" y="0" width="1000" height="110" fill="url(#headerEvolution)" rx="12" filter="url(#shadow)"/>
    <text x="500" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">Key Insight: Data Science Era Modernized but Didn't Break the Continuum</text>
    <text x="500" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#E8F5E9">Faster, smarter, more automated - but still fundamentally human-controlled</text>
    <text x="500" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#FFECB3">The paradigm shift comes with AI era autonomous decision-making</text>
  </g>
</svg>