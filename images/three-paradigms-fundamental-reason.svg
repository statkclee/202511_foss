<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 2000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="drawingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="typesetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="markupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a7f3d0;stop-opacity:1" />
    </linearGradient>

    <!-- Styles -->
    <style>
      text { font-family: 'Noto Sans KR', 'Noto Sans', sans-serif; }
      .title { font-size: 38px; font-weight: 700; fill: white; }
      .subtitle { font-size: 18px; font-weight: 600; fill: white; }
      .section-title { font-size: 28px; font-weight: 700; }
      .dimension-title { font-size: 24px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 600; fill: #374151; }
      .value { font-size: 14px; fill: #4b5563; }
      .question { font-size: 20px; font-weight: 700; fill: #1f2937; }
      .answer { font-size: 16px; font-weight: 600; }
      .example { font-size: 13px; fill: #6b7280; }
      .history { font-size: 13px; fill: #4b5563; font-style: italic; }
      .essence { font-size: 15px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="2400" height="2000" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="40" y="20" width="2320" height="100" rx="12" fill="url(#headerGrad)"/>
  <text x="1200" y="65" text-anchor="middle" class="title">왜 정확히 3개의 패러다임인가?</text>
  <text x="1200" y="95" text-anchor="middle" class="subtitle">문서 생성의 3가지 근본적 차원: 공간 × 시각 × 의미</text>

  <!-- Central concept -->
  <rect x="400" y="150" width="1600" height="200" rx="15" fill="white" stroke="#6b7280" stroke-width="3"/>
  <text x="1200" y="200" text-anchor="middle" class="section-title" fill="#1e40af">문서를 만들 때 필요한 3가지 질문</text>

  <g id="three-questions">
    <text x="500" y="250" class="question" fill="#d97706">1. 어디에 놓을 것인가?</text>
    <text x="520" y="280" class="answer" fill="#d97706">→ Drawing (공간 좌표)</text>

    <text x="1000" y="250" class="question" fill="#1e40af">2. 어떻게 보이게 할 것인가?</text>
    <text x="1020" y="280" class="answer" fill="#1e40af">→ Typesetting (시각 규칙)</text>

    <text x="1650" y="250" class="question" fill="#059669">3. 무엇을 의미하는가?</text>
    <text x="1670" y="280" class="answer" fill="#059669">→ Markup (논리 구조)</text>
  </g>

  <text x="1200" y="330" text-anchor="middle" class="value" style="font-size: 16px; font-style: italic;">이 3가지는 서로 독립적이며, 각각 다른 문제를 해결한다</text>

  <!-- Three paradigm boxes -->

  <!-- Paradigm 1: Drawing -->
  <g id="drawing-paradigm">
    <rect x="80" y="400" width="680" height="750" rx="15" fill="url(#drawingGrad)" stroke="#f59e0b" stroke-width="4"/>

    <text x="420" y="450" text-anchor="middle" class="dimension-title" fill="#d97706">차원 1: Drawing</text>
    <text x="420" y="480" text-anchor="middle" class="label" fill="#d97706">어디에 놓을 것인가?</text>

    <!-- Origin -->
    <rect x="120" y="510" width="600" height="140" rx="8" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <text x="140" y="540" class="label" fill="#d97706">역사적 기원:</text>
    <text x="160" y="570" class="history">• 선사시대: 동굴 벽화 (라스코, 알타미라)</text>
    <text x="160" y="595" class="history">• 고대: 기하학, 건축 도면</text>
    <text x="160" y="620" class="history">• 근대: 제도(製圖), 공학 도면</text>
    <text x="160" y="645" class="history">• 1959: CalComp 플로터 (컴퓨터 제어)</text>

    <!-- Essence -->
    <rect x="120" y="670" width="600" height="120" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="140" y="700" class="label" fill="#d97706">본질:</text>
    <text x="160" y="730" class="essence" fill="#d97706">공간 좌표계 (x, y)</text>
    <text x="160" y="755" class="value">• 2차원 평면의 점과 선</text>
    <text x="160" y="778" class="value">• "펜을 (100, 200) 위치로 이동"</text>

    <!-- Purpose -->
    <rect x="120" y="810" width="600" height="100" rx="8" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <text x="140" y="840" class="label" fill="#d97706">해결하는 문제:</text>
    <text x="160" y="870" class="value">• 시각적 형태 표현</text>
    <text x="160" y="893" class="value">• 정밀한 위치 제어</text>

    <!-- Tech -->
    <rect x="120" y="930" width="600" height="100" rx="8" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <text x="140" y="960" class="label" fill="#d97706">기술:</text>
    <text x="160" y="990" class="value">Plotter → HP-GL → PostScript → PDF</text>
    <text x="160" y="1013" class="example">moveto, lineto, stroke</text>

    <!-- Independence -->
    <rect x="120" y="1050" width="600" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="420" y="1080" text-anchor="middle" class="essence" fill="#d97706">독립적 차원</text>
    <text x="420" y="1105" text-anchor="middle" class="value">위치만 다루고, 의미는 모름</text>
  </g>

  <!-- Paradigm 2: Typesetting -->
  <g id="typesetting-paradigm">
    <rect x="860" y="400" width="680" height="750" rx="15" fill="url(#typesetGrad)" stroke="#3b82f6" stroke-width="4"/>

    <text x="1200" y="450" text-anchor="middle" class="dimension-title" fill="#1e40af">차원 2: Typesetting</text>
    <text x="1200" y="480" text-anchor="middle" class="label" fill="#1e40af">어떻게 보이게 할 것인가?</text>

    <!-- Origin -->
    <rect x="900" y="510" width="600" height="140" rx="8" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <text x="920" y="540" class="label" fill="#1e40af">역사적 기원:</text>
    <text x="940" y="570" class="history">• 1440: 구텐베르크 활판인쇄</text>
    <text x="940" y="595" class="history">• 수세기: 타이포그래피 규칙 발전</text>
    <text x="940" y="620" class="history">• 1960s: 사진 식자기</text>
    <text x="940" y="645" class="history">• 1978: TeX (Donald Knuth)</text>

    <!-- Essence -->
    <rect x="900" y="670" width="600" height="120" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="920" y="700" class="label" fill="#1e40af">본질:</text>
    <text x="940" y="730" class="essence" fill="#1e40af">타이포그래피 규칙</text>
    <text x="940" y="755" class="value">• 폰트, 크기, 간격, 정렬</text>
    <text x="940" y="778" class="value">• "이 텍스트를 12pt로 볼드체로"</text>

    <!-- Purpose -->
    <rect x="900" y="810" width="600" height="100" rx="8" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <text x="920" y="840" class="label" fill="#1e40af">해결하는 문제:</text>
    <text x="940" y="870" class="value">• 아름다운 텍스트 배치</text>
    <text x="940" y="893" class="value">• 읽기 쉬운 레이아웃</text>

    <!-- Tech -->
    <rect x="900" y="930" width="600" height="100" rx="8" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <text x="920" y="960" class="label" fill="#1e40af">기술:</text>
    <text x="940" y="990" class="value">활판인쇄 → 사진식자 → TeX → LaTeX</text>
    <text x="940" y="1013" class="example">\textbf{...}, \section{...}</text>

    <!-- Independence -->
    <rect x="900" y="1050" width="600" height="80" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
    <text x="1200" y="1080" text-anchor="middle" class="essence" fill="#1e40af">독립적 차원</text>
    <text x="1200" y="1105" text-anchor="middle" class="value">시각만 다루고, 좌표는 자동 계산</text>
  </g>

  <!-- Paradigm 3: Markup -->
  <g id="markup-paradigm">
    <rect x="1640" y="400" width="680" height="750" rx="15" fill="url(#markupGrad)" stroke="#10b981" stroke-width="4"/>

    <text x="1980" y="450" text-anchor="middle" class="dimension-title" fill="#059669">차원 3: Markup</text>
    <text x="1980" y="480" text-anchor="middle" class="label" fill="#059669">무엇을 의미하는가?</text>

    <!-- Origin -->
    <rect x="1680" y="510" width="600" height="140" rx="8" fill="white" stroke="#10b981" stroke-width="2"/>
    <text x="1700" y="540" class="label" fill="#059669">역사적 기원:</text>
    <text x="1720" y="570" class="history">• 고대: 필사본에 주석 표시</text>
    <text x="1720" y="595" class="history">• 출판: 교정 기호 (markup symbols)</text>
    <text x="1720" y="620" class="history">• 1960s: 컴퓨터 문서 구조화 필요</text>
    <text x="1720" y="645" class="history">• 1969: IBM GML</text>

    <!-- Essence -->
    <rect x="1680" y="670" width="600" height="120" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1"/>
    <text x="1700" y="700" class="label" fill="#059669">본질:</text>
    <text x="1720" y="730" class="essence" fill="#059669">의미론적 구조</text>
    <text x="1720" y="755" class="value">• 계층, 관계, 의미</text>
    <text x="1720" y="778" class="value">• "이것은 제목이다, 이것은 본문이다"</text>

    <!-- Purpose -->
    <rect x="1680" y="810" width="600" height="100" rx="8" fill="white" stroke="#10b981" stroke-width="2"/>
    <text x="1700" y="840" class="label" fill="#059669">해결하는 문제:</text>
    <text x="1720" y="870" class="value">• 논리적 문서 구조</text>
    <text x="1720" y="893" class="value">• 내용과 형식 분리</text>

    <!-- Tech -->
    <rect x="1680" y="930" width="600" height="100" rx="8" fill="white" stroke="#10b981" stroke-width="2"/>
    <text x="1700" y="960" class="label" fill="#059669">기술:</text>
    <text x="1720" y="990" class="value">GML → SGML → HTML → Markdown</text>
    <text x="1720" y="1013" class="example">&lt;h1&gt;...&lt;/h1&gt;, # Heading</text>

    <!-- Independence -->
    <rect x="1680" y="1050" width="600" height="80" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="1980" y="1080" text-anchor="middle" class="essence" fill="#059669">독립적 차원</text>
    <text x="1980" y="1105" text-anchor="middle" class="value">의미만 다루고, 렌더링은 모름</text>
  </g>

  <!-- Bottom: Why exactly 3? -->
  <rect x="80" y="1200" width="2240" height="750" rx="15" fill="white" stroke="#7c3aed" stroke-width="4"/>

  <text x="1200" y="1260" text-anchor="middle" class="section-title" style="font-size: 32px;" fill="#7c3aed">왜 정확히 3개인가?</text>
  <line x1="120" y1="1280" x2="2280" y2="1280" stroke="#e9d5ff" stroke-width="2"/>

  <!-- Mathematical explanation -->
  <rect x="120" y="1310" width="1050" height="280" rx="10" fill="#faf5ff"/>
  <text x="645" y="1350" text-anchor="middle" class="label" style="font-size: 20px;" fill="#7c3aed">수학적/철학적 이유</text>

  <text x="150" y="1390" class="value" font-weight="700" style="font-size: 15px;">문서의 3가지 독립적 속성:</text>

  <text x="180" y="1425" class="value" style="font-size: 14px;">1. <tspan font-weight="700" fill="#d97706">공간 (Space)</tspan> - 물리적 위치</text>
  <text x="200" y="1450" class="example">→ "어디에 있는가?" (좌표계)</text>
  <text x="200" y="1473" class="example">→ 2차원 평면 필요 (x, y)</text>

  <text x="180" y="1508" class="value" style="font-size: 14px;">2. <tspan font-weight="700" fill="#1e40af">시각 (Visual)</tspan> - 보이는 모습</text>
  <text x="200" y="1533" class="example">→ "어떻게 보이는가?" (타이포그래피)</text>
  <text x="200" y="1556" class="example">→ 폰트, 크기, 색상, 간격</text>

  <text x="180" y="1591" class="value" style="font-size: 14px;">3. <tspan font-weight="700" fill="#059669">의미 (Semantic)</tspan> - 논리적 구조</text>
  <text x="200" y="1616" class="example">→ "무엇을 의미하는가?" (구조)</text>
  <text x="200" y="1639" class="example">→ 계층, 관계, 역할</text>

  <text x="150" y="1680" class="value" font-weight="700" style="font-size: 15px; fill: #7c3aed;">이 3가지는 서로 직교(orthogonal)한다:</text>
  <text x="180" y="1710" class="value">• 위치를 바꿔도 의미는 변하지 않음</text>
  <text x="180" y="1735" class="value">• 폰트를 바꿔도 구조는 유지됨</text>
  <text x="180" y="1760" class="value">• 구조를 바꿔도 렌더링은 독립적</text>

  <!-- Historical explanation -->
  <rect x="1220" y="1310" width="1050" height="280" rx="10" fill="#faf5ff"/>
  <text x="1745" y="1350" text-anchor="middle" class="label" style="font-size: 20px;" fill="#7c3aed">역사적 이유</text>

  <text x="1250" y="1390" class="value" font-weight="700" style="font-size: 15px;">3가지 다른 필요에서 독립적으로 탄생:</text>

  <text x="1280" y="1425" class="value" style="font-size: 14px;"><tspan font-weight="700" fill="#d97706">Drawing</tspan>: 공학자/건축가</text>
  <text x="1300" y="1450" class="example">→ 정밀한 도면 필요</text>
  <text x="1300" y="1473" class="example">→ 좌표와 측정이 중요</text>

  <text x="1280" y="1508" class="value" style="font-size: 14px;"><tspan font-weight="700" fill="#1e40af">Typesetting</tspan>: 출판업자/인쇄공</text>
  <text x="1300" y="1533" class="example">→ 아름다운 책 만들기</text>
  <text x="1300" y="1556" class="example">→ 타이포그래피가 중요</text>

  <text x="1280" y="1591" class="value" style="font-size: 14px;"><tspan font-weight="700" fill="#059669">Markup</tspan>: 법률가/의사/학자</text>
  <text x="1300" y="1616" class="example">→ 복잡한 문서 구조화</text>
  <text x="1300" y="1639" class="example">→ 논리적 정리가 중요</text>

  <text x="1250" y="1680" class="value" font-weight="700" style="font-size: 15px; fill: #7c3aed;">각자 독립적으로 발전하다가:</text>
  <text x="1280" y="1710" class="value">• 컴퓨터 시대에 만남</text>
  <text x="1280" y="1735" class="value">• 통합 시도 (일부 성공, 일부 실패)</text>
  <text x="1280" y="1760" class="value">• 각자의 영역은 여전히 독립적</text>

  <!-- Key insight box -->
  <rect x="120" y="1620" width="2150" height="310" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="1195" y="1665" text-anchor="middle" class="section-title" fill="#7c3aed" style="font-size: 26px;">💡 핵심 통찰</text>

  <rect x="160" y="1690" width="1000" height="220" rx="8" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <text x="660" y="1725" text-anchor="middle" class="label" fill="#7c3aed">4번째 패러다임이 없는 이유:</text>
  <text x="200" y="1760" class="value" style="font-size: 14px;">문서의 근본 속성이 3가지뿐이기 때문</text>
  <text x="220" y="1785" class="value">• 공간 (어디에)</text>
  <text x="220" y="1810" class="value">• 시각 (어떻게)</text>
  <text x="220" y="1835" class="value">• 의미 (무엇을)</text>

  <text x="200" y="1870" class="value" style="font-size: 14px; font-weight: 700;">WYSIWYG는 새 패러다임이 아님:</text>
  <text x="220" y="1895" class="example">→ Drawing + Typesetting의 GUI 조합일 뿐</text>

  <rect x="1210" y="1690" width="1000" height="220" rx="8" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <text x="1710" y="1725" text-anchor="middle" class="label" fill="#7c3aed">왜 충돌이 일어나는가?</text>
  <text x="1250" y="1760" class="value" style="font-size: 14px;">각 패러다임은 다른 차원을 다루기 때문</text>

  <text x="1270" y="1795" class="value">• Drawing: 좌표만 알고, 의미는 모름</text>
  <text x="1270" y="1820" class="value">• Typesetting: 시각만 알고, 구조는 모름</text>
  <text x="1270" y="1845" class="value">• Markup: 의미만 알고, 렌더링은 모름</text>

  <text x="1250" y="1880" class="value" style="font-size: 14px; font-weight: 700;">서로 다른 차원을 억지로 합치면:</text>
  <text x="1270" y="1905" class="example">→ 실패! (WYSIWYG ↔ TeX)</text>

</svg>
