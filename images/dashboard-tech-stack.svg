<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="650" viewBox="-30 20 900 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Quarto Core Gradient -->
    <radialGradient id="quartoCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:0.8" />
    </radialGradient>
    
    <!-- Layer Gradients (Brighter for better contrast) -->
    <radialGradient id="uiGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FAF5FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:0.8" />
    </radialGradient>
    
    <radialGradient id="vizGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F0FDF4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22C55E;stop-opacity:0.8" />
    </radialGradient>
    
    <radialGradient id="processGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F0F9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:0.8" />
    </radialGradient>
    
    <radialGradient id="dataGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFBEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:0.8" />
    </radialGradient>
    
    <!-- Glow Effects -->
    <filter id="quartoGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
    
    <!-- Flowing Data Animation -->
    <filter id="dataFlow">
      <feGaussianBlur stdDeviation="2" result="blurred"/>
      <feMerge>
        <feMergeNode in="blurred"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Darker Space Background -->
  <rect width="900" height="940" fill="#1E293B"/>
  
  <!-- Starfield Effect -->
  <circle cx="150" cy="120" r="1" fill="#F8FAFC" opacity="0.6"/>
  <circle cx="750" cy="180" r="1.5" fill="#F8FAFC" opacity="0.8"/>
  <circle cx="200" cy="750" r="1" fill="#F8FAFC" opacity="0.7"/>
  <circle cx="820" cy="680" r="1" fill="#F8FAFC" opacity="0.5"/>
  <circle cx="680" cy="100" r="1" fill="#F8FAFC" opacity="0.6"/>
  <circle cx="100" cy="400" r="1.2" fill="#F8FAFC" opacity="0.9"/>
  
  <!-- Orbital Paths (More visible) -->
  <circle cx="420" cy="420" r="130" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4"/>
  <circle cx="420" cy="420" r="210" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4"/>
  <circle cx="420" cy="420" r="290" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4"/>
  <circle cx="420" cy="420" r="370" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Central Quarto Core -->
  <g id="quarto-core">
    <circle cx="420" cy="420" r="60" fill="url(#quartoCore)" filter="url(#quartoGlow)"/>
    <circle cx="420" cy="420" r="45" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.8">
      <animate attributeName="r" values="45;50;45" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="420" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
      Quarto
    </text>
    <text x="420" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
      Core
    </text>
    <text x="420" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E2E8F0">
      Integrated Rendering
    </text>
  </g>
  
  <!-- Layer 4: Reactive UI (Innermost orbit - radius 130px) -->
  <g id="ui-layer">
    <!-- Shiny Server -->
    <g transform="translate(550, 420)">
      <circle r="35" fill="url(#uiGradient)" filter="url(#nodeGlow)"/>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#581C87">Shiny</text>
      <text y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#581C87">Server</text>
      <text y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7C3AED">R-based</text>
    </g>
    
    <!-- Dash -->
    <g transform="translate(420, 290)">
      <circle r="32" fill="url(#uiGradient)" filter="url(#nodeGlow)"/>
      <text y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#581C87">Dash</text>
      <text y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7C3AED">Python</text>
    </g>
    
    <!-- Observable -->
    <g transform="translate(290, 420)">
      <circle r="30" fill="url(#uiGradient)" filter="url(#nodeGlow)"/>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#581C87">Observable</text>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7C3AED">JavaScript</text>
    </g>
    
    <!-- Streamlit -->
    <g transform="translate(420, 550)">
      <circle r="28" fill="url(#uiGradient)" filter="url(#nodeGlow)"/>
      <text y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#581C87">Streamlit</text>
      <text y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7C3AED">Apps</text>
    </g>
  </g>
  
  <!-- Layer 3: Visualization (Second orbit - radius 210px) -->
  <g id="viz-layer">
    <!-- plotly -->
    <g transform="translate(630, 420)">
      <circle r="40" fill="url(#vizGradient)" filter="url(#nodeGlow)"/>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#14532D">plotly</text>
      <text y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">Interactive</text>
      <text y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#15803D">Charts</text>
    </g>
    
    <!-- ggplot2 -->
    <g transform="translate(420, 210)">
      <circle r="38" fill="url(#vizGradient)" filter="url(#nodeGlow)"/>
      <text y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#14532D">ggplot2</text>
      <text y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">Grammar</text>
    </g>
    
    <!-- leaflet -->
    <g transform="translate(210, 420)">
      <circle r="36" fill="url(#vizGradient)" filter="url(#nodeGlow)"/>
      <text y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#14532D">leaflet</text>
      <text y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">Maps</text>
    </g>
    
    <!-- gt -->
    <g transform="translate(567, 567)">
      <circle r="34" fill="url(#vizGradient)" filter="url(#nodeGlow)"/>
      <text y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#14532D">gt</text>
      <text y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">Tables</text>
    </g>
    
    <!-- D3.js -->
    <g transform="translate(273, 273)">
      <circle r="32" fill="url(#vizGradient)" filter="url(#nodeGlow)"/>
      <text y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#14532D">D3.js</text>
      <text y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#166534">Custom</text>
    </g>
  </g>
  
  <!-- Layer 2: Processing Engine (Third orbit - radius 290px) -->
  <g id="processing-layer">
    <!-- R/tidyverse -->
    <g transform="translate(710, 420)">
      <circle r="45" fill="url(#processGradient)" filter="url(#nodeGlow)"/>
      <text y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E3A8A">R</text>
      <text y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1E40AF">tidyverse</text>
      <text y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2563EB">dplyr/ggplot</text>
    </g>
    
    <!-- Python/pandas -->
    <g transform="translate(420, 130)">
      <circle r="43" fill="url(#processGradient)" filter="url(#nodeGlow)"/>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1E3A8A">Python</text>
      <text y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1E40AF">pandas/sklearn</text>
    </g>
    
    <!-- Julia -->
    <g transform="translate(130, 420)">
      <circle r="38" fill="url(#processGradient)" filter="url(#nodeGlow)"/>
      <text y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E3A8A">Julia</text>
      <text y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1E40AF">High Performance</text>
    </g>
    
    <!-- SQL -->
    <g transform="translate(625, 625)">
      <circle r="35" fill="url(#processGradient)" filter="url(#nodeGlow)"/>
      <text y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A8A">SQL</text>
      <text y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1E40AF">Query</text>
    </g>
    
    <!-- JavaScript/Observable -->
    <g transform="translate(215, 215)">
      <circle r="33" fill="url(#processGradient)" filter="url(#nodeGlow)"/>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E3A8A">JavaScript</text>
      <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1E40AF">OJS</text>
    </g>
  </g>
  
  <!-- Layer 1: Data Sources (Outermost orbit - radius 370px) -->
  <g id="data-layer">
    <!-- SQL Database -->
    <g transform="translate(790, 420)">
      <circle r="42" fill="url(#dataGradient)" filter="url(#nodeGlow)"/>
      <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#78350F">Database</text>
      <text y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400E">PostgreSQL</text>
    </g>
    
    <!-- REST API -->
    <g transform="translate(420, 50)">
      <circle r="40" fill="url(#dataGradient)" filter="url(#nodeGlow)"/>
      <text y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#78350F">API</text>
      <text y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400E">REST/JSON</text>
    </g>
    
    <!-- WebSocket -->
    <g transform="translate(50, 420)">
      <circle r="38" fill="url(#dataGradient)" filter="url(#nodeGlow)"/>
      <text y="-1" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#78350F">WebSocket</text>
      <text y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400E">Real-time</text>
    </g>
    
    <!-- File System -->
    <g transform="translate(682, 682)">
      <circle r="36" fill="url(#dataGradient)" filter="url(#nodeGlow)"/>
      <text y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#78350F">Files</text>
      <text y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400E">CSV/Excel</text>
    </g>
    
    <!-- Cloud Storage -->
    <g transform="translate(158, 158)">
      <circle r="34" fill="url(#dataGradient)" filter="url(#nodeGlow)"/>
      <text y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#78350F">Cloud</text>
      <text y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400E">S3/GCS</text>
    </g>
  </g>
  
  <!-- Data Flow Lines (Curved paths to center) -->
  <g id="data-flows" opacity="0.7">
    <!-- From outer layer to Quarto Core -->
    <path d="M 790 420 Q 605 400 480 420" stroke="#06B6D4" stroke-width="3" fill="none" filter="url(#dataFlow)">
      <animate attributeName="stroke-dasharray" values="0,1000;25,975;0,1000" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <path d="M 420 50 Q 420 235 420 360" stroke="#06B6D4" stroke-width="3" fill="none" filter="url(#dataFlow)">
      <animate attributeName="stroke-dasharray" values="0,1000;25,975;0,1000" dur="4s" begin="1s" repeatCount="indefinite"/>
    </path>
    
    <path d="M 50 420 Q 235 420 360 420" stroke="#06B6D4" stroke-width="3" fill="none" filter="url(#dataFlow)">
      <animate attributeName="stroke-dasharray" values="0,1000;25,975;0,1000" dur="4s" begin="2s" repeatCount="indefinite"/>
    </path>
    
    <path d="M 682 682 Q 551 551 480 480" stroke="#06B6D4" stroke-width="3" fill="none" filter="url(#dataFlow)">
      <animate attributeName="stroke-dasharray" values="0,1000;25,975;0,1000" dur="4s" begin="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Floating Data Particles -->
  <g id="particles">
    <circle r="2" fill="#06B6D4" opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite">
        <mpath href="#dataPath1"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Legend/Description moved to left bottom -->
  <g id="legend" transform="translate(20, 620)">
    <rect width="330" height="160" rx="15" fill="#334155" stroke="#475569" stroke-width="2" opacity="0.95"/>
    
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#F8FAFC">
      Tech Ecosystem Legend
    </text>
    
    <!-- Data Sources -->
    <g transform="translate(20, 45)">
      <circle r="8" fill="url(#dataGradient)"/>
      <text x="20" y="6" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FED7AA">Data Sources</text>
      <text x="20" y="20" font-family="Arial, sans-serif" font-size="10" fill="#FDE68A">Database, API, Files</text>
    </g>
    
    <!-- Processing Engine -->
    <g transform="translate(20, 75)">
      <circle r="8" fill="url(#processGradient)"/>
      <text x="20" y="6" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#BFDBFE">Processing Engine</text>
      <text x="20" y="20" font-family="Arial, sans-serif" font-size="10" fill="#DBEAFE">R, Python, Julia, SQL</text>
    </g>
    
    <!-- Visualization -->
    <g transform="translate(170, 45)">
      <circle r="8" fill="url(#vizGradient)"/>
      <text x="20" y="6" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#A7F3D0">Visualization</text>
      <text x="20" y="20" font-family="Arial, sans-serif" font-size="10" fill="#D1FAE5">plotly, ggplot2, gt</text>
    </g>
    
    <!-- Reactive UI -->
    <g transform="translate(170, 75)">
      <circle r="8" fill="url(#uiGradient)"/>
      <text x="20" y="6" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E9D5FF">Reactive UI</text>
      <text x="20" y="20" font-family="Arial, sans-serif" font-size="10" fill="#F3E8FF">Shiny, Dash, Observable</text>
    </g>
    
    <!-- Quarto Core -->
    <g transform="translate(50, 115)">
      <circle r="12" fill="url(#quartoCore)"/>
      <text x="25" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#BFDBFE">Quarto Core</text>
      <text x="105" y="6" font-family="Arial, sans-serif" font-size="11" fill="#CBD5E1">Integrated Rendering Engine</text>
    </g>
    
    <!-- Description -->
    <text x="100" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#CBD5E1">
      Data Flow: Outer → Center Convergence
    </text>
    <text x="15" y="153" text-anchor="left" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">
      All technologies connected to Quarto center forming unified dashboard environment
    </text>
  </g>
</svg>