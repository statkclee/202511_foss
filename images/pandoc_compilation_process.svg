<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 20px; font-weight: bold; fill: #333; }
      .subtitle { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 16px; font-weight: 600; fill: #555; }
      .label { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 16px; font-weight: 500; fill: #333; }
      .command { font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-size: 13px; fill: #666; }
      .process { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 15px; fill: #8e44ad; font-weight: 500; }

      .input-box { fill: #F7FBFF; stroke: #4A90E2; stroke-width: 2; rx: 3; }
      .pandoc-box { fill: #F8F4FF; stroke: #8E44AD; stroke-width: 2.5; rx: 3; }
      .output-box { fill: #F5F5F5; stroke: #999; stroke-width: 1.5; rx: 3; }

      .arrow { fill: #666; }
      .process-arrow { fill: #8e44ad; stroke: #8e44ad; stroke-width: 1.5; }

      .category-label { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 15px; font-weight: 600; fill: #666; }
    </style>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow"/>
    </marker>
    
    <marker id="process-arrowhead" markerWidth="12" markerHeight="8" 
            refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" class="process-arrow"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#fafafa"/>
  
  <!-- Input Section -->
  <rect x="80" y="60" width="220" height="160" class="input-box"/>
  <text x="190" y="95" text-anchor="middle" class="subtitle">Input Files</text>

  <text x="100" y="125" class="label" font-size="15">• manuscript.md</text>
  <text x="100" y="148" class="label" font-size="15">• document.markdown</text>
  <text x="100" y="171" class="label" font-size="15">• paper.pandoc</text>

  <text x="100" y="200" class="command" font-size="12">YAML Metadata</text>
  <text x="100" y="215" class="command" font-size="12">+ Template Settings</text>

  <!-- Pandoc Engine -->
  <rect x="400" y="40" width="320" height="200" class="pandoc-box"/>
  <text x="560" y="80" text-anchor="middle" class="title">Pandoc Engine</text>

  <!-- Process Steps -->
  <text x="425" y="115" class="process">1. Parsing</text>
  <text x="425" y="140" class="process">2. AST Conversion</text>
  <text x="425" y="165" class="process">3. Template Application</text>
  <text x="425" y="190" class="process">4. Format Rendering</text>

  <!-- Basic Command -->
  <rect x="415" y="205" width="280" height="25" fill="#ffffff" stroke="#8e44ad" stroke-width="1" rx="3"/>
  <text x="555" y="222" text-anchor="middle" class="command" font-size="12">pandoc input.md -o output.pdf</text>

  <!-- Arrows from input to pandoc -->
  <line x1="300" y1="140" x2="395" y2="140" stroke="#4A90E2" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Universal Document Converter text -->
  <text x="950" y="125" text-anchor="middle" fill="#999" font-size="32">
    Universal Document Converter
  </text>
  <text x="950" y="152" text-anchor="middle" fill="#999" font-size="18">
    Supporting 150+ format conversions
  </text>
  
  <!-- Arrows from Pandoc to outputs -->
  <line x1="560" y1="240" x2="560" y2="270" stroke="#8e44ad" stroke-width="2" marker-end="url(#process-arrowhead)"/>

  <!-- Output Formats label -->
  <rect x="460" y="272" width="200" height="30" fill="#ffffff" stroke="#8e44ad" stroke-width="1" rx="3"/>
  <text x="560" y="292" text-anchor="middle" class="category-label">Output Formats</text>

  <!-- Horizontal distribution arrows -->
  <line x1="560" y1="302" x2="100" y2="302" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="100" y1="302" x2="100" y2="330" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#process-arrowhead)"/>

  <line x1="560" y1="302" x2="560" y2="330" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#process-arrowhead)"/>

  <line x1="560" y1="302" x2="1020" y2="302" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="1020" y1="302" x2="1020" y2="330" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#process-arrowhead)"/>

  <!-- Row 1: Document & Web Formats -->
  <rect x="50" y="335" width="100" height="70" class="output-box"/>
  <text x="100" y="360" text-anchor="middle" class="label">PDF</text>
  <text x="100" y="380" text-anchor="middle" class="command">.pdf</text>
  <text x="100" y="395" text-anchor="middle" class="command" font-size="11">Document</text>

  <rect x="165" y="335" width="100" height="70" class="output-box"/>
  <text x="215" y="360" text-anchor="middle" class="label">Word</text>
  <text x="215" y="380" text-anchor="middle" class="command">.docx</text>
  <text x="215" y="395" text-anchor="middle" class="command" font-size="11">Document</text>

  <rect x="280" y="335" width="100" height="70" class="output-box"/>
  <text x="330" y="360" text-anchor="middle" class="label">ODT</text>
  <text x="330" y="380" text-anchor="middle" class="command">.odt</text>
  <text x="330" y="395" text-anchor="middle" class="command" font-size="11">Document</text>

  <rect x="395" y="335" width="100" height="70" class="output-box"/>
  <text x="445" y="360" text-anchor="middle" class="label">HTML</text>
  <text x="445" y="380" text-anchor="middle" class="command">.html</text>
  <text x="445" y="395" text-anchor="middle" class="command" font-size="11">Web</text>

  <rect x="510" y="335" width="100" height="70" class="output-box"/>
  <text x="560" y="360" text-anchor="middle" class="label">EPUB</text>
  <text x="560" y="380" text-anchor="middle" class="command">.epub</text>
  <text x="560" y="395" text-anchor="middle" class="command" font-size="11">Web</text>

  <rect x="625" y="335" width="100" height="70" class="output-box"/>
  <text x="675" y="360" text-anchor="middle" class="label">RevealJS</text>
  <text x="675" y="380" text-anchor="middle" class="command">revealjs</text>
  <text x="675" y="395" text-anchor="middle" class="command" font-size="11">Presentation</text>

  <rect x="740" y="335" width="100" height="70" class="output-box"/>
  <text x="790" y="360" text-anchor="middle" class="label">Beamer</text>
  <text x="790" y="380" text-anchor="middle" class="command">.tex</text>
  <text x="790" y="395" text-anchor="middle" class="command" font-size="11">Presentation</text>

  <rect x="855" y="335" width="100" height="70" class="output-box"/>
  <text x="905" y="360" text-anchor="middle" class="label">PowerPoint</text>
  <text x="905" y="380" text-anchor="middle" class="command">.pptx</text>
  <text x="905" y="395" text-anchor="middle" class="command" font-size="11">Presentation</text>

  <rect x="970" y="335" width="100" height="70" class="output-box"/>
  <text x="1020" y="360" text-anchor="middle" class="label">LaTeX</text>
  <text x="1020" y="380" text-anchor="middle" class="command">.tex</text>
  <text x="1020" y="395" text-anchor="middle" class="command" font-size="11">Academic</text>

  <rect x="1085" y="335" width="100" height="70" class="output-box"/>
  <text x="1135" y="360" text-anchor="middle" class="label">RTF</text>
  <text x="1135" y="380" text-anchor="middle" class="command">.rtf</text>
  <text x="1135" y="395" text-anchor="middle" class="command" font-size="11">Document</text>

  <!-- Row 2: Additional Formats -->
  <rect x="50" y="425" width="100" height="70" class="output-box"/>
  <text x="100" y="450" text-anchor="middle" class="label">Markdown</text>
  <text x="100" y="470" text-anchor="middle" class="command">.md</text>
  <text x="100" y="485" text-anchor="middle" class="command" font-size="11">Plain Text</text>

  <rect x="165" y="425" width="100" height="70" class="output-box"/>
  <text x="215" y="450" text-anchor="middle" class="label">Plain Text</text>
  <text x="215" y="470" text-anchor="middle" class="command">.txt</text>
  <text x="215" y="485" text-anchor="middle" class="command" font-size="11">Plain Text</text>

  <rect x="280" y="425" width="100" height="70" class="output-box"/>
  <text x="330" y="450" text-anchor="middle" class="label">JSON</text>
  <text x="330" y="470" text-anchor="middle" class="command">.json</text>
  <text x="330" y="485" text-anchor="middle" class="command" font-size="11">Data</text>

  <rect x="395" y="425" width="100" height="70" class="output-box"/>
  <text x="445" y="450" text-anchor="middle" class="label">XML</text>
  <text x="445" y="470" text-anchor="middle" class="command">.xml</text>
  <text x="445" y="485" text-anchor="middle" class="command" font-size="11">Data</text>

  <rect x="510" y="425" width="100" height="70" class="output-box"/>
  <text x="560" y="450" text-anchor="middle" class="label">AsciiDoc</text>
  <text x="560" y="470" text-anchor="middle" class="command">.adoc</text>
  <text x="560" y="485" text-anchor="middle" class="command" font-size="11">Markup</text>

  <rect x="625" y="425" width="100" height="70" class="output-box"/>
  <text x="675" y="450" text-anchor="middle" class="label">Org</text>
  <text x="675" y="470" text-anchor="middle" class="command">.org</text>
  <text x="675" y="485" text-anchor="middle" class="command" font-size="11">Markup</text>

  <rect x="740" y="425" width="100" height="70" class="output-box"/>
  <text x="790" y="450" text-anchor="middle" class="label">ConTeXt</text>
  <text x="790" y="470" text-anchor="middle" class="command">.tex</text>
  <text x="790" y="485" text-anchor="middle" class="command" font-size="11">Typesetting</text>

  <rect x="855" y="425" width="100" height="70" class="output-box"/>
  <text x="905" y="450" text-anchor="middle" class="label">DocBook</text>
  <text x="905" y="470" text-anchor="middle" class="command">.xml</text>
  <text x="905" y="485" text-anchor="middle" class="command" font-size="11">Technical</text>

  <rect x="970" y="425" width="100" height="70" class="output-box"/>
  <text x="1020" y="450" text-anchor="middle" class="label">JATS</text>
  <text x="1020" y="470" text-anchor="middle" class="command">.xml</text>
  <text x="1020" y="485" text-anchor="middle" class="command" font-size="11">Journal</text>

  <rect x="1085" y="425" width="100" height="70" class="output-box"/>
  <text x="1135" y="450" text-anchor="middle" class="label">MediaWiki</text>
  <text x="1135" y="470" text-anchor="middle" class="command">.wiki</text>
  <text x="1135" y="485" text-anchor="middle" class="command" font-size="11">Wiki</text>

  <!-- Command Examples Box -->
  <rect x="50" y="530" width="1100" height="240" fill="#f8f9fa" stroke="#ddd" stroke-width="1.5" rx="3"/>
  <text x="70" y="560" class="subtitle">Command Examples</text>

  <!-- Command examples in columns -->
  <text x="70" y="590" class="label" font-size="14">Document Conversion:</text>
  <text x="80" y="610" class="command">pandoc manuscript.md -o manuscript.pdf</text>
  <text x="80" y="630" class="command">pandoc document.md -o document.docx</text>

  <text x="420" y="590" class="label" font-size="14">Web Publishing:</text>
  <text x="430" y="610" class="command">pandoc article.md -o article.html</text>
  <text x="430" y="630" class="command">pandoc book.md -o book.epub</text>

  <text x="770" y="590" class="label" font-size="14">Presentations:</text>
  <text x="780" y="610" class="command">pandoc slides.md -t revealjs -o slides.html</text>
  <text x="780" y="630" class="command">pandoc slides.md -t beamer -o slides.pdf</text>

  <text x="70" y="670" class="label" font-size="14">Advanced Options:</text>
  <text x="80" y="690" class="command">pandoc input.md --template=custom.tex -o output.pdf</text>
  <text x="80" y="710" class="command">pandoc input.md --toc --number-sections -o output.html</text>
  <text x="80" y="730" class="command">pandoc input.md --bibliography=refs.bib --csl=apa.csl -o paper.pdf</text>

  <text x="80" y="755" class="command" fill="#999" font-size="11">Note: Extensive customization options available via command-line flags and templates</text>

</svg>