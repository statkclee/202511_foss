<svg width="800" height="380" viewBox="50 80 800 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 그라데이션 정의 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef9e7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:1"/>
    </linearGradient>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:0.05"/>
    </linearGradient>

    <!-- 그림자 필터 -->
    <filter id="dropshadow">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <style>
    .title { font-family: 'Noto Sans KR', sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
    .subtitle { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; fill: #64748b; text-anchor: middle; }
    .word-text { font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 600; text-anchor: middle; }
    .hangul-box { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; fill: #1e293b; text-anchor: middle; font-weight: bold; }
    .hangul-used { fill: #059669; }
    .hangul-unused { fill: #9ca3af; }
    .explanation { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
    .connection-line { stroke-width: 2; fill: none; opacity: 0.8; }
    .section-label { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: bold; fill: #374151; text-anchor: start; }
  </style>

  <!-- 배경 -->
  <rect width="1200" height="600" fill="url(#bgGrad)"/>
  
  <!-- 단어 배치 -->
  <g id="words" transform="translate(0, -17)">
    <rect x="200" y="120" width="80" height="35" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="240" y="142" class="word-text" style="fill: #d97706;">다람쥐</text>
    
    <rect x="320" y="120" width="60" height="35" rx="5" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="350" y="142" class="word-text" style="fill: #7c3aed;">헌</text>
    
    <rect x="420" y="120" width="100" height="35" rx="5" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <text x="470" y="142" class="word-text" style="fill: #dc2626;">쳇바퀴에</text>
    
    <rect x="560" y="120" width="80" height="35" rx="5" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="600" y="142" class="word-text" style="fill: #059669;">타고파</text>
  </g>

  <!-- 자음 배치 (기본 자음 14개) -->
  <text x="100" y="250" class="section-label">기본 자음 (14개)</text>
  <g id="consonants" transform="translate(100, 279)">
    <!-- ㄱ (타고파) -->
    <rect x="0" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="20" y="26" class="hangul-box hangul-used">ㄱ</text>
    <!-- ㄴ (헌) -->
    <rect x="50" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="70" y="26" class="hangul-box hangul-used">ㄴ</text>
    <!-- ㄷ (다람쥐) -->
    <rect x="100" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="120" y="26" class="hangul-box hangul-used">ㄷ</text>
    <!-- ㄹ (다람쥐) -->
    <rect x="150" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="170" y="26" class="hangul-box hangul-used">ㄹ</text>
    <!-- ㅁ (다람쥐) -->
    <rect x="200" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="220" y="26" class="hangul-box hangul-used">ㅁ</text>
    <!-- ㅂ (바) -->
    <rect x="250" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="270" y="26" class="hangul-box hangul-used">ㅂ</text>
    <!-- ㅅ (쳇) -->
    <rect x="300" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="320" y="26" class="hangul-box hangul-used">ㅅ</text>
    <!-- ㅇ (미사용) -->
    <rect x="350" y="0" width="40" height="40" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="370" y="26" class="hangul-box hangul-unused">ㅇ</text>
    <!-- ㅈ (쥐) -->
    <rect x="400" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="420" y="26" class="hangul-box hangul-used">ㅈ</text>
    <!-- ㅊ (쳇) -->
    <rect x="450" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="470" y="26" class="hangul-box hangul-used">ㅊ</text>
    <!-- ㅋ (퀴) -->
    <rect x="500" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="520" y="26" class="hangul-box hangul-used">ㅋ</text>
    <!-- ㅌ (타) -->
    <rect x="550" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="570" y="26" class="hangul-box hangul-used">ㅌ</text>
    <!-- ㅍ (파) -->
    <rect x="600" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="620" y="26" class="hangul-box hangul-used">ㅍ</text>
    <!-- ㅎ (헌) -->
    <rect x="650" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="670" y="26" class="hangul-box hangul-used">ㅎ</text>
  </g>

  <!-- 모음 배치 (기본 모음 10개) -->
  <text x="100" y="360" class="section-label">기본 모음 (10개)</text>
  <g id="vowels" transform="translate(100, 380)">
    <!-- ㅏ (다람) -->
    <rect x="0" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="20" y="26" class="hangul-box hangul-used">ㅏ</text>
    <!-- ㅑ (미사용) -->
    <rect x="50" y="0" width="40" height="40" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="70" y="26" class="hangul-box hangul-unused">ㅑ</text>
    <!-- ㅓ (헌) -->
    <rect x="100" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="120" y="26" class="hangul-box hangul-used">ㅓ</text>
    <!-- ㅕ (미사용) -->
    <rect x="150" y="0" width="40" height="40" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="170" y="26" class="hangul-box hangul-unused">ㅕ</text>
    <!-- ㅗ (고) -->
    <rect x="200" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="220" y="26" class="hangul-box hangul-used">ㅗ</text>
    <!-- ㅛ (미사용) -->
    <rect x="250" y="0" width="40" height="40" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="270" y="26" class="hangul-box hangul-unused">ㅛ</text>
    <!-- ㅜ (쥐) -->
    <rect x="300" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="320" y="26" class="hangul-box hangul-used">ㅜ</text>
    <!-- ㅠ (미사용) -->
    <rect x="350" y="0" width="40" height="40" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="370" y="26" class="hangul-box hangul-unused">ㅠ</text>
    <!-- ㅡ (쥐) -->
    <rect x="400" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="420" y="26" class="hangul-box hangul-used">ㅡ</text>
    <!-- ㅣ (쥐, 퀴) -->
    <rect x="450" y="0" width="40" height="40" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="470" y="26" class="hangul-box hangul-used">ㅣ</text>
  </g>

            <!-- 연결선들 (끝점 = 각 박스 중심) -->
            <g id="connections">
              <!-- 다람쥐 → ㄷ, ㄹ, ㅁ, ㅈ (주황) -->
              <path d="M 240 137.5 Q 200 210 220 280" class="connection-line" stroke="#d97706"/>  <!-- ㄷ center (220,280) -->
              <path d="M 240 137.5 Q 230 210 270 280" class="connection-line" stroke="#d97706"/>  <!-- ㄹ center (270,280) -->
              <path d="M 240 137.5 Q 260 210 320 280" class="connection-line" stroke="#d97706"/>  <!-- ㅁ center (320,280) -->
              <path d="M 240 137.5 Q 460 210 520 280" class="connection-line" stroke="#d97706"/>  <!-- ㅈ center (520,280) -->

              <!-- 헌 → ㅎ, ㄴ (보라) -->
              <path d="M 350 137.5 Q 600 210 770 280" class="connection-line" stroke="#7c3aed"/>  <!-- ㅎ center (770,280) -->
              <path d="M 350 137.5 Q 240 210 170 280" class="connection-line" stroke="#7c3aed"/>  <!-- ㄴ center (170,280) -->

              <!-- 쳇바퀴에 → ㅊ, ㅅ, ㅂ, ㅋ, ㅇ (빨강) -->
              <path d="M 470 137.5 Q 580 210 570 280" class="connection-line" stroke="#dc2626"/>  <!-- ㅊ center (570,280) -->
              <path d="M 470 137.5 Q 420 210 420 280" class="connection-line" stroke="#dc2626"/>  <!-- ㅅ center (420,280) -->
              <path d="M 470 137.5 Q 360 210 370 280" class="connection-line" stroke="#dc2626"/>  <!-- ㅂ center (370,280) -->
              <path d="M 470 137.5 Q 640 210 620 280" class="connection-line" stroke="#dc2626"/>  <!-- ㅋ center (620,280) -->
              <path d="M 470 137.5 Q 460 210 470 280" class="connection-line" stroke="#dc2626"/>  <!-- ㅇ center (470,280) -->

              <!-- 타고파 → ㅌ, ㄱ, ㅍ (초록) -->
              <path d="M 600 137.5 Q 660 210 670 280" class="connection-line" stroke="#059669"/>  <!-- ㅌ center (670,280) -->
              <path d="M 600 137.5 Q 140 210 120 280" class="connection-line" stroke="#059669"/>  <!-- ㄱ center (120,280) -->
              <path d="M 600 137.5 Q 740 210 720 280" class="connection-line" stroke="#059669"/>  <!-- ㅍ center (720,280) -->
            </g>

  <!-- 하단 설명 -->
  <text x="600" y="440" class="explanation" style="font-weight: bold; fill: #dc2626;">한글의 조합 특성상 모든 자음과 모음을 포함하는 완전한 팬그램은 매우 어려움</text>
</svg>