<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4a5568"/>
    </marker>
    <marker id="dotarrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .k{font-family:'Noto Sans KR', sans-serif}
      .arrow{stroke:#4a5568;stroke-width:2;marker-end:url(#arrow)}
      .dotarrow{stroke:#9ca3af;stroke-width:1.5;stroke-dasharray:5,3;marker-end:url(#dotarrow)}
    </style>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="450" fill="#ffffff"/>


  <!-- ====== 위 줄 (좌->우) ====== -->
  <!-- 1: 인간 아웃라인 -->
  <g transform="translate(50,80)">
    <rect x="0" y="0" width="300" height="70" rx="15" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#shadow)"/>
    <text x="25" y="30" font-family="Arial" font-size="24">👤</text>
    <text x="150" y="30" class="k" font-size="16" font-weight="bold" text-anchor="middle" fill="#01579b">Human: Outline</text>
    <text x="150" y="48" class="k" font-size="12" text-anchor="middle" fill="#0277bd">Structure &amp; Core Content</text>
    
    <!-- 부가 작업 텍스트 -->
    <text x="150" y="85" class="k" font-size="10" text-anchor="middle" fill="#4682b4">Prompt Creation</text>
    <text x="150" y="97" class="k" font-size="10" text-anchor="middle" fill="#4682b4">Reference Collection</text>
  </g>

  <!-- 2: AI 초안 생성 -->
  <g transform="translate(450,80)">
    <rect x="0" y="0" width="300" height="70" rx="15" fill="#fff3e0" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
    <text x="25" y="30" font-family="Arial" font-size="24">🤖</text>
    <text x="150" y="30" class="k" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">AI: Draft Generation</text>
    <text x="150" y="48" class="k" font-size="12" text-anchor="middle" fill="#f57c00">Complete Draft Writing</text>
    
    <!-- 부가 작업 텍스트 -->
    <text x="150" y="85" class="k" font-size="10" text-anchor="middle" fill="#cc7a00">Code Generation</text>
    <text x="150" y="97" class="k" font-size="10" text-anchor="middle" fill="#cc7a00">Image Generation</text>
  </g>

  <!-- 3: 인간 검토 -->
  <g transform="translate(850,80)">
    <rect x="0" y="0" width="300" height="70" rx="15" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#shadow)"/>
    <text x="25" y="30" font-family="Arial" font-size="24">👤</text>
    <text x="150" y="30" class="k" font-size="16" font-weight="bold" text-anchor="middle" fill="#01579b">Human: Review</text>
    <text x="150" y="48" class="k" font-size="12" text-anchor="middle" fill="#0277bd">Accuracy &amp; Logic Check</text>
    
    <!-- 부가 작업 텍스트 -->
    <text x="150" y="85" class="k" font-size="10" text-anchor="middle" fill="#4682b4">Content Revision</text>
    <text x="150" y="97" class="k" font-size="10" text-anchor="middle" fill="#4682b4">Feedback Writing</text>
  </g>

  <!-- ====== 아래 줄 (우->좌) ====== -->
  <!-- 4: AI 스타일 통일 -->
  <g transform="translate(850,210)">
    <rect x="0" y="0" width="300" height="70" rx="15" fill="#fff3e0" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
    <text x="25" y="30" font-family="Arial" font-size="24">🤖</text>
    <text x="150" y="30" class="k" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">AI: Style Unification</text>
    <text x="150" y="48" class="k" font-size="12" text-anchor="middle" fill="#f57c00">Style &amp; Format Consistency</text>
    
    <!-- 부가 작업 텍스트 -->
    <text x="150" y="95" class="k" font-size="10" text-anchor="middle" fill="#cc7a00">Automatic Translation</text>
    <text x="150" y="107" class="k" font-size="10" text-anchor="middle" fill="#cc7a00">Format Standardization</text>
  </g>

  <!-- 5: 인간 팩트체크 -->
  <g transform="translate(450,210)">
    <rect x="0" y="0" width="300" height="70" rx="15" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" filter="url(#shadow)"/>
    <text x="25" y="30" font-family="Arial" font-size="24">👤</text>
    <text x="150" y="30" class="k" font-size="16" font-weight="bold" text-anchor="middle" fill="#01579b">Human: Fact Check</text>
    <text x="150" y="48" class="k" font-size="12" text-anchor="middle" fill="#0277bd">Fact Verification &amp; Final Validation</text>
    
    <!-- 부가 작업 텍스트 -->
    <text x="150" y="95" class="k" font-size="10" text-anchor="middle" fill="#4682b4">Source Verification</text>
    <text x="150" y="107" class="k" font-size="10" text-anchor="middle" fill="#4682b4">Legal Review</text>
  </g>

  <!-- 6: AI 최종 포맷팅 -->
  <g transform="translate(50,210)">
    <rect x="0" y="0" width="300" height="70" rx="15" fill="#fff3e0" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
    <text x="25" y="30" font-family="Arial" font-size="24">🤖</text>
    <text x="150" y="30" class="k" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">AI: Final Formatting</text>
    <text x="150" y="48" class="k" font-size="12" text-anchor="middle" fill="#f57c00">Publication Format Conversion</text>
    
    <!-- 부가 작업 텍스트 -->
    <text x="150" y="95" class="k" font-size="10" text-anchor="middle" fill="#cc7a00">HTML/PDF Generation</text>
    <text x="150" y="107" class="k" font-size="10" text-anchor="middle" fill="#cc7a00">SEO Optimization</text>
  </g>

  <!-- ====== 완성된 문서 ====== -->
  <g transform="translate(450,340)">
    <rect x="0" y="0" width="300" height="60" rx="15" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <text x="25" y="35" font-family="Arial" font-size="20">📄</text>
    <text x="150" y="32" class="k" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e7d32">Completed Document</text>
    <text x="150" y="48" class="k" font-size="12" text-anchor="middle" fill="#388e3c">Multi-format Publication Ready</text>
  </g>

  <!-- ====== 화살표 ====== -->
  <!-- 위줄 화살표 (좌→우) -->
  <line class="arrow" x1="350" y1="115" x2="450" y2="115"/>
  <line class="arrow" x1="750" y1="115" x2="850" y2="115"/>

  <!-- 피드백 화살표 (3→2) -->
  <path class="dotarrow" d="M 850,105 Q 800,50 750,105" fill="none"/>

  <!-- 세로 화살표 (3→4) -->
  <line class="arrow" x1="1000" y1="150" x2="1000" y2="210"/>

  <!-- 아래줄 화살표 (우→좌) -->
  <line class="arrow" x1="850" y1="245" x2="750" y2="245"/>
  <line class="arrow" x1="450" y1="245" x2="350" y2="245"/>

  <!-- 피드백 화살표 (5→4) -->
  <path class="dotarrow" d="M 450,235 Q 400,185 750,235" fill="none"/>

  <!-- 최종 화살표 (6→완성문서) -->
  <line class="arrow" x1="200" y1="280" x2="500" y2="340"/>
</svg>