<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- AI Era gradient -->
    <linearGradient id="aiGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Background gradient -->
    <linearGradient id="aiBgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F4FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="aiArrow" markerWidth="12" markerHeight="9" refX="12" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#4338CA"/>
    </marker>

    <!-- Circular arrow -->
    <marker id="circularArrow" markerWidth="16" markerHeight="12" refX="12" refY="6" orient="auto">
      <polygon points="0 0, 16 6, 0 12" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#aiBgGradient)"/>

  <!-- Title Section -->
  <rect x="50" y="20" width="1100" height="65" fill="white" stroke="#D1D5DB" stroke-width="1" rx="10"/>
  <text x="600" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1F2937">AI Era Data Workflow (2025)</text>
  <text x="600" y="70" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6B7280">Human-AI Collaborative Intelligence Pipeline</text>

  <!-- Main Circular Flow -->
  <circle cx="600" cy="400" r="280" fill="none" stroke="#C7D2FE" stroke-width="5" stroke-dasharray="15,5"/>
  <path d="M 600 110 A 290 290 0 1 1 595 110" stroke="#7C3AED" stroke-width="3" fill="none" marker-end="url(#circularArrow)"/>

  <!-- Central AI Hub -->
  <circle cx="600" cy="400" r="120" fill="url(#aiGradient)" stroke="#4338CA" stroke-width="12"/>
  <text x="600" y="375" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="bold" fill="white">AI-Native</text>
  <text x="600" y="405" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#E0E7FF">Workflow</text>
  <text x="600" y="425" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#C7D2FE">Orchestration</text>

  <!-- 1. AI-Assisted Data Discovery -->
  <g transform="translate(450, 130)">
    <rect width="300" height="70" rx="15" fill="white" stroke="#6366F1" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4338CA">AI-Assisted Data Discovery</text>
    <text x="150" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Automated data cataloging, profiling</text>
    <text x="150" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">LLM-powered data understanding</text>
  </g>

  <!-- 2. Prompt Engineering & Feature Store -->
  <g transform="translate(700, 250)">
    <rect width="230" height="70" rx="15" fill="white" stroke="#6366F1" stroke-width="2"/>
    <text x="120" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4338CA">Prompt Engineering</text>
    <text x="120" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Dynamic feature engineering</text>
    <text x="120" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Context-aware transformations</text>
  </g>

  <!-- 3. AI Model Development -->
  <g transform="translate(700, 520)">
    <rect width="230" height="70" rx="15" fill="white" stroke="#6366F1" stroke-width="2"/>
    <text x="120" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4338CA">AI Model Development</text>
    <text x="120" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">AutoML, Neural Architecture Search</text>
    <text x="120" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Foundation model fine-tuning</text>
  </g>

  <!-- 4. Responsible AI Deployment -->
  <g transform="translate(450, 650)">
    <rect width="300" height="70" rx="15" fill="white" stroke="#6366F1" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4338CA">Responsible AI Deployment</text>
    <text x="150" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Bias detection, explainability</text>
    <text x="150" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Safety guardrails, compliance</text>
  </g>

  <!-- 5. Continuous AI Monitoring -->
  <g transform="translate(230, 520)">
    <rect width="250" height="70" rx="15" fill="white" stroke="#6366F1" stroke-width="2"/>
    <text x="120" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4338CA">Continuous AI Monitoring</text>
    <text x="120" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Model drift detection</text>
    <text x="120" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Performance optimization</text>
  </g>

  <!-- 6. Human-AI Collaboration -->
  <g transform="translate(230, 250)">
    <rect width="250" height="70" rx="15" fill="white" stroke="#6366F1" stroke-width="2"/>
    <text x="120" y="25" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4338CA">Human-AI Collaboration</text>
    <text x="120" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Interactive analysis</text>
    <text x="120" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280">Augmented decision making</text>
  </g>

  <!-- Connecting Arrows -->
  <!-- Data Discovery → Prompt Engineering -->
  <path d="M 750 175 Q 800 200 815 250" stroke="#6366F1" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#aiArrow)"/>

  <!-- Prompt Engineering → Model Development -->
  <path d="M 855 320 Q 900 420 835 520" stroke="#6366F1" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#aiArrow)"/>

  <!-- Model Development → Deployment -->
  <path d="M 795 590 Q 770 620 700 650" stroke="#6366F1" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#aiArrow)"/>

  <!-- Deployment → Monitoring -->
  <path d="M 540 650 Q 500 650 410 590" stroke="#6366F1" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#aiArrow)"/>

  <!-- Monitoring → Collaboration -->
  <path d="M 355 520 Q 300 420 350 320" stroke="#6366F1" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#aiArrow)"/>

  <!-- Collaboration → Data Discovery -->
  <path d="M 370 250 Q 400 200 450 175" stroke="#6366F1" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#aiArrow)"/>

  <!-- Side Panels -->
  <!-- Left Panel: AI Tools & Platforms -->
  <g transform="translate(-30, 50)">
    <rect x="50" y="120" width="180" height="450" fill="white" stroke="#E5E7EB" stroke-width="2" rx="10"/>
    <text x="130" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2937">AI-Era Platforms</text>

    <text x="70" y="180" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" fill="#4338CA">Foundation Models:</text>
    <text x="70" y="200" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• GPT-4, Claude, Gemini</text>
    <text x="70" y="215" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Code generation (Copilot)</text>

    <text x="70" y="245" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" fill="#4338CA">AI Platforms:</text>
    <text x="70" y="265" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Databricks AI</text>
    <text x="70" y="280" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Google Vertex AI</text>
    <text x="70" y="295" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• AWS SageMaker</text>

    <text x="70" y="325" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" fill="#4338CA">Vector Databases:</text>
    <text x="70" y="345" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Pinecone, Weaviate</text>
    <text x="70" y="360" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• ChromaDB, Qdrant</text>

    <text x="70" y="390" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" fill="#4338CA">AI Orchestration:</text>
    <text x="70" y="410" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• LangChain, LlamaIndex</text>
    <text x="70" y="425" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• AutoGen, CrewAI</text>

    <text x="70" y="455" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" fill="#4338CA">Observability:</text>
    <text x="70" y="475" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Weights &amp; Biases</text>
    <text x="70" y="490" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• MLflow, Neptune</text>

    <text x="70" y="520" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" fill="#4338CA">AI Safety:</text>
    <text x="70" y="540" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Constitutional AI</text>
    <text x="70" y="555" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Responsible AI Toolkit</text>
  </g>

  <!-- Right Panel: Key Principles -->
  <g transform="translate(120, 50)">
    <rect x="870" y="120" width="200" height="450" fill="white" stroke="#E5E7EB" stroke-width="2" rx="10"/>
    <text x="970" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2937">AI-Era Best Practices</text>

    <text x="890" y="180" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" fill="#7C3AED">Human-Centric Design:</text>
    <text x="890" y="200" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• AI augments human intelligence</text>
    <text x="890" y="215" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Explainable AI by default</text>

    <text x="890" y="245" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" fill="#7C3AED">Responsible AI:</text>
    <text x="890" y="265" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Bias mitigation</text>
    <text x="890" y="280" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Privacy preservation</text>
    <text x="890" y="295" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Fairness assurance</text>

    <text x="890" y="325" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" fill="#7C3AED">Continuous Learning:</text>
    <text x="890" y="345" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Active learning loops</text>
    <text x="890" y="360" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Feedback incorporation</text>

    <text x="890" y="390" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" fill="#7C3AED">Scalable Architecture:</text>
    <text x="890" y="410" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Cloud-native design</text>
    <text x="890" y="425" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Edge computing ready</text>

    <text x="890" y="455" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" fill="#7C3AED">Multi-Modal Integration:</text>
    <text x="890" y="475" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Text, image, audio, code</text>
    <text x="890" y="490" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Cross-modal reasoning</text>

    <text x="890" y="520" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="bold" fill="#7C3AED">Governance &amp; Compliance:</text>
    <text x="890" y="540" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Model lineage tracking</text>
    <text x="890" y="555" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6B7280">• Regulatory compliance</text>
  </g>
  <!-- Bottom Banner -->
  <rect x="50" y="730" width="1100" height="40" fill="#6366F1" rx="10"/>
  <text x="600" y="755" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Next Evolution: Agentic AI Workflows &amp; Multi-Agent Systems</text>
</svg>