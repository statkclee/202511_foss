<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="problemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fee2e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecaca;stop-opacity:1" />
    </linearGradient>

    <!-- Font and Text Styles -->
    <style>
      text {
        font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      }
      .title {
        font-size: 42px;
        font-weight: 700;
        fill: white;
      }
      .box-title {
        font-size: 32px;
        font-weight: 700;
        fill: #991b1b;
      }
      .section-title {
        font-size: 24px;
        font-weight: 600;
        fill: #1e293b;
      }
      .item-text {
        font-size: 24px;
        fill: #475569;
      }
      .item-text-small {
        font-size: 18px;
        fill: #475569;
      }
      .conclusion-text {
        font-size: 22px;
        font-weight: 700;
        fill: #7f1d1d;
      }
      .conclusion-emphasis {
        font-size: 54px;
        font-weight: 900;
      }
    </style>
  </defs>

  <!-- Title -->
  <rect x="50" y="30" width="1700" height="80" rx="12" fill="url(#headerGrad)"/>
  <text x="900" y="85" text-anchor="middle" class="title">
    ⚠️ WYSIWYG 문서편집기 문제점과 한계
  </text>

  <!-- Main Content Grid: 2 rows × 3 columns -->

  <!-- Row 1 -->

  <!-- 1. 재현성 문제 -->
  <rect x="50" y="150" width="550" height="380" rx="10" fill="url(#problemGrad)" stroke="#dc2626" stroke-width="3"/>
  <text x="325" y="200" text-anchor="middle" class="box-title">
    🔄 재현성 부족
  </text>

  <!-- 좌측 칼럼: 문서 일관성 문제 -->
  <text x="70" y="250" class="section-title">문서 일관성 문제</text>
  <text x="70" y="285" class="item-text">• 환경 의존성</text>
  <text x="70" y="315" class="item-text">• 동일 파일→다른 렌더링</text>
  <text x="70" y="345" class="item-text">• 인쇄/화면 불일치</text>

  <!-- 우측 칼럼: 데이터 재현 불가 -->
  <text x="320" y="250" class="section-title">데이터 재현 불가</text>
  <text x="320" y="285" class="item-text">• 복사/붙여넣기</text>
  <text x="320" y="315" class="item-text">• 계산 블랙박스</text>
  <text x="320" y="345" class="item-text">• 그래프/표 수작업</text>
  <text x="320" y="375" class="item-text">• 오류 추적 불가</text>

  <rect x="70" y="460" width="510" height="50" rx="5" fill="#fca5a5"/>
  <text x="325" y="495" text-anchor="middle" class="conclusion-text">
    → Reproducibility Crisis <tspan class="conclusion-emphasis">주범</tspan>
  </text>

  <!-- 2. 버전 관리 한계 -->
  <rect x="625" y="150" width="550" height="380" rx="10" fill="url(#problemGrad)" stroke="#dc2626" stroke-width="3"/>
  <text x="900" y="200" text-anchor="middle" class="box-title">
    📝 버전 관리 한계
  </text>

  <!-- 좌측 칼럼: 바이너리 파일 구조 -->
  <text x="645" y="250" class="section-title">바이너리 파일 구조</text>
  <text x="645" y="285" class="item-text">• Git Diff 불가능</text>
  <text x="645" y="315" class="item-text">• Merge Conflict 불가</text>
  <text x="645" y="345" class="item-text">• 이력 추적 어려움</text>

  <!-- 우측 칼럼: 협업 비효율 -->
  <text x="895" y="250" class="section-title">협업 비효율</text>
  <text x="895" y="285" class="item-text-small">• "최종_최종_진짜최종.docx"</text>
  <text x="895" y="315" class="item-text">• 이메일 파일 전송</text>
  <text x="895" y="345" class="item-text">• 동시 편집 충돌</text>

  <rect x="645" y="460" width="510" height="50" rx="5" fill="#fca5a5"/>
  <text x="900" y="495" text-anchor="middle" class="conclusion-text">
    → Git 기반 워크플로우 <tspan class="conclusion-emphasis">불가능</tspan>
  </text>

  <!-- 3. 자동화 불가 -->
  <rect x="1200" y="150" width="550" height="380" rx="10" fill="url(#problemGrad)" stroke="#dc2626" stroke-width="3"/>
  <text x="1475" y="200" text-anchor="middle" class="box-title">
    🤖 자동화 불가
  </text>

  <!-- 좌측 칼럼: 수동 작업 의존 -->
  <text x="1220" y="250" class="section-title">수동 작업 의존</text>
  <text x="1220" y="285" class="item-text">• GUI 클릭/드래그 필수</text>
  <text x="1220" y="315" class="item-text">• 스크립트 불가</text>
  <text x="1220" y="345" class="item-text">• 일괄 변환 어려움</text>

  <!-- 우측 칼럼: CI/CD 통합 불가 -->
  <text x="1470" y="250" class="section-title">CI/CD 통합 불가</text>
  <text x="1470" y="285" class="item-text">• 자동 빌드 X</text>
  <text x="1470" y="315" class="item-text">• 자동 테스트 X</text>
  <text x="1470" y="345" class="item-text">• 자동 배포 X</text>
  <text x="1470" y="375" class="item-text">• 생성 자동화 X</text>

  <rect x="1220" y="460" width="510" height="50" rx="5" fill="#fca5a5"/>
  <text x="1475" y="495" text-anchor="middle" class="conclusion-text">
    → DevOps 워크플로우 <tspan class="conclusion-emphasis">단절</tspan>
  </text>

  <!-- Row 2 -->

  <!-- 4. 종속성 문제 -->
  <rect x="50" y="560" width="550" height="380" rx="10" fill="url(#problemGrad)" stroke="#dc2626" stroke-width="3"/>
  <text x="325" y="610" text-anchor="middle" class="box-title">
    🔒 종속성 문제
  </text>

  <!-- 좌측 칼럼: 독점 소프트웨어 종속 -->
  <text x="70" y="660" class="section-title">독점 SW 종속</text>
  <text x="70" y="695" class="item-text">• 라이선스 비용</text>
  <text x="70" y="725" class="item-text">• 벤더 락인</text>
  <text x="70" y="755" class="item-text">• 플랫폼 제약(Win/Mac)</text>

  <!-- 우측 칼럼: 포맷 종속 -->
  <text x="320" y="660" class="section-title">포맷 종속</text>
  <text x="320" y="695" class="item-text">• 비공개 포맷</text>
  <text x="320" y="725" class="item-text">• 호환성 문제</text>
  <text x="320" y="755" class="item-text">• 장기 보존 리스크</text>
  <text x="320" y="785" class="item-text">• 데이터 주권 상실</text>

  <rect x="70" y="870" width="510" height="50" rx="5" fill="#fca5a5"/>
  <text x="325" y="905" text-anchor="middle" class="conclusion-text">
    → 디지털 주권 <tspan class="conclusion-emphasis">위협</tspan>
  </text>

  <!-- 5. 확장성 한계 -->
  <rect x="625" y="560" width="550" height="380" rx="10" fill="url(#problemGrad)" stroke="#dc2626" stroke-width="3"/>
  <text x="900" y="610" text-anchor="middle" class="box-title">
    📈 확장성 한계
  </text>

  <!-- 좌측 칼럼: 대용량 문서 처리 -->
  <text x="645" y="660" class="section-title">대용량 문서 처리</text>
  <text x="645" y="695" class="item-text">• 메모리 과부하</text>
  <text x="645" y="725" class="item-text">• 응답 속도 저하</text>
  <text x="645" y="755" class="item-text">• 충돌/크래시 빈번</text>

  <!-- 우측 칼럼: 복잡한 구조 관리 -->
  <text x="895" y="660" class="section-title">복잡한 구조 관리</text>
  <text x="895" y="695" class="item-text">• 긴 문서 네비게이션 어려움</text>
  <text x="895" y="725" class="item-text">• 상호 참조 깨짐</text>
  <text x="895" y="755" class="item-text">• 일관성 유지 어려움</text>

  <rect x="645" y="870" width="510" height="50" rx="5" fill="#fca5a5"/>
  <text x="900" y="905" text-anchor="middle" class="conclusion-text">
    → 대규모 프로젝트 <tspan class="conclusion-emphasis">부적합</tspan>
  </text>

  <!-- 6. 콘텐츠-형식 혼재 -->
  <rect x="1200" y="560" width="550" height="380" rx="10" fill="url(#problemGrad)" stroke="#dc2626" stroke-width="3"/>
  <text x="1475" y="610" text-anchor="middle" class="box-title">
    🎨 콘텐츠-형식 혼재
  </text>

  <!-- 좌측 칼럼: 관심사 분리 실패 -->
  <text x="1220" y="660" class="section-title">관심사 분리 실패</text>
  <text x="1220" y="695" class="item-text">• 내용/디자인 혼재</text>
  <text x="1220" y="725" class="item-text">• 형식 변경 시 내용 훼손</text>
  <text x="1220" y="755" class="item-text">• 재사용 어려움</text>

  <!-- 우측 칼럼: 생산성 저하 -->
  <text x="1470" y="660" class="section-title">생산성 저하</text>
  <text x="1470" y="695" class="item-text">• 서식 맞추기 시간 소모</text>
  <text x="1470" y="725" class="item-text">• 형식에 집중</text>
  <text x="1470" y="755" class="item-text">• 접근성 저하</text>

  <rect x="1220" y="870" width="510" height="50" rx="5" fill="#fca5a5"/>
  <text x="1475" y="905" text-anchor="middle" class="conclusion-text">
    → Separation of Concerns <tspan class="conclusion-emphasis">위반</tspan>
  </text>

</svg>
