<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 30 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 24px; font-weight: 400; fill: #111111; }
      .stage-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 18px; font-weight: 400; fill: #111111; }
      .desc-text-middle { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 17px; fill: #444444; }
      .desc-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 16px; fill: #555555; }
      .desc-text-html { font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-size: 15px; fill: #333333; }
      .center-doc { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
      .connected-doc { fill: #fafafa; stroke: #cccccc; stroke-width: 1; }
      .hyperlink { stroke: #999999; stroke-width: 1; fill: none; stroke-dasharray: 3,3; }
      .multimedia { fill: #f5f5f5; stroke: #aaaaaa; stroke-width: 0.5; }
      .search-engine { fill: #ffffff; stroke: #555555; stroke-width: 1; }
      .globe { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
    </style>
    
    <!-- 화살표 마커 정의 -->
    <marker id="hyperlink-arrow" markerWidth="6" markerHeight="5"
            refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#999999" />
    </marker>
    <marker id="search-arrow" markerWidth="6" markerHeight="5"
            refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#555555" />
    </marker>
    <marker id="globe-arrow" markerWidth="6" markerHeight="5"
            refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#333333" />
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="520" fill="#fefefe"/>

  <!-- 중앙 웹 문서 -->
  <g id="center-document">
    <rect x="500" y="170" width="200" height="130" rx="3" class="center-doc"/>
    <text x="600" y="200" text-anchor="middle" class="stage-text">Web Document</text>
    <text x="600" y="223" text-anchor="middle" class="desc-text-html" font-style="italic">HTML</text>

    <!-- HTML 태그 시뮬레이션 -->
    <text x="515" y="245" class="desc-text-html">&lt;h1&gt;Title&lt;/h1&gt;</text>
    <text x="515" y="265" class="desc-text-html">&lt;p&gt;Content&lt;/p&gt;</text>
    <text x="515" y="285" class="desc-text-html">&lt;a&gt;Link&lt;/a&gt;</text>
  </g>

  <!-- 연결된 문서들 -->
  <!-- 좌상단 -->
  <g id="doc1">
    <rect x="250" y="90" width="110" height="85" rx="8" class="connected-doc"/>
    <text x="305" y="125" text-anchor="middle" class="desc-text">Paper</text>
    <text x="305" y="147" text-anchor="middle" class="desc-text">PDF</text>
  </g>

  <!-- 우상단 -->
  <g id="doc2">
    <rect x="840" y="90" width="110" height="85" rx="8" class="connected-doc"/>
    <text x="895" y="125" text-anchor="middle" class="desc-text">News</text>
    <text x="895" y="147" text-anchor="middle" class="desc-text">Article</text>
  </g>

  <!-- 좌하단 -->
  <g id="doc3">
    <rect x="250" y="285" width="110" height="85" rx="8" class="connected-doc"/>
    <text x="305" y="320" text-anchor="middle" class="desc-text">Blog</text>
    <text x="305" y="342" text-anchor="middle" class="desc-text">Post</text>
  </g>

  <!-- 우하단 -->
  <g id="doc4">
    <rect x="840" y="285" width="110" height="85" rx="8" class="connected-doc"/>
    <text x="895" y="320" text-anchor="middle" class="desc-text">Wiki</text>
    <text x="895" y="342" text-anchor="middle" class="desc-text">Page</text>
  </g>

  <!-- 하이퍼링크 연결선들 -->
  <line x1="360" y1="132" x2="500" y2="200" class="hyperlink" marker-end="url(#hyperlink-arrow)"/>
  <line x1="840" y1="132" x2="700" y2="200" class="hyperlink" marker-end="url(#hyperlink-arrow)"/>
  <line x1="360" y1="327" x2="500" y2="270" class="hyperlink" marker-end="url(#hyperlink-arrow)"/>
  <line x1="840" y1="327" x2="700" y2="270" class="hyperlink" marker-end="url(#hyperlink-arrow)"/>

  <!-- 멀티미디어 요소들 -->
  <g id="multimedia-elements">
    <!-- 이미지 -->
    <rect x="395" y="75" width="55" height="40" rx="2" class="multimedia"/>
    <text x="422" y="101" text-anchor="middle" class="desc-text" font-size="13px" font-style="italic">IMG</text>

    <!-- 비디오 -->
    <rect x="750" y="75" width="55" height="40" rx="2" class="multimedia"/>
    <text x="777" y="101" text-anchor="middle" class="desc-text" font-size="13px" font-style="italic">VIDEO</text>

    <!-- 오디오 -->
    <rect x="395" y="280" width="55" height="40" rx="2" class="multimedia"/>
    <text x="422" y="306" text-anchor="middle" class="desc-text" font-size="13px" font-style="italic">AUDIO</text>
  </g>

  <!-- 검색 엔진 -->
  <g id="search-engine">
    <rect x="535" y="50" width="130" height="50" rx="3" class="search-engine"/>
    <text x="600" y="81" text-anchor="middle" class="stage-text">Search Engine</text>

    <!-- 검색 화살표 -->
    <line x1="600" y1="100" x2="600" y2="160" stroke="#555555" stroke-width="1" marker-end="url(#search-arrow)"/>
  </g>

  <!-- 전역 접근성 (지구본) -->
  <g id="global-access" transform="translate(0, 30)">
    <text x="575" y="350" font-size="50px">🌍</text>
    <!-- 접근 화살표 -->
    <line x1="600" y1="275" x2="600" y2="305" stroke="#333333" stroke-width="1" marker-end="url(#globe-arrow)"/>
  </g>
  <text x="680" y="365" text-anchor="middle" class="desc-text" fill="#666666" font-style="italic">Global access</text>

  <!-- 특징 설명 박스들 -->
  <g id="characteristics">
    <!-- 하이퍼텍스트 -->
    <rect x="50" y="390" width="260" height="110" rx="2" fill="#ffffff" stroke="#dddddd" stroke-width="0.5"/>
    <line x1="50" y1="425" x2="310" y2="425" stroke="#cccccc" stroke-width="0.5"/>
    <text x="180" y="415" text-anchor="middle" class="stage-text" font-weight="600">Hypertext</text>
    <text x="65" y="442" class="desc-text">Non-linear navigation</text>
    <text x="65" y="464" class="desc-text">Connection through links</text>
    <text x="65" y="486" class="desc-text">Democratization of knowledge</text>

    <!-- 멀티미디어 통합 -->
    <rect x="330" y="390" width="260" height="110" rx="2" fill="#ffffff" stroke="#dddddd" stroke-width="0.5"/>
    <line x1="330" y1="425" x2="590" y2="425" stroke="#cccccc" stroke-width="0.5"/>
    <text x="460" y="415" text-anchor="middle" class="stage-text" font-weight="600">Multimedia Integration</text>
    <text x="345" y="442" class="desc-text">Text + Image</text>
    <text x="345" y="464" class="desc-text">Video + Audio</text>
    <text x="345" y="486" class="desc-text">Immersive experience</text>

    <!-- 전역 접근성 -->
    <rect x="610" y="390" width="260" height="110" rx="2" fill="#ffffff" stroke="#dddddd" stroke-width="0.5"/>
    <line x1="610" y1="425" x2="870" y2="425" stroke="#cccccc" stroke-width="0.5"/>
    <text x="740" y="415" text-anchor="middle" class="stage-text" font-weight="600">Global Accessibility</text>
    <text x="625" y="442" class="desc-text">Global public resource</text>
    <text x="625" y="464" class="desc-text">Timezone independent</text>
    <text x="625" y="486" class="desc-text">Instant access</text>

    <!-- 검색 가능성 -->
    <rect x="890" y="390" width="260" height="110" rx="2" fill="#ffffff" stroke="#dddddd" stroke-width="0.5"/>
    <line x1="890" y1="425" x2="1150" y2="425" stroke="#cccccc" stroke-width="0.5"/>
    <text x="1020" y="415" text-anchor="middle" class="stage-text" font-weight="600">Searchability</text>
    <text x="905" y="442" class="desc-text">Keyword search</text>
    <text x="905" y="464" class="desc-text">Google revolution</text>
    <text x="905" y="486" class="desc-text">Info exploration change</text>
  </g>

</svg>