  <text x="460" y="647" class="box-text" text-anchor="middle">bookdown (2016)</text>
  <text x="460" y="662" class="box-text" text-anchor="middle">blogdown (2017)</text>
  <text x="460" y="677" class="box-text" text-anchor="middle">xaringan (2016)</text>
  <text x="460" y="692" class="box-text" text-anchor="middle">pagedown (2019)</text>
  <text x="460" y="707" class="box-text" text-anchor="middle">Multi-format Output</text>

  <rect x="610" y="585" width="260" height="145" class="cloud-box" rx="5"/>
  <text x="740" y="610" class="tool-text" text-anchor="middle">Cloud Notebooks</text>
  <text x="740" y="632" class="box-text" text-anchor="middle">Google Colab</text>
  <text x="740" y="647" class="box-text" text-anchor="middle">Kaggle Kernels</text>
  <text x="740" y="662" class="box-text" text-anchor="middle">Azure Notebooks</text>
  <text x="740" y="677" class="box-text" text-anchor="middle">CoCalc</text>
  <text x="740" y="692" class="box-text" text-anchor="middle">Observable (2018)</text>
  <text x="740" y="707" class="box-text" text-anchor="middle">Zero Install!</text>

  <rect x="890" y="585" width="260" height="145" class="container-box" rx="5"/>
  <text x="1020" y="610" class="tool-text" text-anchor="middle">Version Control</text>
  <text x="1020" y="632" class="box-text" text-anchor="middle">Git/GitHub</text>
  <text x="1020" y="647" class="box-text" text-anchor="middle">GitLab/Bitbucket</text>
  <text x="1020" y="662" class="box-text" text-anchor="middle">nbdime (2017)</text>
  <text x="1020" y="677" class="box-text" text-anchor="middle">ReviewNB</text>
  <text x="1020" y="692" class="box-text" text-anchor="middle">CI/CD Pipelines</text>
  <text x="1020" y="707" class="box-text" text-anchor="middle">GitHub Actions (2018)</text>

  <!-- Layer 4: Sharing & Collaboration -->
  <rect x="30" y="750" width="1140" height="35" class="collab-box" rx="3"/>
  <text x="600" y="773" class="box-title" text-anchor="middle">4. Sharing &amp; Collaboration: Social Coding</text>

  <rect x="70" y="800" width="180" height="45" class="collab-box" rx="5"/>
  <text x="160" y="827" class="box-text" text-anchor="middle">GitHub/GitLab Pages</text>

  <rect x="270" y="800" width="180" height="45" class="cloud-box" rx="5"/>
  <text x="360" y="827" class="box-text" text-anchor="middle">nbviewer/Binder</text>

  <rect x="470" y="800" width="180" height="45" class="collab-box" rx="5"/>
  <text x="560" y="827" class="box-text" text-anchor="middle">RPubs/Shinyapps.io</text>

  <rect x="670" y="800" width="180" height="45" class="cloud-box" rx="5"/>
  <text x="760" y="827" class="box-text" text-anchor="middle">Medium/Towards DS</text>

  <rect x="870" y="800" width="180" height="45" class="container-box" rx="5"/>
  <text x="960" y="827" class="box-text" text-anchor="middle">Preprint Servers</text>

  <!-- Bottom Note -->
  <text x="25" y="295" class="subtitle" text-anchor="left">"Data Scientist: The Sexiest Job of the 21st Century" - HBR 2012</text>
  <text x="100" y="515" class="box-text" text-anchor="left" font-style="italic">Notebooks become lingua franca | Reproducibility through containers | Cloud democratizes computing</text>
</svg>