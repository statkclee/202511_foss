  <rect x="50" y="360" width="200" height="135" class="ml-box" rx="5"/>
  <text x="150" y="383" class="tool-text" text-anchor="middle">Python DS Stack</text>
  <text x="150" y="403" class="box-text" text-anchor="middle">pandas (mature)</text>
  <text x="150" y="418" class="box-text" text-anchor="middle">NumPy/SciPy</text>
  <text x="150" y="433" class="box-text" text-anchor="middle">scikit-learn</text>
  <text x="150" y="448" class="box-text" text-anchor="middle">statsmodels</text>
  <text x="150" y="463" class="box-text" text-anchor="middle">seaborn (2012)</text>
  <text x="150" y="478" class="box-text" text-anchor="middle">plotly (2013)</text>

  <rect x="270" y="360" width="200" height="135" class="ml-box" rx="5"/>
  <text x="370" y="383" class="tool-text" text-anchor="middle">Deep Learning</text>
  <text x="370" y="403" class="box-text" text-anchor="middle">TensorFlow (2015)</text>
  <text x="370" y="418" class="box-text" text-anchor="middle">Keras (2015)</text>
  <text x="370" y="433" class="box-text" text-anchor="middle">PyTorch (2016)</text>
  <text x="370" y="448" class="box-text" text-anchor="middle">GPU Computing</text>
  <text x="370" y="463" class="box-text" text-anchor="middle">CUDA/cuDNN</text>
  <text x="430" y="368" class="new-label">🔥</text>

  <rect x="490" y="360" width="200" height="135" class="ml-box" rx="5"/>
  <text x="590" y="383" class="tool-text" text-anchor="middle">R Ecosystem</text>
  <text x="590" y="403" class="box-text" text-anchor="middle">tidyverse (2016)</text>
  <text x="590" y="418" class="box-text" text-anchor="middle">dplyr, ggplot2</text>
  <text x="590" y="433" class="box-text" text-anchor="middle">Shiny (2012)</text>
  <text x="590" y="448" class="box-text" text-anchor="middle">RStudio IDE</text>
  <text x="590" y="463" class="box-text" text-anchor="middle">caret/mlr</text>

  <rect x="710" y="360" width="200" height="135" class="cloud-box" rx="5"/>
  <text x="810" y="383" class="tool-text" text-anchor="middle">Cloud Compute</text>
  <text x="810" y="403" class="box-text" text-anchor="middle">AWS EMR</text>
  <text x="810" y="418" class="box-text" text-anchor="middle">Google Colab (2017)</text>
  <text x="810" y="433" class="box-text" text-anchor="middle">Azure ML</text>
  <text x="810" y="448" class="box-text" text-anchor="middle">SageMaker (2017)</text>
  <text x="810" y="463" class="box-text" text-anchor="middle">Databricks</text>

  <rect x="930" y="360" width="220" height="135" class="container-box" rx="5"/>
  <text x="1040" y="383" class="tool-text" text-anchor="middle">Containers</text>
  <text x="1040" y="403" class="box-text" text-anchor="middle">Docker (2013)</text>
  <text x="1040" y="418" class="box-text" text-anchor="middle">Kubernetes (2014)</text>
  <text x="1040" y="433" class="box-text" text-anchor="middle">conda (2012)</text>
  <text x="1040" y="448" class="box-text" text-anchor="middle">virtualenv</text>
  <text x="1040" y="463" class="box-text" text-anchor="middle">Reproducible Env</text>
  <text x="1110" y="368" class="new-label">📦</text>

  <!-- Arrow Down -->
