<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1200 840">
  <defs>
    <style>
      .title { font-family: monospace; font-size: 28px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: monospace; font-size: 16px; fill: #7f8c8d; }
      .box-title { font-family: monospace; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .box-text { font-family: monospace; font-size: 13px; fill: #34495e; }
      .tool-text { font-family: monospace; font-size: 12px; fill: #16a085; font-weight: bold; }
      .year-text { font-family: monospace; font-size: 10px; fill: #95a5a6; }
      .arrow-text { font-family: monospace; font-size: 12px; fill: #7f8c8d; }
      .cloud-box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 3; }
      .ml-box { fill: #f3e5f5; stroke: #6a1b9a; stroke-width: 3; }
      .collab-box { fill: #fff3e0; stroke: #e65100; stroke-width: 3; }
      .container-box { fill: #e0f2f1; stroke: #00695c; stroke-width: 3; }
      .new-label { font-family: monospace; font-size: 11px; fill: #e74c3c; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7f8c8d" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="70" class="title" text-anchor="middle">Data Science, Cloud Computing &amp; Reproducibility Crisis</text>

  <!-- Layer 1: Data Infrastructure -->
  <rect x="30" y="95" width="1140" height="35" class="cloud-box" rx="3"/>
  <text x="600" y="118" class="box-title" text-anchor="middle">1. Data Infrastructure: Cloud &amp; Big Data Era</text>

  <g transform="translate(100, 0)">
    <rect x="50" y="145" width="220" height="125" class="cloud-box" rx="5"/>
    <text x="160" y="170" class="tool-text" text-anchor="middle">Cloud Storage</text>
    <text x="160" y="190" class="box-text" text-anchor="middle">AWS S3 (2006~)</text>
    <text x="160" y="205" class="box-text" text-anchor="middle">Google Cloud</text>
    <text x="160" y="220" class="box-text" text-anchor="middle">Azure Blob</text>
    <text x="160" y="235" class="box-text" text-anchor="middle">Dropbox/Drive</text>
    <text x="160" y="250" class="box-text" text-anchor="middle">Data Lakes</text>

    <rect x="290" y="145" width="220" height="125" class="cloud-box" rx="5"/>
    <text x="400" y="170" class="tool-text" text-anchor="middle">Big Data</text>
    <text x="400" y="190" class="box-text" text-anchor="middle">Spark (2014)</text>
    <text x="400" y="205" class="box-text" text-anchor="middle">Hive/Presto</text>
    <text x="400" y="220" class="box-text" text-anchor="middle">Kafka (2011)</text>
    <text x="400" y="235" class="box-text" text-anchor="middle">Elasticsearch</text>
    <text x="400" y="250" class="box-text" text-anchor="middle">NoSQL DBs</text>

    <rect x="530" y="145" width="220" height="125" class="cloud-box" rx="5"/>
    <text x="640" y="170" class="tool-text" text-anchor="middle">APIs &amp; Streams</text>
    <text x="640" y="190" class="box-text" text-anchor="middle">REST/GraphQL</text>
    <text x="640" y="205" class="box-text" text-anchor="middle">Twitter/FB API</text>
    <text x="640" y="220" class="box-text" text-anchor="middle">Real-time Data</text>
    <text x="640" y="235" class="box-text" text-anchor="middle">WebSockets</text>
    <text x="640" y="250" class="box-text" text-anchor="middle">IoT Sensors</text>

    <rect x="770" y="145" width="220" height="125" class="cloud-box" rx="5"/>
    <text x="880" y="170" class="tool-text" text-anchor="middle">Open Data</text>
    <text x="880" y="190" class="box-text" text-anchor="middle">data.gov</text>
    <text x="880" y="205" class="box-text" text-anchor="middle">Kaggle (2010)</text>
    <text x="880" y="220" class="box-text" text-anchor="middle">UCI ML Repo</text>
    <text x="880" y="235" class="box-text" text-anchor="middle">Open APIs</text>
    <text x="880" y="250" class="box-text" text-anchor="middle">data.world</text>
  </g>

