  <text x="180" y="632" class="box-text" text-anchor="middle">Jupyter Notebook (2014)</text>
  <text x="180" y="647" class="box-text" text-anchor="middle">JupyterLab (2018)</text>
  <text x="180" y="662" class="box-text" text-anchor="middle">JupyterHub</text>
  <text x="180" y="677" class="box-text" text-anchor="middle">nbconvert</text>
  <text x="180" y="692" class="box-text" text-anchor="middle">Voila (2019)</text>
