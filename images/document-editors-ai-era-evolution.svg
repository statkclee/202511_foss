  <rect x="620" y="885" width="530" height="270" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="885" y="915" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #16a34e;">
    🌱 대항마: 주권 + 오픈소스
  </text>
  <text x="640" y="945" style="font-size: 12px; fill: #1e293b; font-weight: 600;">
    Google Workspace + LibreOffice
  </text>
  <text x="650" y="965" style="font-size: 11px; fill: #475569;">
    • EU 디지털 주권 정책 지원
  </text>
  <text x="650" y="982" style="font-size: 11px; fill: #475569;">
