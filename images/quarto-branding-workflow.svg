<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="450" viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Quarto 1.7 brand.yml 기반 일관 브랜딩 흐름도" overflow="visible">
  <defs>
    <!-- 브랜딩 전용 그라데이션 -->
    <linearGradient id="brandPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brandTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F766E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brandOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brandGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>

    <!-- 고급 그림자: 경계 여유 확대 -->
    <filter id="dropShadow" x="-50%" y="-50%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="3" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 글로우 효과: 경계 여유 확대 -->
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 화살표 마커들: strokeWidth 기준 + 라운드 마감 -->
    <marker id="mainArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"
            markerUnits="strokeWidth">
      <path d="M2,2 L2,12 L12,7 z" fill="#374151" />
    </marker>
    <marker id="brandArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"
            markerUnits="strokeWidth">
      <path d="M2,2 L2,14 L14,8 z" fill="#8B5CF6" />
    </marker>

    <!-- 스타일 정의 -->
    <style>
      .title-text { font-family: "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: white; }
      .sub-text { font-family: "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size: 11px; text-anchor: middle; fill: white; opacity: 0.9; }
      .label-text { font-family: "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size: 10px; text-anchor: middle; fill: #6B7280; }
      .brand-text { font-family: "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; fill: white; }
      .yaml-text { font-family: "JetBrains Mono","Cascadia Code","Menlo",monospace; font-size: 9px; text-anchor: start; fill: white; }
      .context-text { font-family: "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .wire { vector-effect: non-scaling-stroke; stroke-linecap: round; }
    </style>
  </defs>

  <!-- 배경 -->
  <rect width="1000" height="480" fill="#FEFEFE" stroke="#E5E7EB" stroke-width="1" rx="10"/>

  <!-- 제목 영역 -->
  <rect x="50" y="15" width="900" height="40" rx="18" fill="rgba(139, 92, 246, 0.08)" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="500" y="40" class="context-text" fill="#7C3AED">Quarto 1.7 브랜딩 시스템: brand.yml → 일관된 디자인</text>

  <!-- ① brand.yml 중앙 허브 (센터: 150,200) -->
  <g id="hub" transform="translate(150, 200)">
    <rect x="-70" y="-70" width="140" height="160" rx="20" fill="url(#brandPurple)" filter="url(#dropShadow)" stroke="#6D28D9" stroke-width="3"/>
    <rect x="-55" y="-55" width="110" height="20" rx="8" fill="rgba(255,255,255,0.22)"/>
    <text x="0" y="-42" class="title-text">brand.yml</text>

    <!-- 색상 팔레트 표시 -->
    <circle cx="-30" cy="-15" r="8" fill="#1f77b4" opacity="0.95"/>
    <circle cx="0"   cy="-15" r="8" fill="#ff7f0e" opacity="0.95"/>
    <circle cx="30"  cy="-15" r="8" fill="#2ca02c" opacity="0.95"/>

    <!-- YAML 코드 스니펫 -->
    <text x="-50" y="5"  class="yaml-text">colors:</text>
    <text x="-35" y="18" class="yaml-text">primary:  "#1f77b4"</text>
    <text x="-35" y="31" class="yaml-text">secondary:"#ff7f0e"</text>
    <text x="-35" y="44" class="yaml-text">success:  "#2ca02c"</text>

    <!-- 라이트/다크 표시 -->
    <rect x="-25" y="52" width="20" height="12" rx="6" fill="white" opacity="0.95"/>
    <rect x="5"   y="52" width="20" height="12" rx="6" fill="#1a1a1a" opacity="0.95"/>
    <text x="0" y="77" class="sub-text" font-size="9">Light / Dark</text>
  </g>

  <!-- CSS/테마 처리 영역 (상단) : 그룹 좌표 (400,100) -->
  <!-- 허브 상단 중앙(150,130) → CSS 좌측(340,100) -->
  <path d="M150,130 C170,110 300,100 340,100"
        class="wire" stroke="#8B5CF6" stroke-width="3" marker-end="url(#brandArrow)" filter="url(#glow)" fill="none"/>

  <g id="css" transform="translate(400, 100)">
    <rect x="-60" y="-35" width="120" height="70" rx="15" fill="url(#brandBlue)" filter="url(#dropShadow)" stroke="#1D4ED8" stroke-width="2"/>
    <text x="0" y="-12" class="title-text">CSS/SCSS</text>
    <text x="0" y="2" class="sub-text">테마 시스템</text>
    <text x="0" y="18" class="sub-text" font-size="9">Bootstrap + Custom</text>
  </g>

  <!-- 허브 중앙(220,200방향) → Quarto 엔진 좌측(520,200-다이아 좌측) -->
  <path d="M220,200 H 520"
        class="wire" stroke="#8B5CF6" stroke-width="3" marker-end="url(#brandArrow)" filter="url(#glow)" fill="none"/>

  <!-- CSS 하단(400,135) → 엔진 상단(580,150→540 이전) -->
  <path d="M460,100 H 485 V 200 H 520"
        class="wire" stroke="#6B7280" stroke-width="1.5" marker-end="url(#mainArrow)" fill="none"/>

  <!-- Quarto 엔진 (센터: 580,200) -->
  <g id="engine" transform="translate(580, 200)">
    <polygon points="0,-50 60,0 0,50 -60,0" fill="url(#brandTeal)" filter="url(#dropShadow)" stroke="#0F766E" stroke-width="3"/>
    <text x="0" y="-12" class="title-text">Quarto</text>
    <text x="0" y="4" class="title-text">Engine</text>
    <text x="0" y="22" class="sub-text">브랜드 통합</text>
  </g>

  <!-- 일관된 출력물들 -->
  <!-- 엔진 우상(640,160) → HTML 좌측(700,110→740) -->
  <path d="M640,200 H 670 V 110 H 710"
        class="wire" stroke="#14B8A6" stroke-width="1.2" marker-end="url(#mainArrow)" fill="none"/>

  <!-- 출력 그룹을 약간 좌측으로(그림자 여유) -->
  <g id="html" transform="translate(760, 110)">
    <rect x="-50" y="-30" width="100" height="70" rx="12" fill="url(#brandOrange)" filter="url(#dropShadow)" stroke="#EA580C" stroke-width="2"/>
    <text x="0" y="-8" class="brand-text">🌐 HTML</text>
    <text x="0" y="8" class="sub-text">웹사이트</text>
    <text x="0" y="22" class="sub-text">대시보드</text>
    <rect x="-25" y="27" width="8" height="8" fill="#1f77b4"/>
    <rect x="-10" y="27" width="8" height="8" fill="#ff7f0e"/>
    <rect x="5"  y="27" width="8" height="8" fill="#2ca02c"/>
  </g>

  <!-- 엔진 우측 중앙(640,200) → PDF 좌측(720,200) -->
  <path d="M640,200 H 710"
        class="wire" stroke="#14B8A6" stroke-width="1.2" marker-end="url(#mainArrow)" fill="none"/>

  <g id="pdf" transform="translate(760, 200)">
    <rect x="-50" y="-30" width="100" height="70" rx="12" fill="url(#brandOrange)" filter="url(#dropShadow)" stroke="#EA580C" stroke-width="2"/>
    <text x="0" y="-8" class="brand-text">📄 PDF</text>
    <text x="0" y="8" class="sub-text">보고서</text>
    <text x="0" y="22" class="sub-text">논문</text>
    <rect x="-25" y="27" width="8" height="8" fill="#1f77b4"/>
    <rect x="-10" y="27" width="8" height="8" fill="#ff7f0e"/>
    <rect x="5"  y="27" width="8" height="8" fill="#2ca02c"/>
  </g>

  <!-- 엔진 우하(640,240) → PPT 좌측(700,290→720) -->
  <path d="M640,200 H 670 V 290 H 710"
        class="wire" stroke="#14B8A6" stroke-width="1.2" marker-end="url(#mainArrow)" fill="none"/>

  <g id="ppt" transform="translate(760, 290)">
    <rect x="-50" y="-30" width="100" height="70" rx="12" fill="url(#brandOrange)" filter="url(#dropShadow)" stroke="#EA580C" stroke-width="2"/>
    <text x="0" y="-8" class="brand-text">📊 PPT</text>
    <text x="0" y="8" class="sub-text">프레젠테이션</text>
    <text x="0" y="22" class="sub-text">슬라이드</text>
    <rect x="-25" y="27" width="8" height="8" fill="#1f77b4"/>
    <rect x="-10" y="27" width="8" height="8" fill="#ff7f0e"/>
    <rect x="5"  y="27" width="8" height="8" fill="#2ca02c"/>
  </g>

  <!-- 라이트/다크 모드 전환 영역 -->
  <rect x="50" y="350" width="900" height="80" rx="15" fill="rgba(59, 130, 246, 0.05)" stroke="#3B82F6" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="500" y="375" class="context-text" fill="#1D4ED8" font-size="14">자동 라이트/다크 모드 전환</text>

  <!-- 라이트 모드 섹션 -->
  <g transform="translate(200, 400)">
    <rect x="-120" y="-20" width="200" height="40" rx="12" fill="white" stroke="#E5E7EB" stroke-width="2"/>
    <text x="-60" y="-2" class="label-text" fill="#374151">🌞 Light Mode</text>
    <text x="-60" y="12" class="label-text" fill="#6B7280" font-size="8">background: #ffffff</text>
    <rect x="40" y="-10" width="15" height="8" fill="#1f77b4"/>
    <rect x="40" y="2" width="15" height="8" fill="#ff7f0e"/>
  </g>

  <!-- 다크 모드 섹션 -->
  <g transform="translate(800, 400)">
    <rect x="-120" y="-20" width="200" height="40" rx="12" fill="#1a1a1a" stroke="#4B5563" stroke-width="2"/>
    <text x="-60" y="-2" class="label-text" fill="#F9FAFB">🌙 Dark Mode</text>
    <text x="-60" y="12" class="label-text" fill="#9CA3AF" font-size="8">background: #1a1a1a</text>
    <rect x="40" y="-10" width="15" height="8" fill="#60A5FA"/>
    <rect x="40" y="2" width="15" height="8" fill="#FB923C"/>
  </g>

  <!-- 중앙 화살표 & 라벨 -->
  <path d="M 360 400 H 420" class="wire" stroke="#3B82F6" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#mainArrow)" fill="none"/>
  <path d="M 640 400 H 580" class="wire" stroke="#3B82F6" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#mainArrow)" fill="none"/>
  <text x="500" y="405" class="label-text" fill="#1D4ED8">respect-user-color-scheme: true</text>

</svg>
