<svg viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Noto Sans KR', sans-serif; font-size: 36px; font-weight: 700; fill: #1e3a8a; }
      .subtitle { font-family: 'Noto Sans KR', sans-serif; font-size: 18px; font-weight: 600; fill: #475569; }
      .era-title { font-family: 'Noto Sans KR', sans-serif; font-size: 24px; font-weight: 700; fill: white; }
      .era-year { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: 600; fill: white; }
      .key-value { font-family: 'Noto Sans KR', sans-serif; font-size: 24px; font-weight: 700; fill: #1e293b; }
      .detail { font-family: 'Noto Sans KR', sans-serif; font-size: 20px; fill: #475569; }
      .highlight { font-family: 'Noto Sans KR', sans-serif; font-size: 19px; font-weight: 600; }
      .warning { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: 600; fill: #991b1b; }
      .note { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; fill: #64748b; font-style: italic; }
      .core-value { font-family: 'Noto Sans KR', sans-serif; font-size: 18px; font-weight: 700; }
    </style>

    <!-- Gradients -->
    <linearGradient id="pastGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #7c3aed; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #a78bfa; stop-opacity: 1" />
    </linearGradient>

    <linearGradient id="presentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #0078d4; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #4ade80; stop-opacity: 1" />
    </linearGradient>

    <linearGradient id="futureGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #f59e0b; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #ec4899; stop-opacity: 1" />
    </linearGradient>
  </defs>

  <!-- PAST ERA (1980-2000) -->
  <g id="past-era">
    <rect x="50" y="120" width="460" height="620" rx="12" fill="url(#pastGradient)" opacity="0.15"/>
    <rect x="50" y="120" width="460" height="50" rx="12" fill="url(#pastGradient)"/>

    <text x="280" y="155" text-anchor="middle" class="era-title">📝 과거 (1980-2000)</text>

    <!-- Content Box -->
    <rect x="70" y="190" width="420" height="530" rx="8" fill="white" stroke="#a78bfa" stroke-width="2"/>

    <text x="280" y="220" text-anchor="middle" class="key-value" style="fill: #7c3aed;">🚀 디지털 혁명 시작</text>

    <text x="90" y="260" class="highlight" style="fill: #7c3aed;">생산성 폭발</text>
    <text x="100" y="290" class="detail">• 종이 타자기 → 워드프로세서</text>
    <text x="100" y="315" class="detail">• 수정·복사·재사용 자유</text>
    <text x="100" y="340" class="detail">• 문서 작업 속도 <tspan font-weight="700">10배↑</tspan></text>

    <text x="90" y="380" class="highlight" style="fill: #7c3aed;">표준화의 시작</text>
    <text x="100" y="410" class="detail">• WordPerfect, MS Word, HWP 등장</text>
    <text x="100" y="435" class="detail">• 문서 포맷 경쟁 시대</text>
    <text x="100" y="460" class="detail">• 호환 문제 발생</text>

    <text x="90" y="500" class="highlight" style="fill: #7c3aed;">아날로그 → 디지털</text>
    <text x="100" y="530" class="detail">• 물리적 저장 → 디지털 저장</text>
    <text x="100" y="555" class="detail">• 템플릿 활용 확산</text>
    <text x="100" y="580" class="detail">• 비즈니스 프로세스 변화</text>

    <!-- Core Value Box -->
    <rect x="90" y="620" width="380" height="80" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="280" y="650" text-anchor="middle" class="core-value" style="fill: #7c3aed;">💡 핵심 가치</text>
    <text x="280" y="680" text-anchor="middle" class="detail" style="fill: #6b21a8; font-weight: 600;">
      개인 생산성 혁명
    </text>
  </g>

  <!-- PRESENT ERA (2000-2025) -->
  <g id="present-era">
    <rect x="570" y="120" width="460" height="650" rx="12" fill="url(#presentGradient)" opacity="0.15"/>
    <rect x="570" y="120" width="460" height="50" rx="12" fill="url(#presentGradient)"/>

    <text x="800" y="155" text-anchor="middle" class="era-title">🌍 현재 (2000-2025)</text>

    <!-- Content Box -->
    <rect x="590" y="190" width="420" height="565" rx="8" fill="white" stroke="#4ade80" stroke-width="2"/>

    <text x="800" y="220" text-anchor="middle" class="key-value" style="fill: #0078d4;">🌐 글로벌 협업 인프라</text>

    <text x="610" y="260" class="highlight" style="fill: #0078d4;">클라우드 + 실시간 협업</text>
    <text x="620" y="290" class="detail">• Google Docs, MS 365</text>
    <text x="620" y="315" class="detail">• 지역·시간 무관 협업</text>
    <text x="620" y="340" class="detail">• 버전 관리 자동화</text>

    <text x="610" y="380" class="highlight" style="fill: #18a303;">ISO 국제 표준 중심</text>
    <text x="620" y="410" class="detail">• ✅ ODF (ISO/IEC 26300)</text>
    <text x="620" y="435" class="detail">• ✅ OOXML (ISO/IEC 29500)</text>
    <text x="620" y="460" class="detail">• 상호운용성 = 협업 기반</text>

    <text x="610" y="500" class="highlight" style="fill: #18a303;">모바일 + 웹 통합</text>
    <text x="620" y="530" class="detail">• 언제 어디서나 접근</text>
    <text x="620" y="555" class="detail">• 플랫폼 독립적</text>
    <text x="620" y="580" class="detail">• 댓글·제안 비동기 협업</text>

    <!-- Core Value Box with Warning -->
    <rect x="610" y="620" width="380" height="80" rx="6" fill="#dcfce7" stroke="#18a303" stroke-width="2"/>
    <text x="800" y="650" text-anchor="middle" class="core-value" style="fill: #14532d;">💡 핵심 가치</text>
    <text x="800" y="680" text-anchor="middle" class="detail" style="fill: #166534; font-weight: 600;">
      협업 인프라
    </text>

    <!-- Korea Warning -->
    <rect x="610" y="715" width="380" height="5" fill="#dc2626"/>
    <text x="620" y="742" class="warning" style="font-size: 16px;">⚠️ 한국: HWP 독자 포맷 → 국제 협업 제약</text>
  </g>

  <!-- FUTURE ERA (2025-2050) -->
  <g id="future-era">
    <rect x="1090" y="120" width="460" height="650" rx="12" fill="url(#futureGradient)" opacity="0.15"/>
    <rect x="1090" y="120" width="460" height="50" rx="12" fill="url(#futureGradient)"/>

    <text x="1320" y="155" text-anchor="middle" class="era-title">🤖 AI 미래 (2025-2050)</text>

    <!-- Content Box -->
    <rect x="1110" y="190" width="420" height="565" rx="8" fill="white" stroke="#ec4899" stroke-width="2"/>

    <text x="1320" y="220" text-anchor="middle" class="key-value" style="fill: #f59e0b;">🚀 지능형 문서 시대</text>

    <text x="1130" y="260" class="highlight" style="fill: #f59e0b;">AI 통합 문서 작업</text>
    <text x="1140" y="290" class="detail">• MS Copilot, Google Gemini</text>
    <text x="1140" y="315" class="detail">• 자동 요약·번역·생성</text>
    <text x="1140" y="340" class="detail">• 실시간 다국어 협업</text>

    <text x="1130" y="380" class="highlight" style="fill: #ec4899;">상호운용성 더욱 중요</text>
    <text x="1140" y="410" class="detail">• AI가 여러 포맷 처리</text>
    <text x="1140" y="435" class="detail">• 개방 표준 = AI 학습 기반</text>
    <text x="1140" y="460" class="detail">• 폐쇄 포맷 = 더 큰 장벽</text>

    <text x="1130" y="500" class="highlight" style="fill: #ec4899;">지식 생태계 통합</text>
    <text x="1140" y="530" class="detail">• 문서 간 자동 연결</text>
    <text x="1140" y="555" class="detail">• AI 기반 지식 추출</text>
    <text x="1140" y="580" class="detail">• 음성↔문서 자동 변환</text>

    <!-- Core Value Box with Warning -->
    <rect x="1130" y="620" width="380" height="80" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="1320" y="650" text-anchor="middle" class="core-value" style="fill: #92400e;">💡 핵심 가치</text>
    <text x="1320" y="680" text-anchor="middle" class="detail" style="fill: #c2410c; font-weight: 600;">
      AI 시대 경쟁력
    </text>

    <!-- Korea Warning -->
    <rect x="1130" y="715" width="380" height="5" fill="#dc2626"/>
    <text x="1140" y="742" class="warning" style="font-size: 16px;">⚠️ 독자 포맷 = AI 생태계 배제</text>
  </g>

  <!-- Bottom Summary -->
  <g transform="translate(0, -720)">
    <rect x="50" y="760" width="1500" height="50" rx="10" fill="#1e3a8a"/>

    <text x="800" y="790" text-anchor="middle" style="font-size: 24px; font-weight: 700; fill: #fbbf24;">
      문서편집기 = 디지털 주권 + 협업 인프라 + AI 경쟁력의 핵심
    </text>
  </g>

</svg>
