<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 20px; font-weight: 400; fill: #111111; }
      .section-title { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 16px; font-weight: 500; fill: #111111; }
      .section-title-quarto { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 24px; font-weight: 500; fill: #111111; }
      .dsl-main-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 14px; font-weight: 500; fill: #111111; }
      .dsl-desc-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 13px; fill: #555555; font-style: italic; }
      .dsl-tech-text { font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-size: 12px; fill: #666666; }
      .core-dsl { fill: #F7FBFF; stroke: #4A90E2; stroke-width: 1.5; }
      .support-dsl { fill: #FFF5F7; stroke: #E85D75; stroke-width: 1.5; }
      .meta-dsl { fill: #FFF9F0; stroke: #F39C12; stroke-width: 1.5; }
      .viz-dsl { fill: #F6FFF5; stroke: #50B83C; stroke-width: 1.5; }
      .center-circle { fill: #F5F0FF; stroke: #9b59b6; stroke-width: 2; }
      .connection-line { stroke: #cccccc; stroke-width: 1; stroke-dasharray: 3,3; }
      .subtitle-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 15px; fill: #666666; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#fefefe"/>

  <!-- Central Quarto Circle -->
  <circle cx="600" cy="300" r="100" class="center-circle"/>
  <text x="600" y="290" text-anchor="middle" class="section-title-quarto">Quarto</text>
  <text x="600" y="310" text-anchor="middle" class="dsl-desc-text">Document as Code</text>
  <text x="600" y="327" text-anchor="middle" class="dsl-desc-text">Orchestra</text>

  <!-- 상단: 핵심 표현 DSL -->

  <!-- LaTeX 수식: 과학적 정확성의 언어 -->
  <rect x="150" y="60" width="200" height="90" rx="3" class="core-dsl"/>
  <text x="250" y="85" text-anchor="middle" class="section-title">Mathematical System</text>
  <text x="250" y="103" text-anchor="middle" class="dsl-desc-text">Language of Scientific Precision</text>
  <text x="250" y="121" text-anchor="middle" class="dsl-tech-text">LaTeX, KaTeX, MathJax</text>
  <text x="250" y="138" text-anchor="middle" class="dsl-tech-text">E = mc², ∇²ψ = 0</text>
  <line x1="300" y1="150" x2="520" y2="230" class="connection-line"/>

  <!-- ggplot2: 데이터의 시각적 스토리텔링 -->
  <rect x="850" y="60" width="200" height="90" rx="3" class="viz-dsl"/>
  <text x="950" y="85" text-anchor="middle" class="section-title">Grammar of Graphics</text>
  <text x="950" y="103" text-anchor="middle" class="dsl-desc-text">Visual Data Storytelling</text>
  <text x="950" y="121" text-anchor="middle" class="dsl-tech-text">ggplot2, Vega-Lite</text>
  <text x="950" y="138" text-anchor="middle" class="dsl-tech-text">aes() + geom_point()</text>
  <line x1="900" y1="150" x2="680" y2="230" class="connection-line"/>

  <!-- 좌측: 구조화 DSL -->

  <!-- gt 표: 정보의 구조화된 표현 -->
  <rect x="50" y="180" width="200" height="90" rx="3" class="core-dsl"/>
  <text x="150" y="205" text-anchor="middle" class="section-title">Table Grammar</text>
  <text x="150" y="223" text-anchor="middle" class="dsl-desc-text">Structured Information Presentation</text>
  <text x="150" y="241" text-anchor="middle" class="dsl-tech-text">gt, kableExtra</text>
  <text x="150" y="258" text-anchor="middle" class="dsl-tech-text">tab_header() + fmt_*()</text>
  <line x1="250" y1="235" x2="505" y2="270" class="connection-line"/>

  <!-- 다이어그램: 사고의 시각화 -->
  <rect x="50" y="320" width="200" height="90" rx="3" class="viz-dsl"/>
  <text x="150" y="345" text-anchor="middle" class="section-title">Diagram Language</text>
  <text x="150" y="363" text-anchor="middle" class="dsl-desc-text">Visualization of Thinking</text>
  <text x="150" y="381" text-anchor="middle" class="dsl-tech-text">Mermaid, GraphViz</text>
  <text x="150" y="398" text-anchor="middle" class="dsl-tech-text">A --> B --> C</text>
  <line x1="250" y1="355" x2="505" y2="320" class="connection-line"/>

  <!-- 우측: 데이터 & 모델링 DSL -->

  <!-- SQL: 데이터 쿼리 언어 -->
  <rect x="950" y="180" width="200" height="90" rx="3" class="support-dsl"/>
  <text x="1050" y="205" text-anchor="middle" class="section-title">Data Query Language</text>
  <text x="1050" y="223" text-anchor="middle" class="dsl-desc-text">Structured Data Retrieval</text>
  <text x="1050" y="241" text-anchor="middle" class="dsl-tech-text">SQL, dplyr, DuckDB</text>
  <text x="1050" y="258" text-anchor="middle" class="dsl-tech-text">SELECT * FROM data</text>
  <line x1="950" y1="235" x2="695" y2="270" class="connection-line"/>

  <!-- 통계 모델링: 불확실성의 정량화 -->
  <rect x="950" y="320" width="200" height="90" rx="3" class="support-dsl"/>
  <text x="1050" y="345" text-anchor="middle" class="section-title">Statistical Modeling</text>
  <text x="1050" y="363" text-anchor="middle" class="dsl-desc-text">Quantification of Uncertainty</text>
  <text x="1050" y="381" text-anchor="middle" class="dsl-tech-text">Stan, tidymodels</text>
  <text x="1050" y="398" text-anchor="middle" class="dsl-tech-text">y ~ normal(μ, σ)</text>
  <line x1="950" y1="355" x2="695" y2="320" class="connection-line"/>

  <!-- 하단: 관리 DSL -->

  <!-- YAML: 문서의 DNA -->
  <rect x="200" y="450" width="200" height="90" rx="3" class="meta-dsl"/>
  <text x="300" y="475" text-anchor="middle" class="section-title">Metadata</text>
  <text x="300" y="493" text-anchor="middle" class="dsl-desc-text">Document DNA</text>
  <text x="300" y="511" text-anchor="middle" class="dsl-tech-text">YAML, TOML</text>
  <text x="300" y="528" text-anchor="middle" class="dsl-tech-text">title: "Research Title"</text>
  <line x1="350" y1="450" x2="550" y2="370" class="connection-line"/>

  <!-- 참고문헌: 지식의 계보 추적 -->
  <rect x="500" y="450" width="200" height="90" rx="3" class="core-dsl"/>
  <text x="600" y="475" text-anchor="middle" class="section-title">Bibliography</text>
  <text x="600" y="493" text-anchor="middle" class="dsl-desc-text">Knowledge Lineage Tracking</text>
  <text x="600" y="511" text-anchor="middle" class="dsl-tech-text">BibTeX, CSL</text>
  <text x="600" y="528" text-anchor="middle" class="dsl-tech-text">[@author2024]</text>
  <line x1="600" y1="450" x2="600" y2="380" class="connection-line"/>

  <!-- 코드 문서화: 재현가능성의 보장 -->
  <rect x="800" y="450" width="200" height="90" rx="3" class="meta-dsl"/>
  <text x="900" y="475" text-anchor="middle" class="section-title">Code Documentation</text>
  <text x="900" y="493" text-anchor="middle" class="dsl-desc-text">Reproducibility Guarantee</text>
  <text x="900" y="511" text-anchor="middle" class="dsl-tech-text">Roxygen2, JSDoc</text>
  <text x="900" y="528" text-anchor="middle" class="dsl-tech-text">#' @param data input</text>
  <line x1="850" y1="450" x2="650" y2="370" class="connection-line"/>

  <!-- 스타일링 언어: 시각적 프레젠테이션 제어 -->
  <rect x="500" y="60" width="200" height="90" rx="3" class="meta-dsl"/>
  <text x="600" y="85" text-anchor="middle" class="section-title">Styling Language</text>
  <text x="600" y="103" text-anchor="middle" class="dsl-desc-text">Visual Presentation Control</text>
  <text x="600" y="121" text-anchor="middle" class="dsl-tech-text">CSS, SCSS, Tailwind</text>
  <text x="600" y="138" text-anchor="middle" class="dsl-tech-text">.class { color: blue; }</text>
  <line x1="600" y1="150" x2="600" y2="200" class="connection-line"/>

  <!-- 하단 메시지 -->
  <text x="600" y="575" text-anchor="middle" class="subtitle-text" font-style="italic">
    Each DSL expresses specific aspects of scientific thinking as code, with Quarto harmoniously integrating them.
  </text>
</svg>