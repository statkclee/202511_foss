<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Noto Sans KR', sans-serif; font-size: 32px; font-weight: 700; fill: #1e3a8a; }
      .subtitle { font-family: 'Noto Sans KR', sans-serif; font-size: 18px; font-weight: 600; fill: #dc2626; }
      .category { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
      .label { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
      .cost { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; fill: #475569; }
      .amount { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 700; fill: #dc2626; }
      .total { font-family: 'Noto Sans KR', sans-serif; font-size: 24px; font-weight: 700; fill: #991b1b; }
      .note { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; font-style: italic; fill: #64748b; }

      .gradient-red { fill: url(#redGradient); }
      .gradient-orange { fill: url(#orangeGradient); }
      .gradient-yellow { fill: url(#yellowGradient); }
      .gradient-blue { fill: url(#blueGradient); }
      .gradient-purple { fill: url(#purpleGradient); }
      .gradient-green { fill: url(#greenGradient); }
    </style>

    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ca8a04;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" class="title">HWP '보이지 않는 세금' 구조</text>
  <text x="600" y="70" text-anchor="middle" class="subtitle">연간 1조 원 이상 추정 손실의 누적 경로</text>

  <!-- Flow Chart Structure -->
  <!-- Layer 1: Direct Costs -->
  <g id="direct-costs">
    <rect x="50" y="120" width="280" height="180" rx="10" class="gradient-red" opacity="0.9"/>
    <text x="190" y="150" text-anchor="middle" style="font-size: 18px; font-weight: 700; fill: white;">💰 직접 비용</text>

    <rect x="65" y="165" width="250" height="125" rx="5" fill="white" opacity="0.95"/>

    <text x="75" y="188" class="label">1. 라이선스 비용</text>
    <text x="85" y="206" class="cost">• 공공기관 일괄 구매</text>
    <text x="260" y="206" text-anchor="end" class="amount">~1,000억</text>
    <text x="85" y="222" class="cost">• 기업·학교 구매</text>
    <text x="260" y="222" text-anchor="end" class="amount">~500억</text>

    <text x="75" y="243" class="label">2. 교육·지원 비용</text>
    <text x="85" y="261" class="cost">• 직원 교육</text>
    <text x="260" y="261" text-anchor="end" class="amount">~300억</text>
    <text x="85" y="277" class="cost">• 기술지원 인력</text>
    <text x="260" y="277" text-anchor="end" class="amount">~200억</text>

    <line x1="75" y1="285" x2="305" y2="285" stroke="#dc2626" stroke-width="2"/>
    <text x="190" y="302" text-anchor="middle" style="font-size: 15px; font-weight: 700; fill: #dc2626;">소계: ~2,000억</text>
  </g>

  <!-- Layer 2: Development/Integration Costs -->
  <g id="dev-costs">
    <rect x="360" y="120" width="280" height="180" rx="10" class="gradient-orange" opacity="0.9"/>
    <text x="500" y="150" text-anchor="middle" style="font-size: 18px; font-weight: 700; fill: white;">🔧 개발·통합 비용</text>

    <rect x="375" y="165" width="250" height="125" rx="5" fill="white" opacity="0.95"/>

    <text x="385" y="188" class="label">3. 변환 모듈 개발</text>
    <text x="395" y="206" class="cost">• 공공사업 HWP 연동</text>
    <text x="570" y="206" text-anchor="end" class="amount">~1,500억</text>
    <text x="395" y="222" class="cost">• 유지보수 비용</text>
    <text x="570" y="222" text-anchor="end" class="amount">~800억</text>

    <text x="385" y="243" class="label">4. 시스템 호환 작업</text>
    <text x="395" y="261" class="cost">• 웹·모바일 뷰어</text>
    <text x="570" y="261" text-anchor="end" class="amount">~600억</text>
    <text x="395" y="277" class="cost">• 클라우드 연동</text>
    <text x="570" y="277" text-anchor="end" class="amount">~400억</text>

    <line x1="385" y1="285" x2="615" y2="285" stroke="#ea580c" stroke-width="2"/>
    <text x="500" y="302" text-anchor="middle" style="font-size: 15px; font-weight: 700; fill: #ea580c;">소계: ~3,300억</text>
  </g>

  <!-- Layer 3: Productivity Loss -->
  <g id="productivity-loss">
    <rect x="670" y="120" width="280" height="180" rx="10" class="gradient-yellow" opacity="0.9"/>
    <text x="810" y="150" text-anchor="middle" style="font-size: 18px; font-weight: 700; fill: white;">⏱️ 생산성 손실</text>

    <rect x="685" y="165" width="250" height="125" rx="5" fill="white" opacity="0.95"/>

    <text x="695" y="188" class="label">5. 문서 작업 시간 낭비</text>
    <text x="705" y="206" class="cost">• 포맷 깨짐 재작업</text>
    <text x="880" y="206" text-anchor="end" class="amount">~1,200억</text>
    <text x="705" y="222" class="cost">• 변환·호환 처리</text>
    <text x="880" y="222" text-anchor="end" class="amount">~900억</text>

    <text x="695" y="243" class="label">6. 업무 지연 비용</text>
    <text x="705" y="261" class="cost">• 민원 처리 지연</text>
    <text x="880" y="261" text-anchor="end" class="amount">~500억</text>
    <text x="705" y="277" class="cost">• 협업 효율 저하</text>
    <text x="880" y="277" text-anchor="end" class="amount">~400억</text>

    <line x1="695" y1="285" x2="925" y2="285" stroke="#ca8a04" stroke-width="2"/>
    <text x="810" y="302" text-anchor="middle" style="font-size: 15px; font-weight: 700; fill: #ca8a04;">소계: ~3,000억</text>
  </g>

  <!-- Layer 4: Opportunity Cost -->
  <g id="opportunity-cost">
    <rect x="50" y="340" width="380" height="200" rx="10" class="gradient-blue" opacity="0.9"/>
    <text x="240" y="370" text-anchor="middle" style="font-size: 18px; font-weight: 700; fill: white;">🚫 기회비용</text>

    <rect x="65" y="385" width="350" height="145" rx="5" fill="white" opacity="0.95"/>

    <text x="75" y="408" class="label">7. AI/데이터 전환 지연</text>
    <text x="85" y="426" class="cost">• 행정데이터 구축 차질</text>
    <text x="390" y="426" text-anchor="end" class="amount">~800억</text>
    <text x="85" y="442" class="cost">• LLM 파이프라인 미구축</text>
    <text x="390" y="442" text-anchor="end" class="amount">~600억</text>

    <text x="75" y="463" class="label">8. 국제 경쟁력 약화</text>
    <text x="85" y="481" class="cost">• 해외 협업 기회 상실</text>
    <text x="390" y="481" text-anchor="end" class="amount">~500억</text>
    <text x="85" y="497" class="cost">• 글로벌 표준 이탈</text>
    <text x="390" y="497" text-anchor="end" class="amount">~400억</text>

    <text x="75" y="518" class="label">9. 혁신 생태계 위축</text>
    <text x="85" y="536" class="cost">• 스타트업 진입장벽</text>
    <text x="390" y="536" text-anchor="end" class="amount">측정 불가</text>

    <line x1="75" y1="545" x2="405" y2="545" stroke="#2563eb" stroke-width="2"/>
    <text x="240" y="562" text-anchor="middle" style="font-size: 15px; font-weight: 700; fill: #2563eb;">소계: ~2,300억+</text>
  </g>

  <!-- Layer 5: Hidden Social Costs -->
  <g id="social-costs">
    <rect x="460" y="340" width="380" height="200" rx="10" class="gradient-purple" opacity="0.9"/>
    <text x="650" y="370" text-anchor="middle" style="font-size: 18px; font-weight: 700; fill: white;">👥 사회적 비용</text>

    <rect x="475" y="385" width="350" height="145" rx="5" fill="white" opacity="0.95"/>

    <text x="485" y="408" class="label">10. 정보 접근권 침해</text>
    <text x="495" y="426" class="cost">• 장애인 접근성 비용</text>
    <text x="800" y="426" text-anchor="end" class="amount">~300억</text>
    <text x="495" y="442" class="cost">• 디지털 격차 심화</text>
    <text x="800" y="442" text-anchor="end" class="amount">~200억</text>

    <text x="485" y="463" class="label">11. 투명성 저하 비용</text>
    <text x="495" y="481" class="cost">• 행정 감시 기회 상실</text>
    <text x="800" y="481" text-anchor="end" class="amount">측정 불가</text>
    <text x="495" y="497" class="cost">• 부패 위험 증가</text>
    <text x="800" y="497" text-anchor="end" class="amount">측정 불가</text>

    <text x="485" y="518" class="label">12. 교육·연구 왜곡</text>
    <text x="495" y="536" class="cost">• 학술 유통 제약</text>
    <text x="800" y="536" text-anchor="end" class="amount">~150억</text>

    <line x1="485" y1="545" x2="815" y2="545" stroke="#7c3aed" stroke-width="2"/>
    <text x="650" y="562" text-anchor="middle" style="font-size: 15px; font-weight: 700; fill: #7c3aed;">소계: ~650억+</text>
  </g>

  <!-- Layer 6: Long-term Risks -->
  <g id="long-term-risks">
    <rect x="870" y="340" width="280" height="200" rx="10" class="gradient-green" opacity="0.9"/>
    <text x="1010" y="370" text-anchor="middle" style="font-size: 18px; font-weight: 700; fill: white;">⚠️ 장기 리스크</text>

    <rect x="885" y="385" width="250" height="145" rx="5" fill="white" opacity="0.95"/>

    <text x="895" y="408" class="label">13. 문서 보존 실패</text>
    <text x="905" y="426" class="cost">• 아카이브 재작업</text>
    <text x="1110" y="426" text-anchor="end" class="amount">미래비용</text>
    <text x="905" y="442" class="cost">• 역사적 손실</text>
    <text x="1110" y="442" text-anchor="end" class="amount">측정 불가</text>

    <text x="895" y="463" class="label">14. 법적 증거력 약화</text>
    <text x="905" y="481" class="cost">• 전자소송 제약</text>
    <text x="1110" y="481" text-anchor="end" class="amount">잠재비용</text>
    <text x="905" y="497" class="cost">• 포렌식 한계</text>
    <text x="1110" y="497" text-anchor="end" class="amount">측정 불가</text>

    <text x="895" y="518" class="label">15. 기술 종속 심화</text>
    <text x="905" y="536" class="cost">• 탈출 비용 증가</text>
    <text x="1110" y="536" text-anchor="end" class="amount">누적 증가</text>

    <line x1="895" y1="545" x2="1125" y2="545" stroke="#059669" stroke-width="2"/>
    <text x="1010" y="562" text-anchor="middle" style="font-size: 15px; font-weight: 700; fill: #059669;">추정 불가</text>
  </g>

  <!-- Total Box -->
  <rect x="150" y="590" width="900" height="140" rx="15" fill="#dc2626" stroke="#991b1b" stroke-width="4"/>

  <text x="600" y="630" text-anchor="middle" style="font-size: 22px; font-weight: 700; fill: white;">
    📊 연간 추정 손실 총액 (보수적 산정)
  </text>

  <text x="600" y="670" text-anchor="middle" class="total" style="font-size: 48px; fill: white;">
    1조 1,250억 원+
  </text>

  <text x="600" y="700" text-anchor="middle" style="font-size: 14px; fill: #fecaca;">
    ※ 측정 불가능한 기회비용·사회적 비용·미래 리스크 제외
  </text>
  <text x="600" y="720" text-anchor="middle" style="font-size: 13px; fill: #fecaca;">
    실제 손실은 이보다 훨씬 클 것으로 추정
  </text>

  <!-- Bottom Note -->
  <rect x="50" y="760" width="1100" height="120" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>

  <text x="600" y="785" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #1e293b;">
    💡 핵심 인사이트
  </text>

  <text x="70" y="810" style="font-size: 12px; fill: #475569;">
    • 이 '보이지 않는 세금'은 개인·기업·정부 전체에 분산되어 있어 인지하기 어렵지만, 국가 전체로는 막대한 손실
  </text>
  <text x="70" y="830" style="font-size: 12px; fill: #475569;">
    • 단순 소프트웨어 비용이 아닌 '디지털 전환 속도 저하'로 인한 기회비용이 더 큰 문제
  </text>
  <text x="70" y="850" style="font-size: 12px; fill: #475569;">
    • AI 시대에 기계가독·자동화·글로벌 호환이 핵심인데, HWP는 이 세 가지 모두를 방해
  </text>
  <text x="70" y="870" style="font-size: 12px; fill: #475569;">
    • 이 비용은 매년 반복·누적되며, 전환 시기가 늦어질수록 '탈출 비용'도 함께 증가
  </text>
</svg>