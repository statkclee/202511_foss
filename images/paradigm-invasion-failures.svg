<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1600">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="wysiwygBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbcfe8;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="texBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="psBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowFail" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,0 L0,12 L12,6 z" fill="#ef4444" />
    </marker>

    <!-- Styles -->
    <style>
      text { font-family: 'Noto Sans KR', 'Noto Sans', sans-serif; }
      .title { font-size: 38px; font-weight: 700; fill: white; }
      .subtitle { font-size: 18px; font-weight: 600; fill: white; }
      .section-title { font-size: 26px; font-weight: 700; }
      .section-subtitle { font-size: 15px; font-weight: 600; fill: #4b5563; }
      .label { font-size: 14px; font-weight: 600; fill: #374151; }
      .value { font-size: 13px; fill: #4b5563; }
      .reason { font-size: 14px; fill: #dc2626; }
      .paradigm { font-size: 15px; font-weight: 700; }
      .failure-label { font-size: 16px; font-weight: 700; fill: #dc2626; }
      .highlight { font-size: 14px; font-weight: 700; }
      .example { font-size: 12px; fill: #6b7280; font-style: italic; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="2800" height="1600" fill="#fef2f2"/>

  <!-- Header -->
  <rect x="40" y="20" width="2720" height="100" rx="12" fill="url(#headerGrad)"/>
  <text x="1400" y="65" text-anchor="middle" class="title">❌ 실패한 패러다임 침범 사례들</text>
  <text x="1400" y="95" text-anchor="middle" class="subtitle">서로 다른 패러다임 간 강제 통합 시도 - 왜 실패했는가?</text>

  <!-- Case 1: WYSIWYG -> TeX (top half) -->
  <g id="case1">
    <rect x="70" y="150" width="2660" height="680" rx="15" fill="white" stroke="#ef4444" stroke-width="4"/>

    <text x="1400" y="195" text-anchor="middle" class="section-title" fill="#dc2626">Case 1: WYSIWYG → TeX (수학 수식 편집 시도)</text>
    <text x="1400" y="220" text-anchor="middle" class="section-subtitle">시각적 편집기가 조판 언어 침범</text>

    <!-- Left: WYSIWYG -->
    <g id="wysiwyg">
      <rect x="120" y="260" width="700" height="520" rx="12" fill="url(#wysiwygBg)" stroke="#ec4899" stroke-width="3"/>

      <text x="470" y="300" text-anchor="middle" class="section-title" fill="#be185d">WYSIWYG</text>
      <text x="470" y="325" text-anchor="middle" class="section-subtitle">MS Word, Google Docs</text>

      <!-- Characteristics -->
      <rect x="150" y="350" width="640" height="200" rx="8" fill="white" stroke="#ec4899" stroke-width="2"/>
      <text x="170" y="380" class="label" fill="#be185d">패러다임 특성:</text>
      <text x="190" y="410" class="value">✓ 시각적 편집 (마우스 클릭)</text>
      <text x="190" y="435" class="value">✓ WYSIWYG (보는 것이 얻는 것)</text>
      <text x="190" y="460" class="value">✓ GUI 기반 조작</text>
      <text x="190" y="485" class="value">✓ 즉각적 피드백</text>
      <text x="190" y="510" class="value">✓ 이진 포맷 (바이너리)</text>
      <text x="190" y="535" class="value">❌ 논리 구조 없음</text>

      <!-- Paradigm -->
      <rect x="150" y="570" width="640" height="50" rx="8" fill="#ec4899" fill-opacity="0.2"/>
      <text x="470" y="603" text-anchor="middle" class="paradigm" fill="#be185d">WYSIWYG 패러다임</text>

      <!-- Strength -->
      <rect x="150" y="640" width="640" height="80" rx="8" fill="white" stroke="#ec4899" stroke-width="1"/>
      <text x="170" y="670" class="label" fill="#be185d">강점:</text>
      <text x="190" y="695" class="value">• 직관적, 쉬움</text>
      <text x="190" y="715" class="value">• 비개발자 친화적</text>
    </g>

    <!-- Arrow: WYSIWYG -> TeX (FAIL) -->
    <g id="fail-arrow1">
      <path d="M 820 500 L 1180 500" stroke="#ef4444" stroke-width="6" fill="none" marker-end="url(#arrowFail)" stroke-dasharray="10,5"/>
      <text x="1000" y="485" text-anchor="middle" class="failure-label">침범 시도</text>

      <!-- Failed tool -->
      <rect x="900" y="510" width="200" height="120" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
      <text x="1000" y="540" text-anchor="middle" class="label" fill="#dc2626">MathType</text>
      <text x="1000" y="560" text-anchor="middle" class="label" fill="#dc2626">Equation Editor</text>
      <text x="1000" y="585" text-anchor="middle" class="example">"WYSIWYG로 수식 편집"</text>
      <text x="1000" y="610" text-anchor="middle" class="failure-label">❌ 실패</text>
    </g>

    <!-- Right: TeX -->
    <g id="tex">
      <rect x="1180" y="260" width="700" height="520" rx="12" fill="url(#texBg)" stroke="#3b82f6" stroke-width="3"/>

      <text x="1530" y="300" text-anchor="middle" class="section-title" fill="#1e40af">TeX / LaTeX</text>
      <text x="1530" y="325" text-anchor="middle" class="section-subtitle">학술 조판 시스템</text>

      <!-- Characteristics -->
      <rect x="1210" y="350" width="640" height="200" rx="8" fill="white" stroke="#3b82f6" stroke-width="2"/>
      <text x="1230" y="380" class="label" fill="#1e40af">패러다임 특성:</text>
      <text x="1250" y="410" class="value">✓ 논리적 구조 정의</text>
      <text x="1250" y="435" class="value">✓ 텍스트 기반 코드</text>
      <text x="1250" y="460" class="value">✓ 수식 전문 (복잡한 수식 가능)</text>
      <text x="1250" y="485" class="value">✓ 정밀한 레이아웃 제어</text>
      <text x="1250" y="510" class="value">✓ 재현 가능</text>
      <text x="1250" y="535" class="value">✓ 버전 관리 가능</text>

      <!-- Paradigm -->
      <rect x="1210" y="570" width="640" height="50" rx="8" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="1530" y="603" text-anchor="middle" class="paradigm" fill="#1e40af">Typesetting 패러다임</text>

      <!-- Strength -->
      <rect x="1210" y="640" width="640" height="80" rx="8" fill="white" stroke="#3b82f6" stroke-width="1"/>
      <text x="1230" y="670" class="label" fill="#1e40af">강점:</text>
      <text x="1250" y="695" class="value">• 정밀한 수식 표현</text>
      <text x="1250" y="715" class="value">• 학술 논문 표준</text>
    </g>

    <!-- Why failed -->
    <rect x="1930" y="260" width="900" height="520" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="2380" y="300" text-anchor="middle" class="section-title" fill="#dc2626">❌ 실패 이유</text>

    <rect x="1960" y="330" width="840" height="420" rx="8" fill="white" stroke="#dc2626" stroke-width="2"/>
    <text x="1980" y="365" class="label" fill="#dc2626">1. 근본적 패러다임 충돌:</text>
    <text x="2000" y="390" class="reason">• WYSIWYG: 시각적 조작 (마우스)</text>
    <text x="2000" y="413" class="reason">• TeX: 텍스트 코드 (키보드)</text>
    <text x="2000" y="436" class="value">→ 두 방식이 근본적으로 다름</text>

    <text x="1980" y="471" class="label" fill="#dc2626">2. 정보 손실:</text>
    <text x="2000" y="496" class="reason">• TeX 구조 → WYSIWYG 표시 (가능)</text>
    <text x="2000" y="519" class="reason">• WYSIWYG 편집 → TeX 코드 (불가)</text>
    <text x="2000" y="542" class="value">→ 논리 구조 소실</text>

    <text x="1980" y="577" class="label" fill="#dc2626">3. 억지 통합:</text>
    <text x="2000" y="602" class="reason">• MathType: TeX 명령어를 GUI로 억지 변환</text>
    <text x="2000" y="625" class="value">→ 복잡한 수식 편집 불가능</text>
    <text x="2000" y="648" class="value">→ TeX 사용자는 직접 코드 작성이 더 빠름</text>
    <text x="2000" y="671" class="value">→ Word 사용자는 복잡한 수식 포기</text>

    <text x="1980" y="706" class="label" fill="#dc2626">4. 양쪽 모두 불만:</text>
    <text x="2000" y="731" class="reason">• TeX 전문가: "GUI 느리고 제한적"</text>
    <text x="2000" y="754" class="reason">• WYSIWYG 사용자: "여전히 어려움"</text>
  </g>

  <!-- Case 2: PostScript -> TeX (bottom half) -->
  <g id="case2">
    <rect x="70" y="880" width="2660" height="680" rx="15" fill="white" stroke="#ef4444" stroke-width="4"/>

    <text x="1400" y="925" text-anchor="middle" class="section-title" fill="#dc2626">Case 2: PostScript → TeX (역방향 시도)</text>
    <text x="1400" y="950" text-anchor="middle" class="section-subtitle">렌더링 결과에서 논리 구조 추출 시도</text>

    <!-- Left: PostScript -->
    <g id="postscript">
      <rect x="120" y="990" width="700" height="520" rx="12" fill="url(#psBg)" stroke="#f59e0b" stroke-width="3"/>

      <text x="470" y="1030" text-anchor="middle" class="section-title" fill="#d97706">PostScript</text>
      <text x="470" y="1055" text-anchor="middle" class="section-subtitle">Drawing Language</text>

      <!-- Characteristics -->
      <rect x="150" y="1080" width="640" height="200" rx="8" fill="white" stroke="#f59e0b" stroke-width="2"/>
      <text x="170" y="1110" class="label" fill="#d97706">패러다임 특성:</text>
      <text x="190" y="1140" class="value">✓ 벡터 그래픽 명령어</text>
      <text x="190" y="1165" class="value">✓ 물리적 좌표 (x, y)</text>
      <text x="190" y="1190" class="value">✓ 이미 렌더링됨</text>
      <text x="190" y="1215" class="value">✓ 페이지 기술 언어</text>
      <text x="190" y="1240" class="value">❌ 논리 구조 없음</text>
      <text x="190" y="1265" class="value">❌ 의미론적 정보 없음</text>

      <!-- Paradigm -->
      <rect x="150" y="1300" width="640" height="50" rx="8" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="470" y="1333" text-anchor="middle" class="paradigm" fill="#d97706">Drawing 패러다임</text>

      <!-- Example -->
      <rect x="150" y="1370" width="640" height="80" rx="8" fill="white" stroke="#f59e0b" stroke-width="1"/>
      <text x="170" y="1400" class="label" fill="#d97706">예시:</text>
      <text x="190" y="1425" class="value">100 200 moveto (Hello) show</text>
      <text x="190" y="1445" class="example">→ "Hello"가 제목인지 본문인지 알 수 없음</text>
    </g>

    <!-- Arrow: PS -> TeX (FAIL) -->
    <g id="fail-arrow2">
      <path d="M 820 1230 L 1180 1230" stroke="#ef4444" stroke-width="6" fill="none" marker-end="url(#arrowFail)" stroke-dasharray="10,5"/>
      <text x="1000" y="1215" text-anchor="middle" class="failure-label">역방향 시도</text>

      <!-- Failed attempt -->
      <rect x="900" y="1240" width="200" height="120" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
      <text x="1000" y="1270" text-anchor="middle" class="label" fill="#dc2626">PS → TeX</text>
      <text x="1000" y="1290" text-anchor="middle" class="label" fill="#dc2626">변환 시도</text>
      <text x="1000" y="1315" text-anchor="middle" class="example">"렌더링 → 소스 코드"</text>
      <text x="1000" y="1340" text-anchor="middle" class="failure-label">❌ 불가능</text>
    </g>

    <!-- Right: TeX -->
    <g id="tex2">
      <rect x="1180" y="990" width="700" height="520" rx="12" fill="url(#texBg)" stroke="#3b82f6" stroke-width="3"/>

      <text x="1530" y="1030" text-anchor="middle" class="section-title" fill="#1e40af">TeX / LaTeX</text>
      <text x="1530" y="1055" text-anchor="middle" class="section-subtitle">Typesetting (논리 구조)</text>

      <!-- Characteristics -->
      <rect x="1210" y="1080" width="640" height="200" rx="8" fill="white" stroke="#3b82f6" stroke-width="2"/>
      <text x="1230" y="1110" class="label" fill="#1e40af">패러다임 특성:</text>
      <text x="1250" y="1140" class="value">✓ 논리적 구조 필요</text>
      <text x="1250" y="1165" class="value">✓ 의미론적 마크업</text>
      <text x="1250" y="1190" class="value">✓ \section, \emph 등</text>
      <text x="1250" y="1215" class="value">✓ 레이아웃 자동 계산</text>
      <text x="1250" y="1240" class="value">✓ 재조판 가능</text>
      <text x="1250" y="1265" class="value">✓ 편집 가능</text>

      <!-- Paradigm -->
      <rect x="1210" y="1300" width="640" height="50" rx="8" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="1530" y="1333" text-anchor="middle" class="paradigm" fill="#1e40af">Typesetting 패러다임</text>

      <!-- Example -->
      <rect x="1210" y="1370" width="640" height="80" rx="8" fill="white" stroke="#3b82f6" stroke-width="1"/>
      <text x="1230" y="1400" class="label" fill="#1e40af">예시:</text>
      <text x="1250" y="1425" class="value">\section{Hello}</text>
      <text x="1250" y="1445" class="example">→ "Hello"가 섹션 제목이라는 의미 포함</text>
    </g>

    <!-- Why failed -->
    <rect x="1930" y="990" width="900" height="520" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="2380" y="1030" text-anchor="middle" class="section-title" fill="#dc2626">❌ 불가능한 이유</text>

    <rect x="1960" y="1060" width="840" height="420" rx="8" fill="white" stroke="#dc2626" stroke-width="2"/>
    <text x="1980" y="1095" class="label" fill="#dc2626">1. 정보 비대칭:</text>
    <text x="2000" y="1120" class="reason">• TeX → PS: 정보 보존 (논리 → 물리) ✓</text>
    <text x="2000" y="1143" class="reason">• PS → TeX: 정보 손실 (물리 → 논리) ❌</text>
    <text x="2000" y="1166" class="value">→ 역방향 불가능 (일방향 변환)</text>

    <text x="1980" y="1201" class="label" fill="#dc2626">2. 구조 정보 소실:</text>
    <text x="2000" y="1226" class="reason">• PS: "100 200 moveto (Hello) show"</text>
    <text x="2000" y="1249" class="value">→ "Hello"가 제목? 본문? 캡션?</text>
    <text x="2000" y="1272" class="value">→ 알 수 없음 (시각적 위치만 있음)</text>
    <text x="2000" y="1295" class="value">→ TeX로 복원 불가능</text>

    <text x="1980" y="1330" class="label" fill="#dc2626">3. AI로도 어려움:</text>
    <text x="2000" y="1355" class="reason">• OCR: 텍스트 추출 가능</text>
    <text x="2000" y="1378" class="reason">• 하지만 논리 구조는 추측일 뿐</text>
    <text x="2000" y="1401" class="value">→ \section인지 \subsection인지 확실하지 않음</text>
    <text x="2000" y="1424" class="value">→ 100% 정확한 복원 불가능</text>

    <text x="1980" y="1459" class="label" fill="#dc2626">4. 근본적 한계:</text>
    <text x="2000" y="1484" class="reason">렌더링은 압축 (정보 손실 과정)</text>
  </g>

</svg>
