<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 800 450">
  <!-- 배경 -->
  <rect width="800" height="500" fill="#f8fafc"/>

  <!-- 메인 화면 -->
  <rect x="50" y="70" width="700" height="400" fill="white" stroke="#cbd5e1" stroke-width="3" rx="10"/>

  <!-- 상단 메뉴바 -->
  <rect x="50" y="70" width="700" height="35" fill="#e2e8f0" rx="10"/>

  <!-- 메뉴 항목들 -->
  <g transform="translate(60, 82)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="13" fill="#475569">파일</text>
    <text x="50" y="15" font-family="Arial, sans-serif" font-size="13" fill="#475569">편집</text>
    <text x="100" y="15" font-family="Arial, sans-serif" font-size="13" fill="#475569">보기</text>
    <text x="150" y="15" font-family="Arial, sans-serif" font-size="13" fill="#475569">삽입</text>
    <text x="200" y="15" font-family="Arial, sans-serif" font-size="13" fill="#475569">서식</text>
    <text x="250" y="15" font-family="Arial, sans-serif" font-size="13" fill="#475569">도구</text>
    <text x="300" y="15" font-family="Arial, sans-serif" font-size="13" fill="#475569">표</text>
    <text x="340" y="15" font-family="Arial, sans-serif" font-size="13" fill="#475569">창</text>
    <text x="380" y="15" font-family="Arial, sans-serif" font-size="13" fill="#475569">도움말</text>
  </g>

  <!-- 1단계 드롭다운: "서식" 메뉴 -->
  <g transform="translate(250, 105)">
    <rect x="0" y="0" width="180" height="220" fill="white" stroke="#94a3b8" stroke-width="2" rx="5"/>
    <rect x="0" y="0" width="180" height="30" fill="#dbeafe"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">서식</text>

    <!-- 메뉴 항목들 -->
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="11" fill="#475569">글꼴...</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="11" fill="#475569">단락...</text>
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="11" fill="#475569">글머리 기호 및 번호 ▶</text>
    <rect x="0" y="95" width="180" height="20" fill="#fef3c7" opacity="0.5"/>
    <text x="10" y="110" font-family="Arial, sans-serif" font-size="11" fill="#475569">테두리 및 음영 ▶</text>
    <text x="10" y="130" font-family="Arial, sans-serif" font-size="11" fill="#475569">열...</text>
    <text x="10" y="150" font-family="Arial, sans-serif" font-size="11" fill="#475569">탭...</text>
    <text x="10" y="170" font-family="Arial, sans-serif" font-size="11" fill="#475569">첫 글자 장식...</text>
    <text x="10" y="190" font-family="Arial, sans-serif" font-size="11" fill="#475569">텍스트 방향...</text>
    <text x="10" y="210" font-family="Arial, sans-serif" font-size="11" fill="#475569">배경...</text>

    <!-- 화살표 -->
    <path d="M 150 105 L 190 105" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowhead1)"/>
  </g>

  <!-- 2단계 서브메뉴: "글머리 기호 및 번호" -->
  <g transform="translate(440, 185)">
    <rect x="0" y="0" width="200" height="180" fill="white" stroke="#94a3b8" stroke-width="2" rx="5"/>
    <rect x="0" y="0" width="200" height="30" fill="#fef3c7"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">글머리 기호 및 번호</text>

    <!-- 서브메뉴 항목들 -->
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="10" fill="#475569">글머리 기호 ▶</text>
    <rect x="0" y="55" width="200" height="18" fill="#fce7f3" opacity="0.5"/>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="10" fill="#475569">번호 매기기 ▶</text>
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="10" fill="#475569">다단계 기호 ▶</text>
    <text x="10" y="110" font-family="Arial, sans-serif" font-size="10" fill="#475569">개요 번호 ▶</text>
    <text x="10" y="130" font-family="Arial, sans-serif" font-size="10" fill="#475569">사용자 정의...</text>
    <text x="10" y="150" font-family="Arial, sans-serif" font-size="10" fill="#475569">목록 스타일...</text>
    <text x="10" y="170" font-family="Arial, sans-serif" font-size="10" fill="#475569">글머리 기호 제거</text>

    <!-- 화살표 -->
    <path d="M 180 65 L 220 65" stroke="#ec4899" stroke-width="3" marker-end="url(#arrowhead2)"/>
  </g>

  <!-- 3단계 서브-서브메뉴: "글머리 기호" -->
  <g transform="translate(660, 230)">
    <rect x="0" y="0" width="130" height="150" fill="white" stroke="#94a3b8" stroke-width="2" rx="5"/>
    <rect x="0" y="0" width="130" height="25" fill="#fce7f3"/>
    <text x="10" y="17" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e293b">글머리 기호</text>

    <!-- 기호 옵션들 -->
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="10" fill="#475569">● 원형</text>
    <rect x="0" y="50" width="130" height="18" fill="#fee2e2" opacity="0.5"/>
    <text x="10" y="65" font-family="Arial, sans-serif" font-size="10" fill="#475569">○ 빈 원형</text>
    <text x="10" y="85" font-family="Arial, sans-serif" font-size="10" fill="#475569">■ 사각형</text>
    <text x="10" y="105" font-family="Arial, sans-serif" font-size="10" fill="#475569">□ 빈 사각형</text>
    <text x="10" y="125" font-family="Arial, sans-serif" font-size="10" fill="#475569">✓ 체크</text>
    <text x="10" y="145" font-family="Arial, sans-serif" font-size="10" fill="#475569">더보기...</text>
  </g>

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrowhead1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ec4899"/>
    </marker>
  </defs>

  <!-- 단계 표시 -->
  <g transform="translate(100, 350)">
    <circle cx="0" cy="0" r="20" fill="#3b82f6"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">1</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1e293b">1단계</text>
  </g>

  <g transform="translate(350, 350)">
    <circle cx="0" cy="0" r="20" fill="#f59e0b"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">2</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1e293b">2단계</text>
  </g>

  <g transform="translate(570, 350)">
    <circle cx="0" cy="0" r="20" fill="#ec4899"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">3</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1e293b">3단계</text>
  </g>

  <g transform="translate(750, 350)">
    <circle cx="0" cy="0" r="20" fill="#dc2626"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">?</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1e293b">???</text>
  </g>

  <!-- 경로 표시 -->
  <g transform="translate(50, 420)">
    <rect x="10" y="0" width="680" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="5"/>
    <text x="350" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">
      현재 위치: 서식 → 글머리 기호 및 번호 → 글머리 기호 → 원형
    </text>
    <text x="350" y="32" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#92400e">
      "단 하나의 설정을 바꾸기 위해 3단계 메뉴를 탐색해야 합니다"
    </text>
  </g>

</svg>