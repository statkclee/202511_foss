<svg viewBox="0 0 1800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Noto Sans KR', sans-serif; font-size: 36px; font-weight: 700; fill: #1e3a8a; }
      .subtitle { font-family: 'Noto Sans KR', sans-serif; font-size: 18px; font-weight: 600; fill: #475569; }
      .era-year { font-family: 'Noto Sans KR', sans-serif; font-size: 22px; font-weight: 700; fill: white; }
      .track-label { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
      .product-name { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 700; }
      .product-detail { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; }
      .highlight { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 700; }
    </style>

    <!-- Track Colors -->
    <linearGradient id="commercialGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color: #0078d4; stop-opacity: 0.8" />
      <stop offset="100%" style="stop-color: #50e6ff; stop-opacity: 0.8" />
    </linearGradient>

    <linearGradient id="openSourceGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color: #18a303; stop-opacity: 0.8" />
      <stop offset="100%" style="stop-color: #4ade80; stop-opacity: 0.8" />
    </linearGradient>

    <linearGradient id="markupGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color: #f59e0b; stop-opacity: 0.8" />
      <stop offset="100%" style="stop-color: #fbbf24; stop-opacity: 0.8" />
    </linearGradient>

    <linearGradient id="webGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color: #8b5cf6; stop-opacity: 0.8" />
      <stop offset="100%" style="stop-color: #a78bfa; stop-opacity: 0.8" />
    </linearGradient>

    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color: #dc2626; stop-opacity: 0.8" />
      <stop offset="100%" style="stop-color: #f87171; stop-opacity: 0.8" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="900" y="45" text-anchor="middle" class="title">디지털 문서 저작 도구 60년 진화</text>
  <text x="900" y="75" text-anchor="middle" class="subtitle">5개 트랙으로 보는 패러다임 변화: 1970~2025</text>

  <!-- Timeline -->
  <line x1="150" y1="130" x2="1650" y2="130" stroke="#cbd5e1" stroke-width="4"/>

  <!-- Era Markers -->
  <g id="era-markers">
    <!-- 1970s -->
    <circle cx="150" cy="130" r="8" fill="#7c3aed"/>
    <text x="150" y="115" text-anchor="middle" style="font-size: 14px; font-weight: 700; fill: #7c3aed;">1970</text>

    <!-- 1980s -->
    <circle cx="450" cy="130" r="8" fill="#0078d4"/>
    <text x="450" y="115" text-anchor="middle" style="font-size: 14px; font-weight: 700; fill: #0078d4;">1980</text>

    <!-- 1990s -->
    <circle cx="750" cy="130" r="8" fill="#18a303"/>
    <text x="750" y="115" text-anchor="middle" style="font-size: 14px; font-weight: 700; fill: #18a303;">1990</text>

    <!-- 2000s -->
    <circle cx="1050" cy="130" r="8" fill="#f59e0b"/>
    <text x="1050" y="115" text-anchor="middle" style="font-size: 14px; font-weight: 700; fill: #f59e0b;">2000</text>

    <!-- 2010s -->
    <circle cx="1350" cy="130" r="8" fill="#8b5cf6"/>
    <text x="1350" y="115" text-anchor="middle" style="font-size: 14px; font-weight: 700; fill: #8b5cf6;">2010</text>

    <!-- 2020s -->
    <circle cx="1650" cy="130" r="8" fill="#dc2626"/>
    <text x="1650" y="115" text-anchor="middle" style="font-size: 14px; font-weight: 700; fill: #dc2626;">2020</text>
  </g>

  <!-- Track 1: Commercial WYSIWYG -->
  <g id="track-commercial">
    <rect x="50" y="160" width="1700" height="140" rx="8" fill="url(#commercialGradient)" opacity="0.15"/>
    <rect x="50" y="160" width="120" height="140" rx="8" fill="#0078d4"/>
    <text x="110" y="220" text-anchor="middle" class="track-label" style="fill: white; font-size: 15px;">💼 상용</text>
    <text x="110" y="240" text-anchor="middle" class="track-label" style="fill: white; font-size: 15px;">WYSIWYG</text>

    <!-- 1979: WordStar -->
    <rect x="200" y="175" width="110" height="110" rx="6" fill="#e0f2fe" stroke="#0078d4" stroke-width="2"/>
    <text x="255" y="195" text-anchor="middle" class="product-name" style="fill: #0078d4;">1979</text>
    <text x="255" y="215" text-anchor="middle" class="product-name">WordStar</text>
    <text x="210" y="235" class="product-detail" style="fill: #475569;">• CP/M 히트</text>
    <text x="210" y="252" class="product-detail" style="fill: #475569;">• 명령어 기반</text>
    <text x="210" y="269" class="product-detail" style="fill: #475569;">• DOS 시대</text>

    <!-- 1983: MS Word -->
    <rect x="380" y="175" width="140" height="110" rx="6" fill="#dbeafe" stroke="#0078d4" stroke-width="3"/>
    <text x="450" y="195" text-anchor="middle" class="product-name" style="fill: #0078d4;">1983</text>
    <text x="450" y="215" text-anchor="middle" class="product-name" style="font-size: 15px;">MS Word ⭐</text>
    <text x="390" y="235" class="product-detail" style="fill: #475569;">• WYSIWYG 혁명</text>
    <text x="390" y="252" class="product-detail" style="fill: #475569;">• GUI 워드프로세서</text>
    <text x="390" y="269" class="product-detail" style="fill: #475569;">• 현재까지 지속</text>

    <!-- 1989: HWP -->
    <rect x="680" y="175" width="140" height="110" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="750" y="195" text-anchor="middle" class="product-name" style="fill: #dc2626;">1989</text>
    <text x="750" y="215" text-anchor="middle" class="product-name">아래한글</text>
    <text x="690" y="235" class="product-detail" style="fill: #475569;">• DOS 한글 혁신</text>
    <text x="690" y="252" class="product-detail" style="fill: #991b1b; font-weight: 600;">• 독점 포맷 고수</text>
    <text x="690" y="269" class="product-detail" style="fill: #991b1b; font-weight: 600;">• 현재 고립</text>

    <!-- 2007: Office 2007 -->
    <rect x="1020" y="175" width="140" height="110" rx="6" fill="#dbeafe" stroke="#0078d4" stroke-width="2"/>
    <text x="1090" y="195" text-anchor="middle" class="product-name" style="fill: #0078d4;">2007</text>
    <text x="1090" y="215" text-anchor="middle" class="product-name">Office 2007</text>
    <text x="1030" y="235" class="product-detail" style="fill: #475569;">• Ribbon UI</text>
    <text x="1030" y="252" class="product-detail" style="fill: #059669; font-weight: 600;">• DOCX (ISO 표준)</text>
    <text x="1030" y="269" class="product-detail" style="fill: #475569;">• 개방성 확보</text>

    <!-- 2013: Office 365 -->
    <rect x="1350" y="175" width="130" height="110" rx="6" fill="#dbeafe" stroke="#0078d4" stroke-width="2"/>
    <text x="1415" y="195" text-anchor="middle" class="product-name" style="fill: #0078d4;">2013</text>
    <text x="1415" y="215" text-anchor="middle" class="product-name">Office 365</text>
    <text x="1360" y="235" class="product-detail" style="fill: #475569;">• SaaS 모델</text>
    <text x="1360" y="252" class="product-detail" style="fill: #475569;">• 클라우드</text>
    <text x="1360" y="269" class="product-detail" style="fill: #475569;">• 구독제</text>

    <!-- 2023: Copilot -->
    <rect x="1610" y="175" width="130" height="110" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="1675" y="195" text-anchor="middle" class="product-name" style="fill: #dc2626;">2023</text>
    <text x="1675" y="215" text-anchor="middle" class="product-name" style="font-size: 15px;">Copilot 🤖</text>
    <text x="1620" y="235" class="product-detail" style="fill: #991b1b; font-weight: 600;">• GPT-4 통합</text>
    <text x="1620" y="252" class="product-detail" style="fill: #991b1b; font-weight: 600;">• AI 네이티브</text>
    <text x="1620" y="269" class="product-detail" style="fill: #475569;">• 자동 작성</text>
  </g>

  <!-- Track 2: Open Source -->
  <g id="track-opensource">
    <rect x="50" y="320" width="1700" height="140" rx="8" fill="url(#openSourceGradient)" opacity="0.15"/>
    <rect x="50" y="320" width="120" height="140" rx="8" fill="#18a303"/>
    <text x="110" y="380" text-anchor="middle" class="track-label" style="fill: white; font-size: 15px;">🆓 오픈</text>
    <text x="110" y="400" text-anchor="middle" class="track-label" style="fill: white; font-size: 15px;">소스</text>

    <!-- 1985: StarWriter -->
    <rect x="530" y="335" width="120" height="110" rx="6" fill="#fff7ed" stroke="#ff6b00" stroke-width="2"/>
    <text x="590" y="355" text-anchor="middle" class="product-name" style="fill: #ff6b00;">1985</text>
    <text x="590" y="375" text-anchor="middle" class="product-name">StarWriter</text>
    <text x="540" y="395" class="product-detail" style="fill: #475569;">• 독일 개발</text>
    <text x="540" y="412" class="product-detail" style="fill: #475569;">• 상용→오픈</text>
    <text x="540" y="429" class="product-detail" style="fill: #475569;">• 저렴한 대안</text>

    <!-- 2000: OpenOffice -->
    <rect x="980" y="335" width="140" height="110" rx="6" fill="#f0fdf4" stroke="#18a303" stroke-width="3"/>
    <text x="1050" y="355" text-anchor="middle" class="product-name" style="fill: #18a303;">2000</text>
    <text x="1050" y="375" text-anchor="middle" class="product-name" style="font-size: 15px;">OpenOffice ⭐</text>
    <text x="990" y="395" class="product-detail" style="fill: #166534; font-weight: 600;">• 완전 오픈소스</text>
    <text x="990" y="412" class="product-detail" style="fill: #166534; font-weight: 600;">• LGPL 라이선스</text>
    <text x="990" y="429" class="product-detail" style="fill: #475569;">• ODF 표준 주도</text>

    <!-- 2006: ODF ISO -->
    <rect x="1060" y="335" width="80" height="50" rx="6" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="1100" y="355" text-anchor="middle" class="product-name" style="fill: #059669; font-size: 12px;">2006</text>
    <text x="1100" y="373" text-anchor="middle" class="product-detail" style="fill: #047857; font-weight: 700; font-size: 11px;">ODF ISO</text>

    <!-- 2010: LibreOffice -->
    <rect x="1310" y="335" width="170" height="110" rx="6" fill="#dcfce7" stroke="#18a303" stroke-width="3"/>
    <text x="1395" y="355" text-anchor="middle" class="product-name" style="fill: #18a303;">2010</text>
    <text x="1395" y="375" text-anchor="middle" class="product-name" style="font-size: 15px;">LibreOffice 🦅</text>
    <text x="1320" y="395" class="product-detail" style="fill: #166534; font-weight: 600;">• Oracle 위기→독립</text>
    <text x="1320" y="412" class="product-detail" style="fill: #166534; font-weight: 600;">• 커뮤니티 주도</text>
    <text x="1320" y="429" class="product-detail" style="fill: #475569;">• 3억+ 사용자</text>
  </g>

  <!-- Track 3: Markup Languages -->
  <g id="track-markup">
    <rect x="50" y="480" width="1700" height="140" rx="8" fill="url(#markupGradient)" opacity="0.15"/>
    <rect x="50" y="480" width="120" height="140" rx="8" fill="#f59e0b"/>
    <text x="110" y="540" text-anchor="middle" class="track-label" style="fill: white; font-size: 15px;">🏷️ 마크업</text>
    <text x="110" y="560" text-anchor="middle" class="track-label" style="fill: white; font-size: 15px;">언어</text>

    <!-- 1978: TeX -->
    <rect x="250" y="495" width="110" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <text x="305" y="515" text-anchor="middle" class="product-name" style="fill: #d97706;">1978</text>
    <text x="305" y="535" text-anchor="middle" class="product-name" style="font-size: 15px;">TeX ⭐</text>
    <text x="260" y="555" class="product-detail" style="fill: #92400e; font-weight: 600;">• Knuth 개발</text>
    <text x="260" y="572" class="product-detail" style="fill: #92400e; font-weight: 600;">• 수학 조판</text>
    <text x="260" y="589" class="product-detail" style="fill: #475569;">• 오픈소스 철학</text>

    <!-- 1984: LaTeX -->
    <rect x="380" y="495" width="110" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="435" y="515" text-anchor="middle" class="product-name" style="fill: #d97706;">1984</text>
    <text x="435" y="535" text-anchor="middle" class="product-name">LaTeX</text>
    <text x="390" y="555" class="product-detail" style="fill: #475569;">• TeX 매크로</text>
    <text x="390" y="572" class="product-detail" style="fill: #475569;">• 학술 표준</text>
    <text x="390" y="589" class="product-detail" style="fill: #475569;">• 현재까지</text>

    <!-- 2004: Markdown -->
    <rect x="1000" y="495" width="120" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <text x="1060" y="515" text-anchor="middle" class="product-name" style="fill: #d97706;">2004</text>
    <text x="1060" y="535" text-anchor="middle" class="product-name" style="font-size: 15px;">Markdown ⭐</text>
    <text x="1010" y="555" class="product-detail" style="fill: #92400e; font-weight: 600;">• 경량 마크업</text>
    <text x="1010" y="572" class="product-detail" style="fill: #92400e; font-weight: 600;">• 단순성 혁명</text>
    <text x="1010" y="589" class="product-detail" style="fill: #475569;">• 보편적 채택</text>

    <!-- 2013: R Markdown -->
    <rect x="1330" y="495" width="120" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="1390" y="515" text-anchor="middle" class="product-name" style="fill: #d97706;">2013</text>
    <text x="1390" y="535" text-anchor="middle" class="product-name">R Markdown</text>
    <text x="1340" y="555" class="product-detail" style="fill: #475569;">• 코드+문서</text>
    <text x="1340" y="572" class="product-detail" style="fill: #475569;">• 재현가능</text>
    <text x="1340" y="589" class="product-detail" style="fill: #475569;">• 데이터 과학</text>

    <!-- 2022: Quarto -->
    <rect x="1620" y="495" width="120" height="110" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="1680" y="515" text-anchor="middle" class="product-name" style="fill: #d97706;">2022</text>
    <text x="1680" y="535" text-anchor="middle" class="product-name">Quarto</text>
    <text x="1630" y="555" class="product-detail" style="fill: #475569;">• 차세대 RMD</text>
    <text x="1630" y="572" class="product-detail" style="fill: #475569;">• 다언어 지원</text>
    <text x="1630" y="589" class="product-detail" style="fill: #475569;">• 과학 출판</text>
  </g>

  <!-- Track 4: Web/Cloud -->
  <g id="track-web">
    <rect x="50" y="640" width="1700" height="140" rx="8" fill="url(#webGradient)" opacity="0.15"/>
    <rect x="50" y="640" width="120" height="140" rx="8" fill="#8b5cf6"/>
    <text x="110" y="700" text-anchor="middle" class="track-label" style="fill: white; font-size: 15px;">🌐 웹·</text>
    <text x="110" y="720" text-anchor="middle" class="track-label" style="fill: white; font-size: 15px;">클라우드</text>

    <!-- 1991: HTML -->
    <rect x="710" y="655" width="110" height="110" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="3"/>
    <text x="765" y="675" text-anchor="middle" class="product-name" style="fill: #7c3aed;">1991</text>
    <text x="765" y="695" text-anchor="middle" class="product-name" style="font-size: 15px;">HTML ⭐</text>
    <text x="720" y="715" class="product-detail" style="fill: #6b21a8; font-weight: 600;">• Berners-Lee</text>
    <text x="720" y="732" class="product-detail" style="fill: #6b21a8; font-weight: 600;">• 웹 혁명</text>
    <text x="720" y="749" class="product-detail" style="fill: #475569;">• 문서 표준</text>

    <!-- 1998: XML -->
    <rect x="840" y="655" width="90" height="50" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="885" y="675" text-anchor="middle" class="product-name" style="fill: #7c3aed; font-size: 12px;">1998</text>
    <text x="885" y="693" text-anchor="middle" class="product-detail" style="fill: #6b21a8; font-weight: 700;">XML</text>

    <!-- 2006: Google Docs -->
    <rect x="1050" y="655" width="140" height="110" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <text x="1120" y="675" text-anchor="middle" class="product-name" style="fill: #2563eb;">2006</text>
    <text x="1120" y="695" text-anchor="middle" class="product-name" style="font-size: 15px;">Google Docs ⭐</text>
    <text x="1060" y="715" class="product-detail" style="fill: #1e40af; font-weight: 600;">• 실시간 협업</text>
    <text x="1060" y="732" class="product-detail" style="fill: #1e40af; font-weight: 600;">• 클라우드 네이티브</text>
    <text x="1060" y="749" class="product-detail" style="fill: #475569;">• 브라우저 기반</text>

    <!-- 2012: Notion -->
    <rect x="1320" y="655" width="100" height="110" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="1370" y="675" text-anchor="middle" class="product-name" style="fill: #2563eb;">2012</text>
    <text x="1370" y="695" text-anchor="middle" class="product-name">Notion</text>
    <text x="1330" y="715" class="product-detail" style="fill: #475569;">• All-in-One</text>
    <text x="1330" y="732" class="product-detail" style="fill: #475569;">• 블록 기반</text>
    <text x="1330" y="749" class="product-detail" style="fill: #475569;">• 협업 워크스페이스</text>

    <!-- 2023: Notion AI -->
    <rect x="1620" y="655" width="120" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="1680" y="675" text-anchor="middle" class="product-name" style="fill: #dc2626; font-size: 12px;">2023</text>
    <text x="1680" y="693" text-anchor="middle" class="product-detail" style="fill: #991b1b; font-weight: 700;">Notion AI</text>
  </g>

  <!-- Bottom Summary -->
  <rect x="50" y="810" width="1700" height="170" rx="12" fill="#1e3a8a" stroke="#1e40af" stroke-width="3"/>

  <text x="900" y="845" text-anchor="middle" style="font-size: 22px; font-weight: 700; fill: white;">
    📊 60년 진화의 핵심 교훈
  </text>

  <text x="80" y="875" style="font-size: 14px; fill: #dbeafe;">
    <tspan font-weight="700">1970~1980 태동:</tspan> TeX(오픈소스 철학) vs WordStar(상용) →
    <tspan font-weight="700">1980~1990 GUI 혁명:</tspan> MS Word·HWP 등장, LaTeX 학술 표준 →
  </text>

  <text x="80" y="900" style="font-size: 14px; fill: #dbeafe;">
    <tspan font-weight="700">1990~2000 웹·표준:</tspan> HTML 혁명, OpenOffice 탄생 →
    <tspan font-weight="700">2000~2010 개방성:</tspan> ODF/OOXML ISO 표준, Markdown 단순성 →
  </text>

  <text x="80" y="925" style="font-size: 14px; fill: #dbeafe;">
    <tspan font-weight="700">2010~현재 클라우드·AI:</tspan> 실시간 협업(Google Docs), 커뮤니티 주도(LibreOffice), AI 통합(Copilot)
  </text>

  <rect x="80" y="935" width="1640" height="2" fill="#60a5fa" opacity="0.5"/>

  <text x="900" y="960" text-anchor="middle" style="font-size: 15px; font-weight: 700; fill: #fef2f2;">
    ⚠️ HWP의 고립: 유일하게 독점 포맷 고수, 표준 미준수, AI 시대 부적응 → 세계 트렌드와 정반대
  </text>
</svg>