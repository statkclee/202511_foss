<svg viewBox="0 60 1800 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Noto Sans KR', sans-serif; }
      .title { font-size: 52px; font-weight: 700; fill: #1e3a8a; }
      .subtitle { font-size: 28px; font-weight: 600; fill: #475569; }
      .section-title { font-size: 26px; font-weight: 700; }
      .method-title { font-size: 22px; font-weight: 700; }
      .main-text { font-size: 24px; font-weight: 600; }
      .desc-text { font-size: 20px; }
      .tool-text { font-size: 16px; font-weight: 600; }
      .emphasis { font-size: 24px; font-weight: 700; }
    </style>

    <!-- Gradients -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color: #10b981; stop-opacity: 0.3" />
      <stop offset="100%" style="stop-color: #10b981; stop-opacity: 0" />
    </radialGradient>

    <linearGradient id="fossCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #10b981; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #059669; stop-opacity: 1" />
    </linearGradient>

    <linearGradient id="msRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #dc2626; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #991b1b; stop-opacity: 1" />
    </linearGradient>

    <linearGradient id="hwpRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #f97316; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #c2410c; stop-opacity: 1" />
    </linearGradient>

    <linearGradient id="benefit1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #a7f3d0; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #6ee7b7; stop-opacity: 1" />
    </linearGradient>

    <linearGradient id="benefit2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #93c5fd; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #60a5fa; stop-opacity: 1" />
    </linearGradient>

    <linearGradient id="benefit3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #fde68a; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #fcd34d; stop-opacity: 1" />
    </linearGradient>

    <linearGradient id="methodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #e0e7ff; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #c7d2fe; stop-opacity: 1" />
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="breakArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
      <polygon points="0 0, 16 8, 0 16, 4 8" fill="#10b981" stroke="#059669" stroke-width="2"/>
    </marker>

    <!-- Patterns -->
    <pattern id="diagonalLines" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M-2,2 l4,-4 M0,8 l8,-8 M6,10 l4,-4" stroke="#dc2626" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1800" height="1200" fill="#f8fafc"/>

  <!-- Title -->
  <text x="900" y="160" text-anchor="middle" class="title">FOSS: 게임 체인저 전략</text>
  <text x="900" y="200" text-anchor="middle" class="subtitle">실증된 방법론과 도구로 실현하는 디지털 독립</text>

  <!-- Center: FOSS Core (게임 체인저) -->
  <circle cx="900" cy="380" r="300" fill="url(#centerGlow)"/>

  <circle cx="900" cy="380" r="140" fill="url(#fossCore)" stroke="#059669" stroke-width="6"/>
  <text x="900" y="360" text-anchor="middle" style="font-size: 38px; font-weight: 700; fill: white;">🛡️ FOSS</text>
  <text x="900" y="400" text-anchor="middle" style="font-size: 26px; font-weight: 700; fill: white;">오픈소스</text>
  <text x="900" y="430" text-anchor="middle" style="font-size: 20px; font-weight: 600; fill: #d1fae5;">게임 체인저</text>

  <!-- TOP LEFT: MS Monopoly Problem -->
  <g>
    <circle cx="300" cy="200" r="110" fill="url(#msRed)" stroke="#7f1d1d" stroke-width="4" opacity="0.9"/>
    <circle cx="300" cy="200" r="115" fill="url(#diagonalLines)" opacity="0.5"/>

    <text x="300" y="190" text-anchor="middle" style="font-size: 36px; fill: white; font-weight: 700;">🏰 MS</text>
    <text x="300" y="230" text-anchor="middle" style="font-size: 30px; fill: white; font-weight: 700;">독점 제국</text>

    <g transform="translate(0, 120)">
      <rect x="140" y="140" width="140" height="40" rx="6" fill="#7f1d1d" opacity="0.9"/>
      <text x="200" y="170" text-anchor="middle" style="font-size: 26px; fill: white; font-weight: 600;">💰 고비용</text>
    </g>

    <rect x="340" y="120" width="110" height="40" rx="6" fill="#7f1d1d" opacity="0.9"/>
    <text x="395" y="150" text-anchor="middle" style="font-size: 26px; fill: white; font-weight: 600;">🔒 종속</text>
  </g>

  <!-- TOP RIGHT: Korea HWP Isolation -->
  <g>
    <circle cx="1500" cy="200" r="110" fill="url(#hwpRed)" stroke="#c2410c" stroke-width="4" opacity="0.9"/>
    <circle cx="1500" cy="200" r="115" fill="url(#diagonalLines)" opacity="0.5"/>

    <text x="1500" y="190" text-anchor="middle" style="font-size: 38px; fill: white; font-weight: 700;">🏝️ HWP</text>
    <text x="1500" y="240" text-anchor="middle" style="font-size: 30px; fill: white; font-weight: 700;">고립 섬</text>

    <rect x="1560" y="120" width="140" height="40" rx="6" fill="#c2410c" opacity="0.9"/>
    <text x="1625" y="150" text-anchor="middle" style="font-size: 24px; fill: white; font-weight: 600;">❌ 표준 거부</text>

    <rect x="1380" y="90" width="110" height="40" rx="6" fill="#c2410c" opacity="0.9"/>
    <text x="1430" y="120" text-anchor="middle" style="font-size: 24px; fill: white; font-weight: 600;">🚫 고립</text>
  </g>

  <!-- Breaking arrows from problems to FOSS -->
  <path d="M 390 240 Q 600 300 760 350" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#breakArrow)" stroke-dasharray="12,4"/>
  <text x="600" y="290" text-anchor="middle" style="font-size: 36px; fill: #059669; font-weight: 700;">돌파 →</text>

  <path d="M 1410 240 Q 1200 300 1040 350" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#breakArrow)" stroke-dasharray="12,4"/>
  <text x="1200" y="290" text-anchor="middle" style="font-size: 36px; fill: #059669; font-weight: 700;">← 탈출</text>

  <!-- MIDDLE: Three Strategic Goals -->
  <g>
    <!-- Goal 1: 독점 탈피 -->
    <rect x="120" y="560" width="480" height="90" rx="15" fill="url(#benefit1)" stroke="#10b981" stroke-width="4"/>
    <circle cx="200" cy="605" r="30" fill="#10b981" stroke="#059669" stroke-width="3"/>
    <text x="200" y="618" text-anchor="middle" style="font-size: 28px; fill: white; font-weight: 700;">1</text>
    <text x="360" y="595" text-anchor="middle" class="section-title" fill="#065f46">독점 탈피</text>
    <text x="250" y="625" class="desc-text" fill="#064e3b">무료/저비용 · 종속 제거 · 자유 선택</text>

    <!-- Goal 2: 국제 표준 -->
    <rect x="660" y="560" width="480" height="90" rx="15" fill="url(#benefit2)" stroke="#3b82f6" stroke-width="4"/>
    <circle cx="740" cy="605" r="30" fill="#3b82f6" stroke="#2563eb" stroke-width="3"/>
    <text x="740" y="618" text-anchor="middle" style="font-size: 28px; fill: white; font-weight: 700;">2</text>
    <text x="900" y="595" text-anchor="middle" class="section-title" fill="#1e3a8a">국제 표준</text>
    <text x="790" y="625" class="desc-text" fill="#1e40af">ODF 완전 지원 · 글로벌 협업 · 상호운용</text>

    <!-- Goal 3: 디지털 주권 -->
    <rect x="1200" y="560" width="480" height="90" rx="15" fill="url(#benefit3)" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="1280" cy="605" r="30" fill="#f59e0b" stroke="#d97706" stroke-width="3"/>
    <text x="1280" y="618" text-anchor="middle" style="font-size: 28px; fill: white; font-weight: 700;">3</text>
    <text x="1440" y="595" text-anchor="middle" class="section-title" fill="#78350f">디지털 주권</text>
    <text x="1330" y="625" class="desc-text" fill="#92400e">공개 코드 · 커뮤니티 주도 · 로컬 AI</text>

    <!-- Arrows from FOSS to goals -->
    <path d="M 800 450 Q 500 500 360 560" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#breakArrow)"/>
    <path d="M 900 520 L 900 560" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#breakArrow)"/>
    <path d="M 1000 450 Q 1300 500 1440 560" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#breakArrow)"/>
  </g>

  <!-- BOTTOM: Implementation Methods and Tools -->
  <rect x="50" y="680" width="1700" height="450" rx="20" fill="url(#methodGrad)" stroke="#4f46e5" stroke-width="5"/>

  <text x="900" y="740" text-anchor="middle" style="font-size: 38px; font-weight: 700; fill: #312e81;">🔧 실증된 구현 방법론 및 도구</text>

  <!-- Left Column: Methodologies (wider) -->
  <g>
    <rect x="80" y="780" width="650" height="320" rx="12" fill="white" stroke="#6366f1" stroke-width="3"/>
    <rect x="80" y="780" width="650" height="50" rx="12" fill="#818cf8" stroke="#6366f1" stroke-width="3"/>
    <text x="405" y="815" text-anchor="middle" style="font-size: 26px; font-weight: 700; fill: white;">📚 핵심 방법론</text>

    <!-- Literate Programming -->
    <rect x="100" y="850" width="610" height="75" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="110" y="880" style="font-size: 24px; font-weight: 700; fill: #5b21b6;">1️⃣ Literate Programming (문학적 프로그래밍)</text>
    <text x="120" y="907" style="font-size: 19px; fill: #6b21a8;">• Knuth (1984): 코드+문서 통합, 사람이 읽는 프로그램</text>

    <!-- Reproducible Research -->
    <rect x="100" y="940" width="610" height="75" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
    <text x="110" y="970" style="font-size: 24px; font-weight: 700; fill: #92400e;">2️⃣ Reproducible Research (재현가능 연구)</text>
    <text x="120" y="997" style="font-size: 19px; fill: #78350f;">• Claerbout (1990s): 데이터+코드+문서 완전 공개</text>

    <!-- Document as Code -->
    <rect x="100" y="1030" width="610" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="110" y="1060" style="font-size: 24px; font-weight: 700; fill: #1e3a8a;">3️⃣ Document as Code (문서 코드화)</text>
    <text x="120" y="1082" style="font-size: 19px; fill: #1e40af;">• Git 버전관리, CI/CD, 협업 워크플로우 적용</text>
  </g>

  <!-- Right Column: Tools and Ecosystem (narrower, 2-column layout) -->
  <g>
    <rect x="760" y="780" width="960" height="320" rx="12" fill="white" stroke="#10b981" stroke-width="3"/>
    <rect x="760" y="780" width="960" height="50" rx="12" fill="#34d399" stroke="#10b981" stroke-width="3"/>
    <text x="1240" y="815" text-anchor="middle" style="font-size: 26px; font-weight: 700; fill: white;">🛠️ 실무 도구 생태계</text>

    <!-- Row 1: Core Publishing + Scientific Publishing -->
    <!-- Core Publishing Tool -->
    <rect x="780" y="850" width="450" height="115" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="1005" y="878" text-anchor="middle" style="font-size: 22px; font-weight: 700; fill: #065f46;">📖 출판 엔진</text>
    <text x="790" y="905" style="font-size: 18px; font-weight: 600; fill: #047857;">• Quarto (2022~)</text>
    <text x="950" y="905" style="font-size: 16px; fill: #059669;">HTML, PDF, Word, RevealJS</text>
    <text x="790" y="940" style="font-size: 18px; font-weight: 600; fill: #047857;">• Pandoc (2006~)</text>

    <!-- Scientific Publishing -->
    <rect x="1250" y="850" width="450" height="115" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="1475" y="878" text-anchor="middle" style="font-size: 22px; font-weight: 700; fill: #92400e;">📐 학술 출판</text>
    <text x="1260" y="905" style="font-size: 18px; font-weight: 600; fill: #b45309;">• LaTeX (1984~)</text>
    <text x="1420" y="905" style="font-size: 16px; fill: #d97706;">수식, 참고문헌, IEEE/ACM</text>
    <text x="1260" y="940" style="font-size: 18px; font-weight: 600; fill: #b45309;">• Jupyter Notebook</text>

    <!-- Row 2: Languages + Collaboration -->
    <!-- Programming Languages -->
    <rect x="780" y="985" width="450" height="105" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="1005" y="1013" text-anchor="middle" style="font-size: 22px; font-weight: 700; fill: #1e3a8a;">💻 언어 생태계</text>
    <text x="790" y="1040" style="font-size: 18px; font-weight: 600; fill: #1e40af;">• Python</text>
    <text x="880" y="1040" style="font-size: 16px; fill: #2563eb;">matplotlib, pandas, numpy</text>
    <text x="790" y="1070" style="font-size: 18px; font-weight: 600; fill: #1e40af;">• R - ggplot2, tidyverse</text>

    <!-- Collaboration + AI -->
    <rect x="1250" y="985" width="450" height="105" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="1475" y="1013" text-anchor="middle" style="font-size: 22px; font-weight: 700; fill: #9f1239;">🤝 협업 &amp; 🤖 AI</text>
    <text x="1260" y="1040" style="font-size: 18px; font-weight: 600; fill: #be123c;">• Git/GitHub (버전관리/CI/CD)</text>
    <text x="1260" y="1070" style="font-size: 18px; font-weight: 600; fill: #7e22ce;">• Local LLM (Ollama, LM Studio)</text>
    <text x="1540" y="1070" style="font-size: 16px; fill: #a855f7;">프라이버시 보장 AI 문서</text>
  </g>

</svg>
