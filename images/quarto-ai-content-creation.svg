<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 80 1400 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Simple Arrow Marker (Quarto purple only) -->
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#8B5CF6"/>
    </marker>

    <!-- Styles -->
    <style>
      .main-title {
        font-family: "ET Book", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
        font-size: 48px;
        font-weight: bold;
        text-anchor: middle;
        fill: #FFFFFF;
      }
      .subtitle {
        font-family: "ET Book", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
        font-size: 24px;
        text-anchor: middle;
        fill: #A0A0A0;
      }
      .stage-title {
        font-family: "ET Book", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
        font-size: 28px;
        font-weight: bold;
        text-anchor: middle;
        fill: #FFFFFF;
      }
      .stage-detail {
        font-family: "ET Book", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
        font-size: 15px;
        text-anchor: middle;
        fill: #A0A0A0;
      }
      .transform-label {
        font-family: "ET Book", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
        font-size: 20px;
        text-anchor: middle;
        fill: #8B5CF6;
      }
      .panel-title {
        font-family: "ET Book", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
        font-size: 22px;
        font-weight: bold;
        fill: #FFFFFF;
      }
      .panel-item {
        font-family: "ET Book", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
        font-size: 18px;
        font-weight: bold;
        fill: #FFFFFF;
      }
      .panel-detail {
        font-family: "ET Book", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
        font-size: 15px;
        fill: #A0A0A0;
      }
    </style>
  </defs>

  <!-- Background (solid dark) -->
  <rect width="1400" height="850" fill="#1a1a2e"/>

  <!-- Central QUARTO Hub (minimal design) -->
  <g transform="translate(700, 450)">
    <!-- Outer rings (no fill, stroke only) -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#4A5568" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#4A5568" stroke-width="1" opacity="0.5"/>

    <!-- Core circle (Quarto purple) -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#8B5CF6" stroke-width="4"/>
    <circle cx="0" cy="0" r="95" fill="#8B5CF6" opacity="0.1"/>

    <text x="0" y="0" class="main-title" font-size="44" fill="#8B5CF6">QUARTO</text>
    <text x="0" y="35" class="subtitle" font-size="22">AI Integration</text>
    <text x="0" y="65" class="subtitle" font-size="22">Platform</text>
  </g>

  <!-- Quarto Role Emphasize -->
  <text x="700" y="300" text-anchor="middle" font-family="ET Book, Palatino, serif" font-size="26" fill="#8B5CF6" opacity="0.7">All AI technologies unified by Quarto ecosystem</text>

  <!-- ============================================ -->
  <!-- Stage 1: Raw Signals -->
  <!-- ============================================ -->

  <g transform="translate(0, -40)">
    <g id="signals">
      <rect x="100" y="150" width="250" height="120" rx="8" fill="none" stroke="#4A5568" stroke-width="2"/>
      <text x="225" y="185" class="stage-title">Raw Signals</text>
      <text x="225" y="210" class="stage-detail">• Data connection (SQL, CSV, API)</text>
      <text x="225" y="230" class="stage-detail">• Version control (Git)</text>
      <text x="225" y="250" class="stage-detail">• Multi-modal inputs</text>
    </g>

    <!-- ============================================ -->
    <!-- Stage 2: Embeddings -->
    <!-- ============================================ -->

    <g id="embeddings">
      <rect x="450" y="150" width="250" height="120" rx="8" fill="none" stroke="#4A5568" stroke-width="2"/>
      <text x="575" y="185" class="stage-title">Embeddings</text>
      <text x="575" y="210" class="stage-detail">• Vector representations</text>
      <text x="575" y="230" class="stage-detail">• Semantic encoding</text>
      <text x="575" y="250" class="stage-detail">• Context preservation</text>
    </g>

    <!-- ============================================ -->
    <!-- Stage 3: Context -->
    <!-- ============================================ -->

    <g id="context">
      <rect x="800" y="150" width="250" height="120" rx="8" fill="none" stroke="#4A5568" stroke-width="2"/>
      <text x="925" y="185" class="stage-title">Context</text>
      <text x="925" y="210" class="stage-detail">• Prompt engineering (CoT, Few-shot)</text>
      <text x="925" y="230" class="stage-detail">• Domain knowledge injection</text>
      <text x="925" y="250" class="stage-detail">• Retrieval augmentation (RAG)</text>
    </g>

    <!-- ============================================ -->
    <!-- Stage 4: Intelligence -->
    <!-- ============================================ -->

    <g id="intelligence">
      <rect x="1100" y="150" width="250" height="120" rx="8" fill="none" stroke="#4A5568" stroke-width="2"/>
      <text x="1225" y="185" class="stage-title">Intelligence</text>
      <text x="1225" y="210" class="stage-detail">• Code generation (R, Python, SQL)</text>
      <text x="1225" y="230" class="stage-detail">• Text generation (Academic writing)</text>
      <text x="1225" y="250" class="stage-detail">• Visualization &amp; validation</text>
    </g>

    <!-- Transformation Processes (simple lines) -->
    <g id="transformations">
      <!-- Signals to Embeddings -->
      <line x1="350" y1="210" x2="450" y2="210" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="400" y="195" class="transform-label">Encoding</text>

      <!-- Embeddings to Context -->
      <line x1="700" y1="210" x2="800" y2="210" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="750" y="195" class="transform-label">Augmentation</text>

      <!-- Context to Intelligence -->
      <line x1="1050" y1="210" x2="1100" y2="210" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="1075" y="195" class="transform-label">Generation</text>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- Bottom: Emergent Capabilities -->
  <!-- ============================================ -->

  <g transform="translate(0, 00)">
    <rect x="350" y="680" width="700" height="100" rx="12" fill="none" stroke="#8B5CF6" stroke-width="3"/>
    <rect x="350" y="680" width="700" height="100" rx="12" fill="#8B5CF6" opacity="0.1"/>

    <text x="700" y="720" text-anchor="middle" font-family="ET Book, Palatino, serif" font-size="38" font-weight="bold" fill="#FFFFFF">Emergent Capabilities</text>
    <text x="700" y="755" text-anchor="middle" font-family="ET Book, Palatino, serif" font-size="20" fill="#A0A0A0">Dynamic Adaptation • Continuous Learning • Agentic Behavior</text>
  </g>

  <!-- Continuous Feedback (Quarto purple) -->
  <text x="700" y="610" text-anchor="middle" font-family="ET Book, Palatino, serif" font-size="24" fill="#8B5CF6" opacity="0.6">Powered by Quarto Ecosystem</text>

  <!-- ============================================ -->
  <!-- Left Panel: Quarto-Specific Technologies -->
  <!-- ============================================ -->

  <g id="tech-panel">
    <rect x="50" y="350" width="240" height="340" rx="8" fill="none" stroke="#4A5568" stroke-width="2"/>
    <rect x="50" y="350" width="240" height="45" rx="8" fill="#8B5CF6" opacity="0.2"/>
    <text x="170" y="382" text-anchor="middle" class="panel-title">Quarto Stack</text>

    <text x="70" y="425" class="panel-item">Markdown AI</text>
    <text x="70" y="448" class="panel-detail">• Intelligent writing</text>

    <text x="70" y="490" class="panel-item">Code AI</text>
    <text x="70" y="513" class="panel-detail">• R/Python generation</text>

    <text x="70" y="555" class="panel-item">Multi-format</text>
    <text x="70" y="578" class="panel-detail">• HTML/PDF/Docx</text>

    <text x="70" y="620" class="panel-item">brand.yml</text>
    <text x="70" y="643" class="panel-detail">• AI-powered design</text>
    <text x="70" y="666" class="panel-detail">• Auto theming</text>
  </g>

  <!-- ============================================ -->
  <!-- Right Panel: Paradigm Shifts -->
  <!-- ============================================ -->

  <g id="paradigm-panel">
    <rect x="1110" y="350" width="240" height="340" rx="8" fill="none" stroke="#4A5568" stroke-width="2"/>
    <rect x="1110" y="350" width="240" height="45" rx="8" fill="#8B5CF6" opacity="0.2"/>
    <text x="1230" y="382" text-anchor="middle" class="panel-title">Paradigm Shifts</text>

    <text x="1130" y="425" class="panel-item">From Storage</text>
    <text x="1130" y="448" class="panel-detail">→ To Generation</text>

    <text x="1130" y="490" class="panel-item">From Queries</text>
    <text x="1130" y="513" class="panel-detail">→ To Conversations</text>

    <text x="1130" y="555" class="panel-item">From Rules</text>
    <text x="1130" y="578" class="panel-detail">→ To Patterns</text>

    <text x="1130" y="620" class="panel-item">From Static</text>
    <text x="1130" y="643" class="panel-detail">→ To Adaptive</text>

    <text x="1130" y="675" class="panel-detail" font-style="italic">All powered by Quarto</text>
  </g>

  <!-- Foundation Models Note -->
  <text x="700" y="650" text-anchor="middle" font-family="ET Book, Palatino, serif" font-size="16" fill="#A0A0A0">Foundation Models (LLMs, Multi-modal AI) integrated within Quarto platform</text>

</svg>
