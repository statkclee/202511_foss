  <text x="300" y="118" class="box-title" text-anchor="middle">Human Intent Layer</text>
  <text x="300" y="138" class="tool-text" text-anchor="middle">Natural Language → Multimodal Input</text>
  <text x="300" y="153" class="box-text" text-anchor="middle">"Analyze Q3 revenue trends and prepare board report"</text>

  <!-- Arrow to AGI -->
  <line x1="570" y1="127" x2="610" y2="127" stroke="#9c27b0" stroke-width="2" marker-end="url(#bidirectional)"/>
  <line x1="610" y1="127" x2="570" y2="127" stroke="#9c27b0" stroke-width="2" marker-start="url(#bidirectional)"/>
  <text x="590" y="120" class="tool-text" text-anchor="middle" font-size="20">Dialog</text>

