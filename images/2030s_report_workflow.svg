<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1200 930">
  <defs>
    <style>
      .title { font-family: monospace; font-size: 28px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: monospace; font-size: 16px; fill: #7f8c8d; }
      .box-title { font-family: monospace; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .box-text { font-family: monospace; font-size: 12px; fill: #34495e; }
      .tool-text { font-family: monospace; font-size: 11px; fill: #16a085; font-weight: bold; }
      .agi-box { fill: #e8eaf6; stroke: #3f51b5; stroke-width: 4; }
      .agent-box { fill: #f3e5f5; stroke: #9c27b0; stroke-width: 3; }
      .human-box { fill: #fff9c4; stroke: #f57f17; stroke-width: 3; }
      .quantum-box { fill: #e0f2f1; stroke: #00695c; stroke-width: 3; }
      .question { font-family: monospace; font-size: 11px; fill: #e74c3c; font-style: italic; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7f8c8d" />
    </marker>
    <marker id="bidirectional" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9c27b0" />
    </marker>
