<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 500" width="1450" height="500">
  <defs>
    <!-- 그림자 효과 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 디지털 문서 그라디언트 -->
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    
    <!-- 타이포그래피 시스템 그라디언트 -->
    <linearGradient id="typoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e1bee7;stop-opacity:1" />
    </linearGradient>
    
    <!-- 각 글꼴 타입별 그라디언트 -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0b2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f8e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcedc8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8bbd9;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="mathGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e1bee7;stop-opacity:1" />
    </linearGradient>
    
    <!-- 화살표 마커 -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#6c757d"/>
    </marker>
  </defs>
  
  <!-- 배경 -->
  <rect width="1600" height="500" fill="#ffffff"/>
  
  <!-- 디지털 문서 (왼쪽) -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="240" height="280" 
          fill="url(#docGradient)" 
          stroke="#2196f3" 
          stroke-width="2" 
          rx="10" 
          filter="url(#shadow)"/>
    <rect x="0" y="0" width="240" height="35" 
          fill="#2196f3" 
          rx="10"/>
    <text x="120" y="22" font-family="Arial, sans-serif" 
          font-size="14" font-weight="bold" 
          text-anchor="middle" fill="white">Digital Document</text>
    
    <!-- 문서 내용 미리보기 -->
    <g transform="translate(15, 45)">
      <!-- 제목 -->
      <rect x="0" y="0" width="100" height="10" fill="#dee2e6" rx="2"/>
      
      <!-- 텍스트 라인들 -->
      <rect x="0" y="15" width="210" height="6" fill="#e9ecef" rx="2"/>
      <rect x="0" y="24" width="180" height="6" fill="#e9ecef" rx="2"/>
      <rect x="0" y="33" width="195" height="6" fill="#e9ecef" rx="2"/>
      
      <!-- 그래프 영역 -->
      <rect x="0" y="48" width="95" height="60" fill="#d3f9d8" stroke="#51cf66" stroke-width="1" rx="3"/>
      <polyline points="10,100 25,85 40,93 55,75 70,83 85,70" 
                fill="none" stroke="#37b24d" stroke-width="2"/>
      
      <!-- 표 영역 -->
      <rect x="115" y="48" width="95" height="60" fill="#ffe8cc" stroke="#ff8787" stroke-width="1" rx="3"/>
      <g transform="translate(120, 53)">
        <rect x="0" y="0" width="85" height="17" fill="none" stroke="#fab005" stroke-width="1"/>
        <rect x="0" y="17" width="85" height="17" fill="none" stroke="#fab005" stroke-width="1"/>
        <rect x="0" y="34" width="85" height="17" fill="none" stroke="#fab005" stroke-width="1"/>
        <line x1="42" y1="0" x2="42" y2="51" stroke="#fab005" stroke-width="1"/>
      </g>
      
      <!-- 수식 -->
      <text x="0" y="125" font-family="Times, serif" font-size="12" fill="#495057">
        ∑ f(x) = ∫ φ(x)dx
      </text>
      
      <!-- 코드 블록 -->
      <rect x="0" y="133" width="210" height="35" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1" rx="3"/>
      <text x="8" y="145" font-family="monospace" font-size="9" fill="#099268">
        <tspan x="8" dy="0">def analyze(data):</tspan>
        <tspan x="8" dy="11">    return process(data)</tspan>
      </text>
      
      <!-- 이미지와 다이어그램 -->
      <rect x="0" y="175" width="70" height="45" fill="#e7f5ff" stroke="#339af0" stroke-width="1" rx="3"/>
      <text x="35" y="200" font-family="Arial" font-size="9" text-anchor="middle" fill="#1971c2">Image</text>
      
      <g transform="translate(85, 175)">
        <rect x="0" y="0" width="125" height="45" fill="#f3f0ff" stroke="#9775fa" stroke-width="1" rx="3"/>
        <circle cx="25" cy="22" r="10" fill="#e5dbff" stroke="#9775fa" stroke-width="1"/>
        <circle cx="62" cy="22" r="10" fill="#e5dbff" stroke="#9775fa" stroke-width="1"/>
        <circle cx="99" cy="22" r="10" fill="#e5dbff" stroke="#9775fa" stroke-width="1"/>
        <line x1="35" y1="22" x2="52" y2="22" stroke="#9775fa" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="72" y1="22" x2="89" y2="22" stroke="#9775fa" stroke-width="1" marker-end="url(#arrow)"/>
      </g>
    </g>
  </g>
  
  <!-- 타이포그래피 시스템 (오른쪽 위) -->
  <g transform="translate(600, 100)">
    <rect x="0" y="0" width="600" height="80" 
          fill="url(#typoGradient)" 
          stroke="#9c27b0" 
          stroke-width="2" 
          rx="10" 
          filter="url(#shadow)"/>
    <text x="300" y="35" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="22" font-weight="bold" 
          text-anchor="middle" fill="#7b1fa2">Typography System</text>
    <text x="300" y="55" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="14" 
          text-anchor="middle" fill="#8e24aa">Typography System</text>
  </g>
  
  <!-- 연결선 (디지털 문서 → 타이포그래피 시스템) -->
  <path d="M 290,140 L 600,140" stroke="#6c757d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 연결선 (디지털 문서 → 제목 글꼴) 직접 연결 -->
  <path d="M 350,240 L 350,240 L 350,300" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 연결선들 (타이포그래피 시스템 → 각 글꼴 타입) -->
  <path d="M 900,180 L 900,240" stroke="#6c757d" stroke-width="2" fill="none"/>
  <path d="M 350,240 L 1311,240" stroke="#6c757d" stroke-width="2" fill="none"/>
  
  <!-- 수직 연결선들 (타이포그래피 시스템에서 각 글꼴로) -->
  <g stroke="#6c757d" stroke-width="2" fill="none">
    <!-- 제목 글꼴은 이미 위에서 연결됨 -->
    <path d="M 590,240 L 590,300" marker-end="url(#arrow)"/>
    <path d="M 830,240 L 830,300" marker-end="url(#arrow)"/>
    <path d="M 1070,240 L 1070,300" marker-end="url(#arrow)"/>
    <path d="M 1310,240 L 1310,300" marker-end="url(#arrow)"/>
  </g>
  
  <!-- 제목 글꼴 -->
  <g transform="translate(270, 300)">
    <rect x="0" y="0" width="200" height="150" 
          fill="url(#titleGradient)" 
          stroke="#ff9800" 
          stroke-width="2" 
          rx="10" 
          filter="url(#shadow)"/>
    <text x="100" y="30" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="16" font-weight="bold" 
          text-anchor="middle" fill="#e65100">Title Fonts</text>
    <text x="100" y="55" font-family="Times, serif" 
          font-size="20" font-weight="bold" 
          text-anchor="middle" fill="#ff6f00">GRAVITAS</text>
    <text x="100" y="80" font-family="Georgia, serif" 
          font-size="16" font-weight="bold" 
          text-anchor="middle" fill="#ff8f00">쟁취체</text>
    <text x="100" y="105" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="12" 
          text-anchor="middle" fill="#fb8c00">Script, Display</text>
    <text x="100" y="125" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="11" 
          text-anchor="middle" fill="#f57c00">Impact Focused</text>
  </g>
  
  <!-- 본문 글꼴 -->
  <g transform="translate(490, 300)">
    <rect x="0" y="0" width="200" height="150" 
          fill="url(#bodyGradient)" 
          stroke="#4caf50" 
          stroke-width="2" 
          rx="10" 
          filter="url(#shadow)"/>
    <text x="100" y="30" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="16" font-weight="bold" 
          text-anchor="middle" fill="#2e7d32">Body Fonts</text>
    <text x="100" y="55" font-family="Verdana, sans-serif" 
          font-size="16" 
          text-anchor="middle" fill="#388e3c">Verdana</text>
    <text x="100" y="80" font-family="'Noto Serif KR', serif" 
          font-size="16" 
          text-anchor="middle" fill="#43a047">나눔명조</text>
    <text x="100" y="105" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="12" 
          text-anchor="middle" fill="#4caf50">Serif/Sans-serif</text>
    <text x="100" y="125" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="11" 
          text-anchor="middle" fill="#66bb6a">Long Text Optimized</text>
  </g>
  
  <!-- 코드 글꼴 -->
  <g transform="translate(730, 300)">
    <rect x="0" y="0" width="200" height="150" 
          fill="url(#codeGradient)" 
          stroke="#8bc34a" 
          stroke-width="2" 
          rx="10" 
          filter="url(#shadow)"/>
    <text x="100" y="30" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="16" font-weight="bold" 
          text-anchor="middle" fill="#558b2f">Code Fonts</text>
    <text x="100" y="55" font-family="Consolas, monospace" 
          font-size="16" 
          text-anchor="middle" fill="#689f38">Consolas</text>
    <text x="100" y="80" font-family="monospace" 
          font-size="16" 
          text-anchor="middle" fill="#7cb342">D2 Coding</text>
    <text x="100" y="105" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="12" 
          text-anchor="middle" fill="#8bc34a">Monospaced</text>
    <text x="100" y="125" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="11" 
          text-anchor="middle" fill="#9ccc65">Code Alignment</text>
  </g>
  
  <!-- 차트 글꼴 -->
  <g transform="translate(970, 300)">
    <rect x="0" y="0" width="200" height="150" 
          fill="url(#chartGradient)" 
          stroke="#e91e63" 
          stroke-width="2" 
          rx="10" 
          filter="url(#shadow)"/>
    <text x="100" y="30" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="16" font-weight="bold" 
          text-anchor="middle" fill="#c2185b">Chart Fonts</text>
    <text x="100" y="55" font-family="Arial, sans-serif" 
          font-size="18" font-weight="bold" 
          text-anchor="middle" fill="#d81b60">ggplot</text>
    <text x="100" y="80" font-family="Helvetica, sans-serif" 
          font-size="16" font-weight="bold" 
          text-anchor="middle" fill="#e91e63">gt Specific</text>
    <text x="100" y="105" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="12" 
          text-anchor="middle" fill="#f06292">Visualization Optimized</text>
    <text x="100" y="125" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="11" 
          text-anchor="middle" fill="#f48fb1">Axis Labels Specific</text>
  </g>
  
  <!-- 수식 글꼴 -->
  <g transform="translate(1210, 300)">
    <rect x="0" y="0" width="200" height="150" 
          fill="url(#mathGradient)" 
          stroke="#9c27b0" 
          stroke-width="2" 
          rx="10" 
          filter="url(#shadow)"/>
    <text x="100" y="30" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="16" font-weight="bold" 
          text-anchor="middle" fill="#7b1fa2">Mathematical Fonts</text>
    <text x="100" y="55" font-family="Times, serif" 
          font-size="18" font-style="italic" 
          text-anchor="middle" fill="#8e24aa">LaTeX</text>
    <text x="100" y="80" font-family="Computer Modern, serif" 
          font-size="15" 
          text-anchor="middle" fill="#9c27b0">Computer Modern</text>
    <text x="100" y="105" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="12" 
          text-anchor="middle" fill="#ab47bc">Latin Modern</text>
    <text x="100" y="125" font-family="'Noto Sans KR', Arial, sans-serif" 
          font-size="11" 
          text-anchor="middle" fill="#ba68c8">Mathematical Symbols</text>
  </g>
</svg>