<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Noto Sans KR', sans-serif; font-size: 30px; font-weight: 700; fill: #1e3a8a; }
      .subtitle { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: 600; fill: #dc2626; }
      .section-title { font-family: 'Noto Sans KR', sans-serif; font-size: 18px; font-weight: 700; fill: white; }
      .label { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; }
      .description { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; fill: #475569; }
      .impact { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 600; fill: #dc2626; }
      .check { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; fill: #059669; }
      .cross { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; fill: #dc2626; }
    </style>

    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="hwpGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="standardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" class="title">AI 시대와 HWP의 치명적 불일치</text>
  <text x="700" y="65" text-anchor="middle" class="subtitle">기계가독·자동화·글로벌 호환, 세 가지 핵심 요구사항과의 충돌</text>

  <!-- Main Comparison Table -->
  <!-- Header -->
  <rect x="50" y="100" width="420" height="50" fill="#1e3a8a"/>
  <text x="260" y="133" text-anchor="middle" style="font-size: 20px; font-weight: 700; fill: white;">AI 시대 핵심 요구사항</text>

  <rect x="490" y="100" width="420" height="50" fill="#dc2626"/>
  <text x="700" y="133" text-anchor="middle" style="font-size: 20px; font-weight: 700; fill: white;">HWP 현실</text>

  <rect x="930" y="100" width="420" height="50" fill="#059669"/>
  <text x="1140" y="133" text-anchor="middle" style="font-size: 20px; font-weight: 700; fill: white;">표준 포맷 (ODF/DOCX/HTML)</text>

  <!-- Row 1: Machine Readability -->
  <g id="row1">
    <rect x="50" y="150" width="420" height="140" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="260" y="180" text-anchor="middle" class="label" style="font-size: 16px; color: #1e40af;">1️⃣ 기계가독성</text>

    <text x="70" y="205" class="description" style="font-size: 12px;">✓ 구조화된 데이터 추출</text>
    <text x="70" y="225" class="description" style="font-size: 12px;">✓ 메타데이터 표준화</text>
    <text x="70" y="245" class="description" style="font-size: 12px;">✓ 테이블·수식·이미지 파싱</text>
    <text x="70" y="265" class="description" style="font-size: 12px;">✓ 전문 검색·색인 생성</text>
    <text x="70" y="285" class="description" style="font-size: 12px;">✓ AI 학습 데이터 변환</text>

    <rect x="490" y="150" width="420" height="140" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="700" y="180" text-anchor="middle" class="cross" style="font-size: 16px;">❌ 심각한 제약</text>

    <text x="510" y="205" class="description" style="font-size: 11px;">✗ 바이너리 포맷, 직접 파싱 불가</text>
    <text x="510" y="223" class="description" style="font-size: 11px;">✗ 메타데이터 추출 불완전</text>
    <text x="510" y="241" class="description" style="font-size: 11px;">✗ 복잡한 객체 처리 실패</text>
    <text x="510" y="259" class="description" style="font-size: 11px;">✗ 전문 검색 엔진 연동 곤란</text>
    <text x="510" y="277" class="description" style="font-size: 11px;">✗ 변환 과정에서 정보 손실</text>

    <rect x="930" y="150" width="420" height="140" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="1140" y="180" text-anchor="middle" class="check" style="font-size: 16px;">✅ 완벽 지원</text>

    <text x="950" y="205" class="description" style="font-size: 11px;">✓ XML/JSON 기반, 직접 파싱</text>
    <text x="950" y="223" class="description" style="font-size: 11px;">✓ 표준 메타데이터 스키마</text>
    <text x="950" y="241" class="description" style="font-size: 11px;">✓ 객체·수식 정형 구조</text>
    <text x="950" y="259" class="description" style="font-size: 11px;">✓ Elasticsearch 등 바로 연동</text>
    <text x="950" y="277" class="description" style="font-size: 11px;">✓ 무손실 데이터 추출</text>
  </g>

  <!-- Row 2: Automation -->
  <g id="row2">
    <rect x="50" y="290" width="420" height="140" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="260" y="320" text-anchor="middle" class="label" style="font-size: 16px; color: #1e40af;">2️⃣ 자동화·재현성</text>

    <text x="70" y="345" class="description" style="font-size: 12px;">✓ 코드 기반 문서 생성</text>
    <text x="70" y="365" class="description" style="font-size: 12px;">✓ 데이터→문서 자동 산출</text>
    <text x="70" y="385" class="description" style="font-size: 12px;">✓ Git 버전관리 통합</text>
    <text x="70" y="405" class="description" style="font-size: 12px;">✓ CI/CD 파이프라인 연동</text>
    <text x="70" y="425" class="description" style="font-size: 12px;">✓ 재현가능 연구(RR) 실현</text>

    <rect x="490" y="290" width="420" height="140" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="700" y="320" text-anchor="middle" class="cross" style="font-size: 16px;">❌ 거의 불가능</text>

    <text x="510" y="345" class="description" style="font-size: 11px;">✗ GUI 수동 작업 필수</text>
    <text x="510" y="363" class="description" style="font-size: 11px;">✗ 스크립팅 API 빈약</text>
    <text x="510" y="381" class="description" style="font-size: 11px;">✗ Git diff/merge 불가능</text>
    <text x="510" y="399" class="description" style="font-size: 11px;">✗ 자동화 워크플로우 단절</text>
    <text x="510" y="417" class="description" style="font-size: 11px;">✗ 재현성 검증 실패</text>

    <rect x="930" y="290" width="420" height="140" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="1140" y="320" text-anchor="middle" class="check" style="font-size: 16px;">✅ 완벽 지원</text>

    <text x="950" y="345" class="description" style="font-size: 11px;">✓ Pandoc, Quarto 등 완전 자동</text>
    <text x="950" y="363" class="description" style="font-size: 11px;">✓ R/Python 통합 산출</text>
    <text x="950" y="381" class="description" style="font-size: 11px;">✓ 플레인텍스트 diff/merge</text>
    <text x="950" y="399" class="description" style="font-size: 11px;">✓ GitHub Actions 네이티브</text>
    <text x="950" y="417" class="description" style="font-size: 11px;">✓ RMarkdown/Jupyter 통합</text>
  </g>

  <!-- Row 3: LLM Integration -->
  <g id="row3">
    <rect x="50" y="430" width="420" height="140" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="260" y="460" text-anchor="middle" class="label" style="font-size: 16px; color: #1e40af;">3️⃣ LLM 통합</text>

    <text x="70" y="485" class="description" style="font-size: 12px;">✓ RAG 파이프라인 직접 연결</text>
    <text x="70" y="505" class="description" style="font-size: 12px;">✓ 임베딩·벡터DB 변환</text>
    <text x="70" y="525" class="description" style="font-size: 12px;">✓ 문서 요약·분석 자동화</text>
    <text x="70" y="545" class="description" style="font-size: 12px;">✓ 지식그래프 구축</text>
    <text x="70" y="565" class="description" style="font-size: 12px;">✓ AI Agent 도구 통합</text>

    <rect x="490" y="430" width="420" height="140" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="700" y="460" text-anchor="middle" class="cross" style="font-size: 16px;">❌ 중대한 장애</text>

    <text x="510" y="485" class="description" style="font-size: 11px;">✗ 중간 변환 필수, 품질 저하</text>
    <text x="510" y="503" class="description" style="font-size: 11px;">✗ 레이아웃 정보 손실</text>
    <text x="510" y="521" class="description" style="font-size: 11px;">✗ 표·수식 파싱 불완전</text>
    <text x="510" y="539" class="description" style="font-size: 11px;">✗ 의미 구조 추출 실패</text>
    <text x="510" y="557" class="description" style="font-size: 11px;">✗ LangChain 등 네이티브 미지원</text>

    <rect x="930" y="430" width="420" height="140" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="1140" y="460" text-anchor="middle" class="check" style="font-size: 16px;">✅ 네이티브 지원</text>

    <text x="950" y="485" class="description" style="font-size: 11px;">✓ LlamaIndex, LangChain 직접 지원</text>
    <text x="950" y="503" class="description" style="font-size: 11px;">✓ 구조 보존 임베딩</text>
    <text x="950" y="521" class="description" style="font-size: 11px;">✓ 청크·분할 최적화</text>
    <text x="950" y="539" class="description" style="font-size: 11px;">✓ 시맨틱 검색 정밀도 높음</text>
    <text x="950" y="557" class="description" style="font-size: 11px;">✓ OpenAI/Claude API 완벽 연동</text>
  </g>

  <!-- Row 4: Global Compatibility -->
  <g id="row4">
    <rect x="50" y="570" width="420" height="140" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="260" y="600" text-anchor="middle" class="label" style="font-size: 16px; color: #1e40af;">4️⃣ 글로벌 호환성</text>

    <text x="70" y="625" class="description" style="font-size: 12px;">✓ 국제 표준 준수</text>
    <text x="70" y="645" class="description" style="font-size: 12px;">✓ 크로스 플랫폼 지원</text>
    <text x="70" y="665" class="description" style="font-size: 12px;">✓ 클라우드 서비스 통합</text>
    <text x="70" y="685" class="description" style="font-size: 12px;">✓ 다국적 협업 원활</text>
    <text x="70" y="705" class="description" style="font-size: 12px;">✓ 오픈소스 생태계 활용</text>

    <rect x="490" y="570" width="420" height="140" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="700" y="600" text-anchor="middle" class="cross" style="font-size: 16px;">❌ 한국만 고립</text>

    <text x="510" y="625" class="description" style="font-size: 11px;">✗ 독자 포맷, 표준 비준수</text>
    <text x="510" y="643" class="description" style="font-size: 11px;">✗ Windows 중심, 타 OS 제한</text>
    <text x="510" y="661" class="description" style="font-size: 11px;">✗ Google Docs/Office365 연동 약함</text>
    <text x="510" y="679" class="description" style="font-size: 11px;">✗ 해외 기관·재외국민 소외</text>
    <text x="510" y="697" class="description" style="font-size: 11px;">✗ 글로벌 도구 체인 단절</text>

    <rect x="930" y="570" width="420" height="140" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="1140" y="600" text-anchor="middle" class="check" style="font-size: 16px;">✅ 범용 지원</text>

    <text x="950" y="625" class="description" style="font-size: 11px;">✓ ISO 표준 (ODF, OOXML)</text>
    <text x="950" y="643" class="description" style="font-size: 11px;">✓ Win/Mac/Linux 동등</text>
    <text x="950" y="661" class="description" style="font-size: 11px;">✓ 모든 클라우드 플랫폼 네이티브</text>
    <text x="950" y="679" class="description" style="font-size: 11px;">✓ 전 세계 어디서나 열람·편집</text>
    <text x="950" y="697" class="description" style="font-size: 11px;">✓ 수천 개 오픈소스 도구 존재</text>
  </g>

  <!-- Bottom Summary Box -->
  <rect x="50" y="730" width="1300" height="140" rx="10" fill="#1e3a8a" stroke="#1e40af" stroke-width="3"/>

  <text x="700" y="765" text-anchor="middle" style="font-size: 22px; font-weight: 700; fill: white;">
    💡 AI 시대의 핵심 메시지
  </text>

  <text x="80" y="795" style="font-size: 13px; fill: #dbeafe;">
    1. <tspan font-weight="700">기계가독성</tspan>: AI는 HWP를 '읽을' 수 없다. 변환 과정에서 핵심 정보가 손실되어 행정·연구 데이터 구축이 지연된다.
  </text>

  <text x="80" y="820" style="font-size: 13px; fill: #dbeafe;">
    2. <tspan font-weight="700">자동화·재현성</tspan>: HWP는 코드 기반 워크플로우와 통합이 불가능해, '재현가능한 행정·연구' 시대와 정면 충돌한다.
  </text>

  <text x="80" y="845" style="font-size: 13px; fill: #dbeafe;">
    3. <tspan font-weight="700">글로벌 단절</tspan>: AI 도구·클라우드·오픈소스 생태계는 모두 글로벌 표준 중심. HWP는 한국을 기술 고립으로 몰아간다.
  </text>

  <rect x="1050" y="785" width="280" height="70" rx="8" fill="#dc2626"/>
  <text x="1190" y="815" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: white;">
    결론: HWP는 AI 시대
  </text>
  <text x="1190" y="840" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: white;">
    한국의 '디지털 장벽'
  </text>
</svg>