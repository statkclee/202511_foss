<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="mainArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad"/>
    </marker>
    <marker id="subArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#999"/>
    </marker>

    <style>
      .main-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 16px; font-weight: 600; text-anchor: middle; fill: #333; }
      .sub-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 13px; font-weight: 400; text-anchor: middle; fill: #555; }
      .context-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 14px; font-weight: 500; text-anchor: middle; fill: #333; }
      .small-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 13px; font-weight: 400; text-anchor: middle; fill: #666; }
    </style>
  </defs>

  <!-- 배경 -->
  <rect width="1100" height="450" fill="#fafafa"/>

  <!-- 상단 컨텍스트 바 -->
  <rect x="50" y="20" width="500" height="50" rx="3" fill="#F7FBFF" stroke="#4A90E2" stroke-width="1.5"/>
  <text x="180" y="40" class="context-text">Single Source</text>
  <text x="180" y="58" class="small-text">하나의 원본</text>

  <text x="300" y="50" class="context-text" fill="#8e44ad">→</text>

  <text x="420" y="40" class="context-text">Multiple Outputs</text>
  <text x="420" y="58" class="small-text">다양한 출력</text>

  <!-- ① Content Creation -->
  <g transform="translate(120, 140)">
    <circle cx="0" cy="0" r="50" fill="#F7FBFF" stroke="#4A90E2" stroke-width="2"/>
    <circle cx="-20" cy="-20" r="10" fill="#ffffff" stroke="#4A90E2" stroke-width="1"/>
    <text x="-20" y="-16" class="small-text" fill="#4A90E2">①</text>
    <text x="0" y="0" class="main-text">Content</text>
    <text x="0" y="18" class="sub-text">Markdown</text>
    <!-- 수정/업데이트 루프 -->
    <path d="M -60 0 A 60 60 0 0 1 0 -60" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#subArrow)"/>
    <path d="M 60 0 A 60 60 0 0 1 0 60" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#subArrow)"/>
    <text x="70" y="-55" class="small-text">Edit → Rebuild</text>
  </g>

  <!-- 메인 흐름 -->
  <path d="M 180 140 H 230" stroke="#8e44ad" stroke-width="2" marker-end="url(#mainArrow)"/>

  <g transform="translate(300, 140)">
    <rect x="-60" y="-35" width="120" height="70" rx="3" fill="#F8F4FF" stroke="#8E44AD" stroke-width="2"/>
    <circle cx="-40" cy="-20" r="10" fill="#ffffff" stroke="#8E44AD" stroke-width="1"/>
    <text x="-40" y="-16" class="small-text" fill="#8E44AD">②</text>
    <text x="0" y="0" class="main-text">Design</text>
    <text x="0" y="18" class="sub-text">CSS/Themes</text>
  </g>

  <path d="M 370 140 H 440" stroke="#8e44ad" stroke-width="2" marker-end="url(#mainArrow)"/>

  <!-- ③ Publishing 허브 -->
  <g transform="translate(500, 140)">
    <polygon points="0,-55 55,0 0,55 -55,0" fill="#F8F4FF" stroke="#8E44AD" stroke-width="2"/>
    <circle cx="-30" cy="-30" r="10" fill="#ffffff" stroke="#8E44AD" stroke-width="1"/>
    <text x="-30" y="-26" class="small-text" fill="#8E44AD">③</text>
    <text x="0" y="4" class="main-text">Publishing</text>
    <text x="30" y="70" class="sub-text" fill="#8E44AD">Pandoc</text>
  </g>

  <!-- Publishing → 출력형식 -->
  <path d="M 500 195 V 220 H 200 V 255" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>
  <path d="M 500 195 V 220 H 400 V 255" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>
  <path d="M 500 195 V 220 H 600 V 255" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>

  <!-- 출력 형식 상자들 -->
  <g transform="translate(200, 280)">
    <rect x="-55" y="-25" width="110" height="50" rx="3" fill="#F5F5F5" stroke="#999" stroke-width="1.5"/>
    <text x="0" y="4" class="sub-text">PDF (.pdf)</text>
  </g>
  <g transform="translate(400, 280)">
    <rect x="-55" y="-25" width="110" height="50" rx="3" fill="#F5F5F5" stroke="#999" stroke-width="1.5"/>
    <text x="0" y="4" class="sub-text">HTML (.html)</text>
  </g>
  <g transform="translate(600, 280)">
    <rect x="-70" y="-25" width="140" height="50" rx="3" fill="#F5F5F5" stroke="#999" stroke-width="1.5"/>
    <text x="0" y="4" class="sub-text">Office (.docx/.pptx)</text>
  </g>

  <!-- PDF 그룹 -->
  <path d="M 200 305 V 335 H 115 V 360" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>
  <path d="M 200 305 V 335 H 218 V 360" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>

  <g transform="translate(170, 385)">
    <rect x="-105" y="-20" width="100" height="40" rx="3" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
    <rect x="-2" y="-20" width="100" height="40" rx="3" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
    <text x="-55" y="4" class="small-text">Papers/Reports</text>
    <text x="48" y="4" class="small-text">(E-)Books</text>
  </g>

  <!-- HTML 그룹 -->
  <path d="M 400 305 V 335 H 335 V 360" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>
  <path d="M 400 305 V 335 H 438 V 360" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>

  <g transform="translate(390, 385)">
    <rect x="-105" y="-20" width="100" height="40" rx="3" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
    <rect x="-2" y="-20" width="100" height="40" rx="3" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
    <text x="-55" y="-2" class="small-text">Websites</text>
    <text x="-55" y="12" class="small-text">Blogs</text>
    <text x="48" y="4" class="small-text">Dashboards</text>
  </g>

  <!-- Office 그룹 -->
  <path d="M 600 305 V 335 H 555 V 360" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>
  <path d="M 600 305 V 335 H 658 V 360" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#subArrow)"/>

  <g transform="translate(610, 385)">
    <rect x="-105" y="-20" width="100" height="40" rx="3" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
    <rect x="-2" y="-20" width="100" height="40" rx="3" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
    <text x="-55" y="4" class="small-text">Business</text>
    <text x="48" y="4" class="small-text">Science &amp; Tech</text>
  </g>

  <!-- 우측 사이드바 -->
  <rect x="750" y="80" width="300" height="300" rx="3" fill="#f8f9fa" stroke="#ddd" stroke-width="1.5"/>
  <text x="900" y="110" class="context-text">Single Sourcing 장점</text>
  <g transform="translate(780, 140)">
    <text x="0" y="0"  class="sub-text" style="text-anchor:start;">• 일관성 보장</text>
    <text x="0" y="25" class="sub-text" style="text-anchor:start;">• 빠른 출판</text>
    <text x="0" y="50" class="sub-text" style="text-anchor:start;">• 자동 업데이트</text>
    <text x="0" y="75" class="sub-text" style="text-anchor:start;">• 버전 관리</text>
    <text x="0" y="100" class="sub-text" style="text-anchor:start;">• 협업 용이</text>
    <text x="0" y="125" class="sub-text" style="text-anchor:start;">• 비용 절감</text>
  </g>
  <rect x="770" y="280" width="260" height="80" rx="3" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="900" y="305" class="small-text" fill="#333">원본 수정 → 모든 형식 자동 갱신</text>
  <text x="900" y="327" class="small-text">데이터 변경 시 그래프도 자동 업데이트</text>
  <text x="900" y="349" class="small-text">재현 가능한 연구 환경 제공</text>
</svg>
