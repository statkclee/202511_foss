<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 24px; font-weight: 400; fill: #111111; }
      .stage-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 18px; font-weight: 400; fill: #111111; }
      .desc-text-middle { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 17px; fill: #444444; }
      .desc-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 16px; fill: #555555; }
      .desc-text-learning { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 12px; fill: #555555; }
      .ai-brain { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
      .ai-model { fill: #fafafa; stroke: #999999; stroke-width: 1; }
      .multimodal { fill: #f5f5f5; stroke: #aaaaaa; stroke-width: 0.5; }
      .evolution-cycle { stroke: #999999; stroke-width: 1; fill: none; stroke-dasharray: 3,3; }
      .natural-language { fill: #f5f5f5; stroke: #999999; stroke-width: 1; }
    </style>

    <!-- 화살표 마커 정의 -->
    <marker id="flow-arrow" markerWidth="6" markerHeight="5"
            refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#999999" />
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="520" fill="#fefefe"/>

  <!-- 중앙 AI 기반 지능형 문서 -->
  <g id="center-ai-document">
    <circle cx="600" cy="210" r="80" class="ai-brain"/>
    <text x="600" y="195" text-anchor="middle" class="stage-text">AI Intelligent</text>
    <text x="600" y="215" text-anchor="middle" class="stage-text">Document</text>
    <text x="600" y="235" text-anchor="middle" class="desc-text" font-style="italic">Self-evolving · Learning</text>
  </g>

  <!-- AI 모델들 -->
  <!-- GPT -->
  <g id="gpt-model">
    <rect x="300" y="80" width="100" height="60" rx="3" class="ai-model"/>
    <text x="350" y="110" text-anchor="middle" class="stage-text">GPT</text>
    <text x="350" y="130" text-anchor="middle" class="desc-text" font-style="italic">OpenAI</text>
  </g>

  <!-- Claude -->
  <g id="claude-model">
    <rect x="800" y="80" width="100" height="60" rx="3" class="ai-model"/>
    <text x="850" y="110" text-anchor="middle" class="stage-text">Claude</text>
    <text x="850" y="130" text-anchor="middle" class="desc-text" font-style="italic">Anthropic</text>
  </g>

  <!-- Gemini -->
  <g id="gemini-model">
    <rect x="300" y="300" width="100" height="60" rx="3" class="ai-model"/>
    <text x="350" y="330" text-anchor="middle" class="stage-text">Gemini</text>
    <text x="350" y="350" text-anchor="middle" class="desc-text" font-style="italic">Google</text>
  </g>

  <!-- NotebookLM -->
  <g id="notebooklm-model">
    <rect x="780" y="300" width="140" height="60" rx="3" class="ai-model"/>
    <text x="850" y="325" text-anchor="middle" class="stage-text">NotebookLM</text>
    <text x="850" y="345" text-anchor="middle" class="desc-text" font-style="italic">Google</text>
  </g>

  <!-- 연결선들 (AI 모델에서 중앙으로) -->
  <line x1="400" y1="110" x2="530" y2="170" class="evolution-cycle" marker-end="url(#flow-arrow)"/>
  <line x1="800" y1="110" x2="670" y2="170" class="evolution-cycle" marker-end="url(#flow-arrow)"/>
  <line x1="400" y1="330" x2="530" y2="250" class="evolution-cycle" marker-end="url(#flow-arrow)"/>
  <line x1="800" y1="330" x2="670" y2="250" class="evolution-cycle" marker-end="url(#flow-arrow)"/>

  <!-- 자연어 인터페이스 -->
  <g id="natural-language-interface">
    <rect x="500" y="40" width="200" height="65" rx="3" class="natural-language"/>
    <text x="600" y="65" text-anchor="middle" class="stage-text">Natural Language</text>
    <text x="600" y="85" text-anchor="middle" class="stage-text">Interface</text>
    <text x="600" y="100" text-anchor="middle" class="desc-text" font-style="italic">Voice · Text · Gesture</text>

    <!-- 연결선 -->
    <line x1="600" y1="105" x2="600" y2="125" class="evolution-cycle" marker-end="url(#flow-arrow)"/>
  </g>

  <!-- 자가 진화 사이클 -->
  <g id="evolution-cycle-diagram">
    <text x="880" y="160" class="stage-text">Self-Evolution Cycle</text>

    <!-- 학습 -->
    <rect x="850" y="170" width="65" height="32" rx="3" fill="#ffffff" stroke="#999999" stroke-width="0.5"/>
    <text x="882" y="190" text-anchor="middle" class="desc-text-learning">Learning</text>

    <!-- 개선 -->
    <rect x="915" y="205" width="85" height="32" rx="3" fill="#fafafa" stroke="#aaaaaa" stroke-width="0.5"/>
    <text x="957" y="225" text-anchor="middle" class="desc-text-learning">Improvement</text>

    <!-- 적응 -->
    <rect x="850" y="240" width="65" height="32" rx="3" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="0.5"/>
    <text x="882" y="260" text-anchor="middle" class="desc-text-learning">Adaptation</text>

    <!-- 사이클 화살표 -->
    <!-- Learning to Improvement -->
    <path d="M 915 186 Q 940 180 955 205" class="evolution-cycle" marker-end="url(#flow-arrow)"/>
    <!-- Improvement to Adaptation -->
    <path d="M 957 237 Q 945 245 915 256" class="evolution-cycle" marker-end="url(#flow-arrow)"/>
    <!-- Adaptation to Learning -->
    <path d="M 850 256 Q 770 220 850 186" class="evolution-cycle" marker-end="url(#flow-arrow)"/>
  </g>

  <!-- 멀티모달 입출력 -->
  <g id="multimodal-io">
    <text x="320" y="160" class="stage-text">Multimodal I/O</text>

    <!-- 텍스트 -->
    <rect x="300" y="170" width="45" height="26" rx="3" class="multimodal"/>
    <text x="322" y="187" text-anchor="middle" class="desc-text">Text</text>

    <!-- 코드 -->
    <rect x="350" y="170" width="45" height="26" rx="3" class="multimodal"/>
    <text x="372" y="187" text-anchor="middle" class="desc-text">Code</text>

    <!-- 이미지 -->
    <rect x="300" y="201" width="45" height="26" rx="3" class="multimodal"/>
    <text x="322" y="218" text-anchor="middle" class="desc-text">Image</text>

    <!-- 음성 -->
    <rect x="350" y="201" width="45" height="26" rx="3" class="multimodal"/>
    <text x="372" y="218" text-anchor="middle" class="desc-text">Voice</text>

    <!-- 비디오 -->
    <rect x="300" y="232" width="45" height="26" rx="3" class="multimodal"/>
    <text x="322" y="249" text-anchor="middle" class="desc-text">Video</text>

    <!-- 데이터 -->
    <rect x="350" y="232" width="45" height="26" rx="3" class="multimodal"/>
    <text x="372" y="249" text-anchor="middle" class="desc-text">Data</text>

    <!-- 연결선 -->
    <line x1="400" y1="210" x2="515" y2="210" class="evolution-cycle" marker-end="url(#flow-arrow)"/>
  </g>

  <!-- 특징 설명 박스들 -->
  <g id="characteristics">
    <!-- 자가 진화 -->
    <rect x="30" y="390" width="280" height="110" rx="2" fill="#ffffff" stroke="#dddddd" stroke-width="0.5"/>
    <line x1="30" y1="425" x2="310" y2="425" stroke="#cccccc" stroke-width="0.5"/>
    <text x="170" y="415" text-anchor="middle" class="stage-text" font-weight="600">Self-Evolution</text>
    <text x="45" y="442" class="desc-text">AI automatic improvement</text>
    <text x="45" y="464" class="desc-text">Continuous learning</text>
    <text x="45" y="486" class="desc-text">Self-updating</text>

    <!-- 대화형 인터페이스 -->
    <rect x="330" y="390" width="280" height="110" rx="2" fill="#ffffff" stroke="#dddddd" stroke-width="0.5"/>
    <line x1="330" y1="425" x2="610" y2="425" stroke="#cccccc" stroke-width="0.5"/>
    <text x="470" y="415" text-anchor="middle" class="stage-text" font-weight="600">Conversational Interface</text>
    <text x="345" y="442" class="desc-text">Natural language communication</text>
    <text x="345" y="464" class="desc-text">Instant response</text>
    <text x="345" y="486" class="desc-text">Context understanding</text>

    <!-- 멀티모달 -->
    <rect x="630" y="390" width="280" height="110" rx="2" fill="#ffffff" stroke="#dddddd" stroke-width="0.5"/>
    <line x1="630" y1="425" x2="910" y2="425" stroke="#cccccc" stroke-width="0.5"/>
    <text x="770" y="415" text-anchor="middle" class="stage-text" font-weight="600">Multimodal</text>
    <text x="645" y="442" class="desc-text">Various format integration</text>
    <text x="645" y="464" class="desc-text">Cross-modal conversion</text>
    <text x="645" y="486" class="desc-text">Unlimited expressiveness</text>

    <!-- 실시간 적응 -->
    <rect x="930" y="390" width="280" height="110" rx="2" fill="#ffffff" stroke="#dddddd" stroke-width="0.5"/>
    <line x1="930" y1="425" x2="1210" y2="425" stroke="#cccccc" stroke-width="0.5"/>
    <text x="1070" y="415" text-anchor="middle" class="stage-text" font-weight="600">Real-time Adaptation</text>
    <text x="945" y="442" class="desc-text">User-customized</text>
    <text x="945" y="464" class="desc-text">Dynamic personalization</text>
    <text x="945" y="486" class="desc-text">Predictive preparation</text>
  </g>

</svg>