<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <style><![CDATA[
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 32px; font-weight: 900; fill: #f8fafc; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #cbd5e1; }
      .h1 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; }
      .h2 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: 800; fill: #f1f5f9; }
      .p { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #e5e7eb; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #cbd5e1; }
      .year { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: 900; fill: #fbbf24; }
    ]]></style>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Stage gradients -->
    <linearGradient id="gradStage1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="gradStage2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="gradStage3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Effects -->
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrowRight" markerWidth="16" markerHeight="12" refX="12" refY="6" orient="auto">
      <polygon points="0 0, 16 6, 0 12" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Header -->
  <text x="450" y="50" text-anchor="middle" class="title">Three Stages of AI Development</text>
  <text x="700" y="50" text-anchor="middle" class="subtitle">Three Stages of AI Development</text>

  <!-- Current position indicator -->
  <g transform="translate(150,100)">
    <polygon points="0 0, 20 -25, -20 -25" fill="#fbbf24" filter="url(#shadow)"/>
    <text x="0" y="-35" text-anchor="middle" class="small" fill="#fbbf24">Current Position</text>
  </g>

  <!-- Stage 1: Simple Substitution -->
  <g transform="translate(50,120)">
    <rect x="0" y="0" width="300" height="320" rx="20" fill="url(#gradStage1)" filter="url(#shadow)" opacity="0.9"/>
    <text x="150" y="35" text-anchor="middle" class="h1">Stage 1: Simple Substitution</text>
    <text x="150" y="60" text-anchor="middle" class="small">Simple Substitution</text>
    <text x="150" y="85" text-anchor="middle" class="year">2022-2025</text>
    
    <g transform="translate(20,110)" class="p">
      <text x="0" y="0" class="h2" fill="#fed7aa">Characteristics:</text>
      <text x="0" y="25">• Adding AI tools to existing tasks</text>
      <text x="0" y="45">• Mostly maintaining workflows</text>
      <text x="0" y="65">• Minimal organizational change</text>
      <text x="0" y="85">• "AI assistance" concept</text>
      
      <text x="0" y="125" class="h2" fill="#fed7aa">Current Situation:</text>
      <text x="0" y="150">• Using ChatGPT, Claude</text>
      <text x="0" y="170">• Using coding assistants</text>
      <text x="0" y="190">• Text generation tools</text>
      
      <text x="0" y="230" class="h2" fill="#fed7aa">Limitations:</text>
      <text x="0" y="255">• Limited productivity improvement</text>
      <text x="0" y="275">• Learning costs incurred</text>
      <text x="0" y="295">• Existing inertia continues</text>
    </g>
  </g>

  <!-- Arrow 1 -->
  <line x1="340" y1="280" x2="440" y2="280" stroke="#34d399" stroke-width="6" marker-end="url(#arrowRight)" filter="url(#glow)"/>

  <!-- Stage 2: Gradual Adaptation -->
  <g transform="translate(450,120)">
    <rect x="0" y="0" width="300" height="320" rx="20" fill="url(#gradStage2)" filter="url(#shadow)" opacity="0.9"/>
    <text x="150" y="35" text-anchor="middle" class="h1">Stage 2: Gradual Adaptation</text>
    <text x="150" y="60" text-anchor="middle" class="small">Gradual Adaptation</text>
    <text x="150" y="85" text-anchor="middle" class="year">2025-2030 (expected)</text>
    
    <g transform="translate(20,110)" class="p">
      <text x="0" y="0" class="h2" fill="#bfdbfe">특징:</text>
      <text x="0" y="25">• AI-dedicated workflow development</text>
      <text x="0" y="45">• Partial organizational restructuring</text>
      <text x="0" y="65">• Human-AI role division</text>
      <text x="0" y="85">• Mixed system operations</text>
      
      <text x="0" y="125" class="h2" fill="#bfdbfe">Expected Changes:</text>
      <text x="0" y="150">• Emergence of AI managers</text>
      <text x="0" y="170">• Creation of new job roles</text>
      <text x="0" y="190">• Education system reform</text>
      
      <text x="0" y="230" class="h2" fill="#bfdbfe">Challenges:</text>
      <text x="0" y="255">• Need for intangible capital investment</text>
      <text x="0" y="275">• Cultural change requirements</text>
      <text x="0" y="295">• Complexity management</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <line x1="760" y1="280" x2="840" y2="280" stroke="#34d399" stroke-width="6" marker-end="url(#arrowRight)" filter="url(#glow)"/>

  <!-- Stage 3: Revolutionary Reconfiguration -->
  <g transform="translate(850,120)">
    <rect x="0" y="0" width="300" height="320" rx="20" fill="url(#gradStage3)" filter="url(#shadow)" opacity="0.9"/>
    <text x="150" y="35" text-anchor="middle" class="h1">Stage 3: Revolutionary Reconfiguration</text>
    <text x="150" y="60" text-anchor="middle" class="small">Revolutionary Reconfiguration</text>
    <text x="150" y="85" text-anchor="middle" class="year">2030-2040 (expected)</text>
    
    <g transform="translate(20,110)" class="p">
      <text x="0" y="0" class="h2" fill="#a7f3d0">특징:</text>
      <text x="0" y="25">• AI-native organizational structure</text>
      <text x="0" y="45">• Complete work process reconfiguration</text>
      <text x="0" y="65">• Complete human-AI integration</text>
      <text x="0" y="85">• New industrial ecosystem</text>
      
      <text x="0" y="125" class="h2" fill="#a7f3d0">Expected Outcomes:</text>
      <text x="0" y="150">• Explosive productivity improvement</text>
      <text x="0" y="170">• Creativity revolution</text>
      <text x="0" y="190">• Knowledge democratization</text>
      
      <text x="0" y="230" class="h2" fill="#a7f3d0">Results:</text>
      <text x="0" y="255">• Cognitive revolution completion</text>
      <text x="0" y="275">• New economic paradigm</text>
      <text x="0" y="295">• Human potential maximization</text>
    </g>
  </g>

  <!-- Bottom insight -->
  <g transform="translate(600,535)">
    <rect x="-550" y="0" width="1100" height="60" rx="15" fill="#1f2937" opacity="0.8"/>
    <text x="0" y="25" text-anchor="middle" class="h1">Key Message: We are in Stage 1, true transformation will happen in Stages 2-3</text>
    <text x="0" y="45" text-anchor="middle" class="small">Key Message: We are in Stage 1, true transformation will happen in Stages 2-3</text>
  </g>
</svg>