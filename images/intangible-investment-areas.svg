<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <style><![CDATA[
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 40px; font-weight: 900; fill: #f8fafc; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 22px; font-weight: 600; fill: #cbd5e1; }
      .h1 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #ffffff; }
      .h2 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #f1f5f9; }
      .p { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #e5e7eb; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #cbd5e1; }
    ]]></style>

  <!-- Central core gradient definition -->
    <radialGradient id="gradCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </radialGradient>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Investment area gradients -->
    <linearGradient id="gradHuman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="gradCulture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="gradProcess" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="gradEthics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="gradEducation" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Effects -->
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/></filter>
    <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#34d399" flood-opacity="0.4"/></filter>

    <!-- Connection lines -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- Header -->
  <text x="700" y="60" text-anchor="middle" class="title">무형자본 투자 영역</text>
  <text x="700" y="95" text-anchor="middle" class="subtitle">Intangible Capital Investment Areas for AI Era</text>

  <g transform="translate(0,-80)">
    <!-- Central hub -->
    <g transform="translate(700,450)">
      <circle cx="0" cy="0" r="80" fill="url(#gradCore)" filter="url(#shadow)" opacity="0.9"/>
      <text x="0" y="-10" text-anchor="middle" class="h2" fill="#000">AI 시대</text>
      <text x="0" y="15" text-anchor="middle" class="small" fill="#000">무형자본 투자</text>
      <circle cx="0" cy="0" r="80" fill="none" stroke="#34d399" stroke-width="3" filter="url(#glow)"/>
    </g>

    <!-- Investment Area 1: Human Development -->
    <g transform="translate(200,200)">
      <rect x="0" y="0" width="280" height="180" rx="20" fill="url(#gradHuman)" filter="url(#shadow)" opacity="0.9"/>
      <text x="140" y="35" text-anchor="middle" class="h1">👨‍💻 인력 개발</text>
      <text x="140" y="65" text-anchor="middle" class="small">Human Development</text>
      
      <g transform="translate(20,95)" class="p">
        <text x="0" y="0" class="h2" fill="#bfdbfe">핵심 활동:</text>
        <text x="0" y="25" fill="#dbeafe">• AI 활용 전문 인력 양성</text>
        <text x="0" y="45" fill="#dbeafe">• 데이터 사이언티스트 육성</text>
        <text x="0" y="65" fill="#dbeafe">• AI 윤리 전문가 교육</text>
      </g>
      
    </g>

    <!-- Investment Area 2: Organizational Culture -->
    <g transform="translate(920,200)">
      <rect x="0" y="0" width="280" height="180" rx="20" fill="url(#gradCulture)" filter="url(#shadow)" opacity="0.9"/>
      <text x="140" y="35" text-anchor="middle" class="h1">🤝 조직 문화</text>
      <text x="140" y="65" text-anchor="middle" class="small">Organizational Culture</text>
      
      <g transform="translate(20,95)" class="p">
        <text x="0" y="0" class="h2" fill="#a7f3d0">핵심 활동:</text>
        <text x="0" y="25" fill="#d1fae5">• AI 협업 중심 문화 구축</text>
        <text x="0" y="45" fill="#d1fae5">• 실험과 혁신 장려</text>
        <text x="0" y="65" fill="#d1fae5">• 데이터 기반 의사결정</text>
      </g>
    </g>

    <!-- Investment Area 3: Process Redesign -->
    <g transform="translate(200,520)">
      <rect x="0" y="0" width="280" height="180" rx="20" fill="url(#gradProcess)" filter="url(#shadow)" opacity="0.9"/>
      <text x="140" y="35" text-anchor="middle" class="h1">⚙️ 프로세스 재설계</text>
      <text x="140" y="65" text-anchor="middle" class="small">Process Redesign</text>
      
      <g transform="translate(20,95)" class="p">
        <text x="0" y="0" class="h2" fill="#c4b5fd">핵심 활동:</text>
        <text x="0" y="25" fill="#e0e7ff">• AI 네이티브 워크플로우</text>
        <text x="0" y="45" fill="#e0e7ff">• 자동화 프로세스 구축</text>
        <text x="0" y="65" fill="#e0e7ff">• 인간-AI 협업 최적화</text>
      </g>
    </g>

    <!-- Investment Area 4: Ethical Framework -->
    <g transform="translate(920,520)">
      <rect x="0" y="0" width="280" height="180" rx="20" fill="url(#gradEthics)" filter="url(#shadow)" opacity="0.9"/>
      <text x="140" y="35" text-anchor="middle" class="h1">⚖️ 윤리적 프레임워크</text>
      <text x="140" y="65" text-anchor="middle" class="small">Ethical Framework</text>
      
      <g transform="translate(20,95)" class="p">
        <text x="0" y="0" class="h2" fill="#fed7aa">핵심 활동:</text>
        <text x="0" y="25" fill="#fef3c7">• 책임 있는 AI 사용</text>
        <text x="0" y="45" fill="#fef3c7">• AI 거버넌스 체계</text>
        <text x="0" y="65" fill="#fef3c7">• 편향성 모니터링</text>
      </g>
    </g>

    <!-- Investment Area 5: Education System -->
    <g transform="translate(560,720)">
      <rect x="0" y="0" width="280" height="150" rx="20" fill="url(#gradEducation)" filter="url(#shadow)" opacity="0.9"/>
      <text x="140" y="35" text-anchor="middle" class="h1">📚 교육 시스템</text>
      <text x="140" y="65" text-anchor="middle" class="small">Education System</text>
      
      <g transform="translate(20,85)" class="p">
        <text x="0" y="0" class="h2" fill="#fecaca">핵심 활동:</text>
        <text x="0" y="25" fill="#fee2e2">• AI 시대 역량 중심 교육</text>
        <text x="0" y="45" fill="#fee2e2">• 지속적 학습 프로그램</text>
      </g>
    </g>

    <!-- Connection lines from each area to center (absolute coordinates) -->
    <!-- Human Development (340, 290) to Center (700, 450) -->
    <line x1="480" y1="290" x2="635" y2="400" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.6"/>
    
    <!-- Organizational Culture (1060, 290) to Center (700, 450) -->
    <line x1="920" y1="290" x2="770" y2="400" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.6"/>
    
    <!-- Process Redesign (240, 610) to Center (700, 450) -->
    <line x1="480" y1="610" x2="640" y2="510" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.6"/>
    
    <!-- Ethical Framework (860, 610) to Center (700, 450) -->
    <line x1="920" y1="610" x2="770" y2="500" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.6"/>
    
    <!-- Education System (700, 795) to Center (700, 450) -->
    <line x1="700" y1="720" x2="700" y2="530" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.6"/>
  </g>

  <!-- Bottom insight panel -->
  <g transform="translate(700,850)">
    <rect x="-680" y="-40" width="1360" height="70" rx="15" fill="#1f2937" opacity="0.8" filter="url(#shadow)"/>
    <text x="0" y="-15" text-anchor="middle" class="h2" fill="#fbbf24">성공 핵심: 5개 영역의 동시적, 통합적 투자</text>
    <text x="0" y="10" text-anchor="middle" class="p" fill="#cbd5e1">무형자본 투자는 개별 영역이 아닌 전체 생태계의 조화로운 발전이 필수</text>
  </g>

</svg>