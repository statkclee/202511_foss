    <text x="590" y="575" class="defect">PDF 제출 필수 문서</text>
    <text x="590" y="590" class="defect">공식 배포 자료</text>

    <rect x="850" y="540" width="500" height="60" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="860" y="560" class="note">PDF 신뢰도 붕괴 (배포 불가)</text>
