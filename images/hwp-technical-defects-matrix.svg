    <text x="110" y="230" class="note">특히 붙여넣기·표 삽입 후 심화</text>

    <rect x="480" y="180" width="100" height="60" fill="#fee2e2" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="530" cy="207" r="10" class="critical"/>
    <text x="530" y="228" text-anchor="middle" style="font-size: 16px;">🔥</text>

    <rect x="580" y="180" width="270" height="60" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
