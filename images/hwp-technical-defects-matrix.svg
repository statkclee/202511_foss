    <rect x="580" y="360" width="270" height="60" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="590" y="380" class="defect">디자인 문서</text>
    <text x="590" y="395" class="defect">프레젠테이션 배포</text>
