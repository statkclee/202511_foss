    <text x="110" y="515" class="note">2·3단 구성에서 단별 줄간격·정렬 불균형</text>
    <text x="110" y="530" class="note">이미지/표 포함 시 악화</text>

    <rect x="480" y="480" width="100" height="60" fill="#fef3c7" stroke="#e5e7eb" stroke-width="1"/>
