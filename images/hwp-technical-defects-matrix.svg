<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Noto Sans KR', sans-serif; font-size: 30px; font-weight: 700; fill: #1e3a8a; }
      .subtitle { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: 600; fill: #475569; }
      .header { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 700; fill: white; }
      .defect { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; fill: #1e293b; }
      .severity { font-family: 'Noto Sans KR', sans-serif; font-size: 10px; font-weight: 600; }
      .note { font-family: 'Noto Sans KR', sans-serif; font-size: 10px; fill: #64748b; }
      .legend-text { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; fill: #1e293b; }

      .critical { fill: #dc2626; }
      .high { fill: #ea580c; }
      .medium { fill: #ca8a04; }
      .low { fill: #2563eb; }
    </style>
  </defs>

  <!-- Title -->
  <text x="700" y="35" text-anchor="middle" class="title">HWP 기술적 결함 매트릭스</text>
  <text x="700" y="60" text-anchor="middle" class="subtitle">14가지 주요 버그·불편 기능의 심각도와 영향 범위</text>

  <!-- Legend -->
  <g id="legend">
    <rect x="50" y="80" width="1300" height="45" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>

    <text x="70" y="105" class="legend-text" font-weight="700">심각도:</text>

    <circle cx="150" cy="100" r="8" class="critical"/>
    <text x="165" y="105" class="legend-text">치명적 (생산성 심각 저해)</text>

    <circle cx="330" cy="100" r="8" class="high"/>
    <text x="345" y="105" class="legend-text">높음 (작업 중단 유발)</text>

    <circle cx="500" cy="100" r="8" class="medium"/>
    <text x="515" y="105" class="legend-text">중간 (반복 수정 필요)</text>

    <circle cx="670" cy="100" r="8" class="low"/>
    <text x="685" y="105" class="legend-text">낮음 (불편)</text>

    <text x="900" y="105" class="legend-text" font-weight="700">빈도:</text>
    <text x="950" y="105" class="legend-text">🔥 매우 빈번 | ⚠️ 빈번 | 📌 가끔 | 💡 드묾</text>
  </g>

  <!-- Table Header -->
  <rect x="50" y="140" width="50" height="40" fill="#1e3a8a"/>
  <text x="75" y="165" text-anchor="middle" class="header" style="font-size: 11px;">No.</text>

  <rect x="100" y="140" width="380" height="40" fill="#1e3a8a"/>
  <text x="290" y="165" text-anchor="middle" class="header">결함 내용</text>

  <rect x="480" y="140" width="100" height="40" fill="#1e3a8a"/>
  <text x="530" y="158" text-anchor="middle" class="header" style="font-size: 11px;">심각도</text>
  <text x="530" y="173" text-anchor="middle" class="header" style="font-size: 9px;">빈도</text>

  <rect x="580" y="140" width="270" height="40" fill="#1e3a8a"/>
  <text x="715" y="165" text-anchor="middle" class="header">주요 피해 영역</text>

  <rect x="850" y="140" width="500" height="40" fill="#1e3a8a"/>
  <text x="1100" y="165" text-anchor="middle" class="header">실무 영향</text>

  <!-- Row 1 -->
  <g id="row1">
