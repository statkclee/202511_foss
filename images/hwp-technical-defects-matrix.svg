    <text x="590" y="215" class="defect">논문·학위논문</text>
    <text x="590" y="230" class="defect">입찰·공모 문서</text>

    <rect x="850" y="180" width="500" height="60" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="860" y="200" class="note">포맷 재조정에 수십 분 소모</text>
    <text x="860" y="215" class="note">인쇄/PDF 결과물 예측 불가</text>
    <text x="860" y="230" class="note">마감 임박 시 치명적 시간 손실</text>
  </g>

