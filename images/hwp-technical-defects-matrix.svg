    <rect x="580" y="480" width="270" height="60" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="590" y="500" class="defect">학술지·매거진</text>
    <text x="590" y="515" class="defect">뉴스레터</text>
    <text x="590" y="530" class="defect">단 레이아웃 디자인</text>

    <rect x="850" y="480" width="500" height="60" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="860" y="500" class="note">수동 조정 무한 반복</text>
    <text x="860" y="515" class="note">최종 결과물 비대칭·부자연스러움</text>
    <text x="860" y="530" class="note">전문 출판물에서 사용 불가 수준</text>
  </g>

  <!-- Row 7 -->
