    <text x="75" y="635" text-anchor="middle" style="font-size: 13px; font-weight: 700; fill: #1e293b;">8</text>

    <rect x="100" y="600" width="380" height="60" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="110" y="620" class="defect" font-weight="700">PC·프린터 환경 의존 레이아웃 붕괴</text>
    <text x="110" y="635" class="note">DPI/드라이버 차이만으로도 크게 달라짐</text>
    <text x="110" y="650" class="note">'진본과 사본' 구분 불가</text>

    <rect x="480" y="600" width="100" height="60" fill="#fee2e2" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="530" cy="627" r="10" class="critical"/>
    <text x="530" y="648" text-anchor="middle" style="font-size: 16px;">🔥</text>

    <rect x="580" y="600" width="270" height="60" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="590" y="620" class="defect">전자증거·소송</text>
    <text x="590" y="635" class="defect">공식 기록물</text>
    <text x="590" y="650" class="defect">표준 양식 문서</text>

    <rect x="850" y="600" width="500" height="60" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="860" y="620" class="note">문서 재현성 제로</text>
    <text x="860" y="635" class="note">법적 증거력·진본성 의문</text>
    <text x="860" y="650" class="note">협업·원격 작업 시 혼란</text>
  </g>

  <!-- Row 9-14 Summary -->
  <rect x="50" y="660" width="430" height="120" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="685" style="font-size: 13px; font-weight: 700; fill: #1e293b;">9~14번 결함 요약 (중·저 심각도, 빈도 다양)</text>

  <text x="70" y="705" class="defect">9. 자동저장 문서 파손 (중간/가끔)</text>
  <text x="70" y="720" class="defect">10. 붙여넣기 서식 유지 실패 (높음/빈번)</text>
  <text x="70" y="735" class="defect">11. 문단번호 스타일 꼬임 (높음/빈번)</text>
  <text x="70" y="750" class="defect">12. 대용량 문서 성능 저하 (높음/빈번)</text>
  <text x="70" y="765" class="defect">13. 매크로/자동화 취약 (중간/상시)</text>
  <text x="70" y="780" class="defect">14. 버전 간 호환 불량 (높음/빈번)</text>

  <!-- Summary Stats -->
  <rect x="500" y="660" width="850" height="120" rx="5" fill="#1e3a8a"/>

  <text x="925" y="690" text-anchor="middle" style="font-size: 18px; font-weight: 700; fill: white;">
    📊 기술적 결함 통계 요약
  </text>

  <text x="520" y="720" style="font-size: 14px; fill: #dbeafe;">
    • <tspan font-weight="700" fill="white">치명적 결함 5개</tspan>: 작업 중단·재작성 유발, 생산성 심각 저해
  </text>
  <text x="520" y="740" style="font-size: 14px; fill: #dbeafe;">
    • <tspan font-weight="700" fill="white">높음 결함 6개</tspan>: 반복 수정 필요, 업무 지연 야기
  </text>
  <text x="520" y="760" style="font-size: 14px; fill: #dbeafe;">
    • <tspan font-weight="700" fill="white">누적 효과</tspan>: 하나하나는 '불편'이지만, 조합 시 실무 마비 수준
  </text>
  <text x="520" y="780" style="font-size: 14px; fill: #dbeafe;">
    • <tspan font-weight="700" fill="white">근본 원因</tspan>: 바이너리 포맷·비표준·내부 구조 불안정성
  </text>

  <!-- Bottom Insight -->
  <rect x="50" y="800" width="1300" height="180" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>

  <text x="700" y="835" text-anchor="middle" style="font-size: 20px; font-weight: 700; fill: #991b1b;">
    💡 핵심 인사이트: 왜 이 결함들이 '악'인가?
  </text>

  <text x="70" y="865" style="font-size: 13px; fill: #7f1d1d;">
    <tspan font-weight="700">1. 예측 불가능성</tspan>: 언제 어떻게 깨질지 모르는 '지뢰밭' 작업 환경 → 사용자는 항상 긴장 상태, 생산성·창의성 저하
  </text>

  <text x="70" y="890" style="font-size: 13px; fill: #7f1d1d;">
    <tspan font-weight="700">2. 시간 낭비의 일상화</tspan>: 개인당 주 1~2시간 결함 대응 시간 누적 → 국가 전체로는 천문학적 손실 (연간 수천억 원 규모)
  </text>

  <text x="70" y="915" style="font-size: 13px; fill: #7f1d1d;">
    <tspan font-weight="700">3. 문서 신뢰도 붕괴</tspan>: 법률·계약·증거·공식 기록에서 '재현 불가능' → 진본성·증거력 의문, 행정·사법 시스템 리스크
  </text>

  <text x="70" y="940" style="font-size: 13px; fill: #7f1d1d;">
    <tspan font-weight="700">4. 개선 의지 부재</tspan>: 수십 년간 반복되는 동일 문제들 → 독점 환경에서 품질 개선 동기 결여, 사용자 피해 누적
  </text>

  <text x="70" y="965" style="font-size: 13px; fill: #7f1d1d;">
    <tspan font-weight="700">결론</tspan>: 이는 단순 '불편'이 아닌, 사용자 시간·정신·신뢰를 착취하는 <tspan font-weight="700">'구조적 폭력'</tspan>으로 간주되어야 한다.
  </text>
