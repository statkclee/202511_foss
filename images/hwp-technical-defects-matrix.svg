    <rect x="580" y="420" width="270" height="60" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="590" y="440" class="defect">계약서·법률문서</text>
    <text x="590" y="455" class="defect">규정·지침서</text>
    <text x="590" y="470" class="defect">프로젝트 계획서</text>

    <rect x="850" y="420" width="500" height="60" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="860" y="440" class="note">수동 재번호 매기기 (매우 번거로움)</text>
    <text x="860" y="455" class="note">조항 참조 오류 유발</text>
    <text x="860" y="470" class="note">법률·계약 문서에서 치명적</text>
  </g>

  <!-- Row 6 -->
