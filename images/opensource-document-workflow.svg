<svg viewBox="0 0 2000 1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 38px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 18px; font-weight: 600; fill: #475569; }
      .box-title { font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 20px; font-weight: 800; fill: #0b1220; }
      .box-sub { font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .pill { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
      .note { font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 12px; fill: #475569; }
      .legend { font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 12px; fill: #0b1220; font-weight: 700; }
      .badge { font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 12px; font-weight: 700; }
    </style>

    <!-- Colors / gradients -->
    <linearGradient id="g-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="g-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="g-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="g-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/><stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0,0 12,6 0,12 3,6" fill="#334155"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0,0 12,6 0,12 3,6" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0,0 12,6 0,12 3,6" fill="#b45309"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0,0 12,6 0,12 3,6" fill="#9333ea"/>
    </marker>

    <!-- Reusable pills -->
    <symbol id="pill-md"><rect width="94" height="22" rx="11" fill="url(#g-slate)"/><text x="47" y="15" text-anchor="middle" class="pill" fill="white">Markdown</text></symbol>
    <symbol id="pill-qmd"><rect width="78" height="22" rx="11" fill="url(#g-slate)"/><text x="39" y="15" text-anchor="middle" class="pill" fill="white">Quarto</text></symbol>
    <symbol id="pill-r"><rect width="46" height="22" rx="11" fill="url(#g-green)"/><text x="23" y="15" text-anchor="middle" class="pill" fill="white">R</text></symbol>
    <symbol id="pill-py"><rect width="70" height="22" rx="11" fill="url(#g-green)"/><text x="35" y="15" text-anchor="middle" class="pill" fill="white">Python</text></symbol>
    <symbol id="pill-tex"><rect width="60" height="22" rx="11" fill="url(#g-amber)"/><text x="30" y="15" text-anchor="middle" class="pill" fill="white">LaTeX</text></symbol>
    <symbol id="pill-pandoc"><rect width="80" height="22" rx="11" fill="url(#g-purple)"/><text x="40" y="15" text-anchor="middle" class="pill" fill="white">Pandoc</text></symbol>
    <symbol id="pill-lo"><rect width="88" height="22" rx="11" fill="url(#g-blue)"/><text x="44" y="15" text-anchor="middle" class="pill" fill="white">LibreOffice</text></symbol>
    <symbol id="pill-collabora"><rect width="100" height="22" rx="11" fill="url(#g-blue)"/><text x="50" y="15" text-anchor="middle" class="pill" fill="white">Collabora</text></symbol>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="2000" height="1400" fill="#fafafa"/>

  <!-- Title -->
  <rect x="60" y="40" width="1880" height="90" rx="14" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="1000" y="80" text-anchor="middle" class="title">LibreOffice × LaTeX/R/Python × Quarto/Markdown × Pandoc</text>
  <text x="1000" y="110" text-anchor="middle" class="subtitle">텍스트·코드 기반 저작 → 포맷 변환(표준화) → 최종 편집/협업 파이프라인 (2025)</text>

  <!-- LANE 1: Authoring (Left) -->
  <g transform="translate(80,180)">
    <rect x="0" y="0" width="540" height="450" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <text x="270" y="36" text-anchor="middle" class="box-title">① 원천 저작/컴퓨팅</text>
    <text x="270" y="58" text-anchor="middle" class="box-sub">텍스트 + 코드 + 데이터 = 재현가능 문서</text>

    <!-- authoring blocks -->
    <rect x="30" y="90" width="230" height="130" rx="10" fill="#e2e8f0"/>
    <text x="145" y="118" text-anchor="middle" class="badge">📝 텍스트</text>
    <g transform="translate(95,132)"><use href="#pill-md"/></g>
    <g transform="translate(105,162)"><use href="#pill-qmd"/></g>
    <g transform="translate(120,192)"><use href="#pill-tex"/></g>

    <rect x="280" y="90" width="230" height="130" rx="10" fill="#dcfce7"/>
    <text x="395" y="118" text-anchor="middle" class="badge">⚙️ 코드/데이터</text>
    <g transform="translate(312,132)"><use href="#pill-r"/></g>
    <g transform="translate(372,132)"><use href="#pill-py"/></g>
    <text x="395" y="175" text-anchor="middle" class="note">knitr engine</text>
    <text x="395" y="195" text-anchor="middle" class="note">Jupyter kernel</text>
    <text x="395" y="215" text-anchor="middle" class="note">실행 결과 자동 삽입</text>

    <rect x="30" y="240" width="480" height="90" rx="10" fill="#fef9c3"/>
    <text x="270" y="268" text-anchor="middle" class="badge">📚 인용/스타일</text>
    <text x="270" y="292" text-anchor="middle" class="note">CSL(참고문헌) · BibTeX · 템플릿</text>
    <text x="270" y="314" text-anchor="middle" class="note">reference.docx / reference.odt</text>

    <rect x="30" y="350" width="480" height="80" rx="10" fill="#dbeafe"/>
    <text x="270" y="378" text-anchor="middle" class="badge">🔧 버전 관리</text>
    <text x="270" y="402" text-anchor="middle" class="note">Git · GitHub/GitLab · 협업 브랜치</text>
    <text x="270" y="422" text-anchor="middle" class="note">Plain Text → diff/merge 완벽</text>
  </g>

  <!-- Flow arrow to transform -->
  <path d="M 620 380 L 720 380" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- LANE 2: Transform (Center) -->
  <g transform="translate(740,180)">
    <rect x="0" y="0" width="420" height="450" rx="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2" filter="url(#shadow)"/>
    <text x="210" y="36" text-anchor="middle" class="box-title">② 포맷 변환/출판</text>
    <text x="210" y="58" text-anchor="middle" class="box-sub">Pandoc이 단일 허브</text>

    <rect x="40" y="90" width="340" height="240" rx="10" fill="white" stroke="#c084fc" stroke-width="2"/>
    <g transform="translate(170,118)"><use href="#pill-pandoc"/></g>
    <text x="210" y="156" text-anchor="middle" class="note">입력: .qmd / .Rmd / .md</text>
    <text x="210" y="178" text-anchor="middle" class="note">+ 코드 실행 결과 + 이미지</text>
    <text x="210" y="200" text-anchor="middle" class="note">출력: PDF(LaTeX) · DOCX · ODT</text>
    <text x="210" y="222" text-anchor="middle" class="note">        HTML · EPUB · ...</text>
    <text x="210" y="250" text-anchor="middle" class="note">템플릿: reference.docx/odt</text>
    <text x="210" y="272" text-anchor="middle" class="note">필터: Lua filter · crossref</text>
    <text x="210" y="294" text-anchor="middle" class="note">40+ 포맷 지원</text>

    <!-- outbound arrows -->
    <path d="M 210 330 v 45" stroke="#9333ea" stroke-width="3" fill="none" marker-end="url(#arrow-purple)"/>
  </g>

  <!-- Produced formats row -->
  <g transform="translate(700,650)">
    <rect x="0" y="0" width="500" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <text x="250" y="32" text-anchor="middle" class="badge">📦 산출물 (다중 포맷 동시)</text>
    <g transform="translate(50,50)">
      <g transform="translate(0,0)"><rect width="54" height="22" rx="11" fill="url(#g-red)"/><text x="27" y="15" text-anchor="middle" class="pill" fill="white">PDF</text></g>
      <g transform="translate(72,0)"><rect width="68" height="22" rx="11" fill="url(#g-blue)"/><text x="34" y="15" text-anchor="middle" class="pill" fill="white">DOCX</text></g>
      <g transform="translate(158,0)"><rect width="64" height="22" rx="11" fill="url(#g-blue)"/><text x="32" y="15" text-anchor="middle" class="pill" fill="white">ODT</text></g>
      <g transform="translate(240,0)"><rect width="70" height="22" rx="11" fill="url(#g-green)"/><text x="35" y="15" text-anchor="middle" class="pill" fill="white">HTML</text></g>
      <g transform="translate(328,0)"><rect width="72" height="22" rx="11" fill="url(#g-amber)"/><text x="36" y="15" text-anchor="middle" class="pill" fill="white">EPUB</text></g>
    </g>
  </g>

  <!-- Arrows to editing lane -->
  <path d="M 950 750 C 950 780 1050 780 1050 780 L 1180 780" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- LANE 3: Editing / Collaboration (Right) -->
  <g transform="translate(1200,180)">
    <rect x="0" y="0" width="720" height="820" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <text x="360" y="36" text-anchor="middle" class="box-title">③ 최종 편집/협업</text>
    <text x="360" y="58" text-anchor="middle" class="box-sub">데스크톱/웹에서 교정 · 트랙체인지 · 양식 조정</text>

    <rect x="40" y="90" width="300" height="150" rx="10" fill="#e0f2fe" stroke="#93c5fd" stroke-width="2"/>
    <text x="190" y="120" text-anchor="middle" class="badge">🖥️ 데스크톱</text>
    <g transform="translate(145,140)"><use href="#pill-lo"/></g>
    <text x="190" y="180" text-anchor="middle" class="note">Writer(ODT/DOCX)</text>
    <text x="190" y="200" text-anchor="middle" class="note">Calc, Impress</text>
    <text x="190" y="220" text-anchor="middle" class="note">트랙체인지, 댓글</text>

    <rect x="380" y="90" width="300" height="150" rx="10" fill="#e0f2fe" stroke="#93c5fd" stroke-width="2"/>
    <text x="530" y="120" text-anchor="middle" class="badge">🌐 웹/클라우드</text>
    <g transform="translate(480,140)"><use href="#pill-collabora"/></g>
    <text x="530" y="180" text-anchor="middle" class="note">실시간 공동편집</text>
    <text x="530" y="200" text-anchor="middle" class="note">SDK/API 임베드</text>
    <text x="530" y="220" text-anchor="middle" class="note">Nextcloud 통합</text>

    <rect x="40" y="260" width="640" height="100" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="360" y="290" text-anchor="middle" class="badge">🧭 권장 워크플로우</text>
    <text x="360" y="318" text-anchor="middle" class="note">원천(Plain Text + 코드) → Pandoc 변환</text>
    <text x="360" y="342" text-anchor="middle" class="note">→ LibreOffice/Collabora 최종 교정 → 배포</text>

    <rect x="40" y="380" width="300" height="200" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
    <text x="190" y="410" text-anchor="middle" class="badge">✅ 장점</text>
    <text x="60" y="438" class="note">• 재현가능 문서</text>
    <text x="60" y="460" class="note">  (데이터 변경→자동 갱신)</text>
    <text x="60" y="482" class="note">• 다중 포맷 동시 산출</text>
    <text x="60" y="504" class="note">• 코드/텍스트 통합 관리</text>
    <text x="60" y="526" class="note">• Git 협업 완벽</text>
    <text x="60" y="548" class="note">• 오픈 표준 (ODF/PDF)</text>
    <text x="60" y="570" class="note">• 온프레미스 가능</text>

    <rect x="380" y="380" width="300" height="200" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="530" y="410" text-anchor="middle" class="badge">⚠️ 주의/한계</text>
    <text x="400" y="438" class="note">• ODT↔텍스트 왕복 제한</text>
    <text x="400" y="460" class="note">• 복잡한 도형 수동 조정</text>
    <text x="400" y="482" class="note">• 템플릿 관리 필요</text>
    <text x="400" y="504" class="note">• 외부 ODT 입력은</text>
    <text x="400" y="526" class="note">  LO headless 변환 권장</text>
    <text x="400" y="548" class="note">• 조직 스타일 합의 필요</text>
    <text x="400" y="570" class="note">• 학습 곡선 존재</text>

    <rect x="40" y="600" width="640" height="200" rx="10" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
    <text x="360" y="630" text-anchor="middle" class="badge">📚 실사례</text>
    <text x="60" y="658" class="note" font-weight="600">학술·연구:</text>
    <text x="80" y="680" class="note">NASA 기술 보고서, 박사 학위논문, arXiv 20만+ 논문/년</text>
    <text x="60" y="708" class="note" font-weight="600">기업·실무:</text>
    <text x="80" y="730" class="note">Netflix 데이터 리포트, 기술 블로그, API 문서 자동 생성</text>
    <text x="60" y="758" class="note" font-weight="600">출판:</text>
    <text x="80" y="780" class="note">"R for Data Science"(Hadley Wickham), Python Data Science Handbook</text>
  </g>

  <!-- Bottom: Example CLI pipeline -->
  <g transform="translate(80,1050)">
    <rect x="0" y="0" width="1840" height="200" rx="14" fill="#111827" filter="url(#shadow)"/>
    <text x="20" y="38" class="legend" fill="#93c5fd">💻 예시: 한 번에 여러 포맷 생성</text>

    <text x="20" y="72" class="pill" fill="#fbbf24"># Quarto로 다중 출력</text>
    <text x="20" y="96" class="pill" fill="#e5e7eb">quarto render report.qmd --to html,pdf,docx</text>

    <text x="20" y="130" class="pill" fill="#fbbf24"># Pandoc으로 직접 변환</text>
    <text x="20" y="154" class="pill" fill="#e5e7eb">pandoc report.md --citeproc --reference-doc=ref.docx -o report.docx</text>
    <text x="20" y="178" class="pill" fill="#e5e7eb">pandoc report.md --template=template.tex --pdf-engine=xelatex -o report.pdf</text>
  </g>

  <!-- Footer notes -->
  <text x="1000" y="1290" text-anchor="middle" class="note">💡 Tip: 외부 ODT를 텍스트화하려면 `libreoffice --headless --convert-to docx file.odt` → Pandoc 입력</text>
  <text x="1000" y="1314" text-anchor="middle" class="note">💡 Tip: 기관 규격은 reference.docx/odt 템플릿으로 일괄 적용 · 인용은 CSL(APA/MLA/IEEE 등) 사용</text>
  <text x="1000" y="1338" text-anchor="middle" class="note">💡 Tip: 협업은 Git(코드/텍스트) + Collabora(최종 문서) 조합 권장</text>
  <text x="1000" y="1362" text-anchor="middle" class="note">📚 참조: pandoc.org · quarto.org · rmarkdown.rstudio.com · collaboraonline.com · jupyterbook.org</text>
</svg>
