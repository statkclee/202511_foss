<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000">
  <defs>
    <!-- Text style classes -->
    <style>
      .large-title { font-size: 48px; font-weight: bold; }
      .medium-title { font-size: 36px; font-weight: bold; }
      .philosophy-text { font-size: 60px; font-weight: bold; }
      .sub-philosophy { font-size: 24px; }
      .prompt-text { font-size: 32px; font-weight: bold; }
      .code-text { font-size: 24px; }
      .language-text { font-size: 28px; font-weight: bold; }
      .time-text { font-size: 36px; font-weight: bold; }
      .center-spiral-text { font-size: 20px; font-weight: bold; }
    </style>
    
    <!-- Radial gradients for explosive expansion -->
    <radialGradient id="coreExplosion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#1e40af;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="neuralExpansion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#10b981;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#047857;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="universeExpansion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0" />
      <stop offset="40%" style="stop-color:#f59e0b;stop-opacity:0" />
      <stop offset="60%" style="stop-color:#f59e0b;stop-opacity:0.3" />
      <stop offset="80%" style="stop-color:#d97706;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#92400e;stop-opacity:0.8" />
    </radialGradient>
    
    <radialGradient id="blackHole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1f2937;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
    
    <!-- Glow effects -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Energy wave pattern -->
    <pattern id="energyWave" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="50" cy="50" r="30" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
      <circle cx="50" cy="50" r="20" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
      <circle cx="50" cy="50" r="10" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Deep space background -->
  <rect width="2000" height="2000" fill="url(#blackHole)"/>
  
  <!-- Stars in background -->
  <g opacity="0.6">
    <circle cx="200" cy="300" r="2" fill="#ffffff"/>
    <circle cx="1800" cy="400" r="1.5" fill="#ffffff"/>
    <circle cx="300" cy="1700" r="1" fill="#ffffff"/>
    <circle cx="1600" cy="200" r="2.5" fill="#ffffff"/>
    <circle cx="100" cy="1200" r="1" fill="#ffffff"/>
    <circle cx="1900" cy="800" r="1.5" fill="#ffffff"/>
    <circle cx="400" cy="100" r="1" fill="#ffffff"/>
    <circle cx="1500" cy="1800" r="2" fill="#ffffff"/>
    <circle cx="800" cy="50" r="1" fill="#ffffff"/>
    <circle cx="1200" cy="1900" r="1.5" fill="#ffffff"/>
  </g>
  
  <!-- Software 3.0 Universe (Outermost layer) -->
  <circle cx="1000" cy="1000" r="900" fill="url(#universeExpansion)" opacity="0.8"/>
  
  <!-- Natural Language Particles scattered across universe -->
  <g opacity="0.7">
    <!-- Prompt particles -->
    <g font-family="Arial, sans-serif" class="prompt-text" fill="#fbbf24" filter="url(#glow)">
      <text x="200" y="600" transform="rotate(-20 200 600)">"Create app"</text>
      <text x="1450" y="400" transform="rotate(15 1600 400)">"Generate code"</text>
      <text x="300" y="1400" transform="rotate(-30 300 1400)">"Design UI"</text>
      <text x="1450" y="1700" transform="rotate(25 1700 1600)">"Build website"</text>
      <text x="250" y="1000" transform="rotate(-45 150 1000)">"Analyze data"</text>
      <text x="1650" y="1300" transform="rotate(35 1850 1200)">"Write docs"</text>
    </g>
    
    <!-- Floating AI symbols -->
    <g fill="#f59e0b" opacity="0.6">
      <circle cx="400" cy="800" r="8"/>
      <text x="400" y="808" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">AI</text>
      
      <circle cx="1600" cy="800" r="8"/>
      <text x="1600" y="808" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">AI</text>
      
      <circle cx="800" cy="400" r="8"/>
      <text x="800" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">AI</text>
      
      <circle cx="1200" cy="1600" r="8"/>
      <text x="1200" y="1608" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">AI</text>
    </g>
  </g>
  
  <!-- Software 2.0 Neural Nebula (Middle layer) -->
  <circle cx="1000" cy="1000" r="600" fill="url(#neuralExpansion)" opacity="0.9"/>
  
  <!-- Neural network constellation -->
  <g opacity="0.8">
    <!-- Neural nodes arranged in galaxy spiral -->
    <g fill="#10b981" filter="url(#glow)">
      <!-- Layer 1 - Inner spiral -->
      <circle cx="900" cy="900" r="12"/>
      <circle cx="1100" cy="900" r="12"/>
      <circle cx="1100" cy="1100" r="12"/>
      <circle cx="900" cy="1100" r="12"/>
      
      <!-- Layer 2 - Middle spiral -->
      <circle cx="750" cy="750" r="10"/>
      <circle cx="1000" cy="700" r="10"/>
      <circle cx="1250" cy="750" r="10"/>
      <circle cx="1300" cy="1000" r="10"/>
      <circle cx="1250" cy="1250" r="10"/>
      <circle cx="1000" cy="1300" r="10"/>
      <circle cx="750" cy="1250" r="10"/>
      <circle cx="700" cy="1000" r="10"/>
      
      <!-- Layer 3 - Outer spiral -->
      <circle cx="600" cy="600" r="8"/>
      <circle cx="800" cy="550" r="8"/>
      <circle cx="1000" cy="500" r="8"/>
      <circle cx="1200" cy="550" r="8"/>
      <circle cx="1400" cy="600" r="8"/>
      <circle cx="1450" cy="800" r="8"/>
      <circle cx="1500" cy="1000" r="8"/>
      <circle cx="1450" cy="1200" r="8"/>
      <circle cx="1400" cy="1400" r="8"/>
      <circle cx="1200" cy="1450" r="8"/>
      <circle cx="1000" cy="1500" r="8"/>
      <circle cx="800" cy="1450" r="8"/>
      <circle cx="600" cy="1400" r="8"/>
      <circle cx="550" cy="1200" r="8"/>
      <circle cx="500" cy="1000" r="8"/>
      <circle cx="550" cy="800" r="8"/>
    </g>
    
    <!-- Neural connections - spiral pattern -->
    <g stroke="#10b981" stroke-width="3" fill="none" opacity="0.6" filter="url(#glow)">
      <!-- Curved connections creating spiral energy flow -->
      <path d="M 900 900 Q 1000 800 1100 900"/>
      <path d="M 1100 900 Q 1200 1000 1100 1100"/>
      <path d="M 1100 1100 Q 1000 1200 900 1100"/>
      <path d="M 900 1100 Q 800 1000 900 900"/>
      
      <!-- Expanding connections -->
      <path d="M 750 750 Q 900 850 1000 700"/>
      <path d="M 1250 750 Q 1150 850 1300 1000"/>
      <path d="M 1250 1250 Q 1150 1150 1000 1300"/>
      <path d="M 750 1250 Q 850 1150 700 1000"/>
    </g>
    
    <!-- Data flow particles -->
    <g fill="#34d399" opacity="0.7">
      <circle cx="850" cy="850" r="3"/>
      <circle cx="1150" cy="850" r="3"/>
      <circle cx="1150" cy="1150" r="3"/>
      <circle cx="850" cy="1150" r="3"/>
      <circle cx="950" cy="950" r="2"/>
      <circle cx="1050" cy="950" r="2"/>
      <circle cx="1050" cy="1050" r="2"/>
      <circle cx="950" cy="1050" r="2"/>
    </g>
  </g>
  
  <!-- Software 1.0 Core (Center) -->
  <circle cx="1000" cy="1000" r="300" fill="url(#coreExplosion)" filter="url(#strongGlow)"/>
  
  <!-- Code fragments orbiting the core -->
  <g opacity="0.9">
    <!-- Orbital paths -->
    <circle cx="1000" cy="1000" r="200" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3" stroke-dasharray="10,5"/>
    <circle cx="1000" cy="1000" r="250" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2" stroke-dasharray="15,10"/>
    
    <!-- Code blocks in orbit -->
    <g font-family="monospace" class="code-text" fill="#ffffff" filter="url(#glow)">
      <text x="1200" y="1000" text-anchor="middle">if (condition)</text>
      <text x="1000" y="750" text-anchor="middle">function()</text>
      <text x="800" y="1000" text-anchor="middle">for (i=0; i&lt;n; i++)</text>
      <text x="1000" y="1250" text-anchor="middle">class Object</text>
    </g>
    
    <!-- Programming language symbols -->
    <g fill="#60a5fa" font-family="Arial, sans-serif" class="language-text" opacity="0.8">
      <text x="1120" y="880" text-anchor="middle">C++</text>
      <text x="1120" y="1120" text-anchor="middle">Java</text>
      <text x="860" y="860" text-anchor="middle">Python</text>
      <text x="880" y="1120" text-anchor="middle">JS</text>
    </g>
  </g>
  
  <!-- Central Philosophy Labels -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <!-- HOW at center -->
    <text x="1000" y="930" class="philosophy-text" fill="#ffffff" filter="url(#strongGlow)">"HOW"</text>
    <text x="1000" y="870" class="sub-philosophy" fill="#e2e8f0">어떻게 할지</text>
    
    <!-- WHAT in middle ring -->
    <text x="900" y="475" class="medium-title" fill="#10b981" filter="url(#glow)" transform="rotate(-90 1000 400)">"WHAT"</text>
    <text x="1600" y="1050" class="medium-title" fill="#10b981" filter="url(#glow)">"WHAT"</text>
    <text x="1000" y="1650" class="medium-title" fill="#10b981" filter="url(#glow)" transform="rotate(90 1000 1600)">"WHAT"</text>
    <text x="400" y="975" class="medium-title" fill="#10b981" filter="url(#glow)" transform="rotate(180 400 1000)">"WHAT"</text>
    
    <!-- WANT in outer ring -->
    <text x="1000" y="200" class="large-title" fill="#f59e0b" filter="url(#glow)" transform="rotate(-45 1000 200)">"WANT"</text>
    <text x="1800" y="1000" class="large-title" fill="#f59e0b" filter="url(#glow)" transform="rotate(45 1800 1000)">"WANT"</text>
    <text x="1000" y="1800" class="large-title" fill="#f59e0b" filter="url(#glow)" transform="rotate(135 1000 1800)">"WANT"</text>
    <text x="200" y="1000" class="large-title" fill="#f59e0b" filter="url(#glow)" transform="rotate(-135 200 1000)">"WANT"</text>
  </g>
  
  <!-- Time markers as celestial bodies -->
  <g font-family="Arial, sans-serif" class="time-text">
    <!-- 1950s marker -->
    <circle cx="1000" cy="1000" r="15" fill="#ffffff" opacity="0.9"/>
    <text x="1000" y="1080" text-anchor="middle" fill="#ffffff">1950s~</text>
    
    <!-- 2010s marker -->
    <circle cx="1000" cy="400" r="12" fill="#10b981" opacity="0.8"/>
    <text x="1000" y="380" text-anchor="middle" fill="#10b981">2010s~</text>
    
    <!-- 2020s marker -->
    <circle cx="1000" cy="100" r="10" fill="#f59e0b" opacity="0.8"/>
    <text x="1000" y="80" text-anchor="middle" fill="#f59e0b">2020s~</text>
  </g>
  
  <!-- Title at the top -->
  <text x="1000" y="1200" text-anchor="middle" font-family="Arial, sans-serif" class="large-title" fill="#ffffff" filter="url(#glow)">
    Software eating Software
  </text>
  
  <!-- "Software eating Software" spiral in center overlay -->
  <g transform="translate(1000, 1000)">
    <!-- Semi-transparent overlay circle -->
    <circle cx="0" cy="0" r="120" fill="url(#blackHole)" opacity="0.4"/>
    
    <!-- Multiple spiral layers showing recursive nature -->
    <path d="M -80 0 Q 0 -80 80 0 Q 0 80 -60 0 Q 0 -60 60 0 Q 0 60 -40 0 Q 0 -40 40 0 Q 0 40 -20 0 Q 0 -20 20 0" 
          stroke="#ffffff" stroke-width="3" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M -60 0 Q 0 -60 60 0 Q 0 60 -40 0 Q 0 -40 40 0 Q 0 40 -20 0 Q 0 -20 20 0" 
          stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M -40 0 Q 0 -40 40 0 Q 0 40 -20 0 Q 0 -20 20 0" 
          stroke="#10b981" stroke-width="2" fill="none" opacity="0.6"/>
    
    <!-- Central text -->
    <!-- <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" class="center-spiral-text" fill="#ffffff">
      Software
    </text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" class="center-spiral-text" fill="#ffffff">
      eating
    </text>
    <text x="0" y="40" text-anchor="middle" font-family="Arial, sans-serif" class="center-spiral-text" fill="#ffffff">
      Software
    </text> -->
    
    <!-- Arrows showing the recursive flow -->
    <path d="M 30 -30 L 40 -20 L 30 -10" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 30 30 L 20 40 L 10 30" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M -30 30 L -40 20 L -30 10" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M -30 -30 L -20 -40 L -10 -30" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
  </g>
  
  <!-- Bottom explanatory text -->
  <text x="1000" y="1950" text-anchor="middle" font-family="Arial, sans-serif" class="sub-philosophy" fill="#ffffff" opacity="0.8">
    각 단계가 이전 단계를 포함하며 재귀적으로 발전 - Karpathy의 "Software eating Software"
  </text>
  
  <!-- Energy burst lines radiating from center -->
  <g opacity="0.4">
    <line x1="1000" y1="1000" x2="1500" y2="500" stroke="#ffffff" stroke-width="3"/>
    <line x1="1000" y1="1000" x2="500" y2="500" stroke="#ffffff" stroke-width="3"/>
    <line x1="1000" y1="1000" x2="500" y2="1500" stroke="#ffffff" stroke-width="3"/>
    <line x1="1000" y1="1000" x2="1500" y2="1500" stroke="#ffffff" stroke-width="3"/>
    <line x1="1000" y1="1000" x2="1000" y2="200" stroke="#ffffff" stroke-width="2"/>
    <line x1="1000" y1="1000" x2="1000" y2="1800" stroke="#ffffff" stroke-width="2"/>
    <line x1="1000" y1="1000" x2="200" y2="1000" stroke="#ffffff" stroke-width="2"/>
    <line x1="1000" y1="1000" x2="1800" y2="1000" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>