<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="500" viewBox="0 0 1400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 그라디언트 정의 -->
    <linearGradient id="ellmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="generationGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="quartoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#2ECC71;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="processingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:0.9"/>
    </linearGradient>
    
    <!-- 필터 효과 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <!-- 화살표 마커 -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="1400" height="500" fill="#f8fafc"/>
  
  <!-- 제목 -->
  <text x="700" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">ellmer-쿼토 통합 AI 글쓰기 작업흐름</text>

  <!-- ellmer 시작 노드 -->
  <g transform="translate(80,250)">
    <rect x="-50" y="-30" width="100" height="60" rx="10" fill="url(#ellmerGrad)" filter="url(#glow)"/>
    <text x="0" y="-8" text-anchor="middle" font-size="13" fill="white" font-weight="bold">ellmer</text>
    <text x="0" y="8" text-anchor="middle" font-size="11" fill="white">(R에서 LLM 활용)</text>
  </g>

  <!-- LLM 기반 생성 섹션 -->
  <rect x="180" y="80" width="340" height="340" rx="12" fill="url(#generationGrad)" opacity="0.08" filter="url(#shadow)"/>
  <text x="350" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#8E44AD">LLM 기반 생성</text>
  
  <!-- 자연어 프롬프트 -->
  <g transform="translate(220,160)">
    <rect x="-45" y="-25" width="90" height="50" rx="8" fill="#9B59B6" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" font-size="11" fill="white" font-weight="bold">자연어</text>
    <text x="0" y="8" text-anchor="middle" font-size="10" fill="white">프롬프트</text>
  </g>
  
  <!-- 생성 결과들 -->
  <g transform="translate(220,260)">
    <rect x="-30" y="-15" width="60" height="30" rx="6" fill="#8E44AD"/>
    <text x="0" y="2" text-anchor="middle" font-size="10" fill="white">표 생성</text>
  </g>
  
  <g transform="translate(320,240)">
    <rect x="-35" y="-15" width="70" height="30" rx="6" fill="#8E44AD"/>
    <text x="0" y="2" text-anchor="middle" font-size="10" fill="white">그래프 생성</text>
  </g>
  
  <g transform="translate(420,260)">
    <rect x="-40" y="-15" width="80" height="30" rx="6" fill="#8E44AD"/>
    <text x="0" y="-3" text-anchor="middle" font-size="9" fill="white">R/Python/SQL</text>
    <text x="0" y="8" text-anchor="middle" font-size="9" fill="white">코드 생성</text>
  </g>
  
  <g transform="translate(320,300)">
    <rect x="-35" y="-15" width="70" height="30" rx="6" fill="#8E44AD"/>
    <text x="0" y="2" text-anchor="middle" font-size="10" fill="white">텍스트 생성</text>
  </g>
  
  <g transform="translate(420,340)">
    <rect x="-30" y="-15" width="60" height="30" rx="6" fill="#8E44AD"/>
    <text x="0" y="2" text-anchor="middle" font-size="10" fill="white">분석 결과</text>
  </g>

  <!-- 프롬프트에서 결과들로 화살표 -->
  <line x1="265" y1="160" x2="190" y2="260" stroke="#9B59B6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="265" y1="160" x2="285" y2="240" stroke="#9B59B6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="265" y1="160" x2="380" y2="260" stroke="#9B59B6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="265" y1="160" x2="285" y2="300" stroke="#9B59B6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="265" y1="160" x2="390" y2="340" stroke="#9B59B6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Quarto 처리 엔진 -->
  <g transform="translate(600,250)">
    <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#quartoGrad)" filter="url(#glow)"/>
    <text x="0" y="-8" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Quarto</text>
    <text x="0" y="8" text-anchor="middle" font-size="11" fill="white">처리 엔진</text>
  </g>

  <!-- Quarto 문서 처리 섹션 -->
  <rect x="700" y="80" width="320" height="340" rx="12" fill="url(#processingGrad)" opacity="0.08" filter="url(#shadow)"/>
  <text x="860" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#E67E22">Quarto 문서 처리</text>
  
  <!-- 처리 단계들 -->
  <g transform="translate(760,180)">
    <rect x="-35" y="-20" width="70" height="40" rx="8" fill="#F39C12" filter="url(#shadow)"/>
    <text x="0" y="-3" text-anchor="middle" font-size="11" fill="white" font-weight="bold">코드 실행</text>
  </g>
  
  <g transform="translate(860,240)">
    <rect x="-35" y="-20" width="70" height="40" rx="8" fill="#E67E22"/>
    <text x="0" y="-3" text-anchor="middle" font-size="11" fill="white" font-weight="bold">결과 검증</text>
  </g>
  
  <g transform="translate(760,300)">
    <rect x="-40" y="-20" width="80" height="40" rx="8" fill="#D35400"/>
    <text x="0" y="-6" text-anchor="middle" font-size="10" fill="white">Git 버전</text>
    <text x="0" y="6" text-anchor="middle" font-size="10" fill="white">관리</text>
  </g>
  
  <g transform="translate(960,360)">
    <rect x="-40" y="-20" width="80" height="40" rx="8" fill="#A0522D"/>
    <text x="0" y="-6" text-anchor="middle" font-size="10" fill="white">재현성</text>
    <text x="0" y="6" text-anchor="middle" font-size="10" fill="white">보장</text>
  </g>

  <!-- 처리 단계 연결 -->
  <line x1="795" y1="180" x2="825" y2="240" stroke="#F39C12" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825" y1="240" x2="795" y2="300" stroke="#E67E22" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="300" x2="920" y2="360" stroke="#D35400" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 다형태 출력 섹션 -->
  <rect x="1070" y="120" width="280" height="260" rx="12" fill="url(#outputGrad)" opacity="0.08" filter="url(#shadow)"/>
  <text x="1210" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#C0392B">다형태 출력</text>
  
  <!-- 출력 형식들 -->
  <g transform="translate(1130,200)">
    <rect x="-35" y="-20" width="70" height="40" rx="8" fill="#E74C3C" filter="url(#shadow)"/>
    <text x="0" y="-3" text-anchor="middle" font-size="11" fill="white" font-weight="bold">웹사이트</text>
  </g>
  
  <g transform="translate(1270,200)">
    <rect x="-35" y="-20" width="70" height="40" rx="8" fill="#C0392B"/>
    <text x="0" y="-3" text-anchor="middle" font-size="11" fill="white" font-weight="bold">PDF 문서</text>
  </g>
  
  <g transform="translate(1130,280)">
    <rect x="-40" y="-20" width="80" height="40" rx="8" fill="#922B21"/>
    <text x="0" y="-3" text-anchor="middle" font-size="11" fill="white" font-weight="bold">대시보드</text>
  </g>
  
  <g transform="translate(1270,280)">
    <rect x="-45" y="-20" width="90" height="40" rx="8" fill="#7B241C"/>
    <text x="0" y="-3" text-anchor="middle" font-size="11" fill="white" font-weight="bold">프레젠테이션</text>
  </g>

  <!-- 주요 연결 화살표 -->
  <line x1="130" y1="250" x2="175" y2="250" stroke="#3498DB" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="525" y1="250" x2="540" y2="250" stroke="#9B59B6" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="660" y1="250" x2="695" y2="250" stroke="#27AE60" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- 재현성 보장에서 각 출력으로 -->
  <line x1="1000" y1="360" x2="1090" y2="200" stroke="#A0522D" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="360" x2="1230" y2="200" stroke="#A0522D" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="360" x2="1090" y2="280" stroke="#A0522D" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="360" x2="1225" y2="280" stroke="#A0522D" stroke-width="2" marker-end="url(#arrow)"/>

</svg>