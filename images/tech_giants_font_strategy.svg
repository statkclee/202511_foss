<svg viewBox="0 100 1000 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa"/>
  
  <!-- Timeline axis -->
  <line x1="80" y1="500" x2="920" y2="500" stroke="#34495e" stroke-width="3"/>
  
  <!-- Year markers -->
  <text x="80" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">1996</text>
  <text x="250" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">2004</text>
  <text x="420" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">2008</text>
  <text x="590" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">2014</text>
  <text x="760" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">2017</text>
  <text x="920" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">2020</text>
  
  <!-- Microsoft 1996 -->
  <circle cx="80" cy="500" r="8" fill="#0078d4"/>
  <rect x="30" y="420" width="100" height="60" rx="10" fill="#e3f2fd" stroke="#0078d4" stroke-width="2"/>
  <text x="80" y="440" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0078d4">Microsoft</text>
  <text x="80" y="455" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Core Fonts</text>
  <text x="80" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">웹 표준화</text>
  <line x1="80" y1="480" x2="80" y2="492" stroke="#0078d4" stroke-width="2"/>
  
  <!-- Microsoft Consolas 2004 -->
  <circle cx="250" cy="500" r="8" fill="#0078d4"/>
  <rect x="200" y="350" width="100" height="60" rx="10" fill="#e3f2fd" stroke="#0078d4" stroke-width="2"/>
  <text x="250" y="370" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0078d4">MS Consolas</text>
  <text x="250" y="385" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">ClearType</text>
  <text x="250" y="400" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">개발자 타겟</text>
  <line x1="250" y1="410" x2="250" y2="492" stroke="#0078d4" stroke-width="2"/>
  
  <!-- Naver 2008 -->
  <circle cx="420" cy="500" r="8" fill="#03c75a"/>
  <rect x="370" y="420" width="100" height="60" rx="10" fill="#e8f5e8" stroke="#03c75a" stroke-width="2"/>
  <text x="420" y="440" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#03c75a">네이버</text>
  <text x="420" y="455" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">나눔글꼴</text>
  <text x="420" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">한글 생태계</text>
  <line x1="420" y1="480" x2="420" y2="492" stroke="#03c75a" stroke-width="2"/>
  
  <!-- Google 2014 -->
  <circle cx="590" cy="500" r="8" fill="#4285f4"/>
  <rect x="540" y="350" width="100" height="60" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="590" y="370" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4285f4">Google</text>
  <text x="590" y="385" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Noto "No Tofu"</text>
  <text x="590" y="400" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">800개 언어</text>
  <line x1="590" y1="410" x2="590" y2="492" stroke="#4285f4" stroke-width="2"/>
  
  <!-- Apple 2015 (offset slightly) -->
  <circle cx="680" cy="500" r="8" fill="#007aff"/>
  <rect x="630" y="280" width="100" height="60" rx="10" fill="#e6f3ff" stroke="#007aff" stroke-width="2"/>
  <text x="680" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#007aff">Apple</text>
  <text x="680" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">San Francisco</text>
  <text x="680" y="330" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">제한적 무료</text>
  <line x1="680" y1="340" x2="680" y2="492" stroke="#007aff" stroke-width="2"/>
  
  <!-- IBM 2017 -->
  <circle cx="760" cy="500" r="8" fill="#1261a0"/>
  <rect x="710" y="420" width="100" height="60" rx="10" fill="#e6f1ff" stroke="#1261a0" stroke-width="2"/>
  <text x="760" y="440" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1261a0">IBM</text>
  <text x="760" y="455" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">IBM Plex</text>
  <text x="760" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">완전 오픈소스</text>
  <line x1="760" y1="480" x2="760" y2="492" stroke="#1261a0" stroke-width="2"/>
  
  <!-- JetBrains 2020 -->
  <circle cx="920" cy="500" r="8" fill="#ff6b35"/>
  <rect x="870" y="350" width="100" height="60" rx="10" fill="#fff2e6" stroke="#ff6b35" stroke-width="2"/>
  <text x="920" y="370" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ff6b35">JetBrains</text>
  <text x="920" y="385" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">JetBrains Mono</text>
  <text x="920" y="400" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">IDE 최적화</text>
  <line x1="920" y1="410" x2="920" y2="492" stroke="#ff6b35" stroke-width="2"/>
  
  <!-- Strategy arrows and labels -->
  <g transform="translate(0,150)">
    <path d="M 100 150 Q 300 100 500 150" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <text x="300" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">생태계 장악 전략</text>
  </g>

  <g transform="translate(0,50)">
    <path d="M 600 200 Q 750 150 850 200" stroke="#27ae60" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
    <text x="725" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">개발자 포섭</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <g transform="translate(0,50)">
    <rect x="50" y="80" width="350" height="100" rx="5" fill="white" stroke="#bdc3c7" stroke-width="1"/>
    <text x="225" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">전략적 목표</text>
    
    <circle cx="70" cy="125" r="6" fill="#e74c3c"/>
    <text x="85" y="130" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">플랫폼 표준화 · 사용자 종속</text>
    
    <circle cx="70" cy="145" r="6" fill="#27ae60"/>
    <text x="85" y="150" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">개발자 커뮤니티 포섭</text>
    
    <circle cx="70" cy="165" r="6" fill="#3498db"/>
    <text x="85" y="170" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">브랜드 강화 · 라이선스 비용 절감</text>
  </g>
</svg>