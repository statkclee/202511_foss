<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="30 0 1120 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .stage-text { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 18px; font-weight: 600; fill: #34495e; }
      .desc-text-middle { font-family: 'Noto Sans KR', sans-serif; font-size: 17px; fill: #7f8c8d; }
      .desc-text { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; fill: #7f8c8d; }
      .process-box { fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 2; }
      .arrow { fill: #3498db; }
      .paper { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1.5; }
      .ink { fill: #2c3e50; }
      .print-machine { fill: #95a5a6; stroke: #7f8c8d; stroke-width: 2; }
    </style>
    
    <!-- 화살표 마커 정의 -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
  </defs>

  <!-- 1단계: 저자 원고 --> 
  <g id="stage1"  transform="translate(30,0)">
    <rect x="50" y="60" width="180" height="140" rx="10" class="process-box"/>
    <text x="140" y="88" text-anchor="middle" class="stage-text">1. Author's Manuscript</text>

    <!-- 원고 아이콘 (확대) -->
    <rect x="75" y="105" width="100" height="75" rx="4" class="paper"/>
    <line x1="85" y1="122" x2="165" y2="122" stroke="#2c3e50" stroke-width="1.5"/>
    <line x1="85" y1="135" x2="155" y2="135" stroke="#2c3e50" stroke-width="1.5"/>
    <line x1="85" y1="148" x2="160" y2="148" stroke="#2c3e50" stroke-width="1.5"/>
    <line x1="85" y1="161" x2="150" y2="161" stroke="#2c3e50" stroke-width="1.5"/>
    <line x1="85" y1="174" x2="158" y2="174" stroke="#2c3e50" stroke-width="1.5"/>

    <!-- 펜 (확대) -->
    <g transform="translate(150, 120) scale(2)">
<path d="M18.344 4.781l-3.406 3.063s1.125 0.688 2.156 1.656c1 0.969 1.719 2.063 1.719 2.063l2.906-3.469s-0.031-0.625-1.406-1.969c-1.406-1.344-1.969-1.344-1.969-1.344zM7.25 21.938l-0.156 1.5 10.813-11.25s-0.719-1-1.594-1.844c-0.906-0.875-1.938-1.563-1.938-1.563l-10.813 11.25 1.688-0.094 0.188 1.813zM0 26.719l2.688-5.5 1.5-0.125 0.125 1.719 1.813 0.25-0.188 1.375-5.438 2.75z"/>
    </g>

    <text x="140" y="222" text-anchor="middle" class="desc-text-middle">Written with pen and ink</text>
  </g>

  <!-- 화살표 1 -->
  <line x1="270" y1="130" x2="350" y2="130" stroke="#3498db" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- 2단계: 식자 작업 -->
  <g id="stage2"  transform="translate(70,0)">
    <rect x="290" y="60" width="180" height="140" rx="10" class="process-box"/>
    <text x="380" y="88" text-anchor="middle" class="stage-text">2. Typesetting Work</text>

    <!-- 활자 상자들 (확대) -->
    <g transform="translate(100, 30) scale(0.7)">
      <rect x="310" y="105" width="28" height="22" fill="#8b4513" stroke="#654321" stroke-width="1"/>
      <rect x="343" y="105" width="28" height="22" fill="#8b4513" stroke="#654321" stroke-width="1"/>
      <rect x="376" y="105" width="28" height="22" fill="#8b4513" stroke="#654321" stroke-width="1"/>
      <rect x="409" y="105" width="28" height="22" fill="#8b4513" stroke="#654321" stroke-width="1"/>
      <rect x="310" y="132" width="28" height="22" fill="#8b4513" stroke="#654321" stroke-width="1"/>
      <rect x="343" y="132" width="28" height="22" fill="#8b4513" stroke="#654321" stroke-width="1"/>
      <rect x="376" y="132" width="28" height="22" fill="#8b4513" stroke="#654321" stroke-width="1"/>
      <rect x="409" y="132" width="28" height="22" fill="#8b4513" stroke="#654321" stroke-width="1"/>
    </g>

  <g transform="translate(310, 145) scale(1.5)">
    <path d="M11.447,8.105C11.786,7.428,12.479,7,13.236,7H17v7h-0.764c-0.758,0-1.45-0.428-1.789-1.106
