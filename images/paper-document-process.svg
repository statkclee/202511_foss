  </g>

    <!-- 조판된 페이지 (확대) -->
    <g transform="translate(60, -20) scale(0.95)">
      <rect x="325" y="162" width="90" height="65" rx="4" class="paper"/>
      <rect x="332" y="170" width="76" height="4" fill="#2c3e50"/>
      <rect x="332" y="179" width="76" height="4" fill="#2c3e50"/>
      <rect x="332" y="188" width="76" height="4" fill="#2c3e50"/>
      <rect x="332" y="197" width="76" height="4" fill="#2c3e50"/>
      <rect x="332" y="206" width="76" height="4" fill="#2c3e50"/>
      <rect x="332" y="215" width="76" height="4" fill="#2c3e50"/>
    </g>

    <text x="380" y="222" text-anchor="middle" class="desc-text-middle">Movable type composition</text>
  </g>

  <!-- 화살표 2 -->
  <line x1="550" y1="130" x2="620" y2="130" stroke="#3498db" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- 3단계: 인쇄 -->
  <g id="stage3"  transform="translate(100,0)">
    <rect x="530" y="60" width="180" height="140" rx="10" class="process-box"/>
    <text x="620" y="88" text-anchor="middle" class="stage-text">3. Printing Process</text>

    <g transform="translate(570, 95) scale(0.2)">
      <path d="M447.292,165.3h-13.844v-38.659c0-22.297-18.14-40.437-40.436-40.437h-7.004V28.066c0-2.348-1.903-4.25-4.25-4.25H105.971
