      <path d="M212.964,410.559h-55.747c-2.347,0-4.25,1.903-4.25,4.25c0,2.348,1.903,4.25,4.25,4.25h55.747
        c2.347,0,4.25-1.902,4.25-4.25C217.214,412.462,215.311,410.559,212.964,410.559z"/>
    </g>

    <text x="620" y="222" text-anchor="middle" class="desc-text-middle">Mass reproduction</text>
  </g>

  <!-- 화살표 3 -->
  <line x1="820" y1="130" x2="890" y2="130" stroke="#3498db" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- 4단계: 완성된 책 -->
  <g id="stage4" transform="translate(130,0)">
    <rect x="770" y="60" width="180" height="140" rx="10" class="process-box"/>
    <text x="860" y="88" text-anchor="middle" class="stage-text">4. Finished Book</text>

    <!-- 책들 (확대) -->
    <g id="books" transform="translate(10,-5)">
      <rect x="785" y="110" width="22" height="68" fill="#8b4513" stroke="#654321" stroke-width="1.5"/>
      <rect x="812" y="110" width="22" height="68" fill="#2980b9" stroke="#1f4e79" stroke-width="1.5"/>
      <rect x="839" y="110" width="22" height="68" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
      <rect x="866" y="110" width="22" height="68" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
      <rect x="893" y="110" width="22" height="68" fill="#9b59b6" stroke="#7d3c98" stroke-width="1.5"/>
      <!-- 책등 디테일 -->
      <line x1="796" y1="115" x2="796" y2="173" stroke="#654321" stroke-width="1"/>
      <line x1="823" y1="115" x2="823" y2="173" stroke="#1f4e79" stroke-width="1"/>
      <line x1="850" y1="115" x2="850" y2="173" stroke="#1e8449" stroke-width="1"/>
      <line x1="877" y1="115" x2="877" y2="173" stroke="#c0392b" stroke-width="1"/>
      <line x1="904" y1="115" x2="904" y2="173" stroke="#7d3c98" stroke-width="1"/>
    </g>

    <text x="860" y="195" text-anchor="middle" class="desc-text">Identical content</text>
    <text x="860" y="222" text-anchor="middle" class="desc-text-middle">Unmodifiable</text>
  </g>

  <!-- 특징 설명 박스들 -->
  <g id="characteristics">
    <!-- 일방향 정보 전달 -->
    <rect x="50" y="260" width="255" height="110" rx="8" fill="#e8f4fd" stroke="#3498db" stroke-width="2"/>
    <text x="177" y="285" text-anchor="middle" class="stage-text">One-way Information Transfer</text>
    <text x="65" y="312" class="desc-text">Author → Reader</text>
    <text x="65" y="334" class="desc-text">No reader feedback possible</text>
    <text x="65" y="356" class="desc-text">No interaction</text>

    <!-- 불변성 -->
    <rect x="325" y="260" width="255" height="110" rx="8" fill="#fdf2e8" stroke="#e67e22" stroke-width="2"/>
    <text x="452" y="285" text-anchor="middle" class="stage-text">Immutability</text>
    <text x="340" y="312" class="desc-text">Cannot modify after printing</text>
    <text x="340" y="334" class="desc-text">Must reprint if errors found</text>
    <text x="340" y="356" class="desc-text">Content permanently fixed</text>

    <!-- 물리적 제약 -->
    <rect x="600" y="260" width="255" height="110" rx="8" fill="#f4f8fd" stroke="#8e44ad" stroke-width="2"/>
    <text x="727" y="285" text-anchor="middle" class="stage-text">Physical Constraints</text>
    <text x="615" y="312" class="desc-text">Limitations of paper and ink</text>
    <text x="615" y="334" class="desc-text">Volume and weight</text>
    <text x="615" y="356" class="desc-text">Limited color expression</text>

    <!-- 선형적 읽기 -->
    <rect x="875" y="260" width="255" height="110" rx="8" fill="#eaf7f0" stroke="#27ae60" stroke-width="2"/>
    <text x="1002" y="285" text-anchor="middle" class="stage-text">Linear Reading</text>
    <text x="890" y="312" class="desc-text">From first page in order</text>
    <text x="890" y="334" class="desc-text">Difficult random access</text>
    <text x="890" y="356" class="desc-text">Cannot reorganize content</text>
  </g>

</svg>