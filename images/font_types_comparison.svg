<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 그라데이션 정의 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdfcff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f9f7ff;stop-opacity:1"/>
    </linearGradient>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:0.05"/>
    </linearGradient>

    <linearGradient id="desktopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1"/>
    </linearGradient>

    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dcfce7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bbf7d0;stop-opacity:1"/>
    </linearGradient>

    <linearGradient id="variableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1"/>
    </linearGradient>

    <linearGradient id="colorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf2f8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1"/>
    </linearGradient>

    <!-- 그림자 필터 -->
    <filter id="dropshadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <style>
    .main-title { font-family: 'Noto Sans KR', sans-serif; font-size: 28px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
    .subtitle { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; fill: #64748b; text-anchor: middle; }
    .box-title { font-family: 'Noto Sans KR', sans-serif; font-size: 18px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
    .box-subtitle { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; fill: #6b7280; text-anchor: middle; font-style: italic; }
    .feature-text { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; fill: #374151; text-anchor: start; line-height: 1.4; }
    .stat-text { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: bold; fill: #1e40af; text-anchor: middle; }
    .table-header { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: bold; fill: #374151; text-anchor: middle; }
    .table-cell { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; fill: #4b5563; text-anchor: middle; }
  </style>

  <!-- 배경 -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  
  <!-- 상단 제목 -->
  <rect x="100" y="20" width="1000" height="70" rx="15" fill="url(#headerGrad)" stroke="#6366f1" stroke-width="2" filter="url(#dropshadow)"/>
  <text x="600" y="50" class="main-title">디지털 글꼴의 4가지 형태</text>
  <text x="600" y="75" class="subtitle">2024년 기준 최신 글꼴 기술과 사용 현황</text>

  <!-- 설치형 글꼴 -->
  <rect x="50" y="120" width="260" height="200" rx="12" fill="url(#desktopGrad)" stroke="#2563eb" stroke-width="2" filter="url(#dropshadow)"/>
  <text x="180" y="145" class="box-title">설치형 글꼴</text>
  <text x="180" y="160" class="box-subtitle">Desktop/System Fonts</text>
  
  <text x="70" y="185" class="feature-text">💻 로컬 컴퓨터에 직접 설치</text>
  <text x="70" y="200" class="feature-text">⚡ 인터넷 연결 없이 빠른 실행</text>
  <text x="70" y="215" class="feature-text">🔧 수동 설치 및 관리 필요</text>
  <text x="70" y="230" class="feature-text">📱 OS별 기본 제공 (Arial, 나눔고딕)</text>
  <text x="70" y="245" class="feature-text">⚠️ 다른 시스템에서 호환성 문제</text>
  
  <rect x="70" y="265" width="200" height="35" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="170" y="280" class="stat-text">전통적 방식</text>
  <text x="170" y="295" class="stat-text">TTF, OTF 형식</text>

  <!-- 웹 글꼴 -->
  <rect x="330" y="120" width="260" height="200" rx="12" fill="url(#webGrad)" stroke="#059669" stroke-width="2" filter="url(#dropshadow)"/>
  <text x="460" y="145" class="box-title">웹 글꼴</text>
  <text x="460" y="160" class="box-subtitle">Web Fonts</text>
  
  <text x="350" y="185" class="feature-text">🌐 웹페이지 로드 시 다운로드</text>
  <text x="350" y="200" class="feature-text">📡 Google Fonts, 눈누 등 CDN</text>
  <text x="350" y="215" class="feature-text">✅ 모든 사용자에게 동일 표시</text>
  <text x="350" y="230" class="feature-text">🔄 자동 업데이트 및 관리</text>
  <text x="350" y="245" class="feature-text">📶 네트워크 연결 필수</text>
  
  <rect x="350" y="265" width="200" height="35" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1"/>
  <text x="450" y="280" class="stat-text">웹 사용률 87%</text>
  <text x="450" y="295" class="stat-text">WOFF2 형식 주도</text>

  <!-- 가변 글꼴 -->
  <rect x="610" y="120" width="260" height="200" rx="12" fill="url(#variableGrad)" stroke="#d97706" stroke-width="2" filter="url(#dropshadow)"/>
  <text x="740" y="145" class="box-title">가변 글꼴</text>
  <text x="740" y="160" class="box-subtitle">Variable Fonts</text>
  
  <text x="630" y="185" class="feature-text">🎛️ 하나의 파일로 다양한 스타일</text>
  <text x="630" y="200" class="feature-text">📏 굵기, 기울기, 폭 등 조절 가능</text>
  <text x="630" y="215" class="feature-text">💾 파일 크기 효율성 증대</text>
  <text x="630" y="230" class="feature-text">🎨 디자인 유연성 극대화</text>
  <text x="630" y="245" class="feature-text">📈 애니메이션 및 반응형 지원</text>
  
  <rect x="630" y="265" width="200" height="35" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="730" y="280" class="stat-text">웹 사용률 33%</text>
  <text x="730" y="295" class="stat-text">2024년 급성장</text>

  <!-- 컬러 글꼴 -->
  <rect x="890" y="120" width="260" height="200" rx="12" fill="url(#colorGrad)" stroke="#db2777" stroke-width="2" filter="url(#dropshadow)"/>
  <text x="1020" y="145" class="box-title">컬러 글꼴</text>
  <text x="1020" y="160" class="box-subtitle">Color Fonts</text>
  
  <text x="910" y="185" class="feature-text">🎨 다중 색상 및 그라데이션</text>
  <text x="910" y="200" class="feature-text">😀 이모지 및 아이콘 지원</text>
  <text x="910" y="215" class="feature-text">🖼️ SVG, COLR 형식 활용</text>
  <text x="910" y="230" class="feature-text">🎯 브랜딩 및 특수 용도</text>
  <text x="910" y="245" class="feature-text">🔬 아직 실험적 단계</text>
  
  <rect x="910" y="265" width="200" height="35" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="1"/>
  <text x="1010" y="280" class="stat-text">웹 사용률 0.05%</text>
  <text x="1010" y="295" class="stat-text">미래 기술</text>

  <!-- 비교 테이블 -->
  <rect x="100" y="360" width="1000" height="280" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2" filter="url(#dropshadow)"/>
  
  <text x="600" y="385" class="box-title">글꼴 형태별 특성 비교</text>
  
  <!-- 테이블 헤더 -->
  <rect x="120" y="400" width="960" height="30" rx="5" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="150" y="420" class="table-header">구분</text>
  <text x="300" y="420" class="table-header">설치형</text>
  <text x="500" y="420" class="table-header">웹 글꼴</text>
  <text x="700" y="420" class="table-header">가변 글꼴</text>
  <text x="900" y="420" class="table-header">컬러 글꼴</text>
  
  <!-- 설치 방법 -->
  <line x1="120" y1="430" x2="1080" y2="430" stroke="#e5e7eb" stroke-width="1"/>
  <text x="150" y="450" class="table-header">설치 방법</text>
  <text x="300" y="450" class="table-cell">수동 설치</text>
  <text x="500" y="450" class="table-cell">자동 다운로드</text>
  <text x="700" y="450" class="table-cell">웹/로컬 모두</text>
  <text x="900" y="450" class="table-cell">웹 전용</text>
  
  <!-- 로딩 속도 -->
  <line x1="120" y1="460" x2="1080" y2="460" stroke="#e5e7eb" stroke-width="1"/>
  <text x="150" y="480" class="table-header">로딩 속도</text>
  <text x="300" y="480" class="table-cell">매우 빠름</text>
  <text x="500" y="480" class="table-cell">네트워크 의존</text>
  <text x="700" y="480" class="table-cell">효율적</text>
  <text x="900" y="480" class="table-cell">상대적 느림</text>
  
  <!-- 커스터마이징 -->
  <line x1="120" y1="490" x2="1080" y2="490" stroke="#e5e7eb" stroke-width="1"/>
  <text x="150" y="510" class="table-header">커스터마이징</text>
  <text x="300" y="510" class="table-cell">제한적</text>
  <text x="500" y="510" class="table-cell">CSS 조절</text>
  <text x="700" y="510" class="table-cell">매우 높음</text>
  <text x="900" y="510" class="table-cell">색상 풍부</text>
  
  <!-- 파일 크기 -->
  <line x1="120" y1="520" x2="1080" y2="520" stroke="#e5e7eb" stroke-width="1"/>
  <text x="150" y="540" class="table-header">파일 크기</text>
  <text x="300" y="540" class="table-cell">개별 파일</text>
  <text x="500" y="540" class="table-cell">압축 효율</text>
  <text x="700" y="540" class="table-cell">통합 효율</text>
  <text x="900" y="540" class="table-cell">상대적 큼</text>
  
  <!-- 브라우저 지원 -->
  <line x1="120" y1="550" x2="1080" y2="550" stroke="#e5e7eb" stroke-width="1"/>
  <text x="150" y="570" class="table-header">브라우저 지원</text>
  <text x="300" y="570" class="table-cell">N/A</text>
  <text x="500" y="570" class="table-cell">완전 지원</text>
  <text x="700" y="570" class="table-cell">모던 브라우저</text>
  <text x="900" y="570" class="table-cell">제한적</text>
  
  <!-- 주요 사용처 -->
  <line x1="120" y1="580" x2="1080" y2="580" stroke="#e5e7eb" stroke-width="1"/>
  <text x="150" y="600" class="table-header">주요 사용처</text>
  <text x="300" y="600" class="table-cell">오피스, 로컬앱</text>
  <text x="500" y="600" class="table-cell">웹사이트</text>
  <text x="700" y="600" class="table-cell">반응형 디자인</text>
  <text x="900" y="600" class="table-cell">이모지, 로고</text>

  <!-- 하단 설명 -->
  <text x="600" y="675" class="subtitle" style="font-weight: bold; fill: #6366f1;">
    디지털 시대의 글꼴은 사용 목적과 환경에 따라 최적의 선택이 달라집니다
  </text>
</svg>