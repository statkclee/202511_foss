<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="900" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e293b">
    소프트웨어 패러다임 전환 과정
  </text>
  
  <!-- Software 1.0 to 2.0 Transition -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="600" height="250" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" rx="12" filter="url(#shadow)"/>
    
    <!-- Title -->
    <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">
      Software 1.0 → 2.0 전환
    </text>
    
    <!-- Left side - Software 1.0 -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="200" height="160" fill="url(#grad1)" rx="8" filter="url(#shadow)"/>
      <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
        Software 1.0
      </text>
      
      <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" fill="white">• 규칙 작성</text>
      <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="white">• 명시적 로직</text>
      <text x="20" y="90" font-family="Arial, sans-serif" font-size="12" fill="white">• 사람이 설계</text>
      <text x="20" y="110" font-family="Arial, sans-serif" font-size="12" fill="white">• 개별 규칙 정의</text>
      <text x="20" y="130" font-family="Arial, sans-serif" font-size="12" fill="white">• 수동 디버깅</text>
      <text x="20" y="150" font-family="Arial, sans-serif" font-size="12" fill="white">• 전문가 지식 필요</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 250 140 L 350 140" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
    <text x="300" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748b">
      데이터 학습
    </text>
    
    <!-- Right side - Software 2.0 -->
    <g transform="translate(370, 60)">
      <rect x="0" y="0" width="200" height="160" fill="url(#grad2)" rx="8" filter="url(#shadow)"/>
      <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
        Software 2.0
      </text>
      
      <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" fill="white">• 데이터 학습</text>
      <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="white">• 패턴 인식</text>
      <text x="20" y="90" font-family="Arial, sans-serif" font-size="12" fill="white">• 기계가 학습</text>
      <text x="20" y="110" font-family="Arial, sans-serif" font-size="12" fill="white">• 자동 특징 추출</text>
      <text x="20" y="130" font-family="Arial, sans-serif" font-size="12" fill="white">• 백프로파게이션</text>
      <text x="20" y="150" font-family="Arial, sans-serif" font-size="12" fill="white">• 대량 데이터 처리</text>
    </g>
  </g>
  
  <!-- Software 2.0 to 3.0 Transition -->
  <g transform="translate(750, 100)">
    <rect x="0" y="0" width="600" height="250" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2" rx="12" filter="url(#shadow)"/>
    
    <!-- Title -->
    <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">
      Software 2.0 → 3.0 전환
    </text>
    
    <!-- Left side - Software 2.0 -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="200" height="160" fill="url(#grad2)" rx="8" filter="url(#shadow)"/>
      <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
        Software 2.0
      </text>
      
      <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" fill="white">• 모델 훈련</text>
      <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="white">• 전문 지식</text>
      <text x="20" y="90" font-family="Arial, sans-serif" font-size="12" fill="white">• 복잡한 설정</text>
      <text x="20" y="110" font-family="Arial, sans-serif" font-size="12" fill="white">• 데이터 전처리</text>
      <text x="20" y="130" font-family="Arial, sans-serif" font-size="12" fill="white">• 하이퍼파라미터</text>
      <text x="20" y="150" font-family="Arial, sans-serif" font-size="12" fill="white">• ML 엔지니어링</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 250 140 L 350 140" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
    <text x="300" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748b">
      자연어 지시
    </text>
    
    <!-- Right side - Software 3.0 -->
    <g transform="translate(370, 60)">
      <rect x="0" y="0" width="200" height="160" fill="url(#grad3)" rx="8" filter="url(#shadow)"/>
      <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
        Software 3.0
      </text>
      
      <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" fill="white">• 자연어 지시</text>
      <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="white">• 일반 대화</text>
      <text x="20" y="90" font-family="Arial, sans-serif" font-size="12" fill="white">• 간단한 요청</text>
      <text x="20" y="110" font-family="Arial, sans-serif" font-size="12" fill="white">• 프롬프트 엔지니어링</text>
      <text x="20" y="130" font-family="Arial, sans-serif" font-size="12" fill="white">• 제로샷 학습</text>
      <text x="20" y="150" font-family="Arial, sans-serif" font-size="12" fill="white">• 자동 코드 생성</text>
    </g>
  </g>
  
  <!-- Software eating Software Concept -->
  <g transform="translate(200, 400)">
    <text x="400" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
      "Software eating Software" 개념
    </text>
    
    <!-- Nested layers -->
    <rect x="100" y="30" width="600" height="200" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="4" rx="15"/>
    <text x="120" y="55" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#9a3412">Software 3.0 (LLM Era)</text>
    
    <rect x="150" y="70" width="500" height="140" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="3" rx="12"/>
    <text x="170" y="95" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#166534">Software 2.0 (ML Era)</text>
    
    <rect x="200" y="110" width="400" height="80" fill="#3b82f6" fill-opacity="0.4" stroke="#3b82f6" stroke-width="2" rx="8"/>
    <text x="220" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Software 1.0 (Traditional Programming)</text>
    
    <text x="400" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
      각 단계가 이전 단계를 포함하며 발전
    </text>
    
    <text x="400" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">
      • LLM이 코드를 생성 (3.0 → 1.0)
    </text>
    <text x="400" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">
      • LLM이 ML 모델을 설계 (3.0 → 2.0)
    </text>
  </g>
  
  <!-- Real Examples Section -->
  <g transform="translate(50, 650)">
    <text x="650" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
      실제 적용 사례
    </text>
    
    <!-- Software 2.0 Examples -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="400" height="160" fill="#f0fdf4" stroke="#10b981" stroke-width="2" rx="10"/>
      <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#166534">
        Software 2.0 사례
      </text>
      
      <g transform="translate(20, 40)">
        <circle cx="10" cy="15" r="5" fill="#10b981"/>
        <text x="25" y="20" font-family="Arial, sans-serif" font-size="14" fill="#166534">ChatGPT, GPT-4 (자연어 처리)</text>
        
        <circle cx="10" cy="40" r="5" fill="#10b981"/>
        <text x="25" y="45" font-family="Arial, sans-serif" font-size="14" fill="#166534">Tesla 자율주행 (컴퓨터 비전)</text>
        
        <circle cx="10" cy="65" r="5" fill="#10b981"/>
        <text x="25" y="70" font-family="Arial, sans-serif" font-size="14" fill="#166534">DALL-E (이미지 생성)</text>
        
        <circle cx="10" cy="90" r="5" fill="#10b981"/>
        <text x="25" y="95" font-family="Arial, sans-serif" font-size="14" fill="#166534">Siri, Alexa (음성 인식)</text>
        
        <circle cx="10" cy="115" r="5" fill="#10b981"/>
        <text x="25" y="120" font-family="Arial, sans-serif" font-size="14" fill="#166534">AlphaGo (강화학습)</text>
      </g>
    </g>
    
    <!-- Software 3.0 Examples -->
    <g transform="translate(450, 30)">
      <rect x="0" y="0" width="400" height="160" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" rx="10"/>
      <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#9a3412">
        Software 3.0 사례
      </text>
      
      <g transform="translate(20, 40)">
        <circle cx="10" cy="15" r="5" fill="#f59e0b"/>
        <text x="25" y="20" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">GitHub Copilot (코드 자동완성)</text>
        
        <circle cx="10" cy="40" r="5" fill="#f59e0b"/>
        <text x="25" y="45" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">ChatGPT 코드 생성</text>
        
        <circle cx="10" cy="65" r="5" fill="#f59e0b"/>
        <text x="25" y="70" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">Claude Code (AI 어시스턴트)</text>
        
        <circle cx="10" cy="90" r="5" fill="#f59e0b"/>
        <text x="25" y="95" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">Cursor (AI IDE)</text>
        
        <circle cx="10" cy="115" r="5" fill="#f59e0b"/>
        <text x="25" y="120" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">자연어 → 앱 생성 도구</text>
      </g>
    </g>
    
    <!-- Future Vision -->
    <g transform="translate(900, 30)">
      <rect x="0" y="0" width="350" height="160" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="10"/>
      <text x="175" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#9a3412">
        📈 미래 전망
      </text>
      
      <text x="175" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9a3412">
        모든 소프트웨어 개발이
      </text>
      <text x="175" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9a3412">
        자연어 기반으로 전환
      </text>
      
      <text x="175" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9a3412">
        • 프로그래밍 언어 → 자연어
      </text>
      <text x="175" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9a3412">
        • 복잡한 개발 → 대화형 개발
      </text>
      <text x="175" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9a3412">
        • 전문가 → 일반인도 개발 가능
      </text>
    </g>
  </g>
</svg>