<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .axis-text { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 12px; font-weight: 600; fill: #34495e; }
      .event-text { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 10px; font-weight: 600; fill: #2c3e50; }
      .event-text-white { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 10px; font-weight: 600; fill: #000000; }
      .desc-text { font-family: 'Noto Sans KR', sans-serif; font-size: 9px; fill: #2c3e50; }
      .impact-text { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 12px; font-weight: bold; fill: #e74c3c; }
      .korea-text { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 12px; font-weight: bold; fill: #f39c12; }
      
      .low-impact { fill: #95a5a6; stroke: #7f8c8d; stroke-width: 2; }
      .medium-impact { fill: #2980b9; stroke: #1f5f99; stroke-width: 2; }
      .high-impact { fill: #c0392b; stroke: #922b21; stroke-width: 3; }
      .revolution-impact { fill: #7d3c98; stroke: #5b2c87; stroke-width: 4; }
      .korea-opportunity { fill: #f39c12; stroke: #e67e22; stroke-width: 3; }
      
      .trend-line { stroke: #27ae60; stroke-width: 3; fill: none; stroke-dasharray: 5,5; }
      .korea-line { stroke: #f39c12; stroke-width: 4; fill: none; }
      .leader-line { stroke: #7f8c8d; stroke-width: 1; fill: none; }
    </style>
    
    <marker id="arrow" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12" />
    </marker>
  </defs>

  <!-- 배경 그리드 -->
  <defs>
    <pattern id="grid" width="50" height="40" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 40" fill="none" stroke="#ecf0f1" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#grid)" />

  <!-- X축 (시간) -->
  <line x1="100" y1="500" x2="1050" y2="500" stroke="#34495e" stroke-width="2"/>
  
  <!-- X축 눈금 -->
  <line x1="150" y1="495" x2="150" y2="505" stroke="#34495e" stroke-width="2"/>
  <text x="150" y="520" text-anchor="middle" class="desc-text">2005</text>
  
  <line x1="300" y1="495" x2="300" y2="505" stroke="#34495e" stroke-width="2"/>
  <text x="300" y="520" text-anchor="middle" class="desc-text">2010</text>
  
  <line x1="450" y1="495" x2="450" y2="505" stroke="#34495e" stroke-width="2"/>
  <text x="450" y="520" text-anchor="middle" class="desc-text">2015</text>
  
  <line x1="600" y1="495" x2="600" y2="505" stroke="#34495e" stroke-width="2"/>
  <text x="600" y="520" text-anchor="middle" class="desc-text">2020</text>
  
  <line x1="750" y1="495" x2="750" y2="505" stroke="#34495e" stroke-width="2"/>
  <text x="750" y="520" text-anchor="middle" class="desc-text">2025</text>
  
  <line x1="900" y1="495" x2="900" y2="505" stroke="#34495e" stroke-width="2"/>
  <text x="900" y="520" text-anchor="middle" class="desc-text">2030</text>

  <!-- Y축 (파괴력) -->
  <line x1="100" y1="500" x2="100" y2="80" stroke="#34495e" stroke-width="2"/>
  <text x="50" y="290" text-anchor="middle" class="axis-text" transform="rotate(-90 50 290)">파괴력 (기하급수적 변화)</text>

  <!-- Y축 눈금 -->
  <line x1="95" y1="450" x2="105" y2="450" stroke="#34495e" stroke-width="1"/>
  <text x="85" y="455" text-anchor="end" class="desc-text">낮음</text>
  
  <line x1="95" y1="350" x2="105" y2="350" stroke="#34495e" stroke-width="1"/>
  <text x="85" y="355" text-anchor="end" class="desc-text">중간</text>
  
  <line x1="95" y1="250" x2="105" y2="250" stroke="#34495e" stroke-width="1"/>
  <text x="85" y="255" text-anchor="end" class="desc-text">높음</text>
  
  <line x1="95" y1="150" x2="105" y2="150" stroke="#34495e" stroke-width="1"/>
  <text x="85" y="155" text-anchor="end" class="desc-text">혁명</text>

  <!-- 기술 진화 곡선 -->
  <path d="M 150 480 Q 200 460 250 400 Q 350 300 500 200 Q 650 120 800 100" class="trend-line"/>

  <!-- 이벤트 포인트들 -->
  
  <!-- Chrome V8 (2008) -->
  <circle cx="220" cy="400" r="15" class="medium-impact"/>
  <line x1="220" y1="385" x2="190" y2="360" class="leader-line"/>
  <text x="180" y="355" text-anchor="end" class="event-text">Chrome V8</text>
  <text x="180" y="370" text-anchor="end" class="desc-text">JS 100배↑</text>
  <text x="180" y="385" text-anchor="end" class="impact-text">개발생산성 10배</text>

  <!-- Node.js (2009) -->
  <circle cx="260" cy="380" r="12" class="medium-impact"/>
  <line x1="260" y1="385" x2="280" y2="400" class="leader-line"/>
  <text x="290" y="405" text-anchor="end" class="event-text">Node.js</text>
  <text x="290" y="417" text-anchor="end" class="desc-text">서버진출</text>

  <!-- R Markdown (2012) -->
  <circle cx="320" cy="350" r="22" class="high-impact"/>
  <text x="310" y="325" text-anchor="middle" class="event-text-white">R Markdown</text>
  <text x="320" y="353" text-anchor="middle" class="event-text-white">문서=코드</text>
  <text x="350" y="385" text-anchor="middle" class="impact-text">과학출판 혁신</text>

  <!-- React (2013) -->
  <circle cx="370" cy="320" r="14" class="medium-impact"/>
  <line x1="384" y1="320" x2="410" y2="320" class="leader-line"/>
  <text x="420" y="318" class="event-text">React</text>
  <text x="420" y="332" class="desc-text">UI혁명</text>

  <!-- Jupyter (2014) -->
  <circle cx="390" cy="300" r="16" class="high-impact"/>
  <line x1="390" y1="284" x2="390" y2="260" class="leader-line"/>
  <text x="390" y="255" text-anchor="middle" class="event-text">Jupyter</text>
  <text x="390" y="245" text-anchor="middle" class="desc-text">노트북</text>
  <text x="390" y="215" text-anchor="middle" class="impact-text">데이터과학 대중화</text>

  <!-- WebAssembly (2017) -->
  <circle cx="480" cy="245" r="32" class="high-impact"/>
  <text x="480" y="245" text-anchor="middle" class="event-text-white">WebAssembly</text>
  <text x="480" y="260" text-anchor="middle" class="event-text-white">네이티브성능</text>
  <text x="480" y="295" text-anchor="middle" class="impact-text">웹=데스크톱</text>

  <!-- GPT-3 (2020) -->
  <circle cx="600" cy="180" r="25" class="revolution-impact"/>
  <text x="600" y="175" text-anchor="middle" class="event-text-white">GPT-3</text>
  <text x="600" y="190" text-anchor="middle" class="event-text-white">AI코딩</text>
  <text x="600" y="220" text-anchor="middle" class="impact-text">자연어→코드</text>

  <!-- ChatGPT (2022) -->
  <circle cx="660" cy="140" r="30" class="revolution-impact"/>
  <text x="660" y="135" text-anchor="middle" class="event-text-white">ChatGPT</text>
  <text x="660" y="150" text-anchor="middle" class="event-text-white">AI대중화</text>
  <text x="660" y="185" text-anchor="middle" class="impact-text">10억 사용자</text>

  <!-- Claude Artifacts (2024) -->
  <circle cx="720" cy="120" r="35" class="revolution-impact"/>
  <text x="720" y="105" text-anchor="middle" class="event-text-white">Claude</text>
  <text x="720" y="120" text-anchor="middle" class="event-text-white">Artifacts</text>
  <text x="720" y="135" text-anchor="middle" class="event-text-white">실시간앱생성</text>
  <text x="720" y="175" text-anchor="middle" class="impact-text">문서=소프트웨어</text>

  <!-- 한국의 현재 위치와 기회 -->
  
  <!-- HWP 갈라파고스 (1995-현재) -->
  <rect x="180" y="460" width="540" height="20" fill="#f39c12" opacity="0.3"/>
  <text x="450" y="475" text-anchor="middle" class="korea-text">HWP 갈라파고스 (95% 점유율, 30년간)</text>

  <!-- 한국의 현재 위치 -->
  <circle cx="720" cy="470" r="30" class="korea-opportunity" stroke-dasharray="5,5"/>
  <text x="720" y="465" text-anchor="middle" class="event-text">한국 현재</text>
  <text x="720" y="480" text-anchor="middle" class="desc-text">2세대 정체</text>

  <!-- 도약 기회 화살표 -->
  <path d="M 720 450 Q 760 300 800 120" class="korea-line" marker-end="url(#arrow)"/>
  <text x="780" y="280" class="korea-text">도약 기회</text>
  <text x="780" y="295" class="desc-text">2-3세대 건너뛰기</text>

  <!-- 미래 예측 -->
  
  <!-- AI 자가진화 (2025) -->
  <circle cx="750" cy="100" r="25" class="revolution-impact" fill="#9b59b6" opacity="0.5"/>
  <line x1="750" y1="75" x2="750" y2="65" class="leader-line"/>
  <text x="750" y="55" text-anchor="middle" class="event-text">AI 자가진화</text>
  <text x="750" y="45" text-anchor="middle" class="desc-text">문서 스스로 업데이트</text>

  <!-- 뇌-컴퓨터 인터페이스 (2027) -->
  <circle cx="820" cy="90" r="20" class="revolution-impact" fill="#9b59b6" opacity="0.4"/>
  <line x1="835" y1="90" x2="860" y2="90" class="leader-line"/>
  <text x="880" y="88" class="event-text">BCI 문서</text>
  <text x="880" y="102" class="desc-text">생각→문서</text>

  <!-- 양자 컴퓨팅 (2030) -->
  <circle cx="900" cy="80" r="15" class="revolution-impact" fill="#9b59b6" opacity="0.2"/>
  <line x1="900" y1="65" x2="900" y2="50" class="leader-line"/>
  <text x="900" y="50" text-anchor="middle" class="event-text">양자처리</text>
  <text x="900" y="40" text-anchor="middle" class="desc-text">무한계산</text>

  <!-- 핵심 임팩트 수치 박스 -->
  <g class="impact-index" transform="translate(-70, 100)">  
    <rect x="950" y="100" width="150" height="200" rx="10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <text x="1020" y="125" text-anchor="middle" class="axis-text">파괴력 지표</text>
    
    <text x="960" y="150" class="desc-text">개발 시간</text>
    <text x="1080" y="150" text-anchor="end" class="impact-text">6개월 → 3일</text>
    <text x="1080" y="165" text-anchor="end" class="impact-text">(99.8% ↓)</text>
    
    <text x="960" y="185" class="desc-text">개발 비용</text>
    <text x="1080" y="185" text-anchor="end" class="impact-text">1000만 → 10만</text>
    <text x="1080" y="200" text-anchor="end" class="impact-text">(99% ↓)</text>
    
    <text x="960" y="220" class="desc-text">접근성</text>
    <text x="1080" y="220" text-anchor="end" class="impact-text">전문가 → 누구나</text>
    
    <text x="960" y="240" class="desc-text">성능 격차</text>
    <text x="1080" y="240" text-anchor="end" class="impact-text">웹 ≈ 네이티브</text>
    
    <text x="960" y="260" class="desc-text">한국 기회</text>
    <text x="1080" y="260" text-anchor="end" class="korea-text">퍼스트 무버</text>
    <text x="1080" y="275" text-anchor="end" class="korea-text">2025-2027</text>
  </g>

  <!-- 범례 -->
  <g transform="translate(100, 50)">
    <circle cx="0" cy="0" r="12" class="medium-impact"/>
    <text x="20" y="5" class="desc-text">기술 혁신</text>
    
    <circle cx="100" cy="0" r="12" class="high-impact"/>
    <text x="120" y="5" class="desc-text">산업 변화</text>
    
    <circle cx="200" cy="0" r="12" class="revolution-impact"/>
    <text x="220" y="5" class="desc-text">패러다임 전환</text>
    
    <circle cx="320" cy="0" r="12" class="korea-opportunity"/>
    <text x="340" y="5" class="desc-text">한국 기회</text>
  </g>

</svg>