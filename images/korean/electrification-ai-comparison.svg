<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800">
  <defs>
    <style><![CDATA[
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 36px; font-weight: 900; fill: #f8fafc; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #cbd5e1; }
      .h1 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; }
      .h2 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #f1f5f9; }
      .p { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #e5e7eb; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #cbd5e1; }
      .year { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 900; fill: #fbbf24; }
    ]]></style>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Stage gradients -->
    <linearGradient id="gradStage1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="gradStage2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="gradStage3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Effects -->
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/></filter>
    
    <!-- Arrow markers -->
    <marker id="arrowRight" markerWidth="16" markerHeight="12" refX="4" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="800" fill="url(#bg)"/>

  <!-- Header -->
  <text x="700" y="60" text-anchor="middle" class="title">전기화 vs 생성형 AI: 3단계 발전 비교</text>
  <text x="700" y="90" text-anchor="middle" class="subtitle">Electrification vs Generative AI: Three-Stage Development Comparison</text>

  <!-- Timeline -->
  <g transform="translate(100,140)">
    <!-- Stage 1: Simple Substitution -->
    <g>
      <rect x="0" y="0" width="380" height="500" rx="20" fill="url(#gradStage1)" filter="url(#shadow)" opacity="0.9"/>
      <text x="190" y="40" text-anchor="middle" class="h1">1단계: 단순 대체</text>
      <text x="190" y="70" text-anchor="middle" class="small">Simple Substitution</text>
      
      <!-- Electrification -->
      <g transform="translate(20,100)">
        <rect x="0" y="0" width="340" height="160" rx="12" fill="#1f2937" opacity="0.7"/>
        <text x="170" y="25" text-anchor="middle" class="h2" fill="#fbbf24">전기화 (1880-1900)</text>
        <text x="20" y="50" class="p">• 증기기관 → 전기 다이나모 교체</text>
        <text x="20" y="75" class="p">• 중앙집중식 시스템 유지</text>
        <text x="20" y="100" class="p">• 기존 공장 레이아웃 변화 없음</text>
        <text x="20" y="125" class="p">• 생산성 향상 거의 없음</text>
        <text x="170" y="150" text-anchor="middle" class="year">약 20년</text>
      </g>

      <!-- AI -->
      <g transform="translate(20,280)">
        <rect x="0" y="0" width="340" height="160" rx="12" fill="#1f2937" opacity="0.7"/>
        <text x="170" y="25" text-anchor="middle" class="h2" fill="#fbbf24">생성형 AI (2020-2025)</text>
        <text x="20" y="50" class="p">• 기존 업무에 AI 도구 추가</text>
        <text x="20" y="75" class="p">• 기존 워크플로우 대부분 유지</text>
        <text x="20" y="100" class="p">• 조직 구조 변화 최소</text>
        <text x="20" y="125" class="p">• 제한적 생산성 향상</text>
        <text x="170" y="150" text-anchor="middle" class="year">현재 진행</text>
      </g>
    </g>

    <!-- Arrow 1 -->
    <line x1="380" y1="250" x2="420" y2="250" stroke="#34d399" stroke-width="6" marker-end="url(#arrowRight)"/>

    <!-- Stage 2: Gradual Adaptation -->
    <g transform="translate(440,0)">
      <rect x="0" y="0" width="380" height="500" rx="20" fill="url(#gradStage2)" filter="url(#shadow)" opacity="0.9"/>
      <text x="190" y="40" text-anchor="middle" class="h1">2단계: 점진적 적응</text>
      <text x="190" y="70" text-anchor="middle" class="small">Gradual Adaptation</text>
      
      <!-- Electrification -->
      <g transform="translate(20,100)">
        <rect x="0" y="0" width="340" height="160" rx="12" fill="#1f2937" opacity="0.7"/>
        <text x="170" y="25" text-anchor="middle" class="h2" fill="#93c5fd">전기화 (1900-1920)</text>
        <text x="20" y="50" class="p">• 개별 전기모터 부분 도입</text>
        <text x="20" y="75" class="p">• 점진적 공장 개선</text>
        <text x="20" y="100" class="p">• 혼재된 시스템 운영</text>
        <text x="20" y="125" class="p">• 복잡성 증가</text>
        <text x="170" y="150" text-anchor="middle" class="year">약 10-20년</text>
      </g>

      <!-- AI -->
      <g transform="translate(20,280)">
        <rect x="0" y="0" width="340" height="160" rx="12" fill="#1f2937" opacity="0.7"/>
        <text x="170" y="25" text-anchor="middle" class="h2" fill="#93c5fd">AI 적응 (2025-2030, 예상)</text>
        <text x="20" y="50" class="p">• AI 전용 워크플로우 개발</text>
        <text x="20" y="75" class="p">• 조직 구조 부분 개편</text>
        <text x="20" y="100" class="p">• 기존-AI 시스템 혼재</text>
        <text x="20" y="125" class="p">• 학습 비용 증가</text>
        <text x="170" y="150" text-anchor="middle" class="year">예상 5년</text>
      </g>
    </g>

    <!-- Arrow 2 -->
    <line x1="820" y1="250" x2="860" y2="250" stroke="#34d399" stroke-width="6" marker-end="url(#arrowRight)"/>

    <!-- Stage 3: Revolutionary Reconfiguration -->
    <g transform="translate(880,0)">
      <rect x="0" y="0" width="380" height="500" rx="20" fill="url(#gradStage3)" filter="url(#shadow)" opacity="0.9"/>
      <text x="190" y="40" text-anchor="middle" class="h1">3단계: 혁신적 재구성</text>
      <text x="190" y="70" text-anchor="middle" class="small">Revolutionary Reconfiguration</text>
      
      <!-- Electrification -->
      <g transform="translate(20,100)">
        <rect x="0" y="0" width="340" height="160" rx="12" fill="#1f2937" opacity="0.7"/>
        <text x="170" y="25" text-anchor="middle" class="h2" fill="#6ee7b7">전기화 (1920년대)</text>
        <text x="20" y="50" class="p">• 단위 구동 방식 전면 채택</text>
        <text x="20" y="75" class="p">• 공장 레이아웃 완전 재설계</text>
        <text x="20" y="100" class="p">• 작업 프로세스 혁신</text>
        <text x="20" y="125" class="p">• 폭발적 생산성 향상</text>
        <text x="170" y="150" text-anchor="middle" class="year">30-40년 후</text>
      </g>

      <!-- AI -->
      <g transform="translate(20,280)">
        <rect x="0" y="0" width="340" height="160" rx="12" fill="#1f2937" opacity="0.7"/>
        <text x="170" y="25" text-anchor="middle" class="h2" fill="#6ee7b7">AI 혁명 (2030-2040, 예상)</text>
        <text x="20" y="50" class="p">• AI 네이티브 조직 구조</text>
        <text x="20" y="75" class="p">• 업무 프로세스 완전 재구성</text>
        <text x="20" y="100" class="p">• 인간-AI 협업 최적화</text>
        <text x="20" y="125" class="p">• 업무·의사결정 패러다임 혁신</text>
        <text x="170" y="150" text-anchor="middle" class="year">20년 후 예상</text>
      </g>
    </g>
  </g>

  <!-- Key Insights -->
  <g transform="translate(700,700)">
    <rect x="-650" y="-50" width="1300" height="80" rx="15" fill="#1f2937" opacity="0.8"/>
    <text x="0" y="-20" text-anchor="middle" class="h1">핵심 통찰: AI는 전기화보다 최대 2배 빠른 속도로 확산될 가능성</text>
    <text x="0" y="5" text-anchor="middle" class="p">전기화 30-40년 vs AI 20년 (추정) - 디지털 인프라와 글로벌 연결성의 영향</text>
    <text x="0" y="30" text-anchor="middle" class="small">Key Insight: AI may spread up to twice as fast as electrification due to digital infrastructure</text>
  </g>
</svg>