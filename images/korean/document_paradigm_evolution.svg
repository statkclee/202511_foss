<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="650" viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Noto Sans KR', sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; }
      .era-title { font-family: 'Noto Sans KR', sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .era-desc { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; text-anchor: middle; }
      .paradigm { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .tools { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; text-anchor: middle; fill: #666; }
      .bullet { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; text-anchor: start; fill:#2c3e50; }
      .bullet-head { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 700; text-anchor: start; }
      .arrow { stroke: #2c3e50; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .transition-text { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; fill: #34495e; }
      .transition-desc { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; text-anchor: middle; fill: #7f8c8d; }
      .main-title { font-family: 'Noto Sans KR', sans-serif; font-size: 26px; font-weight: bold; text-anchor: middle; fill: #2c3e50; }
      .key-point { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; text-anchor: middle; fill: #fff; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="650" fill="#f8f9fa"/>

  <!-- Era 1: WYSIWYG -->
  <rect x="50" y="50" width="200" height="160" rx="15" fill="url(#grad1)" stroke="#e74c3c" stroke-width="2"/>
  <text x="150" y="80" class="era-title" fill="#c0392b">1980년대</text>
  <text x="150" y="110" class="paradigm" fill="#e74c3c">WYSIWYG</text>
  <text x="150" y="130" class="era-desc" fill="#2c3e50">What You See</text>
  <text x="150" y="145" class="era-desc" fill="#2c3e50">Is What You Get</text>
  <text x="150" y="170" class="tools">MS Word, 아래아한글</text>
  <text x="150" y="185" class="tools">PageMaker, QuarkXPress</text>

  <!-- Arrow 1 with transition text -->
  <line x1="260" y1="130" x2="320" y2="130" class="arrow"/>
  <text x="290" y="115" class="transition-text">구조화</text>
  <text x="290" y="150" class="transition-desc">내용 분리</text>

  <!-- Era 2: WYSIWYM -->
  <rect x="330" y="50" width="200" height="160" rx="15" fill="url(#grad2)" stroke="#3498db" stroke-width="2"/>
  <text x="430" y="80" class="era-title" fill="#2980b9">2000년대</text>
  <text x="430" y="110" class="paradigm" fill="#3498db">WYSIWYM</text>
  <text x="430" y="130" class="era-desc" fill="#2c3e50">What You See</text>
  <text x="430" y="145" class="era-desc" fill="#2c3e50">Is What You Mean</text>
  <text x="430" y="170" class="tools">LaTeX, Markdown</text>
  <text x="430" y="185" class="tools">HTML, DocBook</text>

  <!-- Arrow 2 with transition text -->
  <line x1="540" y1="130" x2="600" y2="130" class="arrow"/>
  <text x="570" y="115" class="transition-text">AI 혁명</text>
  <text x="570" y="150" class="transition-desc">자동화</text>

  <!-- Era 3: WYAIWYM -->
  <rect x="610" y="50" width="180" height="160" rx="15" fill="url(#grad3)" stroke="#27ae60" stroke-width="2"/>
  <text x="700" y="80" class="era-title" fill="#229954">2020년대</text>
  <text x="700" y="110" class="paradigm" fill="#27ae60">WYAIWYM</text>
  <text x="700" y="130" class="era-desc" fill="#2c3e50">What You Ask AI</text>
  <text x="700" y="145" class="era-desc" fill="#2c3e50">Is What You Mean</text>
  <text x="700" y="170" class="tools">ChatGPT + Markdown</text>
  <text x="700" y="185" class="tools">Claude + Quarto</text>

  <!-- Middle Section: Key Evolution Points -->
  <rect x="50" y="225" width="700" height="80" rx="10" fill="url(#grad4)" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="400" y="245" class="transition-text" fill="#8e44ad">핵심 전환점</text>
  
  <!-- Three key points with icons -->
  <rect x="80" y="255" width="180" height="35" rx="5" fill="#e74c3c" opacity="0.8"/>
  <text x="170" y="270" class="key-point">👁️ 시각 중심</text>
  <text x="170" y="284" class="key-point">→ 형식에 종속</text>

  <rect x="310" y="255" width="180" height="35" rx="5" fill="#3498db" opacity="0.8"/>
  <text x="400" y="270" class="key-point">📝 의미 중심</text>
  <text x="400" y="284" class="key-point">→ 구조와 내용 분리</text>

  <rect x="540" y="255" width="180" height="35" rx="5" fill="#27ae60" opacity="0.8"/>
  <text x="630" y="270" class="key-point">🤖 의도 중심</text>
  <text x="630" y="284" class="key-point">→ AI가 구현</text>

  <!-- WYSIWYG Characteristics -->
  <rect x="50" y="320" width="230" height="260" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="1"/>
  <text x="62" y="345" class="bullet-head" fill="#c0392b">직관적 시각 편집</text>
  <text x="62" y="365" class="bullet">• 즉시 결과 확인</text>
  <text x="62" y="382" class="bullet">• 서식 우선 사고</text>
  <text x="62" y="399" class="bullet">• 바이너리 파일 형식</text>
  <text x="62" y="416" class="bullet">• GUI 기반 작업</text>
  <text x="62" y="442" class="bullet-head" fill="#c0392b">한계점</text>
  <text x="62" y="462" class="bullet">• 호환성 문제 (버전/SW간)</text>
  <text x="62" y="479" class="bullet">• AI 처리 어려움</text>
  <text x="62" y="496" class="bullet">• 자동화 한계</text>
  <text x="62" y="513" class="bullet">• 버전 관리 복잡</text>
  <text x="62" y="530" class="bullet">• 협업시 충돌 빈발</text>
  <text x="62" y="547" class="bullet">• 재사용성 낮음</text>
  <text x="62" y="564" class="bullet">• 검색 인덱싱 제한</text>

  <!-- WYSIWYM Characteristics (정렬 수정) -->
  <rect x="290" y="320" width="230" height="260" rx="10" fill="#fff" stroke="#3498db" stroke-width="1"/>
  <text x="302" y="345" class="bullet-head" fill="#2980b9">내용과 구조 분리</text>
  <text x="302" y="365" class="bullet">• 의미 중심 작성</text>
  <text x="302" y="382" class="bullet">• 플레인 텍스트 기반</text>
  <text x="302" y="399" class="bullet">• 버전 관리 용이 (Git)</text>
  <text x="302" y="416" class="bullet">• 자동화/스크립팅 가능</text>
  <text x="302" y="442" class="bullet-head" fill="#2980b9">장점</text>
  <text x="302" y="462" class="bullet">• 장기 지속가능성</text>
  <text x="302" y="479" class="bullet">• 플랫폼 독립성</text>
  <text x="302" y="496" class="bullet">• 협업 친화적</text>
  <text x="302" y="513" class="bullet">• AI/ML 호환성</text>
  <text x="302" y="530" class="bullet">• 재사용성 높음</text>
  <text x="302" y="547" class="bullet">• 검색 최적화</text>
  <text x="302" y="564" class="bullet">• 다양한 출력 포맷</text>

  <!-- WYAIWYM Characteristics (정렬 수정) -->
  <rect x="530" y="320" width="230" height="260" rx="10" fill="#fff" stroke="#27ae60" stroke-width="1"/>
  <text x="542" y="345" class="bullet-head" fill="#229954">AI 협업 문서 작성</text>
  <text x="542" y="365" class="bullet">• 자연어로 의도 전달</text>
  <text x="542" y="382" class="bullet">• AI가 구조화/최적화</text>
  <text x="542" y="399" class="bullet">• 실시간 피드백/개선</text>
  <text x="542" y="416" class="bullet">• 컨텍스트 이해</text>
  <text x="542" y="442" class="bullet-head" fill="#229954">혁신적 변화</text>
  <text x="542" y="462" class="bullet">• 생산성 10배 향상</text>
  <text x="542" y="479" class="bullet">• 일관된 품질 보장</text>
  <text x="542" y="496" class="bullet">• 접근성 극대화</text>
  <text x="542" y="513" class="bullet">• 창의성 증폭</text>
  <text x="542" y="530" class="bullet">• 다국어 자동 처리</text>
  <text x="542" y="547" class="bullet">• 실시간 오류 수정</text>
  <text x="542" y="564" class="bullet">• 지식 기반 통합</text>

  <!-- Timeline -->
  <line x1="50" y1="605" x2="750" y2="605" stroke="#34495e" stroke-width="2"/>
  <circle cx="165" cy="605" r="6" fill="#e74c3c"/>
  <circle cx="405" cy="605" r="6" fill="#3498db"/>
  <circle cx="645" cy="605" r="6" fill="#27ae60"/>
  <text x="165" y="627" class="tools">1980-1990s</text>
  <text x="405" y="627" class="tools">2000-2010s</text>
  <text x="645" y="627" class="tools">2020s-Future</text>
</svg>