<svg width="1200" height="700" viewBox="0 30 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 그라데이션 정의 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fefefe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1"/>
    </linearGradient>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#334155;stop-opacity:0.05"/>
    </linearGradient>

    <!-- 각 개념별 그라데이션 -->
    <radialGradient id="typeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.3"/>
    </radialGradient>

    <radialGradient id="typefaceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
    </radialGradient>

    <radialGradient id="fontGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#dcfce7;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.3"/>
    </radialGradient>

    <radialGradient id="typographyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fdf2f8;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:0.3"/>
    </radialGradient>

    <!-- 그림자 필터 -->
    <filter id="dropshadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <style>
    .main-title { font-family: 'Noto Sans KR', sans-serif; font-size: 24px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
    .subtitle { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; fill: #64748b; text-anchor: middle; }
    .concept-title { font-family: 'Noto Sans KR', sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
    .concept-subtitle { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; text-anchor: middle; font-style: italic; }
    .concept-desc { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; text-anchor: middle; }
    .term-title { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: bold; fill: #374151; text-anchor: start; }
    .term-text { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; fill: #4b5563; text-anchor: start; }
    .term-text-bold { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; fill: #4b5563; text-anchor: start; }
    .demo-serif { font-family: 'Times New Roman', serif; font-size: 24px; fill: #1e293b; text-anchor: middle; }
    .demo-sans { font-family: 'Arial', sans-serif; font-size: 24px; fill: #1e293b; text-anchor: middle; }
    .demo-mono { font-family: 'Courier New', monospace; font-size: 20px; fill: #1e293b; text-anchor: middle; }
    .arrow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  </style>

  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  
  <!-- 상단 제목 -->
  <rect x="100" y="60" width="1000" height="50" rx="15" fill="url(#headerGrad)" stroke="#1e293b" stroke-width="2" filter="url(#dropshadow)"/>
  <text x="600" y="95" class="main-title">활자, 서체, 글꼴, 타이포그래피 관계와 필수 용어</text>

  <!-- 중앙 핵심 개념들 (동심원 구조) -->
  <!-- 활자 (Type) - 최외곽 -->
  <circle cx="600" cy="350" r="180" fill="url(#typeGrad)" stroke="#f59e0b" stroke-width="3" filter="url(#dropshadow)"/>
  
  <!-- 서체 (Typeface) -->
  <circle cx="600" cy="350" r="140" fill="url(#typefaceGrad)" stroke="#3b82f6" stroke-width="3" filter="url(#dropshadow)"/>
  
  <!-- 글꼴 (Font) -->
  <circle cx="600" cy="350" r="100" fill="url(#fontGrad)" stroke="#059669" stroke-width="3" filter="url(#dropshadow)"/>
  
  <!-- 타이포그래피 (Typography) - 중심 -->
  <circle cx="600" cy="350" r="60" fill="url(#typographyGrad)" stroke="#db2777" stroke-width="3" filter="url(#dropshadow)"/>
  
  <!-- 각 개념 레이블과 설명 (위치 조정) -->
  <!-- 활자 (Type) 설명 - 왼쪽 상단 -->
  <g transform="translate(360, 150)">
    <rect x="-90" y="-15" width="180" height="55" rx="5" fill="#ffffff" stroke="#f59e0b" stroke-width="2" opacity="0.95"/>
    <text x="0" y="5" class="concept-title" style="fill: #d97706;">활자 (Type)</text>
    <text x="0" y="22" class="concept-subtitle" style="fill: #92400e;">물리적 인쇄 도구</text>
    <text x="0" y="35" class="concept-desc" style="fill: #92400e;">나무/금속 조각, 활판인쇄</text>
  </g>
  
  <!-- 서체 (Typeface) 설명 - 오른쪽 상단 -->
  <g transform="translate(770, 170)">
    <rect x="-90" y="-15" width="180" height="55" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="2" opacity="0.95"/>
    <text x="0" y="5" class="concept-title" style="fill: #2563eb;">서체 (Typeface)</text>
    <text x="0" y="22" class="concept-subtitle" style="fill: #1d4ed8;">디자인 체계</text>
    <text x="0" y="35" class="concept-desc" style="fill: #1d4ed8;">Times, Arial, 나눔고딕</text>
  </g>
  
  <!-- 글꼴 (Font) 설명 - 왼쪽 하단 -->
  <g transform="translate(360, 450)">
    <rect x="-90" y="-15" width="180" height="55" rx="5" fill="#ffffff" stroke="#059669" stroke-width="2" opacity="0.95"/>
    <text x="0" y="5" class="concept-title" style="fill: #059669;">글꼴 (Font)</text>
    <text x="0" y="22" class="concept-subtitle" style="fill: #047857;">구체적 스타일</text>
    <text x="0" y="35" class="concept-desc" style="fill: #047857;">Bold, Italic, 12pt</text>
  </g>
  
  <!-- 타이포그래피 (Typography) 설명 - 오른쪽 하단 -->
  <g transform="translate(690, 420)">
    <rect x="-70" y="-15" width="180" height="70" rx="5" fill="#ffffff" stroke="#db2777" stroke-width="2" opacity="0.95"/>
    <text x="15" y="5" class="concept-title" style="fill: #be185d;">타이포그래피</text>
    <text x="15" y="22" class="concept-subtitle" style="fill: #9d174d;">문자 배열 예술</text>
    <text x="15" y="35" class="concept-desc" style="fill: #9d174d;">레이아웃, 간격, 정렬</text>
    <text x="15" y="48" class="concept-desc" style="fill: #9d174d;">가독성과 미적 조화</text>
  </g>

  <!-- 좌측: 글자 구조 용어 -->
  <rect x="50" y="150" width="200" height="300" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="2" filter="url(#dropshadow)"/>
  <text x="110" y="175" class="term-title">글자 구조 용어</text>
  
  <!-- 글자 구조 시각화 -->
  <g transform="translate(70, 190)">
    <text x="90" y="40" class="demo-serif" style="font-size: 48px;">Hpg</text>
    
    <!-- 가이드 라인들 -->
    <line x1="20" y1="10" x2="160" y2="10" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="165" y="15" class="term-text" style="fill: #ef4444;">Ascender Line</text>
    
    <line x1="20" y1="30" x2="160" y2="30" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="165" y="35" class="term-text" style="fill: #3b82f6;">X-height</text>
    
    <line x1="20" y1="50" x2="160" y2="50" stroke="#1f2937" stroke-width="2"/>
    <text x="165" y="55" class="term-text" style="fill: #1f2937;">Baseline</text>
    
    <line x1="20" y1="65" x2="160" y2="65" stroke="#059669" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="165" y="70" class="term-text" style="fill: #059669;">Descender Line</text>
  </g>
  
  <text x="60" y="290" class="term-text">• Ascender: 상승부 (h, b, d)</text>
  <text x="60" y="305" class="term-text">• X-height: 소문자 x 높이</text>
  <text x="60" y="320" class="term-text">• Baseline: 글자 기준선</text>
  <text x="60" y="335" class="term-text">• Descender: 하강부 (p, g, y)</text>
  <text x="60" y="350" class="term-text">• Cap Height: 대문자 높이</text>
  <text x="60" y="365" class="term-text">• Serif: 삐침, 장식</text>
  <text x="60" y="380" class="term-text">• Counter: 글자 내부 공간</text>
  <text x="60" y="395" class="term-text">• Stem: 주요 세로획</text>
  <text x="60" y="410" class="term-text">• Bowl: 둥근 부분 (o, p, b)</text>

  <!-- 우측: 간격 조정 용어 -->
  <rect x="950" y="150" width="200" height="350" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="2" filter="url(#dropshadow)"/>
  <text x="1000" y="175" class="term-title">간격 조정 용어</text>
  
  <!-- 간격 조정 시각화 -->
  <g transform="translate(970, 190)">
    <!-- Kerning 예시 -->
    <text x="15" y="30" class="demo-sans" style="font-size: 24px;">AV</text>
    <text x="80" y="30" class="demo-sans" style="font-size: 24px; letter-spacing: -3px;">AV</text>
    <text x="0" y="45" class="term-text" style="font-size: 11px;">Normal</text>
    <text x="60" y="45" class="term-text" style="font-size: 11px;">Kerning</text>
    
    <!-- Leading 예시 -->
    <g>
      <text x="30" y="75" class="demo-sans" style="font-size: 14px;">Typography</text>
      <text x="30" y="88" class="demo-sans" style="font-size: 14px;">Typography</text>
      <text x="100" y="75" class="term-text" style="font-size: 11px;">Leading</text>
      <text x="100" y="85" class="term-text" style="font-size: 11px;">1.0</text>
    </g>
    <g>
      <text x="30" y="110" class="demo-sans" style="font-size: 14px;">Typography</text>
      <text x="30" y="135" class="demo-sans" style="font-size: 14px;">Typography</text>
      <text x="100" y="110" class="term-text" style="font-size: 11px;">Leading</text>
      <text x="100" y="120" class="term-text" style="font-size: 11px;">2.0</text>
    </g>
    
    <!-- Tracking 예시 -->
    <text x="30" y="165" class="demo-sans" style="font-size: 14px;">Typography</text>
    <text x="45" y="185" class="demo-sans" style="font-size: 14px; letter-spacing: 3px;">Typography</text>
    <text x="100" y="165" class="term-text" style="font-size: 11px;">Normal</text>
    <text x="100" y="185" class="term-text" style="font-size: 11px;">Tracking</text>
  </g>
  
  <text x="960" y="400" class="term-text">• Kerning: 특정 글자쌍 간격</text>
  <text x="960" y="420" class="term-text">• Leading: 줄 간격 (행간)</text>
  <text x="960" y="440" class="term-text">• Tracking: 전체 자간</text>
  <text x="960" y="460" class="term-text">• Word Spacing: 단어 간격</text>
  <text x="960" y="480" class="term-text">• Alignment: 정렬 (좌/우/중앙)</text>

  <!-- 하단: 한글 특화 용어 -->
  <rect x="100" y="550" width="1000" height="150" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2" filter="url(#dropshadow)"/>
  
  <text x="600" y="580" class="term-title" style="text-anchor: middle;">한글 타이포그래피 전문 용어</text>
  
  <!-- 한글 구조 시각화 -->
  <g transform="translate(150, 600)">
    <text x="28" y="68" style="font-family: 'Noto Sans KR', sans-serif; font-size: 48px; fill: #1e293b;">한</text>
    
    <!-- 한글 구성요소 표시 - 겹치지 않게 배치 -->
    <text x="10" y="15" class="term-text" style="fill: #ef4444;">ㅎ (초성)</text>
    <text x="85" y="15" class="term-text" style="fill: #3b82f6;">ㅏ (중성)</text>
    <text x="40" y="85" class="term-text" style="fill: #059669;">ㄴ (종성)</text>
    
    <!-- 구성요소를 실제 글자 부분으로 연결하는 화살표 (정확한 위치) -->
    <g transform="translate(0,0)">
      <path d="M 30 18 L 45 35" stroke="#ef4444" stroke-width="1" fill="none" marker-end="url(#smallArrow)"/>
      <path d="M 100 18 L 65 40" stroke="#3b82f6" stroke-width="1" fill="none" marker-end="url(#smallArrow)"/>
      <path d="M 55 82 L 55 65" stroke="#059669" stroke-width="1" fill="none" marker-end="url(#smallArrow)"/>
    </g>
    <!-- 네모틀 표시 -->
    <rect x="25" y="25" width="50" height="50" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="90" y="55" class="term-text">네모틀</text>
  </g>
  
  <!-- 작은 화살표 마커 추가 -->
  <defs>
    <marker id="smallArrow" markerWidth="6" markerHeight="6" 
            refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#6b7280"/>
    </marker>
  </defs>
  
  <!-- 한글 용어 설명 -->
  <g transform="translate(0,-20)">
    <text x="320" y="630" class="term-text">• <tspan style="font-weight: bold;">초성</tspan>: 첫소리 (자음, ㄱ~ㅎ)</text>
    <text x="320" y="645" class="term-text">• <tspan style="font-weight: bold;">중성</tspan>: 가운데소리 (모음, ㅏ~ㅣ)</text>
    <text x="320" y="660" class="term-text">• <tspan style="font-weight: bold;">종성</tspan>: 끝소리 (받침, ㄱ~ㅎ)</text>
    <text x="320" y="675" class="term-text">• <tspan style="font-weight: bold;">네모틀</tspan>: 한글 글자가 들어가는 사각 공간</text>
    <text x="320" y="690" class="term-text">• <tspan style="font-weight: bold;">민부리</tspan>: 삐침이 없는 한글 서체 (고딕계열)</text>
    <text x="320" y="705" class="term-text">• <tspan style="font-weight: bold;">돋음</tspan>: 삐침이 있는 한글 서체 (명조계열)</text>

    <text x="600" y="630" class="term-text">• <tspan style="font-weight: bold;">탈네모</tspan>: 네모틀을 벗어나는 디자인</text>
    <text x="600" y="645" class="term-text">• <tspan style="font-weight: bold;">가로조화</tspan>: 가로쓰기에 최적화</text>
    <text x="600" y="660" class="term-text">• <tspan style="font-weight: bold;">세로조화</tspan>: 세로쓰기에 최적화</text>
    <text x="600" y="675" class="term-text">• <tspan style="font-weight: bold;">겹받침</tspan>: 두 개 이상의 종성 (ㄳ, ㄺ 등)</text>
    <text x="600" y="690" class="term-text">• <tspan style="font-weight: bold;">이음줄</tspan>: 단어 분리 표시 (-)</text>
    <text x="600" y="705" class="term-text">• <tspan style="font-weight: bold;">꺽쇠</tspan>: 인용 부호 (「」)</text>

    <!-- 디지털 용어 -->
    <text x="850" y="630" class="term-text">• <tspan style="font-weight: bold;">Hinting</tspan>: 화면 최적화</text>
    <text x="850" y="645" class="term-text">• <tspan style="font-weight: bold;">Ligature</tspan>: 합자 (fi → ﬁ)</text>
    <text x="850" y="660" class="term-text">• <tspan style="font-weight: bold;">Weight</tspan>: 굵기 (100~900)</text>
    <text x="850" y="675" class="term-text">• <tspan style="font-weight: bold;">Optical Size</tspan>: 광학 크기</text>
    <text x="850" y="690" class="term-text">• <tspan style="font-weight: bold;">OpenType</tspan>: 고급 기능</text>
    <text x="850" y="705" class="term-text">• <tspan style="font-weight: bold;">Variable</tspan>: 가변 글꼴</text>
  </g>
  
  <!-- 관계 표시 화살표들 -->
  <!-- Type → Typeface 화살표 -->
  <g>
    <path d="M 450 190 L 475 220" class="arrow" stroke-width="3" stroke="#f59e0b" opacity="0.7"/>
    <text x="435" y="215" class="term-text" style="fill: #f59e0b; font-size: 16px; text-anchor: middle;">포함</text>
  </g>
  
  <!-- Typeface → Font 화살표 -->
  <g>
    <path d="M 770 210 L 717 270" class="arrow" stroke-width="3" stroke="#3b82f6" opacity="0.7"/>
    <text x="725" y="240" class="term-text" style="fill: #3b82f6; font-size: 16px; text-anchor: middle;">구체화</text>
  </g>
  
  <!-- Font → Typography 화살표 -->
  <g>
    <path d="M 450 435 L 500 385" class="arrow" stroke-width="3" stroke="#059669" opacity="0.7"/>
    <text x="455" y="415" class="term-text" style="fill: #059669; font-size: 16px; text-anchor: middle;">활용</text>
  </g>
  
  <!-- Typography → Type 순환 화살표 (점선) -->
  <g>
    <path d="M 750 400 Q 950 280 450 180" class="arrow" stroke-width="2" stroke="#db2777" opacity="0.5" stroke-dasharray="5,5"/>
    <text x="750" y="295" class="term-text" style="fill: #db2777; font-size: 16px; text-anchor: middle;">영향</text>
    
    <!-- 영향 설명 박스 -->
    <g transform="translate(130, 30)">
      <rect x="650" y="240" width="140" height="55" rx="5" fill="#ffffff" stroke="#db2777" stroke-width="1" opacity="0.95"/>
      <text x="720" y="255" class="term-text" style="fill: #db2777; font-size: 10px; text-anchor: middle; font-weight: bold;">순환 관계</text>
      <text x="720" y="267" class="term-text" style="fill: #9d174d; font-size: 9px; text-anchor: middle;">타이포그래피 트렌드가</text>
      <text x="720" y="278" class="term-text" style="fill: #9d174d; font-size: 9px; text-anchor: middle;">새로운 활자 개발을 유도</text>
      <text x="720" y="289" class="term-text" style="fill: #9d174d; font-size: 9px; text-anchor: middle;">ex) 디지털 화면용 글꼴</text>
    </g>
  </g>
  
  <!-- 중앙 설명 텍스트 -->
  <text x="600" y="345" class="concept-desc" style="fill: #1e293b; font-weight: bold; font-size: 20px;">포함 관계</text>
  <text x="600" y="365" class="concept-desc" style="fill: #64748b; font-size: 11px;">바깥에서 안쪽으로</text>
  <text x="600" y="385" class="concept-desc" style="fill:rgb(30, 36, 43); font-size: 14px;">추상 → 구체</text>
</svg>