<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200">
  <defs>
    <style>
      .title-text { font-size: 36px; font-weight: bold; }
      .phase-text { font-size: 20px; font-weight: bold; }
      .description-text { font-size: 16px; }
      .universe-text { font-size: 28px; font-weight: bold; }
    </style>
    
    <!-- Space-time distortion gradients -->
    <radialGradient id="documentMass" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#dc2626;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7c2d12;stop-opacity:0.3" />
    </radialGradient>
    
    <radialGradient id="softwareMass" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#1d4ed8;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:0.3" />
    </radialGradient>
    
    <!-- Fusion explosion gradient -->
    <radialGradient id="fusionExplosion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="10%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#f59e0b;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#dc2626;stop-opacity:0.7" />
      <stop offset="70%" style="stop-color:#7c3aed;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:0.2" />
    </radialGradient>
    
    <!-- Gravitational waves -->
    <radialGradient id="gravitationalWave" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0" />
      <stop offset="40%" style="stop-color:#c084fc;stop-opacity:0.3" />
      <stop offset="60%" style="stop-color:#e879f9;stop-opacity:0.5" />
      <stop offset="80%" style="stop-color:#f0abfc;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#fdf4ff;stop-opacity:0" />
    </radialGradient>
    
    <!-- New universe gradient -->
    <radialGradient id="newUniverse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#06d6a0;stop-opacity:0.8" />
      <stop offset="40%" style="stop-color:#118ab2;stop-opacity:0.6" />
      <stop offset="60%" style="stop-color:#073b4c;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.2" />
    </radialGradient>
    
    <!-- Space-time distortion pattern -->
    <pattern id="spacetimeGrid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 0 25 Q 25 25 50 25" stroke="#4c1d95" stroke-width="0.5" fill="none" opacity="0.3"/>
      <path d="M 25 0 Q 25 25 25 50" stroke="#4c1d95" stroke-width="0.5" fill="none" opacity="0.3"/>
    </pattern>
    
    <!-- Advanced filters -->
    <filter id="cosmicGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="superGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="25" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="wormhole" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="40" result="coloredBlur"/>
      <feTurbulence baseFrequency="0.02" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="20"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Deep space background -->
  <rect width="1600" height="1200" fill="url(#spacetimeGrid)"/>
  <rect width="1600" height="1200" fill="radial-gradient(circle, #0f0f23 0%, #000000 100%)" opacity="0.9"/>
  
  <!-- Distant stars -->
  <g opacity="0.6">
    <circle cx="100" cy="150" r="1.5" fill="#ffffff"/>
    <circle cx="1500" cy="200" r="1" fill="#ffffff"/>
    <circle cx="200" cy="1000" r="2" fill="#ffffff"/>
    <circle cx="1400" cy="900" r="1.5" fill="#ffffff"/>
    <circle cx="50" cy="600" r="1" fill="#ffffff"/>
    <circle cx="1550" cy="500" r="1.5" fill="#ffffff"/>
  </g>
  
  <!-- Title -->
  <text x="800" y="50" text-anchor="middle" font-family="Arial, sans-serif" class="title-text" fill="#ffffff" filter="url(#cosmicGlow)">
    중력파 융합: 새로운 우주의 탄생
  </text>
  
  <!-- Phase 1: Distant Orbits -->
  <g id="phase1" transform="translate(200, 300)">
    <!-- Document World -->
    <circle cx="0" cy="0" r="80" fill="url(#documentMass)" filter="url(#cosmicGlow)"/>
    <g transform="translate(0, 0)">
      <!-- Document symbols orbiting -->
      <g transform="rotate(0)">
        <circle cx="50" cy="0" r="8" fill="#fbbf24" opacity="0.8"/>
        <text x="50" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#000" font-weight="bold">DOC</text>
      </g>
      <g transform="rotate(120)">
        <circle cx="50" cy="0" r="6" fill="#f97316" opacity="0.6"/>
        <text x="50" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#000">MD</text>
      </g>
      <g transform="rotate(240)">
        <circle cx="50" cy="0" r="6" fill="#dc2626" opacity="0.6"/>
        <text x="50" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#fff">PDF</text>
      </g>
    </g>
    <text x="0" y="110" text-anchor="middle" font-family="Arial, sans-serif" class="phase-text" fill="#f97316">
      문서 세계
    </text>
  </g>
  
  <!-- Software World at Phase 1 -->
  <g id="software1" transform="translate(1000, 300)">
    <circle cx="0" cy="0" r="80" fill="url(#softwareMass)" filter="url(#cosmicGlow)"/>
    <g transform="translate(0, 0)">
      <!-- Software symbols -->
      <g transform="rotate(0)">
        <circle cx="50" cy="0" r="8" fill="#0ea5e9" opacity="0.8"/>
        <text x="50" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#000" font-weight="bold">AI</text>
      </g>
      <g transform="rotate(90)">
        <circle cx="50" cy="0" r="6" fill="#1d4ed8" opacity="0.6"/>
        <text x="50" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#fff">ML</text>
      </g>
      <g transform="rotate(180)">
        <circle cx="50" cy="0" r="6" fill="#1e40af" opacity="0.6"/>
        <text x="50" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#fff">LLM</text>
      </g>
      <g transform="rotate(270)">
        <circle cx="50" cy="0" r="6" fill="#1e3a8a" opacity="0.6"/>
        <text x="50" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#fff">GPT</text>
      </g>
    </g>
    <text x="0" y="110" text-anchor="middle" font-family="Arial, sans-serif" class="phase-text" fill="#0ea5e9">
      소프트웨어 세계
    </text>
  </g>
  
  <!-- Phase 2: Spiral Approach -->
  <g id="phase2" transform="translate(400, 500)">
    <!-- Spiral trajectory -->
    <path d="M 0 0 Q 100 -50 200 0 Q 300 50 400 0" 
          stroke="#a855f7" stroke-width="3" fill="none" opacity="0.7" stroke-dasharray="10,5" filter="url(#cosmicGlow)"/>
    
    <!-- Moving document mass -->
    <circle cx="100" cy="-25" r="60" fill="url(#documentMass)" opacity="0.8" filter="url(#cosmicGlow)"/>
    <text x="100" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">
      DOC
    </text>
    
    <!-- Moving software mass -->
    <circle cx="300" cy="25" r="60" fill="url(#softwareMass)" opacity="0.8" filter="url(#cosmicGlow)"/>
    <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">
      AI
    </text>
    
    <!-- Early gravitational waves -->
    <circle cx="200" cy="0" r="150" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.3"/>
    <circle cx="200" cy="0" r="200" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.2"/>
    
    <text x="200" y="80" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="#c084fc">
      나선 접근 - 중력파 발생 시작
    </text>
  </g>
  
  <!-- Phase 3: Critical Merger -->
  <g id="phase3" transform="translate(800, 600)">
    <!-- Intense gravitational waves -->
    <g opacity="0.6">
      <circle cx="0" cy="0" r="100" fill="url(#gravitationalWave)" filter="url(#cosmicGlow)"/>
      <circle cx="0" cy="0" r="150" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.5"/>
      <circle cx="0" cy="0" r="200" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.4"/>
      <circle cx="0" cy="0" r="250" fill="none" stroke="#e879f9" stroke-width="1" opacity="0.3"/>
      <circle cx="0" cy="0" r="300" fill="none" stroke="#f0abfc" stroke-width="1" opacity="0.2"/>
    </g>
    
    <!-- Merging masses -->
    <ellipse cx="-20" cy="-10" rx="40" ry="30" fill="url(#documentMass)" opacity="0.9" transform="rotate(-30)" filter="url(#cosmicGlow)"/>
    <ellipse cx="20" cy="10" rx="40" ry="30" fill="url(#softwareMass)" opacity="0.9" transform="rotate(30)" filter="url(#cosmicGlow)"/>
    
    <!-- Event horizon -->
    <circle cx="0" cy="0" r="25" fill="#000000" opacity="0.8"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    
    <text x="0" y="120" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="#e879f9">
      임계점 - 시공간 극도 왜곡
    </text>
  </g>
  
  <!-- Phase 4: The Big Bang Fusion -->
  <g id="phase4" transform="translate(800, 350)">
    <!-- Massive explosion -->
    <circle cx="0" cy="0" r="120" fill="url(#fusionExplosion)" filter="url(#superGlow)"/>
    
    <!-- Energy jets -->
    <line x1="0" y1="0" x2="0" y2="-200" stroke="#ffffff" stroke-width="8" opacity="0.8" filter="url(#superGlow)"/>
    <line x1="0" y1="0" x2="0" y2="200" stroke="#ffffff" stroke-width="8" opacity="0.8" filter="url(#superGlow)"/>
    <line x1="0" y1="0" x2="-150" y2="0" stroke="#fbbf24" stroke-width="6" opacity="0.7" filter="url(#superGlow)"/>
    <line x1="0" y1="0" x2="150" y2="0" stroke="#fbbf24" stroke-width="6" opacity="0.7" filter="url(#superGlow)"/>
    
    <!-- Radiating energy bursts -->
    <g opacity="0.8">
      <line x1="0" y1="0" x2="100" y2="-100" stroke="#f59e0b" stroke-width="4" filter="url(#cosmicGlow)"/>
      <line x1="0" y1="0" x2="100" y2="100" stroke="#f59e0b" stroke-width="4" filter="url(#cosmicGlow)"/>
      <line x1="0" y1="0" x2="-100" y2="-100" stroke="#f59e0b" stroke-width="4" filter="url(#cosmicGlow)"/>
      <line x1="0" y1="0" x2="-100" y2="100" stroke="#f59e0b" stroke-width="4" filter="url(#cosmicGlow)"/>
    </g>
    
    <!-- Massive gravitational waves -->
    <g opacity="0.4">
      <circle cx="0" cy="0" r="200" fill="none" stroke="#a855f7" stroke-width="4"/>
      <circle cx="0" cy="0" r="300" fill="none" stroke="#c084fc" stroke-width="3"/>
      <circle cx="0" cy="0" r="400" fill="none" stroke="#e879f9" stroke-width="2"/>
      <circle cx="0" cy="0" r="500" fill="none" stroke="#f0abfc" stroke-width="1"/>
    </g>
    
    <!-- Central fusion core -->
    <circle cx="0" cy="0" r="30" fill="#ffffff" filter="url(#wormhole)"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1e1b4b" font-weight="bold">
      FUSION
    </text>
    
    <text x="0" y="160" text-anchor="middle" font-family="Arial, sans-serif" class="phase-text" fill="#fbbf24" filter="url(#cosmicGlow)">
      🌟 융합 폭발 순간 🌟
    </text>
  </g>
  
  <!-- Phase 5: New Universe Born -->
  <g id="phase5" transform="translate(1200, 500)">
    <!-- New hybrid entity -->
    <circle cx="0" cy="0" r="90" fill="url(#newUniverse)" filter="url(#superGlow)"/>
    
    <!-- Orbiting new creations -->
    <g transform="rotate(0)" opacity="0.8">
      <circle cx="120" cy="0" r="15" fill="#06d6a0" filter="url(#cosmicGlow)"/>
      <text x="120" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#000" font-weight="bold">Quarto</text>
    </g>
    <g transform="rotate(60)" opacity="0.8">
      <circle cx="120" cy="0" r="12" fill="#118ab2" filter="url(#cosmicGlow)"/>
      <text x="120" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff" font-weight="bold">AI-DOC</text>
    </g>
    <g transform="rotate(120)" opacity="0.8">
      <circle cx="120" cy="0" r="12" fill="#073b4c" filter="url(#cosmicGlow)"/>
      <text x="120" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff" font-weight="bold">NLP</text>
    </g>
    <g transform="rotate(180)" opacity="0.8">
      <circle cx="120" cy="0" r="10" fill="#fbbf24" filter="url(#cosmicGlow)"/>
      <text x="120" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#000">LLM</text>
    </g>
    <g transform="rotate(240)" opacity="0.8">
      <circle cx="120" cy="0" r="10" fill="#06d6a0" filter="url(#cosmicGlow)"/>
      <text x="120" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#000">GPT</text>
    </g>
    <g transform="rotate(300)" opacity="0.8">
      <circle cx="120" cy="0" r="10" fill="#118ab2" filter="url(#cosmicGlow)"/>
      <text x="120" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#fff">Claude</text>
    </g>
    
    <!-- Central new entity -->
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#073b4c" font-weight="bold">
      AI 융합 우주
    </text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#073b4c">
      Document + Software
    </text>
    
    <text x="0" y="130" text-anchor="middle" font-family="Arial, sans-serif" class="phase-text" fill="#06d6a0">
      새로운 생태계 탄생
    </text>
  </g>
  
  <!-- Timeline arrows -->
  <g opacity="0.6">
    <path d="M 350 400 L 400 450" stroke="#a855f7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M 650 550 L 700 400" stroke="#e879f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M 950 400 L 1100 450" stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff"/>
    </marker>
  </defs>
  
  <!-- Cosmic impact description -->
  <text x="800" y="1100" text-anchor="middle" font-family="Arial, sans-serif" class="universe-text" fill="#fbbf24" filter="url(#cosmicGlow)">
    🌌 우주적 규모의 패러다임 융합 🌌
  </text>
  <text x="800" y="1130" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="#ffffff" opacity="0.8">
    두 세계의 충돌로 탄생한 새로운 차원: 자연어 하나로 모든 것을 창조하는 시대
  </text>
  
  <!-- Phase labels -->
  <g font-family="Arial, sans-serif" class="description-text" fill="#c084fc" opacity="0.7">
    <text x="200" y="280" text-anchor="middle">Phase 1: 독립 궤도</text>
    <text x="600" y="480" text-anchor="middle">Phase 2: 나선 접근</text>
    <text x="800" y="730" text-anchor="middle">Phase 3: 임계점</text>
    <text x="800" y="250" text-anchor="middle">Phase 4: 융합 폭발</text>
    <text x="1200" y="480" text-anchor="middle">Phase 5: 새 우주</text>
  </g>
</svg>