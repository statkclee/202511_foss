<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style><![CDATA[
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 36px; font-weight: 900; fill: #f8fafc; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #cbd5e1; }
      .h1 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #ffffff; }
      .h2 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #f1f5f9; }
      .p { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #e5e7eb; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #cbd5e1; }
      .metric { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: 800; fill: #34d399; }
      .axis { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #9ca3af; }
    ]]></style>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Occupation gradients -->
    <linearGradient id="gradTech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="gradArt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="gradScience" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="gradEngineering" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="gradEducation" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="gradOthers" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Effects -->
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Header -->
  <text x="600" y="50" text-anchor="middle" class="title">직업군별 AI 사용률 분석</text>
  <text x="600" y="80" text-anchor="middle" class="subtitle">AI Usage Rate by Occupation (Claude AI Data)</text>

  <!-- Chart area -->
  <g transform="translate(100,130)">
    <!-- Chart background -->
    <rect x="0" y="0" width="1000" height="500" fill="#1f2937" opacity="0.3" rx="10"/>
    
    <!-- Grid lines -->
    <g stroke="#374151" stroke-width="1" opacity="0.3">
      <line x1="0" y1="100" x2="1000" y2="100"/>
      <line x1="0" y1="200" x2="1000" y2="200"/>
      <line x1="0" y1="300" x2="1000" y2="300"/>
      <line x1="0" y1="400" x2="1000" y2="400"/>
      <line x1="150" y1="0" x2="150" y2="500"/>
      <line x1="300" y1="0" x2="300" y2="500"/>
      <line x1="450" y1="0" x2="450" y2="500"/>
      <line x1="600" y1="0" x2="600" y2="500"/>
      <line x1="750" y1="0" x2="750" y2="500"/>
      <line x1="900" y1="0" x2="900" y2="500"/>
    </g>
    
    <!-- Y-axis labels -->
    <text x="-10" y="500" text-anchor="end" class="axis">0</text>
    <text x="-10" y="400" text-anchor="end" class="axis">2</text>
    <text x="-10" y="300" text-anchor="end" class="axis">4</text>
    <text x="-10" y="200" text-anchor="end" class="axis">6</text>
    <text x="-10" y="100" text-anchor="end" class="axis">8</text>
    <text x="-10" y="0" text-anchor="end" class="axis">10+</text>
    
    <!-- Y-axis title -->
    <text x="-50" y="250" text-anchor="middle" class="axis" transform="rotate(-90, -50, 250)">사용률 비율</text>
    
    <!-- Bars -->
    <!-- Computer & Math: 10.9 -->
    <g>
      <rect x="50" y="46" width="100" height="454" rx="8" fill="url(#gradTech)" filter="url(#shadow)"/>
      <text x="100" y="35" text-anchor="middle" class="metric">10.9</text>
      <text x="100" y="520" text-anchor="middle" class="small">컴퓨터 및</text>
      <text x="100" y="535" text-anchor="middle" class="small">수학</text>
      <text x="100" y="555" text-anchor="middle" class="small">Computer &amp;</text>
      <text x="100" y="570" text-anchor="middle" class="small">Math</text>
    </g>
    
    <!-- Arts & Entertainment: 7.8 -->
    <g>
      <rect x="200" y="148" width="100" height="352" rx="8" fill="url(#gradArt)" filter="url(#shadow)"/>
      <text x="250" y="137" text-anchor="middle" class="metric">7.8</text>
      <text x="250" y="520" text-anchor="middle" class="small">예술, 디자인,</text>
      <text x="250" y="535" text-anchor="middle" class="small">엔터테인먼트</text>
      <text x="250" y="555" text-anchor="middle" class="small">Arts &amp; Design</text>
      <text x="250" y="570" text-anchor="middle" class="small">Entertainment</text>
    </g>
    
    <!-- Life Sciences: 7.1 -->
    <g>
      <rect x="350" y="162" width="100" height="338" rx="8" fill="url(#gradScience)" filter="url(#shadow)"/>
      <text x="400" y="151" text-anchor="middle" class="metric">7.1</text>
      <text x="400" y="520" text-anchor="middle" class="small">생명과학,</text>
      <text x="400" y="535" text-anchor="middle" class="small">물리, 사회과학</text>
      <text x="400" y="555" text-anchor="middle" class="small">Life &amp; Physical</text>
      <text x="400" y="570" text-anchor="middle" class="small">Sciences</text>
    </g>
    
    <!-- Architecture & Engineering: 2.6 -->
    <g>
      <rect x="500" y="376" width="100" height="124" rx="8" fill="url(#gradEngineering)" filter="url(#shadow)"/>
      <text x="550" y="365" text-anchor="middle" class="metric">2.6</text>
      <text x="550" y="520" text-anchor="middle" class="small">건축 및 공학</text>
      <text x="550" y="535" text-anchor="middle" class="small">Architecture &amp;</text>
      <text x="550" y="555" text-anchor="middle" class="small">Engineering</text>
    </g>
    
    <!-- Education: 1.6 -->
    <g>
      <rect x="650" y="420" width="100" height="80" rx="8" fill="url(#gradEducation)" filter="url(#shadow)"/>
      <text x="700" y="409" text-anchor="middle" class="metric">1.6</text>
      <text x="700" y="520" text-anchor="middle" class="small">교육 및</text>
      <text x="700" y="535" text-anchor="middle" class="small">도서관</text>
      <text x="700" y="555" text-anchor="middle" class="small">Education &amp;</text>
      <text x="700" y="570" text-anchor="middle" class="small">Library</text>
    </g>
    
    <!-- Others: 0.4 -->
    <g>
      <rect x="800" y="480" width="100" height="20" rx="8" fill="url(#gradOthers)" filter="url(#shadow)"/>
      <text x="850" y="469" text-anchor="middle" class="metric">0.4</text>
      <text x="850" y="520" text-anchor="middle" class="small">기타 직업</text>
      <text x="850" y="535" text-anchor="middle" class="small">(87.6% 고용)</text>
      <text x="850" y="555" text-anchor="middle" class="small">Other Jobs</text>
      <text x="850" y="570" text-anchor="middle" class="small">(87.6% Employment)</text>
    </g>
  </g>

  <!-- Key Insights -->
  <g transform="translate(50,730)">
    <rect x="0" y="0" width="1100" height="50" rx="15" fill="#1f2937" opacity="0.8"/>
   
    <g transform="translate(50,30)" class="p">
      <text x="-30" y="0">• 컴퓨터/수학 분야가 압도적 사용률 (고용 3.4%, 프롬프트 37.2%)</text>
      <text x="370" y="0">• 창조적 지식노동 (예술, 과학)에서 높은 활용도</text>
      <text x="650" y="0">• 기타 직업군 (87.6% 고용)은 아직 제한적 활용 → 향후 확산 잠재력 거대</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(1000,140)">
    <rect x="0" y="0" width="180" height="220" rx="10" fill="#1f2937" opacity="0.8"/>
    <text x="70" y="25" text-anchor="middle" class="h2">범례</text>
    
    <g transform="translate(20,40)">
      <rect x="0" y="0" width="15" height="15" fill="url(#gradTech)"/>
      <text x="20" y="12" class="small">고사용률</text>
      
      <rect x="0" y="25" width="15" height="15" fill="url(#gradArt)"/>
      <text x="20" y="37" class="small">높은사용률</text>
      
      <rect x="0" y="50" width="15" height="15" fill="url(#gradScience)"/>
      <text x="20" y="62" class="small">높은사용률</text>
      
      <rect x="0" y="75" width="15" height="15" fill="url(#gradEngineering)"/>
      <text x="20" y="87" class="small">중간사용률</text>
      
      <rect x="0" y="100" width="15" height="15" fill="url(#gradEducation)"/>
      <text x="20" y="112" class="small">낮은사용률</text>
      
      <rect x="0" y="125" width="15" height="15" fill="url(#gradOthers)"/>
      <text x="20" y="137" class="small">매우낮음</text>
      
      <text x="0" y="165" class="small">비율 = 프롬프트비중/고용비중</text>
    </g>
  </g>

  <!-- Data source -->
  <text x="1020" y="110" text-anchor="middle" class="small">출처: Anthropic 경제 지수 (Claude AI 프롬프트 제출 데이터 분석)</text>
</svg>