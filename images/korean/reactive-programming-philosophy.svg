<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="700" viewBox="0 100 1400 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clean Gradients -->
    <linearGradient id="reactiveGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FBBF24" />
      <stop offset="50%" style="stop-color:#F59E0B" />
      <stop offset="100%" style="stop-color:#D97706" />
    </linearGradient>
    
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6" />
      <stop offset="50%" style="stop-color:#8B5CF6" />
      <stop offset="100%" style="stop-color:#EC4899" />
    </linearGradient>
    
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669" />
      <stop offset="100%" style="stop-color:#10B981" />
    </linearGradient>
    
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC2626" />
      <stop offset="100%" style="stop-color:#EF4444" />
    </linearGradient>
    
    <!-- Clean Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    
    <!-- Arrow Markers -->
    <marker id="flowArrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="url(#flowGrad)"/>
    </marker>
    <marker id="greenArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10B981"/>
    </marker>
    <marker id="redArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1000" fill="#F8FAFC"/>
  
  <!-- Statistics -->
  <g id="reactive-stat" transform="translate(0, 50)">
    <rect x="200" y="90" width="1000" height="50" rx="10" fill="#1E293B" stroke="url(#flowGrad)" stroke-width="2"/>
    <text x="700" y="115" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="14" font-weight="bold" fill="#F1F5F9">
      💥 실제 혁신: 전 세계 수십만 명의 데이터 과학자 사용 | 개발시간 30-50% 단축 | 대시보드 제작 10배 빠르게 💥
    </text>
    <text x="700" y="135" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="12" fill="#FBBF24" font-style="italic">
      "반응형 프로그래밍은 데이터 분석의 미래다" - Hadley Wickham
    </text>
  </g>

  <!-- Main Reactive Flow Diagram -->
  <g id="reactive-flow" transform="translate(0, 170)">
    
    <!-- Input Source -->
    <rect x="120" y="80" width="140" height="60" rx="10" fill="#10B981" filter="url(#shadow)"/>
    <text x="190" y="100" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      사용자 입력
    </text>
    <text x="190" y="125" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#F0FDF4">
      input$slider
    </text>
    
    <!-- Magic Reactive Function -->
    <rect x="350" y="60" width="550" height="80" rx="15" fill="#F59E0B" filter="url(#glow)"/>
    <text x="600" y="85" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
      🎯 핵심: 한 줄의 마법
    </text>
    <rect x="370" y="95" width="520" height="30" rx="5" fill="#D97706"/>
    <text x="630" y="115" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#FEF3C7" font-weight="bold">
      filtered &lt;- reactive({ data() %&gt;% filter(value &gt; input$slider) })
    </text>
    
    <!-- Input Arrow -->
    <path d="M 250 110 L 350 110" stroke="#10B981" stroke-width="4" marker-end="url(#greenArrow)"/>
    
    <!-- Multiple Outputs with Radial Arrows -->
    <g id="outputs" transform="translate(50, 0)">
      <!-- Chart 1 -->
      <rect x="1020" y="40" width="120" height="50" rx="8" fill="#EF4444" filter="url(#shadow)"/>
      <text x="1080" y="60" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="12" font-weight="bold" fill="white">차트 1</text>
      <text x="1080" y="75" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FEF2F2">renderPlot()</text>
      
      <!-- Chart 2 -->
      <rect x="1020" y="100" width="120" height="50" rx="8" fill="#EF4444" filter="url(#shadow)"/>
      <text x="1080" y="120" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="12" font-weight="bold" fill="white">차트 2</text>
      <text x="1080" y="135" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FEF2F2">renderPlot()</text>
      
      <!-- Table -->
      <rect x="1020" y="160" width="120" height="50" rx="8" fill="#EF4444" filter="url(#shadow)"/>
      <text x="1080" y="180" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="12" font-weight="bold" fill="white">테이블</text>
      <text x="1080" y="195" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FEF2F2">renderTable()</text>
    </g>
    
    <!-- Radial Output Arrows -->
    <path d="M 910 100 L 1070 65" stroke="#EF4444" stroke-width="3" marker-end="url(#redArrow)"/>
    <path d="M 910 100 L 1070 125" stroke="#EF4444" stroke-width="3" marker-end="url(#redArrow)"/>
    <path d="M 910 100 L 1070 185" stroke="#EF4444" stroke-width="3" marker-end="url(#redArrow)"/>
    
    <!-- Automatic Update Indicator -->
    <text x="960" y="75" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="15" fill="#EF4444" font-weight="bold">
      자동 업데이트
    </text>
    <text x="960" y="170" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="15" fill="#EF4444" font-weight="bold">
      모두 동시에!
    </text>
  </g>

  <!-- Before vs After Code Comparison -->
  <g id="code-comparison" transform="translate(0, 350)">

    <!-- Traditional Way (Before) -->
    <rect x="50" y="50" width="600" height="250" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="350" y="80" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="bold" fill="#DC2626">
      전통적 방식: 수동 연결 (10+ 줄)
    </text>
    
    <rect x="70" y="90" width="560" height="180" rx="5" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
    <text x="85" y="110" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7F1D1D"># 각 출력마다 동일한 로직 반복 (DRY 위반)</text>
    <text x="85" y="130" font-family="'JetBrains Mono', monospace" font-size="11" fill="#991B1B">output$plot1 &lt;- renderPlot({</text>
    <text x="100" y="145" font-family="'JetBrains Mono', monospace" font-size="10" fill="#991B1B">  data &lt;- loadData()</text>
    <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="10" fill="#991B1B">  filtered &lt;- subset(data, value > input$slider)</text>
    <text x="100" y="175" font-family="'JetBrains Mono', monospace" font-size="10" fill="#991B1B">  ggplot(filtered) + geom_point()</text>
    <text x="85" y="190" font-family="'JetBrains Mono', monospace" font-size="11" fill="#991B1B">})</text>
    <text x="85" y="210" font-family="'JetBrains Mono', monospace" font-size="11" fill="#991B1B">output$plot2 &lt;- renderPlot({</text>
    <text x="100" y="225" font-family="'JetBrains Mono', monospace" font-size="10" fill="#991B1B">  data &lt;- loadData()  # 또 로드?</text>
    <text x="100" y="240" font-family="'JetBrains Mono', monospace" font-size="10" fill="#991B1B">  filtered &lt;- subset(data, value > input$slider)  # 또 필터링?</text>
    <text x="100" y="255" font-family="'JetBrains Mono', monospace" font-size="10" fill="#991B1B">  barplot(table(filtered$category))</text>
    <text x="85" y="270" font-family="'JetBrains Mono', monospace" font-size="11" fill="#991B1B">})</text>
    
    <!-- Problems -->
    <text x="350" y="295" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#991B1B" font-weight="bold">
      문제: 같은 코드 3번 반복, 성능 낭비, DRY 원칙 위반
    </text>
    
    <!-- Reactive Way (After) -->
    <rect x="750" y="50" width="600" height="250" rx="10" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
    <text x="1050" y="80" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="18" font-weight="bold" fill="#065F46">
      Reactive 방식: 스마트 재사용 (3줄!)
    </text>
    
    <rect x="770" y="90" width="560" height="180" rx="5" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/>
    <text x="785" y="110" font-family="'JetBrains Mono', monospace" font-size="10" fill="#065F46"># 한 번만 정의하면 모든 곳에서 자동 재사용</text>
    <text x="785" y="130" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F59E0B" font-weight="bold">data &lt;- reactive({ loadData() })</text>
    <text x="785" y="150" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F59E0B" font-weight="bold">filtered &lt;- reactive({ subset(data(), value > input$slider) })</text>
    <text x="785" y="175" font-family="'JetBrains Mono', monospace" font-size="10" fill="#065F46"># 모든 출력이 자동으로 공유</text>
    <text x="785" y="195" font-family="'JetBrains Mono', monospace" font-size="11" fill="#065F46">output$plot1 &lt;- renderPlot({ ggplot(filtered()) + geom_point() })</text>
    <text x="785" y="215" font-family="'JetBrains Mono', monospace" font-size="11" fill="#065F46">output$plot2 &lt;- renderPlot({ barplot(table(filtered()$category)) })</text>
    <text x="785" y="235" font-family="'JetBrains Mono', monospace" font-size="11" fill="#065F46">output$table &lt;- renderTable({ summary(filtered()) })</text>
    <text x="785" y="260" font-family="'JetBrains Mono', monospace" font-size="10" fill="#065F46"># 데이터 1번 로드, 필터링 1번, 자동 캐싱!</text>
    
    <!-- Benefits -->
    <text x="1050" y="290" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#065F46" font-weight="bold">
      혁신: DRY 원칙 준수, 성능 최적화, 버그 방지
    </text>
  </g>

    
  <!-- Final Message -->
  <g id="conclusion" transform="translate(0, 670)">
    <rect x="200" y="0" width="1000" height="100" rx="15" fill="#1E293B" stroke="url(#flowGrad)" stroke-width="2"/>
    <text x="700" y="35" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#reactiveGold)">
      Reactive: 관계를 정의하면 시스템이 실행한다
    </text>
    <text x="700" y="65" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="16" fill="#CBD5E1">
      개발자는 "무엇"을 원하는지만 선언하고, Reactive가 "어떻게"를 해결한다
    </text>
    <text x="700" y="85" text-anchor="middle" font-family="'Noto Sans KR', Arial, sans-serif" font-size="14" fill="#94A3B8" font-style="italic">
      결과: 더 적은 코드, 더 적은 버그, 더 나은 개발 경험
    </text>
  </g>
</svg>