<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="450" viewBox="0 150 1200 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="timelineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="era1979" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#92400E" />
      <stop offset="100%" style="stop-color:#B45309" />
    </linearGradient>
    <linearGradient id="era1985" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#065F46" />
      <stop offset="100%" style="stop-color:#059669" />
    </linearGradient>
    <linearGradient id="era2012" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF" />
      <stop offset="100%" style="stop-color:#2563EB" />
    </linearGradient>
    <linearGradient id="era2018" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7C2D12" />
      <stop offset="100%" style="stop-color:#DC2626" />
    </linearGradient>
    <linearGradient id="era2022" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#581C87" />
      <stop offset="100%" style="stop-color:#8B5CF6" />
    </linearGradient>
    <linearGradient id="era2023" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#BE185D" />
      <stop offset="100%" style="stop-color:#EC4899" />
    </linearGradient>
    <linearGradient id="eraFuture" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#065F46" />
      <stop offset="100%" style="stop-color:#10B981" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="5" markerHeight="3.5" refX="5" refY="1.75" orient="auto">
      <polygon points="0 0, 5 1.75, 0 3.5" fill="#6B7280" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#timelineGradient)"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="Arial, sans-serif">
    <tspan font-size="28" font-weight="bold" fill="#1F2937">반응형 문서 진화: 45년의 혁신 여정</tspan>
  </text>

  <!-- Main timeline -->
  <line x1="80" y1="350" x2="1120" y2="350" stroke="#374151" stroke-width="6" opacity="0.4"/>
  
  <!-- Timeline arrow -->
  <line x1="1120" y1="350" x2="1150" y2="350" stroke="#6B7280" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="1110" y="300" font-family="Arial, sans-serif" font-size="28" fill="#6B7280" font-weight="bold">미래</text>

  <!-- 1979 VisiCalc -->
  <g id="era-1979" transform="translate(0,70)">
    <rect x="60" y="120" width="120" height="100" rx="12" fill="url(#era1979)" filter="url(#shadow)" opacity="0.9"/>
    <text x="120" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">1979</text>
    <text x="120" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">VisiCalc</text>
    <text x="120" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">최초</text>
    <text x="120" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">반응형 시스템</text>
    <line x1="120" y1="220" x2="120" y2="300" stroke="#92400E" stroke-width="3" stroke-dasharray="5,5"/>
  </g>    

    <!-- Icon: Spreadsheet grid (larger) -->
    <circle cx="120" cy="350" r="12" fill="url(#era1979)" filter="url(#shadow)"/>

    <rect x="105" y="370" width="30" height="22" fill="none" stroke="#92400E" stroke-width="3"/>
    <line x1="115" y1="370" x2="115" y2="392" stroke="#92400E" stroke-width="2"/>
    <line x1="120" y1="370" x2="120" y2="392" stroke="#92400E" stroke-width="2"/>
    <line x1="125" y1="370" x2="125" y2="392" stroke="#92400E" stroke-width="2"/>
    <line x1="105" y1="378" x2="135" y2="378" stroke="#92400E" stroke-width="2"/>
    <line x1="105" y1="384" x2="135" y2="384" stroke="#92400E" stroke-width="2"/>
  

  <!-- 1985 Excel -->
  <g id="era-1985"  transform="translate(0,70)">
    <rect x="190" y="120" width="120" height="100" rx="12" fill="url(#era1985)" filter="url(#shadow)" opacity="0.9"/>
    <text x="250" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">1985</text>
    <text x="250" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Excel</text>
    <text x="250" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">반응형</text>
    <text x="250" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">대중화</text>
    <line x1="250" y1="220" x2="250" y2="270" stroke="#059669" stroke-width="3" stroke-dasharray="5,5"/>
  </g>
    
    <!-- Icon: Chart (larger) -->
    <circle cx="250" cy="350" r="12" fill="url(#era1985)" filter="url(#shadow)"/>
    <rect x="230" y="370" width="40" height="25" fill="#059669" opacity="0.2"/>
    <polyline points="235,390 240,380 245,385 255,375 260,380 265,370" fill="none" stroke="#059669" stroke-width="3"/>

  <!-- 2012 R Shiny -->
  <g id="era-2012"  transform="translate(0,70)">
    <rect x="390" y="120" width="120" height="100" rx="12" fill="url(#era2012)" filter="url(#shadow)" opacity="0.9"/>
    <text x="450" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">2012</text>
    <text x="450" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">R Shiny</text>
    <text x="450" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">통계 웹앱</text>
    <text x="450" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">혁명</text>
    <line x1="450" y1="220" x2="450" y2="270" stroke="#2563EB" stroke-width="3" stroke-dasharray="5,5"/>
  </g>
    
    <!-- Icon: Web browser with R (larger) -->
    <circle cx="450" cy="350" r="12" fill="url(#era2012)" filter="url(#shadow)"/>
    <rect x="430" y="370" width="40" height="25" rx="4" fill="none" stroke="#2563EB" stroke-width="3"/>
    <rect x="430" y="370" width="40" height="8" fill="#2563EB" opacity="0.3"/>
    <text x="450" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2563EB">R</text>

  <!-- 2018 Multi-platform era -->
  <g id="era-2018"  transform="translate(0,70)">
    <rect x="570" y="120" width="160" height="100" rx="12" fill="url(#era2018)" filter="url(#shadow)" opacity="0.9"/>
    <text x="650" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">2018</text>
    <text x="650" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Streamlit + Observable</text>
    <text x="650" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">다양한 언어</text>
    <text x="650" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">반응형 지원</text>
    <line x1="650" y1="220" x2="650" y2="270" stroke="#DC2626" stroke-width="3" stroke-dasharray="5,5"/>
  </g>
    
    <!-- Icon: Multiple language symbols (larger) -->
    <circle cx="650" cy="350" r="12" fill="url(#era2018)" filter="url(#shadow)"/>
    <circle cx="635" cy="380" r="12" fill="#DC2626" opacity="0.3"/>
    <text x="635" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#DC2626">Py</text>
    <circle cx="665" cy="380" r="12" fill="#DC2626" opacity="0.3"/>
    <text x="665" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#DC2626">JS</text>

  <!-- 2022 Quarto Integration -->
  <g id="era-2022"  transform="translate(0,70)">
    <rect x="790" y="120" width="100" height="100" rx="12" fill="url(#era2022)" filter="url(#shadow)" opacity="0.9"/>
    <text x="845" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">2022</text>
    <text x="845" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Quarto</text>
    <text x="845" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">문서-앱</text>
    <text x="845" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">경계 소멸</text>
    <line x1="850" y1="220" x2="850" y2="270" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="5,5"/>
  </g>

    <!-- Icon: Document with interactive elements (larger) -->
    <circle cx="850" cy="350" r="12" fill="url(#era2022)" filter="url(#shadow)"/>
    <rect x="830" y="370" width="25" height="30" rx="4" fill="none" stroke="#8B5CF6" stroke-width="3"/>
    <line x1="835" y1="378" x2="845" y2="378" stroke="#8B5CF6" stroke-width="2"/>
    <line x1="835" y1="385" x2="850" y2="385" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="842" cy="392" r="3" fill="#8B5CF6"/>


  <!-- 2023 AI Revolution -->
  <g id="era-2023" transform="translate(0,70)">
    <rect x="900" y="120" width="100" height="100" rx="12" fill="url(#era2023)" filter="url(#shadow)" opacity="0.9"/>
    <text x="950" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">2023</text>
    <text x="950" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">GPT-4</text>
    <text x="950" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">AI 생성</text>
    <text x="950" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">반응형 문서</text>
    <line x1="950" y1="220" x2="950" y2="270" stroke="#EC4899" stroke-width="3" stroke-dasharray="5,5"/>
  </g>
    
    <!-- Icon: AI brain (larger) -->
    <circle cx="950" cy="350" r="12" fill="url(#era2023)" filter="url(#shadow)"/>
    <circle cx="950" cy="380" r="15" fill="none" stroke="#EC4899" stroke-width="3"/>
    <path d="M 940 380 Q 950 370 960 380 Q 950 390 940 380" fill="none" stroke="#EC4899" stroke-width="3"/>
    <circle cx="945" cy="375" r="2" fill="#EC4899"/>
    <circle cx="955" cy="385" r="2" fill="#EC4899"/>

  <!-- Future -->
  <g id="era-future">
    <circle cx="1080" cy="350" r="12" fill="url(#eraFuture)" filter="url(#shadow)"/>
    <rect x="1020" y="420" width="120" height="100" rx="12" fill="url(#eraFuture)" filter="url(#shadow)" opacity="0.9"/>
    <text x="1080" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">2024+</text>
    <text x="1080" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">AI Native</text>
    <text x="1080" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">자연어 쿼리</text>
    <text x="1080" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">자동 인사이트</text>
    <line x1="1080" y1="420" x2="1080" y2="362" stroke="#10B981" stroke-width="3" stroke-dasharray="5,5"/>
    
    <!-- Icon: Sparkles (magic/AI) (larger) -->
    <g transform="translate(1080, 380)">
      <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#10B981"/>
      <path d="M 6,-12 L 7,-9 L 10,-8 L 7,-7 L 6,-4 L 5,-7 L 2,-8 L 5,-9 Z" fill="#10B981"/>
      <path d="M -6,12 L -5,9 L -2,8 L -5,7 L -6,4 L -7,7 L -10,8 L -7,9 Z" fill="#10B981"/>
    </g>
  </g>

  <!-- Key innovations text at bottom -->
  <g id="innovation-labels" transform = "translate(0, -120)">
    <text x="120" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400E">셀 공식 개념</text>
    <text x="120" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">A1 변경 → B1</text>
    <text x="120" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">자동 업데이트</text>

    <text x="250" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#059669">GUI 반응형</text>
    <text x="250" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">마우스 클릭으로</text>
    <text x="250" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">데이터 조작</text>    

    <text x="450" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563EB">웹 반응형</text>
    <text x="450" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">브라우저에서</text>
    <text x="450" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">실시간 상호작용</text>    

    <text x="650" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#DC2626">다중 언어</text>
    <text x="650" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Python, JavaScript</text>
    <text x="650" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">생태계</text>    

    <text x="850" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B5CF6">하이브리드</text>
    <text x="850" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">문서 + 앱 =</text>
    <text x="850" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">소스코드 하나</text>

    <text x="950" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#EC4899">AI 융합</text>
    <text x="950" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">그림→코드→앱</text>
    <text x="950" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">자동 생성</text>    

    <text x="1080" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#10B981">완전 자율</text>
    <text x="1080" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">"매출 분석해줘" → 완성된 대시보드</text>
  </g>

  <!-- Evolution arrows -->
  <g id="evolution-arrows">
    <path d="M 115 350 Q 215 330 245 350" fill="none" stroke="#6B7280" stroke-width="3" opacity="0.6" marker-end="url(#arrowhead)"/>
    <path d="M 250 350 Q 380 330 445 350" fill="none" stroke="#6B7280" stroke-width="3" opacity="0.6" marker-end="url(#arrowhead)"/>
    <path d="M 450 350 Q 580 330 645 350" fill="none" stroke="#6B7280" stroke-width="3" opacity="0.6" marker-end="url(#arrowhead)"/>
    <path d="M 650 350 Q 785 330 845 350" fill="none" stroke="#6B7280" stroke-width="3" opacity="0.6" marker-end="url(#arrowhead)"/>
    <path d="M 850 350 Q 880 330 945 350" fill="none" stroke="#6B7280" stroke-width="3" opacity="0.6" marker-end="url(#arrowhead)"/>
    <path d="M 950 350 Q 1045 330 1075 350" fill="none" stroke="#6B7280" stroke-width="3" opacity="0.6" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Subtitle -->
  <text x="550" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#6B7280" font-style="italic">
    단순한 셀 공식에서 AI가 생성하는 지능형 문서까지
  </text>
</svg>