<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000">
  <defs>
    <style>
      .title-text { font-size: 28px; font-weight: bold; }
      .subtitle-text { font-size: 16px; }
      .paradigm-title { font-size: 18px; font-weight: bold; }
      .layer-text { font-size: 12px; font-weight: bold; }
      .example-text { font-size: 11px; }
      .legend-title { font-size: 14px; font-weight: bold; }
      .legend-text { font-size: 12px; }
      .insight-text { font-size: 13px; }
      .center-text { font-size: 16px; font-weight: bold; }
    </style>
    
    <!-- Layer gradients for the four layers -->
    <linearGradient id="coreLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="applicationLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="socioLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="economicLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    
    <!-- Paradigm specific gradients -->
    <radialGradient id="mainframeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="pcGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="internetGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="aiGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1" />
    </radialGradient>
    
    <!-- Arrow markers -->
    <marker id="spiralArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#374151"/>
    </marker>
    
    <marker id="feedbackArrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#6b7280"/>
    </marker>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
    
    <!-- Glow filter for emphasis -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="1000" fill="#fefefe"/>
  
  <!-- Title and subtitle -->
  <text x="700" y="40" text-anchor="middle" font-family="Arial, sans-serif" class="title-text" fill="#1e293b">
    The Socio-Technical Co-Evolutionary Spiral
  </text>
  <text x="700" y="65" text-anchor="middle" font-family="Arial, sans-serif" class="subtitle-text" fill="#64748b">
    Beyond Push and Pull: A Multi-Layered Model of Computing Paradigm Evolution
  </text>
  <text x="700" y="85" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="#9ca3af" font-style="italic">
    "Innovation is ecological, not mechanical" - Each paradigm builds upon and subsumes previous ones
  </text>
  
  <!-- Central point and core -->
  <circle cx="700" cy="450" r="8" fill="#374151" filter="url(#glow)"/>
  <text x="700" y="455" text-anchor="middle" font-family="Arial, sans-serif" class="center-text" fill="#374151">
    Origin
  </text>
  
  <!-- Paradigm 1: Mainframe (Innermost spiral) -->
  <g id="mainframe-spiral">
    <!-- Mainframe spiral path -->
    <path d="M 700 450 
             Q 680 430, 660 440
             Q 630 460, 650 490
             Q 690 520, 730 500
             Q 770 470, 750 430
             Q 710 390, 660 410" 
          stroke="url(#mainframeGrad)" stroke-width="24" fill="none" opacity="0.8"/>
    
    <!-- Mainframe label -->
    <circle cx="680" cy="420" r="40" fill="url(#mainframeGrad)" filter="url(#shadow)"/>
    <text x="680" y="415" text-anchor="middle" font-family="Arial, sans-serif" class="paradigm-title" fill="white">
      MAINFRAME
    </text>
    <text x="680" y="430" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      1960s-1980s
    </text>
    
    <!-- Mainframe layer segments -->
    <rect x="580" y="380" width="80" height="15" fill="url(#economicLayer)" rx="3" stroke="#ffff00" stroke-width="2"/>
    <text x="620" y="392" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      IBM + Gov ⚡
    </text>
    
    <rect x="750" y="400" width="60" height="15" fill="url(#coreLayer)" rx="3"/>
    <text x="780" y="412" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      Transistors
    </text>
  </g>
  
  <!-- Paradigm 2: Personal Computer (Second spiral) -->
  <g id="pc-spiral">
    <!-- PC spiral path -->
    <path d="M 660 410
             Q 600 370, 560 400
             Q 510 450, 540 510
             Q 590 570, 650 550
             Q 710 530, 760 570
             Q 820 620, 850 560
             Q 870 490, 840 420
             Q 800 350, 730 370
             Q 650 390, 590 360" 
          stroke="url(#pcGrad)" stroke-width="32" fill="none" opacity="0.8"/>
    
    <!-- PC label -->
    <circle cx="580" cy="480" r="50" fill="url(#pcGrad)" filter="url(#shadow)"/>
    <text x="580" y="475" text-anchor="middle" font-family="Arial, sans-serif" class="paradigm-title" fill="white">
      PERSONAL
    </text>
    <text x="580" y="490" text-anchor="middle" font-family="Arial, sans-serif" class="paradigm-title" fill="white">
      COMPUTER
    </text>
    <text x="580" y="505" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      1977-1990s
    </text>
    
    <!-- PC layer segments -->
    <rect x="480" y="420" width="80" height="15" fill="url(#socioLayer)" rx="3" stroke="#ffff00" stroke-width="2"/>
    <text x="520" y="432" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      Homebrew Club ⚡
    </text>
    
    <rect x="750" y="580" width="70" height="15" fill="url(#applicationLayer)" rx="3"/>
    <text x="785" y="592" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      VisiCalc (1979)
    </text>
    
    <rect x="830" y="520" width="80" height="15" fill="url(#coreLayer)" rx="3"/>
    <text x="870" y="532" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      Microprocessor
    </text>
    
    <rect x="540" y="550" width="70" height="15" fill="url(#economicLayer)" rx="3"/>
    <text x="575" y="562" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      Apple II (1977)
    </text>
  </g>
  
  <!-- Paradigm 3: Internet (Third spiral) -->
  <g id="internet-spiral">
    <!-- Internet spiral path -->
    <path d="M 590 360
             Q 500 300, 430 350
             Q 350 420, 380 510
             Q 420 600, 500 640
             Q 590 680, 680 660
             Q 780 630, 860 680
             Q 940 730, 1000 680
             Q 1060 620, 1040 540
             Q 1010 450, 960 380
             Q 900 300, 820 320
             Q 730 350, 650 310
             Q 560 270, 480 300" 
          stroke="url(#internetGrad)" stroke-width="40" fill="none" opacity="0.8"/>
    
    <!-- Internet label -->
    <circle cx="450" cy="540" r="60" fill="url(#internetGrad)" filter="url(#shadow)"/>
    <text x="450" y="535" text-anchor="middle" font-family="Arial, sans-serif" class="paradigm-title" fill="white">
      INTERNET
    </text>
    <text x="450" y="555" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      1990s-2000s
    </text>
    
    <!-- Internet layer segments -->
    <rect x="320" y="480" width="90" height="15" fill="url(#economicLayer)" rx="3" stroke="#ffff00" stroke-width="2"/>
    <text x="365" y="492" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      ARPANET ⚡ (1969)
    </text>
    
    <rect x="960" y="650" width="70" height="15" fill="url(#coreLayer)" rx="3"/>
    <text x="995" y="662" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      TCP/IP Suite
    </text>
    
    <rect x="950" y="340" width="80" height="15" fill="url(#applicationLayer)" rx="3"/>
    <text x="990" y="352" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      Mosaic Browser
    </text>
    
    <rect x="420" y="620" width="70" height="15" fill="url(#socioLayer)" rx="3"/>
    <text x="455" y="632" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      Email Culture
    </text>
  </g>
  
  <!-- Paradigm 4: AI (Outermost spiral) -->
  <g id="ai-spiral">
    <!-- AI spiral path -->
    <path d="M 480 300
             Q 360 220, 260 290
             Q 150 380, 180 500
             Q 220 620, 320 700
             Q 430 780, 560 800
             Q 700 820, 840 800
             Q 980 780, 1100 820
             Q 1220 860, 1300 800
             Q 1380 720, 1360 620
             Q 1340 520, 1280 420
             Q 1220 320, 1140 250
             Q 1050 180, 940 200
             Q 820 220, 710 180
             Q 590 140, 470 180
             Q 350 220, 280 180" 
          stroke="url(#aiGrad)" stroke-width="48" fill="none" opacity="0.8"/>
    
    <!-- AI label -->
    <circle cx="300" cy="620" r="70" fill="url(#aiGrad)" filter="url(#shadow)"/>
    <text x="300" y="610" text-anchor="middle" font-family="Arial, sans-serif" class="paradigm-title" fill="white">
      ARTIFICIAL
    </text>
    <text x="300" y="630" text-anchor="middle" font-family="Arial, sans-serif" class="paradigm-title" fill="white">
      INTELLIGENCE
    </text>
    <text x="300" y="650" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      2020s-Present
    </text>
    
    <!-- AI layer segments -->
    <rect x="1240" y="380" width="90" height="15" fill="url(#coreLayer)" rx="3" stroke="#ffff00" stroke-width="2"/>
    <text x="1285" y="392" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      GPUs + Data ⚡
    </text>
    
    <rect x="1200" y="780" width="80" height="15" fill="url(#applicationLayer)" rx="3"/>
    <text x="1240" y="792" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      ChatGPT (2022)
    </text>
    
    <rect x="150" y="350" width="90" height="15" fill="url(#economicLayer)" rx="3"/>
    <text x="195" y="362" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      $100B+ Investment
    </text>
    
    <rect x="220" y="720" width="90" height="15" fill="url(#socioLayer)" rx="3"/>
    <text x="265" y="732" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="white">
      AI Ethics Debate
    </text>
  </g>
  
  <!-- Feedback loops and co-evolution arrows -->
  <g id="feedback-loops">
    <!-- Inter-layer feedback within paradigms -->
    <path d="M 600 400 Q 620 380 640 400" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#feedbackArrow)" stroke-dasharray="3,3"/>
    <path d="M 520 500 Q 540 480 560 500" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#feedbackArrow)" stroke-dasharray="3,3"/>
    <path d="M 380 580 Q 400 560 420 580" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#feedbackArrow)" stroke-dasharray="3,3"/>
    
    <!-- Cross-paradigm influences -->
    <path d="M 750 430 Q 800 450 820 490" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#feedbackArrow)" stroke-dasharray="5,5" opacity="0.7"/>
    <path d="M 840 420 Q 900 400 960 380" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#feedbackArrow)" stroke-dasharray="5,5" opacity="0.7"/>
  </g>
  
  <!-- Four Layer Legend -->
  <g id="layer-legend" transform="translate(50, 800)">
    <rect x="0" y="0" width="500" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" class="legend-title" fill="#1e293b">
      The Four Co-Evolutionary Layers
    </text>
    
    <!-- Core Technology Layer -->
    <rect x="20" y="40" width="20" height="15" fill="url(#coreLayer)"/>
    <text x="50" y="52" font-family="Arial, sans-serif" class="legend-text" fill="#374151" font-weight="bold">
      Core Technology Layer
    </text>
    <text x="50" y="68" font-family="Arial, sans-serif" class="example-text" fill="#6b7280">
      Scientific breakthroughs, hardware innovations, fundamental algorithms
    </text>
    
    <!-- Application & Ecosystem Layer -->
    <rect x="20" y="80" width="20" height="15" fill="url(#applicationLayer)"/>
    <text x="50" y="92" font-family="Arial, sans-serif" class="legend-text" fill="#374151" font-weight="bold">
      Application &amp; Ecosystem Layer
    </text>
    <text x="50" y="108" font-family="Arial, sans-serif" class="example-text" fill="#6b7280">
      Platforms, killer apps, developer ecosystems, network effects
    </text>
    
    <!-- Socio-Cultural Layer -->
    <rect x="20" y="120" width="20" height="15" fill="url(#socioLayer)"/>
    <text x="50" y="132" font-family="Arial, sans-serif" class="legend-text" fill="#374151" font-weight="bold">
      Socio-Cultural Layer
    </text>
    <text x="50" y="148" font-family="Arial, sans-serif" class="example-text" fill="#6b7280">
      User communities, cultural movements, new practices, social norms
    </text>
    
    <!-- Economic & Institutional Layer -->
    <rect x="260" y="40" width="20" height="15" fill="url(#economicLayer)"/>
    <text x="290" y="52" font-family="Arial, sans-serif" class="legend-text" fill="#374151" font-weight="bold">
      Economic &amp; Institutional Layer
    </text>
    <text x="290" y="68" font-family="Arial, sans-serif" class="example-text" fill="#6b7280">
      Business models, investment, institutional adoption, government policy
    </text>
    
    <!-- Feedback explanation -->
    <line x1="260" y1="90" x2="290" y2="90" stroke="#6b7280" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="300" y="95" font-family="Arial, sans-serif" class="legend-text" fill="#374151">
      Co-evolutionary feedback loops
    </text>
    
    <line x1="260" y1="110" x2="290" y2="110" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="300" y="115" font-family="Arial, sans-serif" class="legend-text" fill="#374151">
      Cross-paradigm influences
    </text>
    
    <!-- Ignition indicator explanation -->
    <rect x="260" y="125" width="20" height="12" fill="url(#socioLayer)" stroke="#ffff00" stroke-width="2" rx="2"/>
    <text x="290" y="135" font-family="Arial, sans-serif" class="legend-text" fill="#374151">
      ⚡ = Paradigm ignition point
    </text>
    
    <text x="250" y="155" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="#dc2626" font-weight="bold">
      Innovation can ignite from any layer - there is no predictable starting point
    </text>
    
    <text x="250" y="175" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="#374151">
      Each paradigm builds upon and subsumes previous ones, operating at larger scales
    </text>
  </g>
  
  <!-- Key Insights -->
  <g id="insights" transform="translate(900, 800)">
    <rect x="0" y="0" width="450" height="180" rx="10" fill="#f1f5f9" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="225" y="25" text-anchor="middle" font-family="Arial, sans-serif" class="legend-title" fill="#1e293b">
      Key Insights of the Spiral Model
    </text>
    
    <text x="20" y="50" font-family="Arial, sans-serif" class="insight-text" fill="#dc2626" font-weight="bold">
      • Non-Linear Evolution:
    </text>
    <text x="30" y="68" font-family="Arial, sans-serif" class="example-text" fill="#374151">
      Computing evolution is not push OR pull, but co-evolutionary emergence
    </text>
    
    <text x="20" y="90" font-family="Arial, sans-serif" class="insight-text" fill="#7c3aed" font-weight="bold">
      • Paradigm Integration:
    </text>
    <text x="30" y="108" font-family="Arial, sans-serif" class="example-text" fill="#374151">
      Old paradigms don't disappear - they become foundational infrastructure
    </text>
    
    <text x="20" y="130" font-family="Arial, sans-serif" class="insight-text" fill="#059669" font-weight="bold">
      • Unpredictable Ignition Origins:
    </text>
    <text x="30" y="148" font-family="Arial, sans-serif" class="example-text" fill="#374151">
      Mainframe: Institutional • PC: Socio-Cultural • Internet: Economic • AI: Core Tech
    </text>
    
    <text x="225" y="170" text-anchor="middle" font-family="Arial, sans-serif" class="example-text" fill="#ea580c" font-weight="bold">
      Innovation is ecological, not mechanical
    </text>
  </g>
</svg>