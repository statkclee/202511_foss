<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 600" width="800" height="600">
  <defs>
    <style><![CDATA[
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 28px; font-weight: 900; fill: #f8fafc; }
      .h1 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #ffffff; }
      .h2 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #f1f5f9; }
      .p { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #e5e7eb; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #cbd5e1; }
      .year { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #fbbf24; }
    ]]></style>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Revolution gradients -->
    <linearGradient id="gradAgri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="gradIndustrial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="gradInfo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="gradCognitive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Future glow -->
    <linearGradient id="gradFuture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Effects -->
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/></filter>
    <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#34d399" flood-opacity="0.5"/></filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" class="title">GPT 진화의 미래</text>

  <!-- Evolution curve -->
  <path d="M 80 500 Q 200 450 300 380 Q 450 300 580 200 Q 680 120 750 80" 
        stroke="#64748b" stroke-width="4" fill="none" opacity="0.6"/>
  
  <!-- Future extension (dotted) -->
  <path d="M 580 200 Q 680 120 750 80" 
        stroke="url(#gradFuture)" stroke-width="4" fill="none" stroke-dasharray="8,4" filter="url(#glow)"/>

  <!-- Revolution 1: Agricultural (10,000 BCE) -->
  <g transform="translate(80,500)">
    <circle cx="0" cy="0" r="25" fill="url(#gradAgri)" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" class="h2" fill="#fed7aa">🌾</text>
    <text x="0" y="8" text-anchor="middle" class="small" fill="#fed7aa">농업</text>
    
    <g transform="translate(0,-60)">
      <rect x="-60" y="-25" width="120" height="50" rx="10" fill="#1f2937" opacity="0.8"/>
      <text x="0" y="-8" text-anchor="middle" class="h2" fill="#fbbf24">농업혁명</text>
      <text x="0" y="8" text-anchor="middle" class="year">BC 10,000</text>
      <text x="0" y="22" text-anchor="middle" class="small">정착 생활</text>
    </g>
  </g>

  <!-- Revolution 2: Industrial (1750-1850) -->
  <g transform="translate(300,380)">
    <circle cx="0" cy="0" r="30" fill="url(#gradIndustrial)" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" class="h2" fill="#a7f3d0">⚙️</text>
    <text x="0" y="8" text-anchor="middle" class="small" fill="#a7f3d0">기계</text>
    
    <g transform="translate(0,-70)">
      <rect x="-60" y="-30" width="120" height="60" rx="10" fill="#1f2937" opacity="0.8"/>
      <text x="0" y="-10" text-anchor="middle" class="h2" fill="#fbbf24">산업혁명</text>
      <text x="0" y="8" text-anchor="middle" class="year">1750-1850</text>
      <text x="0" y="22" text-anchor="middle" class="small">기계화 생산</text>
      <text x="0" y="35" text-anchor="middle" class="small">물리력 확장</text>
    </g>

    <!-- Arrow to next -->
    <line x1="25" y1="-10" x2="95" y2="-50" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  </g>

  <!-- Revolution 3: Information (1950-2000) -->
  <g transform="translate(500,250)">
    <circle cx="0" cy="0" r="35" fill="url(#gradInfo)" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" class="h2" fill="#bfdbfe">💻</text>
    <text x="0" y="8" text-anchor="middle" class="small" fill="#bfdbfe">정보</text>
    
    <g transform="translate(0,-80)">
      <rect x="-60" y="-35" width="120" height="70" rx="10" fill="#1f2937" opacity="0.8"/>
      <text x="0" y="-15" text-anchor="middle" class="h2" fill="#fbbf24">정보혁명</text>
      <text x="0" y="0" text-anchor="middle" class="year">1950-2000</text>
      <text x="0" y="15" text-anchor="middle" class="small">디지털화</text>
      <text x="0" y="28" text-anchor="middle" class="small">정보력 확장</text>
    </g>

    <!-- Arrow to next -->
    <line x1="25" y1="-15" x2="65" y2="-40" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  </g>

  <!-- Revolution 4: Cognitive (2020-Present) -->
  <g transform="translate(650,150)">
    <circle cx="0" cy="0" r="40" fill="url(#gradCognitive)" filter="url(#shadow)"/>
    <text x="0" y="-5" text-anchor="middle" class="h2" fill="#c4b5fd">🧠</text>
    <text x="0" y="8" text-anchor="middle" class="small" fill="#c4b5fd">인지</text>
    
    <g transform="translate(-30,-90)">
      <rect x="-60" y="-40" width="120" height="80" rx="10" fill="#1f2937" opacity="0.8"/>
      <text x="0" y="-20" text-anchor="middle" class="h2" fill="#fbbf24">인지혁명</text>
      <text x="0" y="-5" text-anchor="middle" class="year">2020-현재</text>
      <text x="0" y="10" text-anchor="middle" class="small">AI 협업</text>
      <text x="0" y="23" text-anchor="middle" class="small" fill="#8b5cf6">인지력 확장</text>
      <text x="0" y="36" text-anchor="middle" class="small" fill="#8b5cf6">창조 증강</text>
    </g>
    <!-- Current indicator -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#fbbf24" stroke-width="3" filter="url(#glow)" opacity="0.7"/>
  </g>

  <!-- Future potential -->
  <g transform="translate(720,80)">
    <circle cx="0" cy="0" r="30" fill="url(#gradFuture)" filter="url(#glow)" opacity="0.8"/>
    <text x="0" y="-3" text-anchor="middle" class="h2" fill="#000">✨</text>
    <text x="0" y="8" text-anchor="middle" class="small" fill="#000">미래</text>
    
    <g transform="translate(50,70)">
      <rect x="-70" y="-30" width="140" height="60" rx="10" fill="#1f2937" opacity="0.9" stroke="#34d399" stroke-width="2"/>
      <text x="0" y="-10" text-anchor="middle" class="h2" fill="#34d399">인류 잠재력</text>
      <text x="0" y="5" text-anchor="middle" class="small" fill="#6ee7b7">새로운 차원</text>
      <text x="0" y="20" text-anchor="middle" class="small" fill="#6ee7b7">창조적 혁신</text>
    </g>
  </g>

  <!-- Key characteristics panel -->
  <g transform="translate(400,560)">
    <rect x="-350" y="-30" width="700" height="60" rx="15" fill="#1f2937" opacity="0.8" filter="url(#shadow)"/>
    <text x="0" y="-8" text-anchor="middle" class="h1" fill="#fbbf24">패턴: 인간 능력의 단계적 확장</text>
    <text x="-250" y="12" text-anchor="middle" class="p" fill="#cbd5e1">생존력</text>
    <text x="-80" y="12" text-anchor="middle" class="p" fill="#cbd5e1">→ 물리력</text>
    <text x="80" y="12" text-anchor="middle" class="p" fill="#cbd5e1">→ 정보력</text>
    <text x="250" y="12" text-anchor="middle" class="p" fill="#34d399">→ 인지력</text>
  </g>

  <!-- Time acceleration indicator -->
  <g transform="translate(60,100)">
    <rect x="-10" y="0" width="200" height="70" rx="10" fill="#7c3aed" opacity="0.8"/>
    <text x="90" y="20" text-anchor="middle" class="h2" fill="#e0e7ff">⚡ 가속화</text>
    <text x="90" y="38" text-anchor="middle" class="small" fill="#e0e7ff">10,000년 → 100년 → 50년 → 진행중</text>
    <text x="85" y="58" text-anchor="middle" class="small" fill="#e0e7ff">혁신 주기 단축</text>
  </g>

  <!-- Impact scale -->
  <g transform="translate(560,470)">
    <rect x="0" y="0" width="220" height="50" rx="10" fill="#059669" opacity="0.8"/>
    <text x="90" y="18" text-anchor="middle" class="h2" fill="#a7f3d0">🌍 영향 규모</text>
    <text x="110" y="38" text-anchor="middle" class="small" fill="#a7f3d0">지역 → 국가 → 글로벌 → 인류 전체</text>
  </g>
</svg>