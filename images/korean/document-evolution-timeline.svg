<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="500" viewBox="0 50 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="timelineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="era1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#92400E" />
      <stop offset="100%" style="stop-color:#B45309" />
    </linearGradient>
    <linearGradient id="era2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#065F46" />
      <stop offset="100%" style="stop-color:#059669" />
    </linearGradient>
    <linearGradient id="era3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF" />
      <stop offset="100%" style="stop-color:#2563EB" />
    </linearGradient>
    <linearGradient id="era4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7C2D12" />
      <stop offset="100%" style="stop-color:#DC2626" />
    </linearGradient>
    <linearGradient id="era5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#581C87" />
      <stop offset="100%" style="stop-color:#8B5CF6" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280" />
    </marker>
  </defs>

  <!-- Background height를 viewBox에 맞춤 -->
  <rect width="1200" height="600" fill="url(#timelineGradient)"/>

  <!-- Title -->
  <text x="450" y="80" text-anchor="middle" font-family="Arial, sans-serif">
    <tspan font-size="20" font-weight="bold" fill="#059669">한국의 기회:</tspan>
  </text>

  <text x="650" y="80" text-anchor="middle" font-family="Arial, sans-serif">
    <tspan font-size="20" font-weight="bold" fill="#059669">HWP(2세대) → AI(5세대) 직접 도약</tspan>
  </text>

  <!-- Timeline 영역(위로 당김) -->
  <g id="timeline-area" transform="translate(0,-170)">
    <line x1="100" y1="360" x2="1100" y2="360" stroke="#374151" stroke-width="4" opacity="0.3"/>

    <!-- Era 1 -->
    <g id="era1-group">
      <circle cx="150" cy="360" r="30" fill="url(#era1)" filter="url(#shadow)"/>
      <text x="150" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">1</text>
      <rect x="70" y="280" width="160" height="60" rx="10" fill="url(#era1)" filter="url(#shadow)" opacity="0.9"/>
      <text x="150" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">1세대: 종이 문서</text>
      <text x="150" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">1450~1980</text>
      <rect x="60" y="410" width="180" height="120" rx="8" fill="white" stroke="url(#era1)" stroke-width="2" opacity="0.95"/>
      <text x="150" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400E">구텐베르크 인쇄술</text>
      <text x="70"  y="450" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 대량 복제 가능</text>
      <text x="70"  y="465" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 지식의 민주화</text>
      <text x="70"  y="480" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 고정된 정보</text>
      <text x="70"  y="495" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 일방향 전달</text>
      <text x="70"  y="510" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 물리적 제약</text>
    </g>

    <!-- Era 2 -->
    <g id="era2-group">
      <circle cx="350" cy="360" r="30" fill="url(#era2)" filter="url(#shadow)"/>
      <text x="350" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">2</text>
      <rect x="270" y="280" width="160" height="60" rx="10" fill="url(#era2)" filter="url(#shadow)" opacity="0.9"/>
      <text x="350" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">2세대: 디지털 문서</text>
      <text x="350" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">1980~1995</text>
      <rect x="260" y="410" width="180" height="120" rx="8" fill="white" stroke="url(#era2)" stroke-width="2" opacity="0.95"/>
      <text x="350" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#065F46">HWP, MS Word</text>
      <text x="270" y="450" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 편집의 자유</text>
      <text x="270" y="465" font-family="Arial, sans-serif" font-size="10" fill="#374151">• WYSIWYG</text>
      <text x="270" y="480" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 템플릿 시스템</text>
      <text x="270" y="495" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 글꼴과 서식</text>
      <text x="270" y="510" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 여전히 정적</text>
    </g>

    <!-- Era 3 -->
    <g id="era3-group">
      <circle cx="550" cy="360" r="30" fill="url(#era3)" filter="url(#shadow)"/>
      <text x="550" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">3</text>
      <rect x="470" y="280" width="160" height="60" rx="10" fill="url(#era3)" filter="url(#shadow)" opacity="0.9"/>
      <text x="550" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">3세대: 웹 문서</text>
      <text x="550" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">1995~2010</text>
      <rect x="460" y="410" width="180" height="120" rx="8" fill="white" stroke="url(#era3)" stroke-width="2" opacity="0.95"/>
      <text x="550" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1E40AF">HTML, PDF, WWW</text>
      <text x="470" y="450" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 하이퍼텍스트</text>
      <text x="470" y="465" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 멀티미디어 통합</text>
      <text x="470" y="480" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 전역 접근성</text>
      <text x="470" y="495" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 검색 가능성</text>
      <text x="470" y="510" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 네트워크 효과</text>
    </g>

    <!-- Era 4 -->
    <g id="era4-group">
      <circle cx="750" cy="360" r="30" fill="url(#era4)" filter="url(#shadow)"/>
      <text x="750" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">4</text>
      <rect x="670" y="280" width="160" height="60" rx="10" fill="url(#era4)" filter="url(#shadow)" opacity="0.9"/>
      <text x="750" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">4세대: 인터랙티브 문서</text>
      <text x="750" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">2010~2020</text>

      <rect x="650" y="410" width="200" height="180" rx="8" fill="white" stroke="url(#era4)" stroke-width="2" opacity="0.95"/>
      <text x="750" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7C2D12">소프트웨어 → 인터랙티브 문서 수렴</text>

      <rect x="660" y="445" width="80" height="40" rx="4" fill="#059669" opacity="0.2"/>
      <text x="700" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#065F46">R (2012)</text>
      <text x="700" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#065F46">통계→문서</text>

      <rect x="750" y="445" width="80" height="40" rx="4" fill="#2563EB" opacity="0.2"/>
      <text x="790" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1E40AF">Python (2011)</text>
      <text x="790" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1E40AF">개발→문서</text>

      <rect x="705" y="495" width="80" height="40" rx="4" fill="#F59E0B" opacity="0.2"/>
      <text x="745" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#D97706">JS (2017)</text>
      <text x="745" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#D97706">웹개발→문서</text>


      <text x="660" y="550" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 문학적 프로그래밍 실현</text>
      <text x="660" y="565" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 각 언어별 독립 발전</text>
      <text x="660" y="580" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 2022 Quarto로 통합</text>
    </g>

    <!-- Era 5 -->
    <g id="era5-group">
      <circle cx="950" cy="360" r="30" fill="url(#era5)" filter="url(#shadow)"/>
      <text x="950" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">5</text>
      <rect x="870" y="280" width="160" height="60" rx="10" fill="url(#era5)" filter="url(#shadow)" opacity="0.9"/>
      <text x="950" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">5세대: 지능형 앱</text>
      <text x="950" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">2020~현재</text>
      <rect x="860" y="410" width="180" height="120" rx="8" fill="white" stroke="url(#era5)" stroke-width="2" opacity="0.95"/>
      <text x="950" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#581C87">GPT + Quarto</text>
      <text x="870" y="450" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 자가 진화</text>
      <text x="870" y="465" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 대화형 인터페이스</text>
      <text x="870" y="480" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 멀티모달</text>
      <text x="870" y="495" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 실시간 적응</text>
      <text x="870" y="510" font-family="Arial, sans-serif" font-size="10" fill="#374151">• 경계 소멸</text>
    </g>

    <!-- 연결 화살표 -->
    <line x1="180" y1="360" x2="320" y2="360" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="380" y1="360" x2="520" y2="360" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="580" y1="360" x2="720" y2="360" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="780" y1="360" x2="920" y2="360" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="980" y1="360" x2="1070" y2="360" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="1010" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B5CF6">미래</text>
  </g>

  <!-- 하단 요약: 1~5세대 한 줄 -->
  <g id="bottom-area" transform="translate(0,-200)">
    <rect x="100" y="650" width="900" height="70" rx="10" fill="white" stroke="#D1D5DB" stroke-width="2" opacity="0.95"/>
    <text x="550" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2937">핵심 패러다임 전환</text>

    <!-- Single-line summary -->
    <text x="120" y="700" font-family="Arial, sans-serif" font-size="12" fill="#374151">
      <tspan fill="#DC2626" font-weight="bold">1-2세대:</tspan>
      <tspan dx="6">정보 저장 → 정보 편집</tspan>
      <tspan dx="14" fill="#9CA3AF">|</tspan>

      <tspan dx="14" fill="#2563EB" font-weight="bold">3세대:</tspan>
      <tspan dx="6">고립된 문서 → 연결된 네트워크</tspan>
      <tspan dx="14" fill="#9CA3AF">|</tspan>

      <tspan dx="14" fill="#DC2626" font-weight="bold">4세대:</tspan>
      <tspan dx="6">정적 콘텐츠 → 실행 가능한 문서</tspan>
      <tspan dx="14" fill="#9CA3AF">|</tspan>

      <tspan dx="14" fill="#8B5CF6" font-weight="bold">5세대:</tspan>
      <tspan dx="6">문서 ≡ 애플리케이션 (경계 소멸)</tspan>
    </text>
  </g>
</svg>
