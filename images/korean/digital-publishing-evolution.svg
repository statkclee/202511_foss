<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="430" viewBox="0 30 800 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 그라디언트 -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6610f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>

    <!-- 그림자 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 화살표 마커 (상단에 통합) -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
    
    <!-- 기본 폰트 설정 -->
    <style>
      text { font-family: "Noto Sans KR", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    </style>
  </defs>
  
  <!-- 세로 타임라인 -->
  <line x1="100" y1="80" x2="100" y2="430" stroke="#ddd" stroke-width="2"/>

  <!-- 1세대 -->
  <g transform="translate(100, 100)">
    <circle r="8" fill="#6610f2"/>
    <rect x="20" y="-30" width="250" height="60" rx="5" fill="white" filter="url(#shadow)"/>
    <text x="30" y="-10" font-size="14" font-weight="bold" fill="#6610f2">1세대 (1990년대)</text>
    <text x="30" y="8"  font-size="12" fill="#666">WYSIWYG 워드프로세서</text>
    <text x="30" y="24" font-size="11" fill="#999">문서 = 최종 출력물</text>

    <rect x="300" y="-25" width="180" height="50" rx="5" fill="#f8f9fa"/>
    <text x="310" y="-5" font-size="11" fill="#666">MS Word, 아래아한글</text>
    <text x="310" y="10" font-size="11" fill="#666">형식과 내용 결합</text>
  </g>

  <!-- 화살표 -->
  <path d="M 100 140 L 100 170" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 2세대 -->
  <g transform="translate(100, 190)">
    <circle r="8" fill="#f39c12"/>
    <rect x="20" y="-30" width="250" height="60" rx="5" fill="white" filter="url(#shadow)"/>
    <text x="30" y="-10" font-size="14" font-weight="bold" fill="#f39c12">2세대 (2000년대)</text>
    <text x="30" y="8"  font-size="12" fill="#666">웹 출판 시대</text>
    <text x="30" y="24" font-size="11" fill="#999">HTML/CSS 분리</text>

    <rect x="300" y="-25" width="180" height="50" rx="5" fill="#fff9e6"/>
    <text x="310" y="-5" font-size="11" fill="#666">콘텐츠 vs 스타일</text>
    <text x="310" y="10" font-size="11" fill="#666">수동 다중 형식 변환</text>
  </g>

  <!-- 화살표 -->
  <path d="M 100 230 L 100 260" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 3세대 -->
  <g transform="translate(100, 280)">
    <circle r="8" fill="#3498db"/>
    <rect x="20" y="-30" width="250" height="60" rx="5" fill="white" filter="url(#shadow)"/>
    <text x="30" y="-10" font-size="14" font-weight="bold" fill="#3498db">3세대 (2010년대)</text>
    <text x="30" y="8"  font-size="12" fill="#666">마크다운/판독</text>
    <text x="30" y="24" font-size="11" fill="#999">싱글 소싱 도입</text>

    <rect x="300" y="-25" width="180" height="50" rx="5" fill="#e6f3ff"/>
    <text x="310" y="-5" font-size="11" fill="#666">플레인 텍스트 기반</text>
    <text x="310" y="10" font-size="11" fill="#666">Git 버전 관리 가능</text>
  </g>

  <!-- 화살표 -->
  <path d="M 100 320 L 100 350" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 4세대 -->
  <g transform="translate(100, 370)">
    <circle r="8" fill="#27ae60"/>
    <rect x="20" y="-30" width="250" height="80" rx="5" fill="white" filter="url(#shadow)"/>
    <text x="30" y="-10" font-size="14" font-weight="bold" fill="#27ae60">4세대 (2020년대)</text>
    <text x="30" y="8"  font-size="12" fill="#666">쿼토 - 재현가능 출판</text>
    <text x="30" y="24" font-size="11" fill="#999">코드 + 데이터 + 텍스트 통합</text>
    <text x="30" y="40" font-size="11" fill="#999">AI 시대 직전의 정점</text>

    <rect x="300" y="-25" width="180" height="60" rx="5" fill="#e8f8f0"/>
    <text x="310" y="-5" font-size="11" fill="#666">계산 가능한 문서</text>
    <text x="310" y="10" font-size="11" fill="#666">다중 언어 지원</text>
    <text x="310" y="25" font-size="11" fill="#666">완전한 재현성</text>
  </g>

  <!-- 우측: 핵심 변화 (겹침 방지 위해 x=600으로 이동, 폭=180) -->
  <g transform="translate(600, 150)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">핵심 변화</text>
    <g transform="translate(0, 30)">
      <circle cx="5" cy="0" r="3" fill="#6610f2"/>
      <text x="15" y="4" font-size="12" fill="#666">문서 중심 → 콘텐츠 중심</text>
    </g>
    <g transform="translate(0, 55)">
      <circle cx="5" cy="0" r="3" fill="#f39c12"/>
      <text x="15" y="4" font-size="12" fill="#666">단일 출력 → 다중 출력</text>
    </g>
    <g transform="translate(0, 80)">
      <circle cx="5" cy="0" r="3" fill="#3498db"/>
      <text x="15" y="4" font-size="12" fill="#666">수동 작업 → 자동화</text>
    </g>
    <g transform="translate(0, 105)">
      <circle cx="5" cy="0" r="3" fill="#27ae60"/>
      <text x="15" y="4" font-size="12" fill="#666">정적 문서 → 동적 문서</text>
    </g>
  </g>

  <!-- 우측: 해결된 문제들 (x=600으로 이동, 폭=180) -->
  <g transform="translate(600, 300)">
    <rect x="0" y="0" width="180" height="120" rx="5" fill="url(#grad1)" opacity="0.1"/>
    <text x="10" y="20" font-size="14" font-weight="bold" fill="#333">해결된 문제들</text>
    <text x="10" y="45" font-size="11" fill="#666">✓ 재현성 위기</text>
    <text x="10" y="65" font-size="11" fill="#666">✓ 협업의 어려움</text>
    <text x="10" y="85" font-size="11" fill="#666">✓ 다중 형식 관리 부담</text>
    <text x="10" y="105" font-size="11" fill="#666">✓ 데이터-문서 불일치</text>
  </g>
</svg>
