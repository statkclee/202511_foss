<svg viewBox="0 50 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neon gradients -->
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0080ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#003d82;stop-opacity:0.4" />
    </radialGradient>
    
    <radialGradient id="contextGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8a2be2;stop-opacity:0.9" />
      <stop offset="70%" style="stop-color:#4b0082;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#2e003d;stop-opacity:0.3" />
    </radialGradient>
    
    <radialGradient id="edgeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#00cc33;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#003d0f;stop-opacity:0.2" />
    </radialGradient>
    
    <linearGradient id="noCodeBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#f7931e;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ffcc02;stop-opacity:0.3" />
    </linearGradient>
    
    <!-- Glow filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark cosmic background -->
  <rect width="900" height="700" fill="#0a0a0a"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="900" height="700" fill="url(#grid)"/>
  
  <!-- Central coordinate -->
  <g transform="translate(450,350)">
    
    <!-- 2030: Outer ring - Edge Computing -->
    <circle cx="0" cy="0" r="240" fill="none" stroke="url(#edgeGrad)" stroke-width="3" opacity="0.7"/>
    <circle cx="0" cy="0" r="240" fill="url(#edgeGrad)" opacity="0.1"/>
    
    <!-- Edge Computing nodes -->
    <g transform="rotate(0)">
      <circle cx="0" cy="-240" r="25" fill="#00ff41" filter="url(#glow)" opacity="0.9"/>
      <text x="0" y="-245" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">IoT</text>
      <text x="0" y="-200" text-anchor="middle" font-size="14" fill="#00ff41" font-weight="bold">엣지 컴퓨팅</text>
      <text x="0" y="-185" text-anchor="middle" font-size="12" fill="#cccccc">초저지연</text>
    </g>
    
    <g transform="rotate(72)">
      <circle cx="0" cy="-240" r="20" fill="#00cc33" filter="url(#glow)" opacity="0.8"/>
      <text x="0" y="-245" text-anchor="middle" font-size="8" fill="#ffffff">🔒</text>
      <text x="0" y="-200" text-anchor="middle" font-size="14" fill="#00cc33">프라이버시</text>
    </g>
    
    <g transform="rotate(144)">
      <circle cx="0" cy="-240" r="20" fill="#00cc33" filter="url(#glow)" opacity="0.8"/>
      <text x="0" y="-245" text-anchor="middle" font-size="8" fill="#ffffff">⚡</text>
      <text x="0" y="-200" text-anchor="middle" font-size="14" fill="#00cc33">실시간</text>
    </g>
    
    <g transform="rotate(216)">
      <circle cx="0" cy="-240" r="20" fill="#00cc33" filter="url(#glow)" opacity="0.8"/>
      <text x="0" y="-245" text-anchor="middle" font-size="8" fill="#ffffff">🌐</text>
      <text x="0" y="-200" text-anchor="middle" font-size="14" fill="#00cc33">분산처리</text>
    </g>
    
    <g transform="rotate(288)">
      <circle cx="0" cy="-240" r="20" fill="#00cc33" filter="url(#glow)" opacity="0.8"/>
      <text x="0" y="-245" text-anchor="middle" font-size="8" fill="#ffffff">📱</text>
      <text x="0" y="-200" text-anchor="middle" font-size="14" fill="#00cc33">모바일</text>
    </g>
    
    <!-- 2028: Middle ring - Context Awareness -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#contextGrad)" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="0" r="160" fill="url(#contextGrad)" opacity="0.15"/>
    
    <!-- Context Awareness nodes -->
    <g transform="rotate(30)">
      <circle cx="0" cy="-160" r="30" fill="#8a2be2" filter="url(#strongGlow)" opacity="0.9"/>
      <text x="0" y="-165" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">👁</text>
      <text x="0" y="-115" text-anchor="middle" font-size="14" fill="#8a2be2" font-weight="bold">맥락 인식</text>
      <text x="0" y="-100" text-anchor="middle" font-size="12" fill="#cccccc">예측형 UI</text>
    </g>
    
    <g transform="rotate(120)">
      <circle cx="0" cy="-160" r="22" fill="#6a1b9a" filter="url(#glow)" opacity="0.8"/>
      <text x="0" y="-165" text-anchor="middle" font-size="10" fill="#ffffff">🧠</text>
      <text x="0" y="-125" text-anchor="middle" font-size="14" fill="#8a2be2">학습</text>
    </g>
    
    <g transform="rotate(210)">
      <circle cx="0" cy="-160" r="22" fill="#6a1b9a" filter="url(#glow)" opacity="0.8"/>
      <text x="0" y="-165" text-anchor="middle" font-size="10" fill="#ffffff">⚙️</text>
      <text x="0" y="-125" text-anchor="middle" font-size="14" fill="#8a2be2">적응형</text>
    </g>
    
    <g transform="rotate(300)">
      <circle cx="0" cy="-160" r="22" fill="#6a1b9a" filter="url(#glow)" opacity="0.8"/>
      <text x="0" y="-165" text-anchor="middle" font-size="10" fill="#ffffff">📊</text>
      <text x="0" y="-125" text-anchor="middle" font-size="14" fill="#8a2be2">개인화</text>
    </g>
    
    <!-- 2026: Inner ring - AI Assistant -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#coreGrad)" stroke-width="4" opacity="0.9"/>
    <circle cx="0" cy="0" r="80" fill="url(#coreGrad)" opacity="0.2"/>
    
    <!-- AI Assistant core -->
    <circle cx="0" cy="0" r="45" fill="#00f5ff" filter="url(#strongGlow)" opacity="0.9"/>
    <text x="0" y="-5" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="bold">AI</text>
    <text x="0" y="10" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">어시스턴트</text>
    
    <!-- AI capabilities around core -->
    <g transform="rotate(45)">
      <circle cx="0" cy="-80" r="18" fill="#0080ff" filter="url(#glow)" opacity="0.8"/>
      <text x="0" y="-75" text-anchor="middle" font-size="10" fill="#ffffff">💬</text>
      <text x="0" y="-50" text-anchor="middle" font-size="12" fill="#00f5ff">자연어</text>
    </g>
    
    <g transform="rotate(135)">
      <circle cx="0" cy="-80" r="18" fill="#0080ff" filter="url(#glow)" opacity="0.8"/>
      <text x="0" y="-75" text-anchor="middle" font-size="10" fill="#ffffff">📈</text>
      <text x="0" y="-50" text-anchor="middle" font-size="12" fill="#00f5ff">자동 차트</text>
    </g>
    
    <g transform="rotate(225)">
      <circle cx="0" cy="-80" r="18" fill="#0080ff" filter="url(#glow)" opacity="0.8"/>
      <text x="0" y="-75" text-anchor="middle" font-size="10" fill="#ffffff">⚡</text>
      <text x="0" y="-50" text-anchor="middle" font-size="12" fill="#00f5ff">실시간</text>
    </g>
    
    <g transform="rotate(315)">
      <circle cx="0" cy="-80" r="18" fill="#0080ff" filter="url(#glow)" opacity="0.8"/>
      <text x="0" y="-75" text-anchor="middle" font-size="10" fill="#ffffff">🔍</text>
      <text x="0" y="-50" text-anchor="middle" font-size="12" fill="#00f5ff">인사이트</text>
    </g>
    
    <!-- Connection lines between layers -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.3" fill="none">
      <!-- Core to middle layer -->
      <path d="M 0,-80 L 0,-160" stroke-dasharray="2,2"/>
      <path d="M 56,-56 L 113,-113" stroke-dasharray="2,2"/>
      <path d="M -56,-56 L -113,-113" stroke-dasharray="2,2"/>
      
      <!-- Middle to outer layer -->
      <path d="M 0,-160 L 0,-240" stroke-dasharray="2,2"/>
      <path d="M 113,-113 L 170,-170" stroke-dasharray="2,2"/>
      <path d="M -113,-113 L -170,-170" stroke-dasharray="2,2"/>
    </g>
  </g>
  
  <!-- No-Code Platform - Vertical beam -->
  <g>
    <rect x="100" y="150" width="60" height="400" fill="url(#noCodeBeam)" opacity="0.6" rx="30"/>
    <rect x="110" y="160" width="40" height="380" fill="#ff6b35" opacity="0.8" rx="20" filter="url(#glow)"/>
    
    <text x="130" y="180" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">노코드</text>
    <text x="130" y="195" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">플랫폼</text>
    
    <!-- Features -->
    <circle cx="130" cy="220" r="8" fill="#ffcc02" opacity="0.9"/>
    <text x="130" y="225" text-anchor="middle" font-size="8" fill="#000">🎨</text>
    <text x="180" y="225" font-size="12" fill="#ffffff">드래그 앤 드롭</text>
    
    <circle cx="130" cy="280" r="8" fill="#ffcc02" opacity="0.9"/>
    <text x="130" y="285" text-anchor="middle" font-size="8" fill="#000">⚙️</text>
    <text x="180" y="285" font-size="12" fill="#ffffff">자동 생성</text>
    
    <circle cx="130" cy="340" r="8" fill="#ffcc02" opacity="0.9"/>
    <text x="130" y="345" text-anchor="middle" font-size="8" fill="#000">🔧</text>
    <text x="180" y="345" font-size="12" fill="#ffffff">원클릭 배포</text>
    
    <circle cx="130" cy="400" r="8" fill="#ffcc02" opacity="0.9"/>
    <text x="130" y="405" text-anchor="middle" font-size="8" fill="#000">👥</text>
    <text x="180" y="405" font-size="12" fill="#ffffff">협업</text>
    
    <text x="130" y="480" text-anchor="middle" font-size="14" fill="#35ff6e" font-weight="bold">2025-2030</text>
    <text x="130" y="495" text-anchor="middle" font-size="12" fill="#ffffff">지속적 진화</text>
  </g>
  
  <!-- Timeline indicators -->
  <g font-family="Noto Sans KR, Arial" fill="#ffffff">
    <text x="700" y="200" font-size="16" font-weight="bold" fill="#00f5ff">2025-2026</text>
    <text x="700" y="220" font-size="12" fill="#cccccc">AI 어시스턴트 시대</text>
    
    <text x="700" y="300" font-size="16" font-weight="bold" fill="#8a2be2">2027-2028</text>
    <text x="700" y="320" font-size="14" fill="#cccccc">맥락 인식</text>
    
    <text x="700" y="400" font-size="16" font-weight="bold" fill="#00ff41">2029-2030</text>
    <text x="700" y="420" font-size="12" fill="#cccccc">엣지 컴퓨팅</text>
  </g>
  
  <!-- Impact statement -->
  <g>
    <text x="450" y="620" text-anchor="middle" font-size="18" font-weight="bold" fill="#ff6b35" filter="url(#glow)">
      문서에서 경험으로 (From Documents to Living Experiences)
    </text>
    <text x="450" y="590" text-anchor="middle" font-size="14" fill="#cccccc">
      정적 보고서 → 동적 상호작용 생태계
    </text>
  </g>
  
  <!-- Data flow particles -->
  <g opacity="0.6">
    <circle cx="200" cy="100" r="2" fill="#00f5ff" filter="url(#glow)"/>
    <circle cx="250" cy="120" r="1.5" fill="#8a2be2" filter="url(#glow)"/>
    <circle cx="600" cy="150" r="2" fill="#00ff41" filter="url(#glow)"/>
    <circle cx="650" cy="180" r="1" fill="#ff6b35" filter="url(#glow)"/>
    <circle cx="300" cy="580" r="1.5" fill="#00f5ff" filter="url(#glow)"/>
    <circle cx="500" cy="550" r="2" fill="#8a2be2" filter="url(#glow)"/>
    <circle cx="700" cy="500" r="1" fill="#00ff41" filter="url(#glow)"/>
  </g>
  
</svg>