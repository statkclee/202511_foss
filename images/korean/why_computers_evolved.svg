<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <style>
      .title-text { font-size: 26px; font-weight: bold; }
      .subtitle-text { font-size: 16px; }
      .stage-title { font-size: 18px; font-weight: bold; }
      .stage-subtitle { font-size: 13px; }
      .stage-text { font-size: 14px; }
      .layer-title { font-size: 16px; font-weight: bold; }
      .layer-text { font-size: 13px; }
      .era-text { font-size: 12px; font-weight: bold; }
      .central-text { font-size: 20px; font-weight: bold; }
      .insight-text { font-size: 16px; }
    </style>
    
    <!-- Core cycle gradients -->
    <linearGradient id="problemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="technologyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="marketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1" />
    </linearGradient>
    
    <!-- External layer gradients -->
    <linearGradient id="scienceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="policyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cultureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    
    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#374151"/>
    </marker>
    
    <marker id="weakArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/>
    </marker>
    
    <marker id="policyArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#0ea5e9"/>
    </marker>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-family="Arial, sans-serif" class="title-text" fill="#1e293b">
    컴퓨터는 왜 진화를 했을까?
  </text>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" class="subtitle-text" fill="#64748b">
    다층 피드백 네트워크: 핵심 순환 + 외부 영향력
  </text>
  
  <!-- External Layer: Science/Research (Top) -->
  <g id="science-layer">
    <rect x="450" y="80" width="300" height="80" fill="url(#scienceGrad)" rx="15" filter="url(#shadow)"/>
    <text x="600" y="105" text-anchor="middle" font-family="Arial, sans-serif" class="layer-title" fill="white">
      🧪 과학/연구 (Science)
    </text>
    <text x="600" y="125" text-anchor="middle" font-family="Arial, sans-serif" class="layer-text" fill="rgba(255,255,255,0.9)">
      • 기초 연구 • 이론 발전 • 새로운 발견
    </text>
    <text x="600" y="145" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">
      예: 트랜지스터 물리학, 정보 이론, 머신러닝
    </text>
  </g>
  
  <!-- Core Cycle: Problem Discovery (Left) -->
  <g id="stage1">
    <rect x="100" y="220" width="240" height="160" fill="url(#problemGrad)" rx="15" filter="url(#shadow)"/>
    <circle cx="135" cy="250" r="15" fill="rgba(255,255,255,0.3)"/>
    <text x="135" y="256" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">1</text>
    
    <text x="220" y="245" text-anchor="middle" font-family="Arial, sans-serif" class="stage-title" fill="white">
      문제 발견
    </text>
    <text x="220" y="265" text-anchor="middle" font-family="Arial, sans-serif" class="stage-text" fill="white">
      • 복잡한 계산 • 데이터 처리 • 자동화 요구
    </text>
    <rect x="110" y="290" width="220" height="25" fill="rgba(255,255,255,0.2)" rx="6"/>
    <text x="220" y="305" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">
      📊 1960s: 과학계산 → 메인프레임
    </text>
    <rect x="110" y="320" width="220" height="25" fill="rgba(255,255,255,0.2)" rx="6"/>
    <text x="220" y="335" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">
      🤖 2020s: 지능화 요구 → AI
    </text>
  </g>
  
  <!-- Core Cycle: Technology Development (Top) -->
  <g id="stage2">
    <rect x="480" y="180" width="240" height="160" fill="url(#technologyGrad)" rx="15" filter="url(#shadow)"/>
    <circle cx="515" cy="210" r="15" fill="rgba(255,255,255,0.3)"/>
    <text x="515" y="216" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">2</text>
    
    <text x="600" y="205" text-anchor="middle" font-family="Arial, sans-serif" class="stage-title" fill="white">
      기술 개발
    </text>
    <text x="600" y="225" text-anchor="middle" font-family="Arial, sans-serif" class="stage-text" fill="white">
      • 하드웨어 혁신 • 소프트웨어 발전 • 표준화
    </text>
    <rect x="490" y="250" width="220" height="25" fill="rgba(255,255,255,0.2)" rx="6"/>
    <text x="600" y="265" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">
      💻 1980s: 마이크로프로세서 → PC
    </text>
    <rect x="490" y="280" width="220" height="25" fill="rgba(255,255,255,0.2)" rx="6"/>
    <text x="600" y="295" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">
      🧠 2010s: 딥러닝 → 신경망
    </text>
  </g>
  
  <!-- Core Cycle: Market Launch (Right) -->
  <g id="stage3">
    <rect x="860" y="220" width="240" height="160" fill="url(#marketGrad)" rx="15" filter="url(#shadow)"/>
    <circle cx="895" cy="250" r="15" fill="rgba(255,255,255,0.3)"/>
    <text x="895" y="256" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">3</text>
    
    <text x="980" y="245" text-anchor="middle" font-family="Arial, sans-serif" class="stage-title" fill="white">
      시장 출시
    </text>
    <text x="980" y="265" text-anchor="middle" font-family="Arial, sans-serif" class="stage-text" fill="white">
      • 상용화 • 비즈니스 모델 • 생태계 구축
    </text>
    <rect x="870" y="290" width="220" height="25" fill="rgba(255,255,255,0.2)" rx="6"/>
    <text x="980" y="305" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">
      🌐 1990s: 인터넷 → 정보혁명
    </text>
    <rect x="870" y="320" width="220" height="25" fill="rgba(255,255,255,0.2)" rx="6"/>
    <text x="980" y="335" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">
      📱 2000s: 스마트폰 → 모바일
    </text>
  </g>
  
  <!-- Core Cycle: User Adoption (Bottom) -->
  <g id="stage4">
    <rect x="480" y="420" width="240" height="160" fill="url(#userGrad)" rx="15" filter="url(#shadow)"/>
    <circle cx="515" cy="450" r="15" fill="rgba(255,255,255,0.3)"/>
    <text x="515" y="456" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">4</text>
    
    <text x="600" y="445" text-anchor="middle" font-family="Arial, sans-serif" class="stage-title" fill="white">
      사용자 채택
    </text>
    <text x="600" y="465" text-anchor="middle" font-family="Arial, sans-serif" class="stage-text" fill="white">
      • 대중화 • 사용자 혁신 • 새로운 요구 창출
    </text>
    <rect x="490" y="490" width="220" height="25" fill="rgba(255,255,255,0.2)" rx="6"/>
    <text x="600" y="505" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">
      👥 1990s: 인터넷 문화 → 새 패러다임
    </text>
    <rect x="490" y="520" width="220" height="25" fill="rgba(255,255,255,0.2)" rx="6"/>
    <text x="600" y="535" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">
      🎨 2020s: 생성AI → 창작 혁명
    </text>
  </g>
  
  <!-- External Layer: Policy/Government (Bottom Left) -->
  <g id="policy-layer">
    <rect x="100" y="620" width="200" height="100" fill="url(#policyGrad)" rx="12" filter="url(#shadow)"/>
    <text x="200" y="645" text-anchor="middle" font-family="Arial, sans-serif" class="layer-title" fill="white">
      🏛️ 정책/제도
    </text>
    <text x="200" y="665" text-anchor="middle" font-family="Arial, sans-serif" class="layer-text" fill="rgba(255,255,255,0.9)">
      • 규제 • 표준 • 투자
    </text>
    <text x="200" y="685" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">
      예: ARPA → 인터넷
    </text>
    <text x="200" y="705" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">
      반도체법 → AI 경쟁
    </text>
  </g>
  
  <!-- External Layer: Culture/Society (Bottom Right) -->
  <g id="culture-layer">
    <rect x="900" y="620" width="200" height="100" fill="url(#cultureGrad)" rx="12" filter="url(#shadow)"/>
    <text x="1000" y="645" text-anchor="middle" font-family="Arial, sans-serif" class="layer-title" fill="white">
      🌍 문화/사회
    </text>
    <text x="1000" y="665" text-anchor="middle" font-family="Arial, sans-serif" class="layer-text" fill="rgba(255,255,255,0.9)">
      • 가치관 • 윤리 • 담론
    </text>
    <text x="1000" y="685" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">
      예: 프라이버시 논쟁
    </text>
    <text x="1000" y="705" text-anchor="middle" font-family="Arial, sans-serif" class="era-text" fill="white">
      AI 윤리 → 규제
    </text>
  </g>
  
  <!-- Core cycle arrows (strong) -->
  <path d="M 340 300 Q 400 260 480 260" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 720 260 Q 780 260 860 300" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 980 380 Q 980 400 720 500" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 480 500 Q 400 500 340 380" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Science to Technology (strong influence) -->
  <path d="M 600 160 L 600 180" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Policy influences (dashed, from bottom left to all core elements) -->
  <path d="M 300 650 Q 350 450 480 300" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#policyArrow)"/>
  <path d="M 250 620 Q 350 400 550 340" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#policyArrow)"/>
  <path d="M 300 650 Q 600 600 860 320" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#policyArrow)"/>
  
  <!-- Culture feedback (dotted, from bottom right) -->
  <path d="M 900 670 Q 750 620 720 580" stroke="#14b8a6" stroke-width="2" stroke-dasharray="2,8" fill="none" marker-end="url(#weakArrow)"/>
  <path d="M 950 620 Q 900 500 860 350" stroke="#14b8a6" stroke-width="2" stroke-dasharray="2,8" fill="none" marker-end="url(#weakArrow)"/>
  <path d="M 900 680 Q 650 700 300 680" stroke="#14b8a6" stroke-width="2" stroke-dasharray="2,8" fill="none" marker-end="url(#weakArrow)"/>
  
  <!-- Central insight -->
  <rect x="400" y="750" width="400" height="120" fill="#f8fafc" rx="15" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="775" text-anchor="middle" font-family="Arial, sans-serif" class="central-text" fill="#1e293b">
    하이브리드 진화 모델
  </text>
  <text x="600" y="795" text-anchor="middle" font-family="Arial, sans-serif" class="stage-text" fill="#64748b">
    핵심 4단계 순환 + 외부 영향층
  </text>
  
  <text x="600" y="820" text-anchor="middle" font-family="Arial, sans-serif" class="stage-text" fill="#dc2626" font-weight="bold">
    문제 → 기술 → 시장 → 채택 (순환)
  </text>
  <text x="600" y="840" text-anchor="middle" font-family="Arial, sans-serif" class="stage-text" fill="#374151">
    + 과학연구 + 정책제도 + 문화담론
  </text>
  
  <!-- Legend -->
  <g id="legend" transform="translate(50, 80)">
    <rect x="0" y="0" width="340" height="120" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="15" y="25" font-family="Arial, sans-serif" class="layer-text" fill="#374151" font-weight="bold">연결선 범례</text>
    
    <g transform="translate(15,40)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#374151" stroke-width="3"/>
      <text x="40" y="5" font-family="Arial, sans-serif" class="layer-text" fill="#374151">핵심 순환 (강한 직접 영향)</text>
    </g>
    
    <g transform="translate(15,60)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5,5"/>
      <text x="40" y="5" font-family="Arial, sans-serif" class="layer-text" fill="#374151">정책 임펄스 (top-down)</text>
    </g>
    
    <g transform="translate(15,80)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#14b8a6" stroke-width="2" stroke-dasharray="2,8"/>
      <text x="40" y="5" font-family="Arial, sans-serif" class="layer-text" fill="#374151">문화 피드백 (가치/윤리)</text>
    </g>
    
    <g transform="translate(15,100)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#22c55e" stroke-width="3"/>
      <text x="40" y="5" font-family="Arial, sans-serif" class="layer-text" fill="#374151">과학 기반 (기초연구)</text>
    </g>
  </g>
</svg>