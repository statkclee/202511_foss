<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="280" viewBox="0 40 800 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 그라데이션 정의 -->
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>

    <!-- 그림자 필터 -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 화살표 마커 -->
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L2,10 L8,6 z" fill="#64748B" />
    </marker>

    <!-- 폰트 스타일 -->
    <style>
      .title { font-family: "Noto Sans KR", sans-serif; font-size: 16px; font-weight: bold; fill: white; }
      .item { font-family: "Noto Sans KR", sans-serif; font-size: 13px; fill: #1e293b; }
      .subtitle { font-family: "Noto Sans KR", sans-serif; font-size: 12px; fill: #64748b; }
    </style>
  </defs>

  <!-- 배경 장식 -->
  <rect width="800" height="280" fill="#f8fafc" rx="10"/>
  
  <!-- 제목 -->
  <text x="400" y="30" text-anchor="middle" class="title" fill="#1e293b" font-size="18">쿼토를 구성하는 핵심 요소</text>

  <!-- 1. 프로그래밍(계산) 섹션 -->
  <g transform="translate(50, 70)">
    <!-- 메인 박스 -->
    <rect x="0" y="0" width="200" height="180" rx="15" fill="url(#gradPurple)" filter="url(#dropShadow)"/>
    
    <!-- 헤더 -->
    <rect x="0" y="0" width="200" height="50" rx="15" fill="rgba(255,255,255,0.2)"/>
    <text x="100" y="32" text-anchor="middle" class="title">프로그래밍(계산)</text>
    
    <!-- 아이콘 영역 (</> 코드 아이콘) -->
    <g transform="translate(85, 65)">
      <rect x="0" y="0" width="30" height="20" rx="3" fill="rgba(255,255,255,0.9)"/>
      <text x="15" y="14" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#8B5CF6">&lt;/&gt;</text>
    </g>
    
    <!-- 항목들 -->
    <text x="100" y="105" text-anchor="middle" class="item" fill="white">• Python</text>
    <text x="100" y="125" text-anchor="middle" class="item" fill="white">• R</text>
    <text x="100" y="145" text-anchor="middle" class="item" fill="white">• Julia</text>
    <text x="100" y="165" text-anchor="middle" class="item" fill="white">• Observable JS</text>
  </g>

  <!-- 화살표 1 -->
  <path d="M 250 160 L 305 160" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- 2. 문서 저작 섹션 -->
  <g transform="translate(300, 70)">
    <!-- 메인 박스 -->
    <rect x="0" y="0" width="200" height="180" rx="15" fill="url(#gradBlue)" filter="url(#dropShadow)"/>
    
    <!-- 헤더 -->
    <rect x="0" y="0" width="200" height="50" rx="15" fill="rgba(255,255,255,0.2)"/>
    <text x="100" y="32" text-anchor="middle" class="title">문서 저작</text>
    
    <!-- 아이콘 영역 (문서 아이콘) -->
    <g transform="translate(85, 65)">
      <rect x="0" y="0" width="20" height="26" rx="2" fill="rgba(255,255,255,0.9)"/>
      <rect x="3" y="4" width="14" height="1.5" rx="0.5" fill="#3B82F6"/>
      <rect x="3" y="8" width="14" height="1.5" rx="0.5" fill="#3B82F6"/>
      <rect x="3" y="12" width="10" height="1.5" rx="0.5" fill="#3B82F6"/>
      <rect x="3" y="16" width="12" height="1.5" rx="0.5" fill="#3B82F6"/>
      <rect x="3" y="20" width="8" height="1.5" rx="0.5" fill="#3B82F6"/>
      <!-- 페이지 접힌 부분 -->
      <polygon points="20,0 20,8 12,8" fill="rgba(59,130,246,0.3)"/>
    </g>
    
    <!-- 항목들 -->
    <text x="100" y="110" text-anchor="middle" class="item" fill="white">• Pandoc</text>
    <text x="100" y="130" text-anchor="middle" class="item" fill="white">• Markdown</text>
    <text x="100" y="150" text-anchor="middle" class="item" fill="white">• LaTeX</text>
  </g>

  <!-- 화살표 2 -->
  <path d="M 500 160 L 555 160" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- 3. 출력물 섹션 -->
  <g transform="translate(550, 70)">
    <!-- 메인 박스 -->
    <rect x="0" y="0" width="200" height="180" rx="15" fill="url(#gradOrange)" filter="url(#dropShadow)"/>
    
    <!-- 헤더 -->
    <rect x="0" y="0" width="200" height="50" rx="15" fill="rgba(255,255,255,0.2)"/>
    <text x="100" y="32" text-anchor="middle" class="title">출력물</text>
    
    <!-- 아이콘 영역 (다중 출력 아이콘) -->
    <g transform="translate(75, 62)">
      <!-- 웹 아이콘 -->
      <rect x="0" y="0" width="15" height="12" rx="2" fill="rgba(255,255,255,0.9)"/>
      <rect x="2" y="2" width="11" height="1" fill="#F59E0B"/>
      <rect x="2" y="4" width="8" height="1" fill="#F59E0B"/>
      <rect x="2" y="6" width="10" height="1" fill="#F59E0B"/>
      <!-- PDF 아이콘 -->
      <rect x="20" y="0" width="12" height="16" rx="1" fill="rgba(255,255,255,0.9)"/>
      <rect x="22" y="3" width="8" height="1" fill="#EF4444"/>
      <rect x="22" y="5" width="6" height="1" fill="#EF4444"/>
      <rect x="22" y="7" width="7" height="1" fill="#EF4444"/>
      <!-- 모바일 아이콘 -->
      <rect x="38" y="2" width="8" height="12" rx="2" fill="rgba(255,255,255,0.9)"/>
      <rect x="40" y="4" width="4" height="6" fill="#F59E0B"/>
    </g>
    
    <!-- 항목들 -->
    <text x="100" y="105" text-anchor="middle" class="item" fill="white">• 문서</text>
    <text x="100" y="120" text-anchor="middle" class="item" fill="white">• 웹사이트</text>
    <text x="100" y="135" text-anchor="middle" class="item" fill="white">• PPT</text>
    <text x="100" y="150" text-anchor="middle" class="item" fill="white">• (전자)책</text>
    <text x="100" y="165" text-anchor="middle" class="item" fill="white">• 블로그 등</text>
  </g>

  <!-- 하단 장식 라인 -->
  <line x1="50" y1="270" x2="750" y2="270" stroke="url(#gradPurple)" stroke-width="3" opacity="0.3"/>
  
  <!-- 보조 설명 텍스트 -->
  <text x="400" y="265" text-anchor="middle" class="subtitle">하나의 소스 → 다양한 출력 (Single Sourcing)</text>
</svg>