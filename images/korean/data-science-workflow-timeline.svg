<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="400" viewBox="0 40 1200 400" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="데이터 과학 워크플로우 5단계 시계열">
  <defs>
    <!-- 언어별 그라데이션 -->
    <linearGradient id="sqlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E55A2E;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD43B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3776AB;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#276DC3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#165AA7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="juliaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CB3C33;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#389826;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9558B2;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#4063D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CB3C33;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7DF1E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#323330;stop-opacity:1" />
    </linearGradient>
    
    <!-- 타임라인 그라데이션 -->
    <linearGradient id="timelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0.3" />
      <stop offset="25%" style="stop-color:#FFD43B;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#276DC3;stop-opacity:0.3" />
      <stop offset="75%" style="stop-color:#CB3C33;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#F7DF1E;stop-opacity:0.3" />
    </linearGradient>
    
    <!-- 화살표 -->
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L2,10 L10,6 z" fill="#4A90E2" />
    </marker>
    
    <!-- 필터 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <!-- 스타일 -->
    <style>
      .title-text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size: 24px; font-weight: bold; fill: #2C3E50; }
      .stage-title { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size: 16px; font-weight: bold; fill: white; text-anchor: middle; }
      .stage-subtitle { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size: 12px; fill: white; text-anchor: middle; opacity: 0.9; }
      .step-number { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size: 14px; font-weight: bold; fill: white; text-anchor: middle; }
      .time-label { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size: 11px; fill: #7F8C8D; text-anchor: middle; }
      .arrow-line { stroke: #4A90E2; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  
  <!-- 배경 -->
  <rect width="1200" height="400" fill="#F8FAFC" rx="8"/>
  
  <!-- 타임라인 배경 -->
  <rect x="100" y="100" width="1000" height="8" fill="url(#timelineGrad)" rx="4"/>
  
  <!-- 단계별 박스와 연결선 -->
  
  <!-- 1단계: SQL - 데이터 추출 -->
  <g transform="translate(150, 150)">
    <rect x="-60" y="-40" width="120" height="80" rx="15" fill="url(#sqlGrad)" filter="url(#shadow)"/>
    <circle cx="0" cy="-70" r="15" fill="#E55A2E"/>
    <text x="0" y="-65" class="step-number">1</text>
    
    <text x="0" y="-15" class="stage-title">SQL</text>
    <text x="0" y="5" class="stage-subtitle">데이터 추출</text>
    <text x="0" y="20" class="stage-subtitle">Database Query</text>
    
    <!-- 데이터베이스 아이콘 -->
    <g transform="translate(-20, -10)">
      <ellipse cx="0" cy="-8" rx="12" ry="4" fill="rgba(255,255,255,0.8)"/>
      <ellipse cx="0" cy="0" rx="12" ry="4" fill="rgba(255,255,255,0.6)"/>
      <ellipse cx="0" cy="8" rx="12" ry="4" fill="rgba(255,255,255,0.8)"/>
    </g>
  </g>
  
  <!-- 화살표 1→2 -->
  <line x1="210" y1="150" x2="270" y2="150" class="arrow-line"/>
  
  <!-- 2단계: Python - 머신러닝 -->
  <g transform="translate(350, 150)">
    <rect x="-60" y="-40" width="120" height="80" rx="15" fill="url(#pythonGrad)" filter="url(#shadow)"/>
    <circle cx="0" cy="-70" r="15" fill="#3776AB"/>
    <text x="0" y="-65" class="step-number">2</text>
    
    <text x="0" y="-15" class="stage-title">Python</text>
    <text x="0" y="5" class="stage-subtitle">머신러닝</text>
    <text x="0" y="20" class="stage-subtitle">AI/ML Modeling</text>
    
    <!-- Python 아이콘 -->
    <g transform="translate(-15, -5)">
      <rect x="-8" y="-8" width="16" height="16" rx="4" fill="#FFD43B"/>
      <circle cx="-3" cy="-3" r="2" fill="#3776AB"/>
      <circle cx="3" cy="3" r="2" fill="#3776AB"/>
    </g>
  </g>
  
  <!-- 화살표 2→3 -->
  <line x1="410" y1="150" x2="470" y2="150" class="arrow-line"/>
  
  <!-- 3단계: R - 통계 분석 -->
  <g transform="translate(550, 150)">
    <rect x="-60" y="-40" width="120" height="80" rx="15" fill="url(#rGrad)" filter="url(#shadow)"/>
    <circle cx="0" cy="-70" r="15" fill="#165AA7"/>
    <text x="0" y="-65" class="step-number">3</text>
    
    <text x="0" y="-15" class="stage-title">R</text>
    <text x="0" y="5" class="stage-subtitle">통계 분석</text>
    <text x="0" y="20" class="stage-subtitle">Statistical Analysis</text>
    
    <!-- R 아이콘 -->
    <circle cx="0" cy="-5" r="12" fill="rgba(255,255,255,0.9)" stroke="#165AA7" stroke-width="2"/>
    <text x="0" y="1" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#165AA7">R</text>
  </g>
  
  <!-- 화살표 3→4 -->
  <line x1="610" y1="150" x2="670" y2="150" class="arrow-line"/>
  
  <!-- 4단계: Julia - 고성능 계산 -->
  <g transform="translate(750, 150)">
    <rect x="-60" y="-40" width="120" height="80" rx="15" fill="url(#juliaGrad)" filter="url(#shadow)"/>
    <circle cx="0" cy="-70" r="15" fill="#CB3C33"/>
    <text x="0" y="-65" class="step-number">4</text>
    
    <text x="0" y="-15" class="stage-title">Julia</text>
    <text x="0" y="5" class="stage-subtitle">고성능 계산</text>
    <text x="0" y="20" class="stage-subtitle">HPC Simulation</text>
    
    <!-- Julia 색상점들 -->
    <g transform="translate(0, -5)">
      <circle cx="-6" cy="-6" r="3" fill="#CB3C33"/>
      <circle cx="6" cy="-6" r="3" fill="#389826"/>
      <circle cx="-6" cy="6" r="3" fill="#9558B2"/>
      <circle cx="6" cy="6" r="3" fill="#4063D8"/>
    </g>
  </g>
  
  <!-- 화살표 4→5 -->
  <line x1="810" y1="150" x2="870" y2="150" class="arrow-line"/>
  
  <!-- 5단계: JavaScript - 시각화 -->
  <g transform="translate(950, 150)">
    <rect x="-60" y="-40" width="120" height="80" rx="15" fill="url(#jsGrad)" filter="url(#shadow)"/>
    <circle cx="0" cy="-70" r="15" fill="#F7DF1E"/>
    <text x="0" y="-65" class="step-number" fill="#323330">5</text>
    
    <text x="0" y="-15" class="stage-title" fill="#323330">JavaScript</text>
    <text x="0" y="5" class="stage-subtitle" fill="rgba(50,51,48,0.8)">인터랙티브 시각화</text>
    <text x="0" y="20" class="stage-subtitle" fill="rgba(50,51,48,0.8)">Interactive Viz</text>
    
    <!-- JavaScript 아이콘 -->
    <rect x="-10" y="-12" width="20" height="14" rx="3" fill="#F7DF1E"/>
    <text x="0" y="-1" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#323330">JS</text>
  </g>
  
  <!-- 시간 레이블 -->
  <text x="150" y="280" class="time-label">Step 1<br/>데이터 수집</text>
  <text x="350" y="280" class="time-label">Step 2<br/>패턴 발견</text>
  <text x="550" y="280" class="time-label">Step 3<br/>가설 검증</text>
  <text x="750" y="280" class="time-label">Step 4<br/>최적화</text>
  <text x="950" y="280" class="time-label">Step 5<br/>결과 소통</text>
  
  <!-- 하단 설명 -->
  <g transform="translate(600, 320)">
    <rect x="-580" y="-10" width="1160" height="60" rx="8" fill="rgba(52, 152, 219, 0.05)" stroke="#3498DB" stroke-width="1"/>
    <text x="0" y="15" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50">Quarto: 5개 언어가 하나의 문서에서 순차적으로 협력하는 통합 환경</text>
    <text x="0" y="35" text-anchor="middle" font-size="12" fill="#34495E">각 단계의 출력이 다음 단계의 입력이 되는 seamless한 데이터 파이프라인</text>
  </g>
  
  <!-- 데이터 플로우 표시 -->
  <g transform="translate(600, 250)">
    <path d="M -400 0 Q -200 -15 0 0 Q 200 15 400 0" stroke="#E74C3C" stroke-width="3" fill="none" opacity="0.6" stroke-dasharray="8,4"/>
    <text x="0" y="-25" text-anchor="middle" font-size="11" fill="#E74C3C" font-weight="bold">데이터 플로우</text>
  </g>
</svg>