<svg viewBox="0 130 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#f8f9fa"/>
  
  <!-- Timeline axis -->
  <line x1="60" y1="600" x2="1140" y2="600" stroke="#34495e" stroke-width="3"/>
  
  <!-- Era backgrounds -->
  <g transform="translate(0,70)">
    <rect x="60" y="80" width="200" height="520" fill="#fffacd" opacity="0.3"/>
    <text x="160" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#8b4513">타자기 시대</text>
    
    <rect x="260" y="80" width="280" height="520" fill="#f0f8ff" opacity="0.3"/>
    <text x="400" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#4682b4">터미널/GUI 시대</text>
    
    <rect x="540" y="80" width="300" height="520" fill="#f5fff5" opacity="0.3"/>
    <text x="690" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#228b22">데스크톱 시대</text>
    
    <rect x="840" y="80" width="300" height="520" fill="#fff0f5" opacity="0.3"/>
    <text x="990" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc143c">IDE/웹 시대</text>
  </g>
  <!-- Timeline events -->
  
  <!-- IBM Courier 1955 -->
  <circle cx="120" cy="600" r="10" fill="#2c5282"/>
  <rect x="70" y="450" width="100" height="80" rx="8" fill="#e6f3ff" stroke="#2c5282" stroke-width="2"/>
  <text x="120" y="470" font-family="Courier New, monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c5282">IBM Courier</text>
  <text x="120" y="485" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">1955</text>
  <text x="120" y="500" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">타자기용</text>
  <text x="120" y="515" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">상표권 미등록</text>
  <line x1="120" y1="530" x2="120" y2="590" stroke="#2c5282" stroke-width="2"/>
  
  <!-- DEC VT100 1978 -->
  <circle cx="280" cy="600" r="10" fill="#1a365d"/>
  <rect x="230" y="380" width="100" height="80" rx="8" fill="#e2e8f0" stroke="#1a365d" stroke-width="2"/>
  <text x="280" y="400" font-family="Courier New, monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a365d">DEC VT100</text>
  <text x="280" y="415" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">1978</text>
  <text x="280" y="430" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">8×10 픽셀</text>
  <text x="280" y="445" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">터미널 표준화</text>
  <line x1="280" y1="460" x2="280" y2="590" stroke="#1a365d" stroke-width="2"/>
  
  <!-- Xerox Alto 1973 (revolutionary) -->
  <circle cx="350" cy="600" r="12" fill="#d69e2e"/>
  <rect x="290" y="200" width="120" height="100" rx="8" fill="#fef5e7" stroke="#d69e2e" stroke-width="3"/>
  <text x="350" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#d69e2e">Xerox Alto</text>
  <text x="350" y="235" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">1973</text>
  <text x="350" y="250" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">최초 GUI</text>
  <text x="350" y="265" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">비트맵 폰트</text>
  <text x="350" y="280" font-family="Arial, sans-serif" font-size="11" font-weight="bolder" text-anchor="middle" fill="#333">WYSIWYG</text>
  <text x="350" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">★ 혁명적</text>
  <line x1="350" y1="300" x2="350" y2="588" stroke="#d69e2e" stroke-width="3"/>
  
  <!-- AT&T UNIX troff 1973 -->
  <circle cx="420" cy="600" r="10" fill="#38a169"/>
  <rect x="370" y="320" width="100" height="80" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="420" y="340" font-family="Courier New, monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#38a169">AT&amp;T troff</text>
  <text x="420" y="355" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">1973</text>
  <text x="420" y="370" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">CAT 조판기</text>
  <text x="420" y="385" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">전자 출판</text>
  <line x1="420" y1="400" x2="420" y2="590" stroke="#38a169" stroke-width="2"/>
  
  <!-- Apple Chicago 1984 -->
  <circle cx="520" cy="600" r="10" fill="#e53e3e"/>
  <rect x="470" y="380" width="100" height="80" rx="8" fill="#fed7d7" stroke="#e53e3e" stroke-width="2"/>
  <text x="520" y="400" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e53e3e">Chicago</text>
  <text x="520" y="415" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">1984 Susan Kare</text>
  <text x="520" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">친근함 개성 부여</text>
  <text x="520" y="445" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">Mac 시스템</text>
  <line x1="520" y1="460" x2="520" y2="590" stroke="#e53e3e" stroke-width="2"/>
  
  <!-- MS Consolas 2004 -->
  <circle cx="720" cy="600" r="10" fill="#0078d4"/>
  <rect x="670" y="320" width="100" height="80" rx="8" fill="#e3f2fd" stroke="#0078d4" stroke-width="2"/>
  <text x="720" y="340" font-family="Consolas, monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#0078d4">Consolas</text>
  <text x="720" y="355" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">2004 MS</text>
  <text x="720" y="370" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">ClearType</text>
  <text x="720" y="385" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">프로그래밍용</text>
  <line x1="720" y1="400" x2="720" y2="590" stroke="#0078d4" stroke-width="2"/>
  
  <!-- JetBrains Mono 2020 -->
  <circle cx="1020" cy="600" r="10" fill="#ff6b35"/>
  <rect x="970" y="250" width="100" height="100" rx="8" fill="#fff2e6" stroke="#ff6b35" stroke-width="2"/>
  <text x="1020" y="270" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#ff6b35">JetBrains</text>
  <text x="1020" y="285" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#ff6b35">Mono</text>
  <text x="1020" y="305" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">2020</text>
  <text x="1020" y="320" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">리가처(ligature)</text>
  <text x="1020" y="335" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">IDE 최적화</text>
  <line x1="1020" y1="350" x2="1020" y2="590" stroke="#ff6b35" stroke-width="2"/>
  
  <!-- Year markers -->
  <text x="120" y="630" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">1955</text>
  <text x="280" y="630" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">1978</text>
  <text x="520" y="630" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">1984</text>
  <text x="720" y="630" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">2004</text>
  <text x="1020" y="630" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">2020</text>
  
  <!-- Evolution arrows -->
  <path d="M 170 500 Q 230 480 270 500" stroke="#2c5282" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
  <path d="M 380 490 Q 400 430 480 470" stroke="#38a169" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M 570 400 Q 620 330 670 350" stroke="#e53e3e" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>
  <path d="M 770 360 Q 890 300 970 320" stroke="#0078d4" stroke-width="2" fill="none" marker-end="url(#arrow4)"/>
  
  <!-- Technology evolution labels -->
  <text x="210" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">터미널화</text>
  <text x="440" y="445" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">GUI화</text>
  <text x="610" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">데스크톱화</text>
  <text x="850" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">IDE화</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2c5282"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38a169"/>
    </marker>
    <marker id="arrow3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e53e3e"/>
    </marker>
    <marker id="arrow4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0078d4"/>
    </marker>
  </defs>
  
  <!-- Key innovations -->
  <rect x="50" y="650" width="1100" height="40" rx="5" fill="white" stroke="#bdc3c7" stroke-width="1"/>
  <g transform="translate(0,-10)">
    <text x="150" y="685" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c5282">퍼블릭 도메인화</text>
    <text x="330" y="685" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1a365d">터미널 표준화</text>
    <text x="460" y="685" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#d69e2e">GUI 시작</text>
    <text x="600" y="685" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#38a169">전자 출판</text>
    <text x="750" y="685" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e53e3e">개성 표현</text>
    <text x="900" y="685" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#0078d4">가독성 최적화</text>
    <text x="1050" y="685" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#ff6b35">피로도 감소</text>
  </g>
</svg>