  <!-- 연결선 (곡선으로 겹침 방지, 좌우 색상 구분) -->
  <g stroke-width="2" fill="none" opacity="0.9">
    <!-- y중심: 212.5, 292.5, 372.5, 452.5, 532.5 -->
    <!-- 왼쪽(우열) x=600 / 오른쪽(좌열) x=800 ; 왼쪽(좌열) x=330 / 오른쪽(우열) x=1070 -->
    <!-- 1행 -->
    <path d="M330,212.5 Q565,180 800,212.5" stroke="#00796b" marker-end="url(#arrow)"/>
    <path d="M600,212.5 Q835,245 1070,212.5" stroke="#6a1b9a" marker-end="url(#arrow)"/>
    <!-- 2행 -->
    <path d="M330,292.5 Q565,260 800,292.5" stroke="#00796b" marker-end="url(#arrow)"/>
    <path d="M600,292.5 Q835,325 1070,292.5" stroke="#6a1b9a" marker-end="url(#arrow)"/>
    <!-- 3행 -->
    <path d="M330,372.5 Q565,340 800,372.5" stroke="#00796b" marker-end="url(#arrow)"/>
    <path d="M600,372.5 Q835,405 1070,372.5" stroke="#6a1b9a" marker-end="url(#arrow)"/>
    <!-- 4행 -->
