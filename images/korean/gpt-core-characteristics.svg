<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <style><![CDATA[
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 42px; font-weight: 900; fill: #f8fafc; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 22px; font-weight: 600; fill: #cbd5e1; }
      .h1 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #ffffff; }
      .h2 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #f1f5f9; }
      .p { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #e5e7eb; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #cbd5e1; }
      .metric { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 900; fill: #34d399; }
      .theory { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #fbbf24; }
      .reference { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #9ca3af; }
    ]]></style>

    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Core characteristics gradients -->
    <linearGradient id="gradPervasive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="gradImproving" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="gradSpawning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Economic effects gradients -->
    <linearGradient id="gradSpillover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="gradNetwork" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <linearGradient id="gradMultiplier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Central AI gradient -->
    <radialGradient id="gradCentralAI" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>

    <!-- Effects -->
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Connection paths -->
    <filter id="pathGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pulse animation -->
    <animate id="pulse" attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite"/>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- Header -->
  <text x="700" y="60" text-anchor="middle" class="title">범용기술 ≈ 생성형 AI</text>
  <text x="700" y="95" text-anchor="middle" class="subtitle">Generative AI as General Purpose Technology</text>
  <text x="700" y="120" text-anchor="middle" class="reference">Bresnahan &amp; Trajtenberg (1995) Three-Criteria Framework</text>

  <!-- Central AI Core with enhanced design -->
  <g transform="translate(700,450)">
    <!-- Outer glow ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#gradCentralAI)" stroke-width="3" opacity="0.3"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#gradCentralAI)" stroke-width="2" opacity="0.5"/>
    
    <!-- Central core -->
    <circle cx="0" cy="0" r="90" fill="url(#gradCentralAI)" filter="url(#shadow)" opacity="0.9"/>
    
    <!-- Text -->
    <text x="0" y="-20" text-anchor="middle" class="h1" fill="#1f2937">생성형 AI</text>
    <text x="0" y="10" text-anchor="middle" class="h2" fill="#1f2937">Generative AI</text>
    <text x="0" y="40" text-anchor="middle" class="small" fill="#1f2937">범용기술 (GPT)</text>
    
    <!-- Orbiting elements -->
    <g>
      <circle cx="0" cy="-110" r="6" fill="#fbbf24" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="15s" repeatCount="indefinite"/>
      </circle>
      <circle cx="110" cy="0" r="6" fill="#ec4899" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="110" r="6" fill="#06b6d4" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="25s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Connection paths from center to characteristics -->
  <g opacity="0.6">
    <!-- To Pervasiveness -->
    <path d="M 650,380 Q 400,300 250,200" stroke="#34d399" stroke-width="4" fill="none" filter="url(#pathGlow)"/>
    <!-- To Improvement -->
    <path d="M 750,380 Q 1000,300 1150,200" stroke="#34d399" stroke-width="4" fill="none" filter="url(#pathGlow)"/>
    <!-- To Innovation Spawning -->
    <path d="M 700,520 Q 700,600 700,680" stroke="#34d399" stroke-width="4" fill="none" filter="url(#pathGlow)"/>
  </g>

  <!-- Three Core Characteristics (Enhanced) -->
  
  <!-- 1. Pervasiveness (Top Left) -->
  <g transform="translate(80,120)">
    <rect x="0" y="0" width="340" height="330" rx="20" fill="url(#gradPervasive)" filter="url(#shadow)" opacity="0.9"/>
    
    <!-- Header -->
    <text x="170" y="35" text-anchor="middle" class="h1">광범위한 적용성</text>
    <text x="170" y="60" text-anchor="middle" class="small">Pervasiveness</text>
    <text x="170" y="80" text-anchor="middle" class="theory">"다수 하위 부문에서 투입재로 사용"</text>
    
    <!-- Key metrics -->
    <g transform="translate(30,110)">
      <text x="0" y="0" class="h2" fill="#bfdbfe">영향 범위:</text>
      <text x="0" y="25" class="metric">80%</text>
      <text x="60" y="25" class="p">미국 노동자 영향</text>
      <text x="0" y="50" class="metric">56%</text>
      <text x="60" y="50" class="p">작업 자동화 가능</text>
      
      <text x="0" y="85" class="h2" fill="#bfdbfe">적용 분야:</text>
      <text x="0" y="110" class="p">• 텍스트 생성 및 편집</text>
      <text x="0" y="130" class="p">• 코드 개발 및 디버깅</text>
      <text x="0" y="150" class="p">• 이미지/비디오 창작</text>
      <text x="0" y="170" class="p">• 데이터 분석 및 인사이트</text>
      <text x="0" y="190" class="p">• 고객 서비스 자동화</text>
      <text x="0" y="210" class="p">• 교육 및 학습 지원</text>
      
      <text x="0" y="245" class="reference">출처: OpenAI "GPTs are GPTs" (2023)</text>
    </g>
  </g>

  <!-- 2. Ongoing Improvements (Top Right) -->
  <g transform="translate(980,120)">
    <rect x="0" y="0" width="340" height="330" rx="20" fill="url(#gradImproving)" filter="url(#shadow)" opacity="0.9"/>
    
    <!-- Header -->
    <text x="170" y="35" text-anchor="middle" class="h1">지속적 개선</text>
    <text x="170" y="60" text-anchor="middle" class="small">Ongoing Improvements</text>
    <text x="170" y="80" text-anchor="middle" class="theory">"사용자 비용을 지속적으로 낮춤"</text>
    
    <!-- Performance timeline -->
    <g transform="translate(20,100)">
      <text x="0" y="0" class="h2" fill="#a7f3d0">성능 진화:</text>
      
      <!-- Timeline bars -->
      <rect x="0" y="20" width="100" height="15" rx="7" fill="#1f2937"/>
      <rect x="0" y="20" width="30" height="15" rx="7" fill="#6ee7b7"/>
      <text x="110" y="32" class="small">GPT-1 (2018)</text>
      
      <rect x="0" y="45" width="100" height="15" rx="7" fill="#1f2937"/>
      <rect x="0" y="45" width="60" height="15" rx="7" fill="#6ee7b7"/>
      <text x="110" y="57" class="small">GPT-3 (2020)</text>
      
      <rect x="0" y="70" width="100" height="15" rx="7" fill="#1f2937"/>
      <rect x="0" y="70" width="85" height="15" rx="7" fill="#6ee7b7"/>
      <text x="110" y="82" class="small">GPT-4 (2023)</text>
      
      <rect x="0" y="95" width="100" height="15" rx="7" fill="#1f2937"/>
      <rect x="0" y="95" width="100" height="15" rx="7" fill="#34d399"/>
      <text x="110" y="107" class="small">GPT-5 (2025)</text>
      
      <text x="0" y="135" class="h2" fill="#a7f3d0">개선 지표:</text>
      <text x="0" y="160" class="p">• 파라미터 수: 10¹¹ → 10¹²+</text>
      <text x="0" y="180" class="p">• 멀티모달 지원 확대</text>
      <text x="0" y="200" class="p">• 추론 능력 향상</text>
      <text x="0" y="220" class="p">• 비용 효율성 개선</text>
      
      <text x="0" y="255" class="reference">무어의 법칙 + 알고리즘 혁신</text>
    </g>
  </g>

  <!-- 3. Innovation Spawning (Bottom Center) -->
  <g transform="translate(450,630)">
    <rect x="0" y="0" width="500" height="200" rx="25" fill="url(#gradSpawning)" filter="url(#shadow)" opacity="0.9"/>
    
    <!-- Header -->
    <text x="180" y="35" text-anchor="middle" class="h1">혁신 생성</text>
    <text x="310" y="35" text-anchor="middle" class="small">Innovation Spawning</text>
    <text x="250" y="60" text-anchor="middle" class="theory">"하위 부문 R&amp;D 생산성 증가"</text>
    
    <!-- Innovation examples -->
    <g transform="translate(30,100)">
      <text x="20" y="0" class="h2" fill="#c4b5fd">신산업 창출:</text>
      <text x="20" y="25" class="p">• AI 기반 스타트업 급증</text>
      <text x="20" y="45" class="p">• 새로운 비즈니스 모델</text>
      <text x="20" y="65" class="p">• 프롬프트 엔지니어링 직업군</text>
      <text x="20" y="85" class="p">• 생성형 AI 도구 생태계</text>
      
      <text x="250" y="0" class="h2" fill="#c4b5fd">보완적 혁신:</text>
      <text x="250" y="25" class="p">• 자동화된 소프트웨어 개발</text>
      <text x="250" y="45" class="p">• 개인화된 교육 시스템</text>
    </g>
  </g>

  <!-- Economic Effects Framework (Right Side) -->
  <g transform="translate(100,520)">
    <rect x="0" y="0" width="300" height="230" rx="15" fill="#1f2937" opacity="0.8"/>
    <text x="150" y="25" text-anchor="middle" class="h2">경제적 파급효과</text>
    <text x="150" y="50" text-anchor="middle" class="small">Economic Spillover Effects</text>
    
    <!-- Spillover effects -->
    <g transform="translate(20,70)">
      <rect x="0" y="0" width="15" height="15" rx="3" fill="url(#gradSpillover)"/>
      <text x="25" y="12" class="p">스필오버 효과 (Spillover)</text>
      <text x="25" y="30" class="small">산업간 기술 전파</text>
      
      <rect x="0" y="45" width="15" height="15" rx="3" fill="url(#gradNetwork)"/>
      <text x="25" y="57" class="p">네트워크 효과 (Network)</text>
      <text x="25" y="75" class="small">사용자 증가에 따른 가치 상승</text>
      
      <rect x="0" y="90" width="15" height="15" rx="3" fill="url(#gradMultiplier)"/>
      <text x="25" y="102" class="p">승수 효과 (Multiplier)</text>
      <text x="25" y="120" class="small">투자 대비 경제적 파급 증폭</text>
      
      <text x="0" y="150" class="metric">GDP +7%</text>
      <text x="90" y="150" class="small">향후 10년 예상</text>
      <text x="0" y="175" class="reference">Goldman Sachs (2023)</text>
    </g>
  </g>

  <!-- Historical GPT Comparison (Bottom Right) -->
  <g transform="translate(1050,540)">
    <rect x="0" y="0" width="300" height="220" rx="20" fill="#1f2937" opacity="0.8"/>
    <text x="150" y="25" text-anchor="middle" class="h2">역사적 GPT 비교</text>
    <text x="150" y="50" text-anchor="middle" class="small">Historical GPT Comparison</text>
    
    <g transform="translate(20,70)">
      <text x="0" y="0" class="small" fill="#fbbf24">증기기관 (1780s)</text>
      <text x="150" y="0" class="small">장기 확산</text>
      
      <text x="0" y="25" class="small" fill="#3b82f6">전기 (1880s)</text>
      <text x="150" y="25" class="small">20년 (5→50%)</text>
      
      <text x="0" y="50" class="small" fill="#10b981">인터넷 (1990s)</text>
      <text x="150" y="50" class="small">미국 6-10년/세계20년+</text>
      
      <text x="0" y="75" class="small" fill="#8b5cf6">생성형 AI (2020s)</text>
      <text x="150" y="75" class="metric">3-5년 예상</text>
      
      <text x="20" y="120" class="h5" fill="white">디지털 인프라와 글로벌 연결성 효과</text>
    </g>
  </g>

  <!-- Theoretical Foundation (Bottom Left) -->
  <text x="70" y="870" class="reference">이론적 기반: Bresnahan &amp; Trajtenberg (1995), "General Purpose Technologies: Engines of Growth?"</text>
  <text x="70" y="885" class="reference">경제적 영향: Brynjolfsson &amp; McAfee (2014), Agrawal et al. (2018), OpenAI (2023)</text>
</svg>