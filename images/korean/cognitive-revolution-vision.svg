<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <style><![CDATA[
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 36px; font-weight: 900; fill: #f8fafc; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #cbd5e1; }
      .h1 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; }
      .h2 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #f1f5f9; }
      .p { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #e5e7eb; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #cbd5e1; }
    ]]></style>

    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Brain gradient -->
    <radialGradient id="gradBrain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>

    <!-- AI nodes gradient -->
    <radialGradient id="gradAI" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </radialGradient>

    <!-- Revolution elements -->
    <linearGradient id="gradRevolution" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Future vision gradient -->
    <linearGradient id="gradFuture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="30%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Future box gradient -->
    <linearGradient id="gradFutureBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Effects -->
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrowPast" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowCognitive" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrowFusion" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/>
    </marker>

    <!-- Pulse animation -->
    <animate id="pulse" attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="url(#bg)"/>

  <!-- Header -->
  <text x="500" y="60" text-anchor="middle" class="title">인지혁명 비전</text>
  <text x="500" y="90" text-anchor="middle" class="subtitle">Cognitive Revolution Vision</text>

  <!-- Central brain-AI fusion -->
  <g transform="translate(500,400)">
    <!-- Human brain representation -->
    <g>
      <ellipse cx="-80" cy="0" rx="70" ry="55" fill="url(#gradBrain)" filter="url(#shadow)" opacity="0.8"/>
      <text x="-80" y="5" text-anchor="middle" class="h2" fill="#1f2937">인간</text>
      <text x="-80" y="25" text-anchor="middle" class="small" fill="#1f2937">Human</text>
    </g>
    
    <!-- AI representation -->
    <g>
      <ellipse cx="80" cy="0" rx="70" ry="55" fill="url(#gradAI)" filter="url(#shadow)" opacity="0.8"/>
      <text x="80" y="0" text-anchor="middle" class="h2">AI</text>
      <text x="80" y="20" text-anchor="middle" class="small">Artificial</text>
      <text x="80" y="35" text-anchor="middle" class="small">Intelligence</text>
    </g>
    
    <!-- Fusion area -->
    <ellipse cx="0" cy="0" rx="35" ry="25" fill="#f59e0b" filter="url(#glow)" opacity="0.7"/>
    <text x="0" y="0" text-anchor="middle" class="h2" fill="#1f2937">융합</text>
    <text x="0" y="18" text-anchor="middle" class="small" fill="#1f2937">Fusion</text>
    
    <!-- Connection lines -->
    <line x1="-45" y1="0" x2="45" y2="0" stroke="#fbbf24" stroke-width="4" filter="url(#glow)"/>
    
    <!-- Pulsing nodes -->
    <circle cx="-30" cy="0" r="5" fill="#fbbf24" filter="url(#glow)">
      <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="0" r="5" fill="#fbbf24" filter="url(#glow)">
      <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
    </circle>
  </g>

  <!-- Revolution characteristics -->
  <g transform="translate(100,150)">
    <!-- Past revolutions -->
    <rect x="0" y="0" width="180" height="180" rx="15" fill="url(#gradRevolution)" filter="url(#shadow)" opacity="0.7"/>
    <text x="90" y="30" text-anchor="middle" class="h2">과거 혁명</text>
    <text x="90" y="55" text-anchor="middle" class="small">Past Revolutions</text>
    
    <g transform="translate(20,75)" class="p">
      <text x="0" y="0">🌾 농업혁명</text>
      <text x="0" y="25">⚙️ 산업혁명</text>
      <text x="0" y="50">💻 정보혁명</text>
      
      <text x="0" y="85" class="small">물리적 능력 확장</text>
    </g>
  </g>

  <!-- Cognitive revolution -->
  <g transform="translate(720,150)">
    <rect x="0" y="0" width="180" height="180" rx="15" fill="url(#gradBrain)" filter="url(#shadow)" opacity="0.9"/>
    <text x="90" y="30" text-anchor="middle" class="h2" fill="#1f2937">인지혁명</text>
    <text x="90" y="55" text-anchor="middle" class="small" fill="#1f2937">Cognitive Revolution</text>
    
    <g transform="translate(20,75)" class="p" fill="#1f2937">
      <text x="0" y="0">🧠 사고력 증강</text>
      <text x="0" y="25">🎨 창작력 확장</text>
      <text x="0" y="50">🔮 통찰력 강화</text>
      
      <text x="0" y="85" class="small">인지적 능력 확장</text>
    </g>
  </g>

  <!-- Key differences -->
  <g transform="translate(350,550)">
    <rect x="-100" y="-60" width="500" height="100" rx="15" fill="#1f2937" opacity="0.8"/>
    <text x="150" y="-25" text-anchor="middle" class="h2">핵심 차이점</text>
    
    <g transform="translate(50,-25)" class="p">
      <text x="-130" y="0" class="h2" fill="#fca5a5">과거 GPT:</text>
      <text x="-130" y="25">• 인간 능력 대체</text>
      <text x="-130" y="45">• 물리적/정보적 작업</text>
      
      <text x="220" y="0" class="h2" fill="#6ee7b7">생성형 AI:</text>
      <text x="220" y="25">• 인간 사고 협력</text>
      <text x="220" y="45">• 창작과 인지 작업</text>
    </g>
  </g>

  <!-- Future vision -->
  <g transform="translate(50,630)">
    <!-- Main background with glow -->
    <rect x="0" y="0" width="900" height="140" rx="20" fill="url(#gradFuture)" filter="url(#glow)" opacity="0.9"/>
    <rect x="5" y="5" width="890" height="130" rx="15" fill="url(#gradFutureBox)" opacity="0.8"/>
    
    <!-- Main title -->
    <text x="450" y="30" text-anchor="middle" class="h1" fill="#10b981">🌟 인지혁명이 가져올 미래</text>
    
    <!-- Three impact columns -->
    <!-- Column 1: Speed Revolution -->
    <g transform="translate(80,50)">
      <rect x="-15" y="-5" width="230" height="80" rx="10" fill="#1f2937" opacity="0.6"/>
      <text x="90" y="18" text-anchor="middle" class="h2" fill="#fbbf24">🚀 10배 빠른 혁신</text>
      <text x="10" y="45" class="small" fill="#e5e7eb">• 1년 프로젝트 → 1개월 완성</text>
      <text x="10" y="70" class="small" fill="#e5e7eb">• 실시간 프로토타이핑</text>
      <!-- Pulsing icon -->
      <circle cx="20" cy="15" r="6" fill="#fbbf24" filter="url(#glow)">
        <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Column 2: Democratization -->
    <g transform="translate(335,50)">
      <rect x="-15" y="-5" width="230" height="80" rx="10" fill="#1f2937" opacity="0.6"/>
      <text x="90" y="18" text-anchor="middle" class="h2" fill="#3b82f6">🌍 모두가 창조자</text>
      <text x="10" y="45" class="small" fill="#e5e7eb">• 프로그래머 없이 앱 개발</text>
      <text x="10" y="70" class="small" fill="#e5e7eb">• 디자이너 없이 디자인</text>
      <!-- Pulsing icon -->
      <circle cx="20" cy="15" r="6" fill="#3b82f6" filter="url(#glow)">
        <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite" begin="0.7s"/>
      </circle>
    </g>
    
    <!-- Column 3: Infinite Potential -->
    <g transform="translate(590,50)">
      <rect x="-15" y="-5" width="230" height="80" rx="10" fill="#1f2937" opacity="0.6"/>
      <text x="90" y="18" text-anchor="middle" class="h2" fill="#8b5cf6">🧠 인간 + AI = ∞</text>
      <text x="10" y="45" class="small" fill="#e5e7eb">• IQ 제한 없는 문제해결</text>
      <text x="10" y="70" class="small" fill="#e5e7eb">• 24시간 창의적 파트너</text>
      <!-- Pulsing icon -->
      <circle cx="20" cy="15" r="6" fill="#8b5cf6" filter="url(#glow)">
        <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite" begin="1.4s"/>
      </circle>
    </g>
  </g>

  <!-- Meaningful connections -->
  <g opacity="0.7">
    <!-- Past revolutions to fusion -->
    <path d="M 280 300 Q 300 300 370 360" stroke="#8b5cf6" stroke-width="3" fill="none" marker-end="url(#arrowPast)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Cognitive revolution to fusion -->
    <path d="M 720 295 Q 700 300 640 370" stroke="#34d399" stroke-width="3" fill="none" marker-end="url(#arrowCognitive)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" begin="1s"/>
    </path>
    
    <!-- Fusion to key differences 과거 GPT -->
    <line x1="500" y1="450" x2="400" y2="540" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowFusion)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </line>
    
    <!-- Fusion to key differences 생성 AI -->
    <line x1="500" y1="450" x2="600" y2="540" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowFusion)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="2s"/>
    </line>
    
    <!-- Flow indicators -->
    <circle cx="305" cy="310" r="4" fill="#8b5cf6" filter="url(#glow)">
      <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="695" cy="310" r="4" fill="#34d399" filter="url(#glow)">
      <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="460" cy="485" r="4" fill="#f59e0b" filter="url(#glow)">
      <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="540" cy="485" r="4" fill="#f59e0b" filter="url(#glow)">
      <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite" begin="2s"/>
    </circle>    
  </g>

  <!-- Revolution timeline indicator -->
  <g transform="translate(500,120)">
    <text x="0" y="0" text-anchor="middle" class="small" fill="#fbbf24">농업혁명 → 산업혁명 → 정보혁명 → 인지혁명</text>
  </g>
</svg>