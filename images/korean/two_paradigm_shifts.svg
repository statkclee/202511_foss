<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="1200" height="600" fill="#f8f9fa"/>
  
  <!-- 제목 -->
  <text x="600" y="40" text-anchor="middle" font-family="Noto Sans KR, Arial" font-size="24" font-weight="bold" fill="#2c3e50">과학기술 저작의 두 가지 대전환</text>
  
  <!-- 상단 구분선 -->
  <line x1="50" y1="70" x2="1150" y2="70" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- 첫 번째 대전환: Desktop → Web (상단) -->
  <g>
    <!-- 배경 박스 -->
    <rect x="20" y="90" width="1160" height="220" fill="#fff" stroke="#dee2e6" stroke-width="2" rx="10"/>
    
    <!-- 제목 -->
    <text x="600" y="120" text-anchor="middle" font-family="Noto Sans KR, Arial" font-size="20" font-weight="bold" fill="#3498db">첫 번째 대전환: Desktop에서 Web으로 (2010년대)</text>
    
    <!-- Desktop 시대 (왼쪽) -->
    <g>
      <!-- 배경 -->
      <rect x="50" y="140" width="350" height="150" fill="#ecf0f1" stroke="#bdc3c7" rx="8"/>
      <text x="225" y="170" text-anchor="middle" font-family="Noto Sans KR, Arial" font-size="16" font-weight="bold" fill="#2c3e50">Desktop 시대 (Sweave)</text>
      
      <!-- PC 아이콘 -->
      <g transform="translate(150, 180)">
        <!-- 모니터 -->
        <rect x="-30" y="0" width="60" height="40" fill="#34495e" rx="3"/>
        <rect x="-25" y="5" width="50" height="30" fill="#3498db" rx="2"/>
        <!-- 스탠드 -->
        <rect x="-3" y="40" width="6" height="10" fill="#34495e"/>
        <rect x="-15" y="50" width="30" height="3" fill="#34495e"/>
        <!-- 화면 내용 -->
        <text x="0" y="22" text-anchor="middle" font-family="Monaco, monospace" font-size="6" fill="#fff">LaTeX</text>
      </g>
      
      <!-- 워크플로우 텍스트 -->
      <text x="60" y="250" font-family="Noto Sans KR, Arial" font-size="11" fill="#2c3e50">• 로컬 PC에서 작업</text>
      <text x="60" y="265" font-family="Noto Sans KR, Arial" font-size="11" fill="#2c3e50">• PDF만 생성 가능</text>
      <text x="60" y="280" font-family="Noto Sans KR, Arial" font-size="11" fill="#2c3e50">• 파일 전송으로만 공유</text>
      
      <!-- Sweave 로고/텍스트 -->
      <text x="280" y="200" font-family="Monaco, monospace" font-size="12" font-weight="bold" fill="#e74c3c">Sweave</text>
      <text x="280" y="220" font-family="Noto Sans KR, Arial" font-size="10" fill="#666">(2002)</text>
    </g>
    
    <!-- 전환 화살표 -->
    <g transform="translate(600, 215)">
      <!-- 화살표 -->
      <defs>
        <marker id="webArrow" markerWidth="12" markerHeight="8" 
                refX="12" refY="4" orient="auto">
          <polygon points="0 0, 12 4, 0 8" fill="#e74c3c" />
        </marker>
      </defs>
      <line x1="-150" y1="0" x2="150" y2="0" stroke="#e74c3c" stroke-width="3" marker-end="url(#webArrow)"/>
      <text x="0" y="-10" text-anchor="middle" font-family="Noto Sans KR, Arial" font-size="12" font-weight="bold" fill="#e74c3c">플랫폼 대전환</text>
    </g>
    
    <!-- Web 시대 (오른쪽) -->
    <g>
      <!-- 배경 -->
      <rect x="800" y="140" width="350" height="150" fill="#e8f5e8" stroke="#27ae60" rx="8"/>
      <text x="975" y="170" text-anchor="middle" font-family="Noto Sans KR, Arial" font-size="16" font-weight="bold" fill="#27ae60">Web 시대 (knitr)</text>
      
      <!-- 클라우드/브라우저 아이콘 -->
      <g transform="translate(900, 185)">
        <!-- 클라우드 -->
        <ellipse cx="0" cy="10" rx="25" ry="8" fill="#3498db"/>
        <ellipse cx="-15" cy="5" rx="15" ry="6" fill="#3498db"/>
        <ellipse cx="15" cy="5" rx="15" ry="6" fill="#3498db"/>
        <!-- 브라우저 창 -->
        <rect x="-30" y="25" width="60" height="35" fill="#fff" stroke="#bdc3c7" rx="3"/>
        <rect x="-30" y="25" width="60" height="8" fill="#e74c3c" rx="3"/>
        <!-- 주소창 -->
        <rect x="-25" y="38" width="50" height="6" fill="#f8f9fa" stroke="#bdc3c7"/>
        <!-- 콘텐츠 -->
        <text x="0" y="52" text-anchor="middle" font-family="Monaco, monospace" font-size="6" fill="#2c3e50">HTML</text>
      </g>
      
      <!-- 워크플로우 텍스트 -->
      <text x="810" y="250" font-family="Noto Sans KR, Arial" font-size="11" fill="#27ae60">• 어디서나 접근 가능</text>
      <text x="810" y="265" font-family="Noto Sans KR, Arial" font-size="11" fill="#27ae60">• HTML 인터랙티브</text>
      <text x="810" y="280" font-family="Noto Sans KR, Arial" font-size="11" fill="#27ae60">• URL로 즉시 공유</text>
      
      <!-- knitr 로고/텍스트 -->
      <text x="1030" y="200" font-family="Monaco, monospace" font-size="12" font-weight="bold" fill="#27ae60">knitr</text>
      <text x="1030" y="220" font-family="Noto Sans KR, Arial" font-size="10" fill="#666">(2012)</text>
    </g>
  </g>
  
  <!-- 중간 구분선 -->
  <line x1="50" y1="330" x2="1150" y2="330" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- 두 번째 대전환: 코딩 → 생성 언어 (하단) -->
  <g>
    <!-- 배경 박스 -->
    <rect x="20" y="350" width="1160" height="220" fill="#fff" stroke="#dee2e6" stroke-width="2" rx="10"/>
    
    <!-- 제목 -->
    <text x="600" y="380" text-anchor="middle" font-family="Noto Sans KR, Arial" font-size="20" font-weight="bold" fill="#9b59b6">두 번째 대전환: 코딩에서 생성 언어로 (2023년)</text>
    
    <!-- 코딩 시대 (왼쪽) -->
    <g>
      <!-- 배경 -->
      <rect x="50" y="400" width="350" height="150" fill="#fdf2e9" stroke="#f39c12" rx="8"/>
      <text x="225" y="430" text-anchor="middle" font-family="Noto Sans KR, Arial" font-size="16" font-weight="bold" fill="#d68910">코딩 시대</text>
      
      <!-- 키보드/코드 에디터 아이콘 -->
      <g transform="translate(150, 440)">
        <!-- 모니터와 코드 -->
        <rect x="-35" y="0" width="70" height="45" fill="#2c3e50" rx="3"/>
        <rect x="-30" y="5" width="60" height="35" fill="#1e1e1e" rx="2"/>
        
        <!-- 코드 라인들 -->
        <text x="-25" y="15" font-family="Monaco, monospace" font-size="4" fill="#61dafb">import pandas as pd</text>
        <text x="-25" y="22" font-family="Monaco, monospace" font-size="4" fill="#98c379">df = pd.read_csv()</text>
        <text x="-25" y="29" font-family="Monaco, monospace" font-size="4" fill="#e06c75">df.groupby().mean()</text>
        <text x="-25" y="36" font-family="Monaco, monospace" font-size="4" fill="#61dafb">plt.plot()</text>
        
        <!-- 키보드 -->
        <rect x="-30" y="50" width="60" height="15" fill="#34495e" rx="2"/>
        <!-- 키들 -->
        <rect x="-25" y="53" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="-20" y="53" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="-15" y="53" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="-10" y="53" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="-5" y="53" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="0" y="53" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="5" y="53" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="10" y="53" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="15" y="53" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="20" y="53" width="3" height="3" fill="#7f8c8d" rx="1"/>
        
        <rect x="-22" y="58" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="-17" y="58" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="-12" y="58" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="-7" y="58" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="-2" y="58" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="3" y="58" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="8" y="58" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="13" y="58" width="3" height="3" fill="#7f8c8d" rx="1"/>
        <rect x="18" y="58" width="3" height="3" fill="#7f8c8d" rx="1"/>
      </g>
      
      <!-- 워크플로우 텍스트 -->
      <text x="60" y="520" font-family="Noto Sans KR, Arial" font-size="11" fill="#d68910">• 문법 학습 필요</text>
      <text x="60" y="535" font-family="Noto Sans KR, Arial" font-size="11" fill="#d68910">• 직접 코드 작성</text>
      <text x="60" y="550" font-family="Noto Sans KR, Arial" font-size="11" fill="#d68910">• 디버깅 필수</text>
      
      <!-- 연도 표시 -->
      <text x="280" y="460" font-family="Noto Sans KR, Arial" font-size="12" font-weight="bold" fill="#d68910">2000-2023</text>
    </g>
    
    <!-- 전환 화살표 -->
    <g transform="translate(600, 475)">
      <!-- 화살표 -->
      <defs>
        <marker id="aiArrow" markerWidth="12" markerHeight="8" 
                refX="12" refY="4" orient="auto">
          <polygon points="0 0, 12 4, 0 8" fill="#9b59b6" />
        </marker>
      </defs>
      <line x1="-150" y1="0" x2="150" y2="0" stroke="#9b59b6" stroke-width="3" marker-end="url(#aiArrow)"/>
      <text x="0" y="-10" text-anchor="middle" font-family="Noto Sans KR, Arial" font-size="12" font-weight="bold" fill="#9b59b6">저작 패러다임 대전환</text>
    </g>
    
    <!-- AI 시대 (오른쪽) -->
    <g>
      <!-- 배경 -->
      <rect x="800" y="400" width="350" height="150" fill="#f4e6ff" stroke="#9b59b6" rx="8"/>
      <text x="975" y="430" text-anchor="middle" font-family="Noto Sans KR, Arial" font-size="16" font-weight="bold" fill="#9b59b6">생성 언어 시대</text>
      
      <!-- 대화/채팅 아이콘 -->
      <g transform="translate(900, 445)">
        <!-- AI 로봇 아이콘 (간소화) -->
        <rect x="-20" y="0" width="40" height="30" fill="#9b59b6" rx="15"/>
        <!-- 눈 -->
        <circle cx="-8" cy="10" r="3" fill="#fff"/>
        <circle cx="8" cy="10" r="3" fill="#fff"/>
        <circle cx="-8" cy="10" r="1.5" fill="#3498db"/>
        <circle cx="8" cy="10" r="1.5" fill="#3498db"/>
        <!-- 입 -->
        <rect x="-6" y="18" width="12" height="2" fill="#fff" rx="1"/>
        
        <!-- 대화 말풍선 -->
        <g transform="translate(30, -10)">
          <rect x="0" y="0" width="60" height="25" fill="#fff" stroke="#9b59b6" rx="5"/>
          <polygon points="0 15, -8 12, -8 18" fill="#fff" stroke="#9b59b6"/>
          <text x="30" y="10" text-anchor="middle" font-family="Noto Sans KR, Arial" font-size="8" fill="#9b59b6">"데이터를</text>
          <text x="30" y="20" text-anchor="middle" font-family="Noto Sans KR, Arial" font-size="8" fill="#9b59b6">분석해줘"</text>
        </g>
        
        <!-- 코드 생성 표시 -->
        <g transform="translate(-10, 35)">
          <rect x="0" y="0" width="45" height="20" fill="#1e1e1e" rx="2"/>
          <text x="2" y="8" font-family="Monaco, monospace" font-size="4" fill="#61dafb">// AI 생성 코드</text>
          <text x="2" y="14" font-family="Monaco, monospace" font-size="4" fill="#98c379">df.analyze()</text>
          <text x="2" y="18" font-family="Monaco, monospace" font-size="4" fill="#e06c75">→ 결과 출력</text>
        </g>
      </g>
      
      <!-- 워크플로우 텍스트 -->
      <text x="810" y="520" font-family="Noto Sans KR, Arial" font-size="11" fill="#9b59b6">• 자연어로 의도 표현</text>
      <text x="810" y="535" font-family="Noto Sans KR, Arial" font-size="11" fill="#9b59b6">• AI가 코드 자동 생성</text>
      <text x="810" y="550" font-family="Noto Sans KR, Arial" font-size="11" fill="#9b59b6">• 검증 후 결과 활용</text>
      
      <!-- 연도 표시 -->
      <text x="1030" y="460" font-family="Noto Sans KR, Arial" font-size="12" font-weight="bold" fill="#9b59b6">2023-현재</text>
    </g>
  </g>
  
  <!-- 하단 요약 텍스트 -->
  <text x="600" y="590" text-anchor="middle" font-family="Noto Sans KR, Arial" font-size="12" fill="#666">두 번의 대전환으로 과학기술 저작은 "전문가의 전유물"에서 "모든 연구자를 위한 도구"로 진화했다</text>
</svg>