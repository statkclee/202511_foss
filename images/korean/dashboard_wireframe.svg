<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- 상단 탭 영역 -->
  <g id="tabs">
    <!-- 전세계 탭 -->
    <rect x="20" y="20" width="120" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <text x="80" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">전세계</text>
    
    <!-- 한국 탭 -->
    <rect x="140" y="20" width="120" height="40" fill="white" stroke="#333" stroke-width="2"/>
    <text x="200" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">한국</text>
    
    <!-- 탭 하단 구분선 -->
    <line x1="20" y1="60" x2="580" y2="60" stroke="#333" stroke-width="2"/>
  </g>
  
  <!-- Value 박스 영역 -->
  <g id="value-boxes">
    <!-- 확진자수 -->
    <rect x="50" y="90" width="150" height="60" fill="white" stroke="#333" stroke-width="2"/>
    <text x="125" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">확진자수</text>
    
    <!-- 사망 -->
    <rect x="225" y="90" width="150" height="60" fill="white" stroke="#333" stroke-width="2"/>
    <text x="300" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">사망</text>
    
    <!-- 회복자수 -->
    <rect x="400" y="90" width="150" height="60" fill="white" stroke="#333" stroke-width="2"/>
    <text x="475" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">회복자수</text>
  </g>
  
  <!-- 하단 컨텐츠 영역 -->
  <g id="content-area">
    <!-- 좌측 테이블 영역 -->
    <g id="table-area">
      <!-- 테이블 컨테이너 -->
      <rect x="50" y="180" width="200" height="180" fill="white" stroke="#7cb342" stroke-width="3"/>
      
      <!-- 테이블 헤더 -->
      <rect x="55" y="185" width="190" height="30" fill="#7cb342"/>
      <rect x="55" y="185" width="63" height="30" fill="#7cb342"/>
      <rect x="118" y="185" width="63" height="30" fill="#7cb342"/>
      <rect x="181" y="185" width="64" height="30" fill="#7cb342"/>
      
      <!-- 테이블 데이터 행들 -->
      <g id="table-rows">
        <!-- 첫 번째 행 -->
        <rect x="55" y="215" width="63" height="25" fill="white" stroke="#ddd"/>
        <rect x="118" y="215" width="63" height="25" fill="white" stroke="#ddd"/>
        <rect x="181" y="215" width="64" height="25" fill="white" stroke="#ddd"/>
        
        <!-- 두 번째 행 -->
        <rect x="55" y="240" width="63" height="25" fill="white" stroke="#ddd"/>
        <rect x="118" y="240" width="63" height="25" fill="white" stroke="#ddd"/>
        <rect x="181" y="240" width="64" height="25" fill="white" stroke="#ddd"/>
        
        <!-- 세 번째 행 -->
        <rect x="55" y="265" width="63" height="25" fill="white" stroke="#ddd"/>
        <rect x="118" y="265" width="63" height="25" fill="white" stroke="#ddd"/>
        <rect x="181" y="265" width="64" height="25" fill="white" stroke="#ddd"/>
        
        <!-- 네 번째 행 -->
        <rect x="55" y="290" width="63" height="25" fill="white" stroke="#ddd"/>
        <rect x="118" y="290" width="63" height="25" fill="white" stroke="#ddd"/>
        <rect x="181" y="290" width="64" height="25" fill="white" stroke="#ddd"/>
        
        <!-- 다섯 번째 행 -->
        <rect x="55" y="315" width="63" height="25" fill="white" stroke="#ddd"/>
        <rect x="118" y="315" width="63" height="25" fill="white" stroke="#ddd"/>
        <rect x="181" y="315" width="64" height="25" fill="white" stroke="#ddd"/>
      </g>
    </g>
    
    <!-- 우측 차트 영역 -->
    <g id="chart-area">
      <!-- 차트 컨테이너 -->
      <rect x="300" y="180" width="250" height="180" fill="white" stroke="#333" stroke-width="2"/>
      
      <!-- 차트 아이콘/그래프 표현 -->
      <g id="chart-icon" transform="translate(375, 220)">
        <!-- 차트 축 -->
        <line x1="0" y1="100" x2="0" y2="0" stroke="#333" stroke-width="2"/>
        <line x1="0" y1="100" x2="100" y2="100" stroke="#333" stroke-width="2"/>
        
        <!-- 막대 차트 -->
        <rect x="15" y="60" width="15" height="40" fill="#333"/>
        <rect x="40" y="40" width="15" height="60" fill="#333"/>
        <rect x="65" y="20" width="15" height="80" fill="#333"/>
        
        <!-- 상승 화살표 -->
        <g transform="translate(85, 15)">
          <rect x="10" y="6" width="15" height="80" fill="#333"/>
        </g>
      </g>
    </g>
  </g>
</svg>