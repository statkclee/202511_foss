<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 10 1000 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .stage-text { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 16px; font-weight: 600; fill: #34495e; }
      .desc-text-middle { font-family: 'Noto Sans KR', sans-serif; font-size: 15px; fill: #7f8c8d; }
      .desc-text { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; fill: #000000; }
      .ai-brain { fill: #e74c3c; stroke: #c0392b; stroke-width: 3; }
      .ai-model { fill: #f39c12; stroke: #e67e22; stroke-width: 2; }
      .multimodal { fill: #9b59b6; stroke: #8e44ad; stroke-width: 1; }
      .evolution-cycle { stroke: #27ae60; stroke-width: 3; fill: none; }
      .natural-language { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
    </style>
    
    <!-- 화살표 마커 정의 -->
    <marker id="evolution-arrow" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60" />
    </marker>
    
    <!-- 자연어 화살표 -->
    <marker id="language-arrow" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db" />
    </marker>
  </defs>

  <!-- 중앙 AI 기반 지능형 문서 -->
  <g id="center-ai-document">
    <circle cx="500" cy="190" r="70" class="ai-brain"/>
    <text x="500" y="175" text-anchor="middle" class="stage-text" fill="white">AI 지능형</text>
    <text x="500" y="195" text-anchor="middle" class="stage-text" fill="white">문서</text>
    <text x="500" y="215" text-anchor="middle" class="desc-text" fill="white">자가진화·학습</text>
    
    <!-- AI 뇌 시뮬레이션 -->
    <circle cx="460" cy="170" r="5" fill="white" opacity="0.8"/>
    <circle cx="500" cy="150" r="5" fill="white" opacity="0.8"/>
    <circle cx="480" cy="190" r="3" fill="white" opacity="0.6"/>
    <circle cx="525" cy="190" r="3" fill="white" opacity="0.6"/>
    <circle cx="500" cy="230" r="4" fill="white" opacity="0.7"/>
  </g>

  <!-- AI 모델들 -->
  <!-- GPT -->
  <g id="gpt-model">
    <rect x="200" y="80" width="80" height="50" rx="25" class="ai-model"/>
    <text x="240" y="110" text-anchor="middle" class="stage-text" fill="white">GPT</text>
    <text x="240" y="125" text-anchor="middle" class="desc-text" fill="white">OpenAI</text>
  </g>

  <!-- Claude -->
  <g id="claude-model">
    <rect x="720" y="80" width="80" height="50" rx="25" class="ai-model"/>
    <text x="760" y="110" text-anchor="middle" class="stage-text" fill="white">Claude</text>
    <text x="760" y="125" text-anchor="middle" class="desc-text" fill="white">Anthropic</text>
  </g>

  <!-- Gemini -->
  <g id="gemini-model">
    <rect x="200" y="300" width="80" height="50" rx="25" class="ai-model"/>
    <text x="240" y="330" text-anchor="middle" class="stage-text" fill="white">Gemini</text>
    <text x="240" y="345" text-anchor="middle" class="desc-text" fill="white">Google</text>
  </g>

  <!-- NotebookLM -->
  <g id="notebooklm-model">
    <rect x="720" y="300" width="80" height="50" rx="25" class="ai-model"/>
    <text x="760" y="325" text-anchor="middle" class="desc-text" fill="white">Notebook</text>
    <text x="760" y="340" text-anchor="middle" class="desc-text" fill="white">LM</text>
  </g>

  <!-- 연결선들 (AI 모델에서 중앙으로) -->
  <line x1="280" y1="105" x2="430" y2="160" class="evolution-cycle" marker-end="url(#evolution-arrow)"/>
  <line x1="720" y1="105" x2="570" y2="160" class="evolution-cycle" marker-end="url(#evolution-arrow)"/>
  <line x1="280" y1="325" x2="430" y2="220" class="evolution-cycle" marker-end="url(#evolution-arrow)"/>
  <line x1="720" y1="325" x2="570" y2="220" class="evolution-cycle" marker-end="url(#evolution-arrow)"/>

  <!-- 자연어 인터페이스 -->
  <g id="natural-language-interface">
    <rect x="420" y="40" width="160" height="55" rx="20" class="natural-language"/>
    <text x="500" y="65" text-anchor="middle" class="stage-text" fill="white">자연어 인터페이스</text>
    
    <!-- 음성 입력 -->
    <circle cx="450" cy="80" r="8" fill="white" opacity="0.8"/>
    <text x="450" y="85" text-anchor="middle" class="desc-text" fill="#3498db">🎤</text>
    
    <!-- 텍스트 입력 -->
    <circle cx="500" cy="80" r="8" fill="white" opacity="0.8"/>
    <text x="500" y="85" text-anchor="middle" class="desc-text" fill="#3498db">💬</text>
    
    <!-- 제스처 입력 -->
    <circle cx="550" cy="80" r="8" fill="white" opacity="0.8"/>
    <text x="550" y="85" text-anchor="middle" class="desc-text" fill="#3498db">✋</text>
    
    <!-- 연결선 -->
    <line x1="500" y1="100" x2="500" y2="120" stroke="#3498db" stroke-width="3" marker-end="url(#language-arrow)"/>
  </g>

  <!-- 자가 진화 사이클 -->
  <g id="evolution-cycle-diagram" transform="translate(30, 20)">
    <text x="650" y="140" class="stage-text">자가 진화 사이클</text>
    
    <!-- 학습 -->
    <rect x="630" y="150" width="50" height="25" rx="12" fill="#27ae60"/>
    <text x="655" y="167" text-anchor="middle" class="desc-text" fill="white">학습</text>
    
    <!-- 개선 -->
    <rect x="690" y="180" width="50" height="25" rx="12" fill="#f39c12"/>
    <text x="715" y="197" text-anchor="middle" class="desc-text" fill="white">개선</text>
    
    <!-- 적응 -->
    <rect x="630" y="210" width="50" height="25" rx="12" fill="#e74c3c"/>
    <text x="655" y="227" text-anchor="middle" class="desc-text" fill="white">적응</text>
    
    <!-- 사이클 화살표 -->
    <path d="M 680 162 Q 700 162 710 182" stroke="#27ae60" stroke-width="1" fill="none" marker-end="url(#evolution-arrow)"/>
    <path d="M 715 205 Q 715 225 685 220" stroke="#f39c12" stroke-width="1" fill="none" marker-end="url(#evolution-arrow)"/>
    <path d="M 630 222 Q 550 190 625 160" stroke="#e74c3c" stroke-width="1" fill="none" marker-end="url(#evolution-arrow)"/>
  </g>

  <!-- 멀티모달 입출력 -->
  <g id="multimodal-io" transform="translate(-50, 20)">
    <text x="320" y="140" class="stage-text">멀티모달 I/O</text>
    
    <!-- 텍스트 -->
    <rect x="320" y="150" width="35" height="20" rx="3" class="multimodal"/>
    <text x="337" y="164" text-anchor="middle" class="desc-text" fill="white">텍스트</text>
    
    <!-- 코드 -->
    <rect x="360" y="150" width="35" height="20" rx="3" class="multimodal"/>
    <text x="377" y="164" text-anchor="middle" class="desc-text" fill="white">코드</text>
    
    <!-- 이미지 -->
    <rect x="320" y="175" width="35" height="20" rx="3" class="multimodal"/>
    <text x="337" y="189" text-anchor="middle" class="desc-text" fill="white">이미지</text>
    
    <!-- 음성 -->
    <rect x="360" y="175" width="35" height="20" rx="3" class="multimodal"/>
    <text x="377" y="189" text-anchor="middle" class="desc-text" fill="white">음성</text>
    
    <!-- 비디오 -->
    <rect x="320" y="200" width="35" height="20" rx="3" class="multimodal"/>
    <text x="337" y="214" text-anchor="middle" class="desc-text" fill="white">비디오</text>
    
    <!-- 데이터 -->
    <rect x="360" y="200" width="35" height="20" rx="3" class="multimodal"/>
    <text x="377" y="214" text-anchor="middle" class="desc-text" fill="white">데이터</text>
    
    <!-- 연결선 -->
    <line x1="400" y1="170" x2="470" y2="170" stroke="#9b59b6" stroke-width="3" marker-end="url(#evolution-arrow)"/>
  </g>

  <!-- 특징 설명 박스들 -->
  <g id="characteristics" transform="translate(0, 100)">
    <!-- 자가 진화 -->
    <rect x="50" y="280" width="200" height="80" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="150" y="305" text-anchor="middle" class="stage-text">자가 진화</text>
    <text x="60" y="325" class="desc-text">AI 자동 개선</text>
    <text x="60" y="340" class="desc-text">지속적 학습</text>
    <text x="60" y="355" class="desc-text">스스로 업데이트</text>

    <!-- 대화형 인터페이스 -->
    <rect x="280" y="280" width="200" height="80" rx="8" fill="#ebf3fd" stroke="#3498db" stroke-width="2"/>
    <text x="380" y="305" text-anchor="middle" class="stage-text">대화형 인터페이스</text>
    <text x="290" y="325" class="desc-text">자연어 소통</text>
    <text x="290" y="340" class="desc-text">즉시 응답</text>
    <text x="290" y="355" class="desc-text">맥락 이해</text>

    <!-- 멀티모달 -->
    <rect x="510" y="280" width="200" height="80" rx="8" fill="#f4f3ff" stroke="#9b59b6" stroke-width="2"/>
    <text x="610" y="305" text-anchor="middle" class="stage-text">멀티모달</text>
    <text x="520" y="325" class="desc-text">다양한 형식 통합</text>
    <text x="520" y="340" class="desc-text">크로스 모달 변환</text>
    <text x="520" y="355" class="desc-text">무한 표현력</text>

    <!-- 실시간 적응 -->
    <rect x="740" y="280" width="200" height="80" rx="8" fill="#fdf2e9" stroke="#e67e22" stroke-width="2"/>
    <text x="840" y="305" text-anchor="middle" class="stage-text">실시간 적응</text>
    <text x="750" y="325" class="desc-text">사용자 맞춤형</text>
    <text x="750" y="340" class="desc-text">동적 개인화</text>
    <text x="750" y="355" class="desc-text">예측적 준비</text>
  </g>

</svg>