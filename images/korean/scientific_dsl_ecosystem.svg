<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="550" viewBox="0 40 900 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Noto Sans KR', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .section-title { font-family: 'Noto Sans KR', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .section-title-quarto { font-family: 'Noto Sans KR', Arial, sans-serif; font-size: 27px; font-weight: bold; fill: #ffffff; }
      .dsl-main-text { font-family: 'Noto Sans KR', Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }
      .dsl-desc-text { font-family: 'Noto Sans KR', Arial, sans-serif; font-size: 9px; fill: #ffffff; font-style: italic; }
      .dsl-tech-text { font-family: 'Noto Sans KR', Arial, sans-serif; font-size: 8px; fill: #ffffff; }
      .core-dsl { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .support-dsl { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .meta-dsl { fill: #f39c12; stroke: #e67e22; stroke-width: 2; }
      .viz-dsl { fill: #27ae60; stroke: #229954; stroke-width: 2; }
      .center-circle { fill: #9b59b6; stroke: #8e44ad; stroke-width: 4; }
      .connection-line { stroke: #7f8c8d; stroke-width: 1.5; stroke-dasharray: 3,3; }
      .subtitle-text { font-family: 'Noto Sans KR', Arial, sans-serif; font-size: 14px; fill: #34495e; }
    </style>
  </defs>

  <!-- Central Quarto Circle -->
  <circle cx="450" cy="325" r="80" class="center-circle"/>
  <text x="450" y="305" text-anchor="middle" class="section-title-quarto" fill="white" font-size="16px">Quarto</text>
  <text x="450" y="330" text-anchor="middle" class="dsl-desc-text" fill="white" font-size="11px">문서 코드화</text>
  <text x="450" y="345" text-anchor="middle" class="dsl-desc-text" fill="white" font-size="11px">오케스트라</text>

  <!-- 상단: 핵심 표현 DSL -->
  
  <!-- LaTeX 수식: 과학적 정확성의 언어 -->
  <rect x="200" y="80" width="160" height="70" rx="12" class="core-dsl"/>
  <text x="280" y="100" text-anchor="middle" class="section-title">수식 시스템</text>
  <text x="280" y="115" text-anchor="middle" class="dsl-desc-text">과학적 정확성의 언어</text>
  <text x="280" y="130" text-anchor="middle" class="dsl-tech-text">LaTeX, KaTeX, MathJax</text>
  <text x="280" y="142" text-anchor="middle" class="dsl-tech-text">E = mc², ∇²ψ = 0</text>
  <line x1="300" y1="150" x2="400" y2="245" class="connection-line"/>
  
  <!-- ggplot2: 데이터의 시각적 스토리텔링 -->
  <rect x="540" y="80" width="160" height="70" rx="12" class="viz-dsl"/>
  <text x="620" y="100" text-anchor="middle" class="section-title">그래프 문법</text>
  <text x="620" y="115" text-anchor="middle" class="dsl-desc-text">데이터의 시각적 스토리텔링</text>
  <text x="620" y="130" text-anchor="middle" class="dsl-tech-text">ggplot2, Vega-Lite</text>
  <text x="620" y="142" text-anchor="middle" class="dsl-tech-text">aes() + geom_point()</text>
  <line x1="600" y1="150" x2="500" y2="245" class="connection-line"/>

  <!-- 좌측: 구조화 DSL -->
  
  <!-- gt 표: 정보의 구조화된 표현 -->
  <rect x="20" y="200" width="160" height="70" rx="12" class="core-dsl"/>
  <text x="100" y="220" text-anchor="middle" class="section-title">표 문법</text>
  <text x="100" y="235" text-anchor="middle" class="dsl-desc-text">정보의 구조화된 표현</text>
  <text x="100" y="250" text-anchor="middle" class="dsl-tech-text">gt, kableExtra</text>
  <text x="100" y="262" text-anchor="middle" class="dsl-tech-text">tab_header() + fmt_*()</text>
  <line x1="180" y1="235" x2="370" y2="290" class="connection-line"/>

  <!-- 다이어그램: 사고의 시각화 -->
  <rect x="20" y="290" width="160" height="70" rx="12" class="viz-dsl"/>
  <text x="100" y="310" text-anchor="middle" class="section-title">다이어그램 언어</text>
  <text x="100" y="325" text-anchor="middle" class="dsl-desc-text">사고의 시각화</text>
  <text x="100" y="340" text-anchor="middle" class="dsl-tech-text">Mermaid, GraphViz</text>
  <text x="100" y="352" text-anchor="middle" class="dsl-tech-text">A --> B --> C</text>
  <line x1="180" y1="325" x2="370" y2="315" class="connection-line"/>

  <!-- 우측: 모델링 DSL -->
  
  <!-- 통계 모델링: 불확실성의 정량화 -->
  <rect x="720" y="200" width="160" height="70" rx="12" class="support-dsl"/>
  <text x="800" y="220" text-anchor="middle" class="section-title">통계 모델링</text>
  <text x="800" y="235" text-anchor="middle" class="dsl-desc-text">불확실성의 정량화</text>
  <text x="800" y="250" text-anchor="middle" class="dsl-tech-text">Stan, tidymodels</text>
  <text x="800" y="262" text-anchor="middle" class="dsl-tech-text">y ~ normal(μ, σ)</text>
  <line x1="720" y1="235" x2="530" y2="290" class="connection-line"/>

  <!-- 참고문헌: 지식의 계보 추적 -->
  <rect x="720" y="290" width="160" height="70" rx="12" class="core-dsl"/>
  <text x="800" y="310" text-anchor="middle" class="section-title">참고문헌</text>
  <text x="800" y="325" text-anchor="middle" class="dsl-desc-text">지식의 계보 추적</text>
  <text x="800" y="340" text-anchor="middle" class="dsl-tech-text">BibTeX, CSL</text>
  <text x="800" y="352" text-anchor="middle" class="dsl-tech-text">[@author2024]</text>
  <line x1="720" y1="325" x2="530" y2="315" class="connection-line"/>

  <!-- 하단: 관리 DSL -->
  
  <!-- YAML: 문서의 DNA -->
  <rect x="200" y="470" width="160" height="70" rx="12" class="meta-dsl"/>
  <text x="280" y="490" text-anchor="middle" class="section-title">메타데이터</text>
  <text x="280" y="505" text-anchor="middle" class="dsl-desc-text">문서의 DNA</text>
  <text x="280" y="520" text-anchor="middle" class="dsl-tech-text">YAML, TOML</text>
  <text x="280" y="532" text-anchor="middle" class="dsl-tech-text">title: "연구 제목"</text>
  <line x1="320" y1="470" x2="410" y2="405" class="connection-line"/>

  <!-- 코드 문서화: 재현가능성의 보장 -->
  <rect x="540" y="470" width="160" height="70" rx="12" class="meta-dsl"/>
  <text x="620" y="490" text-anchor="middle" class="section-title">코드 문서화</text>
  <text x="620" y="505" text-anchor="middle" class="dsl-desc-text">재현가능성의 보장</text>
  <text x="620" y="520" text-anchor="middle" class="dsl-tech-text">Roxygen2, JSDoc</text>
  <text x="620" y="532" text-anchor="middle" class="dsl-tech-text">#' @param data 입력</text>
  <line x1="580" y1="470" x2="490" y2="405" class="connection-line"/>

  <!-- 하단 메시지 -->
  <text x="450" y="440" text-anchor="middle" class="subtitle-text" font-style="italic" fill="#7f8c8d">
    각 DSL은 과학적 사고의 특정 측면을 코드로 표현하며, Quarto가 이들을 조화롭게 통합합니다.
  </text>
</svg>