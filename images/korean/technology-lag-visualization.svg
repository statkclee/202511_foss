<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
  <defs>
    <style><![CDATA[
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 42px; font-weight: 900; fill: #f8fafc; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 24px; font-weight: 600; fill: #cbd5e1; }
      .quote { font-family: Georgia, serif; font-size: 22px; font-weight: 600; fill: #fbbf24; font-style: italic; }
      .quote-small { font-family: Georgia, serif; font-size: 16px; font-weight: 500; fill: #e5e7eb; font-style: italic; }
      .author { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #94a3b8; }
      .current-year { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 32px; font-weight: 900; fill: #34d399; }
      .tech-year { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 800; }
      .tech-label { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: 700; }
      .population { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: bolder; fill: #94a3b8; }
      .note-text { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: normal; fill: #94a3b8; }
      .time-gap { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: bolder; fill: #f87171; }
      .device-icon { font-family: Arial, sans-serif; font-size: 24px; }
    ]]></style>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Time gradient -->
    <linearGradient id="timeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="30%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Technology era colors -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="socialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Effects -->
    <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#34d399" flood-opacity="0.6"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/></filter>

    <!-- Arrow markers -->
    <marker id="arrowTime" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1000" fill="url(#bg)"/>

  <!-- Header -->
  <text x="700" y="60" text-anchor="middle" class="title">2025년 9월, 그러나 모두가 다른 시대를 산다</text>
  <text x="700" y="95" text-anchor="middle" class="subtitle">September 2025: Everyone Lives in Different Technological Eras</text>

  <!-- William Gibson Quote -->
  <g transform="translate(700,170)">
    <rect x="-400" y="-35" width="800" height="70" rx="15" fill="#1f2937" opacity="0.8"/>
    <text x="0" y="-10" text-anchor="middle" class="quote">"미래는 이미 와 있다 — 단지 고르게 분포되어 있지 않을 뿐이다"</text>
    <text x="0" y="15" text-anchor="middle" class="quote-small">"The future is already here — it's just not evenly distributed."</text>
    <text x="0" y="35" text-anchor="middle" class="author">— William Gibson</text>
  </g>

  <!-- Time Machine Stairs -->
  <g transform="translate(100,320)">
    <!-- Timeline axis -->
    <line x1="0" y1="500" x2="1200" y2="100" stroke="url(#timeGrad)" stroke-width="8" opacity="0.3"/>
    
    <!-- Current year marker -->
    <line x1="1050" y1="150" x2="1200" y2="100" stroke="#34d399" stroke-width="6"/>
    <text x="1150" y="90" class="current-year">2025년 9월</text>
    <text x="1230" y="125" class="author">현재</text>

    <!-- AI Era (ChatGPT users) -->
    <g>
      <rect x="950" y="180" width="200" height="80" rx="10" fill="url(#aiGrad)" filter="url(#shadow)"/>
      <text x="1050" y="210" text-anchor="middle" class="device-icon">🤖</text>
      <text x="1050" y="230" text-anchor="middle" class="tech-year" fill="#000">2025년 수준</text>
      <text x="1050" y="250" text-anchor="middle" class="tech-label" fill="#000">ChatGPT 사용자</text>
      <text x="850" y="220" text-anchor="end" class="population">2억 명 (2.4%)</text>
      
      <!-- Time arrow -->
      <line x1="900" y1="220" x2="950" y2="220" stroke="#f87171" stroke-width="3" marker-end="url(#arrowTime)"/>
      <text x="865" y="250" text-anchor="middle" class="time-gap">2개월 격차</text>
    </g>

    <!-- Social Media Era (Instagram/Facebook users) -->
    <g>
      <rect x="650" y="280" width="200" height="80" rx="10" fill="url(#socialGrad)" filter="url(#shadow)"/>
      <text x="750" y="310" text-anchor="middle" class="device-icon">📱</text>
      <text x="750" y="330" text-anchor="middle" class="tech-year" fill="#000">2013년 수준</text>
      <text x="750" y="350" text-anchor="middle" class="tech-label" fill="#000">SNS 사용자</text>
      <text x="550" y="320" text-anchor="end" class="population">48억 명 (58.5%)</text>
      
      <!-- Time arrow -->
      <line x1="600" y1="320" x2="650" y2="320" stroke="#f87171" stroke-width="3" marker-end="url(#arrowTime)"/>
      <text x="565" y="350" text-anchor="middle" class="time-gap">12년 뒤처짐</text>
    </g>

    <!-- Internet Era (Basic web users) -->
    <g>
      <rect x="350" y="380" width="200" height="80" rx="10" fill="url(#webGrad)" filter="url(#shadow)"/>
      <text x="450" y="410" text-anchor="middle" class="device-icon">💻</text>
      <text x="450" y="430" text-anchor="middle" class="tech-year" fill="#fff">1998년 수준</text>
      <text x="450" y="450" text-anchor="middle" class="tech-label" fill="#fff">인터넷만 사용</text>
      <text x="250" y="420" text-anchor="end" class="population">5억 명 (6.1%)</text>
      
      <!-- Time arrow -->
      <line x1="300" y1="420" x2="350" y2="420" stroke="#f87171" stroke-width="3" marker-end="url(#arrowTime)"/>
      <text x="265" y="450" text-anchor="middle" class="time-gap">27년 뒤처짐</text>
    </g>

    <!-- Phone Era (Analog users) -->
    <g>
      <rect x="50" y="480" width="200" height="80" rx="10" fill="url(#phoneGrad)" filter="url(#shadow)"/>
      <text x="150" y="510" text-anchor="middle" class="device-icon">☎️</text>
      <text x="150" y="530" text-anchor="middle" class="tech-year" fill="#fff">1950년대 수준</text>
      <text x="150" y="550" text-anchor="middle" class="tech-label" fill="#fff">전화/오프라인만</text>
      <text x="-10" y="480" text-anchor="end" class="population">27억 명</text>
      <text x="-10" y="500" text-anchor="end" class="population">(32.9%)</text>
      
      <!-- Time arrow -->
      <line x1="0" y1="520" x2="50" y2="520" stroke="#f87171" stroke-width="3" marker-end="url(#arrowTime)"/>
      <text x="-35" y="550" text-anchor="middle" class="time-gap">75년 뒤처짐</text>
    </g>
  </g>

  <!-- Technology Clock -->
  <g transform="translate(300,400)">
    <rect x="-220" y="-160" width="400" height="390" rx="25" fill="#1f2937" opacity="0.8" filter="url(#shadow)"/>
    <text x="0" y="-120" text-anchor="middle" class="tech-year" fill="#34d399">기술 시계</text>
    <text x="0" y="-100" text-anchor="middle" class="author">Technology Clock</text>
    
    <!-- Clock face -->
    <circle cx="0" cy="50" r="130" fill="none" stroke="#475569" stroke-width="6"/>
    
    <!-- Hour markers -->
    <g stroke="#94a3b8" stroke-width="4" transform="translate(0,50)">
      <line x1="0" y1="-120" x2="0" y2="-100" transform="rotate(0)"/>  <!-- 12시 -->
      <line x1="0" y1="-120" x2="0" y2="-100" transform="rotate(30)"/> <!-- 1시 -->
      <line x1="0" y1="-120" x2="0" y2="-100" transform="rotate(60)"/> <!-- 2시 -->
      <line x1="0" y1="-120" x2="0" y2="-100" transform="rotate(90)"/> <!-- 3시 -->
      <line x1="0" y1="-120" x2="0" y2="-100" transform="rotate(180)"/><!-- 6시 -->
      <line x1="0" y1="-120" x2="0" y2="-100" transform="rotate(270)"/><!-- 9시 -->
    </g>
    
    <!-- Clock hands pointing to different eras -->
    <g transform="translate(0,50)">
      <!-- AI: 12시 (2025년 현재) -->
      <line x1="0" y1="0" x2="0" y2="-100" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
      <!-- SNS: 11시 (2013년, 12년 전) -->
      <line x1="0" y1="0" x2="-50" y2="-86" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
      <!-- Web: 9시 (1998년, 27년 전) -->
      <line x1="0" y1="0" x2="-90" y2="0" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
      <!-- Phone: 6시 (1950년대, 75년 전) -->
      <line x1="0" y1="0" x2="0" y2="90" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    </g>
    
    <!-- Center dot -->
    <circle cx="0" cy="50" r="10" fill="#34d399"/>
    
    <!-- Labels positioned clearly without overlap -->
    <text x="60" y="-20" text-anchor="middle" class="tech-label" fill="#fbbf24">2025 (AI)</text>
    <text x="-70" y="-20" text-anchor="end" class="tech-label" fill="#10b981">2013 (SNS)</text>
    <text x="-140" y="60" text-anchor="end" class="tech-label" fill="#3b82f6">1998</text>
    <text x="-140" y="80" text-anchor="end" class="tech-label" fill="#3b82f6">(인터넷)</text>
    <text x="0" y="210" text-anchor="middle" class="tech-label" fill="#64748b">1950 (전화)</text>
  </g>

  <!-- Population pyramid -->
  <g transform="translate(1150,700)">
    <rect x="-120" y="-60" width="350" height="210" rx="15" fill="#1f2937" opacity="0.8" filter="url(#shadow)"/>
    <text x="30" y="-25" text-anchor="middle" class="tech-year" fill="#34d399">전 세계 인구 분포</text>
    <text x="30" y="-5" text-anchor="middle" class="author">Global Population Distribution</text>
    
    <!-- Bars representing population -->
    <rect x="-100" y="10" width="20" height="25" fill="url(#aiGrad)"/>
    <text x="-70" y="27" class="tech-label" fill="#fbbf24">AI 사용자 2억명 (2.4%)</text>
    
    <rect x="-100" y="45" width="116" height="25" fill="url(#socialGrad)"/>
    <text x="30" y="62" class="tech-label" fill="#10b981">SNS 사용자 48억명 (58.5%)</text>
    
    <rect x="-100" y="80" width="12" height="25" fill="url(#webGrad)"/>
    <text x="-80" y="97" class="tech-label" fill="#3b82f6">Web만 5억명 (6.1%)</text>
    
    <rect x="-100" y="115" width="66" height="25" fill="url(#phoneGrad)"/>
    <text x="-20" y="132" class="tech-label" fill="#64748b">Offline 27억명 (32.9%)</text>
  </g>

  <!-- Key insight -->
  <g transform="translate(700,930)">
    <rect x="-400" y="-45" width="800" height="90" rx="25" fill="#1f2937" opacity="0.8"/>
    <text x="0" y="-15" text-anchor="middle" class="tech-year" fill="#f87171">핵심 통찰: 같은 2025년을 살지만, 실제로는 1950년~2025년 사이 어딘가에 흩어져 살고 있다</text>
    <text x="0" y="10" text-anchor="middle" class="note-text">• 전 세계 인구의 약 32%가 인터넷 미사용 (2024, ITU)</text>
    <text x="0" y="30" text-anchor="middle" class="note-text">• ChatGPT 주간활성 사용자 ≈ 전 세계 82억명의 2.4% (2024.08 기준 2억 명, OpenAI)</text>
  </g>
</svg>