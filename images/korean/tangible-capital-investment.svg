<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <style><![CDATA[
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 40px; font-weight: 900; fill: #f8fafc; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 22px; font-weight: 600; fill: #cbd5e1; }
      .h1 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #ffffff; }
      .h2 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #f1f5f9; }
      .p { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #e5e7eb; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #cbd5e1; }
    ]]></style>

  <!-- Central core gradient definition -->
    <radialGradient id="gradCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </radialGradient>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Investment area gradients -->
    <linearGradient id="gradInfra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="gradHardware" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>

    <linearGradient id="gradCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="gradData" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="gradSecurity" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Effects -->
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/></filter>
    <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#60a5fa" flood-opacity="0.4"/></filter>

    <!-- Connection lines -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- Header -->
  <text x="700" y="60" text-anchor="middle" class="title">유형자본 투자 영역</text>
  <text x="700" y="95" text-anchor="middle" class="subtitle">Tangible Capital Investment Areas for AI Era</text>

  <g transform="translate(0,-80)">
    <!-- Central hub -->
    <g transform="translate(700,450)">
      <circle cx="0" cy="0" r="80" fill="url(#gradCore)" filter="url(#shadow)" opacity="0.9"/>
      <text x="0" y="-10" text-anchor="middle" class="h2" fill="#000">AI 인프라</text>
      <text x="0" y="15" text-anchor="middle" class="small" fill="#000">유형자본 투자</text>
      <circle cx="0" cy="0" r="80" fill="none" stroke="#60a5fa" stroke-width="3" filter="url(#glow)"/>
    </g>

    <!-- Investment Area 1: IT Infrastructure -->
    <g transform="translate(200,200)">
      <rect x="0" y="0" width="280" height="180" rx="20" fill="url(#gradInfra)" filter="url(#shadow)" opacity="0.9"/>
      <text x="140" y="35" text-anchor="middle" class="h1">🏗️ IT 인프라</text>
      <text x="140" y="65" text-anchor="middle" class="small">IT Infrastructure</text>
      
      <g transform="translate(20,95)" class="p">
        <text x="0" y="0" class="h2" fill="#67e8f9">핵심 투자:</text>
        <text x="0" y="25" fill="#cffafe">• 고성능 네트워크 구축</text>
        <text x="0" y="45" fill="#cffafe">• 5G/6G 통신망 확충</text>
        <text x="0" y="65" fill="#cffafe">• 엣지 컴퓨팅 인프라</text>
      </g>
    </g>

    <!-- Investment Area 2: Computing Hardware -->
    <g transform="translate(920,200)">
      <rect x="0" y="0" width="280" height="180" rx="20" fill="url(#gradHardware)" filter="url(#shadow)" opacity="0.9"/>
      <text x="140" y="35" text-anchor="middle" class="h1">💻 컴퓨팅 하드웨어</text>
      <text x="140" y="65" text-anchor="middle" class="small">Computing Hardware</text>
      
      <g transform="translate(20,95)" class="p">
        <text x="0" y="0" class="h2" fill="#bef264">핵심 투자:</text>
        <text x="0" y="25" fill="#ecfccb">• GPU/TPU 클러스터</text>
        <text x="0" y="45" fill="#ecfccb">• 고성능 서버 시스템</text>
        <text x="0" y="65" fill="#ecfccb">• 양자 컴퓨팅 장비</text>
      </g>
    </g>

    <!-- Investment Area 3: Cloud Platform -->
    <g transform="translate(200,520)">
      <rect x="0" y="0" width="280" height="180" rx="20" fill="url(#gradCloud)" filter="url(#shadow)" opacity="0.9"/>
      <text x="140" y="35" text-anchor="middle" class="h1">☁️ 클라우드 플랫폼</text>
      <text x="140" y="65" text-anchor="middle" class="small">Cloud Platform</text>
      
      <g transform="translate(20,95)" class="p">
        <text x="0" y="0" class="h2" fill="#ddd6fe">핵심 투자:</text>
        <text x="0" y="25" fill="#ede9fe">• 하이브리드 클라우드</text>
        <text x="0" y="45" fill="#ede9fe">• 컨테이너 오케스트레이션</text>
        <text x="0" y="65" fill="#ede9fe">• 서버리스 아키텍처</text>
      </g>
    </g>

    <!-- Investment Area 4: Data Center -->
    <g transform="translate(920,520)">
      <rect x="0" y="0" width="280" height="180" rx="20" fill="url(#gradData)" filter="url(#shadow)" opacity="0.9"/>
      <text x="140" y="35" text-anchor="middle" class="h1">🏢 데이터 센터</text>
      <text x="140" y="65" text-anchor="middle" class="small">Data Center</text>
      
      <g transform="translate(20,95)" class="p">
        <text x="0" y="0" class="h2" fill="#fde68a">핵심 투자:</text>
        <text x="0" y="25" fill="#fef3c7">• 대규모 스토리지 시스템</text>
        <text x="0" y="45" fill="#fef3c7">• 냉각 및 전력 시스템</text>
        <text x="0" y="65" fill="#fef3c7">• 재난 복구 시설</text>
      </g>
    </g>

    <!-- Investment Area 5: Security Infrastructure -->
    <g transform="translate(560,720)">
      <rect x="0" y="0" width="280" height="150" rx="20" fill="url(#gradSecurity)" filter="url(#shadow)" opacity="0.9"/>
      <text x="140" y="35" text-anchor="middle" class="h1">🔒 보안 인프라</text>
      <text x="140" y="65" text-anchor="middle" class="small">Security Infrastructure</text>
      
      <g transform="translate(20,95)" class="p">
        <text x="0" y="0" class="h2" fill="#fca5a5">핵심 투자:</text>
        <text x="0" y="25" fill="#fee2e2">• 사이버 보안 시스템</text>
        <text x="0" y="45" fill="#fee2e2">• 물리적 접근 통제</text>
      </g>
    </g>

    <!-- Connection lines from each area to center (absolute coordinates) -->
    <!-- IT Infrastructure (340, 290) to Center (700, 450) -->
    <line x1="480" y1="290" x2="635" y2="400" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.6"/>
    
    <!-- Computing Hardware (1060, 290) to Center (700, 450) -->
    <line x1="920" y1="290" x2="770" y2="400" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.6"/>
    
    <!-- Cloud Platform (240, 610) to Center (700, 450) -->
    <line x1="480" y1="610" x2="640" y2="510" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.6"/>
    
    <!-- Data Center (860, 610) to Center (700, 450) -->
    <line x1="920" y1="610" x2="770" y2="500" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.6"/>
    
    <!-- Security Infrastructure (700, 795) to Center (700, 450) -->
    <line x1="700" y1="720" x2="700" y2="530" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.6"/>
  </g>

  <!-- Bottom comparison panel -->
  <g transform="translate(700,850)">
    <rect x="-680" y="-40" width="1360" height="70" rx="15" fill="#1f2937" opacity="0.8" filter="url(#shadow)"/>
    <text x="0" y="-15" text-anchor="middle" class="h2" fill="#60a5fa">투자 특성: 즉각적 구매 가능, 빠른 감가상각</text>
    <text x="0" y="10" text-anchor="middle" class="p" fill="#cbd5e1">유형자본은 구매 즉시 사용 가능하나, 무형자본 없이는 AI 혁신 효과 제한적</text>
  </g>

  <!-- Investment characteristics comparison -->
  <g transform="translate(100,670)">
    <rect x="0" y="0" width="250" height="100" rx="10" fill="#1e3a8a" opacity="0.8"/>
    <text x="125" y="25" text-anchor="middle" class="h2" fill="#93c5fd">유형자본 특징</text>
    <text x="20" y="50" class="small" fill="#dbeafe">• 즉시 구매 가능</text>
    <text x="20" y="70" class="small" fill="#dbeafe">• 빠른 설치 및 활용</text>
    <text x="20" y="90" class="small" fill="#dbeafe">• 5-7년 감가상각</text>
  </g>

  <g transform="translate(1050,670)">
    <rect x="0" y="0" width="250" height="100" rx="10" fill="#14532d" opacity="0.8"/>
    <text x="125" y="25" text-anchor="middle" class="h2" fill="#86efac">투자 효과</text>
    <text x="20" y="50" class="small" fill="#dcfce7">• 기초 인프라 제공</text>
    <text x="20" y="70" class="small" fill="#dcfce7">• 처리 능력 향상</text>
    <text x="20" y="90" class="small" fill="#dcfce7">• 운영 효율성 증대</text>
  </g>
</svg>