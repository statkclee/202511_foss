<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .folder { fill: #FFD700; stroke: #B8860B; stroke-width: 2; }
      .file-hwp { fill: #FF6B6B; stroke: #D63031; stroke-width: 1; }
      .file-excel { fill: #00B894; stroke: #00A085; stroke-width: 1; }
      .file-spss { fill: #9B59B6; stroke: #8E44AD; stroke-width: 1; }
      .file-md { fill: #6C5CE7; stroke: #5A47D6; stroke-width: 1; }
      .file-data { fill: #74B9FF; stroke: #0984E3; stroke-width: 1; }
      .text { font-family: Arial, sans-serif; font-size: 11px; fill: #2D3436; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #2D3436; }
      .subtitle { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #636E72; }
      .problem { fill: #E17055; }
      .solution { fill: #00B894; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="460" fill="#F8F9FA"/>
  
  <!-- Left side: Traditional HWP way -->
  <text x="200" y="30" text-anchor="middle" class="subtitle problem">기존 HWP 방식</text>
  
  <!-- Project folder (left) -->
  <rect x="50" y="45" width="300" height="390" fill="#FFF" stroke="#DDD" stroke-width="1" rx="5"/>
  
  <!-- Main project folder -->
  <rect x="60" y="55" width="20" height="15" class="folder" rx="2"/>
  <text x="85" y="67" class="text">연구프로젝트_2024/</text>
  
  <!-- Files scattered everywhere -->
  <rect x="80" y="80" width="15" height="12" class="file-hwp" rx="1"/>
  <text x="100" y="90" class="text">최종보고서.hwp</text>
  
  <rect x="80" y="100" width="15" height="12" class="file-hwp" rx="1"/>
  <text x="100" y="110" class="text">최종보고서_수정.hwp</text>
  
  <rect x="80" y="120" width="15" height="12" class="file-hwp" rx="1"/>
  <text x="100" y="130" class="text">최종보고서_진짜최종.hwp</text>
  
  <rect x="80" y="140" width="15" height="12" class="file-hwp" rx="1"/>
  <text x="100" y="150" class="text">최종보고서_진짜최종_v2.hwp</text>
  
  <rect x="80" y="165" width="15" height="12" class="file-excel" rx="1"/>
  <text x="100" y="175" class="text">data_0315.xlsx</text>
  
  <rect x="80" y="185" width="15" height="12" class="file-excel" rx="1"/>
  <text x="100" y="195" class="text">data_modified.csv</text>
  
  <rect x="80" y="205" width="15" height="12" class="file-excel" rx="1"/>
  <text x="100" y="215" class="text">final_data_backup.xlsx</text>
  
  <rect x="80" y="225" width="15" height="12" class="file-excel" rx="1"/>
  <text x="100" y="235" class="text">분석결과_김박사.xlsx</text>
  
  <!-- SPSS files -->
  <rect x="80" y="245" width="15" height="12" class="file-spss" rx="1"/>
  <text x="100" y="255" class="text">survey_data.sav</text>
  
  <rect x="80" y="265" width="15" height="12" class="file-spss" rx="1"/>
  <text x="100" y="275" class="text">analysis_output.sav</text>
  
  <!-- Images scattered -->
  <rect x="80" y="290" width="15" height="12" fill="#FD79A8" stroke="#E84393" rx="1"/>
  <text x="100" y="300" class="text">그래프1.png</text>
  
  <rect x="80" y="310" width="15" height="12" fill="#FD79A8" stroke="#E84393" rx="1"/>
  <text x="100" y="320" class="text">표_복사본.png</text>
  
  <rect x="80" y="330" width="15" height="12" fill="#FD79A8" stroke="#E84393" rx="1"/>
  <text x="100" y="340" class="text">final_chart_edited.jpg</text>
  
  <!-- Problems list -->
  <text x="70" y="365" class="text problem">❌ 버전 추적 불가</text>
  <text x="70" y="380" class="text problem">❌ 데이터-문서 분리</text>
  <text x="70" y="395" class="text problem">❌ 재현 불가능</text>
  <text x="70" y="410" class="text problem">❌ 협업 어려움</text>
  <text x="70" y="425" class="text problem">❌ 플랫폼 종속</text>  
  
  <!-- Right side: Software toolchain -->
  <text x="600" y="30" text-anchor="middle" class="subtitle problem">HWP 생태계 도구</text>
  
  <!-- Software toolchain area -->
  <rect x="450" y="45" width="300" height="390" fill="#FFF" stroke="#DDD" stroke-width="1" rx="5"/>
  
  <!-- Step 1: Data Collection -->
  <text x="470" y="70" class="text" style="font-weight: bold;">1단계: 데이터 수집/입력</text>
  <rect x="480" y="75" width="18" height="13" class="file-excel" rx="2"/>
  <text x="503" y="85" class="text">Excel</text>
  <text x="540" y="85" class="text" style="font-size: 9px;">₩150,000/년</text>
  
  <!-- Step 2: Statistical Analysis -->
  <text x="470" y="110" class="text" style="font-weight: bold;">2단계: 통계 분석</text>
  <rect x="480" y="115" width="18" height="13" class="file-spss" rx="2"/>
  <text x="503" y="125" class="text">SPSS</text>
  <text x="540" y="125" class="text" style="font-size: 9px;">₩2,000,000/년</text>
  
  <rect x="480" y="135" width="18" height="13" fill="#4A90E2" stroke="#357ABD" rx="2"/>
  <text x="503" y="145" class="text">SAS</text>
  <text x="540" y="145" class="text" style="font-size: 9px;">₩3,000,000/년</text>
  
  <!-- Step 3: Visualization -->
  <text x="470" y="170" class="text" style="font-weight: bold;">3단계: 그래프/시각화</text>
  <rect x="480" y="175" width="18" height="13" fill="#FF8C00" stroke="#FF7F00" rx="2"/>
  <text x="503" y="185" class="text">Origin</text>
  <text x="540" y="185" class="text" style="font-size: 9px;">₩1,000,000/년</text>
  
  <rect x="480" y="195" width="18" height="13" class="file-excel" rx="2"/>
  <text x="503" y="205" class="text">Excel 차트</text>
  
  <!-- Step 4: Document Creation -->
  <text x="470" y="230" class="text" style="font-weight: bold;">4단계: 문서 작성</text>
  <rect x="480" y="235" width="18" height="13" class="file-hwp" rx="2"/>
  <text x="503" y="245" class="text">HWP</text>
  <text x="540" y="245" class="text" style="font-size: 9px;">₩150,000/년</text>
  
  <!-- Final PDF -->
  <rect x="480" y="260" width="18" height="13" fill="#E74C3C" stroke="#C0392B" rx=""/>
  <text x="503" y="270" class="text">PDF 출력</text>
  
  <!-- Manual workflow arrows -->
  <defs>
    <marker id="manual-arrow" markerWidth="8" markerHeight="6" 
     refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#E17055" />
    </marker>
  </defs>
  
  <!-- Workflow arrows -->
  <line x1="520" y1="88" x2="520" y2="105" stroke="#E17055" stroke-width="1" marker-end="url(#manual-arrow)"/>
  <text x="530" y="98" class="text" style="font-size: 8px; fill: #E17055;">수동복사</text>
  
  <line x1="520" y1="148" x2="520" y2="165" stroke="#E17055" stroke-width="1" marker-end="url(#manual-arrow)"/>
  <text x="530" y="158" class="text" style="font-size: 8px; fill: #E17055;">이미지저장</text>
  
  <line x1="520" y1="208" x2="520" y2="225" stroke="#E17055" stroke-width="1" marker-end="url(#manual-arrow)"/>
  <text x="530" y="218" class="text" style="font-size: 8px; fill: #E17055;">붙여넣기</text>
  
  <!-- Total cost box -->
  <rect x="460" y="290" width="270" height="60" fill="#FFE5E5" stroke="#E17055" stroke-width="2" rx="5"/>
  <text x="470" y="305" class="text" style="font-weight: bold; fill: #E17055;">연간 총 라이선스 비용</text>
  <text x="470" y="320" class="text">개인 연구자: 약 6,300,000원/년</text>
  <text x="470" y="335" class="text">연구실 (10명): 약 63,000,000원/년</text>
  
  <!-- Problems with toolchain -->
  <text x="470" y="370" class="text problem">❌ 단절된 워크플로우</text>
  <text x="470" y="385" class="text problem">❌ 수동 복사/붙여넣기</text>
  <text x="470" y="400" class="text problem">❌ 고비용 라이선스</text>
  <text x="470" y="415" class="text problem">❌ 재현 불가능</text>
  <text x="470" y="430" class="text problem">❌ 플랫폼 종속성</text>
  
  <!-- Arrow showing transformation -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00B894" />
    </marker>
  </defs>
  <line x1="360" y1="240" x2="440" y2="240" stroke="#00B894" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="400" y="220" text-anchor="middle" class="text" style="font-size: 17px; font-weight: bold; fill: #00B894;">구매 비용</text>
  
</svg>