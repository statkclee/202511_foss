<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="1400" height="420">
  <defs>
    <!-- 그림자 효과 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 그라디언트 -->
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    
    <!-- 화살표 마커 -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6c757d"/>
    </marker>
  </defs>
  
  <!-- 배경 -->
  <rect width="1400" height="420" fill="#ffffff"/>

  <!-- 중앙 문서 -->
  <g transform="translate(80, 90)">
    <!-- 문서 외곽 -->
    <rect x="0" y="0" width="240" height="280" 
          fill="url(#docGradient)" 
          stroke="#495057" 
          stroke-width="2" 
          rx="5" 
          filter="url(#shadow)"/>
    
    <!-- 문서 헤더 -->
    <rect x="0" y="0" width="240" height="35" 
          fill="#6610f2" 
          rx="5"/>
    <text x="120" y="22" font-family="Arial, sans-serif" 
          font-size="14" font-weight="bold" 
          text-anchor="middle" fill="white">디지털 문서</text>
    
    <!-- 문서 내용 미리보기 -->
    <g transform="translate(15, 45)">
      <!-- 제목 -->
      <rect x="0" y="0" width="100" height="10" fill="#dee2e6" rx="2"/>
      
      <!-- 텍스트 라인들 -->
      <rect x="0" y="15" width="210" height="6" fill="#e9ecef" rx="2"/>
      <rect x="0" y="24" width="180" height="6" fill="#e9ecef" rx="2"/>
      <rect x="0" y="33" width="195" height="6" fill="#e9ecef" rx="2"/>
      
      <!-- 그래프 영역 -->
      <rect x="0" y="48" width="95" height="60" fill="#d3f9d8" stroke="#51cf66" stroke-width="1" rx="3"/>
      <polyline points="10,100 25,85 40,93 55,75 70,83 85,70" 
                fill="none" stroke="#37b24d" stroke-width="2"/>
      
      <!-- 표 영역 -->
      <rect x="115" y="48" width="95" height="60" fill="#ffe8cc" stroke="#ff8787" stroke-width="1" rx="3"/>
      <g transform="translate(120, 53)">
        <rect x="0" y="0" width="85" height="17" fill="none" stroke="#fab005" stroke-width="1"/>
        <rect x="0" y="17" width="85" height="17" fill="none" stroke="#fab005" stroke-width="1"/>
        <rect x="0" y="34" width="85" height="17" fill="none" stroke="#fab005" stroke-width="1"/>
        <line x1="42" y1="0" x2="42" y2="51" stroke="#fab005" stroke-width="1"/>
      </g>
      
      <!-- 수식 -->
      <text x="0" y="125" font-family="Times, serif" font-size="12" fill="#495057">
        ∑ f(x) = ∫ φ(x)dx
      </text>
      
      <!-- 코드 블록 -->
      <rect x="0" y="133" width="210" height="35" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1" rx="3"/>
      <text x="8" y="145" font-family="monospace" font-size="9" fill="#099268">
        <tspan x="8" dy="0">def analyze(data):</tspan>
        <tspan x="8" dy="11">    return process(data)</tspan>
      </text>
      
      <!-- 이미지와 다이어그램 -->
      <rect x="0" y="175" width="70" height="45" fill="#e7f5ff" stroke="#339af0" stroke-width="1" rx="3"/>
      <text x="35" y="200" font-family="Arial" font-size="9" text-anchor="middle" fill="#1971c2">이미지</text>
      
      <g transform="translate(85, 175)">
        <rect x="0" y="0" width="125" height="45" fill="#f3f0ff" stroke="#9775fa" stroke-width="1" rx="3"/>
        <circle cx="25" cy="22" r="10" fill="#e5dbff" stroke="#9775fa" stroke-width="1"/>
        <circle cx="62" cy="22" r="10" fill="#e5dbff" stroke="#9775fa" stroke-width="1"/>
        <circle cx="99" cy="22" r="10" fill="#e5dbff" stroke="#9775fa" stroke-width="1"/>
        <line x1="35" y1="22" x2="52" y2="22" stroke="#9775fa" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="72" y1="22" x2="89" y2="22" stroke="#9775fa" stroke-width="1" marker-end="url(#arrow)"/>
      </g>
    </g>
  </g>
  
  <!-- 메인 연결선 (수평) -->
  <path d="M 320,230 L 400,230" stroke="#6c757d" stroke-width="3" fill="none"/>
  
  <!-- 수평선 연장 (위쪽 보조 요소용) -->
  <path d="M 400,230 L 400,150 L 1300,150" stroke="#6c757d" stroke-width="2" fill="none"/>
  
  <!-- 수평선 연장 (아래쪽 콘텐츠 요소용) -->
  <path d="M 400,230 L 400,310 L 1300,310" stroke="#6c757d" stroke-width="2" fill="none"/>
  
  <!-- 위쪽 그룹으로의 수직 연결선 (보조 요소) -->
  <g stroke="#6c757d" stroke-width="1.5" fill="none">
    <path d="M 500,150 L 500,110" marker-end="url(#arrow)"/>
    <path d="M 620,150 L 620,110" marker-end="url(#arrow)"/>
    <path d="M 740,150 L 740,110" marker-end="url(#arrow)"/>
    <path d="M 860,150 L 860,110" marker-end="url(#arrow)"/>
    <path d="M 980,150 L 980,110" marker-end="url(#arrow)"/>
    <path d="M 1100,150 L 1100,110" marker-end="url(#arrow)"/>
  </g>
  
  <!-- 아래쪽 그룹으로의 수직 연결선 (콘텐츠 요소) -->
  <g stroke="#6c757d" stroke-width="1.5" fill="none">
    <path d="M 500,310 L 500,350" marker-end="url(#arrow)"/>
    <path d="M 620,310 L 620,350" marker-end="url(#arrow)"/>
    <path d="M 740,310 L 740,350" marker-end="url(#arrow)"/>
    <path d="M 860,310 L 860,350" marker-end="url(#arrow)"/>
    <path d="M 980,310 L 980,350" marker-end="url(#arrow)"/>
    <path d="M 1100,310 L 1100,350" marker-end="url(#arrow)"/>
  </g>
  
  <!-- 위쪽 그룹 (보조 요소) - 더 위로 -->
  <g font-family="'Noto Sans KR', Arial, sans-serif">
    
    <!-- 글꼴 -->
    <g transform="translate(460, 50)">
      <rect x="0" y="0" width="80" height="60" fill="#fff3e0" stroke="#ff8f00" stroke-width="2" rx="4"/>
      <g transform="translate(12, 5)">
        <text x="12" y="18" font-family="Times, serif" font-size="16" font-weight="bold" fill="#e65100">A</text>
        <text x="28" y="18" font-family="Arial, sans-serif" font-size="13" fill="#f57c00">a</text>
        <text x="40" y="18" font-family="Courier, monospace" font-size="11" fill="#ff9800">字</text>
        <text x="12" y="32" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#d32f2f">가</text>
        <text x="28" y="32" font-family="Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">B</text>
        <text x="44" y="32" font-family="monospace" font-size="10" fill="#388e3c">1</text>
      </g>
      <text x="40" y="50" font-size="12" font-weight="bold" text-anchor="middle">글꼴</text>
    </g>
    
    <!-- AI/코드 -->
    <g transform="translate(580, 50)">
      <rect x="0" y="0" width="80" height="60" fill="#f8f9fa" stroke="#495057" stroke-width="2" rx="4"/>
      <text x="40" y="28" font-size="20" text-anchor="middle">🤖</text>
      <text x="40" y="48" font-size="12" font-weight="bold" text-anchor="middle">AI/코드</text>
    </g>
    
    <!-- 이미지 -->
    <g transform="translate(700, 50)">
      <rect x="0" y="0" width="80" height="60" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="4"/>
      <text x="40" y="28" font-size="20" text-anchor="middle">🖼️</text>
      <text x="40" y="48" font-size="12" font-weight="bold" text-anchor="middle">이미지</text>
    </g>
    
    <!-- 미디어 -->
    <g transform="translate(820, 50)">
      <rect x="0" y="0" width="80" height="60" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="4"/>
      <text x="40" y="28" font-size="20" text-anchor="middle">🎬</text>
      <text x="40" y="48" font-size="12" font-weight="bold" text-anchor="middle">미디어</text>
    </g>
    
    <!-- 참고문헌 -->
    <g transform="translate(940, 50)">
      <rect x="0" y="0" width="80" height="60" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="4"/>
      <text x="40" y="28" font-size="20" text-anchor="middle">📚</text>
      <text x="40" y="48" font-size="12" font-weight="bold" text-anchor="middle">참고문헌</text>
    </g>
    
    <!-- 메타데이터 -->
    <g transform="translate(1060, 50)">
      <rect x="0" y="0" width="80" height="60" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="4"/>
      <text x="40" y="28" font-size="20" text-anchor="middle">⚙️</text>
      <text x="40" y="48" font-size="12" font-weight="bold" text-anchor="middle">메타데이터</text>
    </g>
    
  </g>
  
  <!-- 아래쪽 그룹 (콘텐츠 요소) - 더 위로 -->
  <g font-family="'Noto Sans KR', Arial, sans-serif">
    
    <!-- 텍스트 -->
    <g transform="translate(460, 350)">
      <rect x="0" y="0" width="80" height="60" fill="#f8f9fa" stroke="#495057" stroke-width="2" rx="4"/>
      <text x="40" y="28" font-size="20" text-anchor="middle">📝</text>
      <text x="40" y="48" font-size="12" font-weight="bold" text-anchor="middle">텍스트</text>
    </g>
    
    <!-- 그래프 -->
    <g transform="translate(580, 350)">
      <rect x="0" y="0" width="80" height="60" fill="#f8f9fa" stroke="#495057" stroke-width="2" rx="4"/>
      <text x="40" y="28" font-size="20" text-anchor="middle">📊</text>
      <text x="40" y="48" font-size="12" font-weight="bold" text-anchor="middle">그래프</text>
    </g>
    
    <!-- 표 -->
    <g transform="translate(700, 350)">
      <rect x="0" y="0" width="80" height="60" fill="#f8f9fa" stroke="#495057" stroke-width="2" rx="4"/>
      <text x="40" y="28" font-size="20" text-anchor="middle">📋</text>
      <text x="40" y="48" font-size="12" font-weight="bold" text-anchor="middle">표</text>
    </g>
    
    <!-- 수식 -->
    <g transform="translate(820, 350)">
      <rect x="0" y="0" width="80" height="60" fill="#f8f9fa" stroke="#495057" stroke-width="2" rx="4"/>
      <text x="40" y="28" font-size="20" text-anchor="middle">∑</text>
      <text x="40" y="48" font-size="12" font-weight="bold" text-anchor="middle">수식</text>
    </g>
    
    <!-- 지도 -->
    <g transform="translate(940, 350)">
      <rect x="0" y="0" width="80" height="60" fill="#f8f9fa" stroke="#495057" stroke-width="2" rx="4"/>
      <text x="40" y="28" font-size="20" text-anchor="middle">🗺️</text>
      <text x="40" y="48" font-size="12" font-weight="bold" text-anchor="middle">지도</text>
    </g>
    
    <!-- 다이어그램 -->
    <g transform="translate(1060, 350)">
      <rect x="0" y="0" width="80" height="60" fill="#f8f9fa" stroke="#495057" stroke-width="2" rx="4"/>
      <text x="40" y="28" font-size="20" text-anchor="middle">🔀</text>
      <text x="40" y="48" font-size="12" font-weight="bold" text-anchor="middle">다이어그램</text>
    </g>
    
  </g>
  
  <!-- 라벨 -->
  <text x="1200" y="80" font-family="'Noto Sans KR', Arial, sans-serif" 
        font-size="20" text-anchor="start" fill="#868e96" font-style="italic">
    보조 요소
  </text>
  
  <text x="1200" y="380" font-family="'Noto Sans KR', Arial, sans-serif" 
        font-size="20" text-anchor="start" fill="#868e96" font-style="italic">
    콘텐츠 요소
  </text>
</svg>