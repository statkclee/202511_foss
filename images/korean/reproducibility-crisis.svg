<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .main-flow { fill: #E3F2FD; stroke: #1976D2; stroke-width: 2; }
      .problem-flow { fill: #FFEBEE; stroke: #D32F2F; stroke-width: 2; }
      .data-box { fill: #E8F5E8; stroke: #388E3C; stroke-width: 2; }
      .process-box { fill: #FFF3E0; stroke: #F57C00; stroke-width: 2; }
      .document-box { fill: #F3E5F5; stroke: #7B1FA2; stroke-width: 2; }
      .question-box { fill: #FFECEC; stroke: #E57373; stroke-width: 3; stroke-dasharray: 5,5; }
      
      .text { font-family: 'Noto Sans KR', Arial, sans-serif; font-size: 12px; fill: #2C3E50; }
      .title { font-family: 'Noto Sans KR', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #2C3E50; }
      .problem-text { font-family: 'Noto Sans KR', Arial, sans-serif; font-size: 11px; fill: #D32F2F; font-weight: bold; }
      .arrow-text { font-family: 'Noto Sans KR', Arial, sans-serif; font-size: 10px; fill: #666; }
    </style>
    
    <!-- Arrow markers -->
    <marker id="arrow-normal" markerWidth="8" markerHeight="6" 
     refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1976D2" />
    </marker>
    
    <marker id="arrow-problem" markerWidth="8" markerHeight="6" 
     refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D32F2F" />
    </marker>
    
    <!-- Gradient for emphasis -->
    <linearGradient id="normalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="problemGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFEBEE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFCDD2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#FAFBFC"/>
  
  <!-- Main workflow -->
  <text x="50" y="55" class="title" style="fill: #1976D2;">정상적인 연구 흐름</text>
  
  <!-- Step 1: Raw Data -->
  <rect x="50" y="70" width="100" height="40" class="data-box" rx="5" fill="url(#normalGradient)"/>
  <text x="100" y="85" text-anchor="middle" class="text">원본 데이터</text>
  <text x="100" y="100" text-anchor="middle" class="text">(.csv, .xlsx)</text>
  
  <!-- Step 2: Processing -->
  <rect x="200" y="70" width="100" height="40" class="process-box" rx="5" fill="url(#normalGradient)"/>
  <text x="250" y="85" text-anchor="middle" class="text">Excel 분석</text>
  <text x="250" y="100" text-anchor="middle" class="text">그래프 생성</text>
  
  <!-- Step 3: Copy Image -->
  <rect x="350" y="70" width="100" height="40" class="process-box" rx="5" fill="url(#normalGradient)"/>
  <text x="400" y="85" text-anchor="middle" class="text">이미지 복사</text>
  <text x="400" y="100" text-anchor="middle" class="text">(Ctrl+C)</text>
  
  <!-- Step 4: Document -->
  <rect x="500" y="70" width="100" height="40" class="document-box" rx="5" fill="url(#normalGradient)"/>
  <text x="550" y="85" text-anchor="middle" class="text">HWP 문서에</text>
  <text x="550" y="100" text-anchor="middle" class="text">붙여넣기</text>
  
  <!-- Final PDF -->
  <rect x="650" y="70" width="100" height="40" fill="#E1F5FE" stroke="#0277BD" stroke-width="2" rx="5"/>
  <text x="700" y="85" text-anchor="middle" class="text">최종 PDF</text>
  <text x="700" y="100" text-anchor="middle" class="text">보고서</text>
  
  <!-- Normal flow arrows -->
  <line x1="150" y1="90" x2="190" y2="90" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow-normal)"/>
  <line x1="300" y1="90" x2="340" y2="90" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow-normal)"/>
  <line x1="450" y1="90" x2="490" y2="90" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow-normal)"/>
  <line x1="600" y1="90" x2="640" y2="90" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow-normal)"/>
  
  <!-- Problem scenario -->
  <text x="50" y="180" class="title" style="fill: #D32F2F;">⚠️ 재현성 위기 시나리오</text>
  
  <!-- Data modification -->
  <rect x="50" y="200" width="100" height="50" class="question-box" rx="5" fill="url(#problemGradient)"/>
  <text x="100" y="220" text-anchor="middle" class="problem-text">데이터 수정</text>
  <text x="100" y="235" text-anchor="middle" class="problem-text">필요!</text>
  
  <!-- Question marks -->
  <rect x="200" y="200" width="100" height="50" class="question-box" rx="5"/>
  <text x="250" y="215" text-anchor="middle" class="problem-text">그래프를 다시</text>
  <text x="250" y="230" text-anchor="middle" class="problem-text">생성해야 할까?</text>
  <text x="250" y="245" text-anchor="middle" style="font-size: 24px; fill: #D32F2F;">❓</text>
  
  <rect x="350" y="200" width="100" height="50" class="question-box" rx="5"/>
  <text x="400" y="215" text-anchor="middle" class="problem-text">어떤 이미지를</text>
  <text x="400" y="230" text-anchor="middle" class="problem-text">복사했었지?</text>
  <text x="400" y="245" text-anchor="middle" style="font-size: 24px; fill: #D32F2F;">❓</text>
  
  <rect x="500" y="200" width="100" height="50" class="question-box" rx="5"/>
  <text x="550" y="215" text-anchor="middle" class="problem-text">문서를</text>
  <text x="550" y="230" text-anchor="middle" class="problem-text">업데이트할까?</text>
  <text x="550" y="245" text-anchor="middle" style="font-size: 24px; fill: #D32F2F;">❓</text>
  
  <!-- Broken document -->
  <rect x="650" y="200" width="100" height="50" fill="#FFCDD2" stroke="#D32F2F" stroke-width="3" rx="5"/>
  <text x="700" y="220" text-anchor="middle" class="problem-text">재현 불가능한</text>
  <text x="700" y="235" text-anchor="middle" class="problem-text">결과물</text>
  <text x="700" y="250" text-anchor="middle" style="font-size: 20px;">💥</text>
  
  <!-- Problem arrows -->
  <line x1="150" y1="225" x2="190" y2="225" stroke="#D32F2F" stroke-width="2" marker-end="url(#arrow-problem)" stroke-dasharray="3,3"/>
  <line x1="300" y1="225" x2="340" y2="225" stroke="#D32F2F" stroke-width="2" marker-end="url(#arrow-problem)" stroke-dasharray="3,3"/>
  <line x1="450" y1="225" x2="490" y2="225" stroke="#D32F2F" stroke-width="2" marker-end="url(#arrow-problem)" stroke-dasharray="3,3"/>
  <line x1="600" y1="225" x2="640" y2="225" stroke="#D32F2F" stroke-width="2" marker-end="url(#arrow-problem)" stroke-dasharray="3,3"/>
  
  <!-- Connection line between normal and problem flow -->
  <line x1="100" y1="110" x2="100" y2="190" stroke="#D32F2F" stroke-width="1" marker-end="url(#arrow-problem)"/>
  <text x="110" y="155" class="arrow-text" style="fill: #D32F2F;">3개월 후 데이터 오류 발견</text>
  
  <!-- Problems summary -->
  <rect x="50" y="290" width="700" height="80" fill="#FFF9C4" stroke="#FBC02D" stroke-width="2" rx="8"/>
  <text x="70" y="315" class="title" style="fill: #F57F17;">💡 문제의 핵심: 단절된 워크플로우</text>
  
  <text x="70" y="335" class="text">❌ <tspan style="font-weight: bold;">데이터와 그래프의 연결 끊어짐</tspan> - 원본 데이터가 바뀌어도 그래프는 자동 업데이트 안됨</text>
  <text x="70" y="350" class="text">❌ <tspan style="font-weight: bold;">분석 과정 기록 없음</tspan> - 어떤 설정으로 그래프를 만들었는지 기억 안남</text>
  <text x="70" y="365" class="text">❌ <tspan style="font-weight: bold;">수동 복사/붙여넣기</tspan> - 휴먼 에러 발생, 버전 관리 불가능</text>
  
</svg>