<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <style>
      .title-text { font-size: 32px; font-weight: bold; }
      .stage-text { font-size: 24px; font-weight: bold; }
      .description-text { font-size: 16px; }
      .tool-text { font-size: 14px; font-weight: bold; }
      .quarto-text { font-size: 20px; font-weight: bold; }
      .convergence-text { font-size: 18px; font-weight: bold; }
    </style>
    
    <!-- Gradients for evolution -->
    <linearGradient id="docEvolution" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="softwareEvolution" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="convergenceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0" />
    </radialGradient>
    
    <!-- Filters for glow effects -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="linear-gradient(135deg, #0f172a 0%, #1e293b 100%)"/>
  
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="Arial, sans-serif" class="title-text" fill="#ffffff" filter="url(#glow)">
    문서와 소프트웨어의 평행 진화
  </text>
  
  <!-- Left Helix: Document Evolution -->
  <g id="documentHelix">
    <!-- Evolution path -->
    <path d="M 200 700 Q 150 550 200 400 Q 250 250 200 100" 
          stroke="url(#docEvolution)" stroke-width="8" fill="none" opacity="0.8" filter="url(#glow)"/>
    
    <!-- 1.0 시대: 워드프로세서 -->
    <g transform="translate(200, 650)">
      <circle cx="0" cy="0" r="50" fill="#6b7280" opacity="0.8" filter="url(#glow)"/>
      <!-- Word processor icon -->
      <rect x="-25" y="-20" width="50" height="30" fill="#ffffff" rx="3"/>
      <rect x="-20" y="-15" width="8" height="2" fill="#6b7280"/>
      <rect x="-20" y="-10" width="15" height="2" fill="#6b7280"/>
      <rect x="-20" y="-5" width="12" height="2" fill="#6b7280"/>
      <rect x="-20" y="0" width="18" height="2" fill="#6b7280"/>
      <rect x="-20" y="5" width="10" height="2" fill="#6b7280"/>
      
      <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" class="stage-text" fill="#6b7280">
        문서 1.0
      </text>
      <text x="0" y="95" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="#94a3b8">
        워드프로세서
      </text>
      <text x="0" y="110" text-anchor="middle" font-family="Arial, sans-serif" class="tool-text" fill="#94a3b8">
        HWP, MS Word
      </text>
    </g>
    
    <!-- 2.0 시대: 데이터 기반 문서 -->
    <g transform="translate(200, 400)">
      <circle cx="0" cy="0" r="55" fill="#10b981" opacity="0.8" filter="url(#glow)"/>
      <!-- Notebook icon -->
      <rect x="-30" y="-25" width="60" height="40" fill="#ffffff" rx="5"/>
      <rect x="-25" y="-20" width="20" height="3" fill="#10b981"/>
      <rect x="-25" y="-15" width="25" height="2" fill="#6b7280"/>
      <rect x="-25" y="-10" width="15" height="2" fill="#6b7280"/>
      <!-- Code block -->
      <rect x="-25" y="-5" width="50" height="15" fill="#f3f4f6" rx="2"/>
      <text x="-20" y="2" font-family="monospace" font-size="8" fill="#10b981">code</text>
      <text x="5" y="2" font-family="monospace" font-size="8" fill="#6b7280">+ text</text>
      
      <text x="0" y="80" text-anchor="middle" font-family="Arial, sans-serif" class="stage-text" fill="#10b981">
        문서 2.0
      </text>
      <text x="0" y="100" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="#34d399">
        데이터 기반 문서
      </text>
      <text x="0" y="115" text-anchor="middle" font-family="Arial, sans-serif" class="tool-text" fill="#34d399">
        R Markdown, Jupyter
      </text>
    </g>
    
    <!-- 3.0 시대: AI 협업 글쓰기 -->
    <g transform="translate(200, 150)">
      <circle cx="0" cy="0" r="60" fill="#f59e0b" opacity="0.9" filter="url(#strongGlow)"/>
      <!-- Chat interface icon -->
      <rect x="-35" y="-25" width="70" height="50" fill="#ffffff" rx="8"/>
      <!-- User message -->
      <rect x="-30" y="-20" width="40" height="8" fill="#e5e7eb" rx="4"/>
      <text x="-25" y="-15" font-family="Arial, sans-serif" font-size="6" fill="#6b7280">사용자 요청</text>
      <!-- AI response -->
      <rect x="-10" y="-8" width="40" height="12" fill="#f59e0b" rx="4"/>
      <text x="-5" y="-3" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">AI 생성 문서</text>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="8" fill="#f59e0b">AI</text>
      
      <text x="0" y="85" text-anchor="middle" font-family="Arial, sans-serif" class="stage-text" fill="#f59e0b">
        문서 3.0
      </text>
      <text x="0" y="105" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="#fbbf24">
        AI 협업 글쓰기
      </text>
      <text x="0" y="120" text-anchor="middle" font-family="Arial, sans-serif" class="tool-text" fill="#fbbf24">
        ChatGPT, Claude
      </text>
    </g>
  </g>
  
  <!-- Right Helix: Software Evolution -->
  <g id="softwareHelix">
    <!-- Evolution path -->
    <path d="M 1000 700 Q 1050 550 1000 400 Q 950 250 1000 100" 
          stroke="url(#softwareEvolution)" stroke-width="8" fill="none" opacity="0.8" filter="url(#glow)"/>
    
    <!-- Software 1.0: 전통적 프로그래밍 -->
    <g transform="translate(1000, 650)">
      <circle cx="0" cy="0" r="50" fill="#3b82f6" opacity="0.8" filter="url(#glow)"/>
      <!-- Code icon -->
      <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#ffffff" font-weight="bold">&lt;/&gt;</text>
      
      <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" class="stage-text" fill="#3b82f6">
        Software 1.0
      </text>
      <text x="0" y="95" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="#60a5fa">
        전통적 프로그래밍
      </text>
      <text x="0" y="110" text-anchor="middle" font-family="Arial, sans-serif" class="tool-text" fill="#60a5fa">
        C++, Python, Java
      </text>
    </g>
    
    <!-- Software 2.0: 머신러닝 -->
    <g transform="translate(1000, 400)">
      <circle cx="0" cy="0" r="55" fill="#10b981" opacity="0.8" filter="url(#glow)"/>
      <!-- Neural network nodes -->
      <g fill="#ffffff" opacity="0.9">
        <circle cx="-20" cy="-10" r="4"/>
        <circle cx="-20" cy="10" r="4"/>
        <circle cx="0" cy="-15" r="4"/>
        <circle cx="0" cy="0" r="4"/>
        <circle cx="0" cy="15" r="4"/>
        <circle cx="20" cy="-5" r="4"/>
        <circle cx="20" cy="5" r="4"/>
        <!-- Connections -->
        <line x1="-16" y1="-10" x2="-4" y2="-15" stroke="#ffffff" stroke-width="1"/>
        <line x1="-16" y1="-10" x2="-4" y2="0" stroke="#ffffff" stroke-width="1"/>
        <line x1="-16" y1="10" x2="-4" y2="0" stroke="#ffffff" stroke-width="1"/>
        <line x1="-16" y1="10" x2="-4" y2="15" stroke="#ffffff" stroke-width="1"/>
        <line x1="4" y1="-15" x2="16" y2="-5" stroke="#ffffff" stroke-width="1"/>
        <line x1="4" y1="0" x2="16" y2="-5" stroke="#ffffff" stroke-width="1"/>
        <line x1="4" y1="0" x2="16" y2="5" stroke="#ffffff" stroke-width="1"/>
        <line x1="4" y1="15" x2="16" y2="5" stroke="#ffffff" stroke-width="1"/>
      </g>
      
      <text x="0" y="80" text-anchor="middle" font-family="Arial, sans-serif" class="stage-text" fill="#10b981">
        Software 2.0
      </text>
      <text x="0" y="100" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="#34d399">
        신경망/머신러닝
      </text>
      <text x="0" y="115" text-anchor="middle" font-family="Arial, sans-serif" class="tool-text" fill="#34d399">
        TensorFlow, PyTorch
      </text>
    </g>
    
    <!-- Software 3.0: LLM 시대 -->
    <g transform="translate(1000, 150)">
      <circle cx="0" cy="0" r="60" fill="#f59e0b" opacity="0.9" filter="url(#strongGlow)"/>
      <!-- LLM icon -->
      <rect x="-25" y="-20" width="50" height="40" fill="#ffffff" rx="8"/>
      <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b" font-weight="bold">자연어</text>
      <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">프롬프트</text>
      <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#6b7280">→ 코드 생성</text>
      
      <text x="0" y="85" text-anchor="middle" font-family="Arial, sans-serif" class="stage-text" fill="#f59e0b">
        Software 3.0
      </text>
      <text x="0" y="105" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="#fbbf24">
        LLM 시대
      </text>
      <text x="0" y="120" text-anchor="middle" font-family="Arial, sans-serif" class="tool-text" fill="#fbbf24">
        GPT-4, Claude
      </text>
    </g>
  </g>
  
  <!-- Central Axis: Quarto -->
  <g id="quartoAxis">
    <!-- Vertical line -->
    <line x1="600" y1="650" x2="600" y2="150" stroke="#ffffff" stroke-width="6" opacity="0.8" filter="url(#glow)"/>
    
    <!-- Quarto logo/text -->
    <circle cx="600" cy="400" r="40" fill="url(#convergenceGlow)" filter="url(#strongGlow)"/>
    <text x="600" y="410" text-anchor="middle" font-family="Arial, sans-serif" class="quarto-text" fill="#1e293b" font-weight="bold">
      Quarto
    </text>
    
    <!-- Connection bridges -->
    <!-- 1.0 level bridge -->
    <path d="M 250 650 Q 450 630 600 650 Q 750 630 950 650" 
          stroke="#6b7280" stroke-width="4" fill="none" opacity="0.6" stroke-dasharray="10,5"/>
    
    <!-- 2.0 level bridge -->
    <path d="M 255 400 Q 450 370 600 400 Q 750 370 945 400" 
          stroke="#10b981" stroke-width="5" fill="none" opacity="0.8"/>
    
    <!-- 3.0 level bridge - complete convergence -->
    <ellipse cx="600" cy="150" rx="250" ry="40" fill="url(#convergenceGlow)" opacity="0.8" filter="url(#strongGlow)"/>
    <path d="M 260 150 Q 430 120 600 150 Q 770 120 940 150" 
          stroke="#f59e0b" stroke-width="8" fill="none" opacity="1" filter="url(#strongGlow)"/>
  </g>
  
  <!-- Convergence descriptions -->
  <g id="convergenceText">
    <!-- 1.0 level -->
    <text x="600" y="680" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="#94a3b8">
      분리된 도구들
    </text>
    
    <!-- 2.0 level -->
    <text x="600" y="430" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="#34d399">
      코드 + 문서 결합
    </text>
    
    <!-- 3.0 level -->
    <text x="600" y="180" text-anchor="middle" font-family="Arial, sans-serif" class="convergence-text" fill="#fbbf24" filter="url(#glow)">
      완전한 융합
    </text>
    <text x="600" y="200" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="#fbbf24">
      자연어 → AI → 완성된 출판물
    </text>
  </g>
  
  <!-- Evolution arrows -->
  <g id="evolutionArrows">
    <!-- Left helix arrows -->
    <path d="M 180 600 L 175 580 L 185 585 Z" fill="#10b981" opacity="0.8"/>
    <path d="M 220 350 L 215 330 L 225 335 Z" fill="#10b981" opacity="0.8"/>
    <path d="M 180 300 L 175 280 L 185 285 Z" fill="#f59e0b" opacity="0.8"/>
    
    <!-- Right helix arrows -->
    <path d="M 1020 600 L 1015 580 L 1025 585 Z" fill="#10b981" opacity="0.8"/>
    <path d="M 980 350 L 975 330 L 985 335 Z" fill="#10b981" opacity="0.8"/>
    <path d="M 1020 300 L 1015 280 L 1025 285 Z" fill="#f59e0b" opacity="0.8"/>
  </g>
  
  <!-- Future vision -->
  <text x="600" y="770" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="#ffffff" opacity="0.8">
    미래: 자연어로 원하는 문서를 설명하면 AI가 완성된 출판물을 생성
  </text>
  
  <!-- Philosophy labels -->
  <g font-family="Arial, sans-serif" class="stage-text" text-anchor="middle">
    <text x="100" y="400" fill="#94a3b8" transform="rotate(-90 100 400)">분리</text>
    <text x="600" y="500" fill="#34d399">결합</text>
    <text x="1100" y="400" fill="#fbbf24" transform="rotate(90 1100 400)">융합</text>
  </g>
</svg>