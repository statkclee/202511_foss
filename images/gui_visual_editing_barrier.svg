<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 800 470">
  <!-- 배경 -->
  <rect width="800" height="600" fill="#f8fafc"/>

  <!-- 왼쪽: 화면 읽기 프로그램이 읽는 내용 -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="340" height="380" fill="#1e293b" stroke="#475569" stroke-width="3" rx="10"/>

    <!-- 헤더 -->
    <rect x="0" y="0" width="340" height="45" fill="#0f172a" rx="10"/>
    <text x="170" y="28" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#94a3b8">
      화면 읽기 프로그램
    </text>

    <!-- 텍스트 출력 -->
    <text x="15" y="75" font-family="monospace" font-size="12" fill="#22c55e">
      &gt; 문서 제목
    </text>
    <text x="15" y="100" font-family="monospace" font-size="12" fill="#64748b">
      텍스트 입력란
    </text>
    <text x="15" y="125" font-family="monospace" font-size="12" fill="#64748b">
      버튼 13개
    </text>
    <text x="15" y="150" font-family="monospace" font-size="12" fill="#64748b">
      메뉴 7개
    </text>

    <text x="15" y="185" font-family="monospace" font-size="12" fill="#22c55e">
      &gt; 본문 내용
    </text>
    <text x="15" y="210" font-family="monospace" font-size="12" fill="#64748b">
      텍스트: "안녕하세요..."
    </text>
    <text x="15" y="235" font-family="monospace" font-size="12" fill="#ef4444">
      ⚠️ 글꼴 정보 없음
    </text>
    <text x="15" y="260" font-family="monospace" font-size="12" fill="#ef4444">
      ⚠️ 크기 정보 없음
    </text>
    <text x="15" y="285" font-family="monospace" font-size="12" fill="#ef4444">
      ⚠️ 색상 정보 없음
    </text>

    <text x="15" y="320" font-family="monospace" font-size="12" fill="#22c55e">
      &gt; 표 발견
    </text>
    <text x="15" y="345" font-family="monospace" font-size="12" fill="#64748b">
      표 6행 3열
    </text>
    <text x="15" y="370" font-family="monospace" font-size="12" fill="#ef4444">
      ⚠️ 셀 내용 읽기 실패
    </text>

    <!-- 하단 라벨 -->
    <rect x="10" y="390" width="320" height="30" fill="#991b1b" rx="5"/>
    <text x="170" y="410" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      시각장애인이 듣는 내용
    </text>
  </g>

  <!-- 오른쪽: 실제 화면 -->
  <g transform="translate(410, 80)">
    <rect x="0" y="0" width="340" height="380" fill="white" stroke="#cbd5e1" stroke-width="3" rx="10"/>

    <!-- 헤더 -->
    <rect x="0" y="0" width="340" height="45" fill="#e2e8f0" rx="10"/>
    <text x="170" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#475569">
      워드프로세서 실제 화면
    </text>

    <!-- 툴바 아이콘들 -->
    <g transform="translate(10, 55)">
      <rect x="0" y="0" width="30" height="25" fill="#3b82f6" rx="3"/>
      <rect x="35" y="0" width="30" height="25" fill="#22c55e" rx="3"/>
      <rect x="70" y="0" width="30" height="25" fill="#f59e0b" rx="3"/>
      <rect x="105" y="0" width="30" height="25" fill="#ef4444" rx="3"/>
      <rect x="140" y="0" width="30" height="25" fill="#8b5cf6" rx="3"/>
      <rect x="175" y="0" width="30" height="25" fill="#ec4899" rx="3"/>
      <rect x="210" y="0" width="30" height="25" fill="#14b8a6" rx="3"/>
    </g>

    <!-- 문서 제목 (큰 글씨, 굵게) -->
    <text x="20" y="120" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">
      2024년 사업 보고서
    </text>

    <!-- 본문 (다양한 서식) -->
    <text x="20" y="155" font-family="Arial, sans-serif" font-size="14" fill="#475569">
      안녕하세요, 이번 분기 실적을
    </text>
    <text x="20" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ef4444">
      보고 드립니다.
    </text>

    <!-- 표 -->
    <g transform="translate(20, 200)">
      <rect x="0" y="0" width="300" height="120" fill="none" stroke="#cbd5e1" stroke-width="2"/>

      <!-- 헤더 행 -->
      <rect x="0" y="0" width="300" height="30" fill="#dbeafe"/>
      <line x1="100" y1="0" x2="100" y2="120" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="200" y1="0" x2="200" y2="120" stroke="#cbd5e1" stroke-width="2"/>

      <!-- 행 구분선 -->
      <line x1="0" y1="30" x2="300" y2="30" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="0" y1="60" x2="300" y2="60" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="0" y1="90" x2="300" y2="90" stroke="#cbd5e1" stroke-width="2"/>

      <!-- 헤더 텍스트 -->
      <text x="50" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">
        항목
      </text>
      <text x="150" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">
        금액
      </text>
      <text x="250" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">
        비고
      </text>

      <!-- 데이터 (작은 글씨) -->
      <text x="10" y="50" font-family="Arial, sans-serif" font-size="10" fill="#475569">
        매출
      </text>
      <text x="110" y="50" font-family="Arial, sans-serif" font-size="10" fill="#22c55e" font-weight="bold">
        +15%
      </text>
      <text x="210" y="50" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
        성장세
      </text>
    </g>

    <!-- 이미지 영역 -->
    <rect x="20" y="335" width="300" height="30" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="5"/>
    <text x="60" y="355" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#0369a1">
      [차트]
    </text>

    <!-- 하단 라벨 -->
    <rect x="10" y="390" width="320" height="30" fill="#059669" rx="5"/>
    <text x="170" y="410" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      비장애인이 보는 화면
    </text>
  </g>

  <!-- 중앙 화살표와 설명 -->
  <g transform="translate(400, 280)">
    <!-- 양방향 화살표 -->
    <line x1="0" y1="0" x2="0" y2="0" stroke="#dc2626" stroke-width="4">
      <animate attributeName="x2" values="0;-30;0" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="0" y2="0" stroke="#dc2626" stroke-width="4">
      <animate attributeName="x2" values="0;30;0" dur="1.5s" repeatCount="indefinite"/>
    </line>

    <!-- X 표시 -->
    <circle cx="0" cy="0" r="20" fill="#dc2626"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="white" stroke-width="3"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="white" stroke-width="3"/>
  </g>

</svg>