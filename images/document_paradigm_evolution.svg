<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="20 30 1150 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Noto Sans KR', sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; }
      .era-title { font-family: 'Noto Sans KR', sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; }
      .era-desc { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; text-anchor: middle; }
      .paradigm { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .tools { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; text-anchor: middle; fill: #666; }
      .bullet { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; text-anchor: start; fill:#2c3e50; }
      .bullet-head { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 700; text-anchor: start; }
      .arrow { stroke: #2c3e50; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .transition-text { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: #34495e; }
      .transition-desc { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; text-anchor: middle; fill: #7f8c8d; }
      .main-title { font-family: 'Noto Sans KR', sans-serif; font-size: 26px; font-weight: bold; text-anchor: middle; fill: #2c3e50; }
      .key-point { font-family: 'Noto Sans KR', sans-serif; font-size: 18px; text-anchor: middle; fill: #fff; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"> 
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#f8f9fa"/>

  <!-- Era 1: WYSIWYG -->
  <rect x="60" y="50" width="280" height="160" rx="15" fill="url(#grad1)" stroke="#e74c3c" stroke-width="2"/>
  <g transform="translate(-30, 0)">
    <text x="230" y="80" class="era-title" fill="#c0392b">1980s</text>
    <text x="230" y="110" class="paradigm" fill="#e74c3c">WYSIWYG</text>
    <text x="230" y="130" class="era-desc" fill="#2c3e50">What You See</text>
    <text x="230" y="145" class="era-desc" fill="#2c3e50">Is What You Get</text>
    <text x="230" y="170" class="tools">MS Word, HWP</text>
    <text x="230" y="185" class="tools">PageMaker, QuarkXPress</text>    
  </g>

  <!-- Arrow 1 with transition text -->
  <line x1="345" y1="130" x2="460" y2="130" class="arrow"/>
  <text x="400" y="115" class="transition-text">Structure</text>
  <text x="405" y="160" class="transition-desc">Content Separation</text>

  <!-- Era 2: WYSIWYM -->
  <rect x="470" y="50" width="250" height="160" rx="15" fill="url(#grad2)" stroke="#3498db" stroke-width="2"/>
  <text x="600" y="80" class="era-title" fill="#2980b9">2000s</text>
  <text x="600" y="110" class="paradigm" fill="#3498db">WYSIWYM</text>
  <text x="600" y="130" class="era-desc" fill="#2c3e50">What You See</text>
  <text x="600" y="145" class="era-desc" fill="#2c3e50">Is What You Mean</text>
  <text x="600" y="170" class="tools">LaTeX, Markdown</text>
  <text x="600" y="185" class="tools">HTML, DocBook</text>

  <!-- Arrow 2 with transition text -->
  <line x1="730" y1="130" x2="830" y2="130" class="arrow"/>
  <text x="787" y="115" class="transition-text">AI Revolution</text>
  <text x="775" y="160" class="transition-desc">Automation</text>

  <!-- Era 3: WYAIWYM -->
  <rect x="840" y="50" width="250" height="160" rx="15" fill="url(#grad3)" stroke="#27ae60" stroke-width="2"/>
  <text x="970" y="80" class="era-title" fill="#229954">2020s</text>
  <text x="970" y="110" class="paradigm" fill="#27ae60">WYAIWYM</text>
  <text x="970" y="130" class="era-desc" fill="#2c3e50">What You Ask AI</text>
  <text x="970" y="145" class="era-desc" fill="#2c3e50">Is What You Mean</text>
  <text x="970" y="170" class="tools">ChatGPT + Markdown</text>
  <text x="970" y="185" class="tools">Claude + Quarto</text>

  <!-- Middle Section: Key Evolution Points -->
  <rect x="60" y="225" width="1080" height="80" rx="10" fill="url(#grad4)" stroke="#9b59b6" stroke-width="1.5"/>

  <!-- Three key points with icons -->
  <rect x="100" y="235" width="310" height="60" rx="5" fill="#e74c3c" opacity="0.8"/>
  <text x="255" y="260" class="key-point">👁️ Visual Focus</text>
  <text x="255" y="284" class="key-point">→ Format Dependent</text>

  <rect x="445" y="235" width="310" height="60" rx="5" fill="#3498db" opacity="0.8"/>
  <text x="600" y="260" class="key-point">📝 Meaning Focus</text>
  <text x="600" y="284" class="key-point">Structure &amp; Content Separation</text>

  <rect x="790" y="235" width="310" height="60" rx="5" fill="#27ae60" opacity="0.8"/>
  <text x="945" y="260" class="key-point">🤖 Intent Focus</text>
  <text x="945" y="284" class="key-point">→ AI Implementation</text>

  <!-- WYSIWYG Characteristics -->
  <rect x="60" y="320" width="350" height="260" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="1"/>
  <text x="80" y="345" class="bullet-head" fill="#c0392b">Intuitive Visual Editing</text>
  <text x="80" y="365" class="bullet">• Immediate Result Preview</text>
  <text x="80" y="382" class="bullet">• Format-First Thinking</text>
  <text x="80" y="399" class="bullet">• Binary File Format</text>
  <text x="80" y="416" class="bullet">• GUI-Based Work</text>
  <text x="80" y="442" class="bullet-head" fill="#c0392b">Limitations</text>
  <text x="80" y="462" class="bullet">• Compatibility Issues (Version/SW)</text>
  <text x="80" y="479" class="bullet">• Difficult AI Processing</text>
  <text x="80" y="496" class="bullet">• Automation Limits</text>
  <text x="80" y="513" class="bullet">• Complex Version Control</text>
  <text x="80" y="530" class="bullet">• Frequent Collaboration Conflicts</text>
  <text x="80" y="547" class="bullet">• Low Reusability</text>
  <text x="80" y="564" class="bullet">• Limited Search Indexing</text>

  <!-- WYSIWYM Characteristics -->
  <rect x="425" y="320" width="350" height="260" rx="10" fill="#fff" stroke="#3498db" stroke-width="1"/>
  <text x="445" y="345" class="bullet-head" fill="#2980b9">Content &amp; Structure Separation</text>
  <text x="445" y="365" class="bullet">• Meaning-Centered Writing</text>
  <text x="445" y="382" class="bullet">• Plain Text Based</text>
  <text x="445" y="399" class="bullet">• Easy Version Control (Git)</text>
  <text x="445" y="416" class="bullet">• Automation/Scripting Possible</text>
  <text x="445" y="442" class="bullet-head" fill="#2980b9">Advantages</text>
  <text x="445" y="462" class="bullet">• Long-term Sustainability</text>
  <text x="445" y="479" class="bullet">• Platform Independence</text>
  <text x="445" y="496" class="bullet">• Collaboration Friendly</text>
  <text x="445" y="513" class="bullet">• AI/ML Compatibility</text>
  <text x="445" y="530" class="bullet">• High Reusability</text>
  <text x="445" y="547" class="bullet">• Search Optimized</text>
  <text x="445" y="564" class="bullet">• Multiple Output Formats</text>

  <!-- WYAIWYM Characteristics -->
  <rect x="790" y="320" width="350" height="260" rx="10" fill="#fff" stroke="#27ae60" stroke-width="1"/>
  <text x="810" y="345" class="bullet-head" fill="#229954">AI Collaborative Writing</text>
  <text x="810" y="365" class="bullet">• Natural Language Intent</text>
  <text x="810" y="382" class="bullet">• AI Structure/Optimization</text>
  <text x="810" y="399" class="bullet">• Real-time Feedback/Improvement</text>
  <text x="810" y="416" class="bullet">• Context Understanding</text>
  <text x="810" y="442" class="bullet-head" fill="#229954">Revolutionary Changes</text>
  <text x="810" y="462" class="bullet">• 10x Productivity Improvement</text>
  <text x="810" y="479" class="bullet">• Consistent Quality Assurance</text>
  <text x="810" y="496" class="bullet">• Maximized Accessibility</text>
  <text x="810" y="513" class="bullet">• Amplified Creativity</text>
  <text x="810" y="530" class="bullet">• Automatic Multilingual Processing</text>
  <text x="810" y="547" class="bullet">• Real-time Error Correction</text>
  <text x="810" y="564" class="bullet">• Knowledge Base Integration</text>

  <!-- Timeline -->
  <line x1="60" y1="605" x2="1140" y2="605" stroke="#34495e" stroke-width="2"/>
  <circle cx="235" cy="605" r="6" fill="#e74c3c"/>
  <circle cx="600" cy="605" r="6" fill="#3498db"/>
  <circle cx="965" cy="605" r="6" fill="#27ae60"/>
  <text x="235" y="627" class="tools">1980-1990s</text>
  <text x="600" y="627" class="tools">2000-2010s</text>
  <text x="965" y="627" class="tools">2020s-Future</text>
</svg>