<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Noto Sans KR', sans-serif; font-size: 32px; font-weight: 700; fill: #1e3a8a; }
      .subtitle { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: 600; fill: #475569; }
      .era-label { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: 700; fill: white; }
      .year { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .event { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; }
      .description { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; fill: #475569; }
      .impact { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-style: italic; fill: #059669; }
    </style>

    <linearGradient id="timelineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color: #0078d4; stop-opacity: 1" />
      <stop offset="25%" style="stop-color: #2b88d8; stop-opacity: 1" />
      <stop offset="50%" style="stop-color: #50e6ff; stop-opacity: 1" />
      <stop offset="75%" style="stop-color: #0078d4; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #106ebe; stop-opacity: 1" />
    </linearGradient>

    <marker id="arrowRight" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1e3a8a" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="800" y="40" text-anchor="middle" class="title">마이크로소프트 워드(MS Word) 역사 타임라인</text>
  <text x="800" y="65" text-anchor="middle" class="subtitle">지속적 혁신과 개방성: 1983~2025 (42년)</text>

  <!-- Main Timeline Bar -->
  <rect x="100" y="100" width="1400" height="40" rx="20" fill="url(#timelineGradient)" stroke="#0078d4" stroke-width="2"/>

  <!-- Timeline Arrow -->
  <line x1="100" y1="120" x2="1500" y2="120" stroke="#0078d4" stroke-width="3" marker-end="url(#arrowRight)" opacity="0.3"/>

  <!-- Era Labels on Timeline -->
  <text x="180" y="125" text-anchor="middle" class="era-label" style="font-size: 13px;">🚀 탄생</text>
  <text x="400" y="125" text-anchor="middle" class="era-label" style="font-size: 13px;">💼 확장</text>
  <text x="700" y="125" text-anchor="middle" class="era-label" style="font-size: 13px;">🌐 인터넷</text>
  <text x="1000" y="125" text-anchor="middle" class="era-label" style="font-size: 13px;">☁️ 클라우드</text>
  <text x="1350" y="125" text-anchor="middle" class="era-label" style="font-size: 13px;">🤖 AI</text>

  <!-- Year Markers -->
  <text x="100" y="95" text-anchor="middle" style="font-size: 12px; font-weight: 700; fill: #0078d4;">1983</text>
  <text x="350" y="95" text-anchor="middle" style="font-size: 12px; font-weight: 700; fill: #2b88d8;">1990</text>
  <text x="600" y="95" text-anchor="middle" style="font-size: 12px; font-weight: 700; fill: #50e6ff;">2000</text>
  <text x="900" y="95" text-anchor="middle" style="font-size: 12px; font-weight: 700; fill: #0078d4;">2010</text>
  <text x="1200" y="95" text-anchor="middle" style="font-size: 12px; font-weight: 700; fill: #106ebe;">2020</text>
  <text x="1500" y="95" text-anchor="middle" style="font-size: 12px; font-weight: 700; fill: #004578;">2025</text>

  <!-- Event 1: 1983 - Birth -->
  <g id="event1983">
    <circle cx="100" cy="120" r="15" fill="#0078d4" stroke="white" stroke-width="3"/>
    <line x1="100" y1="135" x2="100" y2="180" stroke="#0078d4" stroke-width="2"/>

    <rect x="20" y="180" width="160" height="120" rx="8" fill="#e3f2fd" stroke="#0078d4" stroke-width="2"/>
    <text x="100" y="200" text-anchor="middle" class="year" style="fill: #0078d4;">1983</text>
    <text x="30" y="218" class="event">Multi-Tool Word</text>
    <text x="30" y="233" class="description">• Charles Simonyi 개발</text>
    <text x="30" y="246" class="description">• Xerox Alto용 출시</text>
    <text x="30" y="259" class="description">• WYSIWYG 개념 도입</text>
    <text x="30" y="272" class="description">• 마우스 기반 편집</text>
    <text x="100" y="290" text-anchor="middle" class="impact">✓ GUI 워드프로세서 혁신</text>
  </g>

  <!-- Event 2: 1989 - Windows Version -->
  <g id="event1989">
    <circle cx="280" cy="120" r="15" fill="#2b88d8" stroke="white" stroke-width="3"/>
    <line x1="280" y1="135" x2="280" y2="330" stroke="#2b88d8" stroke-width="2"/>

    <rect x="200" y="330" width="160" height="120" rx="8" fill="#e1f5fe" stroke="#2b88d8" stroke-width="2"/>
    <text x="280" y="350" text-anchor="middle" class="year" style="fill: #2b88d8;">1989</text>
    <text x="210" y="368" class="event">Word for Windows 1.0</text>
    <text x="210" y="383" class="description">• Windows 3.0 지원</text>
    <text x="210" y="396" class="description">• TrueType 폰트</text>
    <text x="210" y="409" class="description">• OLE 기술 도입</text>
    <text x="210" y="422" class="description">• 시장 점유 시작</text>
    <text x="280" y="440" text-anchor="middle" class="impact">✓ Windows 생태계 통합</text>
  </g>

  <!-- Event 3: 1997 - Office 97 -->
  <g id="event1997">
    <circle cx="520" cy="120" r="15" fill="#0078d4" stroke="white" stroke-width="3"/>
    <line x1="520" y1="135" x2="520" y2="180" stroke="#0078d4" stroke-width="2"/>

    <rect x="440" y="180" width="160" height="135" rx="8" fill="#e3f2fd" stroke="#0078d4" stroke-width="2"/>
    <text x="520" y="200" text-anchor="middle" class="year" style="fill: #0078d4;">1997</text>
    <text x="450" y="218" class="event">Office 97 / Word 97</text>
    <text x="450" y="233" class="description">• 인터넷 통합</text>
    <text x="450" y="246" class="description">• HTML 저장 지원</text>
    <text x="450" y="259" class="description">• VBA 매크로 강화</text>
    <text x="450" y="272" class="description">• Assistant 도입</text>
    <text x="450" y="285" class="description">• 협업 기능 추가</text>
    <text x="520" y="305" text-anchor="middle" class="impact">✓ 인터넷 시대 적응</text>
  </g>

  <!-- Event 4: 2007 - Ribbon UI -->
  <g id="event2007">
    <circle cx="750" cy="120" r="15" fill="#50e6ff" stroke="white" stroke-width="3"/>
    <line x1="750" y1="135" x2="750" y2="330" stroke="#50e6ff" stroke-width="2"/>

    <rect x="670" y="330" width="160" height="135" rx="8" fill="#e0f7fa" stroke="#50e6ff" stroke-width="2"/>
    <text x="750" y="350" text-anchor="middle" class="year" style="fill: #0078d4;">2007</text>
    <text x="680" y="368" class="event">Office 2007 혁신</text>
    <text x="680" y="383" class="description">• Ribbon UI 도입</text>
    <text x="680" y="396" class="description">• DOCX (Open XML)</text>
    <text x="680" y="409" class="description">• ISO 표준 인증</text>
    <text x="680" y="422" class="description">• XML 기반 포맷</text>
    <text x="680" y="435" class="description">• 상호운용성 향상</text>
    <text x="750" y="455" text-anchor="middle" class="impact">✓ 개방형 표준 채택</text>
  </g>

  <!-- Event 5: 2010 - Cloud Transition -->
  <g id="event2010">
    <circle cx="890" cy="120" r="15" fill="#0078d4" stroke="white" stroke-width="3"/>
    <line x1="890" y1="135" x2="890" y2="180" stroke="#0078d4" stroke-width="2"/>

    <rect x="810" y="180" width="160" height="120" rx="8" fill="#e3f2fd" stroke="#0078d4" stroke-width="2"/>
    <text x="890" y="200" text-anchor="middle" class="year" style="fill: #0078d4;">2010</text>
    <text x="820" y="218" class="event">Office Web Apps</text>
    <text x="820" y="233" class="description">• 브라우저 기반 편집</text>
    <text x="820" y="246" class="description">• 실시간 협업</text>
    <text x="820" y="259" class="description">• 클라우드 저장</text>
    <text x="820" y="272" class="description">• 크로스 플랫폼</text>
    <text x="890" y="290" text-anchor="middle" class="impact">✓ 클라우드 전환</text>
  </g>

  <!-- Event 6: 2013 - Office 365 -->
  <g id="event2013">
    <circle cx="1000" cy="120" r="15" fill="#0078d4" stroke="white" stroke-width="3"/>
    <line x1="1000" y1="135" x2="1000" y2="330" stroke="#0078d4" stroke-width="2"/>

    <rect x="920" y="330" width="160" height="120" rx="8" fill="#e3f2fd" stroke="#0078d4" stroke-width="2"/>
    <text x="1000" y="350" text-anchor="middle" class="year" style="fill: #0078d4;">2013</text>
    <text x="930" y="368" class="event">Office 365 출시</text>
    <text x="930" y="383" class="description">• 구독 모델 도입</text>
    <text x="930" y="396" class="description">• 지속적 업데이트</text>
    <text x="930" y="409" class="description">• OneDrive 통합</text>
    <text x="930" y="422" class="description">• Teams 협업</text>
    <text x="1000" y="440" text-anchor="middle" class="impact">✓ SaaS 모델 전환</text>
  </g>

  <!-- Event 7: 2019 - Modern Features -->
  <g id="event2019">
    <circle cx="1150" cy="120" r="15" fill="#106ebe" stroke="white" stroke-width="3"/>
    <line x1="1150" y1="135" x2="1150" y2="180" stroke="#106ebe" stroke-width="2"/>

    <rect x="1070" y="180" width="160" height="120" rx="8" fill="#e1f5fe" stroke="#106ebe" stroke-width="2"/>
    <text x="1150" y="200" text-anchor="middle" class="year" style="fill: #106ebe;">2019</text>
    <text x="1080" y="218" class="event">현대화 기능</text>
    <text x="1080" y="233" class="description">• 공동 편집 강화</text>
    <text x="1080" y="246" class="description">• 버전 기록 자동화</text>
    <text x="1080" y="259" class="description">• 모바일 최적화</text>
    <text x="1080" y="272" class="description">• 접근성 개선</text>
    <text x="1150" y="290" text-anchor="middle" class="impact">✓ 협업 생산성 극대화</text>
  </g>

  <!-- Event 8: 2023 - AI Integration -->
  <g id="event2023">
    <circle cx="1320" cy="120" r="15" fill="#004578" stroke="white" stroke-width="3"/>
    <line x1="1320" y1="135" x2="1320" y2="330" stroke="#004578" stroke-width="2"/>

    <rect x="1240" y="330" width="160" height="135" rx="8" fill="#bbdefb" stroke="#004578" stroke-width="2"/>
    <text x="1320" y="350" text-anchor="middle" class="year" style="fill: #004578;">2023</text>
    <text x="1250" y="368" class="event">Copilot 통합</text>
    <text x="1250" y="383" class="description">• GPT-4 기반 AI</text>
    <text x="1250" y="396" class="description">• 자동 작성 지원</text>
    <text x="1250" y="409" class="description">• 문서 요약·분석</text>
    <text x="1250" y="422" class="description">• 스타일 제안</text>
    <text x="1250" y="435" class="description">• 다국어 번역</text>
    <text x="1320" y="455" text-anchor="middle" class="impact">✓ AI 네이티브</text>
  </g>

  <!-- Event 9: 2024-2025 - Current -->
  <g id="event2024">
    <circle cx="1430" cy="120" r="18" fill="#0078d4" stroke="#50e6ff" stroke-width="4"/>
    <text x="1430" y="128" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: white;">✓</text>
    <line x1="1430" y1="138" x2="1430" y2="180" stroke="#0078d4" stroke-width="3"/>

    <rect x="1350" y="180" width="160" height="120" rx="8" fill="#0078d4" stroke="#004578" stroke-width="3"/>
    <text x="1430" y="200" text-anchor="middle" class="year" style="fill: white;">2024~현재</text>
    <text x="1360" y="218" class="event" style="fill: white;">지속적 혁신</text>
    <text x="1360" y="233" class="description" style="fill: #e3f2fd;">• 개방형 API 확대</text>
    <text x="1360" y="246" class="description" style="fill: #e3f2fd;">• 플러그인 생태계</text>
    <text x="1360" y="259" class="description" style="fill: #e3f2fd;">• ODF/PDF 완벽 지원</text>
    <text x="1360" y="272" class="description" style="fill: #e3f2fd;">• 글로벌 표준 준수</text>
    <text x="1430" y="290" text-anchor="middle" class="impact" style="fill: white;">✓ 개방성 유지</text>
  </g>

  <!-- Bottom Summary -->
  <rect x="50" y="490" width="1500" height="380" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>

  <text x="800" y="525" text-anchor="middle" style="font-size: 24px; font-weight: 700; fill: #0078d4;">
    📊 42년 역사의 교훈: 지속적 혁신 + 개방성 + 호환성
  </text>

  <!-- Era Breakdown -->
  <g id="era-summary">
    <!-- Era 1 -->
    <rect x="80" y="550" width="280" height="130" rx="8" fill="#e3f2fd" stroke="#0078d4" stroke-width="2"/>
    <rect x="80" y="550" width="280" height="30" rx="8" fill="#0078d4"/>
    <text x="220" y="572" text-anchor="middle" style="font-size: 14px; font-weight: 700; fill: white;">🚀 1기: 탄생 (1983~1989)</text>
    <text x="95" y="600" style="font-size: 11px; fill: #1565c0;">• 6년: WYSIWYG 혁신</text>
    <text x="95" y="620" style="font-size: 11px; fill: #1565c0;">• GUI 기반 워드프로세서 선구</text>
    <text x="95" y="640" style="font-size: 11px; fill: #1565c0;">• 마우스·폰트 처리 혁신</text>
    <text x="220" y="665" text-anchor="middle" style="font-size: 12px; font-weight: 700; fill: #0078d4;">✓ 기술 혁신</text>

    <!-- Era 2 -->
    <rect x="380" y="550" width="280" height="130" rx="8" fill="#e1f5fe" stroke="#2b88d8" stroke-width="2"/>
    <rect x="380" y="550" width="280" height="30" rx="8" fill="#2b88d8"/>
    <text x="520" y="572" text-anchor="middle" style="font-size: 14px; font-weight: 700; fill: white;">💼 2기: 확장 (1990~1999)</text>
    <text x="395" y="600" style="font-size: 11px; fill: #0277bd;">• 10년: Windows 생태계 통합</text>
    <text x="395" y="620" style="font-size: 11px; fill: #0277bd;">• Office Suite 완성</text>
    <text x="395" y="640" style="font-size: 11px; fill: #0277bd;">• VBA·매크로 자동화</text>
    <text x="520" y="665" text-anchor="middle" style="font-size: 12px; font-weight: 700; fill: #2b88d8;">✓ 시장 리더십</text>

    <!-- Era 3 -->
    <rect x="680" y="550" width="280" height="130" rx="8" fill="#e0f7fa" stroke="#50e6ff" stroke-width="2"/>
    <rect x="680" y="550" width="280" height="30" rx="8" fill="#50e6ff"/>
    <text x="820" y="572" text-anchor="middle" style="font-size: 14px; font-weight: 700; fill: #004578;">🌐 3기: 인터넷 (2000~2009)</text>
    <text x="695" y="600" style="font-size: 11px; fill: #0097a7;">• 10년: 웹 통합, DOCX 도입</text>
    <text x="695" y="620" style="font-size: 11px; fill: #0097a7;">• ISO 표준(Open XML) 인증</text>
    <text x="695" y="640" style="font-size: 11px; fill: #0097a7;">• XML 기반 개방형 포맷</text>
    <text x="820" y="665" text-anchor="middle" style="font-size: 12px; font-weight: 700; fill: #00acc1;">✓ 개방성 확보</text>

    <!-- Era 4 -->
    <rect x="980" y="550" width="280" height="130" rx="8" fill="#e3f2fd" stroke="#0078d4" stroke-width="2"/>
    <rect x="980" y="550" width="280" height="30" rx="8" fill="#0078d4"/>
    <text x="1120" y="572" text-anchor="middle" style="font-size: 14px; font-weight: 700; fill: white;">☁️ 4기: 클라우드 (2010~2019)</text>
    <text x="995" y="600" style="font-size: 11px; fill: #1565c0;">• 10년: SaaS 전환, 실시간 협업</text>
    <text x="995" y="620" style="font-size: 11px; fill: #1565c0;">• Office 365 구독 모델</text>
    <text x="995" y="640" style="font-size: 11px; fill: #1565c0;">• 크로스 플랫폼 지원</text>
    <text x="1120" y="665" text-anchor="middle" style="font-size: 12px; font-weight: 700; fill: #0078d4;">✓ 클라우드 네이티브</text>

    <!-- Era 5 -->
    <rect x="1280" y="550" width="280" height="130" rx="8" fill="#bbdefb" stroke="#004578" stroke-width="2"/>
    <rect x="1280" y="550" width="280" height="30" rx="8" fill="#004578"/>
    <text x="1420" y="572" text-anchor="middle" style="font-size: 14px; font-weight: 700; fill: white;">🤖 5기: AI (2020~현재)</text>
    <text x="1295" y="600" style="font-size: 11px; fill: #0d47a1;">• 6년: Copilot 통합, AI 네이티브</text>
    <text x="1295" y="620" style="font-size: 11px; fill: #0d47a1;">• GPT 기반 자동화</text>
    <text x="1295" y="640" style="font-size: 11px; fill: #0d47a1;">• 개방형 API·플러그인</text>
    <text x="1420" y="665" text-anchor="middle" style="font-size: 12px; font-weight: 700; fill: #004578;">✓ AI 시대 선도</text>
  </g>

  <!-- Key Insight -->
  <rect x="80" y="710" width="1480" height="140" rx="10" fill="#0078d4" stroke="#004578" stroke-width="3"/>

  <text x="800" y="745" text-anchor="middle" style="font-size: 20px; font-weight: 700; fill: white;">
    💡 핵심 인사이트: MS Word가 42년간 시장을 선도한 이유
  </text>

  <text x="100" y="775" style="font-size: 13px; fill: #e3f2fd;">
    • <tspan font-weight="700">지속적 혁신</tspan>: WYSIWYG → Ribbon UI → 클라우드 → AI까지, 시대마다 새로운 패러다임 제시
  </text>

  <text x="100" y="800" style="font-size: 13px; fill: #e3f2fd;">
    • <tspan font-weight="700">개방성 확보</tspan>: 2007년 DOCX(Open XML) ISO 표준 인증, ODF·PDF 완벽 지원으로 상호운용성 보장
  </text>

  <text x="100" y="825" style="font-size: 13px; fill: #e3f2fd;">
    • <tspan font-weight="700">플랫폼 중립</tspan>: Windows/Mac/Linux/Web/Mobile 모두 지원, 개방형 API로 생태계 확장
  </text>

  <rect x="100" y="835" width="1400" height="1" fill="#50e6ff" opacity="0.5"/>

  <text x="800" y="865" text-anchor="middle" style="font-size: 14px; font-weight: 700; fill: white;">
    ⚖️ 결론: 독점적 지위에도 개방성·호환성을 유지하며, AI 시대에도 지속적으로 진화 중
  </text>
</svg>