<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 1250 700">
  <defs>
    <style>
      .title-text { font-size: 32px; font-weight: bold; }
      .core-title { font-size: 20px; font-weight: bold; }
      .sub-title { font-size: 16px; font-weight: bold; }
      .description-text { font-size: 14px; }
      .small-text { font-size: 12px; }
    </style>
    
    <!-- Core Components Gradients -->
    <linearGradient id="decomposition" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="patterns" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="abstraction" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="algorithms" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    
    <!-- Supporting Skills Gradients -->
    <linearGradient id="supportSkills" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- Center Integration -->
    <radialGradient id="centerIntegration" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.8" />
    </radialGradient>
    
    <!-- Connection lines -->
    <marker id="arrowSmall" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" opacity="0.6"/>
    </marker>
    
    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1250" height="800" fill="white"/>
  
  <!-- Title -->
  <text x="300" y="370" text-anchor="middle" font-family="Arial, sans-serif" class="core-title" fill="#1e293b">
    Jeannette M. Wing
  </text>
  <text x="300" y="400" text-anchor="middle" font-family="Arial, sans-serif" class="core-title" fill="#1e293b">
    컴퓨팅 사고력 프레임워크
  </text>
  <text x="300" y="430" text-anchor="middle" font-family="Arial, sans-serif" class="core-title" fill="#1e293b">
    AI 시대 확장
  </text>

  <!-- Core 4 Components (Upper Level) -->
  <!-- 1. Decomposition (문제 분해) -->
  <rect x="50" y="120" width="250" height="140" fill="url(#decomposition)" rx="15" filter="url(#glow)"/>
  <text x="175" y="150" text-anchor="middle" font-family="Arial, sans-serif" class="core-title" fill="white">
    문제 분해
  </text>
  <text x="175" y="170" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="rgba(255,255,255,0.8)">
    Decomposition
  </text>
  
  <text x="175" y="195" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
    복잡한 문제를 작은 단위로 나누어
  </text>
  <text x="175" y="210" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
    해결 가능한 크기로 만드는 능력
  </text>
  
  <rect x="65" y="225" width="220" height="25" fill="rgba(255,255,255,0.2)" rx="5"/>
  <text x="175" y="242" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="white" font-weight="bold">
    예: 큰 프로젝트 → 작은 태스크들
  </text>
  
  <!-- 2. Pattern Recognition (패턴 인식) -->
  <rect x="350" y="120" width="250" height="140" fill="url(#patterns)" rx="15" filter="url(#glow)"/>
  <text x="475" y="150" text-anchor="middle" font-family="Arial, sans-serif" class="core-title" fill="white">
    패턴 인식
  </text>
  <text x="475" y="170" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="rgba(255,255,255,0.8)">
    Pattern Recognition
  </text>
  
  <text x="475" y="195" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
    데이터와 현상에서 공통된 규칙과
  </text>
  <text x="475" y="210" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
    반복되는 특성을 찾아내는 능력
  </text>
  
  <rect x="365" y="225" width="220" height="25" fill="rgba(255,255,255,0.2)" rx="5"/>
  <text x="475" y="242" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="white" font-weight="bold">
    예: 트렌드 분석, 분류 규칙 발견
  </text>
  
  <!-- 3. Abstraction (추상화) -->
  <rect x="650" y="120" width="250" height="140" fill="url(#abstraction)" rx="15" filter="url(#glow)"/>
  <text x="775" y="150" text-anchor="middle" font-family="Arial, sans-serif" class="core-title" fill="white">
    추상화
  </text>
  <text x="775" y="170" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="rgba(255,255,255,0.8)">
    Abstraction
  </text>
  
  <text x="775" y="195" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
    핵심 요소만 남기고 불필요한
  </text>
  <text x="775" y="210" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
    세부사항을 제거하는 능력
  </text>
  
  <rect x="665" y="225" width="220" height="25" fill="rgba(255,255,255,0.2)" rx="5"/>
  <text x="775" y="242" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="white" font-weight="bold">
    예: 모델링, 일반화, 개념화
  </text>
  
  <!-- 4. Algorithms (알고리즘) -->
  <rect x="950" y="120" width="250" height="140" fill="url(#algorithms)" rx="15" filter="url(#glow)"/>
  <text x="1075" y="150" text-anchor="middle" font-family="Arial, sans-serif" class="core-title" fill="white">
    알고리즘
  </text>
  <text x="1075" y="170" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="rgba(255,255,255,0.8)">
    Algorithms
  </text>
  
  <text x="1075" y="195" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
    문제 해결을 위한 단계별 절차와
  </text>
  <text x="1075" y="210" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
    명확한 실행 방법을 설계하는 능력
  </text>
  
  <rect x="965" y="225" width="220" height="25" fill="rgba(255,255,255,0.2)" rx="5"/>
  <text x="1075" y="242" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="white" font-weight="bold">
    예: 순서도, 프로세스 설계
  </text>
  
  <!-- Central Integration Hub -->
  <circle cx="600" cy="400" r="80" fill="url(#centerIntegration)" filter="url(#glow)"/>
  <text x="600" y="375" text-anchor="middle" font-family="Arial, sans-serif" class="core-title" fill="white">
    통합적
  </text>
  <text x="600" y="400" text-anchor="middle" font-family="Arial, sans-serif" class="core-title" fill="white">
    문제해결
  </text>
  <text x="600" y="425" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="rgba(255,255,255,0.8)">
    Integrated
  </text>
  <text x="600" y="445" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="rgba(255,255,255,0.8)">
    Problem Solving
  </text>  
  
  <!-- Connection lines from core components to center -->
  <g opacity="0.6" stroke="#64748b" stroke-width="3" marker-end="url(#arrowSmall)">
    <line x1="250" y1="260" x2="540" y2="360"/>
    <line x1="450" y1="260" x2="570" y2="340"/>
    <line x1="750" y1="260" x2="630" y2="340"/>
    <line x1="950" y1="260" x2="660" y2="360"/>
  </g>
  
  <!-- Supporting Skills (Lower Level) -->
  <text x="600" y="510" text-anchor="middle" font-family="Arial, sans-serif" class="title-text" fill="#1e293b">
    보조 사고력
  </text>
  <text x="600" y="530" text-anchor="middle" font-family="Arial, sans-serif" class="sub-title" fill="#1e293b">
    (Supporting Thinking Skills)
  </text>
  
  <g transform="translate(70,0)">
    <!-- Design Thinking -->
    <rect x="50" y="550" width="180" height="100" fill="url(#supportSkills)" rx="10"/>
    <text x="140" y="575" text-anchor="middle" font-family="Arial, sans-serif" class="sub-title" fill="white">
      디자인 사고
    </text>
    <text x="140" y="595" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.8)">
      Design Thinking
    </text>
    <text x="140" y="615" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
      사용자 중심
    </text>
    <text x="140" y="630" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
      창의적 해결
    </text>
    
    <!-- Visual Thinking -->
    <rect x="250" y="550" width="180" height="100" fill="url(#supportSkills)" rx="10"/>
    <text x="340" y="575" text-anchor="middle" font-family="Arial, sans-serif" class="sub-title" fill="white">
      시각적 사고
    </text>
    <text x="340" y="595" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.8)">
      Visual Thinking
    </text>
    <text x="340" y="615" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
      다이어그램
    </text>
    <text x="340" y="630" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
      시각화
    </text>
    
    <!-- Critical Thinking -->
    <rect x="450" y="550" width="180" height="100" fill="url(#supportSkills)" rx="10"/>
    <text x="540" y="575" text-anchor="middle" font-family="Arial, sans-serif" class="sub-title" fill="white">
      비판적 사고
    </text>
    <text x="540" y="595" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.8)">
      Critical Thinking
    </text>
    <text x="540" y="615" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
      논리적 분석
    </text>
    <text x="540" y="630" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
      가정 검증
    </text>
    
    <!-- Systems Thinking -->
    <rect x="650" y="550" width="180" height="100" fill="url(#supportSkills)" rx="10"/>
    <text x="740" y="575" text-anchor="middle" font-family="Arial, sans-serif" class="sub-title" fill="white">
      시스템 사고
    </text>
    <text x="740" y="595" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.8)">
      Systems Thinking
    </text>
    <text x="740" y="615" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
      전체적 관점
    </text>
    <text x="740" y="630" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
      상호연결성
    </text>
    
    <!-- Creative Thinking -->
    <rect x="850" y="550" width="180" height="100" fill="url(#supportSkills)" rx="10"/>
    <text x="940" y="575" text-anchor="middle" font-family="Arial, sans-serif" class="sub-title" fill="white">
      창의적 사고
    </text>
    <text x="940" y="595" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.8)">
      Creative Thinking
    </text>
    <text x="940" y="615" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
      혁신적 아이디어
    </text>
    <text x="940" y="630" text-anchor="middle" font-family="Arial, sans-serif" class="small-text" fill="rgba(255,255,255,0.9)">
      새로운 접근
    </text>
  </g>  
  <!-- Connection lines from supporting skills to center -->
  <g opacity="0.4" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowSmall)" stroke-dasharray="5,5">
    <line x1="170" y1="550" x2="540" y2="450"/>
    <line x1="370" y1="550" x2="560" y2="460"/>
    <line x1="570" y1="550" x2="590" y2="470"/>
    <line x1="770" y1="550" x2="620" y2="460"/>
    <line x1="970" y1="550" x2="650" y2="450"/>
  </g>
  
  <!-- AI Era Enhancement Box -->
  <rect x="100" y="680" width="1000" height="80" fill="rgba(245,158,11,0.1)" rx="15" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="705" text-anchor="middle" font-family="Arial, sans-serif" class="sub-title" fill="#d97706" font-weight="bold">
    AI 시대의 확장: 인간-AI 협업 사고력
  </text>
  <text x="600" y="725" text-anchor="middle" font-family="Arial, sans-serif" class="description-text" fill="#92400e">
    • 프롬프트 엔지니어링으로 AI 활용  • 인간의 직관과 AI의 연산력 결합  • 윤리적 판단과 창의적 통찰 유지
  </text>
  <text x="600" y="747" text-anchor="middle" font-family="Arial, sans-serif" fill="#92400e" font-size="18px" font-weight="bold">
    컴퓨팅 사고력은 AI 시대에도 여전히 핵심이며, <strong>AI와 협업하는 새로운 차원으로 진화</strong>
  </text>
</svg>