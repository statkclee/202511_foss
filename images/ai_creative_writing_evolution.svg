<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 50 900 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 화살표 마커 -->
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#333" stroke="#333"/>
    </marker>
    
    <!-- 그라디언트 -->
    <linearGradient id="grad2023" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F4F8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D1E7DD;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad2024" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF4E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE69C;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad2025" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE6E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB3B3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 2023년: 단일 텍스트 시대 -->
  <g id="year2023">
    <rect x="50" y="80" width="220" height="320" fill="url(#grad2023)" stroke="#74AA9C" stroke-width="2" rx="10"/>
    <text x="160" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A5F4F">2023년</text>
    <text x="160" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2D6E3E">텍스트 전용 시대</text>
    
    <!-- ChatGPT 아이콘 -->
    <circle cx="160" cy="170" r="35" fill="#74AA9C" stroke="#1A5F4F" stroke-width="3"/>
    <text x="160" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">GPT</text>
    
    <!-- 특징 설명 -->
    <text x="160" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">프롬프트 → 텍스트</text>
    <text x="160" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">단일 모델 중심</text>
    <text x="160" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">일방향 생성</text>
    <text x="160" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">복사-붙여넣기 편집</text>
    
    <!-- 프로세스 화살표 -->
    <path d="M 120 320 L 160 340 L 200 320" stroke="#74AA9C" stroke-width="2" fill="none"/>
    <text x="160" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">단순 워크플로</text>
  </g>
  
  <!-- 2024년: 멀티모달 전환 -->
  <g id="year2024">
    <rect x="340" y="80" width="220" height="320" fill="url(#grad2024)" stroke="#E4A853" stroke-width="2" rx="10"/>
    <text x="450" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#B8860B">2024년</text>
    <text x="450" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#CD853F">멀티모달 시대</text>
    
    <!-- 다중 모델 아이콘들 (삼각형 배치) -->
    <circle cx="420" cy="160" r="25" fill="#74AA9C" stroke="#1A5F4F" stroke-width="2"/>
    <text x="420" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">GPT-5</text>
    
    <circle cx="450" cy="195" r="25" fill="#E4A853" stroke="#B8860B" stroke-width="2"/>
    <text x="450" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Claude</text>
    
    <circle cx="480" cy="160" r="25" fill="#5B9BD5" stroke="#2E5984" stroke-width="2"/>
    <text x="480" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Gemini</text>
    
    <!-- 개선된 연결선 (곡선 및 점선) -->
    <path d="M 420 160 Q 435 170 450 195" stroke="#666" stroke-width="1" stroke-dasharray="3,2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 480 160 Q 465 170 450 195" stroke="#666" stroke-width="1" stroke-dasharray="3,2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 420 160 Q 450 140 480 160" stroke="#666" stroke-width="1" stroke-dasharray="3,2" fill="none"/>
    
    <g transform="translate(0,15)">
      <!-- 특징 설명 -->
      <text x="450" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Canvas/Artifacts</text>
      <text x="450" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">실시간 편집</text>
      <text x="450" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">텍스트+이미지+음성</text>
      <text x="450" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">다중 AI 협업</text>
      
      <!-- 멀티모달 아이콘 -->
      <rect x="425" y="310" width="15" height="15" fill="#5B9BD5" rx="2"/>
      <circle cx="450" cy="317" r="7" fill="#E4A853"/>
      <polygon points="460,310 475,310 467,325" fill="#74AA9C"/>
      <text x="450" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">멀티모달</text>
    </g>
  </g>
  
  <!-- 2025년: AI 에이전트 -->
  <g id="year2025">
    <rect x="630" y="80" width="220" height="320" fill="url(#grad2025)" stroke="#D63384" stroke-width="2" rx="10"/>
    <text x="740" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#A02E4C">2025년</text>
    <text x="740" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C2185B">AI 에이전트 시대</text>
    
    <g transform="translate(0,5)">
      <!-- 에이전트 네트워크 (오각형 배치) -->
      <circle cx="740" cy="150" r="24" fill="#74AA9C" stroke="#1A5F4F" stroke-width="2"/>
      <text x="740" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">연구</text>
      
      <circle cx="775" cy="180" r="24" fill="#E4A853" stroke="#B8860B" stroke-width="2"/>
      <text x="785" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">창작</text>
      
      <circle cx="760" cy="220" r="24" fill="#AA749C" stroke="#85586F" stroke-width="2"/>
      <text x="770" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">배포</text>
      
      <circle cx="720" cy="220" r="24" fill="#9C74AA" stroke="#6A4C93" stroke-width="2"/>
      <text x="715" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">번역</text>
      
      <circle cx="705" cy="180" r="24" fill="#5B9BD5" stroke="#2E5984" stroke-width="2"/>
      <text x="705" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">편집</text>
      
      <!-- 네트워크 연결선 -->
      <line x1="740" y1="150" x2="775" y2="180" stroke="#666" stroke-width="2"/>
      <line x1="775" y1="180" x2="760" y2="220" stroke="#666" stroke-width="2"/>
      <line x1="760" y1="220" x2="720" y2="220" stroke="#666" stroke-width="2"/>
      <line x1="720" y1="220" x2="705" y2="180" stroke="#666" stroke-width="2"/>
      <line x1="705" y1="180" x2="740" y2="150" stroke="#666" stroke-width="2"/>
      <line x1="740" y1="150" x2="760" y2="220" stroke="#666" stroke-width="1"/>
      <line x1="775" y1="180" x2="720" y2="220" stroke="#666" stroke-width="1"/>
    </g>

    <!-- 특징 설명 -->
    <text x="740" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">자율 에이전트 팀</text>
    <text x="740" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">100만 토큰 컨텍스트</text>
    <text x="740" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">워크플로 자동화</text>
    
    <!-- 자율 협업 아이콘 (순환 화살표) -->
    <g transform="translate(740, 340)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#D63384" stroke-width="1" opacity="0.3"/>
      <!-- 순환하는 3개 화살표 -->
      <path d="M -12,-8 A 12,12 0 0,1 8,-12" stroke="#D63384" stroke-width="0.7" fill="none" marker-end="url(#arrowhead)"/>
      <path d="M 12,-4 A 12,12 0 0,1 0,14" stroke="#D63384" stroke-width="0.7" fill="none" marker-end="url(#arrowhead)"/>
      <path d="M -4,14 A 12,12 0 0,1 -12,-8" stroke="#D63384" stroke-width="0.7" fill="none" marker-end="url(#arrowhead)"/>
      <!-- 중앙 점 -->
      <circle cx="0" cy="0" r="3" fill="#D63384"/>
    </g>
    <text x="740" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">자율 협업</text>
  </g>
  
  <!-- 진화 화살표 -->
  <path d="M 270 240 L 340 240" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 560 240 L 630 240" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 진화 레이블 -->
  <text x="305" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">진화</text>
  <text x="595" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">혁명</text>
  
  <!-- 하단 설명 -->
  <text x="450" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#666">
    동일한 창의적 목표, 진화하는 도구와 방법론
  </text>
</svg>