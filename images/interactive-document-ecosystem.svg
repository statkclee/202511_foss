<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 50 1200 530" xmlns="http://www.w3.org/2000/svg"> 
  <defs>
    <style>
      .title-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 24px; font-weight: 400; fill: #111111; }
      .stage-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 18px; font-weight: 400; fill: #111111; }
      .desc-text-middle { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 17px; fill: #444444; }
      .desc-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 16px; fill: #555555; }
      .desc-text-code { font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-size: 15px; fill: #333333; }
      .r-ecosystem { fill: #ffffff; stroke: #999999; stroke-width: 1; }
      .python-ecosystem { fill: #fafafa; stroke: #aaaaaa; stroke-width: 1; }
      .js-ecosystem { fill: #f5f5f5; stroke: #bbbbbb; stroke-width: 1; }
      .code-flow { stroke: #999999; stroke-width: 1; fill: none; stroke-dasharray: 3,3; }
      .interactive-element { fill: #ffffff; stroke: #666666; stroke-width: 1; }
    </style>
    
    <!-- 화살표 마커 정의 -->
    <marker id="flow-arrow" markerWidth="6" markerHeight="5"
            refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#999999" />
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="570" fill="#fefefe"/>

  <!-- 중앙 인터랙티브 문서 -->
  <g id="center-interactive-doc">
    <rect x="420" y="160" width="240" height="140" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="540" y="190" text-anchor="middle" class="stage-text">Interactive Document</text>
    <text x="540" y="212" text-anchor="middle" class="desc-text" font-style="italic">Code + Text + Results</text>

    <!-- 문서 내용 시뮬레이션 -->
    <rect x="440" y="230" width="200" height="60" rx="2" fill="#fafafa" stroke="#dddddd" stroke-width="0.5"/>
    <text x="450" y="248" class="desc-text-code">## Data Analysis</text>
    <text x="450" y="266" class="desc-text-code">```python</text>
    <text x="450" y="284" class="desc-text-code">plot(data)</text>
  </g>

  <!-- R 생태계 (선구자) -->
  <g id="r-ecosystem">
    <rect x="60" y="70" width="180" height="100" rx="3" class="r-ecosystem"/>
    <text x="150" y="100" text-anchor="middle" class="stage-text">R Ecosystem</text>
    <text x="150" y="122" text-anchor="middle" class="desc-text" font-style="italic">Pioneer (2012)</text>
    <text x="75" y="143" class="desc-text-code">• knitr</text>
    <text x="75" y="162" class="desc-text-code">• R Markdown</text>
  </g>

  <!-- Python 생태계 -->
  <g id="python-ecosystem">
    <rect x="60" y="190" width="180" height="100" rx="3" class="python-ecosystem"/>
    <text x="150" y="220" text-anchor="middle" class="stage-text">Python Ecosystem</text>
    <text x="150" y="242" text-anchor="middle" class="desc-text" font-style="italic">(2011)</text>
    <text x="75" y="263" class="desc-text-code">• Jupyter</text>
    <text x="75" y="282" class="desc-text-code">• IPython</text>
  </g>

  <!-- JavaScript 생태계 -->
  <g id="js-ecosystem">
    <rect x="60" y="310" width="180" height="100" rx="3" class="js-ecosystem"/>
    <text x="150" y="340" text-anchor="middle" class="stage-text">JavaScript Ecosystem</text>
    <text x="150" y="362" text-anchor="middle" class="desc-text" font-style="italic">(2017)</text>
    <text x="75" y="383" class="desc-text-code">• Observable</text>
    <text x="75" y="402" class="desc-text-code">• D3.js</text>
  </g>

  <!-- 연결선들 -->
  <line x1="240" y1="120" x2="410" y2="210" class="code-flow" marker-end="url(#flow-arrow)"/>
  <line x1="240" y1="240" x2="410" y2="230" class="code-flow" marker-end="url(#flow-arrow)"/>
  <line x1="240" y1="360" x2="410" y2="250" class="code-flow" marker-end="url(#flow-arrow)"/>

  <!-- 실행 흐름 -->
  <g id="execution-flow">
    <rect x="700" y="100" width="170" height="50" rx="3" fill="#ffffff" stroke="#555555" stroke-width="1"/>
    <text x="785" y="130" text-anchor="middle" class="stage-text">Code Execution</text>

    <rect x="700" y="170" width="170" height="50" rx="3" fill="#fafafa" stroke="#666666" stroke-width="1"/>
    <text x="785" y="200" text-anchor="middle" class="stage-text">Result Generation</text>

    <rect x="700" y="240" width="170" height="50" rx="3" fill="#f5f5f5" stroke="#777777" stroke-width="1"/>
    <text x="785" y="270" text-anchor="middle" class="stage-text">Document Update</text>

    <!-- 흐름 화살표 -->
    <line x1="785" y1="150" x2="785" y2="165" class="code-flow" marker-end="url(#flow-arrow)"/>
    <line x1="785" y1="220" x2="785" y2="235" class="code-flow" marker-end="url(#flow-arrow)"/>
  </g>

  <!-- 연결선 (문서에서 실행 흐름으로) -->
  <line x1="660" y1="230" x2="697" y2="130" class="code-flow" marker-end="url(#flow-arrow)"/>

  <!-- 사용자 상호작용 요소들 -->
  <g id="interaction-elements" transform="translate(50, 0)">
    <text x="920" y="130" class="stage-text">User Interaction</text>

    <!-- 슬라이더 -->
    <rect x="880" y="145" width="110" height="12" rx="6" fill="#bdc3c7"/>
    <circle cx="945" cy="151" r="8" class="interactive-element"/>
    <text x="935" y="175" text-anchor="middle" class="desc-text" font-style="italic">Slider</text>

    <!-- 버튼 -->
    <rect x="907" y="190" width="55" height="28" rx="3" class="interactive-element"/>
    <text x="935" y="209" text-anchor="middle" class="desc-text">실행</text>
    <text x="935" y="235" text-anchor="middle" class="desc-text" font-style="italic">Button</text>

    <!-- 입력창 -->
    <rect x="895" y="250" width="80" height="20" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1"/>
    <text x="935" y="287" text-anchor="middle" class="desc-text" font-style="italic">Input Field</text>
  </g>

  <!-- 특징 설명 박스들 -->
  <g id="characteristics" transform="translate(0, 50)">
    <!-- 실행 가능한 코드 -->
    <rect x="30" y="390" width="280" height="110" rx="2" fill="#ffffff" stroke="#dddddd" stroke-width="0.5"/>
    <line x1="30" y1="425" x2="310" y2="425" stroke="#cccccc" stroke-width="0.5"/>
    <text x="170" y="415" text-anchor="middle" class="stage-text" font-weight="600">Executable Code</text>
    <text x="45" y="442" class="desc-text">Document = Program</text>
    <text x="45" y="464" class="desc-text">Real-time computation</text>
    <text x="45" y="486" class="desc-text">Dynamic results</text>

    <!-- 반응형 인터페이스 -->
    <rect x="325" y="390" width="280" height="110" rx="2" fill="#ffffff" stroke="#dddddd" stroke-width="0.5"/>
    <line x1="325" y1="425" x2="605" y2="425" stroke="#cccccc" stroke-width="0.5"/>
    <text x="465" y="415" text-anchor="middle" class="stage-text" font-weight="600">Reactive Interface</text>
    <text x="340" y="442" class="desc-text">User input response</text>
    <text x="340" y="464" class="desc-text">Real-time updates</text>
    <text x="340" y="486" class="desc-text">Instant feedback</text>

    <!-- 탐색 가능한 설명 -->
    <rect x="620" y="390" width="280" height="110" rx="2" fill="#ffffff" stroke="#dddddd" stroke-width="0.5"/>
    <line x1="620" y1="425" x2="900" y2="425" stroke="#cccccc" stroke-width="0.5"/>
    <text x="760" y="415" text-anchor="middle" class="stage-text" font-weight="600">Explorable Explanations</text>
    <text x="635" y="442" class="desc-text">Direct experimentation</text>
    <text x="635" y="464" class="desc-text">Parameter manipulation</text>
    <text x="635" y="486" class="desc-text">Active learning</text>

    <!-- 재현 가능한 연구 -->
    <rect x="915" y="390" width="280" height="110" rx="2" fill="#ffffff" stroke="#dddddd" stroke-width="0.5"/>
    <line x1="915" y1="425" x2="1195" y2="425" stroke="#cccccc" stroke-width="0.5"/>
    <text x="1055" y="415" text-anchor="middle" class="stage-text" font-weight="600">Reproducible Research</text>
    <text x="930" y="442" class="desc-text">Code+Data+Explanation</text>
    <text x="930" y="464" class="desc-text">Complete transparency</text>
    <text x="930" y="486" class="desc-text">Verifiability</text>
  </g>

</svg>