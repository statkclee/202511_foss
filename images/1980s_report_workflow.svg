<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1200 720">
  <defs>
    <style>
      .title { font-family: monospace; font-size: 32px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: monospace; font-size: 18px; fill: #7f8c8d; }
      .box-title { font-family: monospace; font-size: 19px; font-weight: bold; fill: #2c3e50; }
      .box-text { font-family: monospace; font-size: 16px; fill: #34495e; }
      .tool-text { font-family: monospace; font-size: 16px; fill: #0d47a1; font-weight: bold; }
      .arrow-text { font-family: monospace; font-size: 14px; fill: #7f8c8d; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 3; }
      .terminal-box { fill: #1e1e1e; stroke: #00ff00; stroke-width: 2; }
      .terminal-text { font-family: 'Courier New', monospace; font-size: 16px; fill: #00ff00; }
      .highlight { fill: #e3f2fd; stroke: #1565c0; stroke-width: 3; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7f8c8d" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="70" class="title" text-anchor="middle">Before Word Processors: The Unix Way</text>

  <!-- Step 1: Data Collection -->
  <rect x="50" y="100" width="280" height="140" class="box" rx="5"/>
  <text x="190" y="130" class="box-title" text-anchor="middle">1. Data Collection</text>
  <text x="190" y="155" class="box-text" text-anchor="middle">Mainframe / Minicomputer</text>
  <text x="190" y="180" class="tool-text" text-anchor="middle">• Fortran / COBOL</text>
  <text x="190" y="200" class="tool-text" text-anchor="middle">• Punched Cards</text>
  <text x="190" y="220" class="tool-text" text-anchor="middle">• Magnetic Tapes</text>

  <!-- Arrow 1 -->
  <line x1="330" y1="170" x2="410" y2="170" stroke="#7f8c8d" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="370" y="150" class="arrow-text" text-anchor="middle">batch</text>

  <!-- Step 2: Statistical Analysis -->
  <rect x="410" y="100" width="280" height="140" class="highlight" rx="5"/>
  <text x="550" y="130" class="box-title" text-anchor="middle">2. Statistical Analysis</text>
  <text x="550" y="155" class="box-text" text-anchor="middle">Statistical Packages</text>
  <text x="550" y="180" class="tool-text" text-anchor="middle">• SAS (1976)</text>
  <text x="550" y="200" class="tool-text" text-anchor="middle">• SPSS (1968)</text>
  <text x="550" y="220" class="tool-text" text-anchor="middle">• S Language (1976)</text>

  <!-- Arrow 2 -->
  <line x1="690" y1="170" x2="770" y2="170" stroke="#7f8c8d" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="730" y="150" class="arrow-text" text-anchor="middle">output</text>

  <!-- Step 3: Text Processing -->
  <rect x="770" y="100" width="380" height="140" class="highlight" rx="5"/>
  <text x="960" y="130" class="box-title" text-anchor="middle">3. Document Preparation</text>
  <text x="960" y="155" class="box-text" text-anchor="middle">Unix Text Processing Tools</text>
  <text x="850" y="180" class="tool-text" text-anchor="start">• troff/nroff (1973)</text>
  <text x="850" y="200" class="tool-text" text-anchor="start">• TeX (1978) / LaTeX (1984)</text>
  <text x="850" y="220" class="tool-text" text-anchor="start">• vi/emacs editors</text>

  <!-- Terminal Example Box -->
  <rect x="50" y="280" width="540" height="200" class="terminal-box" rx="5"/>
  <text x="320" y="305" class="terminal-text" text-anchor="middle" font-weight="bold">$ cat example.txt | tbl | eqn | troff -ms | lpr</text>
  <line x1="60" y1="315" x2="580" y2="315" stroke="#00ff00" stroke-width="1"/>

  <text x="70" y="345" class="terminal-text" text-anchor="start">.TL</text>
  <text x="70" y="365" class="terminal-text" text-anchor="start">Statistical Analysis Report</text>
  <text x="70" y="385" class="terminal-text" text-anchor="start">.AU</text>
  <text x="70" y="405" class="terminal-text" text-anchor="start">Data Science Team</text>
  <text x="70" y="425" class="terminal-text" text-anchor="start">.PP</text>
  <text x="70" y="445" class="terminal-text" text-anchor="start">Results show significant correlation...</text>
  <text x="70" y="465" class="terminal-text" text-anchor="start">.EQ</text>

  <!-- LaTeX Example Box -->
  <rect x="610" y="280" width="540" height="200" class="terminal-box" rx="5"/>
  <text x="880" y="305" class="terminal-text" text-anchor="middle" font-weight="bold">$ latex report.tex &amp;&amp; dvips report.dvi</text>
  <line x1="620" y1="315" x2="1140" y2="315" stroke="#00ff00" stroke-width="1"/>

  <text x="630" y="345" class="terminal-text" text-anchor="start">\documentclass{article}</text>
  <text x="630" y="365" class="terminal-text" text-anchor="start">\begin{document}</text>
  <text x="630" y="385" class="terminal-text" text-anchor="start">\title{Statistical Analysis}</text>
  <text x="630" y="405" class="terminal-text" text-anchor="start">\section{Results}</text>
  <text x="630" y="425" class="terminal-text" text-anchor="start">$\bar{x} = \sum_{i=1}^{n} x_i / n$</text>
  <text x="630" y="445" class="terminal-text" text-anchor="start">\end{document}</text>
  <text x="630" y="465" class="terminal-text" text-anchor="start">This is TeX, Version 3.14159...</text>

  <!-- Step 4: Output -->
  <rect x="50" y="520" width="340" height="120" class="box" rx="5"/>
  <text x="220" y="550" class="box-title" text-anchor="middle">4. Physical Output</text>
  <text x="220" y="580" class="tool-text" text-anchor="middle">• Line Printer (ASCII)</text>
  <text x="220" y="600" class="tool-text" text-anchor="middle">• Dot Matrix Printer</text>
  <text x="220" y="620" class="tool-text" text-anchor="middle">• Phototypesetter</text>

  <!-- Step 5: Distribution -->
  <rect x="430" y="520" width="340" height="120" class="box" rx="5"/>
  <text x="600" y="550" class="box-title" text-anchor="middle">5. Distribution</text>
  <text x="600" y="580" class="box-text" text-anchor="middle">Physical Copy Distribution</text>
  <text x="600" y="600" class="tool-text" text-anchor="middle">• Internal Mail</text>
  <text x="600" y="620" class="tool-text" text-anchor="middle">• Photocopier</text>

  <!-- Key Characteristics -->
  <rect x="810" y="520" width="340" height="120" class="highlight" rx="5"/>
  <text x="980" y="550" class="box-title" text-anchor="middle">Key Characteristics</text>
  <text x="980" y="575" class="box-text" text-anchor="middle">• Plain Text Source</text>
  <text x="980" y="595" class="box-text" text-anchor="middle">• Batch Processing</text>
  <text x="980" y="615" class="box-text" text-anchor="middle">• Reproducible Pipeline</text>
  <text x="980" y="635" class="box-text" text-anchor="middle">• Version Control (RCS 1982)</text>

  <!-- Bottom Note -->
  <g transform="translate(0, -20)">
    <text x="600" y="690" class="subtitle" text-anchor="middle">Unix Philosophy: "Do One Thing and Do It Well"</text>
    <text x="600" y="715" class="subtitle" text-anchor="middle">Separation: Data → Analysis → Presentation → Output</text>
    <text x="600" y="740" class="subtitle" text-anchor="middle">This workflow laid the foundation for modern reproducible research</text>
  </g>
</svg>