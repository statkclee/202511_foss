<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 20 1200 730" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 28px; font-weight: 600; fill: #111111; }
      .section-title { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 22px; font-weight: 500; fill: #111111; }
      .subsection-title { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 16px; font-weight: 600; fill: #333333; }
      .item-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 14px; fill: #444444; }
      .code-text { font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-size: 13px; fill: #555555; }
      .value-text { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 15px; fill: #333333; }

      .input-section { fill: #F7FBFF; stroke: #4A90E2; stroke-width: 1.5; }
      .output-section { fill: #F6FFF5; stroke: #50B83C; stroke-width: 1.5; }
      .design-section { fill: #FAFAFA; stroke: #999999; stroke-width: 1.5; }
      .extension-section { fill: #FFF9F0; stroke: #F39C12; stroke-width: 1.5; }
      .engine-center { fill: #F8F4FF; stroke: #8E44AD; stroke-width: 2.5; }
      .value-box { fill: #F8F4FF; stroke: #8E44AD; stroke-width: 1.5; }
      .value-title { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 18px; font-weight: 600; fill: #8E44AD; }
      .value-desc { font-family: 'ET Book', 'Palatino Linotype', 'Book Antiqua', Palatino, serif; font-size: 14px; fill: #444444; }

      .connection-line { stroke: #CCCCCC; stroke-width: 1; stroke-dasharray: 3,3; fill: none; }
    </style>

    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#CCCCCC" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#FEFEFE"/>

  <!-- Central Quarto Engine -->
  <g id="quarto-engine">
    <circle cx="600" cy="320" r="110" class="engine-center"/>
    <text x="600" y="305" text-anchor="middle" class="title">Quarto</text>
    <text x="600" y="330" text-anchor="middle" class="section-title">Engine</text>
    <text x="600" y="355" text-anchor="middle" class="item-text" font-style="italic">Universal Document</text>
    <text x="600" y="372" text-anchor="middle" class="item-text" font-style="italic">Publishing System</text>
  </g>

  <!-- Connection lines from center to sections -->
  <line x1="520" y1="260" x2="280" y2="180" class="connection-line" marker-end="url(#arrow)"/>
  <line x1="680" y1="260" x2="920" y2="180" class="connection-line" marker-end="url(#arrow)"/>
  <line x1="520" y1="380" x2="280" y2="490" class="connection-line" marker-end="url(#arrow)"/>
  <line x1="680" y1="380" x2="920" y2="490" class="connection-line" marker-end="url(#arrow)"/>

  <!-- Connection lines from center to core values -->
  <line x1="490" y1="320" x2="320" y2="370" class="connection-line" marker-end="url(#arrow)"/>
  <line x1="600" y1="430" x2="600" y2="455" class="connection-line" marker-end="url(#arrow)"/>
  <line x1="710" y1="320" x2="880" y2="370" class="connection-line" marker-end="url(#arrow)"/>

  <!-- INPUT LAYER (top-left quadrant) -->
  <g id="input-layer">
    <rect x="20" y="30" width="520" height="220" rx="5" class="input-section"/>
    <text x="280" y="60" text-anchor="middle" class="section-title">Input Layer</text>

    <!-- Languages -->
    <g transform="translate(40, 85)">
      <text x="0" y="0" class="subsection-title" fill="#4A90E2">Languages</text>
      <text x="0" y="18" class="item-text">• R - Statistical computing</text>
      <text x="0" y="34" class="item-text">• Python - Data science</text>
      <text x="0" y="50" class="item-text">• Julia - HPC</text>
      <text x="0" y="66" class="item-text">• Observable JS - Interactive vis.</text>
    </g>

    <!-- Content Formats -->
    <g transform="translate(280, 85)">
      <text x="0" y="0" class="subsection-title" fill="#4A90E2">Content Formats</text>
      <text x="0" y="18" class="item-text">• Markdown - Writing</text>
      <text x="0" y="34" class="item-text">• YAML - Metadata</text>
      <text x="0" y="50" class="item-text">• LaTeX - Mathematical notation</text>
      <text x="0" y="66" class="item-text">• BibTeX - Bibliography</text>
    </g>

    <!-- Processing Engines -->
    <g transform="translate(40, 170)">
      <text x="0" y="0" class="subsection-title" fill="#4A90E2">Execution Engines</text>
      <text x="0" y="18" class="item-text">• Knitr - R code execution</text>
      <text x="0" y="34" class="item-text">• Jupyter - Python/Julia execution</text>
      <text x="0" y="50" class="item-text">• Observable - JS execution</text>
      <text x="0" y="66" class="item-text">• Pandoc - Document conversion</text>
    </g>

    <!-- Resources -->
    <g transform="translate(280, 170)">
      <text x="0" y="0" class="subsection-title" fill="#4A90E2">Resources</text>
      <text x="0" y="18" class="item-text">• Images, Videos, Audio</text>
      <text x="0" y="34" class="item-text">• Data files (CSV, JSON)</text>
      <text x="0" y="50" class="item-text">• External references</text>
      <text x="0" y="66" class="item-text">• Custom templates</text>
    </g>
  </g>

  <!-- OUTPUT LAYER (top-right quadrant) -->
  <g id="output-layer">
    <rect x="660" y="30" width="520" height="220" rx="5" class="output-section"/>
    <text x="920" y="60" text-anchor="middle" class="section-title">Output Layer</text>

    <!-- Documents -->
    <g transform="translate(680, 85)">
      <text x="0" y="0" class="subsection-title" fill="#50B83C">Documents</text>
      <text x="0" y="18" class="item-text">• PDF - Print-ready documents</text>
      <text x="0" y="34" class="item-text">• HTML - Web documents</text>
      <text x="0" y="50" class="item-text">• Word - MS Office format</text>
      <text x="0" y="66" class="item-text">• EPUB - E-books</text>
    </g>

    <!-- Presentations -->
    <g transform="translate(920, 85)">
      <text x="0" y="0" class="subsection-title" fill="#50B83C">Presentations</text>
      <text x="0" y="18" class="item-text">• RevealJS - Web slides</text>
      <text x="0" y="34" class="item-text">• PowerPoint - MS slides</text>
      <text x="0" y="50" class="item-text">• Beamer - LaTeX slides</text>
      <text x="0" y="66" class="item-text">• Impress - LibreOffice</text>
    </g>

    <!-- Web Content -->
    <g transform="translate(680, 170)">
      <text x="0" y="0" class="subsection-title" fill="#50B83C">Web Content</text>
      <text x="0" y="18" class="item-text">• Websites - Full sites</text>
      <text x="0" y="34" class="item-text">• Blogs - Article series</text>
      <text x="0" y="50" class="item-text">• Books - Online books</text>
      <text x="0" y="66" class="item-text">• Dashboards - Interactive apps</text>
    </g>

    <!-- Academic -->
    <g transform="translate(920, 170)">
      <text x="0" y="0" class="subsection-title" fill="#50B83C">Academic</text>
      <text x="0" y="18" class="item-text">• Journal articles</text>
      <text x="0" y="34" class="item-text">• Conference papers</text>
      <text x="0" y="50" class="item-text">• Theses &amp; dissertations</text>
      <text x="0" y="66" class="item-text">• Technical reports</text>
    </g>
  </g>

  <!-- DESIGN SYSTEM (bottom-left quadrant) -->
  <g id="design-system" transform="translate(0, 70)">
    <rect x="20" y="445" width="520" height="220" rx="5" class="design-section"/>
    <text x="280" y="475" text-anchor="middle" class="section-title">Design System</text>

    <!-- Themes -->
    <g transform="translate(40, 500)">
      <text x="0" y="0" class="subsection-title" fill="#999999">Themes</text>
      <text x="0" y="18" class="code-text">theme: cosmo, flatly, darkly</text>
      <text x="0" y="33" class="code-text">theme: journal, litera, lumen</text>
      <text x="0" y="48" class="code-text">theme: minty, pulse, sandstone</text>
      <text x="0" y="66" class="item-text">25+ built-in themes</text>
    </g>

    <!-- Custom Styles -->
    <g transform="translate(280, 500)">
      <text x="0" y="0" class="subsection-title" fill="#999999">Custom Styles</text>
      <text x="0" y="18" class="code-text">css: custom.css</text>
      <text x="0" y="33" class="code-text">scss: styles.scss</text>
      <text x="0" y="50" class="item-text">• Full CSS/SCSS support</text>
      <text x="0" y="66" class="item-text">• Variable customization</text>
    </g>

    <!-- Layout Controls -->
    <g transform="translate(40, 590)">
      <text x="0" y="0" class="subsection-title" fill="#999999">Layout Controls</text>
      <text x="0" y="18" class="code-text">page-layout: article</text>
      <text x="0" y="33" class="code-text">grid: sidebar, body, margin</text>
      <text x="0" y="48" class="code-text">toc: true, toc-depth: 3</text>
      <text x="0" y="66" class="item-text">Responsive design</text>
    </g>

    <!-- Branding -->
    <g transform="translate(280, 590)">
      <text x="0" y="0" class="subsection-title" fill="#999999">Branding</text>
      <text x="0" y="18" class="code-text">brand.yml configuration</text>
      <text x="0" y="33" class="item-text">• Color palette</text>
      <text x="0" y="48" class="item-text">• Typography system</text>
      <text x="0" y="66" class="item-text">• Logo &amp; identity</text>
    </g>
  </g>

  <!-- EXTENSIONS (bottom-right quadrant) -->
  <g id="extensions" transform="translate(0, 70)">
    <rect x="660" y="445" width="520" height="220" rx="5" class="extension-section"/>
    <text x="920" y="475" text-anchor="middle" class="section-title">Extensions</text>

    <!-- Filters -->
    <g transform="translate(680, 500)">
      <text x="0" y="0" class="subsection-title" fill="#F39C12">Filters</text>
      <text x="0" y="18" class="item-text">• Pandoc Lua filters</text>
      <text x="0" y="34" class="item-text">• Custom transformations</text>
      <text x="0" y="50" class="item-text">• Content processing</text>
      <text x="0" y="66" class="item-text">• AST manipulation</text>
    </g>

    <!-- Shortcodes -->
    <g transform="translate(920, 500)">
      <text x="0" y="0" class="subsection-title" fill="#F39C12">Shortcodes</text>
      <text x="0" y="18" class="code-text">{{&lt; video url &gt;}}</text>
      <text x="0" y="33" class="code-text">{{&lt; embed notebook &gt;}}</text>
      <text x="0" y="50" class="item-text">• Reusable components</text>
      <text x="0" y="66" class="item-text">• Custom syntax</text>
    </g>

    <!-- Formats -->
    <g transform="translate(680, 590)">
      <text x="0" y="0" class="subsection-title" fill="#F39C12">Custom Formats</text>
      <text x="0" y="18" class="item-text">• Journal templates</text>
      <text x="0" y="34" class="item-text">• Corporate styles</text>
      <text x="0" y="50" class="item-text">• Custom PDF layouts</text>
      <text x="0" y="66" class="item-text">• Specialized outputs</text>
    </g>

    <!-- Projects -->
    <g transform="translate(920, 590)">
      <text x="0" y="0" class="subsection-title" fill="#F39C12">Project Templates</text>
      <text x="0" y="18" class="item-text">• Book projects</text>
      <text x="0" y="34" class="item-text">• Website projects</text>
      <text x="0" y="50" class="item-text">• Manuscript projects</text>
      <text x="0" y="66" class="item-text">• Custom workflows</text>
    </g>
  </g>

  <!-- CORE VALUES (radial around center engine) -->
  <g id="core-values">
    <!-- Integration (left side) -->
    <g transform="translate(0, 50)">
      <rect x="100" y="270" width="200" height="100" rx="4" class="value-box"/>
      <text x="200" y="295" text-anchor="middle" class="value-title">통합</text>
      <text x="200" y="313" text-anchor="middle" class="item-text" font-style="italic">Integration</text>
      <text x="110" y="333" class="value-desc">다중 언어 • 다중 엔진</text>
      <text x="110" y="350" class="value-desc">다중 출력을 하나의</text>
      <text x="110" y="365" class="value-desc">시스템에서 처리</text>
    </g>


    <!-- Reproducibility (bottom center) -->
    <rect x="450" y="455" width="300" height="90" rx="4" class="value-box"/>
    <text x="600" y="480" text-anchor="middle" class="value-title">재현성</text>
    <text x="600" y="498" text-anchor="middle" class="item-text" font-style="italic">Reproducibility</text>
    <text x="600" y="518" text-anchor="middle" class="value-desc">코드 + 데이터 + 설명 = 완전한 투명성</text>
    <text x="600" y="535" text-anchor="middle" class="value-desc">과학적 연구의 검증 가능성 보장</text>

    <!-- Flexibility (right side) -->
    <g transform="translate(0, 50)">
      <rect x="900" y="270" width="200" height="100" rx="4" class="value-box"/>
      <text x="1000" y="295" text-anchor="middle" class="value-title">유연성</text>
      <text x="1000" y="313" text-anchor="middle" class="item-text" font-style="italic">Flexibility</text>
      <text x="910" y="333" class="value-desc">확장 가능</text>
      <text x="910" y="350" class="value-desc">커스터마이징 가능</text>
      <text x="910" y="365" class="value-desc">모든 요구사항 대응</text>
    </g>  
  </g>

</svg>
