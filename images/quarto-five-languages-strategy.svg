<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="750" viewBox="30 60 1000 750" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Posit 선택한 Quarto 5대 핵심 언어 전략">
  <defs>
    <!-- 언어별 그라데이션 -->
    <linearGradient id="quartoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#75AADB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4C9CD1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D7BB8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="sqlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E55A2E;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD43B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3776AB;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#276DC3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#165AA7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="juliaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CB3C33;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#389826;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9558B2;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#4063D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CB3C33;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="observableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    
    <!-- 필터 효과 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="3" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <!-- 화살표 -->
    <marker id="strategyArrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L2,14 L14,8 z" fill="#4C9CD1" />
    </marker>
    
    <!-- 스타일 -->
    <style>
      .title-text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size: 28px; font-weight: bold; fill: #1E293B; }
      .subtitle-text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size: 16px; fill: #64748B; }
      .lang-title { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size: 20px; font-weight: bold; fill: white; }
      .lang-subtitle { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size: 13px; fill: white; opacity: 0.9; }
      .reason-text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size: 12px; fill: #2D3748; font-weight: 500; }
      .strategy-text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size: 16px; fill: #1E40AF; font-weight: bold; }
      .quarto-title { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size: 24px; font-weight: bold; fill: white; }
      .quarto-subtitle { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size: 14px; fill: white; opacity: 0.95; }
      .connection-line { vector-effect: non-scaling-stroke; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>
  
  <!-- 배경 -->
  <rect width="1100" height="800" fill="#F8FAFC" rx="12"/>
  
  <!-- 중앙 Quarto 허브 -->
  <g transform="translate(550, 400)">
    <circle cx="0" cy="0" r="120" fill="url(#quartoGrad)" filter="url(#glow)" stroke="#2D7BB8" stroke-width="4"/>
    <text x="0" y="-15" text-anchor="middle" class="quarto-title">Quarto</text>
    <text x="0" y="10" text-anchor="middle" class="quarto-subtitle">통합 실행 엔진</text>
    <text x="0" y="30" text-anchor="middle" class="quarto-subtitle">knitr + Jupyter + OJS</text>
    
    <!-- Markdown 아이콘 -->
    <g transform="translate(0, -80)">
      <rect x="-15" y="-8" width="50" height="25" rx="4" fill="rgba(255,255,255,0.3)"/>
      <text x="10" y="15" text-anchor="middle" font-family="monospace" font-size="25" fill="white" font-weight="bold">MD</text>
    </g>
  </g>
  
  <!-- SQL - 12시 방향 -->
  <g transform="translate(550, 140)">
    <rect x="-90" y="-50" width="180" height="100" rx="20" fill="url(#sqlGrad)" filter="url(#shadow)" stroke="#E55A2E" stroke-width="3"/>
    
    <!-- 데이터베이스 아이콘 -->
    <g transform="translate(-50, -20)">
      <ellipse cx="0" cy="-8" rx="20" ry="6" fill="rgba(255,255,255,0.9)"/>
      <ellipse cx="0" cy="0" rx="20" ry="6" fill="rgba(255,255,255,0.7)"/>
      <ellipse cx="0" cy="8" rx="20" ry="6" fill="rgba(255,255,255,0.9)"/>
    </g>
    
    <text x="00" y="-15" class="lang-title">SQL</text>
    <text x="-50" y="15" class="lang-subtitle">데이터 추출의 시작점</text>
    <text x="-50" y="30" class="lang-subtitle">모든 분석의 첫 단계</text>
    
    <!-- 연결선 -->
    <path d="M 0 50 L 0 140" class="connection-line" stroke="#4C9CD1" marker-end="url(#strategyArrow)" filter="url(#glow)"/>
  </g>
  
  <!-- Python - 2시 방향 -->
  <g transform="translate(780, 220)">
    <rect x="-90" y="-50" width="180" height="100" rx="20" fill="url(#pythonGrad)" filter="url(#shadow)" stroke="#306998" stroke-width="3"/>
    
    <!-- Python 로고 스타일 아이콘 -->
    <g transform="translate(-50, -20)">
      <rect x="-12" y="-12" width="24" height="24" rx="8" fill="#FFD43B"/>
      <circle cx="-4" cy="-4" r="3" fill="#3776AB"/>
      <circle cx="4" cy="4" r="3" fill="#3776AB"/>
    </g>
    
    <text x="-20" y="-15" class="lang-title">파이썬</text>
    <text x="-50" y="15" class="lang-subtitle">AI/ML의 사실상 표준</text>
    <text x="-50" y="30" class="lang-subtitle">거대한 생태계</text>
    
    <!-- 연결선 -->
    <path d="M -60 30 L -130 120" class="connection-line" stroke="#4C9CD1" marker-end="url(#strategyArrow)" filter="url(#glow)"/>
  </g>
  
  <!-- R - 4시 방향 -->
  <g transform="translate(780, 580)">
    <rect x="-90" y="-50" width="180" height="100" rx="20" fill="url(#rGrad)" filter="url(#shadow)" stroke="#165AA7" stroke-width="3"/>
    
    <!-- R 로고 -->
    <g transform="translate(-50, -20)">
      <circle cx="0" cy="0" r="15" fill="rgba(255,255,255,0.9)" stroke="#165AA7" stroke-width="3"/>
      <text x="0" y="6" text-anchor="middle" font-family="serif" font-size="18" font-weight="bold" fill="#165AA7">R</text>
    </g>
    
    <text x="00" y="-15" class="lang-title">R</text>
    <text x="-50" y="15" class="lang-subtitle">Posit 뿌리</text>
    <text x="-50" y="30" class="lang-subtitle">통계 분석 표준</text>
    
    <!-- 연결선 -->
    <path d="M -60 -30 L -130 -120" class="connection-line" stroke="#4C9CD1" marker-end="url(#strategyArrow)" filter="url(#glow)"/>
  </g>
  
  <!-- Julia - 8시 방향 -->
  <g transform="translate(320, 580)">
    <rect x="-90" y="-50" width="180" height="100" rx="20" fill="url(#juliaGrad)" filter="url(#shadow)" stroke="#CB3C33" stroke-width="3"/>
    
    <!-- Julia 색상점들 -->
    <g transform="translate(-50, -20)">
      <circle cx="-8" cy="-8" r="4" fill="#CB3C33"/>
      <circle cx="8" cy="-8" r="4" fill="#389826"/>
      <circle cx="-8" cy="8" r="4" fill="#9558B2"/>
      <circle cx="8" cy="8" r="4" fill="#4063D8"/>
    </g>
    
    <text x="-20" y="-15" class="lang-title">Julia</text>
    <text x="-50" y="15" class="lang-subtitle">고성능 과학 계산</text>
    <text x="-50" y="30" class="lang-subtitle">두 언어 문제 해결</text>
    
    <!-- 연결선 -->
    <path d="M 60 -30 L 130 -120" class="connection-line" stroke="#4C9CD1" marker-end="url(#strategyArrow)" filter="url(#glow)"/>
  </g>
  
  <!-- Observable JS - 10시 방향 -->
  <g transform="translate(320, 220)">
    <rect x="-90" y="-50" width="180" height="100" rx="20" fill="url(#observableGrad)" filter="url(#shadow)" stroke="#1F2937" stroke-width="3"/>
    
    <!-- Observable 로고 스타일 -->
    <g transform="translate(-75, -20)">
      <circle cx="0" cy="0" r="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="rgba(255,255,255,0.8)"/>
    </g>
    
    <text x="-55" y="-15" class="lang-title" fill="white">Observable JS</text>
    <text x="-50" y="15" class="lang-subtitle">웹 인터랙티브 시각화</text>
    <text x="-50" y="30" class="lang-subtitle">D3 생태계 통합</text>
    
    <!-- 연결선 -->
    <path d="M 60 30 L 130 120" class="connection-line" stroke="#4C9CD1" marker-end="url(#strategyArrow)" filter="url(#glow)"/>
  </g>
  
  <!-- Posit 전략 설명 박스 -->
  <g transform="translate(550, 720)">
    <rect x="-450" y="-80" width="870" height="120" rx="15" fill="rgba(30, 64, 175, 0.05)" stroke="#1E40AF" stroke-width="2" stroke-dasharray="8,4"/>
    
    <text x="-50" y="-55" text-anchor="middle" class="strategy-text" font-size="24">Posit 5대 언어 전략적 선택 이유</text>
    
    <g transform="translate(-400, -20)">
      <text x="-40" y="0" class="reason-text">🎯 <tspan font-weight="bold">완전한 워크플로우 커버리지</tspan>: SQL(추출) → R/Python(분석) → Julia(계산) → OJS(시각화)</text>
      <text x="-40" y="20" class="reason-text">🤝 <tspan font-weight="bold">언어 전쟁 종식</tspan>: "R vs Python" 대신 "R + Python + 3개 언어"로 패러다임 전환</text>
      <text x="-40" y="40" class="reason-text">💎 <tspan font-weight="bold">각 언어 최강점만 활용</tspan>: 언어별 고유 장점을 극대화하는 역할 분담</text>
      <text x="400" y="20" class="reason-text">🔮 <tspan font-weight="bold">미래 지향적 선택</tspan>: 현재 표준(R/Python)과 미래 표준(Julia/OJS) 동시 지원</text>
      <text x="400" y="40" class="reason-text">🌐 <tspan font-weight="bold">RStudio → Posit 진화</tspan>: R 회사에서 다중 언어 데이터 과학 플랫폼으로 확장</text>
    </g>
  </g>
  
  <!-- 상단 인사이트 박스 -->
  <g transform="translate(100, 340)">
    <rect x="0" y="0" width="280" height="120" rx="12" fill="rgba(34, 197, 94, 0.05)" stroke="#22C55E" stroke-width="2"/>
    <text x="140" y="25" text-anchor="middle" font-size="17" font-weight="bold" fill="#15803D">핵심 인사이트</text>
    <text x="15" y="50" font-size="12" fill="#15803D">각 언어가 아닌</text>
    <text x="15" y="70" font-size="12" fill="#15803D">"언어들의 조합"이</text>
    <text x="15" y="90" font-size="12" fill="#15803D">데이터 과학의 미래다</text>
    
    <text x="140" y="50" font-size="11" fill="#16A34A">✨ 단일 DSL의 한계 극복</text>
    <text x="140" y="70" font-size="11" fill="#16A34A">🚀 전문성과 생산성 동시 확보</text>
    <text x="140" y="90" font-size="11" fill="#16A34A">🔄 언어 간 원활한 데이터 공유</text>
  </g>
  
  <!-- 우측 미래 전망 -->
  <g transform="translate(750, 340)">
    <rect x="0" y="0" width="220" height="120" rx="12" fill="rgba(168, 85, 247, 0.05)" stroke="#A855F7" stroke-width="2"/>
    <text x="110" y="25" text-anchor="middle" font-size="17" font-weight="bold" fill="#7C3AED">미래 전망</text>
    <text x="15" y="50" font-size="11" fill="#7C3AED">🤖  AI가 언어별 최적 코드 생성</text>
    <text x="15" y="70" font-size="11" fill="#7C3AED">⚡  자동 성능 최적화 (Julia 활용)</text>
    <text x="15" y="90" font-size="11" fill="#7C3AED">🎨  지능형 인터랙티브 대시보드</text>
  </g>
</svg>