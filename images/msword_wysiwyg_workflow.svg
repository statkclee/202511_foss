<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title-text { font-family: monospace; font-size: 46px; font-weight: bold; fill: #2c3e50; }
      .section-title { font-family: monospace; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: monospace; font-size: 18px; font-weight: bold; fill: #555; }
      .desc-text { font-family: monospace; font-size: 15px; fill: #555; }
      .code-text { font-family: 'Courier New', monospace; font-size: 12px; fill: #333; }
      .label-text { font-family: monospace; font-size: 13px; fill: #666; }
      .step-box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 3; }
      .memory-box { fill: #fff3e0; stroke: #e65100; stroke-width: 3; }
      .disk-box { fill: #f3e5f5; stroke: #7b1fa2; stroke-width: 3; }
      .screen-box { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 3; }
    </style>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 12 3, 0 6" fill="#1565c0" />
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 12 3, 0 6" fill="#e65100" />
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 12 3, 0 6" fill="#7b1fa2" />
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 12 3, 0 6" fill="#2e7d32" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#fafafa"/>

  <!-- MS Word Logo -->
  <g transform="translate(50, 20) scale(2.5)">
    <path d="M18.536,2.323V4.868c3.4.019,7.12-.035,10.521.019a.783.783,0,0,1,.912.861c.054,6.266-.013,12.89.032,19.157-.02.4.009,1.118-.053,1.517-.079.509-.306.607-.817.676-.286.039-.764.034-1.045.047-2.792-.014-5.582-.011-8.374-.01l-1.175,0v2.547L2,27.133Q2,16,2,4.873L18.536,2.322" style="fill:#283c82"/><path d="M18.536,5.822h10.5V26.18h-10.5V23.635h8.27V22.363h-8.27v-1.59h8.27V19.5h-8.27v-1.59h8.27V16.637h-8.27v-1.59h8.27V13.774h-8.27v-1.59h8.27V10.911h-8.27V9.321h8.27V8.048h-8.27V5.822" style="fill:#fff"/><path d="M8.573,11.443c.6-.035,1.209-.06,1.813-.092.423,2.147.856,4.291,1.314,6.429.359-2.208.757-4.409,1.142-6.613.636-.022,1.272-.057,1.905-.1-.719,3.082-1.349,6.19-2.134,9.254-.531.277-1.326-.013-1.956.032-.423-2.106-.916-4.2-1.295-6.314C8.99,16.1,8.506,18.133,8.08,20.175q-.916-.048-1.839-.111c-.528-2.8-1.148-5.579-1.641-8.385.544-.025,1.091-.048,1.635-.067.328,2.026.7,4.043.986,6.072.448-2.08.907-4.161,1.352-6.241" style="fill:#fff"/>
  </g>

  <!-- Title -->
  <text x="200" y="50" class="title-text">MS Word WYSIWYG Architecture</text>
  <text x="200" y="85" class="desc-text" font-style="italic">
    How Microsoft Word processes your document from keyboard to screen
  </text>

  <!-- ==================== STEP 1: USER INPUT ==================== -->

  <rect x="50" y="120" width="700" height="140" class="step-box" rx="10"/>
  <text x="400" y="155" class="section-title" text-anchor="middle" fill="#1565c0">
    ⌨️ Step 1: User Input
  </text>
  <line x1="70" y1="165" x2="730" y2="165" stroke="#1565c0" stroke-width="2"/>

  <!-- Keyboard input -->
  <g transform="translate(70, 185)">
    <rect x="0" y="0" width="280" height="60" fill="#fff" stroke="#1565c0" stroke-width="2" rx="5"/>
    <text x="140" y="25" class="desc-text" text-anchor="middle" font-weight="bold">User types:</text>
    <text x="140" y="48" class="desc-text" text-anchor="middle">"Hello <tspan font-weight="bold">World</tspan>!"</text>
  </g>

  <!-- Actions -->
  <g transform="translate(370, 185)">
    <rect x="0" y="0" width="340" height="60" fill="#fff" stroke="#1565c0" stroke-width="2" rx="5"/>
    <text x="170" y="25" class="desc-text" text-anchor="middle" font-weight="bold">User actions:</text>
    <text x="170" y="48" class="desc-text" text-anchor="middle">Select text → Click Bold button</text>
  </g>

  <!-- Arrow down -->
  <line x1="400" y1="260" x2="400" y2="290" stroke="#1565c0" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="420" y="280" class="label-text" fill="#1565c0">Keyboard/Mouse Events</text>

  <!-- ==================== STEP 2: RENDERING ENGINE ==================== -->

  <rect x="50" y="300" width="700" height="240" class="memory-box" rx="10"/>
  <text x="400" y="335" class="section-title" text-anchor="middle" fill="#e65100">
    🧠 Step 2: Rendering Engine (In Memory)
  </text>
  <line x1="70" y1="345" x2="730" y2="345" stroke="#e65100" stroke-width="2"/>

  <!-- Document Object Model -->
  <rect x="70" y="360" width="320" height="165" fill="#fff" stroke="#e65100" stroke-width="2" rx="5"/>
  <text x="230" y="385" class="subtitle-text" text-anchor="middle" fill="#e65100">Document Object Model</text>
  <line x1="85" y1="395" x2="375" y2="395" stroke="#ccc" stroke-width="1"/>

  <g transform="translate(85, 405)">
    <text x="0" y="0" class="label-text" font-weight="bold">In-Memory Structure:</text>
    <rect x="0" y="10" width="290" height="105" fill="#fef5e7" stroke="#e65100" stroke-width="1" rx="3"/>
    <text x="10" y="30" class="code-text">Document {</text>
    <text x="10" y="50" class="code-text">  Paragraph1: {</text>
    <text x="10" y="70" class="code-text">    Text: "Hello "</text>
    <text x="10" y="90" class="code-text">    Run: { text:"World", bold:true }</text>
    <text x="10" y="110" class="code-text">  }</text>
  </g>

  <!-- Formatting Engine -->
  <rect x="410" y="360" width="320" height="165" fill="#fff" stroke="#e65100" stroke-width="2" rx="5"/>
  <text x="570" y="385" class="subtitle-text" text-anchor="middle" fill="#e65100">Formatting Engine</text>
  <line x1="425" y1="395" x2="715" y2="395" stroke="#ccc" stroke-width="1"/>

  <g transform="translate(425, 405)">
    <text x="0" y="0" class="label-text" font-weight="bold">Calculates:</text>
    <text x="10" y="25" class="desc-text" font-size="13">• Font rendering (Arial, 12pt)</text>
    <text x="10" y="48" class="desc-text" font-size="13">• Line breaks &amp; word wrap</text>
    <text x="10" y="71" class="desc-text" font-size="13">• Paragraph spacing</text>
    <text x="10" y="94" class="desc-text" font-size="13">• Page layout &amp; margins</text>
    <text x="10" y="117" class="desc-text" font-size="13">⚡ Real-time calculation!</text>
  </g>

  <!-- Arrow down -->
  <line x1="400" y1="540" x2="400" y2="570" stroke="#e65100" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="420" y="560" class="label-text" fill="#e65100">Renders to screen</text>

  <!-- ==================== STEP 3: SCREEN DISPLAY ==================== -->

  <rect x="50" y="580" width="700" height="280" class="screen-box" rx="10"/>
  <text x="400" y="615" class="section-title" text-anchor="middle" fill="#2e7d32">
    🖥️ Step 3: Screen Display (WYSIWYG!)
  </text>
  <line x1="70" y1="625" x2="730" y2="625" stroke="#2e7d32" stroke-width="2"/>

  <!-- Rendered document -->
  <rect x="120" y="645" width="560" height="200" fill="#fff" stroke="#2e7d32" stroke-width="3" rx="5"/>

  <!-- Document appearance -->
  <g transform="translate(140, 670)">
    <!-- Page visualization -->
    <rect x="0" y="0" width="520" height="160" fill="#ffffff" stroke="#ccc" stroke-width="1"/>

    <!-- Margins guide -->
    <rect x="30" y="20" width="460" height="120" fill="none" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Title area -->
    <text x="260" y="50" class="subtitle-text" text-anchor="middle" font-size="20" font-weight="bold">
      Annual Report 2024
    </text>

    <!-- Body text with formatting -->
    <text x="50" y="85" class="desc-text" font-size="14">
      Hello <tspan font-weight="bold">World</tspan>! This is a sample document.
    </text>

    <text x="50" y="110" class="desc-text" font-size="14">
      You can see <tspan font-style="italic">formatting</tspan> in real-time!
    </text>

    <!-- Cursor -->
    <rect x="278" y="74" width="2" height="16" fill="#000"/>
    <text x="285" y="88" class="label-text" font-size="11" fill="#2e7d32">← Cursor blinks here</text>
  </g>

  <!-- ==================== STEP 4: SAVE TO DISK ==================== -->

  <rect x="820" y="120" width="730" height="310" class="disk-box" rx="10"/>
  <text x="1185" y="155" class="section-title" text-anchor="middle" fill="#7b1fa2">
    💾 Step 4: Save to Disk (Ctrl+S)
  </text>
  <line x1="840" y1="165" x2="1530" y2="165" stroke="#7b1fa2" stroke-width="2"/>

  <!-- When user saves -->
  <rect x="840" y="180" width="690" height="60" fill="#fff" stroke="#7b1fa2" stroke-width="2" rx="5"/>
  <text x="1185" y="210" class="desc-text" text-anchor="middle" font-weight="bold">
    When user clicks Save (or AutoSave triggers):
  </text>
  <text x="1185" y="232" class="desc-text" text-anchor="middle">
    Memory structure → Serialized to Office Open XML format
  </text>

  <!-- Conversion process -->
  <rect x="840" y="255" width="690" height="160" fill="#fff" stroke="#7b1fa2" stroke-width="2" rx="5"/>
  <text x="1185" y="280" class="subtitle-text" text-anchor="middle" fill="#7b1fa2">Serialization Process</text>
  <line x1="860" y1="290" x2="1510" y2="290" stroke="#ccc" stroke-width="1"/>

  <g transform="translate(860, 300)">
    <text x="0" y="20" class="desc-text" font-size="14">1. In-Memory Object Model</text>
    <line x1="20" y1="30" x2="650" y2="30" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <text x="0" y="55" class="desc-text" font-size="14">2. Convert to XML elements and attributes</text>
    <line x1="20" y1="65" x2="650" y2="65" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>

    <text x="0" y="90" class="desc-text" font-size="14">3. Compress multiple XML files into .docx ZIP</text>
    <line x1="20" y1="100" x2="650" y2="100" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrowPurple)"/>
  </g>

  <!-- Arrow to disk -->
  <line x1="1185" y1="430" x2="1185" y2="460" stroke="#7b1fa2" stroke-width="4" marker-end="url(#arrowPurple)"/>

  <!-- File on disk -->
  <rect x="820" y="470" width="730" height="120" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" rx="10"/>
  <text x="1185" y="505" class="section-title" text-anchor="middle" fill="#7b1fa2">
    📁 report.docx on Disk
  </text>
  <line x1="840" y1="515" x2="1530" y2="515" stroke="#7b1fa2" stroke-width="2"/>

  <g transform="translate(840, 530)">
    <text x="345" y="20" class="desc-text" text-anchor="middle">ZIP container with:</text>
    <text x="80" y="45" class="label-text">• document.xml (content)</text>
    <text x="300" y="45" class="label-text">• styles.xml</text>
    <text x="470" y="45" class="label-text">• settings.xml</text>
    <text x="620" y="45" class="label-text">• media/images</text>
  </g>

  <!-- ==================== STEP 5: OPENING FILE ==================== -->

  <rect x="820" y="620" width="730" height="240" class="step-box" rx="10"/>
  <text x="1185" y="655" class="section-title" text-anchor="middle" fill="#1565c0">
    📂 Step 5: Opening Saved File
  </text>
  <line x1="840" y1="665" x2="1530" y2="665" stroke="#1565c0" stroke-width="2"/>

  <!-- Opening process -->
  <g transform="translate(860, 680)">
    <text x="0" y="20" class="desc-text" font-size="14">1. Read .docx file from disk</text>
    <line x1="20" y1="30" x2="630" y2="30" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrowPurple)"/>

    <text x="0" y="55" class="desc-text" font-size="14">2. Unzip and parse XML files</text>
    <line x1="20" y1="65" x2="630" y2="65" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>

    <text x="0" y="90" class="desc-text" font-size="14">3. Rebuild Document Object Model in memory</text>
    <line x1="20" y1="100" x2="630" y2="100" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <text x="0" y="125" class="desc-text" font-size="14">4. Render formatted view on screen → Back to Step 3!</text>
    <line x1="20" y1="135" x2="630" y2="135" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- Key Insight Box -->
  <rect x="70" y="880" width="660" height="1" fill="none"/>
  <rect x="820" y="880" width="710" height="1" fill="none"/>

  <!-- Bottom note -->
  <rect x="50" y="870" width="700" height="25" fill="#fff9c4" stroke="#f57f17" stroke-width="2" rx="5"/>
  <text x="400" y="889" class="desc-text" text-anchor="middle" font-weight="bold">
    💡 The magic: Screen always matches final output (WYSIWYG = What You See Is What You Get)
  </text>

  <rect x="820" y="870" width="730" height="25" fill="#e1f5fe" stroke="#0277bd" stroke-width="2" rx="5"/>
  <text x="1185" y="889" class="desc-text" text-anchor="middle" font-weight="bold">
    ⚠️ Trade-off: Complex internal structure, harder to version control than plain text
  </text>

</svg>
