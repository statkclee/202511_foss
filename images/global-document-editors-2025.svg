<svg viewBox="0 70 1600 970" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Noto Sans KR', sans-serif; font-size: 38px; font-weight: 700; fill: #1e3a8a; }
      .subtitle { font-family: 'Noto Sans KR', sans-serif; font-size: 18px; font-weight: 600; fill: #475569; }
      .region-label { font-family: 'Noto Sans KR', sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; }
      .country { font-family: 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: 600; fill: #1e293b; }
      .status { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 600; fill: #1e293b; }
      .detail { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; fill: #475569; }
      .legend-text { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; fill: #1e293b; }
      .note { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; fill: #64748b; }
      .source { font-family: 'Noto Sans KR', sans-serif; font-size: 11px; fill: #94a3b8; font-style: italic; }
    </style>

    <!-- Product Colors -->
    <linearGradient id="msGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color: #0078d4; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #50e6ff; stop-opacity: 1" />
    </linearGradient>

    <linearGradient id="googleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color: #4285f4; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #34a853; stop-opacity: 1" />
    </linearGradient>

    <linearGradient id="libreGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color: #18a303; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #4ade80; stop-opacity: 1" />
    </linearGradient>
